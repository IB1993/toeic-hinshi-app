<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TOEIC 品詞問題</title>
<link rel="manifest" href="/toeic-hinshi-app/manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/toeic-hinshi-app/icon-192.png">
<style>
:root {
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eff6ff;
  --green:#16a34a; --green-l:#dcfce7;
  --red:#dc2626;   --red-l:#fee2e2;
  --amber:#d97706; --amber-l:#fef9c3;
  --gray:#6b7280;  --gray-l:#f3f4f6;
  --border:#e5e7eb; --text:#111827; --text2:#6b7280;
  --radius:14px; --hdr:54px; --nav:64px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;background:#f1f5f9;color:var(--text);}

#hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);background:var(--blue);color:white;display:flex;align-items:center;padding:0 16px;gap:10px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
#hdr-back{background:none;border:none;color:white;font-size:1.3rem;padding:6px 8px;cursor:pointer;display:none;}
#hdr-title{font-size:1rem;font-weight:700;flex:1;}

#nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + var(--safe));background:white;border-top:1px solid var(--border);display:flex;z-index:100;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;padding-bottom:var(--safe);font-size:.65rem;color:var(--text2);padding-top:8px;}
.nav-btn .ico{font-size:1.4rem;line-height:1;}
.nav-btn.active{color:var(--blue);}

#screens{position:fixed;top:var(--hdr);bottom:calc(var(--nav) + var(--safe));left:0;right:0;overflow:hidden;}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;}
.screen.active{display:block;}

/* HOME */
#home-screen{background:#f1f5f9;}
.hero{background:var(--blue);color:white;padding:18px 16px 22px;}
.hero h2{font-size:1rem;margin-bottom:12px;opacity:.9;}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.hs{background:rgba(255,255,255,.15);border-radius:10px;padding:10px 6px;text-align:center;}
.hs-num{font-size:1.5rem;font-weight:800;}
.hs-lbl{font-size:.62rem;opacity:.85;margin-top:2px;}
.home-sec{padding:14px 14px 4px;}
.home-sec h3{font-size:.75rem;color:var(--text2);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;}
.quick-list{display:flex;flex-direction:column;gap:8px;}
.quick-btn{display:flex;align-items:center;gap:12px;background:white;border:none;border-radius:var(--radius);padding:13px 14px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);width:100%;text-align:left;font-family:inherit;}
.quick-btn:active{opacity:.8;}
.qb-ico{font-size:1.3rem;}
.qb-title{font-size:.9rem;font-weight:700;display:block;}
.qb-sub{font-size:.72rem;color:var(--text2);}
.qb-arrow{margin-left:auto;color:#d1d5db;}
.group-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.gc{background:white;border-radius:var(--radius);padding:13px 12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.gc:active{opacity:.8;}
.gc-icon{font-size:1.5rem;margin-bottom:5px;}
.gc-name{font-size:.85rem;font-weight:700;margin-bottom:3px;}
.gc-count{font-size:.72rem;color:var(--text2);margin-bottom:7px;}
.gc-bar{background:var(--gray-l);border-radius:99px;height:5px;overflow:hidden;margin-bottom:3px;}
.gc-fill{height:100%;border-radius:99px;}
.gc-rate{font-size:.68rem;color:var(--text2);}

/* CATEGORY DETAIL */
#cat-detail{background:#f1f5f9;}
.dh{background:white;padding:13px 16px;border-bottom:1px solid var(--border);}
.dh-name{font-size:1.05rem;font-weight:700;margin-bottom:3px;}
.dh-stats{font-size:.75rem;color:var(--text2);}
.detail-start{margin:12px 14px 4px;background:var(--blue);color:white;border:none;border-radius:12px;padding:14px;font-size:.95rem;font-weight:700;width:calc(100% - 28px);cursor:pointer;font-family:inherit;}
.sub-list{padding:8px 14px 16px;display:flex;flex-direction:column;gap:8px;}
.sub-item{background:white;border-radius:10px;padding:12px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.sub-item:active{opacity:.8;}
.si-info{flex:1;}
.si-name{font-size:.87rem;font-weight:600;margin-bottom:2px;}
.si-count{font-size:.72rem;color:var(--text2);}
.si-badge{padding:3px 10px;border-radius:99px;font-size:.7rem;font-weight:700;}

/* QUIZ */
#quiz-screen{background:#f1f5f9;}
.qz-top{padding:10px 14px 6px;display:flex;align-items:center;gap:10px;}
.qz-track{flex:1;height:4px;background:var(--border);border-radius:99px;overflow:hidden;}
.qz-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .3s;}
.qz-txt{font-size:.75rem;color:var(--text2);white-space:nowrap;}
.qz-badge{font-size:.68rem;padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap;}

.q-card{margin:0 12px 10px;background:white;border-radius:var(--radius);padding:16px 16px 18px;box-shadow:0 2px 8px rgba(0,0,0,.08);position:relative;}
.q-star{position:absolute;top:11px;right:11px;font-size:1.25rem;cursor:pointer;line-height:1;color:#d1d5db;background:none;border:none;padding:4px;transition:color .15s,transform .15s;}
.q-star.on{color:var(--amber);}
.q-star:active{transform:scale(1.3);}
.q-tag{display:inline-block;background:var(--blue-l);color:var(--blue);font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:99px;margin-bottom:10px;margin-right:28px;}
.q-text{font-size:1rem;line-height:1.85;color:var(--text);padding-right:4px;}
.q-blank{display:inline-block;border-bottom:2.5px solid var(--blue);min-width:80px;text-align:center;color:var(--blue);font-weight:700;padding:0 4px;}

/* Hint */
.hint-wrap{margin:0 12px 8px;}
.hint-btn{width:100%;padding:10px 14px;background:#f0f9ff;border:1.5px solid #bae6fd;border-radius:11px;
  font-size:.86rem;font-weight:700;color:#0369a1;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:8px;}
.hint-btn:active{background:#e0f2fe;}
.hint-box{display:none;margin-top:7px;background:#e0f2fe;border-radius:10px;padding:10px 13px;
  font-size:.84rem;line-height:1.7;color:#075985;}

/* Choices */
.choices{padding:0 12px 8px;display:flex;flex-direction:column;gap:8px;}
.c-btn{display:flex;align-items:center;gap:12px;background:white;border:2px solid var(--border);border-radius:12px;padding:14px 15px;cursor:pointer;text-align:left;font-size:.95rem;font-family:inherit;width:100%;transition:border-color .1s,background .1s;}
.c-btn:active:not(:disabled){background:var(--blue-l);border-color:var(--blue);}
.c-key{font-weight:800;font-size:1rem;min-width:22px;color:var(--blue);}
.c-val{flex:1;line-height:1.4;}
.c-btn.ok{border-color:var(--green);background:var(--green-l);}
.c-btn.ng{border-color:var(--red);background:var(--red-l);}
.c-btn.show-ok{border-color:var(--green);background:var(--green-l);}
.c-btn.ok .c-key,.c-btn.show-ok .c-key{color:var(--green);}
.c-btn.ng .c-key{color:var(--red);}
.c-btn.ok::after{content:'✓';margin-left:auto;color:var(--green);font-weight:800;}
.c-btn.ng::after{content:'✗';margin-left:auto;color:var(--red);font-weight:800;}

/* Explanation */
#exp-wrap{margin:0 12px 8px;border-radius:var(--radius);overflow:hidden;max-height:0;opacity:0;transition:max-height .35s ease,opacity .25s ease;}
#exp-wrap.show{max-height:800px;opacity:1;}
.exp-result{padding:12px 16px;font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:8px;}
.exp-result.ok{background:var(--green-l);color:var(--green);}
.exp-result.ng{background:var(--red-l);color:var(--red);}
.exp-ans{padding:10px 16px;background:#f0f9ff;font-size:.85rem;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;border-top:1px solid #bae6fd;}
.exp-ans .al{font-weight:700;color:#0369a1;}
.exp-ans .aw{font-weight:700;color:#0369a1;}
.exp-ans .ao{color:var(--text2);font-size:.75rem;}
.exp-body{padding:13px 16px;background:var(--amber-l);font-size:.85rem;line-height:1.8;color:#451a03;border-top:1px solid #fde68a;}
.exp-lbl{font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--amber);display:block;margin-bottom:5px;}
.exp-body b{color:#92400e;font-weight:800;}
.exp-body .ab{color:#0369a1;font-weight:800;}

#btn-next-wrap{padding:4px 12px 12px;display:none;}
#btn-next{width:100%;padding:15px;background:var(--blue);color:white;border:none;border-radius:13px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;}
#btn-next:active{background:var(--blue-d);}
#btn-skip-wrap{padding:2px 12px 10px;}
#btn-skip{width:100%;padding:11px;background:white;color:var(--text2);border:1.5px solid var(--border);border-radius:11px;font-size:.88rem;cursor:pointer;font-family:inherit;}

/* Finish */
#finish-screen{display:none;position:absolute;inset:0;background:white;overflow-y:auto;z-index:10;}
.fin-inner{display:flex;flex-direction:column;align-items:center;padding:48px 24px 32px;}
.fin-emoji{font-size:3.5rem;margin-bottom:10px;}
.fin-title{font-size:1.2rem;font-weight:800;margin-bottom:4px;}
.fin-score{font-size:3rem;font-weight:800;color:var(--blue);margin:14px 0 2px;}
.fin-rate{font-size:1.2rem;font-weight:700;color:var(--blue);margin-bottom:8px;}
.fin-sub{font-size:.82rem;color:var(--text2);margin-bottom:28px;}
.fin-btns{width:100%;display:flex;flex-direction:column;gap:10px;}
.fb{padding:14px;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;}
.fb-blue{background:var(--blue);color:white;}
.fb-red{background:var(--red-l);color:var(--red);}
.fb-gray{background:var(--gray-l);color:var(--text);}

/* LIST */
#list-screen{background:#f1f5f9;}
.list-top{padding:10px 12px;background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
.list-search{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;background:var(--gray-l);}
.list-search:focus{outline:none;border-color:var(--blue);background:white;}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:6px 13px;border-radius:99px;font-size:.78rem;font-weight:600;border:1.5px solid var(--border);background:white;cursor:pointer;white-space:nowrap;font-family:inherit;}
.chip.on{background:var(--blue);color:white;border-color:var(--blue);}
.list-cnt{padding:7px 14px;font-size:.75rem;color:var(--text2);}
.list-items{padding:0 12px 16px;display:flex;flex-direction:column;gap:8px;}
.li{background:white;border-radius:11px;padding:11px 13px;display:flex;gap:9px;align-items:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.li-star{font-size:1.1rem;cursor:pointer;flex-shrink:0;margin-top:1px;border:none;background:none;padding:0;}
.li-body{flex:1;min-width:0;}
.li-meta{display:flex;gap:5px;align-items:center;margin-bottom:3px;flex-wrap:wrap;}
.li-num{font-size:.7rem;color:var(--text2);}
.li-cat{font-size:.68rem;background:var(--blue-l);color:var(--blue);padding:2px 6px;border-radius:99px;font-weight:600;}
.li-q{font-size:.83rem;color:var(--text);line-height:1.4;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-ans{font-size:.76rem;color:var(--green);font-weight:600;}
.lb{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px;}
.lb-ok{background:var(--green-l);color:var(--green);}
.lb-ng{background:var(--red-l);color:var(--red);}
.lb-no{background:var(--gray-l);color:var(--text2);}

/* STATS */
#stats-screen{background:#f1f5f9;padding:14px 12px;}
.s-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
.s-card{background:white;border-radius:12px;padding:13px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.sc-num{font-size:1.7rem;font-weight:800;color:var(--blue);}
.sc-lbl{font-size:.7rem;color:var(--text2);margin-top:2px;}
.s-sec{font-size:.75rem;color:var(--text2);font-weight:700;letter-spacing:.06em;margin-bottom:8px;}
.cs-item{background:white;border-radius:10px;padding:11px 13px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.cs-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.cs-name{font-size:.86rem;font-weight:700;}
.cs-nums{font-size:.72rem;color:var(--text2);}
.cs-track{height:6px;background:var(--gray-l);border-radius:99px;overflow:hidden;}
.cs-fill{height:100%;border-radius:99px;}
.stats-reset{width:100%;margin-top:14px;padding:12px;background:var(--red-l);color:var(--red);border:none;border-radius:11px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;}

  50% { transform: scale(1.05); }
}
#ios-install-banner {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #1e40af;
  color: white;
  padding: 12px 16px 20px;
  font-size: 13px;
  text-align: center;
  z-index: 9999;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.3);
  line-height: 1.7;
}
#ios-install-banner .ios-close {
  position: absolute;
  top: 8px; right: 12px;
  background: none; border: none;
  color: white; font-size: 18px; cursor: pointer;
}
#ios-install-banner .share-icon {
  display: inline-block;
  width: 18px; height: 18px;
  vertical-align: middle;
  margin: 0 2px;
}

/* Word annotation */
.exp-sentence { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 8px 0; font-size: 0.95rem; line-height: 1.2; }
.wa { display: inline-flex; flex-direction: column; align-items: center; }
.wt { border-bottom: 2px solid #2563eb; padding-bottom: 1px; font-weight: 600; white-space: nowrap; }
.wt-plain { border-bottom: 2px solid #aaa; font-weight: 400; }
.wi { font-size: 0.68rem; color: #1e40af; margin-top: 2px; white-space: nowrap; text-align: center; }
.exp-jp { font-size: 0.85rem; color: #555; margin-top: 6px; padding: 6px 8px; background: #f0f4ff; border-radius: 6px; }
.exp-section { margin-bottom: 12px; }
.exp-sec-title { font-weight: 700; color: #1e3a8a; font-size: 0.9rem; margin-bottom: 4px; }
.exp-sec-body { font-size: 0.88rem; line-height: 1.8; }
.exp-arrow { color: #2563eb; font-weight: 600; }
.exp-ok { color: #16a34a; font-weight: 700; }
.exp-ng { color: #dc2626; font-weight: 700; }
.exp-text { font-size: 0.88rem; line-height: 1.8; }


/* Word annotation */
.exp-sentence { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 8px 0; font-size: 0.95rem; line-height: 1.2; }
.wa { display: inline-flex; flex-direction: column; align-items: center; }
.wt { border-bottom: 2px solid #2563eb; padding-bottom: 1px; font-weight: 600; white-space: nowrap; }
.wt-plain { border-bottom: 2px solid #aaa; font-weight: 400; }
.wi { font-size: 0.68rem; color: #1e40af; margin-top: 2px; white-space: nowrap; text-align: center; }
.exp-jp { font-size: 0.85rem; color: #555; margin-top: 6px; padding: 6px 8px; background: #f0f4ff; border-radius: 6px; }
.exp-section { margin-bottom: 12px; }
.exp-sec-title { font-weight: 700; color: #1e3a8a; font-size: 0.9rem; margin-bottom: 4px; }
.exp-sec-body { font-size: 0.88rem; line-height: 1.8; }
.exp-arrow { color: #2563eb; font-weight: 600; }
.exp-ok { color: #16a34a; font-weight: 700; }
.exp-ng { color: #dc2626; font-weight: 700; }
.exp-text { font-size: 0.88rem; line-height: 1.8; }

</style>
</head>
<body>

<div id="hdr">
  <button id="hdr-back" onclick="goBack()">&#8592;</button>
  <span id="hdr-title">TOEIC 品詞問題</span>
</div>

<div id="screens">

  <!-- HOME -->
  <div class="screen active" id="home-screen">
    <div class="hero">
      <h2>&#128218; 今日も練習しよう！</h2>
      <div class="hero-stats">
        <div class="hs"><div class="hs-num" id="hs-ans">0</div><div class="hs-lbl">回答済み</div></div>
        <div class="hs"><div class="hs-num" id="hs-rate">-%</div><div class="hs-lbl">正解率</div></div>
        <div class="hs"><div class="hs-num" id="hs-star">0</div><div class="hs-lbl">&#11088; チェック</div></div>
      </div>
    </div>
    <div class="home-sec">
      <h3>クイックスタート</h3>
      <div class="quick-list">
        <button class="quick-btn" onclick="quickStart('smart')">
          <span class="qb-ico">&#127381;</span>
          <span><span class="qb-title">おすすめ順で出題</span><span class="qb-sub">未学習 → 不正解 → 正解の順</span></span>
          <span class="qb-arrow">&#8250;</span>
        </button>
        <button class="quick-btn" onclick="quickStart('wrong')">
          <span class="qb-ico">&#128260;</span>
          <span><span class="qb-title">不正解を復習</span><span class="qb-sub" id="qb-wrong">0問</span></span>
          <span class="qb-arrow">&#8250;</span>
        </button>
        <button class="quick-btn" onclick="quickStart('starred')">
          <span class="qb-ico">&#11088;</span>
          <span><span class="qb-title">★チェック問題</span><span class="qb-sub" id="qb-star">0問</span></span>
          <span class="qb-arrow">&#8250;</span>
        </button>
      </div>
    </div>
    <div class="home-sec">
      <h3>カテゴリから選ぶ</h3>
      <div class="group-grid" id="group-grid"></div>
    </div>
    <div style="height:16px"></div>
  </div>

  <!-- CATEGORY DETAIL -->
  <div class="screen" id="cat-detail">
    <div class="dh">
      <div class="dh-name" id="detail-name"></div>
      <div class="dh-stats" id="detail-stats"></div>
    </div>
    <button class="detail-start" onclick="startFromDetail()">このカテゴリをすべて出題（おすすめ順）</button>
    <div class="sub-list" id="sub-list"></div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="quiz-screen">
    <div class="qz-top">
      <div class="qz-track"><div class="qz-fill" id="qz-fill" style="width:0%"></div></div>
      <span class="qz-txt" id="qz-txt">0/0</span>
      <span class="qz-badge" id="qz-badge"></span>
    </div>
    <div class="q-card">
      <button class="q-star" id="q-star" onclick="toggleStar()">&#9734;</button>
      <div class="q-tag" id="q-tag"></div>
      <div class="q-text" id="q-text"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="hint-wrap" id="hint-wrap">
      <button class="hint-btn" id="hint-btn" onclick="showHint()">&#128161; ヒントを見る</button>
      <div class="hint-box" id="hint-box"></div>
    </div>
    <div id="exp-wrap"></div>
    <div id="btn-next-wrap"><button id="btn-next" onclick="nextQ()">次の問題 &#8594;</button></div>
    <div id="btn-skip-wrap"><button id="btn-skip" onclick="skipQ()">スキップ</button></div>
    <div style="height:8px"></div>
    <div id="finish-screen">
      <div class="fin-inner">
        <div class="fin-emoji" id="fin-e">&#127881;</div>
        <div class="fin-title">セット終了！</div>
        <div class="fin-score" id="fin-sc"></div>
        <div class="fin-rate"  id="fin-rt"></div>
        <div class="fin-sub"   id="fin-sb"></div>
        <div class="fin-btns">
          <button class="fb fb-blue" onclick="restartSet()">&#128257; もう一度</button>
          <button class="fb fb-red"  onclick="quickStart('wrong')">&#128260; 不正解を復習</button>
          <button class="fb fb-gray" onclick="switchScreen('home')">&#127968; ホームへ戻る</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LIST -->
  <div class="screen" id="list-screen">
    <div class="list-top">

: "------- Dr. Martin expected his patients to take advantage of the extended office hours, but they actually preferred earlier appointments.", "A": "Although", "B": "In light of", "C": "Despite", "D": "At first", "answer": "D", "answer_word": "At first", "explanation": "but がすでにあり、空所がなくても文が成立しているため、空所には文全体を修飾する副詞が入る。副詞 At first（最初は）が正解。訳：Martin 医師は、延長した診療時間を患者が活用すると最初は期待していたが、実際には彼らは早い時間帯の診察を望んでいた。"}, {"id": 438, "category": "その他", "question": "A recent survey indicates ------- 47 percent of travelers do not get enough sleep on business trips.", "A": "that", "B": "what", "C": "which", "D": "those", "answer": "A", "answer_word": "that", "explanation": "動詞 indicate は直後に that 節を伴い、indicate that S V（SがVすることを示す）の形になる。訳：最近の調査で、47%の旅行者が出張時に十分な睡眠を取っていないことが示されている。"}, {"id": 439, "category": "その他", "question": "All city bus passengers should exit through the rear door, ------- passengers with small children and strollers.", "A": "even though", "B": "furthermore", "C": "in spite of", "D": "except", "answer": "D", "answer_word": "except", "explanation": "空所後は名詞句 passengers with small children and strollers。前の節に名詞句をつなぐ前置詞が必要で、規則に対する例外を表す except（〜を除いて）が正解。訳：市バスの乗客は、幼児連れやベビーカーを持った乗客を除き、後部ドアから降りなければならない。"}, {"id": 440, "category": "その他", "question": "Currently, the Tokyo Central Bank has overseas branches in the UK, Hong Kong, ------- China.", "A": "and", "B": "if", "C": "such", "D": "but", "answer": "A", "answer_word": "and", "explanation": "in the UK, Hong Kong, and China の形で、3つの名詞を並べる並列構造を作る。等位接続詞 and が正解。訳：現在、東京中央銀行はイギリス、香港、中国に海外支店がある。"}, {"id": 441, "category": "その他", "question": "Apple Hills residents are encouraged to renew their driver's licenses online ------- they have already expired.", "A": "whether", "B": "so", "C": "unless", "D": "due to", "answer": "C", "answer_word": "unless", "explanation": "空所後は節なので、接続詞が必要。文意から「すでに期限が切れていない限り」となる unless が正解。due to は前置詞で、後ろに名詞を伴う。訳：Apple Hills の居住者は、すでに期限が切れていない限り、運転免許証をオンラインで更新するよう勧められている。"}, {"id": 442, "category": "その他", "question": "Jackets are required for club members in the main dining room ------- casual dress is acceptable in all other areas of the club.", "A": "during", "B": "what", "C": "such", "D": "while", "answer": "D", "answer_word": "while", "explanation": "空所の前後にそれぞれ節があるため、節同士をつなぐ接続詞が必要。while（〜である一方）が2つの対照的な内容をつなぐ。訳：クラブのほかの場所では普段着が認められる一方、主食堂ではクラブ会員はジャケットを着用する必要がある。"}, {"id": 443, "category": "その他", "question": "------- she has already proved herself a versatile actress, Helen Kuroshima continues to study to develop her acting style.", "A": "Not only", "B": "Although", "C": "Despite", "D": "Consequently", "answer": "B", "answer_word": "Although", "explanation": "カンマの前後に節があり、2つの節をつなぐ接続詞が必要。Although（〜だけれども）が正解。Despite は同じ意味でも前置詞なので名詞を伴う。訳：すでに多才な女優であることを証明しているが、Helen Kuroshima は演技スタイルを磨くために学び続けている。"}, {"id": 444, "category": "その他", "question": "With the exception of a few pavilions, all are slated for removal or demolition ------- the trade show closes on October 31.", "A": "after", "B": "either", "C": "due to", "D": "during", "answer": "A", "answer_word": "after", "explanation": "空所前後がともに節なので、2つの節をつなぐ接続詞が必要。after（〜したあとで）が正解。due to と during は前置詞で名詞が後ろに続く。訳：展示会が10月31日に終了したあと、いくつかを除いて、すべてのパビリオンは撤去または取り壊しが予定されている。"}, {"id": 445, "category": "その他", "question": "Smile Cable Television offers a variety of movie channels ------- local news and sports.", "A": "always", "B": "in case of", "C": "in addition to", "D": "next", "answer": "C", "answer_word": "in addition to", "explanation": "空所前の節に、空所後の名詞句 local news and sports をつなぐ前置詞が必要。文意から in addition to（〜に加えて）が正解。訳：Smile ケーブルテレビは、地元ニュースとスポーツに加えて、さまざまな映画チャンネルを提供している。"}, {"id": 446, "category": "その他", "question": "Payroll procedure changed ------- the company merged with Olsson Corporation in July.", "A": "when", "B": "soon", "C": "without", "D": "between", "answer": "A", "answer_word": "when", "explanation": "空所の前後がそれぞれ節なので、節同士をつなぐ接続詞が必要。選択肢中、接続詞は when（〜したとき）のみ。訳：7月にその会社が Olsson 社と合併したとき、給与支払いの手続きが変更された。"}, {"id": 447, "category": "その他", "question": "Swallow Airways Flight 990 arrived at HwangBo International Airport on time ------- the adverse weather conditions.", "A": "because", "B": "even though", "C": "now that", "D": "despite", "answer": "D", "answer_word": "despite", "explanation": "空所前は節、後ろは名詞句 the adverse weather conditions なので、名詞句をつなぐ前置詞が必要。despite（〜にもかかわらず）が正解。訳：Swallow 航空990便は、悪天候にもかかわらず、定刻どおり HwangBo 国際空港に到着した。"}, {"id": 448, "category": "その他", "question": "The workshop is expected to be well attended ------- we recommend that you make reservations in advance.", "A": "for", "B": "or", "C": "so", "D": "either", "answer": "C", "answer_word": "so", "explanation": "前半は理由、後半はそれに基づく結論・提案。結果を表す so（だから、したがって）が文意に合う。訳：そのワークショップは参加者が多いことが予想されるので、事前に予約することをお勧めします。"}, {"id": 449, "category": "その他", "question": "It is a good idea to limit your cover letter to a single page ------- that is not specifically indicated in the job advertisement.", "A": "even if", "B": "as though", "C": "rather than", "D": "so that", "answer": "A", "answer_word": "even if", "explanation": "空所の前後の2つの節をつなぐ接続詞が必要。前半「カバーレターを1ページに収めるとよい」と後半「求人広告に具体的に記載されていない」を自然につなぐのは even if（たとえ〜でも）。訳：たとえ求人広告に具体的な記載がなくても、カバーレターを1ページに収めるのはよい考えだ。"}, {"id": 450, "category": "その他", "question": "------- sales have been rising, Western Chemicals has been struggling to maintain a profit.", "A": "If not", "B": "Such as", "C": "Even though", "D": "In case", "answer": "C", "answer_word": "Even though", "explanation": "カンマを挟んだ節と節をつなぐ接続詞が必要。売上は上昇しているが利益維持に苦労している、という逆接の関係なので Even though（〜だけれども）が正解。訳：売上は上昇しているが、Western Chemicals は利益を維持することに苦戦している。"}, {"id": 451, "category": "その他", "question": "Mr. Ikeda had no time to purchase gifts for coworkers ------- his stay in Tokyo.", "A": "when", "B": "also", "C": "during", "D": "while", "answer": "C", "answer_word": "during", "explanation": "空所前は節、後ろは名詞句 his stay in Tokyo なので、名詞句をつなぐ前置詞が必要。during（〜の間）が正解。訳：Ikeda さんは東京滞在中、同僚にお土産を買う時間がなかった。"}, {"id": 452, "category": "その他", "question": "Eastbound Highway 66 was shut down Monday morning ------- icy road conditions.", "A": "while", "B": "in order to", "C": "now that", "D": "due to", "answer": "D", "answer_word": "due to", "explanation": "空所前は節、後ろは名詞句 icy road conditions なので、前置詞が必要。due to（〜のため）が正解。訳：東行きの66号線は月曜の朝、道路凍結のため閉鎖された。"}, {"id": 453, "category": "その他", "question": "Under the new recycling regulations, manufacturers are required to accept old equipment for disposal ------- a customer is purchasing a new item.", "A": "if", "B": "likewise", "C": "nevertheless", "D": "besides", "answer": "A", "answer_word": "if", "explanation": "空所前後は節なので、節同士をつなぐ接続詞が必要。条件を表す if（もし〜ならば）が正解。訳：新しいリサイクル規制では、顧客が新しい商品を購入する場合、製造業者は古い機器を処分のために引き取るよう求められる。"}, {"id": 454, "category": "その他", "question": "------- a short rainy period from March to May, the climate in Red Desert is mostly hot and dry.", "A": "Although", "B": "However", "C": "Except for", "D": "Even if", "answer": "C", "answer_word": "Except for", "explanation": "空所後からカンマまでは名詞句で、カンマ以降が節。名詞句をつなぐ前置詞が必要で、Except for（〜を除いて）が正解。訳：3月から5月までの短い雨期を除いて、Red Desert の気候は主に暑く乾燥している。"}, {"id": 455, "category": "その他", "question": "------- track work for street railways is taking longer than expected, temporary bus services will be available until the work is complete.", "A": "Because", "B": "During", "C": "Should", "D": "Where", "answer": "A", "answer_word": "Because", "explanation": "カンマ前後がどちらも節なので、節同士をつなぐ接続詞が必要。文意が通るのは Because（〜なので）。During は名詞を伴う前置詞、Should は「万が一〜なら」の倒置で使えるが後ろの動詞は原形になる。Where は場所を表すため文意に合わない。訳：路面電車の保線工事が予定より長引いているので、工事が終わるまで臨時バスサービスが利用できる。"}, {"id": 456, "category": "その他", "question": "------- she can spend more time with her family, Emily Gomez decided to change her job.", "A": "Apart from", "B": "So that", "C": "Because of", "D": "Rather than", "answer": "B", "answer_word": "So that", "explanation": "カンマ前後がそれぞれ節なので、節同士をつなぐ接続詞が必要。So that S can do で「Sが〜できるように」という目的を表す。Apart from と Because of は名詞を伴う前置詞、Rather than はこの文では節を伴えない。訳：家族ともっと時間を過ごせるように、Emily Gomez は転職を決めた。"}, {"id": 457, "category": "その他", "question": "Purchases of over $100 should not be made ------- authorization from department heads.", "A": "even", "B": "despite", "C": "unless", "D": "without", "answer": "D", "answer_word": "without", "explanation": "空所後は authorization from department heads という名詞句なので、前の節につなぐ前置詞が必要。without を入れると「部門長の許可なしに」という意味になり文意が通る。despite は「〜にもかかわらず」で文意に合わず、unless は節を伴う接続詞。訳：部門長の許可なしに100ドル以上の購入を行ってはいけない。"}, {"id": 458, "category": "その他", "question": "In the first quarter, the company managed to expand its market share slightly ------- its closest competitor suffered major drop in sales.", "A": "throughout", "B": "whereas", "C": "that", "D": "despite", "answer": "B", "answer_word": "whereas", "explanation": "前後の2つの節をつなぐ接続詞が必要。前半は「市場シェアを拡大した」、後半は「競争相手が売上の大幅減に苦しんだ」で、対照的な内容なので whereas（〜であるのに対して）が正解。throughout と despite は前置詞、that は名詞節を作る接続詞で文意に合わない。訳：第1四半期に、最も近い競争相手が売上の大幅減に苦しんだのに対し、その会社は市場シェアを少し拡大した。"}, {"id": 459, "category": "その他", "question": "Mr. Morozov will complete the expense report and submit it to the accounting office ------- he returns from Shanghai.", "A": "among", "B": "beside", "C": "after", "D": "within", "answer": "C", "answer_word": "after", "explanation": "前後がそれぞれ節なので、節同士をつなぐ接続詞が必要。選択肢中、接続詞として自然に使えるのは after（〜したあとで）。among、beside、within はいずれも前置詞で、後ろには名詞が続く。訳：Morozov さんは上海から戻ったあと、経費報告書を完成させ、会計事務所に提出する。"}, {"id": 460, "category": "その他", "question": "Highland Road has been closed for a week ------- repairs being made to the bridge over Douglas Creek.", "A": "since", "B": "even though", "C": "while", "D": "because of", "answer": "D", "answer_word": "because of", "explanation": "空所後は repairs being made ... という名詞句なので、前の節につなぐ前置詞が必要。道路閉鎖の理由を表すため because of（〜が理由で）が正解。since、even though、while は節を伴う接続詞として使う。訳：Highland 通りは、Douglas 川にかかる橋の補修工事のため、1週間閉鎖されている。"}, {"id": 461, "category": "その他", "question": "Pearl Online will request information such as name, billing address, and credit card number ------- that we can process and fill your order.", "A": "so", "B": "even", from", "answer": "B", "answer_word": "before", "explanation": "空所後は renewing their driver’s license という動名詞句なので、前の節につなぐ前置詞が必要。before doing の形で「〜する前に」となる before が正解。訳：Tanton 市は、75歳以上のすべての運転者に対し、運転免許証を更新する前に視力検査に合格することを求める法律を可決した。"}, {"id": 471, "category": "その他", "question": "------- the book may be understood by non-specialists, the first two chapters provide a detailed introduction.", "A": "In regard to", "B": "Because of", "C": "However", "D": "In order that", "answer": "D", "answer_word": "In order that", "explanation": "カンマ前後の2つの節をつなぐ接続詞が必要。In order that（〜するために）が目的を表し文意に合う。In regard to と Because of は前置詞、However は接続機能のない副詞。訳：専門家でない人にも理解してもらえるよう、その本のはじめの2章は詳細な導入になっている。"}, {"id": 472, "category": "その他", "question": "------- her extensive experience and past successes, Ms. Isohi is expected to be an invaluable asset to our company.", "A": "So", "B": "That", "C": "Given", "D": "Since", "answer": "C", "answer_word": "Given", "explanation": "空所後からカンマまでは名詞句、カンマ後が節なので、名詞句を節につなぐ前置詞が必要。Given（〜を考慮すると）が文意に合う。Since は「〜以来」などで使うが、この文では自然でない。訳：豊富な経験と過去の成功を考えると、Isohi さんはわが社にとってかけがえのない財産になるだろう。"}, {"id": 473, "category": "その他", "question": "The fun run will be postponed until March 23 ------- the weather clears up by Friday.", "A": "unless", "B": "however", "C": "because of", "D": "so that", "answer": "A", "answer_word": "unless", "explanation": "前後の節をつなぐ接続詞が必要。空所後は「金曜日までに天気が回復する」という延期しないための例外条件なので、unless（〜しない限り）が正解。訳：市民マラソンは、金曜日までに天気が回復しない限り、3月23日まで延期される。"}, {"id": 474, "category": "その他", "question": "Due to excessive requests for support, GeoMax Technologies has decided to remove a map application from its mobile phones, ------- the product's popularity.", "A": "although", "B": "notwithstanding", "C": "however", "D": "even", "answer": "B", "answer_word": "notwithstanding", "explanation": "空所後は the product’s popularity という名詞句なので、前置詞が必要。notwithstanding（〜にもかかわらず）が文意に合う。although は接続詞、however と even は副詞。訳：サポートのリクエストが多すぎるため、GeoMax Technologies は、その製品の人気にもかかわらず、自社の携帯電話から地図アプリを削除することに決めた          '文法模試 セット4（OCR素案）','文法模試 セット5（OCR素案）','文法模試 セット6（OCR素案）',

];

// ── Storage ──────────────────────────────────────────────
let progress = {}, stars = {};
function load() {
  try { progress = JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); } catch(e) { progress = {}; }
  try { stars    = JSON.parse(localStorage.getItem(STAR_KEY) || '{}'); } catch(e) { stars = {}; }
}
function saveProg()  { localStorage.setItem(PROG_KEY, JSON.stringify(progress)); }
function saveStars() { localStorage.setItem(STAR_KEY, JSON.stringify(stars)); }

// ── Helpers ──────────────────────────────────────────────
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtQ = t => esc(t)
  .replace(/---+/g,'<span class="q-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>')
  .replace(/______+/g,'<span class="q-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
const shuffle = a => a.slice().sort(() => Math.random() - .5);
const groupQs = g => QUESTIONS.filter(q => g.cats.includes(q.category));
function statsFor(qs) {
  const cor = qs.filter(q => progress[q.id] === 'correct').length;
  const wrg = qs.filter(q => progress[q.id] === 'wrong').length;
  const ans = cor + wrg;
  return { total: qs.length, ans, cor, wrg, rate: ans > 0 ? Math.round(cor/ans*100) : 0, pct: Math.round(cor/qs.length*100) };
}

// Smart queue: unanswered → wrong → correct
function buildSmartQueue(pool) {
  return [
    ...shuffle(pool.filter(q => !progress[q.id])),
    ...shuffle(pool.filter(q => progress[q.id] === 'wrong')),
    ...shuffle(pool.filter(q => progress[q.id] === 'correct')),
  ];
}

// Build word lookup: word -> {pos, meaning}
function buildWordLookup(words) {
  if (!words) return {};
  const map = {};
  words.forEach(w => { map[w.w.toLowerCase()] = w; });
  return map;
}

// Annotate a sentence word-by-word using word lookup
function annotateSentence(sentence, wordLookup) {
  // Split keeping punctuation attached to words
  const tokens = sentence.split(/(\s+)/);
  let html = '';
  tokens.forEach(tok => {
    if (/^\s+$/.test(tok)) { html += ' '; return; }
    // Strip punctuation for lookup
    const clean = tok.replace(/[^a-zA-Z\-']/g, '').toLowerCase();
    const info = wordLookup[clean];
    if (info && (info.p || info.m)) {
      html += '<span class="wa"><span class="wt">' + esc(tok) + '</span>' +
              '<span class="wi">(' + esc(info.p) + ') ' + esc(info.m) + '</span></span>';
    } else {
      html += '<span class="wa"><span class="wt wt-plain">' + esc(tok) + '</span></span>';
    }
  });
  return html;
}

// Format 丁寧解説: parse sections, annotate 完成文
function formatExp(text, q) {
  if (!text) return '';
  const wl = buildWordLookup(q.words);
  const hasTeinei = text.includes('■');

  if (!hasTeinei) {
    // 日本語解説: simple formatting
    let s = esc(text);
    const aw = esc(q.answer_word);
    if (aw) s = s.replace(new RegExp(aw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'), '<span class="ab">' + aw + '</span>');
    s = s.replace(/\(([ABCD])\)/g, '(<b>$1</b>)');
    s = s.replace(/「([^」]{1,30})」/g, '「<b>$1</b>」');
    s = s.replace(/【([^】]{1,30})】/g, '【<b>$1</b>】');
    return '<div class="exp-text">' + s.replace(/\n/g,'<br>') + '</div>';
  }

  // 丁寧解説: parse ■ sections
  const sections = text.split(/(■[^\n]+)/);
  let out = '';
  let i = 0;
  while (i < sections.length) {
    const part = sections[i];
    if (part.startsWith('■')) {
      const title = part.trim();
      const body = (sections[i+1] || '').trim();
      i += 2;
      if (title === '■ 完成文' || title === '■完成文') {
        // Extract English sentence (first non-empty line)
        const lines = body.split('\n').map(l => l.trim()).filter(l => l);
        const engLine = lines.find(l => /^[A-Za-z]/.test(l)) || '';
        const jpLine = lines.find(l => /^（/.test(l)) || '';

        out += '<div class="exp-section">';
        out += '<div class="exp-sec-title">■ 完成文</div>';
        out += '<div class="exp-sentence">' + annotateSentence(engLine, wl) + '</div>';
        if (jpLine) out += '<div class="exp-jp">' + esc(jpLine) + '</div>';
        out += '</div>';
      } else {
        // Regular section
        let bodyHtml = esc(body)
          .replace(/\(([ABCD])\)/g, '(<b>$1</b>)')
          .replace(/「([^」]{1,40})」/g, '「<b>$1</b>」')
          .replace(/【([^】]{1,40})】/g, '【<b>$1</b>】')
          .replace(/→([^\n]+)/g, '<span class="exp-arrow">→$1</span>')
          .replace(/○/g, '<span class="exp-ok">○</span>')
          .replace(/×/g, '<span class="exp-ng">×</span>')
          .replace(/\n/g, '<br>');
        // Highlight answer word
        const aw = esc(q.answer_word);
        if (aw) bodyHtml = bodyHtml.replace(new RegExp(aw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'), '<span class="ab">' + aw + '</span>');
        out += '<div class="exp-section"><div class="exp-sec-title">' + esc(title) + '</div><div class="exp-sec-body">' + bodyHtml + '</div></div>';
      }
    } else {
      if (part.trim()) out += '<div class="exp-text">' + esc(part).replace(/\n/g,'<br>') + '</div>';
      i++;
    }
  }
  return out;
}

// Extract hint: first sentence of explanation
function getHint(exp) {
  if (!exp) return '';
  const dot = exp.indexOf('。');
  return dot > 0 && dot < 130 ? exp.substring(0, dot + 1) : exp.substring(0, 95) + '…';
}

// ── Screen switching ─────────────────────────────────────
let curScreen = 'home';
function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id + '-screen').classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const nb = document.getElementById('nav-' + id);
  if (nb) nb.classList.add('active');
  curScreen = id;
  document.getElementById('hdr-back').style.display = 'none';
  const titles = {home:'TOEIC 品詞問題', list:'問題一覧', stats:'成績', quiz:'問題'};
  document.getElementById('hdr-title').textContent = titles[id] || '';
  if (id === 'home')  renderHome();
  if (id === 'list')  renderList();
  if (id === 'stats') renderStats();
  if (id === 'quiz')  document.getElementById('hdr-back').style.display = '';
}
function goBack() {
  if (curScreen === 'quiz' || curScreen === 'cat-detail') switchScreen('home');
}

// ── Home ─────────────────────────────────────────────────
function renderHome() {
  const ans = Object.keys(progress).length;
  const cor = Object.values(progress).filter(v=>v==='correct').length;
  const stc = Object.keys(stars).filter(k=>stars[k]).length;
  const wrg = Object.values(progress).filter(v=>v==='wrong').length;
  document.getElementById('hs-ans').textContent  = ans;
  document.getElementById('hs-rate').textContent = ans > 0 ? Math.round(cor/ans*100)+'%' : '-%';
  document.getElementById('hs-star').textContent = stc;
  document.getElementById('qb-wrong').textContent = wrg + '問';
  document.getElementById('qb-star').textContent  = stc + '問';
  const grid = document.getElementById('group-grid');
  grid.innerHTML = '';
  GROUPS.forEach(g => {
    const st = statsFor(groupQs(g));
    const el = document.createElement('div');
    el.className = 'gc';
    el.style.borderTop = '4px solid ' + g.color;
    el.innerHTML =
      '<div class="gc-icon">' + g.icon + '</div>' +
      '<div class="gc-name">' + g.name + '</div>' +
      '<div class="gc-count">' + st.total + '問・正解 ' + st.cor + '問</div>' +
      '<div class="gc-bar"><div class="gc-fill" style="width:'+st.pct+'%;background:'+g.color+'"></div></div>' +
      '<div class="gc-rate">' + st.rate + '% 正解率</div>';
    el.onclick = () => openDetail(g);
    grid.appendChild(el);
  });
}

// ── Category Detail ──────────────────────────────────────
let curGroup = null;
function openDetail(g) {
  curGroup = g;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('cat-detail').classList.add('active');
  document.getElementById('hdr-title').textContent = g.name;

  document.getElementById('detail-stats').textContent =

  list.innerHTML = '';
  g.cats.forEach(cat => {
    const qs = QUESTIONS.filter(q => q.category === cat);
    if (!qs.length) return;
    const s = statsFor(qs);
    const bgC = s.ans===0?'#f1f5f9':s.rate>=80?'#dcfce7':s.rate>=60?'#fef9c3':'#fee2e2';
    const txC = s.ans===0?'#6b7280':s.rate>=80?'#166534':s.rate>=60?'#854d0e':'#991b1b';

      '<span class="si-badge" style="background:'+bgC+';color:'+txC+'">'+(s.ans===0?'未学習':s.rate+'%')+'</span>' +
      '<span style="color:#d1d5db">&#8250;</span>';
    el.onclick = () => launchQuiz(buildSmartQueue(qs));
    list.appendChild(el);
  });
}
function startFromDetail() {
  if (!curGroup) return;
  launchQuiz(buildSmartQueue(groupQs(curGroup)));
}

// ── Quiz ─────────────────────────────────────────────────
let queue = [], qIdx = 0, answered = false;
let sesCor = 0, sesTot = 0, lastPool = [];
let unaBound = 0, wrgBound = 0;

function quickStart(mode) {
  let pool;
  if (mode === 'smart')    pool = QUESTIONS;
  else if (mode === 'wrong')   pool = QUESTIONS.filter(q => progress[q.id] === 'wrong');
  else if (mode === 'starred') pool = QUESTIONS.filter(q => stars[q.id]);
  if (!pool || !pool.length) { alert('該当する問題がありません'); return; }
  launchQuiz(mode === 'smart' ? buildSmartQueue(pool) : shuffle(pool));
}

function launchQuiz(q) {
  queue = q; qIdx = 0; sesCor = 0; sesTot = 0; lastPool = q;
  unaBound = queue.filter(x => !progress[x.id]).length;
  wrgBound = unaBound + queue.filter(x => progress[x.id] === 'wrong').length;
  document.getElementById('finish-screen').style.display = 'none';
  switchScreen('quiz');
  showQ();
}

function showQ() {
  if (qIdx >= queue.length) { showFinish(); return; }
  const q = queue[qIdx];
  answered = false;

  // Reset UI
  const expWrap = document.getElementById('exp-wrap');
  expWrap.classList.remove('show');
  expWrap.innerHTML = '';
  document.getElementById('btn-next-wrap').style.display = 'none';
  document.getElementById('btn-skip-wrap').style.display = 'block';
  document.getElementById('finish-screen').style.display = 'none';

  // Reset hint
  document.getElementById('hint-wrap').style.display = '';
  document.getElementById('hint-btn').style.display = '';
  const hBox = document.getElementById('hint-box');
  hBox.style.display = 'none';
  hBox.textContent = '';

  // Progress
  const pct = Math.round(qIdx / queue.length * 100);
  document.getElementById('qz-fill').style.width = pct + '%';
  document.getElementById('qz-txt').textContent = (qIdx+1) + ' / ' + queue.length;
  const badge = document.getElementById('qz-badge');
  if (qIdx < unaBound)       { badge.textContent='未学習'; badge.style.cssText='font-size:.68rem;padding:2px 8px;border-radius:99px;font-weight:700;background:var(--blue-l);color:var(--blue)'; }
  else if (qIdx < wrgBound)  { badge.textContent='復習';   badge.style.cssText='font-size:.68rem;padding:2px 8px;border-radius:99px;font-weight:700;background:var(--red-l);color:var(--red)'; }
  else                       { badge.textContent='確認';   badge.style.cssText='font-size:.68rem;padding:2px 8px;border-radius:99px;font-weight:700;background:var(--green-l);color:var(--green)'; }

  const g = catToGroup[q.category];
  document.getElementById('q-tag').textContent  = g ? g.name : q.category;
  document.getElementById('q-text').innerHTML   = fmtQ(q.question);
  renderStarBtn(q.id);

  const choices = document.getElementById('choices');
  choices.innerHTML = '';
  ['A','B','C','D'].forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'c-btn';
    btn.innerHTML = '<span class="c-key">'+key+'</span><span class="c-val">'+esc(q[key])+'</span>';
    btn.onclick = () => checkAnswer(q, key);
    choices.appendChild(btn);
  });

  document.getElementById('quiz-screen').scrollTo({top:0, behavior:'smooth'});
}

function showHint() {
  const q = queue[qIdx];
  if (!q) return;
  document.getElementById('hint-btn').style.display = 'none';
  const box = document.getElementById('hint-box');
  box.textContent = getHint(q.explanation);
  box.style.display = 'block';
}

function checkAnswer(q, sel) {
  if (answered) return;
  answered = true;
  const ok = sel === q.answer;
  progress[q.id] = ok ? 'correct' : 'wrong';
  saveProg();
  sesCor += ok ? 1 : 0;
  sesTot++;

  document.querySelectorAll('.c-btn').forEach((b, i) => {
    const key = ['A','B','C','D'][i];
    b.disabled = true;
    if (key === q.answer) b.classList.add(ok && key === sel ? 'ok' : 'show-ok');
    if (key === sel && !ok) b.classList.add('ng');
  });

  // Hide hint, show explanation
  document.getElementById('hint-wrap').style.display = 'none';

  const expWrap = document.getElementById('exp-wrap');
  expWrap.innerHTML =
    '<div class="exp-result '+(ok?'ok':'ng')+'">'+(ok?'&#9989; 正解！':'&#10060; 不正解')+'</div>' +
    '<div class="exp-ans"><span class="al">正答:</span><span class="aw">('+q.answer+') '+esc(q.answer_word)+'</span>' +
    '<span class="ao">(A)'+esc(q.A)+'&nbsp;(B)'+esc(q.B)+'&nbsp;(C)'+esc(q.C)+'&nbsp;(D)'+esc(q.D)+'</span></div>' +
    '<div class="exp-body"><span class="exp-lbl">&#128218; 解説</span>'+formatExp(q.explanation, q)+'</div>';

  requestAnimationFrame(() => expWrap.classList.add('show'));

  document.getElementById('btn-next-wrap').style.display = 'block';
  document.getElementById('btn-skip-wrap').style.display = 'none';

  setTimeout(() => expWrap.scrollIntoView({behavior:'smooth', block:'nearest'}), 150);
  renderHome();
}

function nextQ() { qIdx++; showQ(); }
function skipQ() { queue.splice(qIdx, 1); showQ(); }

// ── Star ─────────────────────────────────────────────────
function toggleStar() {
  if (qIdx >= queue.length) return;
  const id = queue[qIdx].id;
  stars[id] = !stars[id];
  if (!stars[id]) delete stars[id];
  saveStars();
  renderStarBtn(id);
}
function renderStarBtn(id) {
  const btn = document.getElementById('q-star');
  btn.innerHTML = stars[id] ? '&#9733;' : '&#9734;';
  btn.className = 'q-star' + (stars[id] ? ' on' : '');
}
function toggleListStar(id, el) {
  stars[id] = !stars[id];
  if (!stars[id]) delete stars[id];
  saveStars();
  el.innerHTML = stars[id] ? '&#9733;' : '&#9734;';
  el.style.color = stars[id] ? '#d97706' : '#d1d5db';
}

// ── Finish ───────────────────────────────────────────────
function showFinish() {
  const fin = document.getElementById('finish-screen');
  fin.style.display = '';
  const rate = sesTot > 0 ? Math.round(sesCor/sesTot*100) : 0;
  document.getElementById('fin-e').textContent  = rate>=80?'🎉':rate>=60?'😊':'😟';
  document.getElementById('fin-sc').textContent = sesCor + ' / ' + sesTot;
  document.getElementById('fin-rt').textContent = rate + '%';
  const ta = Object.keys(progress).length;
  const tc = Object.values(progress).filter(v=>v==='correct').length;
  document.getElementById('fin-sb').textContent =
    '累計 '+ta+'問回答 ・ 正解率 '+(ta>0?Math.round(tc/ta*100):0)+'%';
  document.getElementById('btn-next-wrap').style.display = 'none';
  document.getElementById('btn-skip-wrap').style.display = 'none';
  fin.scrollTo(0, 0);
}
function restartSet() {
  document.getElementById('finish-screen').style.display = 'none';
  launchQuiz(buildSmartQueue(lastPool));
}

// ── List ─────────────────────────────────────────────────
let listChip = 'all';
function setChip(el, f) {
  listChip = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  renderList();
}
function renderList() {
  const search = (document.getElementById('list-search').value||'').toLowerCase();
  let qs = QUESTIONS;
  if (listChip==='wrong')          qs = qs.filter(q=>progress[q.id]==='wrong');
  else if (listChip==='starred')   qs = qs.filter(q=>stars[q.id]);
  else if (listChip==='unanswered')qs = qs.filter(q=>!progress[q.id]);
  else if (listChip==='correct')   qs = qs.filter(q=>progress[q.id]==='correct');
  if (search) qs = qs.filter(q=>
    q.question.toLowerCase().includes(search)||q.answer_word.toLowerCase().includes(search)||
    (q.A+q.B+q.C+q.D).toLowerCase().includes(search));
  document.getElementById('list-cnt').textContent = qs.length+'件'+(qs.length>200?' (先頭200件)':'');
  const wrap = document.getElementById('list-items');
  wrap.innerHTML = '';
  qs.slice(0,200).forEach(q => {
    const s = progress[q.id];
    const badge = s==='correct'?'<span class="lb lb-ok">&#10003; 正解</span>':
                  s==='wrong'  ?'<span class="lb lb-ng">&#10007; 不正解</span>':
                                '<span class="lb lb-no">未回答</span>';
    const g = catToGroup[q.category];
    const el = document.createElement('div');
    el.className = 'li';
    el.innerHTML =
      '<button class="li-star" onclick="toggleListStar('+q.id+',this)" style="color:'+(stars[q.id]?'#d97706':'#d1d5db')+'">'+(stars[q.id]?'&#9733;':'&#9734;')+'</button>'+
      '<div class="li-body">'+
        '<div class="li-meta"><span class="li-num">#'+q.id+'</span><span class="li-cat">'+(g?g.name:esc(q.category))+'</span>'+badge+'</div>'+
        '<div class="li-q">'+esc(q.question.substring(0,70))+'&#8230;</div>'+
        '<div class="li-ans">正答: ('+q.answer+') '+esc(q.answer_word)+'</div>'+
      '</div>';
    wrap.appendChild(el);
  });
}

// ── Stats ────────────────────────────────────────────────
function renderStats() {
  const tot = QUESTIONS.length;
  const ans = Object.keys(progress).length;
  const cor = Object.values(progress).filter(v=>v==='correct').length;
  const wrg = Object.values(progress).filter(v=>v==='wrong').length;
  const stc = Object.keys(stars).filter(k=>stars[k]).length;
  const sc = (n,l,c) => '<div class="s-card"><div class="sc-num" style="color:'+c+'">'+n+'</div><div class="sc-lbl">'+l+'</div></div>';
  document.getElementById('s-cards').innerHTML =
    sc(tot,'総問題数','#2563eb')+sc(ans,'回答済み','#2563eb')+
    sc(cor,'正解','#16a34a')+sc(wrg,'不正解','#dc2626')+
    sc((ans>0?Math.round(cor/ans*100):0)+'%','正解率','#2563eb')+
    sc(stc,'★チェック','#d97706')+sc(tot-ans,'未回答','#6b7280');
  const list = document.getElementById('cs-list');
  list.innerHTML = '';
  GROUPS.forEach(g => {
    const st = statsFor(groupQs(g));
    const el = document.createElement('div');
    el.className = 'cs-item';
    el.innerHTML =
      '<div class="cs-hdr"><span class="cs-name">'+g.icon+' '+g.name+'</span><span class="cs-nums">'+st.cor+'/'+st.total+'問 ('+st.rate+'%)</span></div>'+
      '<div class="cs-track"><div class="cs-fill" style="width:'+st.pct+'%;background:'+g.color+'"></div></div>';
    list.appendChild(el);
  });
}

function resetAll() {
  if (confirm('すべての進捗と★チェックをリセットしますか？')) {
    progress={}; stars={};
    saveProg(); saveStars();
    renderStats(); renderHome();
    alert('リセットしました');
  }
}

  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var isStandalone = window.navigator.standalone === true;
  var dismissed = localStorage.getItem('ios_banner_dismissed');
  if (isIOS && !isStandalone && !dismissed) {
    document.getElementById('ios-install-banner').style.display = 'block';
  }
  document.querySelector('#ios-install-banner .ios-close').addEventListener('click', function() {
    localStorage.setItem('ios_banner_dismissed', '1');
  });
})();
</script>
</body>
</html>
