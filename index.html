,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Several of the candidates were so highly qualified ______ it was difficult for the personnel director to decide which one to hire.","A":"as","B":"or","C":"ordering","D":"that","answer":"D","answer_word":"that","explanation":"■ 文の骨格\nSeveral of the candidates were so highly qualified ______ it was difficult for the personnel director to decide which one to hire.\n\n■ 空所に入るもの\n前に so があるので、so ... that ...（とても〜なので…）の形になる。\n→ 空所には「so と呼応する接続詞」が必要です。\n\n■ 選択肢の確認\n(A) as … 接続詞・前置詞「〜として」 ×\n(B) or … 等位接続詞「または」 ×\n(C) ordering … 現在分詞「注文している」 ×\n(D) that … 接続詞「〜なので（結果）」 ○\n\n■ 完成文\nSeveral of the candidates were so highly qualified that it was difficult for the personnel director to decide which one to hire.\n（候補者の何人かは非常に優秀だったので、人事部長はどの人を採用するか決めるのが難しかった。）\n\n■ 解き方のポイント\nso＋形容詞＋that＋節。程度と結果を結ぶ定型構文。","words":[{"w":"candidates","p":"名詞","m":"候補者"},{"w":"qualified","p":"形容詞","m":"資格・能力のある"},{"w":"personnel director","p":"名詞","m":"人事部長"},{"w":"hire","p":"動詞","m":"採用する"}]},{"id":607,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Some analysts warn that the value of shares in Mandarin Corporation is poised ______ due to this quarter's expected drop in sales.","A":"fall","B":"to fall","C":"falling","D":"fallen","answer":"B","answer_word":"to fall","explanation":"■ 文の骨格\nSome analysts warn that the value of shares in Mandarin Corporation is poised ______ due to this quarter's expected drop in sales.\n\n■ 空所に入るもの\nbe poised to do（〜する構えだ、今にも〜しそうだ）という形になる。\n→ 空所には「be poised に続く不定詞」が必要です。\n\n■ 選択肢の確認\n(A) fall … 動詞（原形）「下落する」 ×\n(B) to fall … 不定詞「下落しそうだ」 ○\n(C) falling … 現在分詞・動名詞「下落すること」 ×\n(D) fallen … 過去分詞「下落した」 ×\n\n■ 完成文\nSome analysts warn that the value of shares in Mandarin Corporation is poised to fall due to this quarter's expected drop in sales.\n（一部のアナリストは、今四半期の売上減少見込みにより Mandarin 社の株価が下落しそうだと警告している。）\n\n■ 解き方のポイント\nbe poised to do／be about to do＝「今にも〜しようとしている」。","words":[{"w":"analysts","p":"名詞","m":"アナリスト"},{"w":"shares","p":"名詞","m":"株式"},{"w":"poised to","p":"熟語","m":"今にも〜しそうだ"},{"w":"quarter","p":"名詞","m":"四半期"}]},{"id":608,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Crystal Ocean is a non-profit organization which has been committed to ______ of the Greek seas and islands.","A":"conservation","B":"piece","C":"suggestion","D":"cure","answer":"A","answer_word":"conservation","explanation":"■ 文の骨格\nCrystal Ocean is a non-profit organization which has been committed to ______ of the Greek seas and islands.\n\n■ 空所に入るもの\nbe committed to の to は前置詞なので、後ろは名詞。of と結びつく語が必要。\n→ 空所には「前置詞 to の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) conservation … 名詞「保全、保護」 ○\n(B) piece … 名詞「一片、部分」 ×\n(C) suggestion … 名詞「提案」 ×\n(D) cure … 名詞「治療」 ×\n\n■ 完成文\nCrystal Ocean is a non-profit organization which has been committed to conservation of the Greek seas and islands.\n（Crystal Ocean は、ギリシャの海と島々の保全に取り組んできた非営利団体だ。）\n\n■ 解き方のポイント\nbe committed to＋名詞／動名詞。to は前置詞である点が最大のポイント。","words":[{"w":"non-profit organization","p":"名詞","m":"非営利団体"},{"w":"committed to","p":"熟語","m":"〜に取り組んでいる"},{"w":"conservation","p":"名詞","m":"保全"},{"w":"islands","p":"名詞","m":"島々"}]},{"id":609,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Narayan Sharma's newest novel was popular ______ to be translated into six different languages.","A":"likely","B":"enough","C":"well","D":"correctly","answer":"B","answer_word":"enough","explanation":"■ 文の骨格\nNarayan Sharma's newest novel was popular ______ to be translated into six different languages.\n\n■ 空所に入るもの\n形容詞 popular の後ろで、不定詞と結びついて「〜するほど十分に」を表す語が必要。\n→ 空所には「形容詞の後ろに置く副詞」が必要です。\n\n■ 選択肢の確認\n(A) likely … 形容詞・副詞「〜しそうな」 ×\n(B) enough … 副詞「十分に」 ○\n(C) well … 副詞「よく」 ×\n(D) correctly … 副詞「正しく」 ×\n\n■ 完成文\nNarayan Sharma's newest novel was popular enough to be translated into six different languages.\n（Narayan Sharma の最新作の小説は、6か国語に翻訳されるほど人気があった。）\n\n■ 解き方のポイント\nenough は形容詞・副詞の後ろに置く（形容詞＋enough＋to do）。","words":[{"w":"newest","p":"最上級","m":"最新の"},{"w":"popular","p":"形容詞","m":"人気のある"},{"w":"enough to","p":"熟語","m":"〜するのに十分"},{"w":"translated","p":"動詞（過去分詞）","m":"翻訳される"}]},{"id":610,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Mr. Watts will ______ a new advertising manager to replace Ms. Takahashi, who is going to retire at the end of this year.","A":"appoint","B":"conclude","C":"agree","D":"search","answer":"A","answer_word":"appoint","explanation":"■ 文の骨格\nMr. Watts will ______ a new advertising manager to replace Ms. Takahashi, who is going to retire at the end of this year.\n\n■ 空所に入るもの\n目的語 a new advertising manager と結びついて「任命する」を表す動詞が必要。\n→ 空所には「人を目的語に取る他動詞」が必要です。\n\n■ 選択肢の確認\n(A) appoint … 動詞（原形）「任命する」 ○\n(B) conclude … 動詞（原形）「結論づける」 ×\n(C) agree … 動詞（原形）「同意する（自動詞）」 ×\n(D) search … 動詞（原形）「探す（for が必要）」 ×\n\n■ 完成文\nMr. Watts will appoint a new advertising manager to replace Ms. Takahashi, who is going to retire at the end of this year.\n（Watts 氏は、今年末に退職する Takahashi さんの後任として新しい広告部長を任命する。）\n\n■ 解き方のポイント\nappoint＋人＝「〜を任命する」。search は search for の形。","words":[{"w":"appoint","p":"動詞","m":"任命する"},{"w":"advertising manager","p":"名詞","m":"広告部長"},{"w":"replace","p":"動詞","m":"後任になる"},{"w":"retire","p":"動詞","m":"退職する"}]},{"id":611,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"A driver has been sent to pick up Ms. Walters when she ______ at the airport this evening.","A":"arrives","B":"requests","C":"visits","D":"invites","answer":"A","answer_word":"arrives","explanation":"■ 文の骨格\nA driver has been sent to pick up Ms. Walters when she ______ at the airport this evening.\n\n■ 空所に入るもの\n空港での出来事として「到着する」を表す動詞が文意に合う。\n→ 空所には「文意に合う自動詞」が必要です。\n\n■ 選択肢の確認\n(A) arrives … 動詞（三人称単数現在形）「到着する」 ○\n(B) requests … 動詞（三人称単数現在形）「要求する」 ×\n(C) visits … 動詞（三人称単数現在形）「訪れる」 ×\n(D) invites … 動詞（三人称単数現在形）「招待する」 ×\n\n■ 完成文\nA driver has been sent to pick up Ms. Walters when she arrives at the airport this evening.\n（今晩 Walters さんが空港に到着したときに出迎えるため、運転手が派遣されている。）\n\n■ 解き方のポイント\n時を表す副詞節では未来のことも現在形。arrive at＋場所 の形も確認。","words":[{"w":"pick up","p":"熟語","m":"出迎える"},{"w":"arrives","p":"動詞","m":"到着する"},{"w":"airport","p":"名詞","m":"空港"}]},{"id":612,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"In order to secure the contract, Roland Manufacturing has ______ to reduce the price of its proposal by ten percent.","A":"announced","B":"offered","C":"considered","D":"discussed","answer":"B","answer_word":"offered","explanation":"■ 文の骨格\nIn order to secure the contract, Roland Manufacturing has ______ to reduce the price of its proposal by ten percent.\n\n■ 空所に入るもの\n後ろが to 不定詞なので、不定詞を目的語に取れる動詞が必要。\n→ 空所には「不定詞を目的語に取る他動詞」が必要です。\n\n■ 選択肢の確認\n(A) announced … 過去分詞「発表した」 ×\n(B) offered … 過去分詞「申し出た」 ○\n(C) considered … 過去分詞「考慮した（動名詞を取る）」 ×\n(D) discussed … 過去分詞「議論した（他動詞）」 ×\n\n■ 完成文\nIn order to secure the contract, Roland Manufacturing has offered to reduce the price of its proposal by ten percent.\n（契約を確保するため、Roland Manufacturing 社は提案価格を10％引き下げることを申し出た。）\n\n■ 解き方のポイント\noffer to do＝「〜すると申し出る」。consider は動名詞を、discuss は名詞を取る。","words":[{"w":"secure","p":"動詞","m":"確保する"},{"w":"contract","p":"名詞","m":"契約"},{"w":"offered to","p":"熟語","m":"〜すると申し出た"},{"w":"proposal","p":"名詞","m":"提案"}]},{"id":613,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"A well designed brochure with relevant information can help ______ the company's strengths to potential clients.","A":"convey","B":"conveys","C":"conveyed","D":"conveyor","answer":"A","answer_word":"convey","explanation":"■ 文の骨格\nA well designed brochure with relevant information can help ______ the company's strengths to potential clients.\n\n■ 空所に入るもの\nhelp (to) do の形で、help の後ろは原形または to 不定詞になる。\n→ 空所には「help に続く動詞の原形」が必要です。\n\n■ 選択肢の確認\n(A) convey … 動詞（原形）「伝える」 ○\n(B) conveys … 動詞（三人称単数現在形）「伝える」 ×\n(C) conveyed … 動詞の過去形・過去分詞「伝えられた」 ×\n(D) conveyor … 名詞「コンベヤー」 ×\n\n■ 完成文\nA well designed brochure with relevant information can help convey the company's strengths to potential clients.\n（関連情報を載せたよく練られたパンフレットは、見込み客に会社の強みを伝えるのに役立つ。）\n\n■ 解き方のポイント\nhelp＋(to) do。原形不定詞を取る数少ない動詞の1つ。","words":[{"w":"brochure","p":"名詞","m":"パンフレット"},{"w":"relevant","p":"形容詞","m":"関連する"},{"w":"convey","p":"動詞","m":"伝える"},{"w":"potential clients","p":"名詞","m":"見込み客"}]},{"id":614,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"The head of the tourism committee was praised for expertly ______ the relationships between visitors and local residents.","A":"dealing","B":"proceeding","C":"notifying","D":"managing","answer":"D","answer_word":"managing","explanation":"■ 文の骨格\nThe head of the tourism committee was praised for expertly ______ the relationships between visitors and local residents.\n\n■ 空所に入るもの\nfor の後ろで副詞 expertly に修飾され、the relationships を目的語に取る動名詞が必要。\n→ 空所には「前置詞 for の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) dealing … 動名詞「対処すること（with が必要）」 ×\n(B) proceeding … 動名詞「進むこと（自動詞）」 ×\n(C) notifying … 動名詞「通知すること」 ×\n(D) managing … 動名詞「うまく扱うこと」 ○\n\n■ 完成文\nThe head of the tourism committee was praised for expertly managing the relationships between visitors and local residents.\n（観光委員会の委員長は、来訪者と地元住民との関係を巧みに取りまとめたことで称賛された。）\n\n■ 解き方のポイント\ndeal は deal with の形が必要。他動詞かどうかで絞り込む。","words":[{"w":"tourism committee","p":"名詞","m":"観光委員会"},{"w":"praised","p":"動詞（過去分詞）","m":"称賛された"},{"w":"expertly","p":"副詞","m":"巧みに"},{"w":"managing","p":"動名詞","m":"うまく扱うこと"},{"w":"residents","p":"名詞","m":"住民"}]},{"id":615,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Office supplies can be ______ at any time by staff members using the online order form provided on the supplier's Web site.","A":"applied","B":"informed","C":"arrived","D":"requested","answer":"D","answer_word":"requested","explanation":"■ 文の骨格\nOffice supplies can be ______ at any time by staff members using the online order form provided on the supplier's Web site.\n\n■ 空所に入るもの\ncan be の後ろで、office supplies を目的語に取れる他動詞の過去分詞が必要。\n→ 空所には「受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) applied … 過去分詞「適用された」 ×\n(B) informed … 過去分詞「知らされた（人が対象）」 ×\n(C) arrived … 過去分詞「到着した（自動詞）」 ×\n(D) requested … 過去分詞「要求された」 ○\n\n■ 完成文\nOffice supplies can be requested at any time by staff members using the online order form provided on the supplier's Web site.\n（事務用品は、仕入先のウェブサイトにあるオンライン注文フォームを使って、職員がいつでも請求できる。）\n\n■ 解き方のポイント\narrive は自動詞なので受動態にできない。他動詞かどうかを確認する。","words":[{"w":"Office supplies","p":"名詞","m":"事務用品"},{"w":"requested","p":"過去分詞","m":"要求された"},{"w":"order form","p":"名詞","m":"注文フォーム"},{"w":"supplier","p":"名詞","m":"仕入先"}]},{"id":616,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"During her summer break, Ms. Zhao wants to ______ a course on digital marketing at a local university.","A":"register","B":"take","C":"look","D":"enroll","answer":"B","answer_word":"take","explanation":"■ 文の骨格\nDuring her summer break, Ms. Zhao wants to ______ a course on digital marketing at a local university.\n\n■ 空所に入るもの\n目的語 a course と直接結びつく動詞が必要。\n→ 空所には「a course を目的語に取る他動詞」が必要です。\n\n■ 選択肢の確認\n(A) register … 動詞（原形）「登録する（for が必要）」 ×\n(B) take … 動詞（原形）「（授業を）受講する」 ○\n(C) look … 動詞（原形）「見る（at などが必要）」 ×\n(D) enroll … 動詞（原形）「登録する（in が必要）」 ×\n\n■ 完成文\nDuring her summer break, Ms. Zhao wants to take a course on digital marketing at a local university.\n（夏休みの間、Zhao さんは地元の大学でデジタルマーケティングの講座を受講したいと考えている。）\n\n■ 解き方のポイント\ntake a course＝「講座を取る」。register for／enroll in と前置詞の有無で区別する。","words":[{"w":"summer break","p":"名詞","m":"夏休み"},{"w":"take","p":"動詞","m":"受講する"},{"w":"course","p":"名詞","m":"講座"},{"w":"local university","p":"名詞","m":"地元の大学"}]},{"id":617,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"The Green Wood Hotel ______ diners a choice of two restaurants, the Vine Restaurant and the Cottage Kitchen.","A":"recommends","B":"explains","C":"offers","D":"suggests","answer":"C","answer_word":"offers","explanation":"■ 文の骨格\nThe Green Wood Hotel ______ diners a choice of two restaurants, the Vine Restaurant and the Cottage Kitchen.\n\n■ 空所に入るもの\n〈人＋物〉の2目的語を取れる動詞が必要。\n→ 空所には「2つの目的語を取れる動詞」が必要です。\n\n■ 選択肢の確認\n(A) recommends … 動詞（三人称単数現在形）「推薦する（人＋物の語順を取らない）」 ×\n(B) explains … 動詞（三人称単数現在形）「説明する（人＋物の語順を取らない）」 ×\n(C) offers … 動詞（三人称単数現在形）「提供する」 ○\n(D) suggests … 動詞（三人称単数現在形）「提案する（人＋物の語順を取らない）」 ×\n\n■ 完成文\nThe Green Wood Hotel offers diners a choice of two restaurants, the Vine Restaurant and the Cottage Kitchen.\n（Green Wood ホテルは宿泊客に、Vine Restaurant と Cottage Kitchen という2つのレストランの選択肢を提供している。）\n\n■ 解き方のポイント\noffer／give／send は〈人＋物〉の語順が可能。explain／suggest／recommend は不可。","words":[{"w":"offers","p":"動詞","m":"提供する"},{"w":"diners","p":"名詞","m":"食事客"},{"w":"a choice of","p":"熟語","m":"〜の選択肢"},{"w":"restaurants","p":"名詞","m":"レストラン"}]},{"id":618,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Julia Torres, the chief choreographer for the Paul Cooper Dance Theater, is to ______ a lecture and demonstration today at 5:30 P.M.","A":"talk","B":"present","C":"speak","D":"engage","answer":"B","answer_word":"present","explanation":"■ 文の骨格\nJulia Torres, the chief choreographer for the Paul Cooper Dance Theater, is to ______ a lecture and demonstration today at 5:30 P.M.\n\n■ 空所に入るもの\nbe to do の形で、目的語 a lecture and demonstration を直接取れる動詞が必要。\n→ 空所には「a lecture を目的語に取る他動詞」が必要です。\n\n■ 選択肢の確認\n(A) talk … 動詞（原形）「話す（自動詞）」 ×\n(B) present … 動詞（原形）「行う、披露する」 ○\n(C) speak … 動詞（原形）「話す（自動詞）」 ×\n(D) engage … 動詞（原形）「従事する（in が必要）」 ×\n\n■ 完成文\nJulia Torres, the chief choreographer for the Paul Cooper Dance Theater, is to present a lecture and demonstration today at 5:30 P.M.\n（Paul Cooper Dance Theater の主任振付師である Julia Torres が、本日午後5時30分に講演と実演を行う予定だ。）\n\n■ 解き方のポイント\ntalk／speak は自動詞。目的語を直接取れるかどうかで絞る。","words":[{"w":"chief choreographer","p":"名詞","m":"主任振付師"},{"w":"present","p":"動詞","m":"行う、披露する"},{"w":"lecture","p":"名詞","m":"講演"},{"w":"demonstration","p":"名詞","m":"実演"}]},{"id":619,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"When Yellow River Books ______ Edwin Press in September, several divisions of the two publishing companies will be combined.","A":"merges","B":"remains","C":"anticipates","D":"acquires","answer":"D","answer_word":"acquires","explanation":"■ 文の骨格\nWhen Yellow River Books ______ Edwin Press in September, several divisions of the two publishing companies will be combined.\n\n■ 空所に入るもの\n直後に目的語 Edwin Press があるので、前置詞なしで目的語を取れる動詞が必要。\n→ 空所には「目的語を直接取る他動詞」が必要です。\n\n■ 選択肢の確認\n(A) merges … 動詞（三人称単数現在形）「合併する（with が必要）」 ×\n(B) remains … 動詞（三人称単数現在形）「〜のままである」 ×\n(C) anticipates … 動詞（三人称単数現在形）「予期する」 ×\n(D) acquires … 動詞（三人称単数現在形）「買収する」 ○\n\n■ 完成文\nWhen Yellow River Books acquires Edwin Press in September, several divisions of the two publishing companies will be combined.\n（9月に Yellow River Books 社が Edwin Press 社を買収すると、両出版社のいくつかの部門が統合される。）\n\n■ 解き方のポイント\nmerge は merge with の形。acquire は他動詞で直接目的語を取る。","words":[{"w":"acquires","p":"動詞","m":"買収する"},{"w":"divisions","p":"名詞","m":"部門"},{"w":"publishing companies","p":"名詞","m":"出版社"},{"w":"combined","p":"動詞（過去分詞）","m":"統合される"}]},{"id":620,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Following the final class, ______ attendee will be asked to fill out a survey form to evaluate the course material and instructors.","A":"many","B":"each","C":"most","D":"all","answer":"B","answer_word":"each","explanation":"■ 文の骨格\nFollowing the final class, ______ attendee will be asked to fill out a survey form to evaluate the course material and instructors.\n\n■ 空所に入るもの\n直後が単数名詞 attendee なので、単数名詞を修飾できる語が必要。\n→ 空所には「単数名詞を修飾する語」が必要です。\n\n■ 選択肢の確認\n(A) many … 形容詞（複数名詞用）「多くの」 ×\n(B) each … 形容詞（単数名詞用）「それぞれの」 ○\n(C) most … 形容詞（複数名詞用）「大半の」 ×\n(D) all … 形容詞（複数名詞用）「すべての」 ×\n\n■ 完成文\nFollowing the final class, each attendee will be asked to fill out a survey form to evaluate the course material and instructors.\n（最終回の授業のあと、各受講者は教材と講師を評価するアンケート用紙への記入を求められる。）\n\n■ 解き方のポイント\neach／every＋単数名詞。動詞も単数（will be）で受ける。","words":[{"w":"Following","p":"前置詞","m":"〜のあとに"},{"w":"each","p":"形容詞","m":"それぞれの"},{"w":"attendee","p":"名詞","m":"受講者"},{"w":"fill out","p":"熟語","m":"記入する"},{"w":"evaluate","p":"動詞","m":"評価する"}]},{"id":621,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Please direct ______ questions about the new travel expense reimbursement procedure to the accounting manager.","A":"each","B":"every","C":"any","D":"others","answer":"C","answer_word":"any","explanation":"■ 文の骨格\nPlease direct ______ questions about the new travel expense reimbursement procedure to the accounting manager.\n\n■ 空所に入るもの\n直後が複数名詞 questions で、「何でも」を表す語が文意に合う。\n→ 空所には「複数名詞を修飾する語」が必要です。\n\n■ 選択肢の確認\n(A) each … 形容詞（単数名詞用）「それぞれの」 ×\n(B) every … 形容詞（単数名詞用）「すべての（1つずつ）」 ×\n(C) any … 形容詞「いかなる〜も」 ○\n(D) others … 代名詞「ほかの人・物」 ×\n\n■ 完成文\nPlease direct any questions about the new travel expense reimbursement procedure to the accounting manager.\n（新しい出張費精算手続きに関するご質問は、経理部長までお寄せください。）\n\n■ 解き方のポイント\neach／every は単数名詞、any は可算複数・不可算のどちらにも付く。","words":[{"w":"direct","p":"動詞","m":"向ける"},{"w":"any","p":"形容詞","m":"いかなる〜も"},{"w":"reimbursement","p":"名詞","m":"精算、払い戻し"},{"w":"accounting manager","p":"名詞","m":"経理部長"}]},{"id":622,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Many new business opportunities have been discovered as a result of ______ research.","A":"this","B":"most","C":"these","D":"those","answer":"A","answer_word":"this","explanation":"■ 文の骨格\nMany new business opportunities have been discovered as a result of ______ research.\n\n■ 空所に入るもの\n直後が不可算名詞 research なので、単数扱いの指示形容詞が必要。\n→ 空所には「不可算名詞を修飾する指示形容詞」が必要です。\n\n■ 選択肢の確認\n(A) this … 指示形容詞（単数）「この」 ○\n(B) most … 形容詞「大半の」 ×\n(C) these … 指示形容詞（複数）「これらの」 ×\n(D) those … 指示形容詞（複数）「それらの」 ×\n\n■ 完成文\nMany new business opportunities have been discovered as a result of this research.\n（この調査の結果、多くの新しいビジネスチャンスが見つかった。）\n\n■ 解き方のポイント\nresearch／information／advice は不可算。these／those は付けられない。","words":[{"w":"opportunities","p":"名詞","m":"機会、チャンス"},{"w":"discovered","p":"動詞（過去分詞）","m":"見つけられた"},{"w":"as a result of","p":"熟語","m":"〜の結果として"},{"w":"research","p":"名詞","m":"調査、研究"}]},{"id":623,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Of the four downtown parks, Squirrel Green Park is the ______ to the central business district.","A":"closer","B":"close","C":"closest","D":"closely","answer":"C","answer_word":"closest","explanation":"■ 文の骨格\nOf the four downtown parks, Squirrel Green Park is the ______ to the central business district.\n\n■ 空所に入るもの\nthe の後ろで、4つの中で1番であることを表す最上級が必要。\n→ 空所には「最上級の形容詞」が必要です。\n\n■ 選択肢の確認\n(A) closer … 形容詞（比較級）「より近い」 ×\n(B) close … 形容詞（原級）「近い」 ×\n(C) closest … 形容詞（最上級）「最も近い」 ○\n(D) closely … 副詞「密接に」 ×\n\n■ 完成文\nOf the four downtown parks, Squirrel Green Park is the closest to the central business district.\n（中心部の4つの公園のうち、Squirrel Green 公園が中心業務地区に最も近い。）\n\n■ 解き方のポイント\nthe＋最上級。3つ以上の比較では最上級を使う。","words":[{"w":"downtown","p":"形容詞","m":"中心部の"},{"w":"closest","p":"最上級","m":"最も近い"},{"w":"central business district","p":"名詞","m":"中心業務地区"}]},{"id":624,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"The new voice recognition software will make cell phones and other electronic devices ______ more useful to customers.","A":"very","B":"many","C":"too","D":"much","answer":"D","answer_word":"much","explanation":"■ 文の骨格\nThe new voice recognition software will make cell phones and other electronic devices ______ more useful to customers.\n\n■ 空所に入るもの\n比較級 more useful を強調する副詞が必要。\n→ 空所には「比較級を強める副詞」が必要です。\n\n■ 選択肢の確認\n(A) very … 副詞（原級を強める）「とても」 ×\n(B) many … 形容詞「多くの」 ×\n(C) too … 副詞「〜すぎる」 ×\n(D) much … 副詞（比較級を強める）「ずっと」 ○\n\n■ 完成文\nThe new voice recognition software will make cell phones and other electronic devices much more useful to customers.\n（その新しい音声認識ソフトは、携帯電話などの電子機器を顧客にとってずっと便利にする。）\n\n■ 解き方のポイント\n比較級を強めるのは much／far／even／a lot。very は原級を強める。","words":[{"w":"voice recognition","p":"名詞","m":"音声認識"},{"w":"much","p":"副詞","m":"ずっと"},{"w":"useful","p":"形容詞","m":"便利な"},{"w":"devices","p":"名詞","m":"機器"}]},{"id":625,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Mr. Wypych is going to ______ effective teaching methods for children in an online video to be available to subscribers from Friday this week.","A":"proceed","B":"inform","C":"remark","D":"address","answer":"D","answer_word":"address","explanation":"■ 文の骨格\nMr. Wypych is going to ______ effective teaching methods for children in an online video to be available to subscribers from Friday this week.\n\n■ 空所に入るもの\n直後に目的語 effective teaching methods があるので、他動詞が必要。\n→ 空所には「目的語を直接取る他動詞」が必要です。\n\n■ 選択肢の確認\n(A) proceed … 動詞（原形）「進む（自動詞）」 ×\n(B) inform … 動詞（原形）「知らせる（人が目的語）」 ×\n(C) remark … 動詞（原形）「述べる（on が必要）」 ×\n(D) address … 動詞（原形）「取り上げる、論じる」 ○\n\n■ 完成文\nMr. Wypych is going to address effective teaching methods for children in an online video to be available to subscribers from Friday this week.\n（Wypych 氏は、今週金曜から購読者が視聴できるオンライン動画で、子ども向けの効果的な指導法を取り上げる。）\n\n■ 解き方のポイント\naddress は「（問題・テーマを）取り上げる」。inform は〈人＋of／that〉の形。","words":[{"w":"address","p":"動詞","m":"取り上げる"},{"w":"teaching methods","p":"名詞","m":"指導法"},{"w":"subscribers","p":"名詞","m":"購読者"}]},{"id":626,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Customers can place an order ______ the telephone or online, and the company will deliver it within 30 minutes.","A":"either","B":"by","C":"over","D":"but","answer":"C","answer_word":"over","explanation":"■ 文の骨格\nCustomers can place an order ______ the telephone or online, and the company will deliver it within 30 minutes.\n\n■ 空所に入るもの\n電話という手段を表す前置詞が必要。\n→ 空所には「通信手段を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) either … 相関接続詞「どちらか」 ×\n(B) by … 前置詞「〜によって」 ×\n(C) over … 前置詞「〜で（通信手段）」 ○\n(D) but … 等位接続詞「しかし」 ×\n\n■ 完成文\nCustomers can place an order over the telephone or online, and the company will deliver it within 30 minutes.\n（顧客は電話またはオンラインで注文でき、会社は30分以内に届ける。）\n\n■ 解き方のポイント\nover the phone＝「電話で」。by phone（冠詞なし）との形の違いに注意。","words":[{"w":"place an order","p":"熟語","m":"注文する"},{"w":"over the telephone","p":"熟語","m":"電話で"},{"w":"deliver","p":"動詞","m":"届ける"}]},{"id":627,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"The manager preferred Keisuke Honda over ______ qualified applicant, because he was fluent in both Japanese and English.","A":"other","B":"the other","C":"another one","D":"each other","answer":"B","answer_word":"the other","explanation":"■ 文の骨格\nThe manager preferred Keisuke Honda over ______ qualified applicant, because he was fluent in both Japanese and English.\n\n■ 空所に入るもの\n2人の候補者のうち「もう一方の（特定の）応募者」を表す語が必要。\n→ 空所には「2人のうち残り1人を指す表現」が必要です。\n\n■ 選択肢の確認\n(A) other … 形容詞「ほかの（単独では単数名詞に付かない）」 ×\n(B) the other … 形容詞句「もう一方の」 ○\n(C) another one … 代名詞句「もう1人」 ×\n(D) each other … 相互代名詞「お互い」 ×\n\n■ 完成文\nThe manager preferred Keisuke Honda over the other qualified applicant, because he was fluent in both Japanese and English.\n（その候補者は日本語と英語の両方が流暢だったため、部長は Keisuke Honda をもう一方の有資格応募者より高く評価した。）\n\n■ 解き方のポイント\n2つのうち残り1つは the other。3つ以上から不特定の1つは another。","words":[{"w":"preferred","p":"動詞（過去形）","m":"より好んだ"},{"w":"the other","p":"形容詞句","m":"もう一方の"},{"w":"qualified","p":"形容詞","m":"有資格の"},{"w":"fluent","p":"形容詞","m":"流暢な"}]},{"id":628,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Local residents ______ shocked by the news that the town library would be closed by the end of the year.","A":"impressed","B":"considered","C":"seemed","D":"showed","answer":"C","answer_word":"seemed","explanation":"■ 文の骨格\nLocal residents ______ shocked by the news that the town library would be closed by the end of the year.\n\n■ 空所に入るもの\n後ろに形容詞 shocked が続くので、S+V+C の形を取る動詞が必要。\n→ 空所には「補語を取る自動詞」が必要です。\n\n■ 選択肢の確認\n(A) impressed … 動詞（過去形）「感銘を与えた（他動詞）」 ×\n(B) considered … 動詞（過去形）「考えた（他動詞）」 ×\n(C) seemed … 動詞（過去形）「〜のように見えた」 ○\n(D) showed … 動詞（過去形）「示した（他動詞）」 ×\n\n■ 完成文\nLocal residents seemed shocked by the news that the town library would be closed by the end of the year.\n（地元住民は、町の図書館が年末までに閉館するという知らせにショックを受けた様子だった。）\n\n■ 解き方のポイント\nseem／look／appear は補語に形容詞を取る。他動詞は目的語が必要。","words":[{"w":"Local residents","p":"名詞","m":"地元住民"},{"w":"seemed","p":"動詞","m":"〜のように見えた"},{"w":"shocked","p":"形容詞","m":"ショックを受けた"},{"w":"library","p":"名詞","m":"図書館"}]},{"id":629,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"The new quality control procedures have proven ______ more successful than previous methods.","A":"far","B":"very","C":"too","D":"right","answer":"A","answer_word":"far","explanation":"■ 文の骨格\nThe new quality control procedures have proven ______ more successful than previous methods.\n\n■ 空所に入るもの\n比較級 more successful を強調する副詞が必要。\n→ 空所には「比較級を強める副詞」が必要です。\n\n■ 選択肢の確認\n(A) far … 副詞（比較級を強める）「はるかに」 ○\n(B) very … 副詞（原級を強める）「とても」 ×\n(C) too … 副詞「〜すぎる」 ×\n(D) right … 形容詞・副詞「正しい／ちょうど」 ×\n\n■ 完成文\nThe new quality control procedures have proven far more successful than previous methods.\n（新しい品質管理手順は、従来の方法よりはるかに効果的であることが実証された。）\n\n■ 解き方のポイント\nfar／much／even／a lot は比較級を強める。very は原級専用。","words":[{"w":"quality control","p":"名詞","m":"品質管理"},{"w":"proven","p":"動詞（過去分詞）","m":"実証された"},{"w":"far","p":"副詞","m":"はるかに"},{"w":"previous","p":"形容詞","m":"従来の"}]},{"id":630,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"To maintain a quiet reading environment, visitors are required to ______ from using their mobile phones while in the Kanda Library.","A":"avoid","B":"wait","C":"prevent","D":"refrain","answer":"D","answer_word":"refrain","explanation":"■ 文の骨格\nTo maintain a quiet reading environment, visitors are required to ______ from using their mobile phones while in the Kanda Library.\n\n■ 空所に入るもの\n後ろが from doing なので、refrain from doing（〜を控える）の形になる。\n→ 空所には「from と結びつく自動詞」が必要です。\n\n■ 選択肢の確認\n(A) avoid … 動詞（原形）「避ける（from を取らない）」 ×\n(B) wait … 動詞（原形）「待つ（for を取る）」 ×\n(C) prevent … 動詞（原形）「妨げる（人＋from）」 ×\n(D) refrain … 動詞（原形）「控える」 ○\n\n■ 完成文\nTo maintain a quiet reading environment, visitors are required to refrain from using their mobile phones while in the Kanda Library.\n（静かな閲覧環境を保つため、来館者は神田図書館内では携帯電話の使用を控えることが求められる。）\n\n■ 解き方のポイント\nrefrain from doing＝「〜を控える」。avoid は直接動名詞を取る。","words":[{"w":"maintain","p":"動詞","m":"保つ"},{"w":"refrain from","p":"熟語","m":"〜を控える"},{"w":"environment","p":"名詞","m":"環境"},{"w":"mobile phones","p":"名詞","m":"携帯電話"}]},{"id":631,"category":"文法模試 セット1（OCR素案）","question":"You may renew your driver's license 60 days in advance of the date of ______.","A":"expire","B":"expired","C":"expiring","D":"expiration","answer":"D","answer_word":"expiration","explanation":"■ 文の骨格\nYou may renew your driver's license 60 days in advance of the date of ______.\n\n■ 空所に入るもの\nthe date of の後ろは名詞が入る位置。\n→ 空所には「前置詞 of の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) expire … 動詞（原形）「期限が切れる」 ×\n(B) expired … 動詞の過去形・過去分詞「期限が切れた」 ×\n(C) expiring … 現在分詞・動名詞「期限が切れること」 ×\n(D) expiration … 名詞「満了、有効期限」 ○\n\n■ 完成文\nYou may renew your driver's license 60 days in advance of the date of expiration.\n（運転免許証は、有効期限の60日前から更新できる。）\n\n■ 解き方のポイント\n前置詞の直後は名詞。-tion は名詞の目印。","words":[{"w":"renew","p":"動詞","m":"更新する"},{"w":"driver's license","p":"名詞","m":"運転免許証"},{"w":"in advance of","p":"熟語","m":"〜より前に"},{"w":"expiration","p":"名詞","m":"有効期限"}]},{"id":632,"category":"文法模試 セット1（OCR素案）","question":"Ms. Moreau in the PR department worked diligently to ensure that the new portable audio player was well ______.","A":"publicly","B":"publicized","C":"publicizing","D":"publicity","answer":"B","answer_word":"publicized","explanation":"■ 文の骨格\nMs. Moreau in the PR department worked diligently to ensure that the new portable audio player was well ______.\n\n■ 空所に入るもの\nwas well の後ろで、主語 player は「宣伝される」側なので過去分詞が必要。\n→ 空所には「受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) publicly … 副詞「公に」 ×\n(B) publicized … 過去分詞「宣伝された」 ○\n(C) publicizing … 現在分詞・動名詞「宣伝すること」 ×\n(D) publicity … 名詞「広報」 ×\n\n■ 完成文\nMs. Moreau in the PR department worked diligently to ensure that the new portable audio player was well publicized.\n（広報部の Moreau さんは、新しい携帯オーディオプレーヤーがしっかり宣伝されるよう熱心に働いた。）\n\n■ 解き方のポイント\n〈be＋副詞＋空所〉で主語が「される側」なら過去分詞。","words":[{"w":"PR department","p":"名詞","m":"広報部"},{"w":"diligently","p":"副詞","m":"熱心に"},{"w":"publicized","p":"過去分詞","m":"宣伝された"},{"w":"portable","p":"形容詞","m":"携帯型の"}]},{"id":633,"category":"文法模試 セット1（OCR素案）","question":"Tasty Beverage Co. has decided to give a more ______ title to Mr. Takahashi, who has led a successful national campaign.","A":"prestige","B":"prestigious","C":"prestigiously","D":"prestiges","answer":"B","answer_word":"prestigious","explanation":"■ 文の骨格\nTasty Beverage Co. has decided to give a more ______ title to Mr. Takahashi, who has led a successful national campaign.\n\n■ 空所に入るもの\nmore と名詞 title の間にあり、比較級をつくる形容詞が必要。\n→ 空所には「名詞を修飾する形容詞（比較級）」が必要です。\n\n■ 選択肢の確認\n(A) prestige … 名詞「名声、威信」 ×\n(B) prestigious … 形容詞「名誉ある、格上の」 ○\n(C) prestigiously … 副詞「名誉あることに」 ×\n(D) prestiges … 名詞（複数形）「名声」 ×\n\n■ 完成文\nTasty Beverage Co. has decided to give a more prestigious title to Mr. Takahashi, who has led a successful national campaign.\n（Tasty Beverage 社は、全国キャンペーンを成功に導いた Takahashi さんに、より格上の肩書を与えることを決めた。）\n\n■ 解き方のポイント\nmore ＿＿＋名詞 は形容詞の比較級。","words":[{"w":"Beverage","p":"名詞","m":"飲料"},{"w":"prestigious","p":"形容詞","m":"名誉ある"},{"w":"title","p":"名詞","m":"肩書"},{"w":"national campaign","p":"名詞","m":"全国キャンペーン"}]},{"id":634,"category":"文法模試 セット1（OCR素案）","question":"Max Wilson has negotiated ______ a local sporting team to have players wear his company's logo on their uniforms.","A":"upon","B":"toward","C":"into","D":"with","answer":"D","answer_word":"with","explanation":"■ 文の骨格\nMax Wilson has negotiated ______ a local sporting team to have players wear his company's logo on their uniforms.\n\n■ 空所に入るもの\nnegotiate with X（Xと交渉する）という組み合わせになる。\n→ 空所には「negotiate と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) upon … 前置詞「〜の上に」 ×\n(B) toward … 前置詞「〜の方へ」 ×\n(C) into … 前置詞「〜の中へ」 ×\n(D) with … 前置詞「〜と」 ○\n\n■ 完成文\nMax Wilson has negotiated with a local sporting team to have players wear his company's logo on their uniforms.\n（Max Wilson は、選手が自社ロゴをユニフォームに付けるよう地元スポーツチームと交渉してきた。）\n\n■ 解き方のポイント\nnegotiate with／cooperate with／deal with など、with は「相手」を表す。","words":[{"w":"negotiated","p":"動詞（過去分詞）","m":"交渉した"},{"w":"with","p":"前置詞","m":"〜と"},{"w":"sporting team","p":"名詞","m":"スポーツチーム"},{"w":"uniforms","p":"名詞","m":"ユニフォーム"}]},{"id":635,"category":"文法模試 セット1（OCR素案）","question":"Local residents are ______ that Wilcox Castle's 600-year heritage will be preserved for years to come thanks to a generous federal grant.","A":"delight","B":"delighted","C":"delighting","D":"delightful","answer":"B","answer_word":"delighted","explanation":"■ 文の骨格\nLocal residents are ______ that Wilcox Castle's 600-year heritage will be preserved for years to come thanks to a generous federal grant.\n\n■ 空所に入るもの\n主語が「人」で感情を受ける側なので、-ed 形の分詞形容詞が必要。\n→ 空所には「感情を表す過去分詞（人が主語）」が必要です。\n\n■ 選択肢の確認\n(A) delight … 動詞（原形）「喜ばせる」 ×\n(B) delighted … 過去分詞・形容詞「喜んでいる」 ○\n(C) delighting … 現在分詞・形容詞「喜ばせるような」 ×\n(D) delightful … 形容詞「楽しい、愉快な」 ×\n\n■ 完成文\nLocal residents are delighted that Wilcox Castle's 600-year heritage will be preserved for years to come thanks to a generous federal grant.\n（手厚い連邦助成金のおかげで Wilcox 城の600年の遺産が今後も保存されることを、地元住民は喜んでいる。）\n\n■ 解き方のポイント\n人が主語なら -ed、物事が主語なら -ing。be delighted that ... の形。","words":[{"w":"delighted","p":"形容詞","m":"喜んでいる"},{"w":"heritage","p":"名詞","m":"遺産"},{"w":"preserved","p":"動詞（過去分詞）","m":"保存される"},{"w":"federal grant","p":"名詞","m":"連邦助成金"}]},{"id":636,"category":"文法模試 セット1（OCR素案）","question":"______ supplement his income as an art teacher, Mr. Khatri illustrated children's books for various publishers.","A":"As long as","B":"Provided that","C":"Due to","D":"In order to","answer":"D","answer_word":"In order to","explanation":"■ 文の骨格\n______ supplement his income as an art teacher, Mr. Khatri illustrated children's books for various publishers.\n\n■ 空所に入るもの\n空所の後ろが動詞の原形 supplement なので、to 不定詞をつくる語句が必要。\n→ 空所には「目的を表す群不定詞」が必要です。\n\n■ 選択肢の確認\n(A) As long as … 接続詞（群）「〜する限り」 ×\n(B) Provided that … 接続詞（群）「〜という条件で」 ×\n(C) Due to … 群前置詞「〜のため」 ×\n(D) In order to … 群不定詞「〜するために」 ○\n\n■ 完成文\nIn order to supplement his income as an art teacher, Mr. Khatri illustrated children's books for various publishers.\n（美術教師としての収入を補うため、Khatri さんはさまざまな出版社向けに児童書の挿絵を描いた。）\n\n■ 解き方のポイント\nin order to do／so as to do＝「〜するために」。後ろは動詞の原形。","words":[{"w":"In order to","p":"熟語","m":"〜するために"},{"w":"supplement","p":"動詞","m":"補う"},{"w":"income","p":"名詞","m":"収入"},{"w":"illustrated","p":"動詞（過去形）","m":"挿絵を描いた"}]},{"id":637,"category":"文法模試 セット1（OCR素案）","question":"Organizers are ______ trying to find an alternative venue for the product launch but it may be too late.","A":"except","B":"already","C":"still","D":"white","answer":"C","answer_word":"still","explanation":"■ 文の骨格\nOrganizers are ______ trying to find an alternative venue for the product launch but it may be too late.\n\n■ 空所に入るもの\n現在進行形の中に入り、「今もなお」という継続を表す副詞が必要。\n→ 空所には「継続を表す副詞」が必要です。\n\n■ 選択肢の確認\n(A) except … 前置詞「〜を除いて」 ×\n(B) already … 副詞「もう、すでに」 ×\n(C) still … 副詞「今もなお」 ○\n(D) white … 形容詞「白い」 ×\n\n■ 完成文\nOrganizers are still trying to find an alternative venue for the product launch but it may be too late.\n（主催者は今も製品発表の代替会場を探しているが、手遅れかもしれない。）\n\n■ 解き方のポイント\nstill は肯定文で「今もなお」。be動詞・助動詞の後ろ、一般動詞の前に置く。","words":[{"w":"Organizers","p":"名詞","m":"主催者"},{"w":"still","p":"副詞","m":"今もなお"},{"w":"alternative venue","p":"名詞","m":"代替会場"},{"w":"product launch","p":"名詞","m":"製品発表"}]},{"id":638,"category":"文法模試 セット1（OCR素案）","question":"Reproduction of any images on this Web site ______ written consent from the photographer is strictly prohibited.","A":"into","B":"throughout","C":"above","D":"without","answer":"D","answer_word":"without","explanation":"■ 文の骨格\nReproduction of any images on this Web site ______ written consent from the photographer is strictly prohibited.\n\n■ 空所に入るもの\n空所の後ろが名詞句 written consent なので、前置詞が必要。\n→ 空所には「名詞句を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) into … 前置詞「〜の中へ」 ×\n(B) throughout … 前置詞「〜の至る所に」 ×\n(C) above … 前置詞「〜の上に」 ×\n(D) without … 前置詞「〜なしに」 ○\n\n■ 完成文\nReproduction of any images on this Web site without written consent from the photographer is strictly prohibited.\n（本ウェブサイト上の画像を写真家の書面による同意なしに複製することは固く禁じられている。）\n\n■ 解き方のポイント\nwithout＋名詞＝「〜なしに」。禁止表現とセットで頻出。","words":[{"w":"Reproduction","p":"名詞","m":"複製"},{"w":"without","p":"前置詞","m":"〜なしに"},{"w":"written consent","p":"名詞","m":"書面による同意"},{"w":"strictly prohibited","p":"熟語","m":"固く禁じられて"}]},{"id":639,"category":"文法模試 セット1（OCR素案）","question":"Ms. Cho's ______ for oil painting is shown in a book she is writing about local artwork.","A":"enthusiastic","B":"no","C":"enthusiast","D":"enthusiasm","answer":"D","answer_word":"enthusiasm","explanation":"■ 文の骨格\nMs. Cho's ______ for oil painting is shown in a book she is writing about local artwork.\n\n■ 空所に入るもの\n所有格 Ms. Cho's の後ろで、述語動詞 is shown の主語となる名詞が必要。\n→ 空所には「文の主語になる名詞（不可算）」が必要です。\n\n■ 選択肢の確認\n(A) enthusiastic … 形容詞「熱心な」 ×\n(B) no … 副詞・形容詞「いいえ／少しも〜ない」 ×\n(C) enthusiast … 名詞（人）「愛好家」 ×\n(D) enthusiasm … 名詞（不可算）「情熱、熱意」 ○\n\n■ 完成文\nMs. Cho's enthusiasm for oil painting is shown in a book she is writing about local artwork.\n（油絵に対する Cho さんの情熱は、彼女が地元の美術について執筆中の本に表れている。）\n\n■ 解き方のポイント\nenthusiasm（熱意・不可算）と enthusiast（愛好家・人）の区別。for と結びつくのは前者。","words":[{"w":"enthusiasm","p":"名詞","m":"情熱"},{"w":"oil painting","p":"名詞","m":"油絵"},{"w":"shown","p":"動詞（過去分詞）","m":"示される"},{"w":"artwork","p":"名詞","m":"美術作品"}]},{"id":640,"category":"文法模試 セット1（OCR素案）","question":"Increased sales of new cars and improved tourism statistics are promising signs of a ______ economy.","A":"strength","B":"strong","C":"strengthening","D":"strengths","answer":"C","answer_word":"strengthening","explanation":"■ 文の骨格\nIncreased sales of new cars and improved tourism statistics are promising signs of a ______ economy.\n\n■ 空所に入るもの\n冠詞 a と名詞 economy の間にあり、「強まりつつある」と能動の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) strength … 名詞「強さ」 ×\n(B) strong … 形容詞「強い」 ×\n(C) strengthening … 現在分詞・形容詞「力強さを増している」 ○\n(D) strengths … 名詞（複数形）「強み」 ×\n\n■ 完成文\nIncreased sales of new cars and improved tourism statistics are promising signs of a strengthening economy.\n（新車販売の増加と観光統計の改善は、力強さを増しつつある経済の有望な兆しだ。）\n\n■ 解き方のポイント\na strong economy でも成立するが、選択肢では -ing が「回復基調」を表す。名詞の前は形容詞相当語。","words":[{"w":"Increased","p":"形容詞","m":"増加した"},{"w":"tourism statistics","p":"名詞","m":"観光統計"},{"w":"promising","p":"形容詞","m":"有望な"},{"w":"strengthening","p":"形容詞","m":"力強さを増している"}]},{"id":641,"category":"文法模試 セット1（OCR素案）","question":"______ was most notable about Nathan Lee's newest film was its amazing special effects.","A":"How","B":"Who","C":"Where","D":"What","answer":"D","answer_word":"What","explanation":"■ 文の骨格\n______ was most notable about Nathan Lee's newest film was its amazing special effects.\n\n■ 空所に入るもの\n文全体の主語となる名詞節を導き、先行詞を含む関係代名詞が必要。\n→ 空所には「先行詞を含む関係代名詞」が必要です。\n\n■ 選択肢の確認\n(A) How … 疑問副詞「どのように」 ×\n(B) Who … 関係代名詞（人）「誰が」 ×\n(C) Where … 関係副詞「どこで」 ×\n(D) What … 関係代名詞（先行詞を含む）「〜こと」 ○\n\n■ 完成文\nWhat was most notable about Nathan Lee's newest film was its amazing special effects.\n（Nathan Lee の最新作で最も注目すべきだったのは、その驚くべき特殊効果だった。）\n\n■ 解き方のポイント\nWhat＝the thing which。名詞節をつくり主語になれる。","words":[{"w":"What","p":"関係代名詞","m":"〜こと"},{"w":"notable","p":"形容詞","m":"注目すべき"},{"w":"amazing","p":"形容詞","m":"驚くべき"},{"w":"special effects","p":"名詞","m":"特殊効果"}]},{"id":642,"category":"文法模試 セット1（OCR素案）","question":"A block of 100 ______ seats has been purchased by the sponsors.","A":"reserved","B":"reserve","C":"reserving","D":"reserves","answer":"A","answer_word":"reserved","explanation":"■ 文の骨格\nA block of 100 ______ seats has been purchased by the sponsors.\n\n■ 空所に入るもの\n数詞 100 と名詞 seats の間にあり、受け身の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) reserved … 過去分詞・形容詞「予約済みの」 ○\n(B) reserve … 動詞（原形）／名詞「予約する／蓄え」 ×\n(C) reserving … 現在分詞・動名詞「予約すること」 ×\n(D) reserves … 動詞（三人称単数現在形）「予約する」 ×\n\n■ 完成文\nA block of 100 reserved seats has been purchased by the sponsors.\n（100席分のまとまった座席が、スポンサーによって購入された。）\n\n■ 解き方のポイント\nseats は「予約される」側なので過去分詞。reserved seats＝「予約席」。","words":[{"w":"A block of","p":"熟語","m":"ひとまとまりの"},{"w":"reserved","p":"形容詞","m":"予約済みの"},{"w":"seats","p":"名詞","m":"座席"},{"w":"sponsors","p":"名詞","m":"スポンサー"}]},{"id":643,"category":"文法模試 セット1（OCR素案）","question":"At Stratford City Hotel, ______ of the guests is welcomed with complimentary coffee and a fruit platter in the main lobby.","A":"all","B":"each","C":"many","D":"much","answer":"B","answer_word":"each","explanation":"■ 文の骨格\nAt Stratford City Hotel, ______ of the guests is welcomed with complimentary coffee and a fruit platter in the main lobby.\n\n■ 空所に入るもの\n述語動詞 is に対応する単数扱いの主語が必要。\n→ 空所には「単数扱いの主語になる代名詞」が必要です。\n\n■ 選択肢の確認\n(A) all … 形容詞・代名詞（複数扱い）「すべて」 ×\n(B) each … 代名詞（単数扱い）「それぞれ」 ○\n(C) many … 形容詞（複数名詞用）「多くの」 ×\n(D) much … 形容詞（不可算名詞用）「多くの」 ×\n\n■ 完成文\nAt Stratford City Hotel, each of the guests is welcomed with complimentary coffee and a fruit platter in the main lobby.\n（Stratford City ホテルでは、宿泊客一人ひとりがメインロビーで無料のコーヒーとフルーツの盛り合わせで迎えられる。）\n\n■ 解き方のポイント\neach of ＋複数名詞は単数扱い。動詞 is が決め手。","words":[{"w":"each","p":"代名詞","m":"それぞれ"},{"w":"welcomed","p":"動詞（過去分詞）","m":"迎えられる"},{"w":"complimentary","p":"形容詞","m":"無料の"},{"w":"platter","p":"名詞","m":"大皿、盛り合わせ"}]},{"id":644,"category":"文法模試 セット1（OCR素案）","question":"Residents of Noblesville have frequently complained that the city is too ______ with tourists these days.","A":"crowd","B":"crowds","C":"crowded","D":"crowding","answer":"C","answer_word":"crowded","explanation":"■ 文の骨格\nResidents of Noblesville have frequently complained that the city is too ______ with tourists these days.\n\n■ 空所に入るもの\nis too の後ろで、主語 the city の状態を表す形容詞が必要。\n→ 空所には「be動詞の補語になる過去分詞（形容詞化）」が必要です。\n\n■ 選択肢の確認\n(A) crowd … 名詞／動詞「群衆／群がる」 ×\n(B) crowds … 動詞（三人称単数現在形）／名詞（複数形）「群がる／群衆」 ×\n(C) crowded … 過去分詞・形容詞「混雑した」 ○\n(D) crowding … 現在分詞・動名詞「群がること」 ×\n\n■ 完成文\nResidents of Noblesville have frequently complained that the city is too crowded with tourists these days.\n（Noblesville の住民は、最近この街が観光客で混みすぎていると頻繁に不満を述べている。）\n\n■ 解き方のポイント\nbe crowded with X＝「Xで混雑している」。with が受動態の目印。","words":[{"w":"Residents","p":"名詞","m":"住民"},{"w":"complained","p":"動詞（過去分詞）","m":"不満を述べた"},{"w":"crowded with","p":"熟語","m":"〜で混雑した"},{"w":"tourists","p":"名詞","m":"観光客"}]},{"id":645,"category":"文法模試 セット1（OCR素案）","question":"During the meeting last week, the advertising department discussed ways to improve ______ brand image among consumers.","A":"us","B":"our","C":"ours","D":"ourselves","answer":"B","answer_word":"our","explanation":"■ 文の骨格\nDuring the meeting last week, the advertising department discussed ways to improve ______ brand image among consumers.\n\n■ 空所に入るもの\n空所の後ろに名詞句 brand image があるので、所有格が必要。\n→ 空所には「名詞を修飾する所有格」が必要です。\n\n■ 選択肢の確認\n(A) us … 目的格の代名詞「私たちを」 ×\n(B) our … 所有格「私たちの」 ○\n(C) ours … 所有代名詞「私たちのもの」 ×\n(D) ourselves … 再帰代名詞「私たち自身」 ×\n\n■ 完成文\nDuring the meeting last week, the advertising department discussed ways to improve our brand image among consumers.\n（先週の会議で、広告部は消費者の間での自社ブランドイメージを高める方法を議論した。）\n\n■ 解き方のポイント\n〈空所＋名詞〉は所有格。ourselves は名詞を修飾できない。","words":[{"w":"advertising department","p":"名詞","m":"広告部"},{"w":"discussed","p":"動詞（過去形）","m":"議論した"},{"w":"our","p":"所有格","m":"私たちの"},{"w":"brand image","p":"名詞","m":"ブランドイメージ"}]},{"id":646,"category":"文法模試 セット1（OCR素案）","question":"Ms. Nakamura will place an order for office supplies, ______ copy paper, at 10 A.M.","A":"includes","B":"included","C":"include","D":"including","answer":"D","answer_word":"including","explanation":"■ 文の骨格\nMs. Nakamura will place an order for office supplies, ______ copy paper, at 10 A.M.\n\n■ 空所に入るもの\n空所の後ろが名詞 copy paper で、具体例を導く前置詞が必要。\n→ 空所には「例示を導く前置詞（分詞由来）」が必要です。\n\n■ 選択肢の確認\n(A) includes … 動詞（三人称単数現在形）「含む」 ×\n(B) included … 過去分詞「含まれた」 ×\n(C) include … 動詞（原形）「含む」 ×\n(D) including … 前置詞（現在分詞由来）「〜を含めて」 ○\n\n■ 完成文\nMs. Nakamura will place an order for office supplies, including copy paper, at 10 A.M.\n（Nakamura さんは午前10時に、コピー用紙を含む事務用品を発注する。）\n\n■ 解き方のポイント\nincluding は前置詞として働く分詞。直後に名詞が来る。","words":[{"w":"place an order","p":"熟語","m":"発注する"},{"w":"office supplies","p":"名詞","m":"事務用品"},{"w":"including","p":"前置詞","m":"〜を含めて"},{"w":"copy paper","p":"名詞","m":"コピー用紙"}]},{"id":647,"category":"文法模試 セット1（OCR素案）","question":"Neither the workers ______ the manager was satisfied with the new production procedures.","A":"yet","B":"and","C":"nor","D":"but","answer":"C","answer_word":"nor","explanation":"■ 文の骨格\nNeither the workers ______ the manager was satisfied with the new production procedures.\n\n■ 空所に入るもの\n文頭に Neither があるので、neither A nor B（AもBも〜ない）の形になる。\n→ 空所には「Neither と呼応する相関接続詞」が必要です。\n\n■ 選択肢の確認\n(A) yet … 副詞「まだ」 ×\n(B) and … 等位接続詞「そして」 ×\n(C) nor … 相関接続詞「〜も…もない」 ○\n(D) but … 等位接続詞「しかし」 ×\n\n■ 完成文\nNeither the workers nor the manager was satisfied with the new production procedures.\n（作業員も部長も、新しい生産手順に満足していなかった。）\n\n■ 解き方のポイント\nneither A nor B では動詞は B に合わせる（ここでは the manager なので was）。","words":[{"w":"Neither","p":"相関接続詞","m":"どちらも〜ない"},{"w":"nor","p":"相関接続詞","m":"〜も…ない"},{"w":"satisfied with","p":"熟語","m":"〜に満足して"},{"w":"production procedures","p":"名詞","m":"生産手順"}]},{"id":648,"category":"文法模試 セット1（OCR素案）","question":"For more information on scheduling a ______ of the glass factory, contact David Wilson, the Associate Director of Operations.","A":"tour","B":"take a tour","C":"touring","D":"tourist","answer":"A","answer_word":"tour","explanation":"■ 文の骨格\nFor more information on scheduling a ______ of the glass factory, contact David Wilson, the Associate Director of Operations.\n\n■ 空所に入るもの\n冠詞 a と of の間にあり、動名詞 scheduling の目的語となる名詞が必要。\n→ 空所には「冠詞の後ろに置く名詞」が必要です。\n\n■ 選択肢の確認\n(A) tour … 名詞「見学、ツアー」 ○\n(B) take a tour … 動詞（原形）「（会場を）見学して回る」 ×\n(C) touring … 現在分詞・動名詞「見学すること」 ×\n(D) tourist … 名詞（人）「観光客」 ×\n\n■ 完成文\nFor more information on scheduling a tour of the glass factory, contact David Wilson, the Associate Director of Operations.\n（ガラス工場の見学の予約に関する詳細は、業務担当副部長の David Wilson までお問い合わせください。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋of〉は名詞。tourist（人）とは意味が違う。","words":[{"w":"scheduling","p":"動名詞","m":"予約すること"},{"w":"tour","p":"名詞","m":"見学"},{"w":"glass factory","p":"名詞","m":"ガラス工場"},{"w":"Associate Director","p":"名詞","m":"副部長"}]},{"id":649,"category":"文法模試 セット1（OCR素案）","question":"Mary Anderson was unable to finish her presentation materials, ______ the additional time she was given by her supervisor.","A":"since","B":"even if","C":"in spite of","D":"as though","answer":"C","answer_word":"in spite of","explanation":"■ 文の骨格\nMary Anderson was unable to finish her presentation materials, ______ the additional time she was given by her supervisor.\n\n■ 空所に入るもの\n空所の後ろが名詞句 the additional time ... なので、前置詞が必要。\n→ 空所には「名詞句を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) since … 接続詞・前置詞「〜以来」 ×\n(B) even if … 接続詞（群）「たとえ〜でも」 ×\n(C) in spite of … 群前置詞「〜にもかかわらず」 ○\n(D) as though … 接続詞（群）「まるで〜のように」 ×\n\n■ 完成文\nMary Anderson was unable to finish her presentation materials, in spite of the additional time she was given by her supervisor.\n（上司から追加の時間をもらったにもかかわらず、Mary Anderson はプレゼン資料を仕上げられなかった。）\n\n■ 解き方のポイント\nin spite of＋名詞／even if＋節。後ろの形で選ぶ。","words":[{"w":"unable to","p":"熟語","m":"〜できない"},{"w":"presentation materials","p":"名詞","m":"プレゼン資料"},{"w":"in spite of","p":"熟語","m":"〜にもかかわらず"},{"w":"supervisor","p":"名詞","m":"上司"}]},{"id":650,"category":"文法模試 セット1（OCR素案）","question":"Destruction of the artwork ______ had the museum taken some simple precautions.","A":"will be avoided","B":"could avoid","C":"could have been avoided","D":"has avoided","answer":"C","answer_word":"could have been avoided","explanation":"■ 文の骨格\nDestruction of the artwork ______ had the museum taken some simple precautions.\n\n■ 空所に入るもの\nhad the museum taken ... は if の省略による倒置で、帰結節は〈could have＋過去分詞〉になる。\n→ 空所には「仮定法過去完了の帰結節」が必要です。\n\n■ 選択肢の確認\n(A) will be avoided … 未来受動態「避けられるだろう」 ×\n(B) could avoid … 助動詞＋原形「避けられただろう（能動）」 ×\n(C) could have been avoided … 助動詞＋完了受動態「避けられたはずだ」 ○\n(D) has avoided … 現在完了形「避けてきた」 ×\n\n■ 完成文\nDestruction of the artwork could have been avoided had the museum taken some simple precautions.\n（博物館がいくつか簡単な予防策を取っていれば、その美術品の破損は避けられたはずだ。）\n\n■ 解き方のポイント\nIf the museum had taken ... の if を省略すると Had the museum taken ... の倒置になる。","words":[{"w":"Destruction","p":"名詞","m":"破損、破壊"},{"w":"artwork","p":"名詞","m":"美術品"},{"w":"could have been avoided","p":"仮定法","m":"避けられたはずだ"},{"w":"precautions","p":"名詞","m":"予防策"}]},{"id":651,"category":"文法模試 セット1（OCR素案）","question":"Under the management of Paula Garcia, the company ______ developed a reputation as a leader in e-commerce.","A":"quick","B":"quicker","C":"quickly","D":"quickness","answer":"C","answer_word":"quickly","explanation":"■ 文の骨格\nUnder the management of Paula Garcia, the company ______ developed a reputation as a leader in e-commerce.\n\n■ 空所に入るもの\n主語 the company と述語動詞 developed の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) quick … 形容詞「素早い」 ×\n(B) quicker … 形容詞（比較級）「より素早い」 ×\n(C) quickly … 副詞「素早く」 ○\n(D) quickness … 名詞「素早さ」 ×\n\n■ 完成文\nUnder the management of Paula Garcia, the company quickly developed a reputation as a leader in e-commerce.\n（Paula Garcia の経営のもと、その会社は電子商取引のリーダーとしての評判を素早く築いた。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉は副詞の定位置。","words":[{"w":"management","p":"名詞","m":"経営"},{"w":"quickly","p":"副詞","m":"素早く"},{"w":"reputation","p":"名詞","m":"評判"},{"w":"e-commerce","p":"名詞","m":"電子商取引"}]},{"id":652,"category":"文法模試 セット1（OCR素案）","question":"In today's market, the design of your Web site can be as important ______ the product or service you provide.","A":"for","B":"or","C":"than","D":"as","answer":"D","answer_word":"as","explanation":"■ 文の骨格\nIn today's market, the design of your Web site can be as important ______ the product or service you provide.\n\n■ 空所に入るもの\n前に as important があるので、as A as B（Bと同じくらいA）の形になる。\n→ 空所には「as ... as の同等比較をつくる語」が必要です。\n\n■ 選択肢の確認\n(A) for … 前置詞「〜のために」 ×\n(B) or … 等位接続詞「または」 ×\n(C) than … 接続詞・前置詞「〜よりも」 ×\n(D) as … 接続詞・前置詞「〜と同じくらい」 ○\n\n■ 完成文\nIn today's market, the design of your Web site can be as important as the product or service you provide.\n（今日の市場では、ウェブサイトのデザインは提供する製品やサービスと同じくらい重要になりうる。）\n\n■ 解き方のポイント\nas＋原級＋as が同等比較。than は比較級とセット。","words":[{"w":"market","p":"名詞","m":"市場"},{"w":"as ... as","p":"熟語","m":"〜と同じくらい"},{"w":"important","p":"形容詞","m":"重要な"},{"w":"provide","p":"動詞","m":"提供する"}]},{"id":653,"category":"文法模試 セット1（OCR素案）","question":"All staff members are required to wear a hardhat while the manufacturing plant is in ______.","A":"operate","B":"operating","C":"operation","D":"operator","answer":"C","answer_word":"operation","explanation":"■ 文の骨格\nAll staff members are required to wear a hardhat while the manufacturing plant is in ______.\n\n■ 空所に入るもの\nin operation（稼働中で）という定型表現になる。\n→ 空所には「前置詞 in の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) operate … 動詞（原形）「操作する」 ×\n(B) operating … 現在分詞・動名詞「操作すること」 ×\n(C) operation … 名詞「稼働、運営」 ○\n(D) operator … 名詞（人）「操作者」 ×\n\n■ 完成文\nAll staff members are required to wear a hardhat while the manufacturing plant is in operation.\n（製造工場が稼働している間、全職員はヘルメットを着用しなければならない。）\n\n■ 解き方のポイント\nin operation／in progress／under construction など、前置詞＋名詞は丸ごと覚える。","words":[{"w":"hardhat","p":"名詞","m":"ヘルメット"},{"w":"manufacturing plant","p":"名詞","m":"製造工場"},{"w":"in operation","p":"熟語","m":"稼働中で"}]},{"id":654,"category":"文法模試 セット1（OCR素案）","question":"Johnson Memorial Hospital requires the therapists to ______ to work 15 minutes before the start of their shifts.","A":"report","B":"inform","C":"arrive","D":"complete","answer":"A","answer_word":"report","explanation":"■ 文の骨格\nJohnson Memorial Hospital requires the therapists to ______ to work 15 minutes before the start of their shifts.\n\n■ 空所に入るもの\nreport to work（出勤する）という定型表現になる。\n→ 空所には「to と結びつく自動詞」が必要です。\n\n■ 選択肢の確認\n(A) report … 動詞（原形）「出向く、報告する」 ○\n(B) inform … 動詞（原形）「知らせる（人が目的語）」 ×\n(C) arrive … 動詞（原形）「到着する（at が必要）」 ×\n(D) complete … 動詞（原形）「完了する（他動詞）」 ×\n\n■ 完成文\nJohnson Memorial Hospital requires the therapists to report to work 15 minutes before the start of their shifts.\n（Johnson 記念病院は、療法士に対しシフト開始の15分前に出勤するよう求めている。）\n\n■ 解き方のポイント\nreport to work＝「出勤する」。report to＋人 なら「〜の下で働く」。","words":[{"w":"requires","p":"動詞","m":"求める"},{"w":"therapists","p":"名詞","m":"療法士"},{"w":"report to work","p":"熟語","m":"出勤する"},{"w":"shifts","p":"名詞","m":"シフト、勤務時間"}]},{"id":655,"category":"文法模試 セット2（OCR素案）","question":"Unless you ______ mention that you want to remain anonymous, your user name and question may be posted online to help other customers.","A":"specify","B":"specific","C":"specification","D":"specifically","answer":"D","answer_word":"specifically","explanation":"■ 文の骨格\nUnless you ______ mention that you want to remain anonymous, your user name and question may be posted online to help other customers.\n\n■ 空所に入るもの\n主語 you と述語動詞 mention の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) specify … 動詞（原形）「明記する」 ×\n(B) specific … 形容詞「具体的な」 ×\n(C) specification … 名詞「仕様書」 ×\n(D) specifically … 副詞「明確に、はっきりと」 ○\n\n■ 完成文\nUnless you specifically mention that you want to remain anonymous, your user name and question may be posted online to help other customers.\n（匿名を希望するとはっきり述べない限り、あなたのユーザー名と質問はほかのお客様の参考のためオンラインに掲載されることがあります。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉は副詞。動詞 mention がすでにある点が決め手。","words":[{"w":"Unless","p":"接続詞","m":"〜でない限り"},{"w":"specifically","p":"副詞","m":"はっきりと"},{"w":"mention","p":"動詞","m":"述べる"},{"w":"anonymous","p":"形容詞","m":"匿名の"}]},{"id":656,"category":"文法模試 セット2（OCR素案）","question":"Before assembling the documents for Mr. Bennett's seminar, be sure to e-mail them to ______ for proofreading.","A":"he","B":"him","C":"his","D":"himself","answer":"B","answer_word":"him","explanation":"■ 文の骨格\nBefore assembling the documents for Mr. Bennett's seminar, be sure to e-mail them to ______ for proofreading.\n\n■ 空所に入るもの\n前置詞 to の後ろなので、目的格の代名詞が必要。\n→ 空所には「前置詞の目的語になる目的格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) he … 主格の代名詞「彼は」 ×\n(B) him … 目的格の代名詞「彼に」 ○\n(C) his … 所有格・所有代名詞「彼の／彼のもの」 ×\n(D) himself … 再帰代名詞「彼自身」 ×\n\n■ 完成文\nBefore assembling the documents for Mr. Bennett's seminar, be sure to e-mail them to him for proofreading.\n（Bennett さんのセミナー用の資料をまとめる前に、必ず校正のため彼にメールで送ってください。）\n\n■ 解き方のポイント\n前置詞の直後は目的格。主語（you）と別人なので再帰代名詞は不可。","words":[{"w":"assembling","p":"動名詞","m":"まとめること"},{"w":"documents","p":"名詞","m":"資料"},{"w":"him","p":"目的格の代名詞","m":"彼に"},{"w":"proofreading","p":"名詞","m":"校正"}]},{"id":657,"category":"文法模試 セット2（OCR素案）","question":"______, the conference was attended by over a thousand people from the leisure industry.","A":"Altogether","B":"Partially","C":"Largely","D":"Completely","answer":"A","answer_word":"Altogether","explanation":"■ 文の骨格\n______, the conference was attended by over a thousand people from the leisure industry.\n\n■ 空所に入るもの\n文頭でコンマに続き、文全体を修飾する副詞が必要。\n→ 空所には「文全体を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) Altogether … 副詞「全体で、合計で」 ○\n(B) Partially … 副詞「部分的に」 ×\n(C) Largely … 副詞「主に」 ×\n(D) Completely … 副詞「完全に」 ×\n\n■ 完成文\nAltogether, the conference was attended by over a thousand people from the leisure industry.\n（合計で、その会議にはレジャー産業から1,000人を超える人が参加した。）\n\n■ 解き方のポイント\naltogether＝in total（全部で）。数量を総括する文頭の副詞。","words":[{"w":"Altogether","p":"副詞","m":"合計で"},{"w":"conference","p":"名詞","m":"会議"},{"w":"attended","p":"動詞（過去分詞）","m":"参加された"},{"w":"leisure industry","p":"名詞","m":"レジャー産業"}]},{"id":658,"category":"文法模試 セット2（OCR素案）","question":"Managers have been debating ways of evaluating employee ______ more effectively.","A":"perform","B":"performance","C":"performs","D":"performed","answer":"B","answer_word":"performance","explanation":"■ 文の骨格\nManagers have been debating ways of evaluating employee ______ more effectively.\n\n■ 空所に入るもの\n動名詞 evaluating の目的語で、employee に続く名詞が必要。\n→ 空所には「employee と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) perform … 動詞（原形）「遂行する」 ×\n(B) performance … 名詞「業績、勤務評価」 ○\n(C) performs … 動詞（三人称単数現在形）「遂行する」 ×\n(D) performed … 動詞の過去形・過去分詞「遂行された」 ×\n\n■ 完成文\nManagers have been debating ways of evaluating employee performance more effectively.\n（管理職は、従業員の業績をより効果的に評価する方法について議論を続けている。）\n\n■ 解き方のポイント\nemployee performance（従業員の業績）は複合名詞。動名詞の目的語は名詞。","words":[{"w":"debating","p":"現在分詞","m":"議論している"},{"w":"evaluating","p":"動名詞","m":"評価すること"},{"w":"performance","p":"名詞","m":"業績"},{"w":"effectively","p":"副詞","m":"効果的に"}]},{"id":659,"category":"文法模試 セット2（OCR素案）","question":"Many people who attend workshops underestimate how much they can learn from ______ participants.","A":"another","B":"others","C":"other","D":"one another","answer":"C","answer_word":"other","explanation":"■ 文の骨格\nMany people who attend workshops underestimate how much they can learn from ______ participants.\n\n■ 空所に入るもの\n空所の後ろが複数名詞 participants で、「ほかの参加者」を表す語が必要。\n→ 空所には「複数名詞を修飾する語」が必要です。\n\n■ 選択肢の確認\n(A) another … 形容詞・代名詞「もう1つの（単数名詞に付く）」 ×\n(B) others … 代名詞「ほかの人々（名詞を伴わない）」 ×\n(C) other … 形容詞「ほかの」 ○\n(D) one another … 相互代名詞「お互い」 ×\n\n■ 完成文\nMany people who attend workshops underestimate how much they can learn from other participants.\n（ワークショップに参加する多くの人は、ほかの参加者からどれだけ学べるかを過小評価している。）\n\n■ 解き方のポイント\nother＋複数名詞／others は単独で使う代名詞。名詞が続くかどうかで決まる。","words":[{"w":"underestimate","p":"動詞","m":"過小評価する"},{"w":"other","p":"形容詞","m":"ほかの"},{"w":"participants","p":"名詞","m":"参加者"}]},{"id":660,"category":"文法模試 セット2（OCR素案）","question":"Hiring managers ______ prefer applicants who either have experience in a related field or show great enthusiasm.","A":"normal","B":"normalize","C":"normality","D":"normally","answer":"D","answer_word":"normally","explanation":"■ 文の骨格\nHiring managers ______ prefer applicants who either have experience in a related field or show great enthusiasm.\n\n■ 空所に入るもの\n主語 Hiring managers と述語動詞 prefer の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) normal … 形容詞「普通の」 ×\n(B) normalize … 動詞（原形）「正常化する」 ×\n(C) normality … 名詞「正常さ」 ×\n(D) normally … 副詞「通常は」 ○\n\n■ 完成文\nHiring managers normally prefer applicants who either have experience in a related field or show great enthusiasm.\n（採用担当者は通常、関連分野での経験があるか、強い熱意を示す応募者を好む。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉は副詞の定位置。","words":[{"w":"Hiring managers","p":"名詞","m":"採用担当者"},{"w":"normally","p":"副詞","m":"通常は"},{"w":"prefer","p":"動詞","m":"好む"},{"w":"related field","p":"名詞","m":"関連分野"},{"w":"enthusiasm","p":"名詞","m":"熱意"}]},{"id":661,"category":"文法模試 セット2（OCR素案）","question":"The school has an integrated communication system that ______ all classrooms to the main office.","A":"links","B":"linkage","C":"appropriateness","D":"linking","answer":"A","answer_word":"links","explanation":"■ 文の骨格\nThe school has an integrated communication system that ______ all classrooms to the main office.\n\n■ 空所に入るもの\n主格の関係代名詞 that の後ろには述語動詞が必要。先行詞 system は単数。\n→ 空所には「関係詞節の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) links … 動詞（三人称単数現在形）「つなぐ」 ○\n(B) linkage … 名詞「連結、つながり」 ×\n(C) appropriateness … 名詞「妥当性」 ×\n(D) linking … 現在分詞・動名詞「つなぐこと」 ×\n\n■ 完成文\nThe school has an integrated communication system that links all classrooms to the main office.\n（その学校には、すべての教室を事務室につなぐ統合通信システムがある。）\n\n■ 解き方のポイント\n主格の関係代名詞の直後は動詞。先行詞の数に合わせる。","words":[{"w":"integrated","p":"形容詞","m":"統合された"},{"w":"links","p":"動詞","m":"つなぐ"},{"w":"classrooms","p":"名詞","m":"教室"},{"w":"main office","p":"名詞","m":"事務室"}]},{"id":662,"category":"文法模試 セット2（OCR素案）","question":"______ who wishes to participate in the negotiation skills training course should contact Ms. Moore on extension 990 by this coming Friday.","A":"They","B":"Anyone","C":"Themselves","D":"Other","answer":"B","answer_word":"Anyone","explanation":"■ 文の骨格\n______ who wishes to participate in the negotiation skills training course should contact Ms. Moore on extension 990 by this coming Friday.\n\n■ 空所に入るもの\n述語動詞 should contact の主語で、関係代名詞 who に修飾される「人」を表す語が必要。\n→ 空所には「関係詞節に修飾される単数扱いの代名詞」が必要です。\n\n■ 選択肢の確認\n(A) They … 代名詞（複数）「彼らは」 ×\n(B) Anyone … 代名詞（単数扱い）「誰でも」 ○\n(C) Themselves … 再帰代名詞「彼ら自身」 ×\n(D) Other … 形容詞「ほかの」 ×\n\n■ 完成文\nAnyone who wishes to participate in the negotiation skills training course should contact Ms. Moore on extension 990 by this coming Friday.\n（交渉スキル研修に参加を希望する人は、今週金曜日までに内線990で Moore さんに連絡すること。）\n\n■ 解き方のポイント\nanyone who ...＝「〜する人は誰でも」。単数扱い（wishes）。","words":[{"w":"Anyone","p":"代名詞","m":"誰でも"},{"w":"participate in","p":"熟語","m":"〜に参加する"},{"w":"negotiation skills","p":"名詞","m":"交渉スキル"},{"w":"extension","p":"名詞","m":"内線"}]},{"id":663,"category":"文法模試 セット2（OCR素案）","question":"First-time patients should arrive 15 minutes prior to their scheduled appointment in order to fill out the ______ medical paperwork.","A":"necessity","B":"necessitate","C":"necessary","D":"necessarily","answer":"C","answer_word":"necessary","explanation":"■ 文の骨格\nFirst-time patients should arrive 15 minutes prior to their scheduled appointment in order to fill out the ______ medical paperwork.\n\n■ 空所に入るもの\nthe と名詞句 medical paperwork の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) necessity … 名詞「必要性」 ×\n(B) necessitate … 動詞（原形）「必要とさせる」 ×\n(C) necessary … 形容詞「必要な」 ○\n(D) necessarily … 副詞「必ずしも」 ×\n\n■ 完成文\nFirst-time patients should arrive 15 minutes prior to their scheduled appointment in order to fill out the necessary medical paperwork.\n（初診の患者は、必要な診療書類に記入するため、予約時刻の15分前に来院すること。）\n\n■ 解き方のポイント\n〈the＋空所＋名詞〉は形容詞。","words":[{"w":"First-time patients","p":"名詞","m":"初診の患者"},{"w":"prior to","p":"熟語","m":"〜より前に"},{"w":"fill out","p":"熟語","m":"記入する"},{"w":"necessary","p":"形容詞","m":"必要な"},{"w":"paperwork","p":"名詞","m":"書類"}]},{"id":664,"category":"文法模試 セット2（OCR素案）","question":"After a preliminary consultation, Miller System Service ______ a plan outlining the types of services that will benefit your business.","A":"was created","B":"having created","C":"creating","D":"will create","answer":"D","answer_word":"will create","explanation":"■ 文の骨格\nAfter a preliminary consultation, Miller System Service ______ a plan outlining the types of services that will benefit your business.\n\n■ 空所に入るもの\n主語 Miller System Service に対する述語動詞が欠けており、今後の話なので未来形。\n→ 空所には「未来を表す述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) was created … 受動態（過去）「作られた」 ×\n(B) having created … 完了分詞「作ったうえで」 ×\n(C) creating … 現在分詞・動名詞「作ること」 ×\n(D) will create … 未来形「作成する」 ○\n\n■ 完成文\nAfter a preliminary consultation, Miller System Service will create a plan outlining the types of services that will benefit your business.\n（事前相談のあと、Miller System Service 社は御社の事業に役立つサービスの種類をまとめた計画を作成します。）\n\n■ 解き方のポイント\n直後に目的語 a plan があるので能動態。文には述語動詞が必要。","words":[{"w":"preliminary consultation","p":"名詞","m":"事前相談"},{"w":"will create","p":"未来形","m":"作成する"},{"w":"outlining","p":"現在分詞","m":"概要を示す"},{"w":"benefit","p":"動詞","m":"役立つ"}]},{"id":665,"category":"文法模試 セット2（OCR素案）","question":"The position of marketing director will be assigned to either Mr. Hanyu in the marketing department ______ Mr. Nishikori, who joined the company last year.","A":"but","B":"and","C":"nor","D":"or","answer":"D","answer_word":"or","explanation":"■ 文の骨格\nThe position of marketing director will be assigned to either Mr. Hanyu in the marketing department ______ Mr. Nishikori, who joined the company last year.\n\n■ 空所に入るもの\n前に either があるので、either A or B（AかBのどちらか）の形になる。\n→ 空所には「either と呼応する等位接続詞」が必要です。\n\n■ 選択肢の確認\n(A) but … 等位接続詞「しかし」 ×\n(B) and … 等位接続詞「そして」 ×\n(C) nor … 相関接続詞「〜も…もない」 ×\n(D) or … 等位接続詞「または」 ○\n\n■ 完成文\nThe position of marketing director will be assigned to either Mr. Hanyu in the marketing department or Mr. Nishikori, who joined the company last year.\n（マーケティング部長の職は、マーケティング部の Hanyu さんか、昨年入社した Nishikori さんのどちらかに任される。）\n\n■ 解き方のポイント\neither A or B／neither A nor B。前の語で相手役が決まる。","words":[{"w":"assigned to","p":"熟語","m":"〜に任される"},{"w":"either ... or","p":"相関接続詞","m":"AかBのどちらか"},{"w":"marketing department","p":"名詞","m":"マーケティング部"}]},{"id":666,"category":"文法模試 セット2（OCR素案）","question":"A recent study has found that nearly half of Internet users are unsure ______ the content they are accessing is accurate or even reliable.","A":"whether","B":"of","C":"which","D":"who","answer":"A","answer_word":"whether","explanation":"■ 文の骨格\nA recent study has found that nearly half of Internet users are unsure ______ the content they are accessing is accurate or even reliable.\n\n■ 空所に入るもの\n形容詞 unsure の後ろで、or と呼応して「〜かどうか」を表す接続詞が必要。\n→ 空所には「名詞節を導く接続詞」が必要です。\n\n■ 選択肢の確認\n(A) whether … 接続詞「〜かどうか」 ○\n(B) of … 前置詞「〜の」 ×\n(C) which … 関係代名詞「どちら」 ×\n(D) who … 関係代名詞（人）「誰が」 ×\n\n■ 完成文\nA recent study has found that nearly half of Internet users are unsure whether the content they are accessing is accurate or even reliable.\n（最近の調査で、インターネット利用者の半数近くが、自分の見ている情報が正確かどうか、信頼できるかどうかさえ確信が持てないことが分かった。）\n\n■ 解き方のポイント\nbe unsure whether ...／or 〜と呼応する形。","words":[{"w":"nearly half","p":"名詞句","m":"半数近く"},{"w":"unsure","p":"形容詞","m":"確信が持てない"},{"w":"whether","p":"接続詞","m":"〜かどうか"},{"w":"accurate","p":"形容詞","m":"正確な"}]},{"id":667,"category":"文法模試 セット2（OCR素案）","question":"The purchasing division is responsible for ______ with suppliers for raw materials.","A":"negotiate","B":"negotiated","C":"negotiating","D":"negotiates","answer":"C","answer_word":"negotiating","explanation":"■ 文の骨格\nThe purchasing division is responsible for ______ with suppliers for raw materials.\n\n■ 空所に入るもの\nbe responsible for の for は前置詞なので、後ろは名詞か動名詞。\n→ 空所には「前置詞 for の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) negotiate … 動詞（原形）「交渉する」 ×\n(B) negotiated … 動詞の過去形・過去分詞「交渉した」 ×\n(C) negotiating … 動名詞「交渉すること」 ○\n(D) negotiates … 動詞（三人称単数現在形）「交渉する」 ×\n\n■ 完成文\nThe purchasing division is responsible for negotiating with suppliers for raw materials.\n（購買部は、原材料について仕入先と交渉する責任を負っている。）\n\n■ 解き方のポイント\nbe responsible for doing＝「〜する責任がある」。for は前置詞。","words":[{"w":"purchasing division","p":"名詞","m":"購買部"},{"w":"responsible for","p":"熟語","m":"〜の責任がある"},{"w":"negotiating","p":"動名詞","m":"交渉すること"},{"w":"raw materials","p":"名詞","m":"原材料"}]},{"id":668,"category":"文法模試 セット2（OCR素案）","question":"______ secure a seat at the upcoming seminar, participants must submit an application form along with the $500 registration fee by September 15.","A":"In addition to","B":"Because of","C":"In order to","D":"With regard to","answer":"C","answer_word":"In order to","explanation":"■ 文の骨格\n______ secure a seat at the upcoming seminar, participants must submit an application form along with the $500 registration fee by September 15.\n\n■ 空所に入るもの\n空所の後ろが動詞の原形 secure なので、to 不定詞をつくる語句が必要。\n→ 空所には「目的を表す群不定詞」が必要です。\n\n■ 選択肢の確認\n(A) In addition to … 群前置詞「〜に加えて」 ×\n(B) Because of … 群前置詞「〜のため」 ×\n(C) In order to … 群不定詞「〜するために」 ○\n(D) With regard to … 群前置詞「〜に関して」 ×\n\n■ 完成文\nIn order to secure a seat at the upcoming seminar, participants must submit an application form along with the $500 registration fee by September 15.\n（今度のセミナーの席を確保するため、参加者は9月15日までに申込書と500ドルの登録料を提出しなければならない。）\n\n■ 解き方のポイント\n後ろが動詞の原形なら to 不定詞。前置詞句の選択肢は名詞を要求する。","words":[{"w":"In order to","p":"熟語","m":"〜するために"},{"w":"secure","p":"動詞","m":"確保する"},{"w":"upcoming","p":"形容詞","m":"今度の"},{"w":"registration fee","p":"名詞","m":"登録料"}]},{"id":669,"category":"文法模試 セット2（OCR素案）","question":"Executives at Carlton Department Store are excited ______ the fresh perspective that the new CEO is expected to bring to the organization.","A":"about","B":"to","C":"from","D":"between","answer":"A","answer_word":"about","explanation":"■ 文の骨格\nExecutives at Carlton Department Store are excited ______ the fresh perspective that the new CEO is expected to bring to the organization.\n\n■ 空所に入るもの\nbe excited about X（Xにわくわくする）という組み合わせになる。\n→ 空所には「excited と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) about … 前置詞「〜について」 ○\n(B) to … 前置詞「〜へ」 ×\n(C) from … 前置詞「〜から」 ×\n(D) between … 前置詞「〜の間に」 ×\n\n■ 完成文\nExecutives at Carlton Department Store are excited about the fresh perspective that the new CEO is expected to bring to the organization.\n（Carlton 百貨店の経営陣は、新しい CEO が組織にもたらすと期待される新鮮な視点に期待を寄せている。）\n\n■ 解き方のポイント\nbe excited about／be worried about など、感情＋about は頻出。","words":[{"w":"Executives","p":"名詞","m":"経営陣"},{"w":"excited about","p":"熟語","m":"〜にわくわくする"},{"w":"perspective","p":"名詞","m":"視点"},{"w":"organization","p":"名詞","m":"組織"}]},{"id":670,"category":"文法模試 セット2（OCR素案）","question":"Rock singer Tina Wagner has been ______ welcomed by many designers as a new icon for American fashion.","A":"enthusiastic","B":"enthusiastically","C":"most enthusiastic","D":"enthusiasm","answer":"B","answer_word":"enthusiastically","explanation":"■ 文の骨格\nRock singer Tina Wagner has been ______ welcomed by many designers as a new icon for American fashion.\n\n■ 空所に入るもの\n現在完了受動態 has been welcomed の間に入る修飾語の位置。\n→ 空所には「過去分詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) enthusiastic … 形容詞「熱狂的な」 ×\n(B) enthusiastically … 副詞「熱狂的に」 ○\n(C) most enthusiastic … 形容詞（最上級）「最も熱狂的な」 ×\n(D) enthusiasm … 名詞「熱意」 ×\n\n■ 完成文\nRock singer Tina Wagner has been enthusiastically welcomed by many designers as a new icon for American fashion.\n（ロック歌手の Tina Wagner は、アメリカンファッションの新しい象徴として多くのデザイナーから熱狂的に迎えられている。）\n\n■ 解き方のポイント\n〈has been＋空所＋過去分詞〉は副詞の定位置。","words":[{"w":"enthusiastically","p":"副詞","m":"熱狂的に"},{"w":"welcomed","p":"動詞（過去分詞）","m":"迎えられた"},{"w":"icon","p":"名詞","m":"象徴"}]},{"id":671,"category":"文法模試 セット2（OCR素案）","question":"Return of any item for exchange or refund will be accepted ______ the item is in its original condition.","A":"in case","B":"only if","C":"as if","D":"even so","answer":"B","answer_word":"only if","explanation":"■ 文の骨格\nReturn of any item for exchange or refund will be accepted ______ the item is in its original condition.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、条件を限定する接続詞が文意に合う。\n→ 空所には「条件を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) in case … 接続詞（群）「〜の場合に備えて」 ×\n(B) only if … 接続詞（群）「〜の場合に限り」 ○\n(C) as if … 接続詞（群）「まるで〜のように」 ×\n(D) even so … 副詞句「たとえそうでも」 ×\n\n■ 完成文\nReturn of any item for exchange or refund will be accepted only if the item is in its original condition.\n（交換または返金のための商品返送は、商品が未使用の状態である場合に限り受け付けられる。）\n\n■ 解き方のポイント\nonly if＝「〜の場合に限り」。if より条件を強く限定する。","words":[{"w":"Return","p":"名詞","m":"返送"},{"w":"exchange","p":"名詞","m":"交換"},{"w":"refund","p":"名詞","m":"返金"},{"w":"only if","p":"熟語","m":"〜の場合に限り"},{"w":"original condition","p":"名詞","m":"元の状態"}]},{"id":672,"category":"文法模試 セット2（OCR素案）","question":"Fuel consumption is one of the most important factors ______ choosing a new vehicle.","A":"in","B":"but","C":"because","D":"even","answer":"A","answer_word":"in","explanation":"■ 文の骨格\nFuel consumption is one of the most important factors ______ choosing a new vehicle.\n\n■ 空所に入るもの\n空所の後ろが動名詞 choosing なので、前置詞が必要。\n→ 空所には「動名詞を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) in … 前置詞「〜において」 ○\n(B) but … 等位接続詞「しかし」 ×\n(C) because … 接続詞「〜なので」 ×\n(D) even … 副詞「〜さえ」 ×\n\n■ 完成文\nFuel consumption is one of the most important factors in choosing a new vehicle.\n（燃費は、新しい車を選ぶうえで最も重要な要素の1つだ。）\n\n■ 解き方のポイント\nin doing＝「〜する際に」。前置詞の後ろは動名詞。","words":[{"w":"Fuel consumption","p":"名詞","m":"燃費"},{"w":"factors","p":"名詞","m":"要素"},{"w":"in","p":"前置詞","m":"〜において"},{"w":"vehicle","p":"名詞","m":"車両"}]},{"id":673,"category":"文法模試 セット2（OCR素案）","question":"Frank Rich, a theater critic and columnist at Mongolia Times, ______ the paper to join Darkhan City magazine.","A":"leave","B":"has been left","C":"is leaving","D":"leaving","answer":"C","answer_word":"is leaving","explanation":"■ 文の骨格\nFrank Rich, a theater critic and columnist at Mongolia Times, ______ the paper to join Darkhan City magazine.\n\n■ 空所に入るもの\n主語 Frank Rich に対する述語動詞が欠けており、目的語 the paper があるので能動態。\n→ 空所には「能動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) leave … 動詞（原形・複数対応）「去る」 ×\n(B) has been left … 現在完了受動態「置き去りにされた」 ×\n(C) is leaving … 現在進行形「去ろうとしている」 ○\n(D) leaving … 現在分詞・動名詞「去ること」 ×\n\n■ 完成文\nFrank Rich, a theater critic and columnist at Mongolia Times, is leaving the paper to join Darkhan City magazine.\n（Mongolia Times 紙の演劇評論家兼コラムニストである Frank Rich は、同紙を離れて Darkhan City 誌に移る。）\n\n■ 解き方のポイント\n確定した予定は現在進行形で未来を表せる。直後に目的語があるので能動態。","words":[{"w":"theater critic","p":"名詞","m":"演劇評論家"},{"w":"columnist","p":"名詞","m":"コラムニスト"},{"w":"is leaving","p":"現在進行形","m":"去ろうとしている"},{"w":"join","p":"動詞","m":"加わる"}]},{"id":674,"category":"文法模試 セット2（OCR素案）","question":"A committee has been created to ______ new strategies to increase sales.","A":"deal","B":"proceed","C":"develop","D":"agree","answer":"C","answer_word":"develop","explanation":"■ 文の骨格\nA committee has been created to ______ new strategies to increase sales.\n\n■ 空所に入るもの\n直後に目的語 new strategies があるので、前置詞なしで目的語を取れる動詞が必要。\n→ 空所には「目的語を直接取る他動詞」が必要です。\n\n■ 選択肢の確認\n(A) deal … 動詞（原形）「対処する（with が必要）」 ×\n(B) proceed … 動詞（原形）「進む（自動詞）」 ×\n(C) develop … 動詞（原形）「策定する、開発する」 ○\n(D) agree … 動詞（原形）「同意する（自動詞）」 ×\n\n■ 完成文\nA committee has been created to develop new strategies to increase sales.\n（売上を伸ばす新しい戦略を策定するため、委員会が設置された。）\n\n■ 解き方のポイント\ndeal with／agree with のように前置詞が必要な動詞は目的語を直接取れない。","words":[{"w":"committee","p":"名詞","m":"委員会"},{"w":"develop","p":"動詞","m":"策定する"},{"w":"strategies","p":"名詞","m":"戦略"},{"w":"increase","p":"動詞","m":"伸ばす"}]},{"id":675,"category":"文法模試 セット2（OCR素案）","question":"With regard to the performance review, project managers ______ accountable for both their personal and team achievements.","A":"had held","B":"were held","C":"were holding","D":"was held","answer":"B","answer_word":"were held","explanation":"■ 文の骨格\nWith regard to the performance review, project managers ______ accountable for both their personal and team achievements.\n\n■ 空所に入るもの\n主語 project managers は複数で「責任を負わされる」側なので、複数対応の受動態が必要。\n→ 空所には「複数主語に対応する過去の受動態」が必要です。\n\n■ 選択肢の確認\n(A) had held … 過去完了（能動）「持っていた」 ×\n(B) were held … 受動態（過去・複数）「責任を負わされた」 ○\n(C) were holding … 過去進行形（能動）「持っていた」 ×\n(D) was held … 受動態（過去・単数）「責任を負わされた」 ×\n\n■ 完成文\nWith regard to the performance review, project managers were held accountable for both their personal and team achievements.\n（人事評価に関して、プロジェクトマネージャーは個人とチーム双方の成果について責任を負わされた。）\n\n■ 解き方のポイント\nbe held accountable for X＝「Xの責任を負わされる」。主語の数と一致させる。","words":[{"w":"performance review","p":"名詞","m":"人事評価"},{"w":"were held accountable","p":"熟語","m":"責任を負わされた"},{"w":"achievements","p":"名詞","m":"成果"}]},{"id":676,"category":"文法模試 セット2（OCR素案）","question":"Ms. Grace would like to extend her ______ to everyone for not being able to attend the award ceremony in person.","A":"apologize","B":"apologies","C":"apologetic","D":"apologized","answer":"B","answer_word":"apologies","explanation":"■ 文の骨格\nMs. Grace would like to extend her ______ to everyone for not being able to attend the award ceremony in person.\n\n■ 空所に入るもの\n所有格 her の後ろで、他動詞 extend の目的語となる名詞が必要。\n→ 空所には「extend の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) apologize … 動詞（原形）「謝る」 ×\n(B) apologies … 名詞（複数形）「おわび」 ○\n(C) apologetic … 形容詞「申し訳なさそうな」 ×\n(D) apologized … 動詞の過去形・過去分詞「謝った」 ×\n\n■ 完成文\nMs. Grace would like to extend her apologies to everyone for not being able to attend the award ceremony in person.\n（Grace さんは、授賞式に直接出席できないことについて皆さんにおわびを申し上げたいと考えている。）\n\n■ 解き方のポイント\nextend one's apologies＝「おわびを述べる」。〈所有格＋空所〉は名詞。","words":[{"w":"extend","p":"動詞","m":"（謝意などを）述べる"},{"w":"apologies","p":"名詞","m":"おわび"},{"w":"award ceremony","p":"名詞","m":"授賞式"},{"w":"in person","p":"熟語","m":"直接、本人が"}]},{"id":677,"category":"文法模試 セット2（OCR素案）","question":"Several convenient technologies have become available, and it is necessary to update the Web site ______ to maintain client satisfaction.","A":"accord","B":"according","C":"accordingly","D":"accordance","answer":"C","answer_word":"accordingly","explanation":"■ 文の骨格\nSeveral convenient technologies have become available, and it is necessary to update the Web site ______ to maintain client satisfaction.\n\n■ 空所に入るもの\nupdate the Web site で動詞と目的語がそろっており、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) accord … 名詞「一致」 ×\n(B) according … 前置詞（群の一部）「〜によれば」 ×\n(C) accordingly … 副詞「それに応じて」 ○\n(D) accordance … 名詞「一致、調和」 ×\n\n■ 完成文\nSeveral convenient technologies have become available, and it is necessary to update the Web site accordingly to maintain client satisfaction.\n（便利な技術がいくつか利用できるようになったため、顧客満足を維持するにはそれに応じてウェブサイトを更新する必要がある。）\n\n■ 解き方のポイント\naccording は according to の形でのみ使う。単独で副詞になるのは accordingly。","words":[{"w":"convenient","p":"形容詞","m":"便利な"},{"w":"update","p":"動詞","m":"更新する"},{"w":"accordingly","p":"副詞","m":"それに応じて"},{"w":"client satisfaction","p":"名詞","m":"顧客満足"}]},{"id":678,"category":"文法模試 セット3（OCR素案）","question":"All applicants must have ______ qualifications and at least three years' classroom experience.","A":"professional","B":"professionally","C":"profess","D":"profession","answer":"A","answer_word":"professional","explanation":"■ 文の骨格\nAll applicants must have ______ qualifications and at least three years' classroom experience.\n\n■ 空所に入るもの\n他動詞 have の目的語 qualifications を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) professional … 形容詞「専門職の」 ○\n(B) professionally … 副詞「専門的に」 ×\n(C) profess … 動詞（原形）「公言する」 ×\n(D) profession … 名詞「職業」 ×\n\n■ 完成文\nAll applicants must have professional qualifications and at least three years' classroom experience.\n（応募者は全員、専門職としての資格と最低3年の教室での指導経験を持っていなければならない。）\n\n■ 解き方のポイント\n名詞の直前の空所は形容詞。","words":[{"w":"applicants","p":"名詞","m":"応募者"},{"w":"professional","p":"形容詞","m":"専門職の"},{"w":"qualifications","p":"名詞","m":"資格"},{"w":"classroom experience","p":"名詞","m":"教室での指導経験"}]},{"id":679,"category":"文法模試 セット3（OCR素案）","question":"With its outstanding service, Nagisa Hotel recorded its ______ profits ever over the last year.","A":"higher","B":"more highly","C":"most highly","D":"highest","answer":"D","answer_word":"highest","explanation":"■ 文の骨格\nWith its outstanding service, Nagisa Hotel recorded its ______ profits ever over the last year.\n\n■ 空所に入るもの\n所有格 its と名詞 profits の間にあり、ever を伴って最上級をつくる形容詞が必要。\n→ 空所には「名詞を修飾する最上級の形容詞」が必要です。\n\n■ 選択肢の確認\n(A) higher … 形容詞（比較級）「より高い」 ×\n(B) more highly … 副詞（比較級）「より高度に」 ×\n(C) most highly … 副詞（最上級）「最も高度に」 ×\n(D) highest … 形容詞（最上級）「最高の」 ○\n\n■ 完成文\nWith its outstanding service, Nagisa Hotel recorded its highest profits ever over the last year.\n（卓越したサービスにより、Nagisa ホテルはこの1年で過去最高の利益を記録した。）\n\n■ 解き方のポイント\nits highest profits ever＝「過去最高の利益」。ever は最上級を強める。","words":[{"w":"outstanding","p":"形容詞","m":"卓越した"},{"w":"recorded","p":"動詞（過去形）","m":"記録した"},{"w":"highest","p":"最上級","m":"最高の"},{"w":"profits","p":"名詞","m":"利益"}]},{"id":680,"category":"文法模試 セット3（OCR素案）","question":"Managing ______ business, Ms. Martinez will rely on the experience she gained during several years as a bridal consultant.","A":"she","B":"hers","C":"herself","D":"her own","answer":"D","answer_word":"her own","explanation":"■ 文の骨格\nManaging ______ business, Ms. Martinez will rely on the experience she gained during several years as a bridal consultant.\n\n■ 空所に入るもの\n空所の後ろに名詞 business があり、「彼女自身の事業」を表す形が必要。\n→ 空所には「名詞を修飾する〈所有格＋own〉」が必要です。\n\n■ 選択肢の確認\n(A) she … 主格の代名詞「彼女は」 ×\n(B) hers … 所有代名詞「彼女のもの」 ×\n(C) herself … 再帰代名詞「彼女自身」 ×\n(D) her own … 所有格＋own「彼女自身の」 ○\n\n■ 完成文\nManaging her own business, Ms. Martinez will rely on the experience she gained during several years as a bridal consultant.\n（自身の事業を運営するにあたり、Martinez さんはブライダルコンサルタントとして数年間で得た経験を頼りにする。）\n\n■ 解き方のポイント\n〈空所＋名詞〉なので所有格を含む形。hers は名詞を伴えない。","words":[{"w":"Managing","p":"現在分詞","m":"運営するにあたり"},{"w":"her own","p":"所有表現","m":"彼女自身の"},{"w":"rely on","p":"熟語","m":"頼る"},{"w":"bridal consultant","p":"名詞","m":"ブライダルコンサルタント"}]},{"id":681,"category":"文法模試 セット3（OCR素案）","question":"With 80 rooms on nine floors, the Savoy Mountain Hotel offers the least ______ option in the vicinity of the Savoy National Park.","A":"expenses","B":"expense","C":"expensively","D":"expensive","answer":"D","answer_word":"expensive","explanation":"■ 文の骨格\nWith 80 rooms on nine floors, the Savoy Mountain Hotel offers the least ______ option in the vicinity of the Savoy National Park.\n\n■ 空所に入るもの\nthe least と名詞 option の間にあり、名詞を修飾する形容詞が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) expenses … 名詞（複数形）「経費」 ×\n(B) expense … 名詞「出費」 ×\n(C) expensively … 副詞「高価に」 ×\n(D) expensive … 形容詞「高価な」 ○\n\n■ 完成文\nWith 80 rooms on nine floors, the Savoy Mountain Hotel offers the least expensive option in the vicinity of the Savoy National Park.\n（9階建て80室を備える Savoy Mountain ホテルは、Savoy 国立公園周辺で最も安価な選択肢を提供している。）\n\n■ 解き方のポイント\nthe least＋形容詞＝「最も〜でない」。〈冠詞＋空所＋名詞〉は形容詞。","words":[{"w":"floors","p":"名詞","m":"階"},{"w":"the least expensive","p":"最上級","m":"最も安価な"},{"w":"option","p":"名詞","m":"選択肢"},{"w":"vicinity","p":"名詞","m":"近辺"}]},{"id":682,"category":"文法模試 セット3（OCR素案）","question":"At least one staff member must work in the office ______ 6 P.M. each night to take any last-minute orders from stores.","A":"by","B":"since","C":"until","D":"during","answer":"C","answer_word":"until","explanation":"■ 文の骨格\nAt least one staff member must work in the office ______ 6 P.M. each night to take any last-minute orders from stores.\n\n■ 空所に入るもの\n勤務が続く終点を表す前置詞が文意に合う。\n→ 空所には「継続の終点を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) by … 前置詞「〜までに（期限）」 ×\n(B) since … 前置詞「〜以来」 ×\n(C) until … 前置詞「〜まで（継続）」 ○\n(D) during … 前置詞「〜の間」 ×\n\n■ 完成文\nAt least one staff member must work in the office until 6 P.M. each night to take any last-minute orders from stores.\n（店舗からの直前の注文を受けるため、毎晩少なくとも1人の職員が午後6時まで事務所で勤務しなければならない。）\n\n■ 解き方のポイント\nuntil は動作の継続の終点、by は完了の期限。work と組むのは until。","words":[{"w":"At least","p":"熟語","m":"少なくとも"},{"w":"until","p":"前置詞","m":"〜まで"},{"w":"last-minute","p":"形容詞","m":"直前の"},{"w":"orders","p":"名詞","m":"注文"}]},{"id":683,"category":"文法模試 セット3（OCR素案）","question":"______ to gain approval for construction of a new retail outlet in the city center prompted the developers to look elsewhere for suitable locations.","A":"Failure","B":"To have failed","C":"Failing","D":"Fails","answer":"A","answer_word":"Failure","explanation":"■ 文の骨格\n______ to gain approval for construction of a new retail outlet in the city center prompted the developers to look elsewhere for suitable locations.\n\n■ 空所に入るもの\n述語動詞 prompted の主語が必要で、不定詞を後ろに従える名詞が入る。\n→ 空所には「文の主語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) Failure … 名詞「失敗」 ○\n(B) To have failed … 完了不定詞「失敗したこと」 ×\n(C) Failing … 現在分詞・動名詞「失敗すること」 ×\n(D) Fails … 動詞（三人称単数現在形）「失敗する」 ×\n\n■ 完成文\nFailure to gain approval for construction of a new retail outlet in the city center prompted the developers to look elsewhere for suitable locations.\n（市中心部に新しい小売店を建設する認可を得られなかったことで、開発業者は適地をほかに探すことになった。）\n\n■ 解き方のポイント\nfailure to do＝「〜できないこと」。名詞＋不定詞の形。","words":[{"w":"Failure","p":"名詞","m":"失敗"},{"w":"gain approval","p":"熟語","m":"認可を得る"},{"w":"retail outlet","p":"名詞","m":"小売店"},{"w":"prompted","p":"動詞（過去形）","m":"促した"}]},{"id":684,"category":"文法模試 セット3（OCR素案）","question":"______ has been said about the painter's outstanding technique, but few people comment on the subjects of her paintings.","A":"Much","B":"Many","C":"Other","D":"Nobody","answer":"A","answer_word":"Much","explanation":"■ 文の骨格\n______ has been said about the painter's outstanding technique, but few people comment on the subjects of her paintings.\n\n■ 空所に入るもの\n述語動詞 has been said に対応する単数扱いの主語が必要。\n→ 空所には「不可算扱いの主語になる代名詞」が必要です。\n\n■ 選択肢の確認\n(A) Much … 代名詞（不可算・単数扱い）「多くのこと」 ○\n(B) Many … 代名詞（可算・複数扱い）「多くのもの」 ×\n(C) Other … 形容詞「ほかの」 ×\n(D) Nobody … 代名詞「誰も〜ない」 ×\n\n■ 完成文\nMuch has been said about the painter's outstanding technique, but few people comment on the subjects of her paintings.\n（その画家の卓越した技巧については多くが語られてきたが、作品の題材について論じる人はほとんどいない。）\n\n■ 解き方のポイント\nmuc
