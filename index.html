,{"w":"introductory course","p":"名詞","m":"入門講座"}]},{"id":524,"category":"代名詞問題・実戦問題","question":"The new low-cost projectors allow purchasers to enjoy movies on a big screen in the comfort of ______ homes.","A":"they","B":"their own","C":"them","D":"it","answer":"B","answer_word":"their own","explanation":"■ 文の骨格\nThe new low-cost projectors allow purchasers to enjoy movies on a big screen in the comfort of ______ homes.\n\n■ 空所に入るもの\n空所の後ろに名詞 homes があり、「購入者自身の家」を表す形が必要。\n→ 空所には「名詞を修飾する〈所有格＋own〉」が必要です。\n\n■ 選択肢の確認\n(A) they … 主格の代名詞「彼らは」 ×\n(B) their own … 所有格＋own「彼ら自身の」 ○\n(C) them … 目的格の代名詞「彼らを」 ×\n(D) it … 代名詞（単数）「それ」 ×\n\n■ 完成文\nThe new low-cost projectors allow purchasers to enjoy movies on a big screen in the comfort of their own homes.\n（この新しい低価格プロジェクターにより、購入者は自宅にいながら大画面で映画を楽しめる。）\n\n■ 解き方のポイント\nin the comfort of one's own home＝「自宅でくつろぎながら」は定型表現。","words":[{"w":"low-cost","p":"形容詞","m":"低価格の"},{"w":"purchasers","p":"名詞","m":"購入者"},{"w":"comfort","p":"名詞","m":"快適さ"},{"w":"their own","p":"所有表現","m":"彼ら自身の"}]},{"id":525,"category":"代名詞問題・実戦問題","question":"You can purchase used pianos at a fraction of ______ retail value by attending a musical instrument auction in Whitehaven this weekend.","A":"its","B":"my","C":"their","D":"our","answer":"C","answer_word":"their","explanation":"■ 文の骨格\nYou can purchase used pianos at a fraction of ______ retail value by attending a musical instrument auction in Whitehaven this weekend.\n\n■ 空所に入るもの\n空所の後ろに名詞句 retail value があり、複数名詞 used pianos を受ける所有格が必要。\n→ 空所には「名詞を修飾する所有格（複数）」が必要です。\n\n■ 選択肢の確認\n(A) its … 所有格（単数）「その」 ×\n(B) my … 所有格（一人称）「私の」 ×\n(C) their … 所有格（複数）「それらの」 ○\n(D) our … 所有格（一人称複数）「私たちの」 ×\n\n■ 完成文\nYou can purchase used pianos at a fraction of their retail value by attending a musical instrument auction in Whitehaven this weekend.\n（今週末に Whitehaven で開かれる楽器オークションに参加すれば、中古ピアノを小売価格のごく一部で購入できる。）\n\n■ 解き方のポイント\n何を指す所有格かを確認する。used pianos は複数なので their。","words":[{"w":"used pianos","p":"名詞","m":"中古ピアノ"},{"w":"a fraction of","p":"熟語","m":"〜のごく一部"},{"w":"retail value","p":"名詞","m":"小売価格"},{"w":"musical instrument","p":"名詞","m":"楽器"}]},{"id":526,"category":"代名詞問題・実戦問題","question":"The new home improvement app has a free demo version so that you can gauge its value for ______ before purchasing the full package.","A":"you","B":"your","C":"yours","D":"yourself","answer":"D","answer_word":"yourself","explanation":"■ 文の骨格\nThe new home improvement app has a free demo version so that you can gauge its value for ______ before purchasing the full package.\n\n■ 空所に入るもの\nfor oneself（自分で）という慣用表現になり、主語 you と一致させる。\n→ 空所には「for oneself の形をつくる再帰代名詞」が必要です。\n\n■ 選択肢の確認\n(A) you … 主格・目的格「あなたは／あなたを」 ×\n(B) your … 所有格「あなたの」 ×\n(C) yours … 所有代名詞「あなたのもの」 ×\n(D) yourself … 再帰代名詞「あなた自身で」 ○\n\n■ 完成文\nThe new home improvement app has a free demo version so that you can gauge its value for yourself before purchasing the full package.\n（この新しい住宅リフォームアプリには無料の体験版があるので、製品版を買う前に自分でその価値を確かめられる。）\n\n■ 解き方のポイント\nfor oneself＝「自分で（他人の力を借りずに）」。主語に合わせて yourself。","words":[{"w":"home improvement","p":"名詞","m":"住宅リフォーム"},{"w":"demo version","p":"名詞","m":"体験版"},{"w":"gauge","p":"動詞","m":"測る、判断する"},{"w":"for yourself","p":"熟語","m":"自分で"}]},{"id":527,"category":"代名詞問題・実戦問題","question":"In the survey, participants were asked which of the three fruit drinks ______ would like to buy.","A":"they","B":"their","C":"them","D":"themselves","answer":"A","answer_word":"they","explanation":"■ 文の骨格\nIn the survey, participants were asked which of the three fruit drinks ______ would like to buy.\n\n■ 空所に入るもの\nwhich 節の中で would like to buy の主語が欠けている。\n→ 空所には「節の主語になる主格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) they … 主格の代名詞「彼らは」 ○\n(B) their … 所有格「彼らの」 ×\n(C) them … 目的格の代名詞「彼らを」 ×\n(D) themselves … 再帰代名詞「彼ら自身」 ×\n\n■ 完成文\nIn the survey, participants were asked which of the three fruit drinks they would like to buy.\n（その調査で、参加者は3種類のフルーツドリンクのうちどれを買いたいか尋ねられた。）\n\n■ 解き方のポイント\n間接疑問の中も〈主語＋動詞〉。動詞の前で主語が欠けていれば主格。","words":[{"w":"survey","p":"名詞","m":"調査"},{"w":"participants","p":"名詞","m":"参加者"},{"w":"would like to","p":"熟語","m":"〜したい"}]},{"id":528,"category":"代名詞問題・実戦問題","question":"______ of the exhibits at the aquarium include fish commonly found along rocky Hawaiian shorelines.","A":"One","B":"Theirs","C":"Some","D":"They","answer":"C","answer_word":"Some","explanation":"■ 文の骨格\n______ of the exhibits at the aquarium include fish commonly found along rocky Hawaiian shorelines.\n\n■ 空所に入るもの\n述語動詞 include（複数対応）に合う主語が必要。\n→ 空所には「複数扱いの主語になる代名詞」が必要です。\n\n■ 選択肢の確認\n(A) One … 代名詞（単数扱い）「1つ」 ×\n(B) Theirs … 所有代名詞「彼らのもの」 ×\n(C) Some … 代名詞（複数扱い）「いくつか」 ○\n(D) They … 主格の代名詞「彼らは」 ×\n\n■ 完成文\nSome of the exhibits at the aquarium include fish commonly found along rocky Hawaiian shorelines.\n（その水族館の展示のいくつかには、ハワイの岩場の海岸沿いでよく見られる魚が含まれている。）\n\n■ 解き方のポイント\nOne of ... なら動詞は単数（includes）。動詞の形から主語の数を判断する。","words":[{"w":"exhibits","p":"名詞","m":"展示"},{"w":"aquarium","p":"名詞","m":"水族館"},{"w":"commonly","p":"副詞","m":"よく、一般的に"},{"w":"shorelines","p":"名詞","m":"海岸線"}]},{"id":529,"category":"代名詞問題・実戦問題","question":"If you have not received an ID badge, please obtain ______ from the personnel department.","A":"one","B":"each","C":"any","D":"either","answer":"A","answer_word":"one","explanation":"■ 文の骨格\nIf you have not received an ID badge, please obtain ______ from the personnel department.\n\n■ 空所に入るもの\n直前の an ID badge と同種のもの「1つ」を指す代名詞が必要。\n→ 空所には「前に出た可算名詞を受ける代名詞」が必要です。\n\n■ 選択肢の確認\n(A) one … 不定代名詞「（同種のものの）1つ」 ○\n(B) each … 代名詞「それぞれ」 ×\n(C) any … 代名詞「いずれか」 ×\n(D) either … 代名詞「2つのうちどちらか」 ×\n\n■ 完成文\nIf you have not received an ID badge, please obtain one from the personnel department.\n（ID バッジをまだ受け取っていない場合は、人事部で1つ受け取ってください。）\n\n■ 解き方のポイント\none は「同種の別の1つ」、it は「その物そのもの」。区別が狙われる。","words":[{"w":"obtain","p":"動詞","m":"受け取る、入手する"},{"w":"ID badge","p":"名詞","m":"ID バッジ"},{"w":"personnel department","p":"名詞","m":"人事部"}]},{"id":530,"category":"代名詞問題・実戦問題","question":"Purchase two of Eric Schneider's popular rock 'n' roll CDs and get ______ free of charge.","A":"each other","B":"another","C":"other","D":"one another","answer":"B","answer_word":"another","explanation":"■ 文の骨格\nPurchase two of Eric Schneider's popular rock 'n' roll CDs and get ______ free of charge.\n\n■ 空所に入るもの\nすでに述べたものに加えて「さらにもう1枚」を表す語が必要。\n→ 空所には「「もう1つ」を表す代名詞」が必要です。\n\n■ 選択肢の確認\n(A) each other … 相互代名詞「お互い（2者）」 ×\n(B) another … 不定代名詞「もう1つ」 ○\n(C) other … 形容詞「ほかの」 ×\n(D) one another … 相互代名詞「お互い（3者以上）」 ×\n\n■ 完成文\nPurchase two of Eric Schneider's popular rock 'n' roll CDs and get another free of charge.\n（Eric Schneider の人気ロックンロール CD を2枚買うと、もう1枚が無料になります。）\n\n■ 解き方のポイント\nanother＝an＋other。単独で「もう1つ」を表せるが、other は単独では使えない。","words":[{"w":"Purchase","p":"動詞","m":"購入する"},{"w":"another","p":"代名詞","m":"もう1つ"},{"w":"free of charge","p":"熟語","m":"無料で"}]},{"id":531,"category":"代名詞問題・実戦問題","question":"It was a point of contention that Mr. Cox's research results were different from ______ of his colleagues.","A":"those","B":"it","C":"them","D":"theirs","answer":"A","answer_word":"those","explanation":"■ 文の骨格\nIt was a point of contention that Mr. Cox's research results were different from ______ of his colleagues.\n\n■ 空所に入るもの\n前の複数名詞 research results と同種のものを指す代名詞が必要。\n→ 空所には「前に出た複数名詞を受ける代名詞」が必要です。\n\n■ 選択肢の確認\n(A) those … 代名詞（複数）「〜のもの」 ○\n(B) it … 代名詞（単数）「それ」 ×\n(C) them … 目的格の代名詞「それらを」 ×\n(D) theirs … 所有代名詞「彼らのもの」 ×\n\n■ 完成文\nIt was a point of contention that Mr. Cox's research results were different from those of his colleagues.\n（Cox 氏の研究結果が同僚のものと異なっていたことが、議論の的となった。）\n\n■ 解き方のポイント\n比較で前出の名詞を繰り返さないときは that（単数）／those（複数）を使う。","words":[{"w":"point of contention","p":"名詞","m":"議論の的"},{"w":"research results","p":"名詞","m":"研究結果"},{"w":"those","p":"代名詞","m":"（前出の）もの"},{"w":"colleagues","p":"名詞","m":"同僚"}]},{"id":532,"category":"代名詞問題・実戦問題","question":"______ of the customers at Philips Grill have complimented the chef for his professionalism and the wonderful gourmet experience provided.","A":"Whomever","B":"Several","C":"Someone","D":"Everybody","answer":"B","answer_word":"Several","explanation":"■ 文の骨格\n______ of the customers at Philips Grill have complimented the chef for his professionalism and the wonderful gourmet experience provided.\n\n■ 空所に入るもの\n述語動詞 have complimented に対応する複数扱いの主語が必要。\n→ 空所には「複数扱いの主語になる代名詞」が必要です。\n\n■ 選択肢の確認\n(A) Whomever … 複合関係代名詞（目的格）「〜する人を誰でも」 ×\n(B) Several … 代名詞（複数扱い）「数人」 ○\n(C) Someone … 代名詞（単数扱い）「誰か」 ×\n(D) Everybody … 代名詞（単数扱い）「誰もが」 ×\n\n■ 完成文\nSeveral of the customers at Philips Grill have complimented the chef for his professionalism and the wonderful gourmet experience provided.\n（Philips Grill の客の何人かは、シェフのプロ意識とすばらしい美食体験を称賛している。）\n\n■ 解き方のポイント\nSomeone / Everybody は単数扱いで of ... を伴わない。動詞 have が決め手。","words":[{"w":"Several","p":"代名詞","m":"数人、いくつか"},{"w":"complimented","p":"動詞（過去分詞）","m":"称賛した"},{"w":"professionalism","p":"名詞","m":"プロ意識"},{"w":"gourmet","p":"形容詞","m":"美食の"}]},{"id":533,"category":"前置詞問題・実戦問題","question":"The Tokyo Eye is one of the newest landmarks in the capital, and is already ______ the most popular tourist destinations.","A":"from","B":"into","C":"among","D":"throughout","answer":"C","answer_word":"among","explanation":"■ 文の骨格\nThe Tokyo Eye is one of the newest landmarks in the capital, and is already ______ the most popular tourist destinations.\n\n■ 空所に入るもの\n後ろが複数名詞句で、「〜の中に入っている」を表す前置詞が必要。\n→ 空所には「複数名詞を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) from … 前置詞「〜から」 ×\n(B) into … 前置詞「〜の中へ」 ×\n(C) among … 前置詞「〜の中に（3つ以上）」 ○\n(D) throughout … 前置詞「〜の至る所に」 ×\n\n■ 完成文\nThe Tokyo Eye is one of the newest landmarks in the capital, and is already among the most popular tourist destinations.\n（Tokyo Eye は首都で最も新しい名所の1つで、すでに最も人気のある観光地の1つに数えられている。）\n\n■ 解き方のポイント\namong the most ...＝「最も〜なものの1つ」。3つ以上の中では among。","words":[{"w":"landmarks","p":"名詞","m":"名所"},{"w":"capital","p":"名詞","m":"首都"},{"w":"among","p":"前置詞","m":"〜の中に"},{"w":"tourist destinations","p":"名詞","m":"観光地"}]},{"id":534,"category":"前置詞問題・実戦問題","question":"Just six months ______ a career with Cooper Advertising, Mr. Harlan was offered the branch manager position.","A":"into","B":"throughout","C":"since","D":"over","answer":"A","answer_word":"into","explanation":"■ 文の骨格\nJust six months ______ a career with Cooper Advertising, Mr. Harlan was offered the branch manager position.\n\n■ 空所に入るもの\n〈期間＋into＋名詞〉で「〜に入って…後」を表す形になる。\n→ 空所には「期間表現と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) into … 前置詞「〜に入って」 ○\n(B) throughout … 前置詞「〜の間じゅう」 ×\n(C) since … 前置詞・接続詞「〜以来」 ×\n(D) over … 前置詞「〜にわたって」 ×\n\n■ 完成文\nJust six months into a career with Cooper Advertising, Mr. Harlan was offered the branch manager position.\n（Cooper Advertising 社でのキャリアをわずか6か月続けた時点で、Harlan さんは支店長職を打診された。）\n\n■ 解き方のポイント\nsix months into X＝「Xを始めて6か月の時点で」。時間表現と into の組み合わせ。","words":[{"w":"career","p":"名詞","m":"キャリア、職歴"},{"w":"into","p":"前置詞","m":"〜に入って"},{"w":"offered","p":"動詞（過去分詞）","m":"打診された"},{"w":"branch manager","p":"名詞","m":"支店長"}]},{"id":535,"category":"前置詞問題・実戦問題","question":"On the day of the audition, entrants need to arrive at the Northern Star Playhouse ______ 7:00 A.M.","A":"early","B":"ahead","C":"before","D":"prior","answer":"C","answer_word":"before","explanation":"■ 文の骨格\nOn the day of the audition, entrants need to arrive at the Northern Star Playhouse ______ 7:00 A.M.\n\n■ 空所に入るもの\n後ろが時刻 7:00 A.M. なので、時刻を目的語に取れる前置詞が必要。\n→ 空所には「時刻を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) early … 形容詞・副詞「早い／早く」 ×\n(B) ahead … 副詞「前方に」 ×\n(C) before … 前置詞「〜より前に」 ○\n(D) prior … 形容詞「事前の」 ×\n\n■ 完成文\nOn the day of the audition, entrants need to arrive at the Northern Star Playhouse before 7:00 A.M.\n（オーディション当日、参加者は午前7時より前に Northern Star Playhouse に到着する必要がある。）\n\n■ 解き方のポイント\nprior は prior to の形でのみ前置詞として働く。単独では使えない。","words":[{"w":"audition","p":"名詞","m":"オーディション"},{"w":"entrants","p":"名詞","m":"参加者"},{"w":"arrive at","p":"熟語","m":"〜に到着する"},{"w":"before","p":"前置詞","m":"〜より前に"}]},{"id":536,"category":"前置詞問題・実戦問題","question":"Over one hundred guests have been invited to the Royal Hotel ______ the reception after the medical conference next week.","A":"on","B":"from","C":"for","D":"across","answer":"C","answer_word":"for","explanation":"■ 文の骨格\nOver one hundred guests have been invited to the Royal Hotel ______ the reception after the medical conference next week.\n\n■ 空所に入るもの\n招待の目的を表す前置詞が文意に合う。\n→ 空所には「目的を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) on … 前置詞「〜の上に」 ×\n(B) from … 前置詞「〜から」 ×\n(C) for … 前置詞「〜のために」 ○\n(D) across … 前置詞「〜を横切って」 ×\n\n■ 完成文\nOver one hundred guests have been invited to the Royal Hotel for the reception after the medical conference next week.\n（来週の医学会議のあとのレセプションのために、100人を超える来賓が Royal ホテルに招待されている。）\n\n■ 解き方のポイント\ninvite X to 場所 for 目的 の形。for は目的を表す。","words":[{"w":"guests","p":"名詞","m":"来賓"},{"w":"invited","p":"動詞（過去分詞）","m":"招待された"},{"w":"reception","p":"名詞","m":"レセプション、歓迎会"},{"w":"medical conference","p":"名詞","m":"医学会議"}]},{"id":537,"category":"前置詞問題・実戦問題","question":"Because it is a growing company, with sales topping $1 billion last year, Bruno Building always has a construction project ______ progress.","A":"on","B":"from","C":"during","D":"in","answer":"D","answer_word":"in","explanation":"■ 文の骨格\nBecause it is a growing company, with sales topping $1 billion last year, Bruno Building always has a construction project ______ progress.\n\n■ 空所に入るもの\nin progress（進行中で）という定型表現になる。\n→ 空所には「定型表現をつくる前置詞」が必要です。\n\n■ 選択肢の確認\n(A) on … 前置詞「〜の上に」 ×\n(B) from … 前置詞「〜から」 ×\n(C) during … 前置詞「〜の間」 ×\n(D) in … 前置詞「〜の状態で」 ○\n\n■ 完成文\nBecause it is a growing company, with sales topping $1 billion last year, Bruno Building always has a construction project in progress.\n（昨年の売上が10億ドルを超える成長企業であるため、Bruno Building 社は常に進行中の建設案件を抱えている。）\n\n■ 解き方のポイント\nin progress＝「進行中で」。前置詞と名詞の組み合わせは丸ごと覚える。","words":[{"w":"growing","p":"形容詞","m":"成長している"},{"w":"topping","p":"現在分詞","m":"〜を超えている"},{"w":"construction project","p":"名詞","m":"建設案件"},{"w":"in progress","p":"熟語","m":"進行中で"}]},{"id":538,"category":"前置詞問題・実戦問題","question":"The National Business Travel Association expects corporate car rental rates to increase ______ two percent this year.","A":"in","B":"by","C":"on","D":"with","answer":"B","answer_word":"by","explanation":"■ 文の骨格\nThe National Business Travel Association expects corporate car rental rates to increase ______ two percent this year.\n\n■ 空所に入るもの\nincrease／decrease の後ろで「どれだけ変化したか」を表す前置詞が必要。\n→ 空所には「差・変化の幅を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) in … 前置詞「〜の中に」 ×\n(B) by … 前置詞「〜だけ（差）」 ○\n(C) on … 前置詞「〜の上に」 ×\n(D) with … 前置詞「〜とともに」 ×\n\n■ 完成文\nThe National Business Travel Association expects corporate car rental rates to increase by two percent this year.\n（全米ビジネストラベル協会は、今年の法人向けレンタカー料金が2％上昇すると見込んでいる。）\n\n■ 解き方のポイント\nincrease by 2 percent＝「2％分だけ上昇」。increase to なら「2％まで上昇」。","words":[{"w":"Association","p":"名詞","m":"協会"},{"w":"corporate","p":"形容詞","m":"法人の"},{"w":"rental rates","p":"名詞","m":"レンタル料金"},{"w":"increase","p":"動詞","m":"上昇する"}]},{"id":539,"category":"前置詞問題・実戦問題","question":"E-Marketing Solutions is offering a two-week program for people who want to learn more ______ digital marketing.","A":"near","B":"about","C":"beyond","D":"among","answer":"B","answer_word":"about","explanation":"■ 文の骨格\nE-Marketing Solutions is offering a two-week program for people who want to learn more ______ digital marketing.\n\n■ 空所に入るもの\nlearn about X（Xについて学ぶ）という組み合わせになる。\n→ 空所には「learn と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) near … 前置詞「〜の近くに」 ×\n(B) about … 前置詞「〜について」 ○\n(C) beyond … 前置詞「〜を越えて」 ×\n(D) among … 前置詞「〜の中で」 ×\n\n■ 完成文\nE-Marketing Solutions is offering a two-week program for people who want to learn more about digital marketing.\n（E-Marketing Solutions 社は、デジタルマーケティングについてもっと学びたい人向けに2週間のプログラムを提供している。）\n\n■ 解き方のポイント\nlearn about／hear about／talk about など、about は「〜について」。","words":[{"w":"offering","p":"現在分詞","m":"提供している"},{"w":"two-week","p":"形容詞","m":"2週間の"},{"w":"learn about","p":"熟語","m":"〜について学ぶ"},{"w":"digital marketing","p":"名詞","m":"デジタルマーケティング"}]},{"id":540,"category":"前置詞問題・実戦問題","question":"At today's press conference, the CEO declined to comment ______ the possibility of a merger.","A":"to","B":"on","C":"from","D":"at","answer":"B","answer_word":"on","explanation":"■ 文の骨格\nAt today's press conference, the CEO declined to comment ______ the possibility of a merger.\n\n■ 空所に入るもの\ncomment on X（Xについて論評する）という組み合わせになる。\n→ 空所には「comment と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) to … 前置詞「〜へ」 ×\n(B) on … 前置詞「〜について」 ○\n(C) from … 前置詞「〜から」 ×\n(D) at … 前置詞「〜で」 ×\n\n■ 完成文\nAt today's press conference, the CEO declined to comment on the possibility of a merger.\n（本日の記者会見で、CEO は合併の可能性についてコメントを控えた。）\n\n■ 解き方のポイント\ncomment on／focus on／depend on など、動詞と前置詞はセットで覚える。","words":[{"w":"press conference","p":"名詞","m":"記者会見"},{"w":"declined","p":"動詞（過去形）","m":"断った、控えた"},{"w":"comment on","p":"熟語","m":"〜について論評する"},{"w":"merger","p":"名詞","m":"合併"}]},{"id":541,"category":"前置詞問題・実戦問題","question":"The popular online service is gaining new subscribers ______ the rate of about one million every two months.","A":"from","B":"on","C":"into","D":"at","answer":"D","answer_word":"at","explanation":"■ 文の骨格\nThe popular online service is gaining new subscribers ______ the rate of about one million every two months.\n\n■ 空所に入るもの\nat the rate of X（Xの割合で）という定型表現になる。\n→ 空所には「割合・速度を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) from … 前置詞「〜から」 ×\n(B) on … 前置詞「〜の上に」 ×\n(C) into … 前置詞「〜の中へ」 ×\n(D) at … 前置詞「〜の割合で」 ○\n\n■ 完成文\nThe popular online service is gaining new subscribers at the rate of about one million every two months.\n（その人気オンラインサービスは、2か月ごとに約100万人という割合で新規加入者を増やしている。）\n\n■ 解き方のポイント\nat the rate of／at a speed of のように、割合・速度は at。","words":[{"w":"gaining","p":"現在分詞","m":"増やしている"},{"w":"subscribers","p":"名詞","m":"加入者"},{"w":"at the rate of","p":"熟語","m":"〜の割合で"},{"w":"million","p":"名詞","m":"100万"}]},{"id":542,"category":"前置詞問題・実戦問題","question":"All contract documents should be sent to our legal office ______ priority mail.","A":"to","B":"by","C":"against","D":"outside","answer":"B","answer_word":"by","explanation":"■ 文の骨格\nAll contract documents should be sent to our legal office ______ priority mail.\n\n■ 空所に入るもの\n「〜によって、〜で」という手段・方法を表す前置詞が必要。\n→ 空所には「手段を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) to … 前置詞「〜へ」 ×\n(B) by … 前置詞「〜によって」 ○\n(C) against … 前置詞「〜に反して」 ×\n(D) outside … 前置詞「〜の外側に」 ×\n\n■ 完成文\nAll contract documents should be sent to our legal office by priority mail.\n（契約書類はすべて、優先郵便で当社の法務部へ送ってください。）\n\n■ 解き方のポイント\nby mail／by phone／by car のように、手段の by は冠詞なしの名詞と組む。","words":[{"w":"contract documents","p":"名詞","m":"契約書類"},{"w":"legal office","p":"名詞","m":"法務部"},{"w":"priority mail","p":"名詞","m":"優先郵便"}]},{"id":543,"category":"前置詞問題・実戦問題","question":"Beaver Creek Resource Management is looking to hire three student interns ______ the summer to work on the Brett Gray Ranch in Colorado.","A":"for","B":"at","C":"to","D":"as","answer":"A","answer_word":"for","explanation":"■ 文の骨格\nBeaver Creek Resource Management is looking to hire three student interns ______ the summer to work on the Brett Gray Ranch in Colorado.\n\n■ 空所に入るもの\n雇用の期間を表す前置詞が必要。\n→ 空所には「期間を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) for … 前置詞「〜の間（期間）」 ○\n(B) at … 前置詞「〜で（地点）」 ×\n(C) to … 前置詞「〜へ」 ×\n(D) as … 前置詞「〜として」 ×\n\n■ 完成文\nBeaver Creek Resource Management is looking to hire three student interns for the summer to work on the Brett Gray Ranch in Colorado.\n（Beaver Creek Resource Management 社は、コロラドの Brett Gray 牧場で働く学生インターンを夏の間3名雇う予定だ。）\n\n■ 解き方のポイント\nfor＋期間の長さ。during＋特定の期間名という違いもあるが、the summer は for でも使える。","words":[{"w":"hire","p":"動詞","m":"雇う"},{"w":"interns","p":"名詞","m":"インターン"},{"w":"for","p":"前置詞","m":"〜の間"},{"w":"Ranch","p":"名詞","m":"牧場"}]},{"id":544,"category":"前置詞問題・実戦問題","question":"Due to the forecast of rain, the concert will be held in Joe Louis Arena ______ the outdoor stage at Comerica Park.","A":"rather","B":"despite","C":"instead of","D":"aside from","answer":"C","answer_word":"instead of","explanation":"■ 文の骨格\nDue to the forecast of rain, the concert will be held in Joe Louis Arena ______ the outdoor stage at Comerica Park.\n\n■ 空所に入るもの\n本来の会場「ではなく」別の会場で開くという意味を表す前置詞が必要。\n→ 空所には「代替を表す群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) rather … 副詞「むしろ」 ×\n(B) despite … 前置詞「〜にもかかわらず」 ×\n(C) instead of … 群前置詞「〜の代わりに」 ○\n(D) aside from … 群前置詞「〜のほかに」 ×\n\n■ 完成文\nDue to the forecast of rain, the concert will be held in Joe Louis Arena instead of the outdoor stage at Comerica Park.\n（雨の予報のため、コンサートは Comerica Park の屋外ステージではなく Joe Louis Arena で開催される。）\n\n■ 解き方のポイント\ninstead of＋名詞。rather は rather than の形で使う。","words":[{"w":"forecast","p":"名詞","m":"予報"},{"w":"held","p":"動詞（過去分詞）","m":"開催される"},{"w":"instead of","p":"熟語","m":"〜の代わりに"},{"w":"outdoor stage","p":"名詞","m":"屋外ステージ"}]},{"id":545,"category":"前置詞問題・実戦問題","question":"There is an extensive library of books on marketing and sales in the office which can be borrowed ______ a monthly basis.","A":"at","B":"in","C":"on","D":"with","answer":"C","answer_word":"on","explanation":"■ 文の骨格\nThere is an extensive library of books on marketing and sales in the office which can be borrowed ______ a monthly basis.\n\n■ 空所に入るもの\non a ... basis（〜単位で）という定型表現になる。\n→ 空所には「定型表現をつくる前置詞」が必要です。\n\n■ 選択肢の確認\n(A) at … 前置詞「〜で（地点）」 ×\n(B) in … 前置詞「〜の中に」 ×\n(C) on … 前置詞「〜の方式で」 ○\n(D) with … 前置詞「〜とともに」 ×\n\n■ 完成文\nThere is an extensive library of books on marketing and sales in the office which can be borrowed on a monthly basis.\n（社内にはマーケティングと営業に関する豊富な蔵書があり、月単位で借りることができる。）\n\n■ 解き方のポイント\non a monthly [regular / daily] basis＝「月ごとに／定期的に」。","words":[{"w":"extensive","p":"形容詞","m":"豊富な"},{"w":"borrowed","p":"動詞（過去分詞）","m":"借りられる"},{"w":"on a monthly basis","p":"熟語","m":"月単位で"}]},{"id":546,"category":"前置詞問題・実戦問題","question":"As a token of appreciation ______ her 20 years of hard work, Mary Wilson was given a gold watch as a parting gift.","A":"into","B":"from","C":"above","D":"for","answer":"D","answer_word":"for","explanation":"■ 文の骨格\nAs a token of appreciation ______ her 20 years of hard work, Mary Wilson was given a gold watch as a parting gift.\n\n■ 空所に入るもの\nappreciation for X（Xに対する感謝）という組み合わせになる。\n→ 空所には「appreciation と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) into … 前置詞「〜の中へ」 ×\n(B) from … 前置詞「〜から」 ×\n(C) above … 前置詞「〜の上に」 ×\n(D) for … 前置詞「〜に対する」 ○\n\n■ 完成文\nAs a token of appreciation for her 20 years of hard work, Mary Wilson was given a gold watch as a parting gift.\n（20年間の献身的な働きへの感謝の印として、Mary Wilson は餞別に金時計を贈られた。）\n\n■ 解き方のポイント\nas a token of appreciation for X＝「Xへの感謝の印として」。","words":[{"w":"token","p":"名詞","m":"印、しるし"},{"w":"appreciation","p":"名詞","m":"感謝"},{"w":"hard work","p":"名詞","m":"献身的な働き"},{"w":"parting gift","p":"名詞","m":"餞別"}]},{"id":547,"category":"前置詞問題・実戦問題","question":"Miles Smith used a projector set up ______ the conference room to deliver his report on the company's sales performance.","A":"on","B":"to","C":"in","D":"for","answer":"C","answer_word":"in","explanation":"■ 文の骨格\nMiles Smith used a projector set up ______ the conference room to deliver his report on the company's sales performance.\n\n■ 空所に入るもの\n「〜の中に」という空間の内部を表す前置詞が必要。\n→ 空所には「場所を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) on … 前置詞「〜の上に」 ×\n(B) to … 前置詞「〜へ」 ×\n(C) in … 前置詞「〜の中に」 ○\n(D) for … 前置詞「〜のために」 ×\n\n■ 完成文\nMiles Smith used a projector set up in the conference room to deliver his report on the company's sales performance.\n（Miles Smith は会議室に設置されたプロジェクターを使って、会社の営業成績に関する報告を行った。）\n\n■ 解き方のポイント\n部屋・建物の内部は in、平面の上は on、地点は at。","words":[{"w":"projector","p":"名詞","m":"プロジェクター"},{"w":"set up","p":"熟語","m":"設置された"},{"w":"conference room","p":"名詞","m":"会議室"},{"w":"deliver","p":"動詞","m":"（報告などを）行う"}]},{"id":548,"category":"前置詞問題・実戦問題","question":"______ a typical Saturday night, the restaurant serves as many as 800 patrons between the hours of 6 P.M. and 10 P.M.","A":"At","B":"On","C":"In","D":"Over","answer":"B","answer_word":"On","explanation":"■ 文の骨格\n______ a typical Saturday night, the restaurant serves as many as 800 patrons between the hours of 6 P.M. and 10 P.M.\n\n■ 空所に入るもの\n特定の曜日や日、その夜を表す場合の前置詞が必要。\n→ 空所には「特定の曜日・日を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) At … 前置詞「〜で（時刻）」 ×\n(B) On … 前置詞「〜に（曜日・日）」 ○\n(C) In … 前置詞「〜に（月・年）」 ×\n(D) Over … 前置詞「〜にわたって」 ×\n\n■ 完成文\nOn a typical Saturday night, the restaurant serves as many as 800 patrons between the hours of 6 P.M. and 10 P.M.\n（典型的な土曜の夜には、そのレストランは午後6時から10時の間に800人もの客に食事を提供する。）\n\n■ 解き方のポイント\nat＋時刻、on＋曜日・日付、in＋月・年。ただし特定の日の朝・夜は on。","words":[{"w":"typical","p":"形容詞","m":"典型的な"},{"w":"serves","p":"動詞","m":"提供する"},{"w":"as many as","p":"熟語","m":"〜もの"},{"w":"patrons","p":"名詞","m":"客"}]},{"id":549,"category":"前置詞問題・実戦問題","question":"A snowstorm in New York caused flight delays that prevented Ms. Jimenez ______ arriving until yesterday.","A":"from","B":"on","C":"into","D":"at","answer":"A","answer_word":"from","explanation":"■ 文の骨格\nA snowstorm in New York caused flight delays that prevented Ms. Jimenez ______ arriving until yesterday.\n\n■ 空所に入るもの\nprevent X from doing（Xが〜するのを妨げる）という組み合わせになる。\n→ 空所には「prevent と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) from … 前置詞「〜から」 ○\n(B) on … 前置詞「〜の上に」 ×\n(C) into … 前置詞「〜の中へ」 ×\n(D) at … 前置詞「〜で」 ×\n\n■ 完成文\nA snowstorm in New York caused flight delays that prevented Ms. Jimenez from arriving until yesterday.\n（ニューヨークの吹雪が欠航・遅延を招き、Jimenez さんは昨日まで到着できなかった。）\n\n■ 解き方のポイント\nprevent／stop／keep／prohibit ＋X＋from doing はセットで覚える。","words":[{"w":"snowstorm","p":"名詞","m":"吹雪"},{"w":"flight delays","p":"名詞","m":"運航の遅延"},{"w":"prevented","p":"動詞（過去形）","m":"妨げた"},{"w":"arriving","p":"動名詞","m":"到着すること"}]},{"id":550,"category":"前置詞問題・実戦問題","question":"In addition to signing up for our free daily newsletter, be sure to visit our TechInfo blog for updates ______ the day.","A":"throughout","B":"over","C":"at","D":"within","answer":"A","answer_word":"throughout","explanation":"■ 文の骨格\nIn addition to signing up for our free daily newsletter, be sure to visit our TechInfo blog for updates ______ the day.\n\n■ 空所に入るもの\n「1日を通してずっと」という継続を表す前置詞が文意に合う。\n→ 空所には「期間全体を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) throughout … 前置詞「〜を通してずっと」 ○\n(B) over … 前置詞「〜にわたって」 ×\n(C) at … 前置詞「〜で（時刻）」 ×\n(D) within … 前置詞「〜以内に」 ×\n\n■ 完成文\nIn addition to signing up for our free daily newsletter, be sure to visit our TechInfo blog for updates throughout the day.\n（無料の日刊ニュースレターへのご登録に加えて、一日を通して更新される TechInfo ブログもぜひご覧ください。）\n\n■ 解き方のポイント\nthroughout the day＝「一日中」。範囲の全体をくまなく表す。","words":[{"w":"signing up for","p":"熟語","m":"〜に登録すること"},{"w":"newsletter","p":"名詞","m":"ニュースレター"},{"w":"throughout","p":"前置詞","m":"〜を通してずっと"},{"w":"updates","p":"名詞","m":"最新情報"}]},{"id":551,"category":"前置詞問題・実戦問題","question":"The real-estate developer has decided to construct a large shopping mall ______ the city museum.","A":"throughout","B":"near","C":"into","D":"upon","answer":"B","answer_word":"near","explanation":"■ 文の骨格\nThe real-estate developer has decided to construct a large shopping mall ______ the city museum.\n\n■ 空所に入るもの\n建設場所が市立博物館の近くであることを表す前置詞が必要。\n→ 空所には「近接を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) throughout … 前置詞「〜を通してずっと」 ×\n(B) near … 前置詞「〜の近くに」 ○\n(C) into … 前置詞「〜の中へ」 ×\n(D) upon … 前置詞「〜の上に」 ×\n\n■ 完成文\nThe real-estate developer has decided to construct a large shopping mall near the city museum.\n（その不動産開発業者は、市立博物館の近くに大型ショッピングモールを建設することを決めた。）\n\n■ 解き方のポイント\nnear は前置詞として単独で名詞を取れる。close は close to の形になる。","words":[{"w":"real-estate developer","p":"名詞","m":"不動産開発業者"},{"w":"construct","p":"動詞","m":"建設する"},{"w":"near","p":"前置詞","m":"〜の近くに"},{"w":"shopping mall","p":"名詞","m":"ショッピングモール"}]},{"id":552,"category":"前置詞問題・実戦問題","question":"Advance Telecommunications announced that the cause of yesterday's network disruption is still ______ investigation.","A":"over","B":"with","C":"among","D":"under","answer":"D","answer_word":"under","explanation":"■ 文の骨格\nAdvance Telecommunications announced that the cause of yesterday's network disruption is still ______ investigation.\n\n■ 空所に入るもの\nunder investigation（調査中で）という定型表現になる。\n→ 空所には「定型表現をつくる前置詞」が必要です。\n\n■ 選択肢の確認\n(A) over … 前置詞「〜を越えて」 ×\n(B) with … 前置詞「〜とともに」 ×\n(C) among … 前置詞「〜の中で」 ×\n(D) under … 前置詞「〜の下で、〜中で」 ○\n\n■ 完成文\nAdvance Telecommunications announced that the cause of yesterday's network disruption is still under investigation.\n（Advance Telecommunications 社は、昨日のネットワーク障害の原因は現在も調査中だと発表した。）\n\n■ 解き方のポイント\nunder investigation／under construction／under review など under＋名詞は頻出。","words":[{"w":"cause","p":"名詞","m":"原因"},{"w":"disruption","p":"名詞","m":"障害、混乱"},{"w":"under investigation","p":"熟語","m":"調査中で"}]},{"id":553,"category":"前置詞問題・実戦問題","question":"Mr. Matsuhashi submitted his travel report immediately ______ arrival at the company headquarters.","A":"upon","B":"in","C":"to","D":"from","answer":"A","answer_word":"upon","explanation":"■ 文の骨格\nMr. Matsuhashi submitted his travel report immediately ______ arrival at the company headquarters.\n\n■ 空所に入るもの\n後ろが名詞 arrival で、「〜と同時に」を表す前置詞が文意に合う。\n→ 空所には「「〜するとすぐに」を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) upon … 前置詞「〜するとすぐに」 ○\n(B) in … 前置詞「〜の中に」 ×\n(C) to … 前置詞「〜へ」 ×\n(D) from … 前置詞「〜から」 ×\n\n■ 完成文\nMr. Matsuhashi submitted his travel report immediately upon arrival at the company headquarters.\n（Matsuhashi さんは本社に到着するとすぐに出張報告書を提出した。）\n\n■ 解き方のポイント\nupon [on] arrival＝「到着次第」。upon＋動名詞の形も頻出。","words":[{"w":"submitted","p":"動詞（過去形）","m":"提出した"},{"w":"travel report","p":"名詞","m":"出張報告書"},{"w":"upon","p":"前置詞","m":"〜するとすぐに"},{"w":"headquarters","p":"名詞","m":"本社"}]},{"id":554,"category":"前置詞問題・実戦問題","question":"To visit our store, follow Parry Road ______ the pharmacy and you will see it on your right.","A":"close","B":"over","C":"throughout","D":"past","answer":"D","answer_word":"past","explanation":"■ 文の骨格\nTo visit our store, follow Parry Road ______ the pharmacy and you will see it on your right.\n\n■ 空所に入るもの\n道順の説明で「〜を通り過ぎて」を表す前置詞が必要。\n→ 空所には「通過を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) close … 形容詞・動詞「近い／閉じる」 ×\n(B) over … 前置詞「〜を越えて」 ×\n(C) throughout … 前置詞「〜を通してずっと」 ×\n(D) past … 前置詞「〜を通り過ぎて」 ○\n\n■ 完成文\nTo visit our store, follow Parry Road past the pharmacy and you will see it on your right.\n（当店へお越しの際は、Parry 通りを薬局の先まで進んでいただくと、右手に見えてきます。）\n\n■ 解き方のポイント\npast は前置詞で「〜を通り過ぎて」。道案内の頻出語。","words":[{"w":"follow","p":"動詞","m":"（道を）進む"},{"w":"past","p":"前置詞","m":"〜を通り過ぎて"},{"w":"pharmacy","p":"名詞","m":"薬局"},{"w":"on your right","p":"熟語","m":"右手に"}]},{"id":555,"category":"前置詞問題・実戦問題","question":"The hotel is situated in a quiet residential area and was fully renovated ______ the guests' comfort last year.","A":"for","B":"under","C":"on","D":"at","answer":"A","answer_word":"for","explanation":"■ 文の骨格\nThe hotel is situated in a quiet residential area and was fully renovated ______ the guests' comfort last year.\n\n■ 空所に入るもの\n改装の目的を表す前置詞が文意に合う。\n→ 空所には「目的を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) for … 前置詞「〜のために」 ○\n(B) under … 前置詞「〜の下に」 ×\n(C) on … 前置詞「〜の上に」 ×\n(D) at … 前置詞「〜で」 ×\n\n■ 完成文\nThe hotel is situated in a quiet residential area and was fully renovated for the guests' comfort last year.\n（そのホテルは静かな住宅地にあり、昨年、宿泊客の快適さのために全面改装された。）\n\n■ 解き方のポイント\nfor＋目的。for the guests’ comfort のように所有格を挟む形もよく出る。","words":[{"w":"situated","p":"過去分詞","m":"位置している"},{"w":"residential area","p":"名詞","m":"住宅地"},{"w":"renovated","p":"動詞（過去分詞）","m":"改装された"},{"w":"comfort","p":"名詞","m":"快適さ"}]},{"id":556,"category":"前置詞問題・実戦問題","question":"Employees wishing to exchange their computers must return the old ones to the company ______ two weeks.","A":"while","B":"before","C":"within","D":"over","answer":"C","answer_word":"within","explanation":"■ 文の骨格\nEmployees wishing to exchange their computers must return the old ones to the company ______ two weeks.\n\n■ 空所に入るもの\n「〜以内に」という期限の範囲を表す前置詞が文意に合う。\n→ 空所には「期限の範囲を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) while … 接続詞「〜する間」 ×\n(B) before … 前置詞・接続詞「〜の前に」 ×\n(C) within … 前置詞「〜以内に」 ○\n(D) over … 前置詞「〜にわたって」 ×\n\n■ 完成文\nEmployees wishing to exchange their computers must return the old ones to the company within two weeks.\n（パソコンの交換を希望する従業員は、2週間以内に旧機を会社へ返却しなければならない。）\n\n■ 解き方のポイント\nwithin＋期間＝「〜以内に」。in＋期間だと「〜後に」の意味になる。","words":[{"w":"exchange","p":"動詞","m":"交換する"},{"w":"return","p":"動詞","m":"返却する"},{"w":"within","p":"前置詞","m":"〜以内に"}]},{"id":557,"category":"前置詞問題・実戦問題","question":"Mr. Harnigon stated that he would donate any leftover funds ______ charity when the community center was complete.","A":"to","B":"for","C":"with","D":"in","answer":"A","answer_word":"to","explanation":"■ 文の骨格\nMr. Harnigon stated that he would donate any leftover funds ______ charity when the community center was complete.\n\n■ 空所に入るもの\ndonate X to Y（XをYに寄付する）という組み合わせになる。\n→ 空所には「donate と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) to … 前置詞「〜へ」 ○\n(B) for … 前置詞「〜のために」 ×\n(C) with … 前置詞「〜とともに」 ×\n(D) in … 前置詞「〜の中に」 ×\n\n■ 完成文\nMr. Harnigon stated that he would donate any leftover funds to charity when the community center was complete.\n（Harnigon 氏は、コミュニティセンターが完成したら余った資金はすべて慈善団体へ寄付すると述べた。）\n\n■ 解き方のポイント\ndonate／contribute／give ＋物＋to＋相手 の形。","words":[{"w":"stated","p":"動詞（過去形）","m":"述べた"},{"w":"donate","p":"動詞","m":"寄付する"},{"w":"leftover funds","p":"名詞","m":"余った資金"},{"w":"charity","p":"名詞","m":"慈善団体"}]},{"id":558,"category":"前置詞問題・実戦問題","question":"California Travel Magazine named Hugo Bertrand the best travel writer ______ five consecutive years.","A":"at","B":"for","C":"from","D":"before","answer":"B","answer_word":"for","explanation":"■ 文の骨格\nCalifornia Travel Magazine named Hugo Bertrand the best travel writer ______ five consecutive years.\n\n■ 空所に入るもの\n「〜の間ずっと」という継続期間を表す前置詞が必要。\n→ 空所には「期間の継続を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) at … 前置詞「〜で」 ×\n(B) for … 前置詞「〜の間」 ○\n(C) from … 前置詞「〜から」 ×\n(D) before … 前置詞「〜の前に」 ×\n\n■ 完成文\nCalifornia Travel Magazine named Hugo Bertrand the best travel writer for five consecutive years.\n（California Travel Magazine 誌は、Hugo Bertrand を5年連続で最優秀旅行ライターに選んだ。）\n\n■ 解き方のポイント\nfor＋期間の長さ。for five consecutive years＝「5年連続で」。","words":[{"w":"named","p":"動詞（過去形）","m":"選んだ、指名した"},{"w":"travel writer","p":"名詞","m":"旅行ライター"},{"w":"consecutive","p":"形容詞","m":"連続した"}]},{"id":559,"category":"前置詞問題・実戦問題","question":"______ all the dishes served at the Little Bird Café, the Chef's Special Pizza is the most popular.","A":"At","B":"Through","C":"Over","D":"Of","answer":"D","answer_word":"Of","explanation":"■ 文の骨格\n______ all the dishes served at the Little Bird Café, the Chef's Special Pizza is the most popular.\n\n■ 空所に入るもの\n最上級とともに「〜の中で」という母集団を表す前置詞が必要。\n→ 空所には「最上級と呼応する前置詞」が必要です。\n\n■ 選択肢の確認\n(A) At … 前置詞「〜で」 ×\n(B) Through … 前置詞「〜を通って」 ×\n(C) Over … 前置詞「〜を越えて」 ×\n(D) Of … 前置詞「〜の中で」 ○\n\n■ 完成文\nOf all the dishes served at the Little Bird Café, the Chef's Special Pizza is the most popular.\n（Little Bird Café で提供される全料理の中で、シェフのスペシャルピザが最も人気だ。）\n\n■ 解き方のポイント\n最上級＋of all ...／in＋場所 の使い分け。ここは複数名詞なので of。","words":[{"w":"dishes","p":"名詞","m":"料理"},{"w":"served","p":"過去分詞","m":"提供される"},{"w":"Of","p":"前置詞","m":"〜の中で"},{"w":"popular","p":"形容詞","m":"人気のある"}]},{"id":560,"category":"前置詞問題・実戦問題","question":"Customers of our online store who spend more than $50 will qualify ______ free shipping.","A":"to","B":"in","C":"after","D":"for","answer":"D","answer_word":"for","explanation":"■ 文の骨格\nCustomers of our online store who spend more than $50 will qualify ______ free shipping.\n\n■ 空所に入るもの\nqualify for X（Xの資格を得る）という組み合わせになる。\n→ 空所には「qualify と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) to … 前置詞「〜へ」 ×\n(B) in … 前置詞「〜の中に」 ×\n(C) after … 前置詞「〜のあとに」 ×\n(D) for … 前置詞「〜の資格を得て」 ○\n\n■ 完成文\nCustomers of our online store who spend more than $50 will qualify for free shipping.\n（当オンラインストアで50ドルを超えるお買い上げのお客様は、送料無料の対象となります。）\n\n■ 解き方のポイント\nqualify for／be eligible for／apply for など、for は「資格・対象」を表す。","words":[{"w":"spend","p":"動詞","m":"使う"},{"w":"qualify for","p":"熟語","m":"〜の資格を得る"},{"w":"free shipping","p":"名詞","m":"送料無料"}]},{"id":561,"category":"前置詞問題・実戦問題","question":"Oriental Trade Co. imports and exports a wide variety ______ consumer and industrial goods, including software, electric motors, and clothes.","A":"across","B":"of","C":"into","D":"toward","answer":"B","answer_word":"of","explanation":"■ 文の骨格\nOriental Trade Co. imports and exports a wide variety ______ consumer and industrial goods, including software, electric motors, and clothes.\n\n■ 空所に入るもの\na wide variety of X（多種多様なX）という定型表現になる。\n→ 空所には「定型表現をつくる前置詞」が必要です。\n\n■ 選択肢の確認\n(A) across … 前置詞「〜を横切って」 ×\n(B) of … 前置詞「〜の」 ○\n(C) into … 前置詞「〜の中へ」 ×\n(D) toward … 前置詞「〜の方へ」 ×\n\n■ 完成文\nOriental Trade Co. imports and exports a wide variety of consumer and industrial goods, including software, electric motors, and clothes.\n（Oriental Trade 社は、ソフトウェア、電気モーター、衣料品など多種多様な消費財・産業財を輸出入している。）\n\n■ 解き方のポイント\na variety of／a range of／a number of はすべて of を伴う。","words":[{"w":"imports","p":"動詞","m":"輸入する"},{"w":"exports","p":"動詞","m":"輸出する"},{"w":"a wide variety of","p":"熟語","m":"多種多様な"},{"w":"industrial goods","p":"名詞","m":"産業財"}]},{"id":562,"category":"前置詞問題・実戦問題","question":"Should you have any questions ______ access to Global Research Center, please direct your inquiry to rep@globalresearch.com.","A":"between","B":"next","C":"onto","D":"regarding","answer":"D","answer_word":"regarding","explanation":"■ 文の骨格\nShould you have any questions ______ access to Global Research Center, please direct your inquiry to rep@globalresearch.com.\n\n■ 空所に入るもの\n後ろが名詞句 access to ... で、「〜に関して」を表す前置詞が必要。\n→ 空所には「名詞句を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) between … 前置詞「〜の間に」 ×\n(B) next … 形容詞・副詞「次の／次に」 ×\n(C) onto … 前置詞「〜の上へ」 ×\n(D) regarding … 前置詞（分詞由来）「〜に関して」 ○\n\n■ 完成文\nShould you have any questions regarding access to Global Research Center, please direct your inquiry to rep@globalresearch.com.\n（Global Research Center の利用に関してご質問がありましたら、rep@globalresearch.com までお問い合わせください。）\n\n■ 解き方のポイント\nregarding＝concerning＝about。文頭 Should you ... は if の倒置。","words":[{"w":"questions","p":"名詞","m":"質問"},{"w":"regarding","p":"前置詞","m":"〜に関して"},{"w":"access","p":"名詞","m":"利用、アクセス"},{"w":"inquiry","p":"名詞","m":"問い合わせ"}]},{"id":563,"category":"前置詞問題・実戦問題","question":"Frank Jones has transformed Beanstavor Coffee ______ a start-up business to a market leader in the high-end coffee market in Willamette.","A":"about","B":"from","C":"since","D":"after","answer":"B","answer_word":"from","explanation":"■ 文の骨格\nFrank Jones has transformed Beanstavor Coffee ______ a start-up business to a market leader in the high-end coffee market in Willamette.\n\n■ 空所に入るもの\n後ろに to があり、from A to B（AからBへ）という形になる。\n→ 空所には「変化の起点を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) about … 前置詞「〜について」 ×\n(B) from … 前置詞「〜から」 ○\n(C) since … 前置詞・接続詞「〜以来」 ×\n(D) after … 前置詞「〜のあとに」 ×\n\n■ 完成文\nFrank Jones has transformed Beanstavor Coffee from a start-up business to a market leader in the high-end coffee market in Willamette.\n（Frank Jones は Beanstavor Coffee 社を、新興企業から Willamette の高級コーヒー市場のリーダーへと変貌させた。）\n\n■ 解き方のポイント\ntransform／change／turn ＋X＋from A to B の形。to があれば from を疑う。","words":[{"w":"transformed","p":"動詞（過去分詞）","m":"変貌させた"},{"w":"start-up business","p":"名詞","m":"新興企業"},{"w":"market leader","p":"名詞","m":"市場のリーダー"},{"w":"high-end","p":"形容詞","m":"高級な"}]},{"id":564,"category":"前置詞問題・実戦問題","question":"Keep up-to-date with the latest information about special offers and discounts at Wagner Clothing Stores ______ subscribing to our newsletter.","A":"at","B":"in","C":"by","D":"as","answer":"C","answer_word":"by","explanation":"■ 文の骨格\nKeep up-to-date with the latest information about special offers and discounts at Wagner Clothing Stores ______ subscribing to our newsletter.\n\n■ 空所に入るもの\n後ろが動名詞 subscribing で、「〜することによって」を表す前置詞が必要。\n→ 空所には「手段を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) at … 前置詞「〜で」 ×\n(B) in … 前置詞「〜の中に」 ×\n(C) by … 前置詞「〜することによって」 ○\n(D) as … 前置詞・接続詞「〜として」 ×\n\n■ 完成文\nKeep up-to-date with the latest information about special offers and discounts at Wagner Clothing Stores by subscribing to our newsletter.\n（ニュースレターにご登録いただくことで、Wagner Clothing Stores の特別セールや割引の最新情報を受け取れます。）\n\n■ 解き方のポイント\nby doing＝「〜することによって」。手段を表す最頻出の形。","words":[{"w":"Keep up-to-date","p":"熟語","m":"最新情報を得ておく"},{"w":"special offers","p":"名詞","m":"特別セール"},{"w":"by","p":"前置詞","m":"〜することによって"},{"w":"subscribing","p":"動名詞","m":"登録すること"}]},{"id":565,"category":"前置詞問題・実戦問題","question":"______ Friday, Portside Clothing Store will have a clearance sale in order to make room for new inventory.","A":"Since","B":"Until","C":"In","D":"Below","answer":"B","answer_word":"Until","explanation":"■ 文の骨格\n______ Friday, Portside Clothing Store will have a clearance sale in order to make room for new inventory.\n\n■ 空所に入るもの\nセール期間の終わりを示す前置詞が文意に合う。\n→ 空所には「継続の終点を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) Since … 前置詞・接続詞「〜以来」 ×\n(B) Until … 前置詞「〜まで」 ○\n(C) In … 前置詞「〜の中に」 ×\n(D) Below … 前置詞「〜の下に」 ×\n\n■ 完成文\nUntil Friday, Portside Clothing Store will have a clearance sale in order to make room for new inventory.\n（金曜日まで、Portside Clothing Store は新しい在庫の場所を確保するため在庫一掃セールを行う。）\n\n■ 解き方のポイント\nuntil は継続の終点、by は期限。セールの「期間」なので until。","words":[{"w":"clearance sale","p":"名詞","m":"在庫一掃セール"},{"w":"make room for","p":"熟語","m":"〜の場所を空ける"},{"w":"inventory","p":"名詞","m":"在庫"}]},{"id":566,"category":"前置詞問題・実戦問題","question":"Dice Pizza announced Tuesday that Ms. Emily Martin will replace David Brandon ______ CEO in March with a three-year contract.","A":"as","B":"like","C":"out","D":"about","answer":"A","answer_word":"as","explanation":"■ 文の骨格\nDice Pizza announced Tuesday that Ms. Emily Martin will replace David Brandon ______ CEO in March with a three-year contract.\n\n■ 空所に入るもの\nreplace A as B（BとしてAの後任になる）という形になる。\n→ 空所には「資格・立場を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) as … 前置詞「〜として」 ○\n(B) like … 前置詞「〜のような」 ×\n(C) out … 副詞「外へ」 ×\n(D) about … 前置詞「〜について」 ×\n\n■ 完成文\nDice Pizza announced Tuesday that Ms. Emily Martin will replace David Brandon as CEO in March with a three-year contract.\n（Dice Pizza 社は火曜日、Emily Martin 氏が3年契約で3月に David Brandon 氏の後任 CEO に就くと発表した。）\n\n■ 解き方のポイント\nas は「〜として」。like（〜のような）との違いが狙われる。","words":[{"w":"announced","p":"動詞（過去形）","m":"発表した"},{"w":"replace","p":"動詞","m":"後任になる"},{"w":"as","p":"前置詞","m":"〜として"},{"w":"contract","p":"名詞","m":"契約"}]},{"id":567,"category":"前置詞問題・実戦問題","question":"The new portable music players from Star Electronics are available ______ red, blue, and silver.","A":"at","B":"in","C":"of","D":"to","answer":"B","answer_word":"in","explanation":"■ 文の骨格\nThe new portable music players from Star Electronics are available ______ red, blue, and silver.\n\n■ 空所に入るもの\navailable in＋色 で「〜色で入手できる」という形になる。\n→ 空所には「色の展開を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) at … 前置詞「〜で」 ×\n(B) in … 前置詞「〜（の色）で」 ○\n(C) of … 前置詞「〜の」 ×\n(D) to … 前置詞「〜へ」 ×\n\n■ 完成文\nThe new portable music players from Star Electronics are available in red, blue, and silver.\n（Star Electronics 社の新しい携帯音楽プレーヤーは、赤・青・シルバーの色展開で購入できる。）\n\n■ 解き方のポイント\navailable in red／in size M のように、色やサイズの展開は in。","words":[{"w":"portable","p":"形容詞","m":"携帯用の"},{"w":"available","p":"形容詞","m":"入手できる"},{"w":"in","p":"前置詞","m":"〜（の色）で"}]},{"id":568,"category":"前置詞問題・実戦問題","question":"Mr. Anderson suggested that the presenter give a demonstration ______ the new products at the press conference.","A":"along","B":"of","C":"during","D":"into","answer":"B","answer_word":"of","explanation":"■ 文の骨格\nMr. Anderson suggested that the presenter give a demonstration ______ the new products at the press conference.\n\n■ 空所に入るもの\ndemonstration of X（Xの実演）という組み合わせになる。\n→ 空所には「名詞と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) along … 前置詞「〜に沿って」 ×\n(B) of … 前置詞「〜の」 ○\n(C) during … 前置詞「〜の間」 ×\n(D) into … 前置詞「〜の中へ」 ×\n\n■ 完成文\nMr. Anderson suggested that the presenter give a demonstration of the new products at the press conference.\n（Anderson 氏は、記者会見で発表者が新製品の実演を行うよう提案した。）\n\n■ 解き方のポイント\n名詞＋of＋名詞 は「〜の…」を表す最も基本的な形。suggest that の節内が原形 give な点も要チェック。","words":[{"w":"suggested","p":"動詞（過去形）","m":"提案した"},{"w":"presenter","p":"名詞","m":"発表者"},{"w":"demonstration","p":"名詞","m":"実演"},{"w":"press conference","p":"名詞","m":"記者会見"}]},{"id":569,"category":"前置詞問題・実戦問題","question":"Crystal Records allows consumers to purchase music for use on both their mobile phones and computers, ______ most other mobile music download services.","A":"despite","B":"aside","C":"unlike","D":"except","answer":"C","answer_word":"unlike","explanation":"■ 文の骨格\nCrystal Records allows consumers to purchase music for use on both their mobile phones and computers, ______ most other mobile music download services.\n\n■ 空所に入るもの\n後ろが名詞句で、ほかのサービスとの違いを表す前置詞が必要。\n→ 空所には「対比を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) despite … 前置詞「〜にもかかわらず」 ×\n(B) aside … 副詞「わきへ」 ×\n(C) unlike … 前置詞「〜とは違って」 ○\n(D) except … 前置詞「〜を除いて」 ×\n\n■ 完成文\nCrystal Records allows consumers to purchase music for use on both their mobile phones and computers, unlike most other mobile music download services.\n（ほかの多くのモバイル音楽配信サービスとは違い、Crystal Records は携帯電話とパソコンの両方で使える音楽の購入を可能にしている。）\n\n■ 解き方のポイント\nunlike＝「〜とは違って」。like の反対語で、前置詞として名詞を取る。","words":[{"w":"allows","p":"動詞","m":"可能にする"},{"w":"consumers","p":"名詞","m":"消費者"},{"w":"unlike","p":"前置詞","m":"〜とは違って"},{"w":"download services","p":"名詞","m":"配信サービス"}]},{"id":570,"category":"前置詞問題・実戦問題","question":"Mr. Jones announced his retirement yesterday ______ 20 years of outstanding service as CEO.","A":"within","B":"on","C":"after","D":"along","answer":"C","answer_word":"after","explanation":"■ 文の骨格\nMr. Jones announced his retirement yesterday ______ 20 years of outstanding service as CEO.\n\n■ 空所に入るもの\n後ろが名詞句 20 years of ... で、「〜のあとに」を表す前置詞が必要。\n→ 空所には「時間の前後関係を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) within … 前置詞「〜以内に」 ×\n(B) on … 前置詞「〜の上に」 ×\n(C) after … 前置詞「〜のあとに」 ○\n(D) along … 前置詞「〜に沿って」 ×\n\n■ 完成文\nMr. Jones announced his retirement yesterday after 20 years of outstanding service as CEO.\n（Jones 氏は昨日、CEO として20年間の優れた功績を残したのち、退任を発表した。）\n\n■ 解き方のポイント\nafter は前置詞・接続詞の両方で使える。ここは後ろが名詞句なので前置詞。","words":[{"w":"retirement","p":"名詞","m":"退任"},{"w":"after","p":"前置詞","m":"〜のあとに"},{"w":"outstanding","p":"形容詞","m":"優れた"},{"w":"service","p":"名詞","m":"勤務、功績"}]},{"id":571,"category":"前置詞問題・実戦問題","question":"All workers are required to read and observe the safety instructions posted ______ the factory entrance.","A":"for","B":"beside","C":"into","D":"off","answer":"B","answer_word":"beside","explanation":"■ 文の骨格\nAll workers are required to read and observe the safety instructions posted ______ the factory entrance.\n\n■ 空所に入るもの\n掲示の場所が入口の「そば」であることを表す前置詞が文意に合う。\n→ 空所には「位置を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) for … 前置詞「〜のために」 ×\n(B) beside … 前置詞「〜のそばに」 ○\n(C) into … 前置詞「〜の中へ」 ×\n(D) off … 前置詞「〜から離れて」 ×\n\n■ 完成文\nAll workers are required to read and observe the safety instructions posted beside the factory entrance.\n（全作業員は、工場の入口のそばに掲示された安全指示を読み、順守することが求められる。）\n\n■ 解き方のポイント\nbeside（〜のそばに）と besides（〜に加えて）を混同しない。","words":[{"w":"observe","p":"動詞","m":"順守する"},{"w":"safety instructions","p":"名詞","m":"安全指示"},{"w":"posted","p":"過去分詞","m":"掲示された"},{"w":"beside","p":"前置詞","m":"〜のそばに"}]},{"id":572,"category":"前置詞問題・実戦問題","question":"Mr. Romano subscribes to Urban Green Life, a gardening magazine, and keeps each issue neatly filed ______ the top shelf of his bookcase.","A":"on","B":"out","C":"in","D":"for","answer":"A","answer_word":"on","explanation":"■ 文の骨格\nMr. Romano subscribes to Urban Green Life, a gardening magazine, and keeps each issue neatly filed ______ the top shelf of his bookcase.\n\n■ 空所に入るもの\n棚の上に置くという接触を表す前置詞が必要。\n→ 空所には「接触した面を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) on … 前置詞「〜の上に」 ○\n(B) out … 副詞「外へ」 ×\n(C) in … 前置詞「〜の中に」 ×\n(D) for … 前置詞「〜のために」 ×\n\n■ 完成文\nMr. Romano subscribes to Urban Green Life, a gardening magazine, and keeps each issue neatly filed on the top shelf of his bookcase.\n（Romano さんは園芸雑誌『Urban Green Life』を定期購読しており、各号を本棚の一番上の段にきちんと並べている。）\n\n■ 解き方のポイント\non the shelf（棚の上に）。面に接している場合は on。","words":[{"w":"subscribes to","p":"熟語","m":"〜を定期購読する"},{"w":"gardening","p":"名詞","m":"園芸"},{"w":"issue","p":"名詞","m":"（雑誌の）号"},{"w":"shelf","p":"名詞","m":"棚"}]},{"id":573,"category":"前置詞問題・実戦問題","question":"Thanks to favorable wind conditions, Kangaroo Airlines Flight 990 arrived at Wang Tao International Airport one hour ______ schedule.","A":"down","B":"next to","C":"following","D":"ahead of","answer":"D","answer_word":"ahead of","explanation":"■ 文の骨格\nThanks to favorable wind conditions, Kangaroo Airlines Flight 990 arrived at Wang Tao International Airport one hour ______ schedule.\n\n■ 空所に入るもの\nahead of schedule（予定より早く）という定型表現になる。\n→ 空所には「定型表現をつくる群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) down … 副詞「下へ」 ×\n(B) next to … 群前置詞「〜の隣に」 ×\n(C) following … 前置詞（分詞由来）「〜に続いて」 ×\n(D) ahead of … 群前置詞「〜より前に」 ○\n\n■ 完成文\nThanks to favorable wind conditions, Kangaroo Airlines Flight 990 arrived at Wang Tao International Airport one hour ahead of schedule.\n（良好な風の条件のおかげで、Kangaroo 航空990便は Wang Tao 国際空港に予定より1時間早く到着した。）\n\n■ 解き方のポイント\nahead of schedule（予定より早く）／behind schedule（予定より遅れて）はセットで覚える。","words":[{"w":"favorable","p":"形容詞","m":"良好な"},{"w":"wind conditions","p":"名詞","m":"風の条件"},{"w":"ahead of schedule","p":"熟語","m":"予定より早く"}]},{"id":574,"category":"前置詞問題・実戦問題","question":"Business owners in Stonehaven may advertise ______ our Web site at an affordable price.","A":"at","B":"up","C":"on","D":"in","answer":"C","answer_word":"on","explanation":"■ 文の骨格\nBusiness owners in Stonehaven may advertise ______ our Web site at an affordable price.\n\n■ 空所に入るもの\nウェブサイト上での掲載を表す前置詞が必要。\n→ 空所には「媒体を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) at … 前置詞「〜で（地点）」 ×\n(B) up … 副詞「上へ」 ×\n(C) on … 前置詞「〜の上で（媒体）」 ○\n(D) in … 前置詞「〜の中に」 ×\n\n■ 完成文\nBusiness owners in Stonehaven may advertise on our Web site at an affordable price.\n（Stonehaven の事業主は、手ごろな価格で当社ウェブサイトに広告を出すことができる。）\n\n■ 解き方のポイント\non the Web site／on TV／on the radio のように、媒体は on。","words":[{"w":"Business owners","p":"名詞","m":"事業主"},{"w":"advertise","p":"動詞","m":"広告を出す"},{"w":"on","p":"前置詞","m":"〜の上で"},{"w":"affordable","p":"形容詞","m":"手ごろな"}]},{"id":575,"category":"前置詞問題・実戦問題","question":"Travelers are advised to carry their passports at all times while ______ some foreign countries.","A":"through","B":"with","C":"along","D":"in","answer":"A","answer_word":"through","explanation":"■ 文の骨格\nTravelers are advised to carry their passports at all times while ______ some foreign countries.\n\n■ 空所に入るもの\nwhile (traveling) ______ ... の形で、「〜を通って旅行する」を表す前置詞が必要。\n→ 空所には「通過・移動の範囲を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) through … 前置詞「〜を通って」 ○\n(B) with … 前置詞「〜とともに」 ×\n(C) along … 前置詞「〜に沿って」 ×\n(D) in … 前置詞「〜の中に」 ×\n\n■ 完成文\nTravelers are advised to carry their passports at all times while through some foreign countries.\n（旅行者は、外国のいくつかを旅行している間、常にパスポートを携帯するよう勧められている。）\n\n■ 解き方のポイント\ntravel through＝「〜を巡って旅行する」。空間を通り抜けるイメージ。","words":[{"w":"Travelers","p":"名詞","m":"旅行者"},{"w":"advised","p":"動詞（過去分詞）","m":"勧められる"},{"w":"at all times","p":"熟語","m":"常に"},{"w":"through","p":"前置詞","m":"〜を通って"}]},{"id":576,"category":"前置詞問題・実戦問題","question":"The power generators at Hinze Dam have been in operation ______ the mid-20th century, although they are often stopped for scheduled maintenance.","A":"since","B":"toward","C":"while","D":"with","answer":"A","answer_word":"since","explanation":"■ 文の骨格\nThe power generators at Hinze Dam have been in operation ______ the mid-20th century, although they are often stopped for scheduled maintenance.\n\n■ 空所に入るもの\n主節が現在完了形で、継続の起点を表す前置詞が必要。\n→ 空所には「起点を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) since … 前置詞「〜以来」 ○\n(B) toward … 前置詞「〜の方へ」 ×\n(C) while … 接続詞「〜する間」 ×\n(D) with … 前置詞「〜とともに」 ×\n\n■ 完成文\nThe power generators at Hinze Dam have been in operation since the mid-20th century, although they are often stopped for scheduled maintenance.\n（Hinze ダムの発電機は、定期点検でしばしば停止するものの、20世紀半ば以来稼働し続けている。）\n\n■ 解き方のポイント\nsince＋過去の一時点、for＋期間の長さ。現在完了形とセットで使う。","words":[{"w":"power generators","p":"名詞","m":"発電機"},{"w":"in operation","p":"熟語","m":"稼働中で"},{"w":"since","p":"前置詞","m":"〜以来"},{"w":"scheduled maintenance","p":"名詞","m":"定期点検"}]},{"id":577,"category":"前置詞問題・実戦問題","question":"As our express delivery option is a guaranteed service, your order will definitely arrive ______ 8 A.M. and 1 P.M. the following day.","A":"among","B":"except","C":"between","D":"when","answer":"C","answer_word":"between","explanation":"■ 文の骨格\nAs our express delivery option is a guaranteed service, your order will definitely arrive ______ 8 A.M. and 1 P.M. the following day.\n\n■ 空所に入るもの\n後ろに and があり、between A and B（AとBの間に）の形になる。\n→ 空所には「2つの時点に挟まれた範囲を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) among … 前置詞「〜の中で（3つ以上）」 ×\n(B) except … 前置詞「〜を除いて」 ×\n(C) between … 前置詞「〜の間に（2つ）」 ○\n(D) when … 接続詞「〜のとき」 ×\n\n■ 完成文\nAs our express delivery option is a guaranteed service, your order will definitely arrive between 8 A.M. and 1 P.M. the following day.\n（当社の速達便は保証付きサービスですので、ご注文品は翌日の午前8時から午後1時の間に確実に届きます。）\n\n■ 解き方のポイント\nbetween A and B は2つの間、among は3つ以上の中。and があれば between を疑う。","words":[{"w":"express delivery","p":"名詞","m":"速達便"},{"w":"guaranteed","p":"形容詞","m":"保証付きの"},{"w":"definitely","p":"副詞","m":"確実に"},{"w":"between","p":"前置詞","m":"〜の間に"}]},{"id":578,"category":"前置詞問題・実戦問題","question":"______ its production rates at an all-time low, Kenner Manufacturing decided to renovate its manufacturing facilities.","A":"Except","B":"Until","C":"With","D":"Into","answer":"C","answer_word":"With","explanation":"■ 文の骨格\n______ its production rates at an all-time low, Kenner Manufacturing decided to renovate its manufacturing facilities.\n\n■ 空所に入るもの\nwith＋名詞＋補語 で「〜が…の状態で」という付帯状況を表す。\n→ 空所には「付帯状況を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) Except … 前置詞「〜を除いて」 ×\n(B) Until … 前置詞・接続詞「〜まで」 ×\n(C) With … 前置詞「〜が…の状態で」 ○\n(D) Into … 前置詞「〜の中へ」 ×\n\n■ 完成文\nWith its production rates at an all-time low, Kenner Manufacturing decided to renovate its manufacturing facilities.\n（生産率が過去最低の状態にあったため、Kenner Manufacturing 社は製造設備を刷新することにした。）\n\n■ 解き方のポイント\n〈with＋O＋C〉の付帯状況。C には形容詞・分詞・前置詞句が来る。","words":[{"w":"production rates","p":"名詞","m":"生産率"},{"w":"all-time low","p":"名詞","m":"過去最低"},{"w":"renovate","p":"動詞","m":"刷新する"},{"w":"facilities","p":"名詞","m":"設備"}]},{"id":579,"category":"前置詞問題・実戦問題","question":"The new novel by Daniel Weber will be available in bookstores nationwide a week ______ today.","A":"from","B":"on","C":"for","D":"than","answer":"A","answer_word":"from","explanation":"■ 文の骨格\nThe new novel by Daniel Weber will be available in bookstores nationwide a week ______ today.\n\n■ 空所に入るもの\n〈期間＋from＋時点〉で「〜から…後」を表す形になる。\n→ 空所には「起点を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) from … 前置詞「〜から」 ○\n(B) on … 前置詞「〜の上に」 ×\n(C) for … 前置詞「〜の間」 ×\n(D) than … 接続詞・前置詞「〜よりも」 ×\n\n■ 完成文\nThe new novel by Daniel Weber will be available in bookstores nationwide a week from today.\n（Daniel Weber の新作小説は、今日から1週間後に全国の書店で購入できるようになる。）\n\n■ 解き方のポイント\na week from today＝「今日から1週間後」。起点を from で示す。","words":[{"w":"novel","p":"名詞","m":"小説"},{"w":"available","p":"形容詞","m":"入手できる"},{"w":"nationwide","p":"副詞","m":"全国で"},{"w":"from","p":"前置詞","m":"〜から"}]},{"id":580,"category":"前置詞問題・実戦問題","question":"Visitors to Iris Chemical Corporation are requested to observe the \"No Food or Drink\" signs posted ______ the laboratory.","A":"among","B":"between","C":"with","D":"throughout","answer":"D","answer_word":"throughout","explanation":"■ 文の骨格\nVisitors to Iris Chemical Corporation are requested to observe the \"No Food or Drink\" signs posted ______ the laboratory.\n\n■ 空所に入るもの\n研究室のあらゆる場所に掲示されていることを表す前置詞が文意に合う。\n→ 空所には「範囲全体を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) among … 前置詞「〜の中で（3つ以上）」 ×\n(B) between … 前置詞「〜の間に（2つ）」 ×\n(C) with … 前置詞「〜とともに」 ×\n(D) throughout … 前置詞「〜の至る所に」 ○\n\n■ 完成文\nVisitors to Iris Chemical Corporation are requested to observe the \"No Food or Drink\" signs posted throughout the laboratory.\n（Iris Chemical 社への訪問者は、研究室内の至る所に掲示された「飲食禁止」の表示を守るよう求められている。）\n\n■ 解き方のポイント\nthroughout は空間にも時間にも使える。「〜の隅々まで／〜の間ずっと」。","words":[{"w":"observe","p":"動詞","m":"守る"},{"w":"signs","p":"名詞","m":"表示"},{"w":"posted","p":"過去分詞","m":"掲示された"},{"w":"laboratory","p":"名詞","m":"研究室"}]},{"id":581,"category":"前置詞問題・実戦問題","question":"As you go down the street, you will see the City Public Library ______ the left.","A":"on","B":"for","C":"into","D":"with","answer":"A","answer_word":"on","explanation":"■ 文の骨格\nAs you go down the street, you will see the City Public Library ______ the left.\n\n■ 空所に入るもの\non the left [right]（左手に）という定型表現になる。\n→ 空所には「方向を表す定型表現の前置詞」が必要です。\n\n■ 選択肢の確認\n(A) on … 前置詞「〜側に」 ○\n(B) for … 前置詞「〜のために」 ×\n(C) into … 前置詞「〜の中へ」 ×\n(D) with … 前置詞「〜とともに」 ×\n\n■ 完成文\nAs you go down the street, you will see the City Public Library on the left.\n（通りを進んでいくと、左手に市立図書館が見えます。）\n\n■ 解き方のポイント\non the left／on your right は道案内の定型。","words":[{"w":"go down the street","p":"熟語","m":"通りを進む"},{"w":"Public Library","p":"名詞","m":"公共図書館"},{"w":"on the left","p":"熟語","m":"左手に"}]},{"id":582,"category":"前置詞問題・実戦問題","question":"The online cooking course will teach you how to transform simple ingredients ______ a fine meal in minutes.","A":"at","B":"over","C":"on","D":"into","answer":"D","answer_word":"into","explanation":"■ 文の骨格\nThe online cooking course will teach you how to transform simple ingredients ______ a fine meal in minutes.\n\n■ 空所に入るもの\ntransform X into Y（XをYに変える）という組み合わせになる。\n→ 空所には「変化の到達点を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) at … 前置詞「〜で」 ×\n(B) over … 前置詞「〜を越えて」 ×\n(C) on … 前置詞「〜の上に」 ×\n(D) into … 前置詞「〜へ（変化）」 ○\n\n■ 完成文\nThe online cooking course will teach you how to transform simple ingredients into a fine meal in minutes.\n（このオンライン料理講座では、シンプルな材料を数分で立派な一品に変える方法を学べる。）\n\n■ 解き方のポイント\ntransform／turn／change ＋X＋into Y。変化の結果は into。","words":[{"w":"transform","p":"動詞","m":"変える"},{"w":"ingredients","p":"名詞","m":"材料"},{"w":"into","p":"前置詞","m":"〜へ"},{"w":"fine meal","p":"名詞","m":"立派な料理"}]},{"id":583,"category":"関係詞問題・トレーニング","question":"Career consultant Louise Bennett, ______ latest book was published last week, will be speaking at the workshop this afternoon.","A":"whatever","B":"whom","C":"what","D":"whose","answer":"D","answer_word":"whose","explanation":"■ 文の骨格\nCareer consultant Louise Bennett, ______ latest book was published last week, will be speaking at the workshop this afternoon.\n\n■ 空所に入るもの\n空所の後ろに名詞 latest book があり、先行詞との所有関係を表す関係詞が必要。\n→ 空所には「所有格の関係代名詞」が必要です。\n\n■ 選択肢の確認\n(A) whatever … 複合関係代名詞「何であれ」 ×\n(B) whom … 関係代名詞（目的格）「〜する人を」 ×\n(C) what … 関係代名詞（先行詞を含む）「〜すること」 ×\n(D) whose … 関係代名詞（所有格）「その〜が」 ○\n\n■ 完成文\nCareer consultant Louise Bennett, whose latest book was published last week, will be speaking at the workshop this afternoon.\n（先週最新著書が出版されたキャリアコンサルタントの Louise Bennett が、今日の午後ワークショップで講演する。）\n\n■ 解き方のポイント\n〈関係詞＋名詞〉の形なら所有格 whose。人・物どちらの先行詞にも使える。","words":[{"w":"Career consultant","p":"名詞","m":"キャリアコンサルタント"},{"w":"whose","p":"関係代名詞","m":"その〜が"},{"w":"published","p":"動詞（過去分詞）","m":"出版された"},{"w":"workshop","p":"名詞","m":"ワークショップ"}]},{"id":584,"category":"関係詞問題・トレーニング","question":"For the interview, applicants are requested to come to our main office, ______ is located two blocks from Chewy Subway station.","A":"when","B":"where","C":"which","D":"why","answer":"C","answer_word":"which","explanation":"■ 文の骨格\nFor the interview, applicants are requested to come to our main office, ______ is located two blocks from Chewy Subway station.\n\n■ 空所に入るもの\n先行詞 our main office（物）を受け、関係詞節の主語になる語が必要。\n→ 空所には「物を先行詞とする主格の関係代名詞」が必要です。\n\n■ 選択肢の確認\n(A) when … 関係副詞「〜するとき」 ×\n(B) where … 関係副詞「〜する場所」 ×\n(C) which … 関係代名詞（主格・物）「それは」 ○\n(D) why … 関係副詞「〜する理由」 ×\n\n■ 完成文\nFor the interview, applicants are requested to come to our main office, which is located two blocks from Chewy Subway station.\n（面接のため、応募者は Chewy 地下鉄駅から2ブロックのところにある当社本社にお越しください。）\n\n■ 解き方のポイント\n関係詞の後ろが〈動詞〜〉なら主格の関係代名詞。物なら which、人なら who。","words":[{"w":"applicants","p":"名詞","m":"応募者"},{"w":"which","p":"関係代名詞","m":"それは"},{"w":"located","p":"過去分詞","m":"位置している"},{"w":"blocks","p":"名詞","m":"ブロック、街区"}]},{"id":585,"category":"関係詞問題・トレーニング","question":"Best Electronics has introduced a new range of portable appliances designed for customers who ______ in small apartments.","A":"reside","B":"residing","C":"resident","D":"residence","answer":"A","answer_word":"reside","explanation":"■ 文の骨格\nBest Electronics has introduced a new range of portable appliances designed for customers who ______ in small apartments.\n\n■ 空所に入るもの\n主格の関係代名詞 who の後ろには述語動詞が必要。先行詞 customers は複数。\n→ 空所には「関係詞節の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) reside … 動詞（現在形）「居住する」 ○\n(B) residing … 現在分詞・動名詞「居住していること」 ×\n(C) resident … 名詞（人）／形容詞「住民／居住している」 ×\n(D) residence … 名詞「住居」 ×\n\n■ 完成文\nBest Electronics has introduced a new range of portable appliances designed for customers who reside in small apartments.\n（Best Electronics 社は、狭いアパートに住む顧客向けに設計された携帯型家電の新シリーズを発表した。）\n\n■ 解き方のポイント\n主格の関係代名詞の直後は動詞。先行詞の数に動詞を合わせる。","words":[{"w":"a range of","p":"熟語","m":"〜のシリーズ"},{"w":"portable appliances","p":"名詞","m":"携帯型家電"},{"w":"reside","p":"動詞","m":"居住する"},{"w":"apartments","p":"名詞","m":"アパート"}]},{"id":586,"category":"関係詞問題・トレーニング","question":"The park restoration project is divided into three phases, the first of ______ will be to restore old wooden tables and benches.","A":"which","B":"what","C":"it","D":"that","answer":"A","answer_word":"which","explanation":"■ 文の骨格\nThe park restoration project is divided into three phases, the first of ______ will be to restore old wooden tables and benches.\n\n■ 空所に入るもの\nthe first of ______ の形で、前の three phases を受ける関係代名詞が必要。\n→ 空所には「前置詞 of の目的語になる関係代名詞」が必要です。\n\n■ 選択肢の確認\n(A) which … 関係代名詞（目的格・物）「そのうちの」 ○\n(B) what … 関係代名詞（先行詞を含む）「〜すること」 ×\n(C) it … 代名詞「それ」 ×\n(D) that … 関係代名詞「前置詞の後ろでは使えない」 ×\n\n■ 完成文\nThe park restoration project is divided into three phases, the first of which will be to restore old wooden tables and benches.\n（公園の修復事業は3つの段階に分かれており、その第1段階は古い木製のテーブルとベンチを修復することだ。）\n\n■ 解き方のポイント\n〈数量表現＋of＋which／whom〉の形は頻出。that は前置詞の後ろに置けない。","words":[{"w":"restoration","p":"名詞","m":"修復"},{"w":"divided into","p":"熟語","m":"〜に分けられる"},{"w":"phases","p":"名詞","m":"段階"},{"w":"restore","p":"動詞","m":"修復する"}]},{"id":587,"category":"関係詞問題・トレーニング","question":"______ is selected as the team leader will be required to provide regular motivational talks.","A":"Whoever","B":"What","C":"Where","D":"Whenever","answer":"A","answer_word":"Whoever","explanation":"■ 文の骨格\n______ is selected as the team leader will be required to provide regular motivational talks.\n\n■ 空所に入るもの\n文の主語となる名詞節を導き、「〜する人は誰でも」を表す語が必要。\n→ 空所には「先行詞を含む複合関係代名詞」が必要です。\n\n■ 選択肢の確認\n(A) Whoever … 複合関係代名詞「〜する人は誰でも」 ○\n(B) What … 関係代名詞「〜すること」 ×\n(C) Where … 関係副詞「〜する場所」 ×\n(D) Whenever … 複合関係副詞「〜するときはいつでも」 ×\n\n■ 完成文\nWhoever is selected as the team leader will be required to provide regular motivational talks.\n（チームリーダーに選ばれた人は誰であれ、定期的にやる気を高める話をすることが求められる。）\n\n■ 解き方のポイント\nwhoever＝anyone who。名詞節を導き、文の主語になれる。","words":[{"w":"Whoever","p":"複合関係代名詞","m":"〜する人は誰でも"},{"w":"selected","p":"動詞（過去分詞）","m":"選ばれる"},{"w":"motivational","p":"形容詞","m":"やる気を高める"},{"w":"talks","p":"名詞","m":"話、講話"}]},{"id":588,"category":"関係詞問題・トレーニング","question":"The company's stock, ______ rose steadily over several years to peak at around $149 early last year, closed Monday at $47.77.","A":"this","B":"which","C":"what","D":"where","answer":"B","answer_word":"which","explanation":"■ 文の骨格\nThe company's stock, ______ rose steadily over several years to peak at around $149 early last year, closed Monday at $47.77.\n\n■ 空所に入るもの\nコンマに挟まれた非制限用法で、先行詞 stock を受けて節の主語になる語が必要。\n→ 空所には「物を先行詞とする主格の関係代名詞」が必要です。\n\n■ 選択肢の確認\n(A) this … 指示代名詞「これ」 ×\n(B) which … 関係代名詞（主格・物）「それは」 ○\n(C) what … 関係代名詞（先行詞を含む）「〜すること」 ×\n(D) where … 関係副詞「〜する場所」 ×\n\n■ 完成文\nThe company's stock, which rose steadily over several years to peak at around $149 early last year, closed Monday at $47.77.\n（同社の株価は数年かけて着実に上昇し昨年初めに149ドル前後で頂点をつけたが、月曜日は47.77ドルで引けた。）\n\n■ 解き方のポイント\n非制限用法（コンマ付き）では that は使えない。物なら which。","words":[{"w":"stock","p":"名詞","m":"株価、株式"},{"w":"which","p":"関係代名詞","m":"それは"},{"w":"steadily","p":"副詞","m":"着実に"},{"w":"peak","p":"動詞","m":"頂点に達する"}]},{"id":589,"category":"関係詞問題・トレーニング","question":"A contract valued at $30 million will be awarded to the bidder ______ proposal is deemed the most attractive.","A":"who","B":"whom","C":"whoever","D":"whose","answer":"D","answer_word":"whose","explanation":"■ 文の骨格\nA contract valued at $30 million will be awarded to the bidder ______ proposal is deemed the most attractive.\n\n■ 空所に入るもの\n空所の後ろに名詞 proposal があり、先行詞 the bidder との所有関係を表す関係詞が必要。\n→ 空所には「所有格の関係代名詞」が必要です。\n\n■ 選択肢の確認\n(A) who … 関係代名詞（主格）「〜する人が」 ×\n(B) whom … 関係代名詞（目的格）「〜する人を」 ×\n(C) whoever … 複合関係代名詞「〜する人は誰でも」 ×\n(D) whose … 関係代名詞（所有格）「その〜が」 ○\n\n■ 完成文\nA contract valued at $30 million will be awarded to the bidder whose proposal is deemed the most attractive.\n（3,000万ドル相当の契約は、提案が最も魅力的だと判断された入札者に与えられる。）\n\n■ 解き方のポイント\n〈関係詞＋名詞＋動詞〉なら所有格 whose。who なら直後が動詞になる。","words":[{"w":"contract","p":"名詞","m":"契約"},{"w":"awarded","p":"動詞（過去分詞）","m":"与えられる"},{"w":"bidder","p":"名詞","m":"入札者"},{"w":"deemed","p":"動詞（過去分詞）","m":"判断される"}]},{"id":590,"category":"関係詞問題・トレーニング","question":"The architect, ______ designed the Rainbow Historical Museum, received an award for the work.","A":"he","B":"who","C":"also","D":"some","answer":"B","answer_word":"who","explanation":"■ 文の骨格\nThe architect, ______ designed the Rainbow Historical Museum, received an award for the work.\n\n■ 空所に入るもの\n先行詞 The architect（人）を受け、関係詞節の主語になる語が必要。\n→ 空所には「人を先行詞とする主格の関係代名詞」が必要です。\n\n■ 選択肢の確認\n(A) he … 主格の代名詞「彼は」 ×\n(B) who … 関係代名詞（主格・人）「〜する人が」 ○\n(C) also … 副詞「〜もまた」 ×\n(D) some … 代名詞「いくらか」 ×\n\n■ 完成文\nThe architect, who designed the Rainbow Historical Museum, received an award for the work.\n（Rainbow 歴史博物館を設計したその建築家は、その作品で賞を受けた。）\n\n■ 解き方のポイント\n代名詞 he を入れると節が2つ並んで接続詞がなくなる。つなぐ働きを持つ関係代名詞が必要。","words":[{"w":"architect","p":"名詞","m":"建築家"},{"w":"who","p":"関係代名詞","m":"〜する人が"},{"w":"designed","p":"動詞（過去形）","m":"設計した"},{"w":"award","p":"名詞","m":"賞"}]},{"id":591,"category":"関係詞問題・トレーニング","question":"GacTex Software created a series of video games ______ feature a cute fox and a delightful baby bird.","A":"that","B":"who","C":"where","D":"whose","answer":"A","answer_word":"that","explanation":"■ 文の骨格\nGacTex Software created a series of video games ______ feature a cute fox and a delightful baby bird.\n\n■ 空所に入るもの\n先行詞 video games（物）を受け、関係詞節の主語になる語が必要。\n→ 空所には「物を先行詞とする主格の関係代名詞」が必要です。\n\n■ 選択肢の確認\n(A) that … 関係代名詞（主格）「それらは」 ○\n(B) who … 関係代名詞（人）「〜する人が」 ×\n(C) where … 関係副詞「〜する場所」 ×\n(D) whose … 関係代名詞（所有格）「その〜が」 ×\n\n■ 完成文\nGacTex Software created a series of video games that feature a cute fox and a delightful baby bird.\n（GacTex Software 社は、かわいいキツネと愛らしいひな鳥が登場する一連のビデオゲームを制作した。）\n\n■ 解き方のポイント\n制限用法では that が物・人どちらの先行詞にも使える。後ろが動詞なら主格。","words":[{"w":"a series of","p":"熟語","m":"一連の"},{"w":"video games","p":"名詞","m":"ビデオゲーム"},{"w":"feature","p":"動詞","m":"登場させる"},{"w":"delightful","p":"形容詞","m":"愛らしい"}]},{"id":592,"category":"関係詞問題・トレーニング","question":"The learning program provides online exercises to help employees practice ______ is taught in the workshop.","A":"that","B":"how","C":"which","D":"what","answer":"D","answer_word":"what","explanation":"■ 文の骨格\nThe learning program provides online exercises to help employees practice ______ is taught in the workshop.\n\n■ 空所に入るもの\npractice の目的語となる名詞節を導き、先行詞を含む関係代名詞が必要。\n→ 空所には「先行詞を含む関係代名詞」が必要です。\n\n■ 選択肢の確認\n(A) that … 関係代名詞「（先行詞が必要）」 ×\n(B) how … 疑問副詞「どのように」 ×\n(C) which … 関係代名詞「どちら」 ×\n(D) what … 関係代名詞（先行詞を含む）「〜すること」 ○\n\n■ 完成文\nThe learning program provides online exercises to help employees practice what is taught in the workshop.\n（その学習プログラムは、研修で教わったことを社員が練習できるようオンライン演習を提供している。）\n\n■ 解き方のポイント\nwhat＝the thing which。先行詞がないときは what を使う。","words":[{"w":"exercises","p":"名詞","m":"演習"},{"w":"practice","p":"動詞","m":"練習する"},{"w":"what","p":"関係代名詞","m":"〜すること"},{"w":"taught","p":"動詞（過去分詞）","m":"教えられる"}]},{"id":593,"category":"関係詞問題・実戦問題","question":"Applications for the chief librarian position should be sent ______ electronically or by mail to Brescia Library by February 2.","A":"both","B":"either","C":"neither","D":"so","answer":"B","answer_word":"either","explanation":"■ 文の骨格\nApplications for the chief librarian position should be sent ______ electronically or by mail to Brescia Library by February 2.\n\n■ 空所に入るもの\n後ろに or があり、either A or B（AかBのどちらか）の形になる。\n→ 空所には「or と呼応する相関接続詞」が必要です。\n\n■ 選択肢の確認\n(A) both … 相関接続詞「AとBの両方」 ×\n(B) either … 相関接続詞「AかBのどちらか」 ○\n(C) neither … 相関接続詞「AもBも〜ない」 ×\n(D) so … 等位接続詞「だから」 ×\n\n■ 完成文\nApplications for the chief librarian position should be sent either electronically or by mail to Brescia Library by February 2.\n（司書長職への応募書類は、2月2日までに電子的または郵送で Brescia 図書館へ送付してください。）\n\n■ 解き方のポイント\neither A or B／neither A nor B／both A and B。相手役の語で決まる。","words":[{"w":"Applications","p":"名詞","m":"応募書類"},{"w":"chief librarian","p":"名詞","m":"司書長"},{"w":"either","p":"相関接続詞","m":"どちらか"},{"w":"electronically","p":"副詞","m":"電子的に"}]},{"id":594,"category":"関係詞問題・実戦問題","question":"Employees interested in working overseas should attend both the morning ______ afternoon sessions of the seminar.","A":"and","B":"or","C":"but","D":"so","answer":"A","answer_word":"and","explanation":"■ 文の骨格\nEmployees interested in working overseas should attend both the morning ______ afternoon sessions of the seminar.\n\n■ 空所に入るもの\n前に both があり、both A and B（AとBの両方）の形になる。\n→ 空所には「both と呼応する等位接続詞」が必要です。\n\n■ 選択肢の確認\n(A) and … 等位接続詞「そして」 ○\n(B) or … 等位接続詞「または」 ×\n(C) but … 等位接続詞「しかし」 ×\n(D) so … 等位接続詞「だから」 ×\n\n■ 完成文\nEmployees interested in working overseas should attend both the morning and afternoon sessions of the seminar.\n（海外勤務に関心のある従業員は、セミナーの午前・午後両方のセッションに出席すること。）\n\n■ 解き方のポイント\nboth A and B。both が見えたら and を探す。","words":[{"w":"overseas","p":"副詞","m":"海外で"},{"w":"attend","p":"動詞","m":"出席する"},{"w":"sessions","p":"名詞","m":"セッション、時間帯"}]},{"id":595,"category":"関係詞問題・実戦問題","question":"On weekends, Fernando's Restaurant is ______ crowded that patrons often have to wait for more than 30 minutes to get in.","A":"so","B":"such","C":"highly","D":"very","answer":"A","answer_word":"so","explanation":"■ 文の骨格\nOn weekends, Fernando's Restaurant is ______ crowded that patrons often have to wait for more than 30 minutes to get in.\n\n■ 空所に入るもの\n後ろに that 節があり、so ... that ...（とても〜なので…）の形になる。\n→ 空所には「that と呼応して程度を表す副詞」が必要です。\n\n■ 選択肢の確認\n(A) so … 副詞「とても」 ○\n(B) such … 形容詞「そのような」 ×\n(C) highly … 副詞「非常に」 ×\n(D) very … 副詞「とても」 ×\n\n■ 完成文\nOn weekends, Fernando's Restaurant is so crowded that patrons often have to wait for more than 30 minutes to get in.\n（週末は Fernando’s Restaurant がとても混むので、客はしばしば入店に30分以上待たなければならない。）\n\n■ 解き方のポイント\nso＋形容詞／副詞＋that、such＋(a)＋形容詞＋名詞＋that。後ろの形で使い分ける。","words":[{"w":"crowded","p":"形容詞","m":"混雑した"},{"w":"patrons","p":"名詞","m":"客"},{"w":"get in","p":"熟語","m":"入店する"}]},{"id":596,"category":"関係詞問題・実戦問題","question":"Blue Sky Airways is ______ mechanics that are not only competent at repairs, but also in preventive maintenance.","A":"seeking","B":"prohibiting","C":"looking","D":"escaping","answer":"A","answer_word":"seeking","explanation":"■ 文の骨格\nBlue Sky Airways is ______ mechanics that are not only competent at repairs, but also in preventive maintenance.\n\n■ 空所に入るもの\n直後に名詞 mechanics があるので、前置詞なしで目的語を取れる動詞が必要。\n→ 空所には「目的語を直接取れる他動詞」が必要です。\n\n■ 選択肢の確認\n(A) seeking … 動詞（現在分詞）「探し求めている」 ○\n(B) prohibiting … 動詞（現在分詞）「禁止している」 ×\n(C) looking … 動詞（現在分詞）「見ている（for が必要）」 ×\n(D) escaping … 動詞（現在分詞）「逃げている」 ×\n\n■ 完成文\nBlue Sky Airways is seeking mechanics that are not only competent at repairs, but also in preventive maintenance.\n（Blue Sky 航空は、修理だけでなく予防保守にも長けた整備士を募集している。）\n\n■ 解き方のポイント\nseek は他動詞で前置詞不要。look は look for の形で「探す」。","words":[{"w":"seeking","p":"現在分詞","m":"探し求めている"},{"w":"mechanics","p":"名詞","m":"整備士"},{"w":"competent","p":"形容詞","m":"有能な"},{"w":"preventive maintenance","p":"名詞","m":"予防保守"}]},{"id":597,"category":"関係詞問題・実戦問題","question":"Although the meeting did not start on time, there was still sufficient time to ______ all the issues on the agenda before 6:00 P.M.","A":"proceed","B":"respond","C":"address","D":"inquire","answer":"C","answer_word":"address","explanation":"■ 文の骨格\nAlthough the meeting did not start on time, there was still sufficient time to ______ all the issues on the agenda before 6:00 P.M.\n\n■ 空所に入るもの\n目的語 all the issues と結びついて「問題に対処する」を表す動詞が必要。\n→ 空所には「issues を目的語に取る他動詞」が必要です。\n\n■ 選択肢の確認\n(A) proceed … 動詞（原形）「進む（自動詞）」 ×\n(B) respond … 動詞（原形）「応答する（自動詞）」 ×\n(C) address … 動詞（原形）「対処する、取り上げる」 ○\n(D) inquire … 動詞（原形）「問い合わせる（自動詞）」 ×\n\n■ 完成文\nAlthough the meeting did not start on time, there was still sufficient time to address all the issues on the agenda before 6:00 P.M.\n（会議は定刻に始まらなかったが、午後6時までに議題のすべての問題を取り上げる時間はまだ十分にあった。）\n\n■ 解き方のポイント\naddress は「住所」だけでなく他動詞「（問題に）対処する」で頻出。","words":[{"w":"sufficient","p":"形容詞","m":"十分な"},{"w":"address","p":"動詞","m":"対処する"},{"w":"issues","p":"名詞","m":"問題"},{"w":"agenda","p":"名詞","m":"議題"}]},{"id":598,"category":"関係詞問題・実戦問題","question":"Because her restaurant has been unexpectedly busy, owner Paula Lopez has decided ______ at least five additional people within the month.","A":"hire","B":"hired","C":"hiring","D":"to hire","answer":"D","answer_word":"to hire","explanation":"■ 文の骨格\nBecause her restaurant has been unexpectedly busy, owner Paula Lopez has decided ______ at least five additional people within the month.\n\n■ 空所に入るもの\ndecide は to 不定詞を目的語に取る動詞。\n→ 空所には「decide に続く不定詞」が必要です。\n\n■ 選択肢の確認\n(A) hire … 動詞（原形）「雇う」 ×\n(B) hired … 動詞の過去形・過去分詞「雇った」 ×\n(C) hiring … 現在分詞・動名詞「雇うこと」 ×\n(D) to hire … 不定詞「雇うこと」 ○\n\n■ 完成文\nBecause her restaurant has been unexpectedly busy, owner Paula Lopez has decided to hire at least five additional people within the month.\n（店が予想外に忙しいため、オーナーの Paula Lopez は今月中に少なくとも5人を追加で雇うことにした。）\n\n■ 解き方のポイント\ndecide／hope／plan／manage は不定詞を取る。enjoy／finish／avoid は動名詞。","words":[{"w":"unexpectedly","p":"副詞","m":"予想外に"},{"w":"decided","p":"動詞（過去分詞）","m":"決めた"},{"w":"to hire","p":"不定詞","m":"雇うこと"},{"w":"additional","p":"形容詞","m":"追加の"}]},{"id":599,"category":"関係詞問題・実戦問題","question":"Ms. Wong ______ guests to the restaurant that the ingredients were all fresh.","A":"interpreted","B":"recommended","C":"permitted","D":"assured","answer":"D","answer_word":"assured","explanation":"■ 文の骨格\nMs. Wong ______ guests to the restaurant that the ingredients were all fresh.\n\n■ 空所に入るもの\n目的語に「人」を置き、その後ろに that 節を続けられる動詞が必要。\n→ 空所には「〈人＋that 節〉を取る動詞」が必要です。\n\n■ 選択肢の確認\n(A) interpreted … 動詞（過去形）「通訳した」 ×\n(B) recommended … 動詞（過去形）「推薦した」 ×\n(C) permitted … 動詞（過去形）「許可した」 ×\n(D) assured … 動詞（過去形）「保証した」 ○\n\n■ 完成文\nMs. Wong assured guests to the restaurant that the ingredients were all fresh.\n（Wong さんはレストランの客に、食材はすべて新鮮だと請け合った。）\n\n■ 解き方のポイント\nassure／tell／inform／convince は〈人＋that 節〉の形を取る。","words":[{"w":"assured","p":"動詞（過去形）","m":"保証した"},{"w":"guests","p":"名詞","m":"客"},{"w":"ingredients","p":"名詞","m":"食材"},{"w":"fresh","p":"形容詞","m":"新鮮な"}]},{"id":600,"category":"関係詞問題・実戦問題","question":"The Australian Institute for Risk Assessment is creating five new committees to provide expert ______ on food safety.","A":"opinion","B":"advice","C":"request","D":"proposal","answer":"B","answer_word":"advice","explanation":"■ 文の骨格\nThe Australian Institute for Risk Assessment is creating five new committees to provide expert ______ on food safety.\n\n■ 空所に入るもの\nprovide の目的語で、冠詞がないため不可算名詞が必要。\n→ 空所には「冠詞なしで使える不可算名詞」が必要です。\n\n■ 選択肢の確認\n(A) opinion … 名詞（可算）「意見」 ×\n(B) advice … 名詞（不可算）「助言」 ○\n(C) request … 名詞（可算）「要請」 ×\n(D) proposal … 名詞（可算）「提案」 ×\n\n■ 完成文\nThe Australian Institute for Risk Assessment is creating five new committees to provide expert advice on food safety.\n（オーストラリアリスク評価研究所は、食品安全に関する専門的助言を提供するため、5つの新しい委員会を設置している。）\n\n■ 解き方のポイント\nadvice／information／equipment などは不可算。冠詞や複数形が付かない。","words":[{"w":"Institute","p":"名詞","m":"研究所"},{"w":"committees","p":"名詞","m":"委員会"},{"w":"expert advice","p":"名詞","m":"専門的助言"},{"w":"food safety","p":"名詞","m":"食品安全"}]},{"id":601,"category":"関係詞問題・実戦問題","question":"______ employee of Brown Chemicals should attend the company's annual general meeting on April 10.","A":"Every","B":"Few","C":"Most","D":"All","answer":"A","answer_word":"Every","explanation":"■ 文の骨格\n______ employee of Brown Chemicals should attend the company's annual general meeting on April 10.\n\n■ 空所に入るもの\n直後が単数名詞 employee なので、単数名詞を修飾できる語が必要。\n→ 空所には「単数名詞を修飾する語」が必要です。\n\n■ 選択肢の確認\n(A) Every … 形容詞「すべての（1人ずつの）」 ○\n(B) Few … 形容詞（複数名詞用）「ほとんど〜ない」 ×\n(C) Most … 形容詞（複数名詞用）「大半の」 ×\n(D) All … 形容詞（複数名詞用）「すべての」 ×\n\n■ 完成文\nEvery employee of Brown Chemicals should attend the company's annual general meeting on April 10.\n（Brown Chemicals 社の全従業員は、4月10日の年次株主総会に出席すること。）\n\n■ 解き方のポイント\nevery／each＋単数名詞、all／most／few＋複数名詞。名詞の形で決まる。","words":[{"w":"Every","p":"形容詞","m":"すべての"},{"w":"employee","p":"名詞","m":"従業員"},{"w":"annual general meeting","p":"名詞","m":"年次株主総会"}]},{"id":602,"category":"関係詞問題・実戦問題","question":"One of the requirements is that job applications should be ______ than four pages including the cover letter and résumé.","A":"short","B":"shorter","C":"shortest","D":"shortage","answer":"B","answer_word":"shorter","explanation":"■ 文の骨格\nOne of the requirements is that job applications should be ______ than four pages including the cover letter and résumé.\n\n■ 空所に入るもの\n後ろに than があるので、比較級の形容詞が必要。\n→ 空所には「than と呼応する比較級」が必要です。\n\n■ 選択肢の確認\n(A) short … 形容詞（原級）「短い」 ×\n(B) shorter … 形容詞（比較級）「より短い」 ○\n(C) shortest … 形容詞（最上級）「最も短い」 ×\n(D) shortage … 名詞「不足」 ×\n\n■ 完成文\nOne of the requirements is that job applications should be shorter than four pages including the cover letter and résumé.\n（要件の1つは、応募書類がカバーレターと履歴書を含めて4ページより短くなければならないことだ。）\n\n■ 解き方のポイント\nthan があれば比較級。最上級は the を伴い than とは組まない。","words":[{"w":"requirements","p":"名詞","m":"要件"},{"w":"job applications","p":"名詞","m":"応募書類"},{"w":"shorter","p":"比較級","m":"より短い"},{"w":"résumé","p":"名詞","m":"履歴書"}]},{"id":603,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"One of the requirements is that job applications should be ______ than four pages including the cover letter and résumé.","A":"short","B":"shorter","C":"shortest","D":"shortage","answer":"B","answer_word":"shorter","explanation":"■ 文の骨格\nOne of the requirements is that job applications should be ______ than four pages including the cover letter and résumé.\n\n■ 空所に入るもの\n後ろに than があるので、比較級の形容詞が必要。\n→ 空所には「than と呼応する比較級」が必要です。\n\n■ 選択肢の確認\n(A) short … 形容詞（原級）「短い」 ×\n(B) shorter … 形容詞（比較級）「より短い」 ○\n(C) shortest … 形容詞（最上級）「最も短い」 ×\n(D) shortage … 名詞「不足」 ×\n\n■ 完成文\nOne of the requirements is that job applications should be shorter than four pages including the cover letter and résumé.\n（要件の1つは、応募書類がカバーレターと履歴書を含めて4ページより短くなければならないことだ。）\n\n■ 解き方のポイント\n最上級 shortest は the を伴い、than とは組み合わせられない。","words":[{"w":"requirements","p":"名詞","m":"要件"},{"w":"including","p":"前置詞","m":"〜を含めて"},{"w":"cover letter","p":"名詞","m":"カバーレター"},{"w":"shorter","p":"比較級","m":"より短い"}]},{"id":604,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"The weather conditions leading to the event's cancellation were ______ foreseeable by organizers nor avoidable at such short notice.","A":"either","B":"both","C":"neither","D":"so","answer":"C","answer_word":"neither","explanation":"■ 文の骨格\nThe weather conditions leading to the event's cancellation were ______ foreseeable by organizers nor avoidable at such short notice.\n\n■ 空所に入るもの\n後ろに nor があるので、neither A nor B（AでもBでもない）の形になる。\n→ 空所には「nor と呼応する相関接続詞」が必要です。\n\n■ 選択肢の確認\n(A) either … 相関接続詞「AかBのどちらか」 ×\n(B) both … 相関接続詞「AとBの両方」 ×\n(C) neither … 相関接続詞「AでもBでもない」 ○\n(D) so … 副詞「とても」 ×\n\n■ 完成文\nThe weather conditions leading to the event's cancellation were neither foreseeable by organizers nor avoidable at such short notice.\n（イベント中止につながった気象条件は、主催者に予見できるものでも、急な状況で避けられるものでもなかった。）\n\n■ 解き方のポイント\nneither A nor B／either A or B。相手役の語（nor／or）で決まる。","words":[{"w":"weather conditions","p":"名詞","m":"気象条件"},{"w":"cancellation","p":"名詞","m":"中止"},{"w":"neither","p":"相関接続詞","m":"どちらも〜ない"},{"w":"foreseeable","p":"形容詞","m":"予見できる"},{"w":"at short notice","p":"熟語","m":"急な知らせで"}]},{"id":605,"category":"第7章 ペア表現・語法・数・比較問題（OCR素案）","question":"Not ______ did the company expand its warehouse, but BSC also plans to add five hundred employees this year.","A":"only","B":"yet","C":"still","D":"well","answer":"A","answer_word":"only","explanation":"■ 文の骨格\nNot ______ did the company expand its warehouse, but BSC also plans to add five hundred employees this year.\n\n■ 空所に入るもの\n後ろに but ... also があるので、not only A but also B の形になる。\n→ 空所には「but also と呼応する相関表現」が必要です。\n\n■ 選択肢の確認\n(A) only … 相関表現の一部「〜だけでなく」 ○\n(B) yet … 副詞「まだ」 ×\n(C) still … 副詞「今もなお」 ×\n(D) well … 副詞「よく」 ×\n\n■ 完成文\nNot only did the company expand its warehouse, but BSC also plans to add five hundred employees this year.\n（その会社は倉庫を拡張しただけでなく、BSC 社は今年500人の従業員を追加する計画も立てている。）\n\n■ 解き方のポイント\nNot only が文頭に出ると倒置（did the company expand）が起こる。","words":[{"w":"Not only","p":"相関表現","m":"〜だけでなく"},{"w":"expand","p":"動詞","m":"拡張する"},{"w":"warehouse","p":"名詞","m":"倉庫"},{"w":"employees","p":"名詞","m":"従業員"}]},{"id":606
