onzalez's journey.","A":"complications","B":"complicated","C":"complicating","D":"complication","answer":"D","answer_word":"complication","explanation":"■ 文の骨格\nThe delayed departure of the plane added a further ______ to Mr. Gonzalez's journey.\n\n■ 空所に入るもの\n冠詞 a と形容詞 further の後ろで、単数形の名詞が必要。\n→ 空所には「added の目的語になる単数名詞」が必要です。\n\n■ 選択肢の確認\n(A) complications … 名詞（複数形）「面倒、複雑化」 ×\n(B) complicated … 動詞の過去形・過去分詞／形容詞「複雑な」 ×\n(C) complicating … 現在分詞・動名詞「複雑にすること」 ×\n(D) complication … 名詞（単数形）「面倒、やっかいごと」 ○\n\n■ 完成文\nThe delayed departure of the plane added a further complication to Mr. Gonzalez's journey.\n（飛行機の出発が遅れたことで、Gonzalez さんの旅にさらに面倒が加わった。）\n\n■ 解き方のポイント\n冠詞 a があれば単数名詞。a further ＿＿ の形に注目。","words":[{"w":"delayed","p":"形容詞","m":"遅れた"},{"w":"departure","p":"名詞","m":"出発"},{"w":"further","p":"形容詞","m":"さらなる"},{"w":"complication","p":"名詞","m":"面倒"},{"w":"journey","p":"名詞","m":"旅"}]},{"id":219,"category":"品詞問題・実戦問題 応用編","question":"Nelson College of Marketing will take on a more ______ strategy to attract participants for its training workshops.","A":"aggressive","B":"aggressively","C":"aggression","D":"aggressor","answer":"A","answer_word":"aggressive","explanation":"■ 文の骨格\nNelson College of Marketing will take on a more ______ strategy to attract participants for its training workshops.\n\n■ 空所に入るもの\nmore と名詞 strategy の間にあり、比較級をつくる形容詞が必要。\n→ 空所には「名詞を修飾する形容詞（比較級）」が必要です。\n\n■ 選択肢の確認\n(A) aggressive … 形容詞「積極的な」 ○\n(B) aggressively … 副詞「積極的に」 ×\n(C) aggression … 名詞「攻撃、侵略」 ×\n(D) aggressor … 名詞（人）「攻撃する側」 ×\n\n■ 完成文\nNelson College of Marketing will take on a more aggressive strategy to attract participants for its training workshops.\n（Nelson マーケティング大学は、研修講座の参加者を集めるため、より積極的な戦略を取る。）\n\n■ 解き方のポイント\nmore ＿＿＋名詞 は形容詞の比較級。","words":[{"w":"take on","p":"熟語","m":"採用する、引き受ける"},{"w":"aggressive","p":"形容詞","m":"積極的な"},{"w":"strategy","p":"名詞","m":"戦略"},{"w":"participants","p":"名詞","m":"参加者"}]},{"id":220,"category":"品詞問題・実戦問題 応用編","question":"Charmody skin cream is only effective if applied ______ and immediately after the skin has been washed.","A":"correction","B":"correctly","C":"correcting","D":"corrects","answer":"B","answer_word":"correctly","explanation":"■ 文の骨格\nCharmody skin cream is only effective if applied ______ and immediately after the skin has been washed.\n\n■ 空所に入るもの\napplied（塗られた）を修飾する位置で、and の後ろの副詞 immediately と並列になる。\n→ 空所には「過去分詞 applied を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) correction … 名詞「訂正」 ×\n(B) correctly … 副詞「正しく」 ○\n(C) correcting … 現在分詞・動名詞「訂正すること」 ×\n(D) corrects … 動詞（三人称単数現在形）「訂正する」 ×\n\n■ 完成文\nCharmody skin cream is only effective if applied correctly and immediately after the skin has been washed.\n（Charmody スキンクリームは、正しく、かつ洗顔直後に塗った場合にのみ効果がある。）\n\n■ 解き方のポイント\nand の後ろが副詞 immediately なので、前も副詞。","words":[{"w":"effective","p":"形容詞","m":"効果がある"},{"w":"applied","p":"動詞（過去分詞）","m":"塗られた"},{"w":"correctly","p":"副詞","m":"正しく"},{"w":"immediately","p":"副詞","m":"直後に"}]},{"id":221,"category":"品詞問題・実戦問題 応用編","question":"Every business owner knows that quality of service is a top ______ to attract and retain customers.","A":"prior","B":"priority","C":"prioritize","D":"prioritized","answer":"B","answer_word":"priority","explanation":"■ 文の骨格\nEvery business owner knows that quality of service is a top ______ to attract and retain customers.\n\n■ 空所に入るもの\n冠詞 a と形容詞 top の後ろで、補語となる単数名詞が必要。\n→ 空所には「be動詞の補語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) prior … 形容詞「以前の」 ×\n(B) priority … 名詞「優先事項」 ○\n(C) prioritize … 動詞（原形）「優先する」 ×\n(D) prioritized … 動詞の過去形・過去分詞「優先された」 ×\n\n■ 完成文\nEvery business owner knows that quality of service is a top priority to attract and retain customers.\n（顧客を獲得し維持するうえで、サービスの質が最優先事項であることは、どの事業主も知っている。）\n\n■ 解き方のポイント\na top priority＝「最優先事項」。〈冠詞＋形容詞＋空所〉は名詞。","words":[{"w":"business owner","p":"名詞","m":"事業主"},{"w":"quality of service","p":"名詞","m":"サービスの質"},{"w":"priority","p":"名詞","m":"優先事項"},{"w":"retain","p":"動詞","m":"維持する"}]},{"id":222,"category":"品詞問題・実戦問題 応用編","question":"Lion Construction reported yesterday that its net income had increased by nearly 20 percent in the second quarter, mainly because of ______ market conditions.","A":"improve","B":"improved","C":"improves","D":"improvement","answer":"B","answer_word":"improved","explanation":"■ 文の骨格\nLion Construction reported yesterday that its net income had increased by nearly 20 percent in the second quarter, mainly because of ______ market conditions.\n\n■ 空所に入るもの\nbecause of の目的語 market conditions を修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) improve … 動詞（原形）「改善する」 ×\n(B) improved … 過去分詞・形容詞「改善した」 ○\n(C) improves … 動詞（三人称単数現在形）「改善する」 ×\n(D) improvement … 名詞「改善」 ×\n\n■ 完成文\nLion Construction reported yesterday that its net income had increased by nearly 20 percent in the second quarter, mainly because of improved market conditions.\n（Lion Construction 社は昨日、主に市況の改善により第2四半期の純利益が20％近く増えたと発表した。）\n\n■ 解き方のポイント\n名詞の直前で状態を表すなら過去分詞。improved market conditions は定型。","words":[{"w":"net income","p":"名詞","m":"純利益"},{"w":"quarter","p":"名詞","m":"四半期"},{"w":"mainly","p":"副詞","m":"主に"},{"w":"improved","p":"形容詞","m":"改善した"},{"w":"market conditions","p":"名詞","m":"市況"}]},{"id":223,"category":"品詞問題・実戦問題 応用編","question":"With time running out before the busy season, the board ______ approved a plan to hire temporary factory workers until production targets were met.","A":"swiftly","B":"swift","C":"swiftness","D":"swifts","answer":"A","answer_word":"swiftly","explanation":"■ 文の骨格\nWith time running out before the busy season, the board ______ approved a plan to hire temporary factory workers until production targets were met.\n\n■ 空所に入るもの\n主語 the board と述語動詞 approved の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) swiftly … 副詞「素早く」 ○\n(B) swift … 形容詞「素早い」 ×\n(C) swiftness … 名詞「素早さ」 ×\n(D) swifts … 名詞（複数形）「アマツバメ」 ×\n\n■ 完成文\nWith time running out before the busy season, the board swiftly approved a plan to hire temporary factory workers until production targets were met.\n（繁忙期を前に時間がなくなるなか、取締役会は生産目標を達成するまで臨時の工場作業員を雇う計画を素早く承認した。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉は副詞の定位置。","words":[{"w":"running out","p":"熟語","m":"なくなりつつある"},{"w":"busy season","p":"名詞","m":"繁忙期"},{"w":"swiftly","p":"副詞","m":"素早く"},{"w":"temporary","p":"形容詞","m":"臨時の"},{"w":"production targets","p":"名詞","m":"生産目標"}]},{"id":224,"category":"品詞問題・実戦問題 応用編","question":"The hiring committee have ______ decided that they will appoint Mr. Tremblay as the next CEO.","A":"seeming","B":"seemingly","C":"to seem","D":"seems","answer":"B","answer_word":"seemingly","explanation":"■ 文の骨格\nThe hiring committee have ______ decided that they will appoint Mr. Tremblay as the next CEO.\n\n■ 空所に入るもの\n現在完了形 have decided の間に入る修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) seeming … 現在分詞「〜のように見える」 ×\n(B) seemingly … 副詞「どうやら、一見」 ○\n(C) to seem … 不定詞「〜のように見えること」 ×\n(D) seems … 動詞（三人称単数現在形）「〜のように見える」 ×\n\n■ 完成文\nThe hiring committee have seemingly decided that they will appoint Mr. Tremblay as the next CEO.\n（採用委員会は、どうやら Tremblay 氏を次期 CEO に任命することを決めたようだ。）\n\n■ 解き方のポイント\n〈have/has＋空所＋過去分詞〉は副詞の定位置。","words":[{"w":"hiring committee","p":"名詞","m":"採用委員会"},{"w":"seemingly","p":"副詞","m":"どうやら"},{"w":"decided","p":"動詞（過去分詞）","m":"決めた"},{"w":"appoint","p":"動詞","m":"任命する"}]},{"id":225,"category":"品詞問題・実戦問題 応用編","question":"Tracy Hahn is a ______ trained pastry chef who has been working professionally with chocolate for over 10 years.","A":"formal","B":"formally","C":"formalize","D":"formality","answer":"B","answer_word":"formally","explanation":"■ 文の骨格\nTracy Hahn is a ______ trained pastry chef who has been working professionally with chocolate for over 10 years.\n\n■ 空所に入るもの\n冠詞 a と trained pastry chef の間で、分詞を修飾する位置。\n→ 空所には「過去分詞 trained を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) formal … 形容詞「正式な」 ×\n(B) formally … 副詞「正式に」 ○\n(C) formalize … 動詞（原形）「正式化する」 ×\n(D) formality … 名詞「形式的なこと」 ×\n\n■ 完成文\nTracy Hahn is a formally trained pastry chef who has been working professionally with chocolate for over 10 years.\n（Tracy Hahn は正式な訓練を受けたパティシエで、10年以上プロとしてチョコレートを扱ってきた。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋過去分詞＋名詞〉は副詞。","words":[{"w":"formally","p":"副詞","m":"正式に"},{"w":"trained","p":"過去分詞","m":"訓練を受けた"},{"w":"pastry chef","p":"名詞","m":"パティシエ"},{"w":"professionally","p":"副詞","m":"プロとして"}]},{"id":226,"category":"品詞問題・実戦問題 応用編","question":"Mr. Gao ______ grants interviews and almost never allows journalists onto his company's campus.","A":"rare","B":"rarely","C":"rarity","D":"rareness","answer":"B","answer_word":"rarely","explanation":"■ 文の骨格\nMr. Gao ______ grants interviews and almost never allows journalists onto his company's campus.\n\n■ 空所に入るもの\n主語 Mr. Gao と述語動詞 grants の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) rare … 形容詞「まれな」 ×\n(B) rarely … 副詞「めったに〜しない」 ○\n(C) rarity … 名詞「希少性、珍品」 ×\n(D) rareness … 名詞「まれであること」 ×\n\n■ 完成文\nMr. Gao rarely grants interviews and almost never allows journalists onto his company's campus.\n（Gao 氏はめったに取材に応じず、記者を自社の敷地に入れることもほとんどない。）\n\n■ 解き方のポイント\nrarely は否定の意味を持つ副詞。後半の almost never と呼応している。","words":[{"w":"rarely","p":"副詞","m":"めったに〜しない"},{"w":"grants","p":"動詞","m":"応じる、与える"},{"w":"interviews","p":"名詞","m":"取材"},{"w":"journalists","p":"名詞","m":"記者"},{"w":"campus","p":"名詞","m":"敷地、構内"}]},{"id":227,"category":"品詞問題・実戦問題 応用編","question":"Big Buy, an appliance ______ serving New Jersey, has recently opened a new store on Route 17 in Paramus.","A":"retailer","B":"retail","C":"retailed","D":"retailers","answer":"A","answer_word":"retailer","explanation":"■ 文の骨格\nBig Buy, an appliance ______ serving New Jersey, has recently opened a new store on Route 17 in Paramus.\n\n■ 空所に入るもの\n冠詞 an があるので単数名詞。会社を指す語が必要。\n→ 空所には「Big Buy と同格になる単数名詞（企業）」が必要です。\n\n■ 選択肢の確認\n(A) retailer … 名詞（単数形・企業）「小売業者」 ○\n(B) retail … 名詞／形容詞「小売／小売の」 ×\n(C) retailed … 動詞の過去形・過去分詞「小売された」 ×\n(D) retailers … 名詞（複数形）「小売業者」 ×\n\n■ 完成文\nBig Buy, an appliance retailer serving New Jersey, has recently opened a new store on Route 17 in Paramus.\n（ニュージャージー州を営業圏とする家電小売業者の Big Buy は最近、Paramus の17号線沿いに新店舗を開いた。）\n\n■ 解き方のポイント\n冠詞 an があるので単数形。会社名と同格になる名詞は「業者」。","words":[{"w":"appliance","p":"名詞","m":"家電"},{"w":"retailer","p":"名詞","m":"小売業者"},{"w":"serving","p":"現在分詞","m":"（地域を）担当している"},{"w":"Route","p":"名詞","m":"（幹線）道路"}]},{"id":228,"category":"品詞問題・実戦問題 応用編","question":"Janet Morris ______ declined an award for product design, as she felt others had contributed much more than her.","A":"respect","B":"respectful","C":"respectfully","D":"respects","answer":"C","answer_word":"respectfully","explanation":"■ 文の骨格\nJanet Morris ______ declined an award for product design, as she felt others had contributed much more than her.\n\n■ 空所に入るもの\n主語 Janet Morris と述語動詞 declined の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) respect … 名詞／動詞「敬意／尊敬する」 ×\n(B) respectful … 形容詞「礼儀正しい」 ×\n(C) respectfully … 副詞「丁重に」 ○\n(D) respects … 動詞（三人称単数現在形）／名詞（複数形）「尊敬する／敬意」 ×\n\n■ 完成文\nJanet Morris respectfully declined an award for product design, as she felt others had contributed much more than her.\n（Janet Morris は、自分より貢献した人が他にいると感じたため、製品デザイン賞を丁重に辞退した。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉は副詞の定位置。","words":[{"w":"respectfully","p":"副詞","m":"丁重に"},{"w":"declined","p":"動詞（過去形）","m":"辞退した"},{"w":"award","p":"名詞","m":"賞"},{"w":"contributed","p":"動詞（過去分詞）","m":"貢献した"}]},{"id":229,"category":"品詞問題・実戦問題 応用編","question":"After their flight was canceled, the airline assured passengers that ______ had been made for them to stay at a hotel.","A":"arrange","B":"arranges","C":"arranging","D":"arrangements","answer":"D","answer_word":"arrangements","explanation":"■ 文の骨格\nAfter their flight was canceled, the airline assured passengers that ______ had been made for them to stay at a hotel.\n\n■ 空所に入るもの\nthat 節の述語動詞 had been made に対応する主語が欠けている。\n→ 空所には「that 節の主語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) arrange … 動詞（原形）「手配する」 ×\n(B) arranges … 動詞（三人称単数現在形）「手配する」 ×\n(C) arranging … 現在分詞・動名詞「手配すること」 ×\n(D) arrangements … 名詞（複数形）「手配」 ○\n\n■ 完成文\nAfter their flight was canceled, the airline assured passengers that arrangements had been made for them to stay at a hotel.\n（欠航のあと、航空会社は乗客に、ホテル宿泊の手配が済んでいると保証した。）\n\n■ 解き方のポイント\nmake arrangements（手配する）の受動形。that 節の主語は名詞。","words":[{"w":"canceled","p":"動詞（過去分詞）","m":"欠航になった"},{"w":"assured","p":"動詞（過去形）","m":"保証した"},{"w":"arrangements","p":"名詞","m":"手配"}]},{"id":230,"category":"品詞問題・実戦問題 応用編","question":"Walter Kling, an accomplished fashion ______, has been hired by the company to create images for the May catalog.","A":"photograph","B":"photography","C":"photographic","D":"photographer","answer":"D","answer_word":"photographer","explanation":"■ 文の骨格\nWalter Kling, an accomplished fashion ______, has been hired by the company to create images for the May catalog.\n\n■ 空所に入るもの\n人名 Walter Kling と同格になる位置なので、「人」を表す名詞が必要。\n→ 空所には「人を表す単数名詞」が必要です。\n\n■ 選択肢の確認\n(A) photograph … 名詞「写真（1枚）」 ×\n(B) photography … 名詞（不可算）「写真撮影（技術）」 ×\n(C) photographic … 形容詞「写真の」 ×\n(D) photographer … 名詞（人）「写真家」 ○\n\n■ 完成文\nWalter Kling, an accomplished fashion photographer, has been hired by the company to create images for the May catalog.\n（熟練のファッション写真家である Walter Kling は、5月号カタログ用の写真を撮るため同社に起用された。）\n\n■ 解き方のポイント\n人名との同格は「人」を表す名詞。-er は人を表す語尾。","words":[{"w":"accomplished","p":"形容詞","m":"熟練した"},{"w":"photographer","p":"名詞","m":"写真家"},{"w":"hired","p":"動詞（過去分詞）","m":"起用された"},{"w":"images","p":"名詞","m":"写真、画像"}]},{"id":231,"category":"品詞問題・実戦問題 応用編","question":"A team of animators was employed to create ______ unique animated logos for the company's television advertisements.","A":"visualize","B":"visuals","C":"visually","D":"visualizes","answer":"C","answer_word":"visually","explanation":"■ 文の骨格\nA team of animators was employed to create ______ unique animated logos for the company's television advertisements.\n\n■ 空所に入るもの\n形容詞 unique の前で、形容詞を修飾する位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) visualize … 動詞（原形）「視覚化する」 ×\n(B) visuals … 名詞（複数形）「視覚資料」 ×\n(C) visually … 副詞「視覚的に、見た目に」 ○\n(D) visualizes … 動詞（三人称単数現在形）「視覚化する」 ×\n\n■ 完成文\nA team of animators was employed to create visually unique animated logos for the company's television advertisements.\n（同社のテレビ広告用に、見た目に独特なアニメーションのロゴを作るため、アニメーターのチームが雇われた。）\n\n■ 解き方のポイント\n形容詞の直前の空所は副詞。","words":[{"w":"animators","p":"名詞","m":"アニメーター"},{"w":"employed","p":"動詞（過去分詞）","m":"雇われた"},{"w":"visually","p":"副詞","m":"見た目に"},{"w":"unique","p":"形容詞","m":"独特な"},{"w":"advertisements","p":"名詞","m":"広告"}]},{"id":232,"category":"品詞問題・実戦問題 応用編","question":"Please refer to the product identification ______, which is printed in the upper right hand corner of the warranty.","A":"number","B":"numbers","C":"numbered","D":"numbering","answer":"A","answer_word":"number","explanation":"■ 文の骨格\nPlease refer to the product identification ______, which is printed in the upper right hand corner of the warranty.\n\n■ 空所に入るもの\nrefer to の目的語で、product identification に続く名詞が必要。関係詞の動詞 is から単数。\n→ 空所には「複合名詞をつくる単数名詞」が必要です。\n\n■ 選択肢の確認\n(A) number … 名詞（単数形）「番号」 ○\n(B) numbers … 名詞（複数形）「番号」 ×\n(C) numbered … 動詞の過去形・過去分詞「番号を振られた」 ×\n(D) numbering … 現在分詞・動名詞「番号を振ること」 ×\n\n■ 完成文\nPlease refer to the product identification number, which is printed in the upper right hand corner of the warranty.\n（保証書の右上隅に印字されている製品識別番号をご参照ください。）\n\n■ 解き方のポイント\nproduct identification number（製品識別番号）は複合名詞。which is が単数を示す。","words":[{"w":"refer to","p":"熟語","m":"参照する"},{"w":"identification number","p":"名詞","m":"識別番号"},{"w":"printed","p":"動詞（過去分詞）","m":"印字された"},{"w":"warranty","p":"名詞","m":"保証書"}]},{"id":233,"category":"品詞問題・実戦問題 発展編","question":"Residents were concerned about increased traffic and ______ so, considering the size of the housing project approved for their suburb.","A":"understood","B":"understandable","C":"understandably","D":"understanding","answer":"C","answer_word":"understandably","explanation":"■ 文の骨格\nResidents were concerned about increased traffic and ______ so, considering the size of the housing project approved for their suburb.\n\n■ 空所に入るもの\nand ______ so は「そしてそれももっともだ」を表す挿入表現で、副詞が入る。\n→ 空所には「文全体を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) understood … 動詞の過去形・過去分詞「理解した」 ×\n(B) understandable … 形容詞「理解できる、もっともな」 ×\n(C) understandably … 副詞「当然ながら、もっともなことに」 ○\n(D) understanding … 現在分詞・動名詞／名詞「理解すること／理解」 ×\n\n■ 完成文\nResidents were concerned about increased traffic and understandably so, considering the size of the housing project approved for their suburb.\n（住民は交通量の増加を心配しており、郊外で認可された住宅開発の規模を考えれば当然のことだ。）\n\n■ 解き方のポイント\nand understandably so＝「そしてそれももっともだ」。副詞が so を伴う定型表現。","words":[{"w":"Residents","p":"名詞","m":"住民"},{"w":"concerned about","p":"熟語","m":"〜を心配している"},{"w":"understandably","p":"副詞","m":"当然ながら"},{"w":"housing project","p":"名詞","m":"住宅開発"},{"w":"suburb","p":"名詞","m":"郊外"}]},{"id":234,"category":"品詞問題・実戦問題 発展編","question":"Any information about the impending merger with Sakura First Bank should be kept strictly ______.","A":"confide","B":"confides","C":"confidential","D":"confidentially","answer":"C","answer_word":"confidential","explanation":"■ 文の骨格\nAny information about the impending merger with Sakura First Bank should be kept strictly ______.\n\n■ 空所に入るもの\nkeep O C の形で、目的語（ここでは主語 information）の状態を表す補語が必要。\n→ 空所には「keep の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) confide … 動詞（原形）「打ち明ける」 ×\n(B) confides … 動詞（三人称単数現在形）「打ち明ける」 ×\n(C) confidential … 形容詞「機密の」 ○\n(D) confidentially … 副詞「内密に」 ×\n\n■ 完成文\nAny information about the impending merger with Sakura First Bank should be kept strictly confidential.\n（Sakura First 銀行との差し迫った合併に関する情報は、いかなるものも極秘に扱わなければならない。）\n\n■ 解き方のポイント\nkeep X ＿＿ の空所は補語＝形容詞。副詞は補語になれない。","words":[{"w":"impending","p":"形容詞","m":"差し迫った"},{"w":"merger","p":"名詞","m":"合併"},{"w":"kept","p":"動詞（過去分詞）","m":"保たれる"},{"w":"strictly","p":"副詞","m":"厳格に"},{"w":"confidential","p":"形容詞","m":"機密の"}]},{"id":235,"category":"品詞問題・実戦問題 発展編","question":"The Archeological Museum of New York is an inexpensive attraction that is not listed in major guidebooks but well ______ a visit.","A":"worth","B":"worthy","C":"worthwhile","D":"worthless","answer":"A","answer_word":"worth","explanation":"■ 文の骨格\nThe Archeological Museum of New York is an inexpensive attraction that is not listed in major guidebooks but well ______ a visit.\n\n■ 空所に入るもの\n直後に名詞 a visit が続くので、名詞を目的語に取れる語が必要。\n→ 空所には「前置詞として働く語」が必要です。\n\n■ 選択肢の確認\n(A) worth … 前置詞・形容詞「〜の価値がある」 ○\n(B) worthy … 形容詞「価値がある（of を伴う）」 ×\n(C) worthwhile … 形容詞「やりがいのある」 ×\n(D) worthless … 形容詞「価値のない」 ×\n\n■ 完成文\nThe Archeological Museum of New York is an inexpensive attraction that is not listed in major guidebooks but well worth a visit.\n（ニューヨーク考古学博物館は、主要ガイドブックには載っていないが、訪れる価値が十分にある安価な観光名所だ。）\n\n■ 解き方のポイント\nbe worth＋名詞 の形。worthy は of を、worthwhile は不定詞を伴うのが基本。","words":[{"w":"Archeological","p":"形容詞","m":"考古学の"},{"w":"inexpensive","p":"形容詞","m":"安価な"},{"w":"attraction","p":"名詞","m":"観光名所"},{"w":"worth","p":"前置詞","m":"〜の価値がある"}]},{"id":236,"category":"品詞問題・実戦問題 発展編","question":"______ the most important invention of the last 60 years, computers are used in almost every aspect of our lives.","A":"Argue","B":"Arguing","C":"Arguably","D":"Argument","answer":"C","answer_word":"Arguably","explanation":"■ 文の骨格\n______ the most important invention of the last 60 years, computers are used in almost every aspect of our lives.\n\n■ 空所に入るもの\nBeing が省略された分詞構文の前に置かれ、文全体を修飾する副詞が必要。\n→ 空所には「分詞構文を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) Argue … 動詞（原形）「主張する」 ×\n(B) Arguing … 現在分詞・動名詞「主張すること」 ×\n(C) Arguably … 副詞「おそらく、ほぼ間違いなく」 ○\n(D) Argument … 名詞「議論」 ×\n\n■ 完成文\nArguably the most important invention of the last 60 years, computers are used in almost every aspect of our lives.\n（おそらくこの60年間で最も重要な発明といえるコンピュータは、私たちの生活のほとんどあらゆる場面で使われている。）\n\n■ 解き方のポイント\nArguably＝「おそらく〜といえる」。文頭で文全体を修飾する副詞。","words":[{"w":"Arguably","p":"副詞","m":"おそらく〜といえる"},{"w":"invention","p":"名詞","m":"発明"},{"w":"aspect","p":"名詞","m":"側面、場面"}]},{"id":237,"category":"品詞問題・実戦問題 発展編","question":"______ with this letter is a survey, which should be returned using the self-addressed envelope also supplied.","A":"Enclosed","B":"Enclose","C":"Enclosing","D":"Enclosure","answer":"A","answer_word":"Enclosed","explanation":"■ 文の骨格\n______ with this letter is a survey, which should be returned using the self-addressed envelope also supplied.\n\n■ 空所に入るもの\nA survey is ______ with this letter. の補語部分が文頭に出た倒置。survey と enclose は受動の関係。\n→ 空所には「倒置文の文頭に置く過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) Enclosed … 過去分詞「同封された」 ○\n(B) Enclose … 動詞（原形）「同封する」 ×\n(C) Enclosing … 現在分詞・動名詞「同封すること」 ×\n(D) Enclosure … 名詞「同封物」 ×\n\n■ 完成文\nEnclosed with this letter is a survey, which should be returned using the self-addressed envelope also supplied.\n（本状に同封のアンケートは、同じく同封の返信用封筒を使ってご返送ください。）\n\n■ 解き方のポイント\nEnclosed is [are] ... は「〜を同封しております」の定型。倒置に慣れておく。","words":[{"w":"Enclosed","p":"過去分詞","m":"同封された"},{"w":"survey","p":"名詞","m":"アンケート"},{"w":"returned","p":"動詞（過去分詞）","m":"返送される"},{"w":"self-addressed envelope","p":"名詞","m":"返信用封筒"}]},{"id":238,"category":"品詞問題・実戦問題 発展編","question":"The Green Scholars Program offers undergraduate students who have a ______ interest in environmental issues an opportunity to attend the Oslo Green Forum.","A":"demonstrate","B":"demonstrated","C":"demonstrating","D":"demonstration","answer":"B","answer_word":"demonstrated","explanation":"■ 文の骨格\nThe Green Scholars Program offers undergraduate students who have a ______ interest in environmental issues an opportunity to attend the Oslo Green Forum.\n\n■ 空所に入るもの\n冠詞 a と名詞 interest の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) demonstrate … 動詞（原形）「示す、実演する」 ×\n(B) demonstrated … 過去分詞・形容詞「明確に示された」 ○\n(C) demonstrating … 現在分詞・動名詞「示すこと」 ×\n(D) demonstration … 名詞「実演、デモ」 ×\n\n■ 完成文\nThe Green Scholars Program offers undergraduate students who have a demonstrated interest in environmental issues an opportunity to attend the Oslo Green Forum.\n（Green Scholars プログラムは、環境問題に明確な関心を示している学部生に、Oslo Green Forum に参加する機会を提供している。）\n\n■ 解き方のポイント\na demonstrated interest＝「はっきり示された関心」。名詞の前で受け身なら過去分詞。","words":[{"w":"undergraduate students","p":"名詞","m":"学部生"},{"w":"demonstrated","p":"形容詞","m":"明確に示された"},{"w":"environmental issues","p":"名詞","m":"環境問題"},{"w":"opportunity","p":"名詞","m":"機会"}]},{"id":239,"category":"品詞問題・実戦問題 発展編","question":"The ideal candidate for the position will require at least 10 years of work experience in human resources at a ______ level.","A":"manage","B":"manageable","C":"manageably","D":"managerial","answer":"D","answer_word":"managerial","explanation":"■ 文の骨格\nThe ideal candidate for the position will require at least 10 years of work experience in human resources at a ______ level.\n\n■ 空所に入るもの\n冠詞 a と名詞 level の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) manage … 動詞（原形）「管理する」 ×\n(B) manageable … 形容詞「扱いやすい」 ×\n(C) manageably … 副詞「扱いやすく」 ×\n(D) managerial … 形容詞「管理職の」 ○\n\n■ 完成文\nThe ideal candidate for the position will require at least 10 years of work experience in human resources at a managerial level.\n（この職の理想的な候補者には、人事分野で管理職レベルの実務経験が少なくとも10年必要となる。）\n\n■ 解き方のポイント\n形容詞が2つ残ったら文意で選ぶ。「管理職レベル」なら managerial。","words":[{"w":"ideal candidate","p":"名詞","m":"理想的な候補者"},{"w":"require","p":"動詞","m":"必要とする"},{"w":"human resources","p":"名詞","m":"人事"},{"w":"managerial","p":"形容詞","m":"管理職の"},{"w":"level","p":"名詞","m":"レベル"}]},{"id":240,"category":"品詞問題・実戦問題 発展編","question":"To ventilate your home during the summer, windows and internal doors should be left ______ overnight in a secure manner.","A":"open","B":"opening","C":"opener","D":"opens","answer":"A","answer_word":"open","explanation":"■ 文の骨格\nTo ventilate your home during the summer, windows and internal doors should be left ______ overnight in a secure manner.\n\n■ 空所に入るもの\nleave O C の形で、目的語（主語 windows and doors）の状態を表す補語が必要。\n→ 空所には「leave の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) open … 形容詞「開いた（状態の）」 ○\n(B) opening … 現在分詞・動名詞「開けること」 ×\n(C) opener … 名詞「開けるもの、栓抜き」 ×\n(D) opens … 動詞（三人称単数現在形）「開ける」 ×\n\n■ 完成文\nTo ventilate your home during the summer, windows and internal doors should be left open overnight in a secure manner.\n（夏場に家を換気するには、窓や室内のドアを安全な方法で一晩開け放しておくとよい。）\n\n■ 解き方のポイント\nleave X open＝「Xを開けたままにする」。補語には形容詞。","words":[{"w":"ventilate","p":"動詞","m":"換気する"},{"w":"internal doors","p":"名詞","m":"室内のドア"},{"w":"left","p":"動詞（過去分詞）","m":"〜のままにされる"},{"w":"open","p":"形容詞","m":"開いた"},{"w":"overnight","p":"副詞","m":"一晩中"}]},{"id":241,"category":"品詞問題・実戦問題 発展編","question":"Scientists at Warsaw's Central Laboratory have been trying to find cleaner ways of ______ coal.","A":"burn","B":"burned","C":"burning","D":"burns","answer":"C","answer_word":"burning","explanation":"■ 文の骨格\nScientists at Warsaw's Central Laboratory have been trying to find cleaner ways of ______ coal.\n\n■ 空所に入るもの\n前置詞 of の後ろで、さらに目的語 coal を取れる形が必要。\n→ 空所には「前置詞 of の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) burn … 動詞（原形）「燃やす」 ×\n(B) burned … 動詞の過去形・過去分詞「燃やされた」 ×\n(C) burning … 動名詞「燃やすこと」 ○\n(D) burns … 動詞（三人称単数現在形）「燃やす」 ×\n\n■ 完成文\nScientists at Warsaw's Central Laboratory have been trying to find cleaner ways of burning coal.\n（ワルシャワ中央研究所の科学者たちは、石炭をより汚染の少ない方法で燃やす手段を探し続けている。）\n\n■ 解き方のポイント\n前置詞の後ろで目的語を取るなら動名詞。ways of doing の形。","words":[{"w":"Scientists","p":"名詞","m":"科学者"},{"w":"Laboratory","p":"名詞","m":"研究所"},{"w":"cleaner","p":"比較級","m":"より汚染の少ない"},{"w":"burning","p":"動名詞","m":"燃やすこと"},{"w":"coal","p":"名詞","m":"石炭"}]},{"id":242,"category":"品詞問題・実戦問題 発展編","question":"All ______ must be picked up from the storage room at least one hour before the store opens.","A":"delivery","B":"deliveries","C":"delivers","D":"delivering","answer":"B","answer_word":"deliveries","explanation":"■ 文の骨格\nAll ______ must be picked up from the storage room at least one hour before the store opens.\n\n■ 空所に入るもの\nAll の後ろで、述語動詞 must be picked up の主語となる複数名詞が必要。\n→ 空所には「文の主語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) delivery … 名詞（単数形）「配達」 ×\n(B) deliveries … 名詞（複数形）「配達物」 ○\n(C) delivers … 動詞（三人称単数現在形）「配達する」 ×\n(D) delivering … 現在分詞・動名詞「配達すること」 ×\n\n■ 完成文\nAll deliveries must be picked up from the storage room at least one hour before the store opens.\n（配達物はすべて、開店の少なくとも1時間前までに保管室から引き取らなければならない。）\n\n■ 解き方のポイント\nAll の後ろの可算名詞は複数形。","words":[{"w":"deliveries","p":"名詞","m":"配達物"},{"w":"picked up","p":"熟語","m":"引き取られる"},{"w":"storage room","p":"名詞","m":"保管室"},{"w":"at least","p":"熟語","m":"少なくとも"}]},{"id":243,"category":"品詞問題・実戦問題 発展編","question":"A survey shows that only an ______ 30 percent of the workforce in the textile industry is female.","A":"estimate","B":"estimates","C":"estimated","D":"estimating","answer":"C","answer_word":"estimated","explanation":"■ 文の骨格\nA survey shows that only an ______ 30 percent of the workforce in the textile industry is female.\n\n■ 空所に入るもの\n冠詞 an と 30 percent の間で、「見積もられた」と受け身の意味で修飾する語が必要。\n→ 空所には「数詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) estimate … 名詞／動詞「見積もり／見積もる」 ×\n(B) estimates … 動詞（三人称単数現在形）「見積もる」 ×\n(C) estimated … 過去分詞・形容詞「推定の」 ○\n(D) estimating … 現在分詞・動名詞「見積もること」 ×\n\n■ 完成文\nA survey shows that only an estimated 30 percent of the workforce in the textile industry is female.\n（ある調査によれば、繊維業界の労働力のうち女性は推定でわずか30％にすぎない。）\n\n■ 解き方のポイント\nan estimated ＋数詞＝「推定〜」。数字を伴う定型表現。","words":[{"w":"survey","p":"名詞","m":"調査"},{"w":"estimated","p":"形容詞","m":"推定の"},{"w":"workforce","p":"名詞","m":"労働力"},{"w":"textile industry","p":"名詞","m":"繊維業界"},{"w":"female","p":"形容詞","m":"女性の"}]},{"id":244,"category":"品詞問題・実戦問題 発展編","question":"Nishiwaki Corporation has been acquired by Blue Ocean Electronics in a deal ______ at 1 billion yen.","A":"value","B":"valued","C":"valuation","D":"values","answer":"B","answer_word":"valued","explanation":"■ 文の骨格\nNishiwaki Corporation has been acquired by Blue Ocean Electronics in a deal ______ at 1 billion yen.\n\n■ 空所に入るもの\n名詞 a deal を後ろから修飾する位置で、deal と value は受け身の関係。\n→ 空所には「名詞を後ろから修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) value … 名詞／動詞「価値／評価する」 ×\n(B) valued … 過去分詞「評価された」 ○\n(C) valuation … 名詞「評価額、査定」 ×\n(D) values … 動詞（三人称単数現在形）／名詞（複数形）「評価する／価値観」 ×\n\n■ 完成文\nNishiwaki Corporation has been acquired by Blue Ocean Electronics in a deal valued at 1 billion yen.\n（Nishiwaki 社は、10億円と評価された取引で Blue Ocean Electronics 社に買収された。）\n\n■ 解き方のポイント\n名詞の後ろに置く分詞は、受け身なら過去分詞。valued at X＝「X と評価された」。","words":[{"w":"acquired","p":"動詞（過去分詞）","m":"買収された"},{"w":"deal","p":"名詞","m":"取引"},{"w":"valued","p":"過去分詞","m":"評価された"},{"w":"billion","p":"名詞","m":"10億"}]},{"id":245,"category":"品詞問題・実戦問題 発展編","question":"The rules ______ employee use of company-owned mobile phones are outlined in the employee handbook.","A":"concerning","B":"concern","C":"concerns","D":"concerned","answer":"A","answer_word":"concerning","explanation":"■ 文の骨格\nThe rules ______ employee use of company-owned mobile phones are outlined in the employee handbook.\n\n■ 空所に入るもの\n主語 The rules を後ろから修飾し、名詞 employee use を目的語に取る語が必要。\n→ 空所には「前置詞として働く現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) concerning … 前置詞（現在分詞由来）「〜に関する」 ○\n(B) concern … 動詞（原形）／名詞「関係する／懸念」 ×\n(C) concerns … 動詞（三人称単数現在形）／名詞（複数形）「関係する／懸念」 ×\n(D) concerned … 過去分詞・形容詞「心配している」 ×\n\n■ 完成文\nThe rules concerning employee use of company-owned mobile phones are outlined in the employee handbook.\n（社員による社用携帯電話の使用に関する規定は、社員手帳に要点が記されている。）\n\n■ 解き方のポイント\nconcerning＝regarding／about。前置詞として働く分詞。","words":[{"w":"rules","p":"名詞","m":"規定"},{"w":"concerning","p":"前置詞","m":"〜に関する"},{"w":"company-owned","p":"形容詞","m":"会社所有の"},{"w":"outlined","p":"動詞（過去分詞）","m":"要点が記される"},{"w":"handbook","p":"名詞","m":"手帳、便覧"}]},{"id":246,"category":"品詞問題・実戦問題 発展編","question":"Factory workers were ______ of the company for its failure to keep them informed about the shutdown plans.","A":"critical","B":"critic","C":"criticized","D":"criticism","answer":"A","answer_word":"critical","explanation":"■ 文の骨格\nFactory workers were ______ of the company for its failure to keep them informed about the shutdown plans.\n\n■ 空所に入るもの\nwere の補語が欠けており、of と結びついて意味が通る形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) critical … 形容詞「批判的な」 ○\n(B) critic … 名詞（人）「批評家」 ×\n(C) criticized … 動詞の過去形・過去分詞「批判された」 ×\n(D) criticism … 名詞「批判」 ×\n\n■ 完成文\nFactory workers were critical of the company for its failure to keep them informed about the shutdown plans.\n（工場労働者たちは、操業停止計画を知らせなかった会社に対して批判的だった。）\n\n■ 解き方のポイント\nbe critical of X＝「Xに批判的である」。critical には「重要な」の意味もある。","words":[{"w":"critical","p":"形容詞","m":"批判的な"},{"w":"failure","p":"名詞","m":"怠ること、失敗"},{"w":"informed","p":"過去分詞","m":"知らされた"},{"w":"shutdown","p":"名詞","m":"操業停止"}]},{"id":247,"category":"品詞問題・実戦問題 発展編","question":"FastLine Computers opened 10 call centers last year and plans to add another 10 this year as part of its growth ______.","A":"initial","B":"initially","C":"initiative","D":"initialization","answer":"C","answer_word":"initiative","explanation":"■ 文の骨格\nFastLine Computers opened 10 call centers last year and plans to add another 10 this year as part of its growth ______.\n\n■ 空所に入るもの\n所有格 its と growth の後ろで、前置詞句 as part of の目的語となる名詞が必要。\n→ 空所には「growth と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) initial … 形容詞「最初の」 ×\n(B) initially … 副詞「最初は」 ×\n(C) initiative … 名詞「戦略、新たな取り組み」 ○\n(D) initialization … 名詞「初期化」 ×\n\n■ 完成文\nFastLine Computers opened 10 call centers last year and plans to add another 10 this year as part of its growth initiative.\n（FastLine Computers 社は昨年コールセンターを10か所開設し、成長戦略の一環として今年さらに10か所増やす計画だ。）\n\n■ 解き方のポイント\ngrowth initiative＝「成長戦略」。文末の空所は名詞が入ることが多い。","words":[{"w":"call centers","p":"名詞","m":"コールセンター"},{"w":"as part of","p":"熟語","m":"〜の一環として"},{"w":"growth","p":"名詞","m":"成長"},{"w":"initiative","p":"名詞","m":"戦略、新たな取り組み"}]},{"id":248,"category":"品詞問題・実戦問題 発展編","question":"______ to the state from Europe consist of food and beverages despite the large farming industry that exists here.","A":"Imports","B":"Importing","C":"Importers","D":"Imported","answer":"A","answer_word":"Imports","explanation":"■ 文の骨格\n______ to the state from Europe consist of food and beverages despite the large farming industry that exists here.\n\n■ 空所に入るもの\n文頭が空所で、述語動詞 consist（複数形に対応）の主語となる複数名詞が必要。\n→ 空所には「文の主語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) Imports … 名詞（複数形・もの）「輸入品」 ○\n(B) Importing … 現在分詞・動名詞「輸入すること」 ×\n(C) Importers … 名詞（複数形・人）「輸入業者」 ×\n(D) Imported … 動詞の過去形・過去分詞「輸入された」 ×\n\n■ 完成文\nImports to the state from Europe consist of food and beverages despite the large farming industry that exists here.\n（大規模な農業が存在するにもかかわらず、ヨーロッパからその州への輸入品は飲食料品で構成されている。）\n\n■ 解き方のポイント\nconsist of food and beverages の主語になれるのは「もの」。人を表す Importers では意味が通らない。","words":[{"w":"Imports","p":"名詞","m":"輸入品"},{"w":"consist of","p":"熟語","m":"〜で構成される"},{"w":"beverages","p":"名詞","m":"飲料"},{"w":"despite","p":"前置詞","m":"〜にもかかわらず"},{"w":"farming industry","p":"名詞","m":"農業"}]},{"id":249,"category":"品詞問題・実戦問題 発展編","question":"Only applications from candidates who meet all eligibility ______ will be replied to.","A":"require","B":"requirement","C":"requirements","D":"requires","answer":"C","answer_word":"requirements","explanation":"■ 文の骨格\nOnly applications from candidates who meet all eligibility ______ will be replied to.\n\n■ 空所に入るもの\n他動詞 meet の目的語で、all があるので複数形の名詞が必要。\n→ 空所には「eligibility と複合名詞をつくる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) require … 動詞（原形）「必要とする」 ×\n(B) requirement … 名詞（単数形）「要件」 ×\n(C) requirements … 名詞（複数形）「要件」 ○\n(D) requires … 動詞（三人称単数現在形）「必要とする」 ×\n\n■ 完成文\nOnly applications from candidates who meet all eligibility requirements will be replied to.\n（すべての資格要件を満たす候補者からの応募にのみ、返信いたします。）\n\n■ 解き方のポイント\nall の後ろの可算名詞は複数形。eligibility requirements（資格要件）は定型。","words":[{"w":"applications","p":"名詞","m":"応募"},{"w":"candidates","p":"名詞","m":"候補者"},{"w":"meet","p":"動詞","m":"満たす"},{"w":"eligibility requirements","p":"名詞","m":"資格要件"},{"w":"replied to","p":"熟語","m":"返信される"}]},{"id":250,"category":"品詞問題・実戦問題 発展編","question":"Some industry experts predict that Sunrise Computers will continue to make ______ in computer technology.","A":"advance","B":"advances","C":"advancing","D":"advanced","answer":"B","answer_word":"advances","explanation":"■ 文の骨格\nSome industry experts predict that Sunrise Computers will continue to make ______ in computer technology.\n\n■ 空所に入るもの\n他動詞 make の目的語が欠けており、冠詞がないので複数形が必要。\n→ 空所には「make の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) advance … 名詞（単数形）／動詞「前進／前進する」 ×\n(B) advances … 名詞（複数形）「進歩、革新」 ○\n(C) advancing … 現在分詞・動名詞「前進すること」 ×\n(D) advanced … 過去分詞・形容詞「先進的な」 ×\n\n■ 完成文\nSome industry experts predict that Sunrise Computers will continue to make advances in computer technology.\n（Sunrise Computers 社がコンピュータ技術で進歩を続けると予測する業界専門家もいる。）\n\n■ 解き方のポイント\nmake advances in X＝「Xで進歩を遂げる」。冠詞がなければ複数形。","words":[{"w":"industry experts","p":"名詞","m":"業界専門家"},{"w":"predict","p":"動詞","m":"予測する"},{"w":"advances","p":"名詞","m":"進歩"},{"w":"technology","p":"名詞","m":"技術"}]},{"id":251,"category":"品詞問題・実戦問題 発展編","question":"Icon Air confirmed today that it plans to resume aircraft ______ at its factory in Kerrville in January after a five-year absence from the market.","A":"product","B":"produced","C":"produce","D":"production","answer":"D","answer_word":"production","explanation":"■ 文の骨格\nIcon Air confirmed today that it plans to resume aircraft ______ at its factory in Kerrville in January after a five-year absence from the market.\n\n■ 空所に入るもの\n他動詞 resume の目的語で、aircraft に続く名詞が必要。\n→ 空所には「aircraft と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) product … 名詞（可算）「製品」 ×\n(B) produced … 動詞の過去形・過去分詞「生産された」 ×\n(C) produce … 動詞（原形）／名詞「生産する／農産物」 ×\n(D) production … 名詞（不可算）「生産」 ○\n\n■ 完成文\nIcon Air confirmed today that it plans to resume aircraft production at its factory in Kerrville in January after a five-year absence from the market.\n（Icon Air 社は本日、市場から5年間撤退したのち、1月に Kerrville 工場で航空機生産を再開する計画だと明らかにした。）\n\n■ 解き方のポイント\naircraft production（航空機生産）は複合名詞。冠詞がないので不可算名詞を選ぶ。","words":[{"w":"confirmed","p":"動詞（過去形）","m":"明らかにした"},{"w":"resume","p":"動詞","m":"再開する"},{"w":"aircraft","p":"名詞","m":"航空機"},{"w":"production","p":"名詞","m":"生産"},{"w":"absence","p":"名詞","m":"不在、撤退"}]},{"id":252,"category":"品詞問題・実戦問題 発展編","question":"Furniture ______ made online may be returned for any reason, so long as the packaging has not been removed.","A":"purchase","B":"purchases","C":"purchased","D":"purchasing","answer":"B","answer_word":"purchases","explanation":"■ 文の骨格\nFurniture ______ made online may be returned for any reason, so long as the packaging has not been removed.\n\n■ 空所に入るもの\n直後の made は述語動詞ではなく主語を修飾する過去分詞。Furniture と複合名詞をつくる主語が必要。\n→ 空所には「文の主語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) purchase … 名詞（単数形）／動詞「購入／購入する」 ×\n(B) purchases … 名詞（複数形）「購入（品）」 ○\n(C) purchased … 動詞の過去形・過去分詞「購入された」 ×\n(D) purchasing … 現在分詞・動名詞「購入すること」 ×\n\n■ 完成文\nFurniture purchases made online may be returned for any reason, so long as the packaging has not been removed.\n（オンラインで購入された家具は、包装が外されていない限り、いかなる理由でも返品できる。）\n\n■ 解き方のポイント\nFurniture purchases made online（オンラインでなされた家具の購入）という主語のかたまり。","words":[{"w":"Furniture","p":"名詞","m":"家具"},{"w":"purchases","p":"名詞","m":"購入（品）"},{"w":"returned","p":"動詞（過去分詞）","m":"返品される"},{"w":"so long as","p":"熟語","m":"〜する限り"},{"w":"packaging","p":"名詞","m":"包装"}]},{"id":253,"category":"品詞問題・実戦問題 発展編","question":"Prospective students are required to complete the introductory course prior to ______ for Advanced Programming Theory.","A":"register","B":"registered","C":"registering","D":"registrar","answer":"C","answer_word":"registering","explanation":"■ 文の骨格\nProspective students are required to complete the introductory course prior to ______ for Advanced Programming Theory.\n\n■ 空所に入るもの\nprior to の to は前置詞なので、後ろには名詞か動名詞が入る。\n→ 空所には「前置詞 prior to の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) register … 動詞（原形）「登録する」 ×\n(B) registered … 動詞の過去形・過去分詞「登録された」 ×\n(C) registering … 動名詞「登録すること」 ○\n(D) registrar … 名詞（人）「学籍係、登録官」 ×\n\n■ 完成文\nProspective students are required to complete the introductory course prior to registering for Advanced Programming Theory.\n（入学希望者は、Advanced Programming Theory に登録する前に、入門講座を修了する必要がある。）\n\n■ 解き方のポイント\nprior to の to は前置詞。不定詞の to と混同させるのが定番の罠。","words":[{"w":"Prospective students","p":"名詞","m":"入学希望者"},{"w":"introductory course","p":"名詞","m":"入門講座"},{"w":"prior to","p":"熟語","m":"〜の前に"},{"w":"registering","p":"動名詞","m":"登録すること"}]},{"id":254,"category":"品詞問題・実戦問題 発展編","question":"Far more calls were received from disappointed fans than ______ after the concerts by Jack Chan were canceled.","A":"anticipate","B":"anticipation","C":"anticipating","D":"anticipated","answer":"D","answer_word":"anticipated","explanation":"■ 文の骨格\nFar more calls were received from disappointed fans than ______ after the concerts by Jack Chan were canceled.\n\n■ 空所に入るもの\nthan の後ろは than (they had been) anticipated の省略形で、受動の意味を表す過去分詞が必要。\n→ 空所には「than の後ろに置く過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) anticipate … 動詞（原形）「予想する」 ×\n(B) anticipation … 名詞「予想、期待」 ×\n(C) anticipating … 現在分詞・動名詞「予想すること」 ×\n(D) anticipated … 過去分詞「予想された」 ○\n\n■ 完成文\nFar more calls were received from disappointed fans than anticipated after the concerts by Jack Chan were canceled.\n（Jack Chan のコンサートが中止になったあと、落胆したファンから予想をはるかに上回る数の電話が寄せられた。）\n\n■ 解き方のポイント\nthan の後ろでは主語と be 動詞が省略されることが多い。前半が受動態なら後ろも過去分詞。","words":[{"w":"Far more","p":"比較級","m":"はるかに多くの"},{"w":"received","p":"動詞（過去分詞）","m":"受け取られた"},{"w":"disappointed","p":"形容詞","m":"落胆した"},{"w":"anticipated","p":"過去分詞","m":"予想された"}]},{"id":255,"category":"品詞問題・実戦問題 発展編","question":"The Indiana Mineral Association has secured a room rate of $109 per night ______ taxes at the Marion Hotel during the annual convention.","A":"exclude","B":"excluded","C":"excluding","D":"excludes","answer":"C","answer_word":"excluding","explanation":"■ 文の骨格\nThe Indiana Mineral Association has secured a room rate of $109 per night ______ taxes at the Marion Hotel during the annual convention.\n\n■ 空所に入るもの\n名詞 taxes を目的語に取り、直前の a room rate を修飾する語が必要。\n→ 空所には「前置詞として働く現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) exclude … 動詞（原形）「除外する」 ×\n(B) excluded … 動詞の過去形・過去分詞「除外された」 ×\n(C) excluding … 前置詞（現在分詞由来）「〜を除いて」 ○\n(D) excludes … 動詞（三人称単数現在形）「除外する」 ×\n\n■ 完成文\nThe Indiana Mineral Association has secured a room rate of $109 per night excluding taxes at the Marion Hotel during the annual convention.\n（Indiana 鉱物協会は年次大会の期間中、Marion ホテルで税抜1泊109ドルの部屋料金を確保した。）\n\n■ 解き方のポイント\nexcluding／including は前置詞として働く分詞。直後に名詞が来る。","words":[{"w":"secured","p":"動詞（過去分詞）","m":"確保した"},{"w":"room rate","p":"名詞","m":"部屋料金"},{"w":"excluding","p":"前置詞","m":"〜を除いて"},{"w":"taxes","p":"名詞","m":"税"},{"w":"convention","p":"名詞","m":"大会"}]},{"id":256,"category":"品詞問題・実戦問題 発展編","question":"The amount of traffic the company Web site attracted before the product launch was an ______ sign for the marketing division.","A":"encourage","B":"encouraged","C":"encouraging","D":"encourages","answer":"C","answer_word":"encouraging","explanation":"■ 文の骨格\nThe amount of traffic the company Web site attracted before the product launch was an ______ sign for the marketing division.\n\n■ 空所に入るもの\n冠詞 an と名詞 sign の間にあり、「励みになる」と能動の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) encourage … 動詞（原形）「励ます」 ×\n(B) encouraged … 過去分詞・形容詞「励まされた（人が主語）」 ×\n(C) encouraging … 形容詞（現在分詞由来）「励みになる」 ○\n(D) encourages … 動詞（三人称単数現在形）「励ます」 ×\n\n■ 完成文\nThe amount of traffic the company Web site attracted before the product launch was an encouraging sign for the marketing division.\n（製品発売前に同社ウェブサイトが集めたアクセス数は、マーケティング部にとって励みになる兆候だった。）\n\n■ 解き方のポイント\nencouraging（人を励ます側）と encouraged（人が励まされる側）の区別が定番。","words":[{"w":"amount","p":"名詞","m":"量"},{"w":"traffic","p":"名詞","m":"アクセス数"},{"w":"product launch","p":"名詞","m":"製品発売"},{"w":"encouraging","p":"形容詞","m":"励みになる"},{"w":"division","p":"名詞","m":"部門"}]},{"id":257,"category":"品詞問題・実戦問題 発展編","question":"The amount of traffic the company Web site attracted before the product launch was an ______ sign for the marketing division.","A":"encourage","B":"encouraged","C":"encouraging","D":"encourages","answer":"C","answer_word":"encouraging","explanation":"■ 文の骨格\nThe amount of traffic the company Web site attracted before the product launch was an ______ sign for the marketing division.\n\n■ 空所に入るもの\n冠詞 an と名詞 sign の間にあり、「励みになる」と能動の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) encourage … 動詞（原形）「励ます」 ×\n(B) encouraged … 過去分詞・形容詞「励まされた（人が主語）」 ×\n(C) encouraging … 形容詞（現在分詞由来）「励みになる」 ○\n(D) encourages … 動詞（三人称単数現在形）「励ます」 ×\n\n■ 完成文\nThe amount of traffic the company Web site attracted before the product launch was an encouraging sign for the marketing division.\n（製品発売前に同社ウェブサイトが集めたアクセス数は、マーケティング部にとって励みになる兆候だった。）\n\n■ 解き方のポイント\n感情を表す分詞は、修飾する名詞が「与える側」なら -ing、「受ける側」なら -ed。","words":[{"w":"amount","p":"名詞","m":"量"},{"w":"attracted","p":"動詞（過去形）","m":"集めた"},{"w":"launch","p":"名詞","m":"発売"},{"w":"encouraging","p":"形容詞","m":"励みになる"},{"w":"sign","p":"名詞","m":"兆候"}]},{"id":258,"category":"品詞問題・実戦問題 発展編","question":"As a special benefit for conference attendees, complimentary Wi-Fi service will be available in hotel rooms ______ through this Web site.","A":"book","B":"booked","C":"books","D":"booking","answer":"B","answer_word":"booked","explanation":"■ 文の骨格\nAs a special benefit for conference attendees, complimentary Wi-Fi service will be available in hotel rooms ______ through this Web site.\n\n■ 空所に入るもの\n名詞 hotel rooms を後ろから修飾する位置で、rooms と book は受け身の関係。\n→ 空所には「名詞を後ろから修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) book … 動詞（原形）／名詞「予約する／本」 ×\n(B) booked … 過去分詞「予約された」 ○\n(C) books … 動詞（三人称単数現在形）／名詞（複数形）「予約する／本」 ×\n(D) booking … 現在分詞・動名詞「予約すること」 ×\n\n■ 完成文\nAs a special benefit for conference attendees, complimentary Wi-Fi service will be available in hotel rooms booked through this Web site.\n（会議参加者への特典として、このウェブサイト経由で予約されたホテルの客室では無料 Wi-Fi をご利用いただけます。）\n\n■ 解き方のポイント\n名詞の後ろの分詞は、受け身なら過去分詞。","words":[{"w":"attendees","p":"名詞","m":"参加者"},{"w":"complimentary","p":"形容詞","m":"無料の"},{"w":"available","p":"形容詞","m":"利用できる"},{"w":"booked","p":"過去分詞","m":"予約された"}]},{"id":259,"category":"品詞問題・実戦問題 発展編","question":"It was decided to post the important safety video on the Internet to ensure that it reached the ______ possible audience.","A":"broadest","B":"broad","C":"broadly","D":"broaden","answer":"A","answer_word":"broadest","explanation":"■ 文の骨格\nIt was decided to post the important safety video on the Internet to ensure that it reached the ______ possible audience.\n\n■ 空所に入るもの\nthe と possible audience の間にあり、the ＿＿ possible の形で最上級をつくる形容詞が必要。\n→ 空所には「名詞を修飾する形容詞（最上級）」が必要です。\n\n■ 選択肢の確認\n(A) broadest … 形容詞（最上級）「最も幅広い」 ○\n(B) broad … 形容詞「幅広い」 ×\n(C) broadly … 副詞「広く」 ×\n(D) broaden … 動詞（原形）「広げる」 ×\n\n■ 完成文\nIt was decided to post the important safety video on the Internet to ensure that it reached the broadest possible audience.\n（重要な安全説明の動画をできるだけ幅広い視聴者に確実に届けるため、インターネット上に公開することが決まった。）\n\n■ 解き方のポイント\nthe ＿＿ possible＝「できるだけ〜な」。the があるので最上級。","words":[{"w":"decided","p":"動詞（過去分詞）","m":"決められた"},{"w":"post","p":"動詞","m":"公開する、投稿する"},{"w":"ensure","p":"動詞","m":"確実にする"},{"w":"broadest","p":"形容詞（最上級）","m":"最も幅広い"},{"w":"audience","p":"名詞","m":"視聴者"}]},{"id":260,"category":"品詞問題・実戦問題 発展編","question":"The parks department has plans for three new inner city parks and has made the information ______ accessible from its Web site.","A":"readily","B":"ready","C":"readying","D":"readiness","answer":"A","answer_word":"readily","explanation":"■ 文の骨格\nThe parks department has plans for three new inner city parks and has made the information ______ accessible from its Web site.\n\n■ 空所に入るもの\nmake O C の C にあたる形容詞 accessible がすでにあり、空所はそれを修飾する位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) readily … 副詞「容易に、すぐに」 ○\n(B) ready … 形容詞「用意ができた」 ×\n(C) readying … 現在分詞・動名詞「準備すること」 ×\n(D) readiness … 名詞「準備できていること」 ×\n\n■ 完成文\nThe parks department has plans for three new inner city parks and has made the information readily accessible from its Web site.\n（公園課は市街地に3つの新公園を設ける計画を立てており、その情報を自らのウェブサイトから容易に閲覧できるようにしている。）\n\n■ 解き方のポイント\nmake X ＿＿ accessible の空所は形容詞を修飾する副詞。","words":[{"w":"parks department","p":"名詞","m":"公園課"},{"w":"inner city","p":"名詞","m":"市街地"},{"w":"readily","p":"副詞","m":"容易に"},{"w":"accessible","p":"形容詞","m":"閲覧できる"}]},{"id":261,"category":"品詞問題・実戦問題 発展編","question":"Eagle Joe's Pizza delivers to Mermaid Waters and ______ areas at no extra cost.","A":"surround","B":"surrounding","C":"surrounded","D":"surrounds","answer":"B","answer_word":"surrounding","explanation":"■ 文の骨格\nEagle Joe's Pizza delivers to Mermaid Waters and ______ areas at no extra cost.\n\n■ 空所に入るもの\nand の後ろで名詞 areas を修飾する語が必要。areas が「取り囲む」側なので能動。\n→ 空所には「名詞を修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) surround … 動詞（原形）「取り囲む」 ×\n(B) surrounding … 現在分詞・形容詞「周辺の」 ○\n(C) surrounded … 過去分詞「取り囲まれた」 ×\n(D) surrounds … 動詞（三人称単数現在形）「取り囲む」 ×\n\n■ 完成文\nEagle Joe's Pizza delivers to Mermaid Waters and surrounding areas at no extra cost.\n（Eagle Joe’s Pizza は、Mermaid Waters とその周辺地域へ追加料金なしで配達している。）\n\n■ 解き方のポイント\nsurrounding areas＝「周辺地域」。名詞の前で能動なら現在分詞。","words":[{"w":"delivers","p":"動詞","m":"配達する"},{"w":"surrounding","p":"形容詞","m":"周辺の"},{"w":"areas","p":"名詞","m":"地域"},{"w":"at no extra cost","p":"熟語","m":"追加料金なしで"}]},{"id":262,"category":"品詞問題・実戦問題 発展編","question":"Alan Chan was entrusted with a ______ and costly project due to the high degree of success he had been enjoying.","A":"challenge","B":"challenged","C":"challenging","D":"challenges","answer":"C","answer_word":"challenging","explanation":"■ 文の骨格\nAlan Chan was entrusted with a ______ and costly project due to the high degree of success he had been enjoying.\n\n■ 空所に入るもの\nand の後ろが形容詞 costly なので、前も名詞 project を修飾する形容詞が必要。\n→ 空所には「costly と並列になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) challenge … 名詞／動詞「課題／異議を唱える」 ×\n(B) challenged … 過去分詞「異議を唱えられた」 ×\n(C) challenging … 形容詞（現在分詞由来）「やりがいのある」 ○\n(D) challenges … 動詞（三人称単数現在形）／名詞（複数形）「課題」 ×\n\n■ 完成文\nAlan Chan was entrusted with a challenging and costly project due to the high degree of success he had been enjoying.\n（Alan Chan は、これまで収めてきた高い成功を評価され、やりがいがあり費用もかかる事業を任された。）\n\n■ 解き方のポイント\nand の前後は同じ品詞。challenging は「骨は折れるがやりがいのある」。","words":[{"w":"entrusted with","p":"熟語","m":"〜を任された"},{"w":"challenging","p":"形容詞","m":"やりがいのある"},{"w":"costly","p":"形容詞","m":"費用のかかる"},{"w":"degree","p":"名詞","m":"程度"}]},{"id":263,"category":"品詞問題・実戦問題 発展編","question":"______ housed in a facility designed by a Swiss architecture firm, the Nagano Youth Museum reopened in October 2012.","A":"New","B":"Newest","C":"Newness","D":"Newly","answer":"D","answer_word":"Newly","explanation":"■ 文の骨格\n______ housed in a facility designed by a Swiss architecture firm, the Nagano Youth Museum reopened in October 2012.\n\n■ 空所に入るもの\n分詞構文の過去分詞 housed を修飾する位置。\n→ 空所には「過去分詞 housed を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) New … 形容詞「新しい」 ×\n(B) Newest … 形容詞（最上級）「最も新しい」 ×\n(C) Newness … 名詞「新しさ」 ×\n(D) Newly … 副詞「新たに」 ○\n\n■ 完成文\nNewly housed in a facility designed by a Swiss architecture firm, the Nagano Youth Museum reopened in October 2012.\n（長野青少年博物館は、スイスの建築事務所が設計した施設に新たに入居し、2012年10月に再開館した。）\n\n■ 解き方のポイント\n分詞の直前は副詞。newly＋過去分詞は頻出パターン。","words":[{"w":"Newly","p":"副詞","m":"新たに"},{"w":"housed","p":"過去分詞","m":"収容された"},{"w":"facility","p":"名詞","m":"施設"},{"w":"architecture firm","p":"名詞","m":"建築事務所"},{"w":"reopened","p":"動詞（過去形）","m":"再開館した"}]},{"id":264,"category":"品詞問題・実戦問題 発展編","question":"The apparel catalog is divided into ______ by clothing type so that customers can easily locate the items they wish to purchase.","A":"section","B":"sections","C":"sectioning","D":"sectioned","answer":"B","answer_word":"sections","explanation":"■ 文の骨格\nThe apparel catalog is divided into ______ by clothing type so that customers can easily locate the items they wish to purchase.\n\n■ 空所に入るもの\nbe divided into の後ろで、冠詞がないため複数形の名詞が必要。\n→ 空所には「前置詞 into の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) section … 名詞（単数形）「区分、部門」 ×\n(B) sections … 名詞（複数形）「区分、部門」 ○\n(C) sectioning … 現在分詞・動名詞「区分すること」 ×\n(D) sectioned … 動詞の過去形・過去分詞「区分された」 ×\n\n■ 完成文\nThe apparel catalog is divided into sections by clothing type so that customers can easily locate the items they wish to purchase.\n（その衣料カタログは、客が買いたい商品を簡単に見つけられるよう、衣類の種類ごとに区分されている。）\n\n■ 解き方のポイント\nbe divided into sections（複数の区分に分かれる）。「分かれる」先は複数。","words":[{"w":"apparel","p":"名詞","m":"衣料"},{"w":"divided into","p":"熟語","m":"〜に分けられる"},{"w":"sections","p":"名詞","m":"区分"},{"w":"clothing type","p":"名詞","m":"衣類の種類"},{"w":"locate","p":"動詞","m":"見つける"}]},{"id":265,"category":"品詞問題・実戦問題 発展編","question":"With its spas, saunas, massage rooms, and fitness center, Stallard Towers Hotel provides a ______ stay for business and leisure travelers alike.","A":"refresh","B":"refreshed","C":"refreshing","D":"refreshments","answer":"C","answer_word":"refreshing","explanation":"■ 文の骨格\nWith its spas, saunas, massage rooms, and fitness center, Stallard Towers Hotel provides a ______ stay for business and leisure travelers alike.\n\n■ 空所に入るもの\n冠詞 a と名詞 stay の間にあり、「元気を回復させる」と能動の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) refresh … 動詞（原形）「元気づける」 ×\n(B) refreshed … 過去分詞・形容詞「元気を回復した（人が主語）」 ×\n(C) refreshing … 形容詞（現在分詞由来）「さわやかな、癒やされる」 ○\n(D) refreshments … 名詞（複数形）「軽食、飲み物」 ×\n\n■ 完成文\nWith its spas, saunas, massage rooms, and fitness center, Stallard Towers Hotel provides a refreshing stay for business and leisure travelers alike.\n（スパ、サウナ、マッサージルーム、フィットネスセンターを備えた Stallard Towers ホテルは、出張・観光いずれの旅行者にも癒やしの滞在を提供する。）\n\n■ 解き方のポイント\n感情を与える側は -ing、受ける側は -ed。stay は「与える側」。","words":[{"w":"saunas","p":"名詞","m":"サウナ"},{"w":"refreshing","p":"形容詞","m":"癒やされる"},{"w":"stay","p":"名詞","m":"滞在"},{"w":"leisure","p":"名詞","m":"余暇、観光"},{"w":"alike","p":"副詞","m":"同様に"}]},{"id":266,"category":"品詞問題・実戦問題 発展編","question":"Colorado Café will introduce a new line of coffee with a free ______ at Braxton Supermarket on Thursday, June 16, from 2 P.M.","A":"tasting","B":"tasty","C":"tasted","D":"taste","answer":"A","answer_word":"tasting","explanation":"■ 文の骨格\nColorado Café will introduce a new line of coffee with a free ______ at Braxton Supermarket on Thursday, June 16, from 2 P.M.\n\n■ 空所に入るもの\na free と前置詞 at の間にあり、前置詞 with の目的語となる名詞が必要。\n→ 空所には「冠詞＋形容詞の後ろに置く名詞」が必要です。\n\n■ 選択肢の確認\n(A) tasting … 名詞「試飲会」 ○\n(B) tasty … 形容詞「おいしい」 ×\n(C) tasted … 動詞の過去形・過去分詞「味わった」 ×\n(D) taste … 名詞／動詞「味／味がする」 ×\n\n■ 完成文\nColorado Café will introduce a new line of coffee with a free tasting at Braxton Supermarket on Thursday, June 16, from 2 P.M.\n（Colorado Café は6月16日木曜の午後2時から、Braxton スーパーでの無料試飲会で新しいコーヒーのシリーズを紹介する。）\n\n■ 解き方のポイント\n〈冠詞＋形容詞＋空所＋前置詞〉は名詞。taste（味）では意味が通らない。","words":[{"w":"introduce","p":"動詞","m":"紹介する"},{"w":"a line of","p":"熟語","m":"〜のシリーズ"},{"w":"free","p":"形容詞","m":"無料の"},{"w":"tasting","p":"名詞","m":"試飲会"}]},{"id":267,"category":"品詞問題・実戦問題 発展編","question":"A recent survey found that more than a quarter of Japanese mobile broadband subscribers are ______ to renew their contracts.","A":"unlike","B":"unlikable","C":"unlikely","D":"unlikeness","answer":"C","answer_word":"unlikely","explanation":"■ 文の骨格\nA recent survey found that more than a quarter of Japanese mobile broadband subscribers are ______ to renew their contracts.\n\n■ 空所に入るもの\nare の補語が欠けており、to 不定詞を伴う形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) unlike … 前置詞「〜と違って」 ×\n(B) unlikable … 形容詞「好ましくない」 ×\n(C) unlikely … 形容詞「〜しそうにない」 ○\n(D) unlikeness … 名詞「似ていないこと」 ×\n\n■ 完成文\nA recent survey found that more than a quarter of Japanese mobile broadband subscribers are unlikely to renew their contracts.\n（最近の調査で、日本のモバイルブロードバンド契約者の4分の1以上が契約を更新しそうにないことが分かった。）\n\n■ 解き方のポイント\nbe unlikely to do＝「〜しそうにない」。前置詞 unlike との混同が狙われる。","words":[{"w":"survey","p":"名詞","m":"調査"},{"w":"quarter","p":"名詞","m":"4分の1"},{"w":"subscribers","p":"名詞","m":"契約者"},{"w":"unlikely","p":"形容詞","m":"〜しそうにない"},{"w":"renew","p":"動詞","m":"更新する"}]},{"id":268,"category":"品詞問題・実戦問題 発展編","question":"This book contains 15 tips to help improve ______ morale and boost productivity within an organization.","A":"employ","B":"employed","C":"employs","D":"employee","answer":"D","answer_word":"employee","explanation":"■ 文の骨格\nThis book contains 15 tips to help improve ______ morale and boost productivity within an organization.\n\n■ 空所に入るもの\n他動詞 improve の目的語で、morale の前に置かれる名詞が必要。\n→ 空所には「morale と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) employ … 動詞（原形）「雇う」 ×\n(B) employed … 動詞の過去形・過去分詞「雇われた」 ×\n(C) employs … 動詞（三人称単数現在形）「雇う」 ×\n(D) employee … 名詞「従業員」 ○\n\n■ 完成文\nThis book contains 15 tips to help improve employee morale and boost productivity within an organization.\n（本書には、組織内の従業員の士気を高め生産性を上げるための15のヒントが載っている。）\n\n■ 解き方のポイント\nemployee morale（従業員の士気）は複合名詞。名詞＋名詞の形に慣れる。","words":[{"w":"contains","p":"動詞","m":"含む"},{"w":"tips","p":"名詞","m":"ヒント"},{"w":"employee morale","p":"名詞","m":"従業員の士気"},{"w":"boost","p":"動詞","m":"高める"},{"w":"productivity","p":"名詞","m":"生産性"}]},{"id":269,"category":"品詞問題・実戦問題 発展編","question":"Now the owner of a large restaurant chain, Mr. Lim believes that persistence is a ______ of a successful entrepreneur.","A":"characterize","B":"characters","C":"characteristic","D":"characterization","answer":"C","answer_word":"characteristic","explanation":"■ 文の骨格\nNow the owner of a large restaurant chain, Mr. Lim believes that persistence is a ______ of a successful entrepreneur.\n\n■ 空所に入るもの\n冠詞 a の後ろで、主語 persistence とイコール関係になる名詞が必要。\n→ 空所には「be動詞の補語になる単数名詞」が必要です。\n\n■ 選択肢の確認\n(A) characterize … 動詞（原形）「特徴づける」 ×\n(B) characters … 名詞（複数形）「登場人物、文字」 ×\n(C) characteristic … 名詞（単数形）「特徴、特質」 ○\n(D) characterization … 名詞「特徴づけ、描写」 ×\n\n■ 完成文\nNow the owner of a large restaurant chain, Mr. Lim believes that persistence is a characteristic of a successful entrepreneur.\n（今や大手レストランチェーンの経営者である Lim 氏は、粘り強さが成功する起業家の特質だと考えている。）\n\n■ 解き方のポイント\ncharacteristic は「特徴」という名詞でも「特有の」という形容詞でも使う多品詞語。","words":[{"w":"persistence","p":"名詞","m":"粘り強さ"},{"w":"characteristic","p":"名詞","m":"特質、特徴"},{"w":"successful","p":"形容詞","m":"成功した"},{"w":"entrepreneur","p":"名詞","m":"起業家"}]},{"id":270,"category":"品詞問題・実戦問題 発展編","question":"According to a recent survey, real estate agencies remain cautiously ______ about the housing market in Miami.","A":"optimistic","B":"optimize","C":"optimistically","D":"optimism","answer":"A","answer_word":"optimistic","explanation":"■ 文の骨格\nAccording to a recent survey, real estate agencies remain cautiously ______ about the housing market in Miami.\n\n■ 空所に入るもの\nremain は S+V+C の形をとる動詞で、副詞 cautiously に修飾される補語の形容詞が必要。\n→ 空所には「remain の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) optimistic … 形容詞「楽観的な」 ○\n(B) optimize … 動詞（原形）「最適化する」 ×\n(C) optimistically … 副詞「楽観的に」 ×\n(D) optimism … 名詞「楽観主義」 ×\n\n■ 完成文\nAccording to a recent survey, real estate agencies remain cautiously optimistic about the housing market in Miami.\n（最近の調査によれば、不動産業者はマイアミの住宅市場について慎重ながらも楽観的な見方を保っている。）\n\n■ 解き方のポイント\nremain の後ろは補語＝形容詞。副詞 cautiously があるからといって副詞は入らない。","words":[{"w":"real estate agencies","p":"名詞","m":"不動産業者"},{"w":"remain","p":"動詞","m":"〜のままである"},{"w":"cautiously","p":"副詞","m":"慎重に"},{"w":"optimistic","p":"形容詞","m":"楽観的な"},{"w":"housing market","p":"名詞","m":"住宅市場"}]},{"id":271,"category":"品詞問題・実戦問題 発展編","question":"In her recent book, Marketing Success, the author claims that ______ targeting specific audiences are often the most successful.","A":"advertisements","B":"advertised","C":"advertising","D":"advertises","answer":"A","answer_word":"advertisements","explanation":"■ 文の骨格\nIn her recent book, Marketing Success, the author claims that ______ targeting specific audiences are often the most successful.\n\n■ 空所に入るもの\nthat 節の述語動詞 are に対応する複数形の主語が必要。targeting 以下は主語を修飾する分詞句。\n→ 空所には「that 節の主語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) advertisements … 名詞（複数形）「広告」 ○\n(B) advertised … 動詞の過去形・過去分詞「宣伝された」 ×\n(C) advertising … 名詞（不可算）「広告活動」 ×\n(D) advertises … 動詞（三人称単数現在形）「宣伝する」 ×\n\n■ 完成文\nIn her recent book, Marketing Success, the author claims that advertisements targeting specific audiences are often the most successful.\n（著者は著書『Marketing Success』の中で、特定の対象者に向けた広告がしばしば最も成功していると主張している。）\n\n■ 解き方のポイント\n述語動詞 are が複数主語を要求している。不可算の advertising では are と合わない。","words":[{"w":"author","p":"名詞","m":"著者"},{"w":"claims","p":"動詞","m":"主張する"},{"w":"advertisements","p":"名詞","m":"広告"},{"w":"targeting","p":"現在分詞","m":"対象とする"},{"w":"audiences","p":"名詞","m":"対象者、視聴者"}]},{"id":272,"category":"品詞問題・実戦問題 発展編","question":"In her recent book, Marketing Success, the author claims that ______ targeting specific audiences are often the most successful.","A":"advertisements","B":"advertised","C":"advertising","D":"advertises","answer":"A","answer_word":"advertisements","explanation":"■ 文の骨格\nIn her recent book, Marketing Success, the author claims that ______ targeting specific audiences are often the most successful.\n\n■ 空所に入るもの\nthat 節の述語動詞 are に対応する複数形の主語が必要。\n→ 空所には「that 節の主語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) advertisements … 名詞（複数形）「広告」 ○\n(B) advertised … 動詞の過去形・過去分詞「宣伝された」 ×\n(C) advertising … 名詞（不可算）「広告活動」 ×\n(D) advertises … 動詞（三人称単数現在形）「宣伝する」 ×\n\n■ 完成文\nIn her recent book, Marketing Success, the author claims that advertisements targeting specific audiences are often the most successful.\n（著者は著書『Marketing Success』の中で、特定の対象者に向けた広告がしばしば最も成功していると主張している。）\n\n■ 解き方のポイント\nadvertisement（広告1点・可算）と advertising（広告活動・不可算）の使い分け。","words":[{"w":"recent","p":"形容詞","m":"最近の"},{"w":"advertisements","p":"名詞","m":"広告"},{"w":"specific","p":"形容詞","m":"特定の"},{"w":"successful","p":"形容詞","m":"成功した"}]},{"id":273,"category":"品詞問題・実戦問題 発展編","question":"Thanks to clear skies and careful ______, the seventh annual Greenfield Road Race saw its biggest turnout yet, with approximately 500 runners.","A":"plan","B":"planned","C":"planning","D":"planner","answer":"C","answer_word":"planning","explanation":"■ 文の骨格\nThanks to clear skies and careful ______, the seventh annual Greenfield Road Race saw its biggest turnout yet, with approximately 500 runners.\n\n■ 空所に入るもの\nThanks to の目的語で、clear skies と並列になる名詞が必要。\n→ 空所には「形容詞 careful に修飾される名詞」が必要です。\n\n■ 選択肢の確認\n(A) plan … 名詞（可算）／動詞「計画／計画する」 ×\n(B) planned … 動詞の過去形・過去分詞「計画された」 ×\n(C) planning … 名詞（不可算）「計画立案」 ○\n(D) planner … 名詞（人）「立案者」 ×\n\n■ 完成文\nThanks to clear skies and careful planning, the seventh annual Greenfield Road Race saw its biggest turnout yet, with approximately 500 runners.\n（晴天と綿密な計画のおかげで、第7回 Greenfield ロードレースは約500人のランナーが集まり過去最多の参加となった。）\n\n■ 解き方のポイント\n冠詞がないので不可算名詞 planning を選ぶ。plan は可算名詞で a が必要。","words":[{"w":"Thanks to","p":"熟語","m":"〜のおかげで"},{"w":"annual","p":"形容詞","m":"毎年恒例の"},{"w":"planning","p":"名詞","m":"計画立案"},{"w":"turnout","p":"名詞","m":"参加者数"},{"w":"approximately","p":"副詞","m":"約"}]},{"id":274,"category":"品詞問題・実戦問題 発展編","question":"The Axis 3000, a new energy-efficient hybrid car, has extraordinary ______ for global sales, said automotive writer, Alex Tokudaiji.","A":"potent","B":"potential","C":"potentially","D":"potentiality","answer":"B","answer_word":"potential","explanation":"■ 文の骨格\nThe Axis 3000, a new energy-efficient hybrid car, has extraordinary ______ for global sales, said automotive writer, Alex Tokudaiji.\n\n■ 空所に入るもの\n形容詞 extraordinary に修飾され、他動詞 has の目的語となる名詞が必要。\n→ 空所には「has の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) potent … 形容詞「強力な」 ×\n(B) potential … 名詞「可能性、潜在力」 ○\n(C) potentially … 副詞「潜在的に」 ×\n(D) potentiality … 名詞「潜在性」 ×\n\n■ 完成文\nThe Axis 3000, a new energy-efficient hybrid car, has extraordinary potential for global sales, said automotive writer, Alex Tokudaiji.\n（自動車ライターの Alex Tokudaiji 氏は、燃費のよい新型ハイブリッド車 Axis 3000 は世界販売で並外れた可能性を秘めていると述べた。）\n\n■ 解き方のポイント\npotential は形容詞・名詞の両方で使う。ここは目的語なので名詞。","words":[{"w":"energy-efficient","p":"形容詞","m":"燃費のよい"},{"w":"extraordinary","p":"形容詞","m":"並外れた"},{"w":"potential","p":"名詞","m":"可能性"},{"w":"automotive","p":"形容詞","m":"自動車の"}]},{"id":275,"category":"品詞問題・実戦問題 発展編","question":"Mr. Hoffman, a company spokesperson, said on TV that Nile Electronics Ltd. has raised worker ______ through consistent training programs.","A":"productivity","B":"produces","C":"to produce","D":"productively","answer":"A","answer_word":"productivity","explanation":"■ 文の骨格\nMr. Hoffman, a company spokesperson, said on TV that Nile Electronics Ltd. has raised worker ______ through consistent training programs.\n\n■ 空所に入るもの\n他動詞 has raised の目的語で、worker に続く名詞が必要。\n→ 空所には「worker と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) productivity … 名詞「生産性」 ○\n(B) produces … 動詞（三人称単数現在形）／名詞「生産する／農産物」 ×\n(C) to produce … 不定詞「生産すること」 ×\n(D) productively … 副詞「生産的に」 ×\n\n■ 完成文\nMr. Hoffman, a company spokesperson, said on TV that Nile Electronics Ltd. has raised worker productivity through consistent training programs.\n（会社の広報担当 Hoffman 氏はテレビで、Nile Electronics 社が一貫した研修プログラムによって従業員の生産性を高めたと述べた。）\n\n■ 解き方のポイント\nworker productivity（従業員の生産性）は複合名詞。他動詞の目的語は名詞。","words":[{"w":"spokesperson","p":"名詞","m":"広報担当"},{"w":"raised","p":"動詞（過去分詞）","m":"高めた"},{"w":"productivity","p":"名詞","m":"生産性"},{"w":"consistent","p":"形容詞","m":"一貫した"}]},{"id":276,"category":"品詞問題・実戦問題 発展編","question":"Since its ______ 50 years ago, the Richmond Chamber of Commerce has worked tirelessly to build the local economy.","A":"establish","B":"establishment","C":"establishments","D":"established","answer":"B","answer_word":"establishment","explanation":"■ 文の骨格\nSince its ______ 50 years ago, the Richmond Chamber of Commerce has worked tirelessly to build the local economy.\n\n■ 空所に入るもの\n前置詞 Since の目的語で、所有格 its に続く名詞が必要。\n→ 空所には「所有格 its の後ろに置く名詞」が必要です。\n\n■ 選択肢の確認\n(A) establish … 動詞（原形）「設立する」 ×\n(B) establishment … 名詞（単数形）「設立」 ○\n(C) establishments … 名詞（複数形）「施設、設立」 ×\n(D) established … 動詞の過去形・過去分詞「設立された」 ×\n\n■ 完成文\nSince its establishment 50 years ago, the Richmond Chamber of Commerce has worked tirelessly to build the local economy.\n（50年前の設立以来、Richmond 商工会議所は地域経済を築くため休みなく活動してきた。）\n\n■ 解き方のポイント\n〈前置詞＋所有格＋空所〉は名詞。its なので単数形。","words":[{"w":"establishment","p":"名詞","m":"設立"},{"w":"Chamber of Commerce","p":"名詞","m":"商工会議所"},{"w":"tirelessly","p":"副詞","m":"休みなく"},{"w":"local economy","p":"名詞","m":"地域経済"}]},{"id":277,"category":"品詞問題・実戦問題 発展編","question":"Seaside Resort Hotel is offering ______ of up to 40 percent on all stays until September 30 as long as they are booked by July 1.","A":"discounts","B":"discount","C":"discounter","D":"discounting","answer":"A","answer_word":"discounts","explanation":"■ 文の骨格\nSeaside Resort Hotel is offering ______ of up to 40 percent on all stays until September 30 as long as they are booked by July 1.\n\n■ 空所に入るもの\n他動詞 offering の目的語が欠けており、冠詞がないので複数形が必要。\n→ 空所には「offering の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) discounts … 名詞（複数形）「割引」 ○\n(B) discount … 名詞（単数形）／動詞「割引／割り引く」 ×\n(C) discounter … 名詞（人）「安売り業者」 ×\n(D) discounting … 現在分詞・動名詞「割り引くこと」 ×\n\n■ 完成文\nSeaside Resort Hotel is offering discounts of up to 40 percent on all stays until September 30 as long as they are booked by July 1.\n（Seaside Resort ホテルは、7月1日までに予約すれば9月30日までの全宿泊に最大40％の割引を提供している。）\n\n■ 解き方のポイント\n冠詞のない可算名詞は複数形。","words":[{"w":"offering","p":"現在分詞","m":"提供している"},{"w":"discounts","p":"名詞","m":"割引"},{"w":"up to","p":"熟語","m":"最大〜まで"},{"w":"as long as","p":"熟語","m":"〜する限り"},{"w":"booked","p":"動詞（過去分詞）","m":"予約される"}]},{"id":278,"category":"品詞問題・実戦問題 発展編","question":"If guests find noise from the renovation work ______, they may transfer to another local hotel after the first day.","A":"object","B":"objected","C":"objecting","D":"objectionable","answer":"D","answer_word":"objectionable","explanation":"■ 文の骨格\nIf guests find noise from the renovation work ______, they may transfer to another local hotel after the first day.\n\n■ 空所に入るもの\nfind O C（OがCだと分かる）の形で、noise の状態を表す補語が必要。\n→ 空所には「find の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) object … 動詞（原形）／名詞「反対する／物体」 ×\n(B) objected … 動詞の過去形・過去分詞「反対した」 ×\n(C) objecting … 現在分詞・動名詞「反対すること」 ×\n(D) objectionable … 形容詞「不愉快な、耐えがたい」 ○\n\n■ 完成文\nIf guests find noise from the renovation work objectionable, they may transfer to another local hotel after the first day.\n（改装工事の騒音が不快だと感じたお客様は、初日以降ほかの地元ホテルへ移っていただけます。）\n\n■ 解き方のポイント\nfind O C の C は形容詞。noise＝objectionable のイコール関係が成立する。","words":[{"w":"renovation work","p":"名詞","m":"改装工事"},{"w":"objectionable","p":"形容詞","m":"不愉快な"},{"w":"transfer","p":"動詞","m":"移る"},{"w":"local","p":"形容詞","m":"地元の"}]},{"id":279,"category":"品詞問題・実戦問題 発展編","question":"When renovations are required, a completed building ______ form must be forwarded to the department head.","A":"modify","B":"modifiable","C":"to modify","D":"modification","answer":"D","answer_word":"modification","explanation":"■ 文の骨格\nWhen renovations are required, a completed building ______ form must be forwarded to the department head.\n\n■ 空所に入るもの\nbuilding と form の間に置かれ、building ______ form という複合名詞をつくる名詞が必要。\n→ 空所には「複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) modify … 動詞（原形）「変更する」 ×\n(B) modifiable … 形容詞「変更可能な」 ×\n(C) to modify … 不定詞「変更すること」 ×\n(D) modification … 名詞「変更、改修」 ○\n\n■ 完成文\nWhen renovations are required, a completed building modification form must be forwarded to the department head.\n（改修が必要な場合は、記入済みの建物改修届を部門長へ提出しなければならない。）\n\n■ 解き方のポイント\n名詞＋名詞＋名詞の複合名詞。-tion は名詞の目印。","words":[{"w":"renovations","p":"名詞","m":"改修"},{"w":"completed","p":"形容詞","m":"記入済みの"},{"w":"modification","p":"名詞","m":"変更、改修"},{"w":"forwarded","p":"動詞（過去分詞）","m":"提出される"},{"w":"department head","p":"名詞","m":"部門長"}]},{"id":280,"category":"品詞問題・実戦問題 発展編","question":"Superior Design Company has held ______ among its employees to create its new company logo.","A":"competes","B":"competing","C":"competitions","D":"competitively","answer":"C","answer_word":"competitions","explanation":"■ 文の骨格\nSuperior Design Company has held ______ among its employees to create its new company logo.\n\n■ 空所に入るもの\n他動詞 has held の目的語が欠けており、冠詞がないので複数形が必要。\n→ 空所には「held の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) competes … 動詞（三人称単数現在形）「競う」 ×\n(B) competing … 現在分詞・動名詞「競うこと」 ×\n(C) competitions … 名詞（複数形）「コンテスト、競技会」 ○\n(D) competitively … 副詞「競争力をもって」 ×\n\n■ 完成文\nSuperior Design Company has held competitions among its employees to create its new company logo.\n（Superior Design 社は、新しい社章を作るために従業員間でコンテストを開催してきた。）\n\n■ 解き方のポイント\nhold a competition（コンテストを開く）。冠詞がなければ複数形。","words":[{"w":"held","p":"動詞（過去分詞）","m":"開催した"},{"w":"competitions","p":"名詞","m":"コンテスト"},{"w":"employees","p":"名詞","m":"従業員"},{"w":"logo","p":"名詞","m":"ロゴ、社章"}]},{"id":281,"category":"品詞問題・実戦問題 発展編","question":"As part of the marketing study, customers were given samples of three different fruit juices with brand labels ______ concealed.","A":"purposeless","B":"purpose","C":"purposeful","D":"purposely","answer":"D","answer_word":"purposely","explanation":"■ 文の骨格\nAs part of the marketing study, customers were given samples of three different fruit juices with brand labels ______ concealed.\n\n■ 空所に入るもの\nwith O C の C にあたる過去分詞 concealed を修飾する位置。\n→ 空所には「過去分詞 concealed を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) purposeless … 形容詞「目的のない」 ×\n(B) purpose … 名詞「目的」 ×\n(C) purposeful … 形容詞「意図的な、決意のある」 ×\n(D) purposely … 副詞「わざと、意図的に」 ○\n\n■ 完成文\nAs part of the marketing study, customers were given samples of three different fruit juices with brand labels purposely concealed.\n（市場調査の一環として、顧客には銘柄ラベルをわざと隠した3種類のフルーツジュースのサンプルが渡された。）\n\n■ 解き方のポイント\n分詞の直前の空所は副詞。","words":[{"w":"As part of","p":"熟語","m":"〜の一環として"},{"w":"samples","p":"名詞","m":"試供品"},{"w":"brand labels","p":"名詞","m":"銘柄ラベル"},{"w":"purposely","p":"副詞","m":"わざと"},{"w":"concealed","p":"過去分詞","m":"隠された"}]},{"id":282,"category":"品詞問題・実戦問題 発展編","question":"Some business leaders believe increasing the size of their organizations will lead to corporate ______.","A":"prosperity","B":"prosperous","C":"prosperously","D":"prospered","answer":"A","answer_word":"prosperity","explanation":"■ 文の骨格\nSome business leaders believe increasing the size of their organizations will lead to corporate ______.\n\n■ 空所に入るもの\nlead to の目的語で、形容詞 corporate に修飾される名詞が必要。\n→ 空所には「corporate に修飾される名詞」が必要です。\n\n■ 選択肢の確認\n(A) prosperity … 名詞「繁栄」 ○\n(B) prosperous … 形容詞「繁栄している」 ×\n(C) prosperously … 副詞「繁栄して」 ×\n(D) prospered … 動詞の過去形・過去分詞「繁栄した」 ×\n\n■ 完成文\nSome business leaders believe increasing the size of their organizations will lead to corporate prosperity.\n（組織の規模拡大が企業の繁栄につながると考えるビジネスリーダーもいる。）\n\n■ 解き方のポイント\nlead to の to は前置詞なので後ろは名詞。-ity は名詞の目印。","words":[{"w":"increasing","p":"動名詞","m":"拡大すること"},{"w":"organizations","p":"名詞","m":"組織"},{"w":"lead to","p":"熟語","m":"〜につながる"},{"w":"corporate","p":"形容詞","m":"企業の"},{"w":"prosperity","p":"名詞","m":"繁栄"}]},{"id":283,"category":"品詞問題・実戦問題 発展編","question":"The application deadline for Speedsoft's summer internship program is drawing ______, so interested students should contact the office by April 30.","A":"near","B":"nearly","C":"nears","D":"nearby","answer":"A","answer_word":"near","explanation":"■ 文の骨格\nThe application deadline for Speedsoft's summer internship program is drawing ______, so interested students should contact the office by April 30.\n\n■ 空所に入るもの\ndraw near（近づく）という定型表現をつくる語が必要。\n→ 空所には「draw の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) near … 形容詞「近い」 ○\n(B) nearly … 副詞「ほぼ」 ×\n(C) nears … 動詞（三人称単数現在形）「近づく」 ×\n(D) nearby … 形容詞・副詞「近くの／近くに」 ×\n\n■ 完成文\nThe application deadline for Speedsoft's summer internship program is drawing near, so interested students should contact the office by April 30.\n（Speedsoft 社の夏季インターンシップの申込期限が近づいているので、関心のある学生は4月30日までに事務局へ連絡すること。）\n\n■ 解き方のポイント\ndraw near＝「近づく」。nearly（ほぼ）とは意味がまったく違う。","words":[{"w":"application deadline","p":"名詞","m":"申込期限"},{"w":"internship","p":"名詞","m":"インターンシップ"},{"w":"drawing near","p":"熟語","m":"近づいている"},{"w":"interested","p":"形容詞","m":"関心のある"}]},{"id":284,"category":"品詞問題・実戦問題 発展編","question":"Classic Line perfume is the ______ of one of the most well-known fragrance designers in Asia.","A":"creation","B":"creator","C":"created","D":"creating","answer":"A","answer_word":"creation","explanation":"■ 文の骨格\nClassic Line perfume is the ______ of one of the most well-known fragrance designers in Asia.\n\n■ 空所に入るもの\n主語 Classic Line perfume（香水）とイコールになるので、「作品」を表す名詞が必要。\n→ 空所には「be動詞の補語になる名詞（もの）」が必要です。\n\n■ 選択肢の確認\n(A) creation … 名詞（もの）「創作物、作品」 ○\n(B) creator … 名詞（人）「創作者」 ×\n(C) created … 動詞の過去形・過去分詞「作られた」 ×\n(D) creating … 現在分詞・動名詞「作ること」 ×\n\n■ 完成文\nClassic Line perfume is the creation of one of the most well-known fragrance designers in Asia.\n（Classic Line の香水は、アジアで最も著名な香りデザイナーの1人が生み出した作品だ。）\n\n■ 解き方のポイント\n主語＝補語の関係を確認する。香水は「人」ではなく「作品」。","words":[{"w":"perfume","p":"名詞","m":"香水"},{"w":"creation","p":"名詞","m":"創作物、作品"},{"w":"well-known","p":"形容詞","m":"著名な"},{"w":"fragrance","p":"名詞","m":"香り"}]},{"id":285,"category":"品詞問題・実戦問題 発展編","question":"There is still some uncertainty among the employees as to how the new advertising campaign will be ______ in boosting sales.","A":"effect","B":"effectively","C":"to effect","D":"effective","answer":"D","answer_word":"effective","explanation":"■ 文の骨格\nThere is still some uncertainty among the employees as to how the new advertising campaign will be ______ in boosting sales.\n\n■ 空所に入るもの\nwill be の補語が欠けており、how と結びついて「どれだけ〜か」を表す形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) effect … 名詞／動詞「効果／もたらす」 ×\n(B) effectively … 副詞「効果的に」 ×\n(C) to effect … 不定詞「もたらすこと」 ×\n(D) effective … 形容詞「効果的な」 ○\n\n■ 完成文\nThere is still some uncertainty among the employees as to how the new advertising campaign will be effective in boosting sales.\n（新しい広告キャンペーンが売上増加にどれだけ効果的か、従業員の間にはまだ不透明さが残っている。）\n\n■ 解き方のポイント\nhow ＿＿ は〈how＋形容詞／副詞〉。ここは be動詞の補語なので形容詞。","words":[{"w":"uncertainty","p":"名詞","m":"不透明さ"},{"w":"as to","p":"熟語","m":"〜に関して"},{"w":"effective","p":"形容詞","m":"効果的な"},{"w":"boosting","p":"動名詞","m":"高めること"}]},{"id":286,"category":"品詞問題・実戦問題 発展編","question":"The Flagstaff city council is committed to ______ the environment and has approved a plan to encourage more residents to commute by bicycle.","A":"preserve","B":"preserved","C":"preserving","D":"preserves","answer":"C","answer_word":"preserving","explanation":"■ 文の骨格\nThe Flagstaff city council is committed to ______ the environment and has approved a plan to encourage more residents to commute by bicycle.\n\n■ 空所に入るもの\nbe committed to の to は前置詞なので、後ろは名詞か動名詞。さらに目的語 the environment を取る。\n→ 空所には「前置詞 to の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) preserve … 動詞（原形）「保護する」 ×\n(B) preserved … 動詞の過去形・過去分詞「保護された」 ×\n(C) preserving … 動名詞「保護すること」 ○\n(D) preserves … 動詞（三人称単数現在形）「保護する」 ×\n\n■ 完成文\nThe Flagstaff city council is committed to preserving the environment and has approved a plan to encourage more residents to commute by bicycle.\n（Flagstaff 市議会は環境保護に力を入れており、より多くの住民が自転車通勤するよう促す計画を承認した。）\n\n■ 解き方のポイント\nbe committed to／look forward to の to は前置詞。不定詞と混同させる定番の罠。","words":[{"w":"city council","p":"名詞","m":"市議会"},{"w":"committed to","p":"熟語","m":"〜に力を入れている"},{"w":"preserving","p":"動名詞","m":"保護すること"},{"w":"residents","p":"名詞","m":"住民"},{"w":"commute","p":"動詞","m":"通勤する"}]},{"id":287,"category":"品詞問題・実戦問題 発展編","question":"The new range of McGinty silicon mobile phone covers are fashionable and ______ priced.","A":"afford","B":"affordable","C":"affordably","D":"affordability","answer":"C","answer_word":"affordably","explanation":"■ 文の骨格\nThe new range of McGinty silicon mobile phone covers are fashionable and ______ priced.\n\n■ 空所に入るもの\nand の後ろで、過去分詞 priced を修飾する位置。\n→ 空所には「過去分詞 priced を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) afford … 動詞（原形）「（金銭的に）余裕がある」 ×\n(B) affordable … 形容詞「手ごろな価格の」 ×\n(C) affordably … 副詞「手ごろな価格で」 ○\n(D) affordability … 名詞「手ごろさ」 ×\n\n■ 完成文\nThe new range of McGinty silicon mobile phone covers are fashionable and affordably priced.\n（McGinty の携帯電話用シリコンカバーの新シリーズは、おしゃれで価格も手ごろだ。）\n\n■ 解き方のポイント\n分詞を修飾するのは副詞。affordably priced は頻出コロケーション。","words":[{"w":"range","p":"名詞","m":"シリーズ、品ぞろえ"},{"w":"fashionable","p":"形容詞","m":"おしゃれな"},{"w":"affordably","p":"副詞","m":"手ごろな価格で"},{"w":"priced","p":"過去分詞","m":"値付けされた"}]},{"id":288,"category":"品詞問題・実戦問題 発展編","question":"Max Davis's books are borrowed from the library so ______ that it has become necessary to purchase additional copies.","A":"frequent","B":"frequency","C":"frequencies","D":"frequently","answer":"D","answer_word":"frequently","explanation":"■ 文の骨格\nMax Davis's books are borrowed from the library so ______ that it has become necessary to purchase additional copies.\n\n■ 空所に入るもの\n受動態 are borrowed がすでに成立しており、so ... that 構文の so に続く修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) frequent … 形容詞「頻繁な」 ×\n(B) frequency … 名詞「頻度」 ×\n(C) frequencies … 名詞（複数形）「頻度」 ×\n(D) frequently … 副詞「頻繁に」 ○\n\n■ 完成文\nMax Davis's books are borrowed from the library so frequently that it has become necessary to purchase additional copies.\n（Max Davis の本は図書館で非常に頻繁に借りられるので、追加購入が必要になった。）\n\n■ 解き方のポイント\nso ＿＿ that ... の空所は、文が完成していれば副詞。","words":[{"w":"borrowed","p":"動詞（過去分詞）","m":"借りられる"},{"w":"frequently","p":"副詞","m":"頻繁に"},{"w":"purchase","p":"動詞","m":"購入する"},{"w":"additional copies","p":"名詞","m":"追加の部数"}]},{"id":289,"category":"品詞問題・実戦問題 発展編","question":"An ______ 10 percent discount is available to shoppers who show their loyalty card to staff at the register.","A":"additive","B":"additional","C":"additionally","D":"addition","answer":"B","answer_word":"additional","explanation":"■ 文の骨格\nAn ______ 10 percent discount is available to shoppers who show their loyalty card to staff at the register.\n\n■ 空所に入るもの\n冠詞 An と 10 percent discount の間にあり、名詞を修飾する位置。\n→ 空所には「名詞句を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) additive … 形容詞／名詞「添加の／添加物」 ×\n(B) additional … 形容詞「追加の」 ○\n(C) additionally … 副詞「加えて」 ×\n(D) addition … 名詞「追加」 ×\n\n■ 完成文\nAn additional 10 percent discount is available to shoppers who show their loyalty card to staff at the register.\n（レジでスタッフに会員カードを提示した買い物客は、さらに10％の割引を受けられる。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。An なのは additional の母音のため。","words":[{"w":"additional","p":"形容詞","m":"追加の"},{"w":"discount","p":"名詞","m":"割引"},{"w":"available","p":"形容詞","m":"利用できる"},{"w":"loyalty card","p":"名詞","m":"会員カード"},{"w":"register","p":"名詞","m":"レジ"}]},{"id":290,"category":"品詞問題・実戦問題 発展編","question":"The seminar started about 30 minutes later than ______ scheduled, as many of those who had signed up were delayed by the weather.","A":"original","B":"originally","C":"originate","D":"origin","answer":"B","answer_word":"originally","explanation":"■ 文の骨格\nThe seminar started about 30 minutes later than ______ scheduled, as many of those who had signed up were delayed by the weather.\n\n■ 空所に入るもの\nthan の後ろで、過去分詞 scheduled を修飾する位置。\n→ 空所には「過去分詞 scheduled を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) original … 形容詞「元の」 ×\n(B) originally … 副詞「当初は」 ○\n(C) originate … 動詞（原形）「始まる、生じる」 ×\n(D) origin … 名詞「起源」 ×\n\n■ 完成文\nThe seminar started about 30 minutes later than originally scheduled, as many of those who had signed up were delayed by the weather.\n（申し込んだ人の多くが天候で遅れたため、セミナーは当初の予定より約30分遅れて始まった。）\n\n■ 解き方のポイント\n分詞の直前は副詞。originally scheduled（当初予定されていた）は頻出。","words":[{"w":"originally","p":"副詞","m":"当初は"},{"w":"scheduled","p":"過去分詞","m":"予定された"},{"w":"signed up","p":"熟語","m":"申し込んだ"},{"w":"delayed","p":"動詞（過去分詞）","m":"遅れた"}]},{"id":291,"category":"品詞問題・実戦問題 発展編","question":"Professor Santiago is ______ that he can find a qualified assistant by the end of the month.","A":"doubt","B":"doubted","C":"doubtful","D":"doubtfully","answer":"C","answer_word":"doubtful","explanation":"■ 文の骨格\nProfessor Santiago is ______ that he can find a qualified assistant by the end of the month.\n\n■ 空所に入るもの\nis の補語が欠けており、that 節を従える形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) doubt … 名詞／動詞「疑い／疑う」 ×\n(B) doubted … 動詞の過去形・過去分詞「疑われた」 ×\n(C) doubtful … 形容詞「疑わしく思っている」 ○\n(D) doubtfully … 副詞「疑わしげに」 ×\n\n■ 完成文\nProfessor Santiago is doubtful that he can find a qualified assistant by the end of the month.\n（Santiago 教授は、今月末までに有能な助手を見つけられるか疑わしいと思っている。）\n\n■ 解き方のポイント\nbe doubtful that ... の形。be動詞の補語は形容詞。","words":[{"w":"Professor","p":"名詞","m":"教授"},{"w":"doubtful","p":"形容詞","m":"疑わしく思っている"},{"w":"qualified","p":"形容詞","m":"有能な、資格のある"},{"w":"assistant","p":"名詞","m":"助手"}]},{"id":292,"category":"品詞問題・実戦問題 発展編","question":"Barrow Construction is committed to providing the highest quality service to our customers in a ______ and efficient fashion.","A":"time","B":"timely","C":"timing","D":"timeliness","answer":"B","answer_word":"timely","explanation":"■ 文の骨格\nBarrow Construction is committed to providing the highest quality service to our customers in a ______ and efficient fashion.\n\n■ 空所に入るもの\nand の後ろが形容詞 efficient なので、前も名詞 fashion を修飾する形容詞が必要。\n→ 空所には「efficient と並列になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) time … 名詞／動詞「時間／時間を計る」 ×\n(B) timely … 形容詞「時宜を得た、迅速な」 ○\n(C) timing … 名詞「タイミング」 ×\n(D) timeliness … 名詞「適時性」 ×\n\n■ 完成文\nBarrow Construction is committed to providing the highest quality service to our customers in a timely and efficient fashion.\n（Barrow Construction 社は、迅速かつ効率的な方法で最高品質のサービスをお客様に提供することに努めている。）\n\n■ 解き方のポイント\nin a timely fashion [manner]＝「迅速に」。timely は -ly で終わるが形容詞。","words":[{"w":"committed to","p":"熟語","m":"〜に努めている"},{"w":"providing","p":"動名詞","m":"提供すること"},{"w":"timely","p":"形容詞","m":"迅速な"},{"w":"efficient","p":"形容詞","m":"効率的な"},{"w":"fashion","p":"名詞","m":"方法、やり方"}]},{"id":293,"category":"品詞問題・実戦問題 発展編","question":"Now that Al
