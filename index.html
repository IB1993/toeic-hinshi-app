\n(A) achieve … 動詞（原形）「達成する」 ×\n(B) achiever … 名詞（人）「達成者」 ×\n(C) achieving … 現在分詞・動名詞「達成すること」 ×\n(D) achievement … 名詞「業績」 ○\n\n■ 完成文\nThe artist's most notable achievement was being chosen to design the stained glass windows in the Westhaven chapel.\n（その芸術家の最も注目すべき業績は、Westhaven 礼拝堂のステンドグラスの設計に選ばれたことだった。）\n\n■ 解き方のポイント\nnotable achievement＝「注目すべき業績」。achiever（人）とは意味が違う。","words":[{"w":"notable","p":"形容詞","m":"注目すべき"},{"w":"achievement","p":"名詞","m":"業績"},{"w":"stained glass","p":"名詞","m":"ステンドグラス"},{"w":"chapel","p":"名詞","m":"礼拝堂"}]},{"id":764,"category":"文法模試 セット8（OCR素案）","question":"Mr. Fletcher, who was trained at Regent Music School in Boston, ______ and teaching for the past 20 years.","A":"having played","B":"has played","C":"will be playing","D":"has been playing","answer":"D","answer_word":"has been playing","explanation":"■ 文の骨格\nMr. Fletcher, who was trained at Regent Music School in Boston, ______ and teaching for the past 20 years.\n\n■ 空所に入るもの\nfor the past 20 years（この20年間）は現在完了と呼応し、teaching と並列になる形が必要。\n→ 空所には「現在完了進行形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) having played … 完了分詞「演奏したうえで」 ×\n(B) has played … 現在完了形「演奏してきた」 ×\n(C) will be playing … 未来進行形「演奏しているだろう」 ×\n(D) has been playing … 現在完了進行形「演奏し続けてきた」 ○\n\n■ 完成文\nMr. Fletcher, who was trained at Regent Music School in Boston, has been playing and teaching for the past 20 years.\n（ボストンの Regent 音楽学校で学んだ Fletcher 氏は、この20年間演奏と指導を続けてきた。）\n\n■ 解き方のポイント\nand teaching と並列にするには has been playing and (has been) teaching の形が必要。","words":[{"w":"trained","p":"動詞（過去分詞）","m":"訓練を受けた"},{"w":"has been playing","p":"現在完了進行形","m":"演奏し続けてきた"},{"w":"teaching","p":"動名詞","m":"指導すること"}]},{"id":765,"category":"文法模試 セット8（OCR素案）","question":"BHBROMEOL Ea tals. mss z PFO nor Ley hTHUSH, neither X nor ¥ (XY &-#U) Esser 28 (B) neither AER. ED REEESL, 44) 20RD IK nenseenns. MEEBO LES ROPSEOMLERE SME CE -m eager it, FRREAU, be eager to do DRWERTOT, (C)to know MEM, PRICREBES BH, ERIVEE pleased G2LU), happy (BAT), anxious (ZL) EMER, ED ORI, HMRI :"substance","answer":"C","answer_word":"substantially","explanation":"■ 文の骨格\nAccording to a recent survey, 30 percent of Japanese executives think their business will benefit ______ from Tokyo's hosting of the Olympic Games.\n\n■ 空所に入るもの\n述語動詞 will benefit がすでに成立しており、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) substantiate … 動詞（原形）「実証する」 ×\n(B) substantial … 形容詞「相当な」 ×\n(C) substantially … 副詞「大いに、相当に」 ○\n(D) substance … 名詞「物質」 ×\n\n■ 完成文\nAccording to a recent survey, 30 percent of Japanese executives think their business will benefit substantially from Tokyo's hosting of the Olympic Games.\n（最近の調査によると、日本の経営者の30％が、東京のオリンピック開催で自社の事業が大いに恩恵を受けると考えている。）\n\n■ 解き方のポイント\n自動詞 benefit の直後は副詞。","words":[{"w":"executives","p":"名詞","m":"経営者"},{"w":"benefit from","p":"熟語","m":"〜から恩恵を受ける"},{"w":"substantially","p":"副詞","m":"大いに"},{"w":"hosting","p":"動名詞","m":"開催すること"}]},{"id":776,"category":"文法模試 続き（OCR素案）","question":"All baggage must be tagged by a customer service agent before being ______ onto the aircraft.","A":"reached","B":"proceeded","C":"arrived","D":"loaded","answer":"D","answer_word":"loaded","explanation":"■ 文の骨格\nAll baggage must be tagged by a customer service agent before being ______ onto the aircraft.\n\n■ 空所に入るもの\nbeing の後ろで、主語 baggage は「積み込まれる」側なので過去分詞が必要。\n→ 空所には「受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) reached … 過去分詞「到達された」 ×\n(B) proceeded … 過去分詞「進んだ（自動詞）」 ×\n(C) arrived … 過去分詞「到着した（自動詞）」 ×\n(D) loaded … 過去分詞「積み込まれた」 ○\n\n■ 完成文\nAll baggage must be tagged by a customer service agent before being loaded onto the aircraft.\n（すべての手荷物は、機内に積み込まれる前に顧客サービス係がタグを付けなければならない。）\n\n■ 解き方のポイント\nproceed／arrive は自動詞なので受動態にできない。他動詞かどうかを確認する。","words":[{"w":"baggage","p":"名詞","m":"手荷物"},{"w":"tagged","p":"動詞（過去分詞）","m":"タグを付けられる"},{"w":"loaded","p":"過去分詞","m":"積み込まれた"},{"w":"aircraft","p":"名詞","m":"航空機"}]},{"id":777,"category":"文法模試 続き（OCR素案）","question":"Emma Simon can arrange a factory tour for your clients if you let ______ know at least a week in advance.","A":"she","B":"hers","C":"her","D":"herself","answer":"C","answer_word":"her","explanation":"■ 文の骨格\nEmma Simon can arrange a factory tour for your clients if you let ______ know at least a week in advance.\n\n■ 空所に入るもの\nlet O do の形で、O にあたる目的格の代名詞が必要。\n→ 空所には「let の目的語になる目的格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) she … 主格の代名詞「彼女は」 ×\n(B) hers … 所有代名詞「彼女のもの」 ×\n(C) her … 目的格の代名詞「彼女に」 ○\n(D) herself … 再帰代名詞「彼女自身」 ×\n\n■ 完成文\nEmma Simon can arrange a factory tour for your clients if you let her know at least a week in advance.\n（少なくとも1週間前に知らせていただければ、Emma Simon が顧客のために工場見学を手配できます。）\n\n■ 解き方のポイント\nlet O do／make O do／have O do。O は目的格。","words":[{"w":"arrange","p":"動詞","m":"手配する"},{"w":"factory tour","p":"名詞","m":"工場見学"},{"w":"her","p":"目的格の代名詞","m":"彼女に"},{"w":"in advance","p":"熟語","m":"前もって"}]},{"id":778,"category":"文法模試 続き（OCR素案）","question":"The Louisville Museum will be open ______ the public following nearly two years of renovation.","A":"with","B":"from","C":"to","D":"at","answer":"C","answer_word":"to","explanation":"■ 文の骨格\nThe Louisville Museum will be open ______ the public following nearly two years of renovation.\n\n■ 空所に入るもの\nbe open to the public（一般公開されている）という定型表現になる。\n→ 空所には「open と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) with … 前置詞「〜とともに」 ×\n(B) from … 前置詞「〜から」 ×\n(C) to … 前置詞「〜へ」 ○\n(D) at … 前置詞「〜で」 ×\n\n■ 完成文\nThe Louisville Museum will be open to the public following nearly two years of renovation.\n（Louisville 博物館は、2年近い改修を経て一般公開される。）\n\n■ 解き方のポイント\nbe open to the public＝「一般公開されている」。TOEIC 頻出表現。","words":[{"w":"open to the public","p":"熟語","m":"一般公開されて"},{"w":"following","p":"前置詞","m":"〜のあとに"},{"w":"renovation","p":"名詞","m":"改修"}]},{"id":779,"category":"文法模試 続き（OCR素案）","question":"Store representatives who greet customers at the front of the store should have a warm and ______ manner.","A":"trust","B":"trusted","C":"trusting","D":"trustily","answer":"C","answer_word":"trusting","explanation":"■ 文の骨格\nStore representatives who greet customers at the front of the store should have a warm and ______ manner.\n\n■ 空所に入るもの\nand の前が形容詞 warm なので、後ろも名詞 manner を修飾する形容詞が必要。\n→ 空所には「名詞を修飾する形容詞（現在分詞由来）」が必要です。\n\n■ 選択肢の確認\n(A) trust … 名詞／動詞「信頼／信頼する」 ×\n(B) trusted … 過去分詞「信頼された」 ×\n(C) trusting … 形容詞（現在分詞由来）「信頼感を与える」 ○\n(D) trustily … 副詞「信頼して」 ×\n\n■ 完成文\nStore representatives who greet customers at the front of the store should have a warm and trusting manner.\n（店頭で客を迎える店員は、温かく信頼感を与える態度で接するべきだ。）\n\n■ 解き方のポイント\nand の前後は同じ品詞。名詞の前は形容詞。","words":[{"w":"representatives","p":"名詞","m":"店員、担当者"},{"w":"greet","p":"動詞","m":"迎える"},{"w":"trusting","p":"形容詞","m":"信頼感を与える"},{"w":"manner","p":"名詞","m":"態度"}]},{"id":780,"category":"文法模試 続き（OCR素案）","question":"Employees should speak to their department ______ for information about the new shift schedule.","A":"manages","B":"managed","C":"managing","D":"manager","answer":"D","answer_word":"manager","explanation":"■ 文の骨格\nEmployees should speak to their department ______ for information about the new shift schedule.\n\n■ 空所に入るもの\n前置詞 to の目的語で、話しかける相手＝「人」を表す名詞が必要。\n→ 空所には「department と複合名詞をつくる名詞（人）」が必要です。\n\n■ 選択肢の確認\n(A) manages … 動詞（三人称単数現在形）「管理する」 ×\n(B) managed … 動詞の過去形・過去分詞「管理された」 ×\n(C) managing … 現在分詞・動名詞「管理すること」 ×\n(D) manager … 名詞（人）「部長」 ○\n\n■ 完成文\nEmployees should speak to their department manager for information about the new shift schedule.\n（従業員は、新しいシフト表に関する情報については各部署の部長に相談すること。）\n\n■ 解き方のポイント\ndepartment manager（部長）は複合名詞。前置詞 to の後ろは名詞。","words":[{"w":"speak to","p":"熟語","m":"〜に話しかける"},{"w":"department manager","p":"名詞","m":"部長"},{"w":"shift schedule","p":"名詞","m":"シフト表"}]},{"id":781,"category":"文法模試 続き（OCR素案）","question":"No Dice, the production currently showing at Roux Theater of Oklahoma, consists of seven actors ______ acrobatic dances.","A":"performs","B":"have been performing","C":"performing","D":"to be performed","answer":"C","answer_word":"performing","explanation":"■ 文の骨格\nNo Dice, the production currently showing at Roux Theater of Oklahoma, consists of seven actors ______ acrobatic dances.\n\n■ 空所に入るもの\n名詞 seven actors を後ろから修飾し、acrobatic dances を目的語に取る語が必要。\n→ 空所には「名詞を後ろから修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) performs … 動詞（三人称単数現在形）「演じる」 ×\n(B) have been performing … 現在完了進行形「演じ続けている」 ×\n(C) performing … 現在分詞「演じる」 ○\n(D) to be performed … 受動の不定詞「演じられるべき」 ×\n\n■ 完成文\nNo Dice, the production currently showing at Roux Theater of Oklahoma, consists of seven actors performing acrobatic dances.\n（オクラホマの Roux 劇場で上演中の『No Dice』は、アクロバティックなダンスを踊る7人の俳優で構成されている。）\n\n■ 解き方のポイント\n述語動詞 consists がすでにあるので、空所は名詞を修飾する分詞。","words":[{"w":"production","p":"名詞","m":"（舞台）作品"},{"w":"consists of","p":"熟語","m":"〜で構成される"},{"w":"performing","p":"現在分詞","m":"演じる"},{"w":"acrobatic","p":"形容詞","m":"アクロバティックな"}]},{"id":782,"category":"文法模試 続き（OCR素案）","question":"Mr. Nowak complimented his assistant for ______ organizing the employee appreciation dinner.","A":"expert","B":"expertise","C":"expertness","D":"expertly","answer":"D","answer_word":"expertly","explanation":"■ 文の骨格\nMr. Nowak complimented his assistant for ______ organizing the employee appreciation dinner.\n\n■ 空所に入るもの\n前置詞 for の目的語は動名詞 organizing で、空所はそれを修飾する位置。\n→ 空所には「動名詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) expert … 名詞（人）／形容詞「専門家／熟練した」 ×\n(B) expertise … 名詞「専門知識」 ×\n(C) expertness … 名詞「熟練」 ×\n(D) expertly … 副詞「巧みに」 ○\n\n■ 完成文\nMr. Nowak complimented his assistant for expertly organizing the employee appreciation dinner.\n（Nowak さんは、従業員感謝の夕食会を巧みに取りまとめた助手を称賛した。）\n\n■ 解き方のポイント\n動名詞を修飾するのは副詞。名詞なら動名詞の目的語になれない。","words":[{"w":"complimented","p":"動詞（過去形）","m":"称賛した"},{"w":"assistant","p":"名詞","m":"助手"},{"w":"expertly","p":"副詞","m":"巧みに"},{"w":"appreciation dinner","p":"名詞","m":"感謝の夕食会"}]},{"id":783,"category":"文法模試 続き（OCR素案）","question":"The Seeger Hellenic Fund was established by David Bertrand 60 years ago ______ advance the understanding of the culture of ancient Greece.","A":"in order to","B":"even if","C":"because","D":"even though","answer":"A","answer_word":"in order to","explanation":"■ 文の骨格\nThe Seeger Hellenic Fund was established by David Bertrand 60 years ago ______ advance the understanding of the culture of ancient Greece.\n\n■ 空所に入るもの\n空所の後ろが動詞の原形 advance なので、to 不定詞をつくる語句が必要。\n→ 空所には「目的を表す群不定詞」が必要です。\n\n■ 選択肢の確認\n(A) in order to … 群不定詞「〜するために」 ○\n(B) even if … 接続詞（群）「たとえ〜でも」 ×\n(C) because … 接続詞「〜なので」 ×\n(D) even though … 接続詞（群）「〜だけれども」 ×\n\n■ 完成文\nThe Seeger Hellenic Fund was established by David Bertrand 60 years ago in order to advance the understanding of the culture of ancient Greece.\n（Seeger ヘレニック基金は、古代ギリシャ文化への理解を深めるため60年前に David Bertrand によって設立された。）\n\n■ 解き方のポイント\n後ろが動詞の原形なら to 不定詞。接続詞は〈主語＋動詞〉を要求する。","words":[{"w":"Fund","p":"名詞","m":"基金"},{"w":"established","p":"動詞（過去分詞）","m":"設立された"},{"w":"in order to","p":"熟語","m":"〜するために"},{"w":"advance","p":"動詞","m":"促進する"},{"w":"ancient","p":"形容詞","m":"古代の"}]},{"id":784,"category":"文法模試 続き（OCR素案）","question":"The new sedan was ______ supposed to be available from June, but is now scheduled for release in August.","A":"initial","B":"initially","C":"initials","D":"initialization","answer":"B","answer_word":"initially","explanation":"■ 文の骨格\nThe new sedan was ______ supposed to be available from June, but is now scheduled for release in August.\n\n■ 空所に入るもの\n受動態 was supposed の間に入る修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) initial … 形容詞「最初の」 ×\n(B) initially … 副詞「当初は」 ○\n(C) initials … 名詞（複数形）「イニシャル」 ×\n(D) initialization … 名詞「初期化」 ×\n\n■ 完成文\nThe new sedan was initially supposed to be available from June, but is now scheduled for release in August.\n（その新型セダンは当初6月から発売される予定だったが、現在は8月の発売に変更されている。）\n\n■ 解き方のポイント\n〈be＋空所＋過去分詞〉は副詞の定位置。but 以下との対比も手がかり。","words":[{"w":"sedan","p":"名詞","m":"セダン"},{"w":"initially","p":"副詞","m":"当初は"},{"w":"supposed to","p":"熟語","m":"〜することになっている"},{"w":"release","p":"名詞","m":"発売"}]},{"id":785,"category":"文法模試 続き（OCR素案）","question":"Like most similar institutions, Hakata Museum of Arts ______ photography on the premises.","A":"prohibit","B":"prohibiting","C":"prohibits","D":"prohibited","answer":"C","answer_word":"prohibits","explanation":"■ 文の骨格\nLike most similar institutions, Hakata Museum of Arts ______ photography on the premises.\n\n■ 空所に入るもの\n主語 Hakata Museum of Arts は単数なので、動詞に -s が必要。\n→ 空所には「単数主語に対応する述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) prohibit … 動詞（原形・複数対応）「禁止する」 ×\n(B) prohibiting … 現在分詞・動名詞「禁止すること」 ×\n(C) prohibits … 動詞（三人称単数現在形）「禁止する」 ○\n(D) prohibited … 動詞の過去形・過去分詞「禁止された」 ×\n\n■ 完成文\nLike most similar institutions, Hakata Museum of Arts prohibits photography on the premises.\n（同種のほとんどの施設と同様、博多美術館は館内での写真撮影を禁止している。）\n\n■ 解き方のポイント\nMuseum of Arts の核となる主語は Museum で単数。動詞に -s。","words":[{"w":"institutions","p":"名詞","m":"施設、機関"},{"w":"prohibits","p":"動詞","m":"禁止する"},{"w":"photography","p":"名詞","m":"写真撮影"},{"w":"premises","p":"名詞","m":"構内、敷地"}]},{"id":786,"category":"文法模試 続き（OCR素案）","question":"Due to a rapid increase in customer demand, Camel Furniture must find ways to deliver their products ______ than before.","A":"fast","B":"faster","C":"fastest","D":"so fast","answer":"B","answer_word":"faster","explanation":"■ 文の骨格\nDue to a rapid increase in customer demand, Camel Furniture must find ways to deliver their products ______ than before.\n\n■ 空所に入るもの\ndeliver their products で SVO が完成しており、than を伴う比較級の副詞が必要。\n→ 空所には「than と呼応する比較級の副詞」が必要です。\n\n■ 選択肢の確認\n(A) fast … 形容詞・副詞「速い／速く」 ×\n(B) faster … 副詞（比較級）「より速く」 ○\n(C) fastest … 副詞（最上級）「最も速く」 ×\n(D) so fast … 副詞句「とても速く」 ×\n\n■ 完成文\nDue to a rapid increase in customer demand, Camel Furniture must find ways to deliver their products faster than before.\n（顧客需要の急増により、Camel Furniture 社は従来より速く商品を配送する方法を見つけなければならない。）\n\n■ 解き方のポイント\nthan があれば比較級。fast は形容詞・副詞が同形で、比較級も faster。","words":[{"w":"rapid increase","p":"名詞","m":"急増"},{"w":"deliver","p":"動詞","m":"配送する"},{"w":"faster","p":"比較級","m":"より速く"}]},{"id":787,"category":"文法模試 続き（OCR素案）","question":"Teddy Bailey's first solo album, released three years ago, sold more than a million copies, and ______ did the two that followed.","A":"so","B":"but","C":"neither","D":"each","answer":"A","answer_word":"so","explanation":"■ 文の骨格\nTeddy Bailey's first solo album, released three years ago, sold more than a million copies, and ______ did the two that followed.\n\n■ 空所に入るもの\nand ______ did ... の形で、「〜もそうだ」を表す副詞が必要。\n→ 空所には「倒置を導く副詞」が必要です。\n\n■ 選択肢の確認\n(A) so … 副詞「〜もそうだ」 ○\n(B) but … 等位接続詞「しかし」 ×\n(C) neither … 副詞「〜もまた（否定文で）」 ×\n(D) each … 形容詞・代名詞「それぞれ」 ×\n\n■ 完成文\nTeddy Bailey's first solo album, released three years ago, sold more than a million copies, and so did the two that followed.\n（3年前に発売された Teddy Bailey の初のソロアルバムは100万枚以上を売り上げ、続く2作も同様だった。）\n\n■ 解き方のポイント\nso＋助動詞＋主語＝「〜もそうだ」。否定なら neither＋助動詞＋主語。","words":[{"w":"solo album","p":"名詞","m":"ソロアルバム"},{"w":"released","p":"過去分詞","m":"発売された"},{"w":"so did","p":"倒置表現","m":"〜もそうだった"},{"w":"followed","p":"動詞（過去形）","m":"続いた"}]},{"id":788,"category":"文法模試 続き（OCR素案）","question":"Dream Toys ______ the value of its Web site until a survey revealed that it was responsible for much of its business.","A":"does not recognize","B":"were not recognized","C":"had not recognized","D":"will not recognize","answer":"C","answer_word":"had not recognized","explanation":"■ 文の骨格\nDream Toys ______ the value of its Web site until a survey revealed that it was responsible for much of its business.\n\n■ 空所に入るもの\nuntil 以下の過去の出来事より前の時点を表すので、過去完了形が必要。\n→ 空所には「過去完了形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) does not recognize … 現在形「認識していない」 ×\n(B) were not recognized … 受動態（過去）「認識されなかった」 ×\n(C) had not recognized … 過去完了形「認識していなかった」 ○\n(D) will not recognize … 未来形「認識しないだろう」 ×\n\n■ 完成文\nDream Toys had not recognized the value of its Web site until a survey revealed that it was responsible for much of its business.\n（ある調査でウェブサイトが事業の多くを支えていると判明するまで、Dream Toys 社はその価値を認識していなかった。）\n\n■ 解き方のポイント\n過去のある時点より前の状態は過去完了形。直後に目的語があるので能動態。","words":[{"w":"value","p":"名詞","m":"価値"},{"w":"had not recognized","p":"過去完了","m":"認識していなかった"},{"w":"revealed","p":"動詞（過去形）","m":"明らかにした"},{"w":"responsible for","p":"熟語","m":"〜を担っている"}]},{"id":789,"category":"文法模試 続き（OCR素案）","question":"Teppei Takami was formerly the executive engineer for advanced technology vehicles at Max Motors and was ______ in developing the Max Elite Sedan.","A":"influence","B":"influencing","C":"influential","D":"influentially","answer":"C","answer_word":"influential","explanation":"■ 文の骨格\nTeppei Takami was formerly the executive engineer for advanced technology vehicles at Max Motors and was ______ in developing the Max Elite Sedan.\n\n■ 空所に入るもの\nwas の補語が欠けており、in と結びついて意味が通る形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) influence … 名詞／動詞「影響／影響を与える」 ×\n(B) influencing … 現在分詞・動名詞「影響を与えること」 ×\n(C) influential … 形容詞「影響力のある」 ○\n(D) influentially … 副詞「影響力をもって」 ×\n\n■ 完成文\nTeppei Takami was formerly the executive engineer for advanced technology vehicles at Max Motors and was influential in developing the Max Elite Sedan.\n（Teppei Takami はかつて Max Motors 社で先端技術車両の主任技師を務め、Max Elite セダンの開発で大きな影響力を持っていた。）\n\n■ 解き方のポイント\nbe influential in doing＝「〜において影響力を持つ」。be動詞の補語は形容詞。","words":[{"w":"formerly","p":"副詞","m":"かつて"},{"w":"executive engineer","p":"名詞","m":"主任技師"},{"w":"influential","p":"形容詞","m":"影響力のある"},{"w":"developing","p":"動名詞","m":"開発すること"}]},{"id":790,"category":"文法模試 続き（OCR素案）","question":"Oriental Textiles employs and trains more inexperienced young people than ______ company in Thailand.","A":"any other","B":"others","C":"the other","D":"each other","answer":"A","answer_word":"any other","explanation":"■ 文の骨格\nOriental Textiles employs and trains more inexperienced young people than ______ company in Thailand.\n\n■ 空所に入るもの\nthan の後ろで単数名詞 company を修飾し、「ほかのどの〜」を表す語句が必要。\n→ 空所には「比較の対象を表す表現」が必要です。\n\n■ 選択肢の確認\n(A) any other … 形容詞句「ほかのどの」 ○\n(B) others … 代名詞「ほかの人・物」 ×\n(C) the other … 形容詞句「もう一方の」 ×\n(D) each other … 相互代名詞「お互い」 ×\n\n■ 完成文\nOriental Textiles employs and trains more inexperienced young people than any other company in Thailand.\n（Oriental Textiles 社は、タイのほかのどの企業よりも多くの未経験の若者を雇用し育成している。）\n\n■ 解き方のポイント\n比較級＋than any other＋単数名詞＝「ほかのどの〜より…」。最上級と同じ意味。","words":[{"w":"employs","p":"動詞","m":"雇用する"},{"w":"inexperienced","p":"形容詞","m":"未経験の"},{"w":"any other","p":"熟語","m":"ほかのどの"}]},{"id":791,"category":"文法模試 続き（OCR素案）","question":"Mr. Smirnov is widely considered a ______ successor to the current CEO, Andrei Morozov.","A":"potential","B":"potentially","C":"potentiality","D":"potentialities","answer":"A","answer_word":"potential","explanation":"■ 文の骨格\nMr. Smirnov is widely considered a ______ successor to the current CEO, Andrei Morozov.\n\n■ 空所に入るもの\n冠詞 a と名詞 successor の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) potential … 形容詞「有力な、可能性のある」 ○\n(B) potentially … 副詞「潜在的に」 ×\n(C) potentiality … 名詞「潜在能力」 ×\n(D) potentialities … 名詞（複数形）「潜在能力」 ×\n\n■ 完成文\nMr. Smirnov is widely considered a potential successor to the current CEO, Andrei Morozov.\n（Smirnov 氏は、現 CEO の Andrei Morozov 氏の有力な後継者だと広く見なされている。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。potential は形容詞・名詞の両方で使う。","words":[{"w":"widely","p":"副詞","m":"広く"},{"w":"considered","p":"動詞（過去分詞）","m":"見なされる"},{"w":"potential","p":"形容詞","m":"有力な"},{"w":"successor","p":"名詞","m":"後継者"}]},{"id":792,"category":"文法模試 続き（OCR素案）","question":"La Bella Ferrara is crowded with dozens of office workers and executives during lunch hours, ______ it is situated in the heart of a bustling business district.","A":"despite","B":"since","C":"when","D":"where","answer":"B","answer_word":"since","explanation":"■ 文の骨格\nLa Bella Ferrara is crowded with dozens of office workers and executives during lunch hours, ______ it is situated in the heart of a bustling business district.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、混雑の理由を表す接続詞が必要。\n→ 空所には「理由を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) despite … 前置詞「〜にもかかわらず」 ×\n(B) since … 接続詞「〜なので」 ○\n(C) when … 接続詞「〜のとき」 ×\n(D) where … 関係副詞「〜する場所」 ×\n\n■ 完成文\nLa Bella Ferrara is crowded with dozens of office workers and executives during lunch hours, since it is situated in the heart of a bustling business district.\n（La Bella Ferrara は活気ある business district の中心部にあるため、昼時は数十人の会社員や経営者で混み合う。）\n\n■ 解き方のポイント\nsince は「〜以来」と「〜なので」の2つの意味を持つ。ここは理由。","words":[{"w":"crowded with","p":"熟語","m":"〜で混み合う"},{"w":"dozens of","p":"熟語","m":"数十の"},{"w":"situated","p":"過去分詞","m":"位置している"},{"w":"bustling","p":"形容詞","m":"活気ある"}]},{"id":793,"category":"文法模試 続き（OCR素案）","question":"The candidate must be able to communicate ______ and in a professional manner.","A":"efficient","B":"more efficient","C":"efficiency","D":"efficiently","answer":"D","answer_word":"efficiently","explanation":"■ 文の骨格\nThe candidate must be able to communicate ______ and in a professional manner.\n\n■ 空所に入るもの\n自動詞 communicate の直後で、and の後ろの副詞句 in a ... manner と並列になる。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) efficient … 形容詞「効率的な」 ×\n(B) more efficient … 形容詞（比較級）「より効率的な」 ×\n(C) efficiency … 名詞「効率」 ×\n(D) efficiently … 副詞「効率的に」 ○\n\n■ 完成文\nThe candidate must be able to communicate efficiently and in a professional manner.\n（その候補者は、効率的かつプロらしい態度でやり取りできなければならない。）\n\n■ 解き方のポイント\nand の後ろが副詞句なので、前も副詞。自動詞の直後も副詞。","words":[{"w":"candidate","p":"名詞","m":"候補者"},{"w":"communicate","p":"動詞","m":"やり取りする"},{"w":"efficiently","p":"副詞","m":"効率的に"},{"w":"professional","p":"形容詞","m":"プロらしい"}]},{"id":794,"category":"文法模試 続き（OCR素案）","question":"Kazuko Ishiguro's latest novel made quite a splash worldwide, but the ______ response came from Japan, where it became a bestseller.","A":"greater","B":"greatly","C":"greatest","D":"greatness","answer":"C","answer_word":"greatest","explanation":"■ 文の骨格\nKazuko Ishiguro's latest novel made quite a splash worldwide, but the ______ response came from Japan, where it became a bestseller.\n\n■ 空所に入るもの\nthe と名詞 response の間にあり、名詞を修飾する形容詞が必要。\n→ 空所には「名詞を修飾する最上級の形容詞」が必要です。\n\n■ 選択肢の確認\n(A) greater … 形容詞（比較級）「より大きな」 ×\n(B) greatly … 副詞「大いに」 ×\n(C) greatest … 形容詞（最上級）「最も大きな」 ○\n(D) greatness … 名詞「偉大さ」 ×\n\n■ 完成文\nKazuko Ishiguro's latest novel made quite a splash worldwide, but the greatest response came from Japan, where it became a bestseller.\n（Kazuko Ishiguro の最新作は世界中で大きな話題を呼んだが、最も大きな反響は日本から来て、同国ではベストセラーとなった。）\n\n■ 解き方のポイント\nthe＋最上級＋名詞。the があるので比較級ではなく最上級。","words":[{"w":"latest","p":"最上級","m":"最新の"},{"w":"made a splash","p":"熟語","m":"話題を呼んだ"},{"w":"greatest","p":"最上級","m":"最も大きな"},{"w":"response","p":"名詞","m":"反響"}]},{"id":795,"category":"文法模試 続き（OCR素案）","question":"Some industry analysts predict that the worldwide mobile phone market will show signs of ______ toward the end of the year.","A":"improve","B":"improvement","C":"improved","D":"improving","answer":"B","answer_word":"improvement","explanation":"■ 文の骨格\nSome industry analysts predict that the worldwide mobile phone market will show signs of ______ toward the end of the year.\n\n■ 空所に入るもの\nsigns of の後ろは名詞が入る位置。\n→ 空所には「前置詞 of の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) improve … 動詞（原形）「改善する」 ×\n(B) improvement … 名詞「改善」 ○\n(C) improved … 動詞の過去形・過去分詞「改善された」 ×\n(D) improving … 現在分詞・動名詞「改善すること」 ×\n\n■ 完成文\nSome industry analysts predict that the worldwide mobile phone market will show signs of improvement toward the end of the year.\n（一部の業界アナリストは、世界の携帯電話市場が年末に向けて改善の兆しを見せると予測している。）\n\n■ 解き方のポイント\n前置詞の直後は名詞。-ment は名詞の目印。","words":[{"w":"industry analysts","p":"名詞","m":"業界アナリスト"},{"w":"signs of","p":"熟語","m":"〜の兆し"},{"w":"improvement","p":"名詞","m":"改善"},{"w":"toward","p":"前置詞","m":"〜に向けて"}]},{"id":796,"category":"文法模試 続き（OCR素案）","question":"Sales of portable printers have been improving ______ since the lighter, faster models were released last year.","A":"consistent","B":"consistency","C":"consistencies","D":"consistently","answer":"D","answer_word":"consistently","explanation":"■ 文の骨格\nSales of portable printers have been improving ______ since the lighter, faster models were released last year.\n\n■ 空所に入るもの\n現在完了進行形 have been improving がすでに成立しており、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) consistent … 形容詞「一貫した」 ×\n(B) consistency … 名詞「一貫性」 ×\n(C) consistencies … 名詞（複数形）「一貫性」 ×\n(D) consistently … 副詞「一貫して」 ○\n\n■ 完成文\nSales of portable printers have been improving consistently since the lighter, faster models were released last year.\n（軽くて速いモデルが昨年発売されて以来、携帯型プリンターの売上は一貫して伸び続けている。）\n\n■ 解き方のポイント\n進行形の後ろの空所は副詞。","words":[{"w":"portable printers","p":"名詞","m":"携帯型プリンター"},{"w":"improving","p":"現在分詞","m":"伸びている"},{"w":"consistently","p":"副詞","m":"一貫して"},{"w":"released","p":"動詞（過去分詞）","m":"発売された"}]},{"id":797,"category":"文法模試 続き（OCR素案）","question":"People who ______ to the Sakura Fund had their names inscribed on a memorial plaque.","A":"supported","B":"contributed","C":"dedicated","D":"donated","answer":"B","answer_word":"contributed","explanation":"■ 文の骨格\nPeople who ______ to the Sakura Fund had their names inscribed on a memorial plaque.\n\n■ 空所に入るもの\n後ろが to＋名詞なので、前置詞 to を伴う自動詞が必要。\n→ 空所には「to と結びつく自動詞」が必要です。\n\n■ 選択肢の確認\n(A) supported … 動詞（過去形）「支援した（他動詞）」 ×\n(B) contributed … 動詞（過去形）「寄付した」 ○\n(C) dedicated … 動詞（過去形）「捧げた（他動詞）」 ×\n(D) donated … 動詞（過去形）「寄贈した（to を伴うが目的語が必要）」 ×\n\n■ 完成文\nPeople who contributed to the Sakura Fund had their names inscribed on a memorial plaque.\n（Sakura 基金に寄付した人々は、記念銘板に名前が刻まれた。）\n\n■ 解き方のポイント\ncontribute to X＝「Xに寄付する・貢献する」。support は他動詞で to を取らない。","words":[{"w":"contributed to","p":"熟語","m":"〜に寄付した"},{"w":"Fund","p":"名詞","m":"基金"},{"w":"inscribed","p":"動詞（過去分詞）","m":"刻まれた"},{"w":"memorial plaque","p":"名詞","m":"記念銘板"}]},{"id":798,"category":"文法模試 続き（OCR素案）","question":"-m SERVEIRUYT®, be inspected for LIEN IH A, 82, (6) SCRE ERIN, D, ABET. (D) REROBBTE. DD HLUWAROIE, SAE-ONIOS, MLOMMBCH TERMORMRRERO TOS, Loos nas MOM let DAMEN ERIC DED T, FIAGHED (D) her MIEM. let (D) do &, AVEO EC RICAMETRS Hb MAA THES. HNHEZIMO (D) lt. FLERE BUSS, AOEICRS, WEERICRSE, @ OMAR HOO, LAUB WD 06 £6 1AM CICA E NIL, Emma Simon kL OMEOMHITAREY TEER, c8be is <7 nex Et) FIO be open (#-7FB) &, SO the public (“BO AX) BADie IE COE, (BRAD OBER X- 7 1 HIB (C) to. EEC. AMROALe a5 TSMR MNTWS X-Te open to the public(-BAHENTWS)(e TOEIC LAR MAT. TD Lovivle IRIS, BIE FMI’ AAET WERT, BMBL-RAMENS.","A":"","B":"","C":"","D":"","answer":"B","answer_word":"","explanation":"PDF解説エリアで照合済み。空所前後の文脈・ thoroughly","D":"thoroughness","answer":"C","answer_word":"thoroughly","explanation":"■ 文の骨格\nBefore purchasing a used guitar, buyers should ______ inspect the front, back, and sides of the guitar's body for damage.\n\n■ 空所に入るもの\n助動詞 should と動詞 inspect の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) thorough … 形容詞「徹底的な」 ×\n(B) more thorough … 形容詞（比較級）「より徹底的な」 ×\n(C) thoroughly … 副詞「徹底的に」 ○\n(D) thoroughness … 名詞「徹底」 ×\n\n■ 完成文\nBefore purchasing a used guitar, buyers should thoroughly inspect the front, back, and sides of the guitar's body for damage.\n（中古ギターを買う前に、購入者は本体の表・裏・側面に傷がないか徹底的に確認すべきだ。）\n\n■ 解き方のポイント\n〈助動詞＋空所＋動詞〉は副詞の定位置。","words":[{"w":"purchasing","p":"動名詞","m":"買うこと"},{"w":"used","p":"形容詞","m":"中古の"},{"w":"thoroughly","p":"副詞","m":"徹底的に"},{"w":"inspect","p":"動詞","m":"確認する"}]},{"id":804,"category":"文法模試セット10","question":"______ a large international company, Horizon Ltd. started as a small business in South Melbourne.","A":"Now","B":"Become","C":"After","D":"Prior","answer":"A","answer_word":"Now","explanation":"■ 文の骨格\n______ a large international company, Horizon Ltd. started as a small business in South Melbourne.\n\n■ 空所に入るもの\n名詞句 a large international company の前に置かれ、「今では〜」を表す語が必要。\n→ 空所には「名詞句を導く副詞」が必要です。\n\n■ 選択肢の確認\n(A) Now … 副詞「今では」 ○\n(B) Become … 動詞（原形）「〜になる」 ×\n(C) After … 接続詞・前置詞「〜のあとに」 ×\n(D) Prior … 形容詞「事前の」 ×\n\n■ 完成文\nNow a large international company, Horizon Ltd. started as a small business in South Melbourne.\n（今では大きな国際企業となった Horizon 社は、南メルボルンの小さな事業として始まった。）\n\n■ 解き方のポイント\nNow (being) a large company, ... の being が省略された形。","words":[{"w":"Now","p":"副詞","m":"今では"},{"w":"international","p":"形容詞","m":"国際的な"},{"w":"started as","p":"熟語","m":"〜として始まった"}]},{"id":805,"category":"文法模試セット10","question":"Townsend Corporation continuously looks ______ new ways to save money while protecting the environment.","A":"like","B":"around","C":"for","D":"inside","answer":"C","answer_word":"for","explanation":"■ 文の骨格\nTownsend Corporation continuously looks ______ new ways to save money while protecting the environment.\n\n■ 空所に入るもの\nlook for X（Xを探す）という組み合わせになる。\n→ 空所には「look と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) like … 前置詞「〜のような」 ×\n(B) around … 前置詞・副詞「〜の周りに」 ×\n(C) for … 前置詞「〜を求めて」 ○\n(D) inside … 前置詞「〜の内側に」 ×\n\n■ 完成文\nTownsend Corporation continuously looks for new ways to save money while protecting the environment.\n（Townsend 社は、環境を守りながら経費を節約する新しい方法を絶えず探している。）\n\n■ 解き方のポイント\nlook for（探す）／look into（調査する）／look after（世話をする）を区別する。","words":[{"w":"continuously","p":"副詞","m":"絶えず"},{"w":"looks for","p":"熟語","m":"探す"},{"w":"save money","p":"熟語","m":"経費を節約する"},{"w":"environment","p":"名詞","m":"環境"}]},{"id":806,"category":"文法模試セット10","question":"Independent tests by several respected magazines confirmed the outstanding ______ of Colombo Motors' newest sedan.","A":"rely","B":"reliable","C":"reliably","D":"reliability","answer":"D","answer_word":"reliability","explanation":"■ 文の骨格\nIndependent tests by several respected magazines confirmed the outstanding ______ of Colombo Motors' newest sedan.\n\n■ 空所に入るもの\n形容詞 outstanding に修飾され、confirmed の目的語となる名詞が必要。\n→ 空所には「the と of に挟まれた名詞」が必要です。\n\n■ 選択肢の確認\n(A) rely … 動詞（原形）「頼る」 ×\n(B) reliable … 形容詞「信頼できる」 ×\n(C) reliably … 副詞「確実に」 ×\n(D) reliability … 名詞「信頼性」 ○\n\n■ 完成文\nIndependent tests by several respected magazines confirmed the outstanding reliability of Colombo Motors' newest sedan.\n（いくつかの権威ある雑誌による独立した試験が、Colombo Motors 社の最新セダンの卓越した信頼性を裏づけた。）\n\n■ 解き方のポイント\n〈the＋形容詞＋空所＋of〉は名詞。-ity は名詞の目印。","words":[{"w":"Independent tests","p":"名詞","m":"独立した試験"},{"w":"respected","p":"形容詞","m":"権威ある"},{"w":"outstanding","p":"形容詞","m":"卓越した"},{"w":"reliability","p":"名詞","m":"信頼性"}]},{"id":807,"category":"文法模試セット10","question":"Sunrise Financial Advisers relies mostly on word-of-mouth publicity, which means it saves a lot of money on ______ its services.","A":"advertise","B":"advertised","C":"advertising","D":"advertisements","answer":"C","answer_word":"advertising","explanation":"■ 文の骨格\nSunrise Financial Advisers relies mostly on word-of-mouth publicity, which means it saves a lot of money on ______ its services.\n\n■ 空所に入るもの\n前置詞 on の後ろで、さらに目的語 its services を取る形が必要。\n→ 空所には「前置詞 on の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) advertise … 動詞（原形）「宣伝する」 ×\n(B) advertised … 動詞の過去形・過去分詞「宣伝された」 ×\n(C) advertising … 動名詞「宣伝すること」 ○\n(D) advertisements … 名詞（複数形）「広告」 ×\n\n■ 完成文\nSunrise Financial Advisers relies mostly on word-of-mouth publicity, which means it saves a lot of money on advertising its services.\n（Sunrise Financial Advisers 社は主に口コミの評判に頼っており、そのためサービスの宣伝費を大きく節約できている。）\n\n■ 解き方のポイント\n前置詞の後ろで目的語を取るなら動名詞。名詞では目的語を取れない。","words":[{"w":"relies on","p":"熟語","m":"頼る"},{"w":"word-of-mouth","p":"形容詞","m":"口コミの"},{"w":"publicity","p":"名詞","m":"評判、宣伝"},{"w":"advertising","p":"動名詞","m":"宣伝すること"}]},{"id":808,"category":"文法模試セット10","question":"Student loan applications will be ______ promptly in chronological order according to the date on the receipt.","A":"processed","B":"process","C":"processes","D":"processing","answer":"A","answer_word":"processed","explanation":"■ 文の骨格\nStudent loan applications will be ______ promptly in chronological order according to the date on the receipt.\n\n■ 空所に入るもの\nwill be の後ろで、主語 applications は「処理される」側なので過去分詞が必要。\n→ 空所には「受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) processed … 過去分詞「処理された」 ○\n(B) process … 動詞（原形）／名詞「処理する／過程」 ×\n(C) processes … 動詞（三人称単数現在形）「処理する」 ×\n(D) processing … 現在分詞・動名詞「処理すること」 ×\n\n■ 完成文\nStudent loan applications will be processed promptly in chronological order according to the date on the receipt.\n（奨学金の申請は、受領日の順に速やかに処理される。）\n\n■ 解き方のポイント\n〈will be＋過去分詞〉で未来の受動態。","words":[{"w":"Student loan","p":"名詞","m":"奨学金"},{"w":"processed","p":"過去分詞","m":"処理された"},{"w":"promptly","p":"副詞","m":"速やかに"},{"w":"chronological order","p":"名詞","m":"日付順"}]},{"id":809,"category":"文法模試セット10","question":"______ the motivational speaker addressed new staff members, a technician recorded her presentation.","A":"While","B":"Rather than","C":"Yet","D":"As if","answer":"A","answer_word":"While","explanation":"■ 文の骨格\n______ the motivational speaker addressed new staff members, a technician recorded her presentation.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、2つの出来事が同時であることを表す接続詞が必要。\n→ 空所には「時を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) While … 接続詞「〜している間に」 ○\n(B) Rather than … 群前置詞「〜よりむしろ」 ×\n(C) Yet … 接続詞・副詞「しかし」 ×\n(D) As if … 接続詞（群）「まるで〜のように」 ×\n\n■ 完成文\nWhile the motivational speaker addressed new staff members, a technician recorded her presentation.\n（モチベーション講師が新入社員に向けて話している間、技術者が彼女のプレゼンを録画した。）\n\n■ 解き方のポイント\nwhile は同時進行を表す接続詞。後ろに節が来る。","words":[{"w":"motivational speaker","p":"名詞","m":"モチベーション講師"},{"w":"addressed","p":"動詞（過去形）","m":"話しかけた"},{"w":"technician","p":"名詞","m":"技術者"},{"w":"recorded","p":"動詞（過去形）","m":"録画した"}]},{"id":810,"category":"文法模試セット10","question":"After a three-month delay, Olivia Evans is ______ ready to launch a sequel to her popular debut novel.","A":"final","B":"finally","C":"finalizing","D":"finals","answer":"B","answer_word":"finally","explanation":"■ 文の骨格\nAfter a three-month delay, Olivia Evans is ______ ready to launch a sequel to her popular debut novel.\n\n■ 空所に入るもの\nis の補語として形容詞 ready がすでにあり、空所は修飾語の位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) final … 形容詞「最終の」 ×\n(B) finally … 副詞「ついに」 ○\n(C) finalizing … 現在分詞・動名詞「最終決定すること」 ×\n(D) finals … 名詞（複数形）「決勝戦」 ×\n\n■ 完成文\nAfter a three-month delay, Olivia Evans is finally ready to launch a sequel to her popular debut novel.\n（3か月の遅れを経て、Olivia Evans はついに人気デビュー作の続編を発表する準備が整った。）\n\n■ 解き方のポイント\n〈be動詞＋空所＋形容詞〉は副詞。","words":[{"w":"delay","p":"名詞","m":"遅れ"},{"w":"finally","p":"副詞","m":"ついに"},{"w":"launch","p":"動詞","m":"発表する"},{"w":"sequel","p":"名詞","m":"続編"}]},{"id":811,"category":"文法模試セット10","question":"Please forward any ______ additions to the agenda by noon on Monday before the meeting.","A":"suggest","B":"suggests","C":"suggested","D":"suggestions","answer":"C","answer_word":"suggested","explanation":"■ 文の骨格\nPlease forward any ______ additions to the agenda by noon on Monday before the meeting.\n\n■ 空所に入るもの\nany と名詞 additions の間にあり、受け身の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) suggest … 動詞（原形）「提案する」 ×\n(B) suggests … 動詞（三人称単数現在形）「提案する」 ×\n(C) suggested … 過去分詞・形容詞「提案された」 ○\n(D) suggestions … 名詞（複数形）「提案」 ×\n\n■ 完成文\nPlease forward any suggested additions to the agenda by noon on Monday before the meeting.\n（議題への追加案があれば、会議前の月曜正午までにお送りください。）\n\n■ 解き方のポイント\nadditions は「提案される」側なので過去分詞。名詞を2つ並べても意味が通らない。","words":[{"w":"forward","p":"動詞","m":"転送する"},{"w":"suggested","p":"形容詞","m":"提案された"},{"w":"additions","p":"名詞","m":"追加"},{"w":"agenda","p":"名詞","m":"議題"}]},{"id":812,"category":"文法模試セット10","question":"Items in the canned food section should be stacked with ______ to avoid any damage from accidental bumps and scrapes.","A":"care","B":"careful","C":"carefully","D":"cared","answer":"A","answer_word":"care","explanation":"■ 文の骨格\nItems in the canned food section should be stacked with ______ to avoid any damage from accidental bumps and scrapes.\n\n■ 空所に入るもの\nwith＋抽象名詞で副詞句をつくる形になる。\n→ 空所には「前置詞 with の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) care … 名詞「注意」 ○\n(B) careful … 形容詞「注意深い」 ×\n(C) carefully … 副詞「注意深く」 ×\n(D) cared … 動詞の過去形・過去分詞「気にかけた」 ×\n\n■ 完成文\nItems in the canned food section should be stacked with care to avoid any damage from accidental bumps and scrapes.\n（缶詰売り場の商品は、うっかりぶつけたりこすったりして傷まないよう、注意して積み上げること。）\n\n■ 解き方のポイント\nwith care＝carefully。〈with＋抽象名詞〉は副詞のはたらきをする。","words":[{"w":"canned food","p":"名詞","m":"缶詰"},{"w":"stacked","p":"動詞（過去分詞）","m":"積み上げられる"},{"w":"with care","p":"熟語","m":"注意して"},{"w":"accidental","p":"形容詞","m":"偶発的な"}]},{"id":813,"category":"文法模試セット10","question":"Mr. Park will be posted to the customer service department ______ he has been trained for three weeks under Ms. Williams.","A":"after","B":"while","C":"then","D":"that","answer":"A","answer_word":"after","explanation":"■ 文の骨格\nMr. Park will be posted to the customer service department ______ he has been trained for three weeks under Ms. Williams.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、時の前後関係を表す接続詞が必要。\n→ 空所には「時を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) after … 接続詞「〜したあとで」 ○\n(B) while … 接続詞「〜する間」 ×\n(C) then … 副詞「そのとき」 ×\n(D) that … 接続詞「〜ということ」 ×\n\n■ 完成文\nMr. Park will be posted to the customer service department after he has been trained for three weeks under Ms. Williams.\n（Park さんは、Williams さんのもとで3週間の研修を受けたあと、顧客サービス部に配属される。）\n\n■ 解き方のポイント\n時の副詞節では未来のことも現在完了形で表す（has been trained）。","words":[{"w":"posted to","p":"熟語","m":"〜に配属される"},{"w":"customer service department","p":"名詞","m":"顧客サービス部"},{"w":"trained","p":"動詞（過去分詞）","m":"研修を受けた"}]},{"id":814,"category":"文法模試セット10","question":"Barriers have been placed at certain points around the building to restrict people ______ entering areas under construction.","A":"of","B":"out","C":"from","D":"than","answer":"C","answer_word":"from","explanation":"■ 文の骨格\nBarriers have been placed at certain points around the building to restrict people ______ entering areas under construction.\n\n■ 空所に入るもの\nrestrict X from doing（Xが〜するのを制限する）という組み合わせになる。\n→ 空所には「restrict と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) of … 前置詞「〜の」 ×\n(B) out … 副詞「外へ」 ×\n(C) from … 前置詞「〜から」 ○\n(D) than … 接続詞・前置詞「〜よりも」 ×\n\n■ 完成文\nBarriers have been placed at certain points around the building to restrict people from entering areas under construction.\n（工事中の区域に人が入るのを制限するため、建物の周囲の特定の地点に柵が設けられている。）\n\n■ 解き方のポイント\nrestrict／prevent／stop／keep＋X＋from doing はセットで覚える。","words":[{"w":"Barriers","p":"名詞","m":"柵"},{"w":"restrict","p":"動詞","m":"制限する"},{"w":"from","p":"前置詞","m":"〜から"},{"w":"under construction","p":"熟語","m":"工事中の"}]},{"id":815,"category":"文法模試セット10","question":"Factory supervisors are responsible for ______ that all employees are updated on safety regulations.","A":"ensure","B":"ensuring","C":"ensures","D":"ensured","answer":"B","answer_word":"ensuring","explanation":"■ 文の骨格\nFactory supervisors are responsible for ______ that all employees are updated on safety regulations.\n\n■ 空所に入るもの\nbe responsible for の for は前置詞なので、後ろは動名詞が必要。\n→ 空所には「前置詞 for の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) ensure … 動詞（原形）「確実にする」 ×\n(B) ensuring … 動名詞「確実にすること」 ○\n(C) ensures … 動詞（三人称単数現在形）「確実にする」 ×\n(D) ensured … 動詞の過去形・過去分詞「確実にされた」 ×\n\n■ 完成文\nFactory supervisors are responsible for ensuring that all employees are updated on safety regulations.\n（工場の監督者は、全従業員が安全規則の最新情報を把握していることを確実にする責任を負っている。）\n\n■ 解き方のポイント\nbe responsible for doing。for は前置詞なので動名詞。","words":[{"w":"supervisors","p":"名詞","m":"監督者"},{"w":"responsible for","p":"熟語","m":"〜の責任がある"},{"w":"ensuring","p":"動名詞","m":"確実にすること"},{"w":"safety regulations","p":"名詞","m":"安全規則"}]},{"id":816,"category":"文法模試セット10","question":"The cap on the gas tank should be ______ tightened before starting the engine.","A":"firm","B":"firmer","C":"firmness","D":"firmly","answer":"D","answer_word":"firmly","explanation":"■ 文の骨格\nThe cap on the gas tank should be ______ tightened before starting the engine.\n\n■ 空所に入るもの\n受動態 should be tightened の間に入る修飾語の位置。\n→ 空所には「過去分詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) firm … 形容詞「しっかりした」 ×\n(B) firmer … 形容詞（比較級）「よりしっかりした」 ×\n(C) firmness … 名詞「堅固さ」 ×\n(D) firmly … 副詞「しっかりと」 ○\n\n■ 完成文\nThe cap on the gas tank should be firmly tightened before starting the engine.\n（エンジンをかける前に、燃料タンクのキャップをしっかり締めておくこと。）\n\n■ 解き方のポイント\n〈be＋空所＋過去分詞〉は副詞の定位置。","words":[{"w":"cap","p":"名詞","m":"キャップ、ふた"},{"w":"gas tank","p":"名詞","m":"燃料タンク"},{"w":"firmly","p":"副詞","m":"しっかりと"},{"w":"tightened","p":"動詞（過去分詞）","m":"締められた"}]},{"id":817,"category":"文法模試セット10","question":"While Sophia Gonzalez's promotion to the director position took place a month ago, her previous position is ______ to be filled.","A":"even","B":"recent","C":"like","D":"yet","answer":"D","answer_word":"yet","explanation":"■ 文の骨格\nWhile Sophia Gonzalez's promotion to the director position took place a month ago, her previous position is ______ to be filled.\n\n■ 空所に入るもの\nbe yet to do（まだ〜されていない）という定型表現になる。\n→ 空所には「be to 不定詞と結びつく副詞」が必要です。\n\n■ 選択肢の確認\n(A) even … 副詞「〜さえ」 ×\n(B) recent … 形容詞「最近の」 ×\n(C) like … 前置詞「〜のような」 ×\n(D) yet … 副詞「まだ〜していない」 ○\n\n■ 完成文\nWhile Sophia Gonzalez's promotion to the director position took place a month ago, her previous position is yet to be filled.\n（Sophia Gonzalez の部長職への昇進は1か月前に行われたが、彼女の前の職はまだ埋まっていない。）\n\n■ 解き方のポイント\nbe yet to be done＝「まだ〜されていない」。have yet to do も同義。","words":[{"w":"promotion","p":"名詞","m":"昇進"},{"w":"took place","p":"熟語","m":"行われた"},{"w":"previous","p":"形容詞","m":"前の"},{"w":"yet","p":"副詞","m":"まだ〜していない"}]},{"id":818,"category":"文法模試セット10","question":"The administrative assistant was required by her supervisor to restock the shelves with office ______.","A":"supply","B":"supplied","C":"supplier","D":"supplies","answer":"D","answer_word":"supplies","explanation":"■ 文の骨格\nThe administrative assistant was required by her supervisor to restock the shelves with office ______.\n\n■ 空所に入るもの\n前置詞 with の目的語で、office に続く名詞が必要。\n→ 空所には「office と複合名詞をつくる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) supply … 名詞（単数形）／動詞「供給／供給する」 ×\n(B) supplied … 動詞の過去形・過去分詞「供給された」 ×\n(C) supplier … 名詞（人）「供給業者」 ×\n(D) supplies … 名詞（複数形）「事務用品」 ○\n\n■ 完成文\nThe administrative assistant was required by her supervisor to restock the shelves with office supplies.\n（事務補佐は上司から、棚に事務用品を補充するよう求められた。）\n\n■ 解き方のポイント\noffice supplies（事務用品）は常に複数形で使う複合名詞。","words":[{"w":"administrative assistant","p":"名詞","m":"事務補佐"},{"w":"restock","p":"動詞","m":"補充する"},{"w":"shelves","p":"名詞","m":"棚"},{"w":"office supplies","p":"名詞","m":"事務用品"}]},{"id":819,"category":"文法模試セット10","question":"Joe Oliver, the British celebrity chef, has made it his mission in recent years to break people's ______ on fast food.","A":"dependent","B":"depends","C":"dependence","D":"dependently","answer":"C","answer_word":"dependence","explanation":"■ 文の骨格\nJoe Oliver, the British celebrity chef, has made it his mission in recent years to break people's ______ on fast food.\n\n■ 空所に入るもの\n所有格 people's の後ろで、break の目的語となる名詞が必要。\n→ 空所には「所有格の後ろに置く名詞」が必要です。\n\n■ 選択肢の確認\n(A) dependent … 形容詞「依存している」 ×\n(B) depends … 動詞（三人称単数現在形）「依存する」 ×\n(C) dependence … 名詞「依存」 ○\n(D) dependently … 副詞「依存して」 ×\n\n■ 完成文\nJoe Oliver, the British celebrity chef, has made it his mission in recent years to break people's dependence on fast food.\n（英国の有名シェフ Joe Oliver は近年、人々のファストフードへの依存を断ち切ることを自らの使命としている。）\n\n■ 解き方のポイント\ndependence on X＝「Xへの依存」。〈所有格＋空所〉は名詞。","words":[{"w":"celebrity chef","p":"名詞","m":"有名シェフ"},{"w":"mission","p":"名詞","m":"使命"},{"w":"dependence","p":"名詞","m":"依存"},{"w":"fast food","p":"名詞","m":"ファストフード"}]},{"id":820,"category":"文法模試セット10","question":"Participants will receive copies of all materials used ______ the workshop sessions and will be encouraged to use them at their workplaces.","A":"during","B":"while","C":"when","D":"once","answer":"A","answer_word":"during","explanation":"■ 文の骨格\nParticipants will receive copies of all materials used ______ the workshop sessions and will be encouraged to use them at their workplaces.\n\n■ 空所に入るもの\n空所の後ろが名詞句 the workshop sessions なので、前置詞が必要。\n→ 空所には「名詞句を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) during … 前置詞「〜の間」 ○\n(B) while … 接続詞「〜する間」 ×\n(C) when … 接続詞「〜のとき」 ×\n(D) once … 接続詞「いったん〜すれば」 ×\n\n■ 完成文\nParticipants will receive copies of all materials used during the workshop sessions and will be encouraged to use them at their workplaces.\n（参加者は研修中に使われた全資料のコピーを受け取り、職場での活用が奨励される。）\n\n■ 解き方のポイント\nduring＋名詞／while＋節。後ろの形で選ぶ。","words":[{"w":"Participants","p":"名詞","m":"参加者"},{"w":"materials","p":"名詞","m":"資料"},{"w":"during","p":"前置詞","m":"〜の間"},{"w":"workplaces","p":"名詞","m":"職場"}]},{"id":821,"category":"文法模試セット10","question":"Senior sales representatives can obtain ______ access to their team's sales figures using one of the computers in the administration office.","A":"secure","B":"securely","C":"secures","D":"securing","answer":"A","answer_word":"secure","explanation":"■ 文の骨格\nSenior sales representatives can obtain ______ access to their team's sales figures using one of the computers in the administration office.\n\n■ 空所に入るもの\n他動詞 obtain の目的語 access を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) secure … 形容詞「安全な」 ○\n(B) securely … 副詞「安全に」 ×\n(C) secures … 動詞（三人称単数現在形）「確保する」 ×\n(D) securing … 現在分詞・動名詞「確保すること」 ×\n\n■ 完成文\nSenior sales representatives can obtain secure access to their team's sales figures using one of the computers in the administration office.\n（上級営業担当者は、管理部の端末を使ってチームの売上数値に安全にアクセスできる。）\n\n■ 解き方のポイント\n名詞の直前は形容詞。secure は形容詞・動詞の両方で使う。","words":[{"w":"Senior","p":"形容詞","m":"上級の"},{"w":"obtain","p":"動詞","m":"得る"},{"w":"secure","p":"形容詞","m":"安全な"},{"w":"sales figures","p":"名詞","m":"売上数値"}]},{"id":822,"category":"文法模試セット10","question":"The company director ______ that she would be out of town when the decision was made about the location of the new offices.","A":"assured","B":"pointed","C":"offered","D":"indicated","answer":"D","answer_word":"indicated","explanation":"■ 文の骨格\nThe company director ______ that she would be out of town when the decision was made about the location of the new offices.\n\n■ 空所に入るもの\n直後の that 節を目的語に取り、文意に合う動詞が必要。\n→ 空所には「that 節を目的語に取る動詞」が必要です。\n\n■ 選択肢の確認\n(A) assured … 動詞（過去形）「保証した（人＋that）」 ×\n(B) pointed … 動詞（過去形）「指さした（out が必要）」 ×\n(C) offered … 動詞（過去形）「申し出た」 ×\n(D) indicated … 動詞（過去形）「示した、述べた」 ○\n\n■ 完成文\nThe company director indicated that she would be out of town when the decision was made about the location of the new offices.\n（会社の役員は、新しい事務所の場所が決まったとき自分は出張中だっただろうと述べた。）\n\n■ 解き方のポイント\nassure は〈人＋that〉の形が必要。indicate は that 節を直接取れる。","words":[{"w":"company director","p":"名詞","m":"会社の役員"},{"w":"indicated","p":"動詞（過去形）","m":"述べた"},{"w":"out of town","p":"熟語","m":"出張中で"},{"w":"decision","p":"名詞","m":"決定"}]},{"id":823,"category":"文法模試セット10","question":"The Mansfield Domestic Airport built just six years ago has ______ been expanded to accommodate international flights.","A":"soon","B":"yet","C":"since","D":"after","answer":"C","answer_word":"since","explanation":"■ 文の骨格\nThe Mansfield Domestic Airport built just six years ago has ______ been expanded to accommodate international flights.\n\n■ 空所に入るもの\n現在完了形 has been expanded の間に入り、「その後」を表す副詞が必要。\n→ 空所には「現在完了形と呼応する副詞」が必要です。\n\n■ 選択肢の確認\n(A) soon … 副詞「まもなく」 ×\n(B) yet … 副詞「まだ（否定・疑問で）」 ×\n(C) since … 副詞「その後、すでに」 ○\n(D) after … 前置詞・接続詞「〜のあとに」 ×\n\n■ 完成文\nThe Mansfield Domestic Airport built just six years ago has since been expanded to accommodate international flights.\n（わずか6年前に建てられた Mansfield 国内空港は、その後、国際線に対応するため拡張された。）\n\n■ 解き方のポイント\nsince は副詞で「その後」の意味も持つ。現在完了形と相性がよい。","words":[{"w":"Domestic Airport","p":"名詞","m":"国内空港"},{"w":"since","p":"副詞","m":"その後"},{"w":"expanded","p":"動詞（過去分詞）","m":"拡張された"},{"w":"accommodate","p":"動詞","m":"受け入れる"}]},{"id":824,"category":"文法模試セット10","question":"Unless George's Appliances ______ a more aggressive business plan immediately, it will lose market share to new rivals.","A":"adopts","B":"coincides","C":"proceeds","D":"agrees","answer":"A","answer_word":"adopts","explanation":"■ 文の骨格\nUnless George's Appliances ______ a more aggressive business plan immediately, it will lose market share to new rivals.\n\n■ 空所に入るもの\n直後に目的語 a more aggressive business plan があるので、他動詞が必要。\n→ 空所には「目的語を直接取る他動詞」が必要です。\n\n■ 選択肢の確認\n(A) adopts … 動詞（三人称単数現在形）「採用する」 ○\n(B) coincides … 動詞（三人称単数現在形）「一致する（with が必要）」 ×\n(C) proceeds … 動詞（三人称単数現在形）「進む（自動詞）」 ×\n(D) agrees … 動詞（三人称単数現在形）「同意する（自動詞）」 ×\n\n■ 完成文\nUnless George's Appliances adopts a more aggressive business plan immediately, it will lose market share to new rivals.\n（George’s Appliances 社がすぐにもっと積極的な事業計画を採用しない限り、新興のライバルに市場シェアを奪われる。）\n\n■ 解き方のポイント\ncoincide with／agree with／proceed は前置詞が必要。他動詞かどうかで絞る。","words":[{"w":"Unless","p":"接続詞","m":"〜でない限り"},{"w":"adopts","p":"動詞","m":"採用する"},{"w":"aggressive","p":"形容詞","m":"積極的な"},{"w":"market share","p":"名詞","m":"市場シェア"}]},{"id":825,"category":"文法模試セット10","question":"Applications for business trips must have a manager's signed ______ before they are submitted to administration.","A":"approve","B":"approved","C":"approves","D":"approval","answer":"D","answer_word":"approval","explanation":"■ 文の骨格\nApplications for business trips must have a manager's signed ______ before they are submitted to administration.\n\n■ 空所に入るもの\n所有格と過去分詞 signed の後ろで、他動詞 have の目的語となる名詞が必要。\n→ 空所には「have の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) approve … 動詞（原形）「承認する」 ×\n(B) approved … 動詞の過去形・過去分詞「承認された」 ×\n(C) approves … 動詞（三人称単数現在形）「承認する」 ×\n(D) approval … 名詞「承認」 ○\n\n■ 完成文\nApplications for business trips must have a manager's signed approval before they are submitted to administration.\n（出張申請は、管理部門へ提出する前に部長の署名入りの承認を得ていなければならない。）\n\n■ 解き方のポイント\n〈所有格＋過去分詞＋空所〉は名詞。-al で終わるが approval は名詞。","words":[{"w":"Applications","p":"名詞","m":"申請"},{"w":"business trips","p":"名詞","m":"出張"},{"w":"signed","p":"形容詞","m":"署名入りの"},{"w":"approval","p":"名詞","m":"承認"}]},{"id":826,"category":"文法模試セット10","question":"Quick Communication's newest mobile phone is far smaller ______ the palm of a typical user.","A":"at","B":"with","C":"than","D":"when","answer":"C","answer_word":"than","explanation":"■ 文の骨格\nQuick Communication's newest mobile phone is far smaller ______ the palm of a typical user.\n\n■ 空所に入るもの\n比較級 smaller があるので、比較の対象を導く than が必要。\n→ 空所には「比較級と呼応する接続詞」が必要です。\n\n■ 選択肢の確認\n(A) at … 前置詞「〜で」 ×\n(B) with … 前置詞「〜とともに」 ×\n(C) than … 接続詞・前置詞「〜よりも」 ○\n(D) when … 接続詞「〜のとき」 ×\n\n■ 完成文\nQuick Communication's newest mobile phone is far smaller than the palm of a typical user.\n（Quick Communication 社の最新携帯電話は、一般的な利用者の手のひらよりはるかに小さい。）\n\n■ 解き方のポイント\n比較級とセットになるのは than。far は比較級を強める副詞。","words":[{"w":"far","p":"副詞","m":"はるかに"},{"w":"smaller","p":"比較級","m":"より小さい"},{"w":"than","p":"接続詞","m":"〜よりも"},{"w":"palm","p":"名詞","m":"手のひら"}]},{"id":827,"category":"文法模試セット10","question":"If the copy machine is out of paper, add ______ from the storage cupboard located beside the door to the kitchen.","A":"other","B":"more","C":"few","D":"one","answer":"B","answer_word":"more","explanation":"■ 文の骨格\nIf the copy machine is out of paper, add ______ from the storage cupboard located beside the door to the kitchen.\n\n■ 空所に入るもの\nadd の目的語で、不可算名詞 paper を受けて「もっと」を表す語が必要。\n→ 空所には「不可算名詞を受ける代名詞」が必要です。\n\n■ 選択肢の確認\n(A) other … 形容詞「ほかの」 ×\n(B) more … 代名詞・形容詞「もっと多く」 ○\n(C) few … 形容詞（可算名詞用）「ほとんど〜ない」 ×\n(D) one … 代名詞（可算名詞用）「1つ」 ×\n\n■ 完成文\nIf the copy machine is out of paper, add more from the storage cupboard located beside the door to the kitchen.\n（コピー機の用紙が切れていたら、台所のドアの横にある収納棚から補充してください。）\n\n■ 解き方のポイント\npaper は不可算なので one／few は使えない。more は単独で代名詞になれる。","words":[{"w":"out of paper","p":"熟語","m":"用紙切れで"},{"w":"add","p":"動詞","m":"補充する"},{"w":"more","p":"代名詞","m":"もっと多く"},{"w":"storage cupboard","p":"名詞","m":"収納棚"}]},{"id":828,"category":"文法模試セット10","question":"Considering her exceptional work at the regional office, we believe Ms. Gupta is ______ a qualified candidate for general manager.","A":"sure","B":"surely","C":"surest","D":"sureness","answer":"B","answer_word":"surely","explanation":"■ 文の骨格\nConsidering her exceptional work at the regional office, we believe Ms. Gupta is ______ a qualified candidate for general manager.\n\n■ 空所に入るもの\nis a qualified candidate で文の要素がそろっており、空所は修飾語の位置。\n→ 空所には「文を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) sure … 形容詞「確かな」 ×\n(B) surely … 副詞「確かに」 ○\n(C) surest … 形容詞（最上級）「最も確かな」 ×\n(D) sureness … 名詞「確実さ」 ×\n\n■ 完成文\nConsidering her exceptional work at the regional office, we believe Ms. Gupta is surely a qualified candidate for general manager.\n（地域事務所での卓越した働きを考えると、Gupta さんは確かに統括部長にふさわしい候補者だと私たちは考えている。）\n\n■ 解き方のポイント\n〈be動詞＋空所＋名詞句〉で文が成立していれば副詞。","words":[{"w":"Considering","p":"前置詞","m":"〜を考えると"},{"w":"exceptional","p":"形容詞","m":"卓越した"},{"w":"surely","p":"副詞","m":"確かに"},{"w":"candidate","p":"名詞","m":"候補者"}]},{"id":829,"category":"文法模試セット10","question":"The parking area near the front entrance of the main office ______ for outside visitors.","A":"to be allocated","B":"has been allocated","C":"allocates","D":"was allocating","answer":"B","answer_word":"has been allocated","explanation":"■ 文の骨格\nThe parking area near the front entrance of the main office ______ for outside visitors.\n\n■ 空所に入るもの\n主語 The parking area は「割り当てられる」側なので受動態が必要。\n→ 空所には「受動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) to be allocated … 不定詞（受動）「割り当てられること」 ×\n(B) has been allocated … 現在完了受動態「割り当てられている」 ○\n(C) allocates … 動詞（三人称単数現在形・能動）「割り当てる」 ×\n(D) was allocating … 過去進行形（能動）「割り当てていた」 ×\n\n■ 完成文\nThe parking area near the front entrance of the main office has been allocated for outside visitors.\n（本社正面入口近くの駐車場は、外部からの来訪者用に割り当てられている。）\n\n■ 解き方のポイント\n文には述語動詞が必要。不定詞は述語動詞になれない。","words":[{"w":"parking area","p":"名詞","m":"駐車場"},{"w":"front entrance","p":"名詞","m":"正面入口"},{"w":"has been allocated","p":"現在完了受動態","m":"割り当てられている"},{"w":"visitors","p":"名詞","m":"来訪者"}]},{"id":830,"category":"文法模試セット10","question":"Angela Ocampo attended last Tuesday's seminar on business ______ and learned how to reduce costs and increase profits.","A":"finance","B":"financial","C":"financially","D":"financed","answer":"A","answer_word":"finance","explanation":"■ 文の骨格\nAngela Ocampo attended last Tuesday's seminar on business ______ and learned how to reduce costs and increase profits.\n\n■ 空所に入るもの\n前置詞 on の目的語で、business に続く名詞が必要。\n→ 空所には「business と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) finance … 名詞「財務、資金調達」 ○\n(B) financial … 形容詞「財務の」 ×\n(C) financially … 副詞「財政的に」 ×\n(D) financed … 動詞の過去形・過去分詞「資金を出した」 ×\n\n■ 完成文\nAngela Ocampo attended last Tuesday's seminar on business finance and learned how to reduce costs and increase profits.\n（Angela Ocampo は先週火曜の企業財務のセミナーに出席し、経費削減と利益増加の方法を学んだ。）\n\n■ 解き方のポイント\nbusiness finance（企業財務）は複合名詞。前置詞の後ろは名詞。","words":[{"w":"attended","p":"動詞（過去形）","m":"出席した"},{"w":"business finance","p":"名詞","m":"企業財務"},{"w":"reduce costs","p":"熟語","m":"経費を削減する"},{"w":"profits","p":"名詞","m":"利益"}]},{"id":831,"category":"文法模試セット10","question":"Most industry experts expect prices ______ relatively constant for the next five years.","A":"remain","B":"to remain","C":"remaining","D":"remains","answer":"B","answer_word":"to remain","explanation":"■ 文の骨格\nMost industry experts expect prices ______ relatively constant for the next five years.\n\n■ 空所に入るもの\nexpect＋目的語＋to do の形になるので、不定詞が必要。\n→ 空所には「expect O to do の形をつくる不定詞」が必要です。\n\n■ 選択肢の確認\n(A) remain … 動詞（原形）「〜のままである」 ×\n(B) to remain … 不定詞「〜のままであること」 ○\n(C) remaining … 現在分詞・動名詞「〜のままであること」 ×\n(D) remains … 動詞（三人称単数現在形）「〜のままである」 ×\n\n■ 完成文\nMost industry experts expect prices to remain relatively constant for the next five years.\n（大半の業界専門家は、今後5年間は価格が比較的一定のままだと予想している。）\n\n■ 解き方のポイント\nexpect／want／allow／enable は〈O＋to do〉の形を取る。","words":[{"w":"industry experts","p":"名詞","m":"業界専門家"},{"w":"expect","p":"動詞","m":"予想する"},{"w":"to remain","p":"不定詞","m":"〜のままであること"},{"w":"relatively","p":"副詞","m":"比較的"},{"w":"constant","p":"形容詞","m":"一定の"}]},{"id":832,"category":"文法模試セット10","question":"Any reasonable expenses incurred in holding business meetings will be reimbursed ______ the company.","A":"by","B":"after","C":"on","D":"with","answer":"A","answer_word":"by","explanation":"■ 文の骨格\nAny reasonable expenses incurred in holding business meetings will be reimbursed ______ the company.\n\n■ 空所に入るもの\n受動態 will be reimbursed の後ろで、行為者を示す前置詞が必要。\n→ 空所には「受動態の行為者を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) by … 前置詞「〜によって」 ○\n(B) after … 前置詞・接続詞「〜のあとに」 ×\n(C) on … 前置詞「〜の上に」 ×\n(D) with … 前置詞「〜とともに」 ×\n\n■ 完成文\nAny reasonable expenses incurred in holding business meetings will be reimbursed by the company.\n（商談の開催にかかった妥当な経費は、会社が払い戻す。）\n\n■ 解き方のポイント\n受動態の行為者は by。〈be＋過去分詞＋by＋人・組織〉。","words":[{"w":"reasonable","p":"形容詞","m":"妥当な"},{"w":"expenses","p":"名詞","m":"経費"},{"w":"incurred","p":"動詞（過去分詞）","m":"生じた"},{"w":"reimbursed","p":"動詞（過去分詞）","m":"払い戻される"}]},{"id":833,"category":"文法模試セット11","question":"Using public ______ in countries that you visit is the most cost-efficient way to travel.","A":"transportable","B":"transporting","C":"transportation","D":"transported","answer":"C","answer_word":"transportation","explanation":"■ 文の骨格\nUsing public ______ in countries that you visit is the most cost-efficient way to travel.\n\n■ 空所に入るもの\n動名詞 Using の目的語で、形容詞 public に修飾される名詞が必要。\n→ 空所には「public と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) transportable … 形容詞「輸送できる」 ×\n(B) transporting … 現在分詞・動名詞「輸送すること」 ×\n(C) transportation … 名詞「交通機関」 ○\n(D) transported … 動詞の過去形・過去分詞「輸送された」 ×\n\n■ 完成文\nUsing public transportation in countries that you visit is the most cost-efficient way to travel.\n（訪れる国で公共交通機関を使うことが、最も費用効率のよい旅の方法だ。）\n\n■ 解き方のポイント\npublic transportation（公共交通機関）は定型。-tion は名詞の目印。","words":[{"w":"public transportation","p":"名詞","m":"公共交通機関"},{"w":"countries","p":"名詞","m":"国"},{"w":"cost-efficient","p":"形容詞","m":"費用効率のよい"}]},{"id":834,"category":"文法模試セット11","question":"Over the weekend, either Ms. Parker ______ Mr. Scott will be in the office to answer customer calls.","A":"or","B":"unless","C":"then","D":"and","answer":"A","answer_word":"or","explanation":"■ 文の骨格\nOver the weekend, either Ms. Parker ______ Mr. Scott will be in the office to answer customer calls.\n\n■ 空所に入るもの\n前に either があるので、either A or B（AかBのどちらか）の形になる。\n→ 空所には「either と呼応する等位接続詞」が必要です。\n\n■ 選択肢の確認\n(A) or … 等位接続詞「または」 ○\n(B) unless … 接続詞「〜でない限り」 ×\n(C) then … 副詞「そのとき」 ×\n(D) and … 等位接続詞「そして」 ×\n\n■ 完成文\nOver the weekend, either Ms. Parker or Mr. Scott will be in the office to answer customer calls.\n（週末は、Parker さんか Scott さんのどちらかが顧客からの電話に対応するため出社する。）\n\n■ 解き方のポイント\neither A or B／neither A nor B。動詞は B に合わせる。","words":[{"w":"Over the weekend","p":"熟語","m":"週末は"},{"w":"either ... or","p":"相関接続詞","m":"AかBのどちらか"},{"w":"customer calls","p":"名詞","m":"顧客からの電話"}]},{"id":835,"category":"文法模試セット11","question":"A spokesperson for City Metro Radio said it planned to run a Sunday schedule on national holidays, ______ its regular weekday service.","A":"provided that","B":"in the event of","C":"instead of","D":"as much as","answer":"C","answer_word":"instead of","explanation":"■ 文の骨格\nA spokesperson for City Metro Radio said it planned to run a Sunday schedule on national holidays, ______ its regular weekday service.\n\n■ 空所に入るもの\n空所の後ろが名詞句 its regular weekday service なので、前置詞が必要。\n→ 空所には「名詞句を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) provided that … 接続詞（群）「〜という条件で」 ×\n(B) in the event of … 群前置詞「〜の場合には」 ×\n(C) instead of … 群前置詞「〜の代わりに」 ○\n(D) as much as … 接続詞（群）「〜と同じくらい」 ×\n\n■ 完成文\nA spokesperson for City Metro Radio said it planned to run a Sunday schedule on national holidays, instead of its regular weekday service.\n（City Metro Radio の広報担当は、祝日は通常の平日番組の代わりに日曜編成を行う予定だと述べた。）\n\n■ 解き方のポイント\ninstead of＋名詞＝「〜の代わりに」。後ろが節なら instead は使えない。","words":[{"w":"spokesperson","p":"名詞","m":"広報担当"},{"w":"national holidays","p":"名詞","m":"祝日"},{"w":"instead of","p":"熟語","m":"〜の代わりに"},{"w":"weekday","p":"形容詞","m":"平日の"}]},{"id":836,"category":"文法模試セット11","question":"The detailed terms and conditions of your employment are set forth in the ______ employment agreement.","A":"enclose","B":"enclosed","C":"enclosing","D":"encloses","answer":"B","answer_word":"enclosed","explanation":"■ 文の骨格\nThe detailed terms and conditions of your employment are set forth in the ______ employment agreement.\n\n■ 空所に入るもの\nthe と名詞句 employment agreement の間にあり、受け身の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) enclose … 動詞（原形）「同封する」 ×\n(B) enclosed … 過去分詞・形容詞「同封の」 ○\n(C) enclosing … 現在分詞・動名詞「同封すること」 ×\n(D) encloses … 動詞（三人称単数現在形）「同封する」 ×\n\n■ 完成文\nThe detailed terms and conditions of your employment are set forth in the enclosed employment agreement.\n（雇用条件の詳細は、同封の雇用契約書に記載されている。）\n\n■ 解き方のポイント\nagreement は「同封される」側なので過去分詞。enclosed＝「同封の」。","words":[{"w":"terms and conditions","p":"名詞","m":"条件"},{"w":"employment","p":"名詞","m":"雇用"},{"w":"set forth","p":"熟語","m":"記載されている"},{"w":"enclosed","p":"形容詞","m":"同封の"}]},{"id":837,"category":"文法模試セット11","question":"The CEO said a suburban location would be more convenient and less expensive ______ the current corporate headquarters in downtown New York.","A":"than","B":"and","C":"but","D":"while","answer":"A","answer_word":"than","explanation":"■ 文の骨格\nThe CEO said a suburban location would be more convenient and less expensive ______ the current corporate headquarters in downtown New York.\n\n■ 空所に入るもの\n比較級 more convenient／less expensive があるので、比較の対象を導く than が必要。\n→ 空所には「比較級と呼応する接続詞」が必要です。\n\n■ 選択肢の確認\n(A) than … 接続詞・前置詞「〜よりも」 ○\n(B) and … 等位接続詞「そして」 ×\n(C) but … 等位接続詞「しかし」 ×\n(D) while … 接続詞「〜する一方で」 ×\n\n■ 完成文\nThe CEO said a suburban location would be more convenient and less expensive than the current corporate headquarters in downtown New York.\n（CEO は、郊外の立地のほうがニューヨーク中心部の現本社より便利で費用も安いだろうと述べた。）\n\n■ 解き方のポイント\n比較級とセットになるのは than。more／less が目印。","words":[{"w":"suburban","p":"形容詞","m":"郊外の"},{"w":"convenient","p":"形容詞","m":"便利な"},{"w":"than","p":"接続詞","m":"〜よりも"},{"w":"headquarters","p":"名詞","m":"本社"}]},{"id":838,"category":"文法模試セット11","question":"Meridian Town was already participating in Bigmart's same-day ______ program, which began in select markets last fall.","A":"deliver","B":"delivered","C":"delivers","D":"delivery","answer":"D","answer_word":"delivery","explanation":"■ 文の骨格\nMeridian Town was already participating in Bigmart's same-day ______ program, which began in select markets last fall.\n\n■ 空所に入るもの\nsame-day と program の間に置かれ、same-day ______ program という複合名詞をつくる。\n→ 空所には「複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) deliver … 動詞（原形）「配達する」 ×\n(B) delivered … 動詞の過去形・過去分詞「配達された」 ×\n(C) delivers … 動詞（三人称単数現在形）「配達する」 ×\n(D) delivery … 名詞「配達」 ○\n\n■ 完成文\nMeridian Town was already participating in Bigmart's same-day delivery program, which began in select markets last fall.\n（Meridian Town はすでに、昨秋に一部地域で始まった Bigmart 社の当日配達プログラムに参加していた。）\n\n■ 解き方のポイント\nsame-day delivery（当日配達）は定型。名詞＋名詞の複合名詞。","words":[{"w":"participating in","p":"熟語","m":"〜に参加している"},{"w":"same-day delivery","p":"名詞","m":"当日配達"},{"w":"select markets","p":"名詞","m":"一部地域"}]},{"id":839,"category":"文法模試セット11","question":"The Drover's Bookshop carries a large ______ of books signed by their authors, in addition to rare first editions and hard-to-find books.","A":"stock","B":"stocks","C":"stocked","D":"stocking","answer":"A","answer_word":"stock","explanation":"■ 文の骨格\nThe Drover's Bookshop carries a large ______ of books signed by their authors, in addition to rare first editions and hard-to-find books.\n\n■ 空所に入るもの\n冠詞 a と形容詞 large の後ろで、of を伴う単数名詞が必要。\n→ 空所には「carries の目的語になる単数名詞」が必要です。\n\n■ 選択肢の確認\n(A) stock … 名詞（単数形）「在庫、品ぞろえ」 ○\n(B) stocks … 名詞（複数形）「在庫、株」 ×\n(C) stocked … 動詞の過去形・過去分詞「仕入れられた」 ×\n(D) stocking … 現在分詞・動名詞「仕入れること」 ×\n\n■ 完成文\nThe Drover's Bookshop carries a large stock of books signed by their authors, in addition to rare first editions and hard-to-find books.\n（Drover’s 書店は、希少な初版本や入手困難な本に加えて、著者のサイン入り本を豊富にそろえている。）\n\n■ 解き方のポイント\na large stock of X＝「Xの豊富な在庫」。冠詞 a があるので単数形。","words":[{"w":"carries","p":"動詞","m":"（商品を）扱う"},{"w":"a large stock of","p":"熟語","m":"豊富な在庫の"},{"w":"authors","p":"名詞","m":"著者"},{"w":"first editions","p":"名詞","m":"初版本"}]},{"id":840,"category":"文法模試セット11","question":"Tourist information and brochures can be found ______ the front desk in the lobby.","A":"at","B":"after","C":"into","D":"between","answer":"A","answer_word":"at","explanation":"■ 文の骨格\nTourist information and brochures can be found ______ the front desk in the lobby.\n\n■ 空所に入るもの\nフロントという地点を表す前置詞が必要。\n→ 空所には「地点を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) at … 前置詞「〜で（地点）」 ○\n(B) after … 前置詞・接続詞「〜のあとに」 ×\n(C) into … 前置詞「〜の中へ」 ×\n(D) between … 前置詞「〜の間に」 ×\n\n■ 完成文\nTourist information and brochures can be found at the front desk in the lobby.\n（観光案内とパンフレットは、ロビーのフロントに置かれています。）\n\n■ 解き方のポイント\nat＋地点、in＋空間の内部、on＋接触面。","words":[{"w":"Tourist information","p":"名詞","m":"観光案内"},{"w":"brochures","p":"名詞","m":"パンフレット"},{"w":"at","p":"前置詞","m":"〜で"},{"w":"front desk","p":"名詞","m":"フロント"}]},{"id":841,"category":"文法模試セット11","question":"FutureNet ______ announced on Monday that it had acquired Next Networks, a Web video production company based in San Francisco.","A":"formal","B":"formality","C":"formally","D":"formalize","answer":"C","answer_word":"formally","explanation":"■ 文の骨格\nFutureNet ______ announced on Monday that it had acquired Next Networks, a Web video production company based in San Francisco.\n\n■ 空所に入るもの\n主語 FutureNet と述語動詞 announced の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) formal … 形容詞「正式な」 ×\n(B) formality … 名詞「形式」 ×\n(C) formally … 副詞「正式に」 ○\n(D) formalize … 動詞（原形）「正式化する」 ×\n\n■ 完成文\nFutureNet formally announced on Monday that it had acquired Next Networks, a Web video production company based in San Francisco.\n（FutureNet 社は月曜日、サンフランシスコに拠点を置くウェブ動画制作会社 Next Networks 社を買収したと正式に発表した。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉は副詞の定位置。","words":[{"w":"formally","p":"副詞","m":"正式に"},{"w":"announced","p":"動詞（過去形）","m":"発表した"},{"w":"acquired","p":"動詞（過去分詞）","m":"買収した"},{"w":"based in","p":"熟語","m":"〜に拠点を置く"}]},{"id":842,"category":"文法模試セット11","question":"Melware Corporation reserves the right ______ service to users who do not abide by the terms of the contract.","A":"cancel","B":"canceling","C":"canceled","D":"to cancel","answer":"D","answer_word":"to cancel","explanation":"■ 文の骨格\nMelware Corporation reserves the right ______ service to users who do not abide by the terms of the contract.\n\n■ 空所に入るもの\n名詞 the right を後ろから修飾し、「〜する権利」を表す不定詞が必要。\n→ 空所には「名詞を修飾する不定詞」が必要です。\n\n■ 選択肢の確認\n(A) cancel … 動詞（原形）「解約する」 ×\n(B) canceling … 現在分詞・動名詞「解約すること」 ×\n(C) canceled … 動詞の過去形・過去分詞「解約された」 ×\n(D) to cancel … 不定詞「解約する（という）」 ○\n\n■ 完成文\nMelware Corporation reserves the right to cancel service to users who do not abide by the terms of the contract.\n（Melware 社は、契約条件を守らない利用者へのサービスを停止する権利を留保する。）\n\n■ 解き方のポイント\nthe right to do／the ability to do／the effort to do。名詞＋不定詞の形。","words":[{"w":"reserves the right","p":"熟語","m":"権利を留保する"},{"w":"to cancel","p":"不定詞","m":"解約する"},{"w":"abide by","p":"熟語","m":"〜を守る"},{"w":"terms","p":"名詞","m":"条件"}]},{"id":843,"category":"文法模試セット11","question":"The Laurent Museum in Paris is home to the world's largest ______ of impressionist paintings.","A":"collect","B":"collected","C":"collects","D":"collection","answer":"D","answer_word":"collection","explanation":"■ 文の骨格\nThe Laurent Museum in Paris is home to the world's largest ______ of impressionist paintings.\n\n■ 空所に入るもの\nthe world's largest の後ろで、of を伴う名詞が必要。\n→ 空所には「最上級に修飾される名詞」が必要です。\n\n■ 選択肢の確認\n(A) collect … 動詞（原形）「集める」 ×\n(B) collected … 動詞の過去形・過去分詞「集められた」 ×\n(C) collects … 動詞（三人称単数現在形）「集める」 ×\n(D) collection … 名詞「コレクション、収蔵品」 ○\n\n■ 完成文\nThe Laurent Museum in Paris is home to the world's largest collection of impressionist paintings.\n（パリの Laurent 美術館は、世界最大の印象派絵画コレクションを所蔵している。）\n\n■ 解き方のポイント\n〈最上級＋空所＋of〉は名詞。-tion は名詞の目印。","words":[{"w":"is home to","p":"熟語","m":"〜を擁している"},{"w":"collection","p":"名詞","m":"コレクション"},{"w":"impressionist","p":"形容詞","m":"印象派の"},{"w":"paintings","p":"名詞","m":"絵画"}]},{"id":844,"category":"文法模試セット11","question":"The company will ______ be organizing a nationwide campaign for its new line of mobile phones in April.","A":"want","B":"most likely","C":"the one","D":"to","answer":"B","answer_word":"most likely","explanation":"■ 文の骨格\nThe company will ______ be organizing a nationwide campaign for its new line of mobile phones in April.\n\n■ 空所に入るもの\n助動詞 will と動詞 be の間で、動詞を修飾する副詞相当の語句が必要。\n→ 空所には「動詞を修飾する副詞句」が必要です。\n\n■ 選択肢の確認\n(A) want … 動詞（原形）「望む」 ×\n(B) most likely … 副詞句「おそらく」 ○\n(C) the one … 名詞句「その1つ」 ×\n(D) to … 不定詞の一部「〜へ」 ×\n\n■ 完成文\nThe company will most likely be organizing a nationwide campaign for its new line of mobile phones in April.\n（その会社は4月に、新しい携帯電話シリーズの全国キャンペーンを展開する可能性が高い。）\n\n■ 解き方のポイント\n〈助動詞＋空所＋動詞〉は副詞の定位置。most likely は副詞句。","words":[{"w":"most likely","p":"副詞句","m":"おそらく"},{"w":"organizing","p":"現在分詞","m":"展開している"},{"w":"nationwide","p":"形容詞","m":"全国的な"},{"w":"line","p":"名詞","m":"製品シリーズ"}]},{"id":845,"category":"文法模試セット11","question":"In order for an employee to register for a seminar, all application forms must be filled in ______ and signed.","A":"complete","B":"completes","C":"completing","D":"completely","answer":"D","answer_word":"completely","explanation":"■ 文の骨格\nIn order for an employee to register for a seminar, all application forms must be filled in ______ and signed.\n\n■ 空所に入るもの\n受動態 must be filled in がすでに成立しており、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) complete … 形容詞・動詞「完全な／記入する」 ×\n(B) completes … 動詞（三人称単数現在形）「記入する」 ×\n(C) completing … 現在分詞・動名詞「記入すること」 ×\n(D) completely … 副詞「完全に、漏れなく」 ○\n\n■ 完成文\nIn order for an employee to register for a seminar, all application forms must be filled in completely and signed.\n（従業員がセミナーに登録するには、すべての申込書に漏れなく記入し署名しなければならない。）\n\n■ 解き方のポイント\n受動態の後ろの空所は副詞。and signed と並列になる点にも注意。","words":[{"w":"register for","p":"熟語","m":"〜に登録する"},{"w":"application forms","p":"名詞","m":"申込書"},{"w":"filled in","p":"熟語","m":"記入される"},{"w":"completely","p":"副詞","m":"漏れなく"}]},{"id":846,"category":"文法模試セット11","question":"Mr. Cooper's proposal for street rejuvenation was met ______ enthusiasm by local residents who had put up with potholes for decades.","A":"with","B":"in","C":"at","D":"through","answer":"A","answer_word":"with","explanation":"■ 文の骨格\nMr. Cooper's proposal for street rejuvenation was met ______ enthusiasm by local residents who had put up with potholes for decades.\n\n■ 空所に入るもの\nbe met with X（Xで迎えられる）という受動の定型表現になる。\n→ 空所には「meet と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) with … 前置詞「〜をもって」 ○\n(B) in … 前置詞「〜の中に」 ×\n(C) at … 前置詞「〜で」 ×\n(D) through … 前置詞「〜を通じて」 ×\n\n■ 完成文\nMr. Cooper's proposal for street rejuvenation was met with enthusiasm by local residents who had put up with potholes for decades.\n（何十年も路面の穴に耐えてきた地元住民は、Cooper 氏の街路再生の提案を熱意をもって迎えた。）\n\n■ 解き方のポイント\nbe met with enthusiasm [approval]＝「熱意［賛同］をもって迎えられる」。","words":[{"w":"proposal","p":"名詞","m":"提案"},{"w":"rejuvenation","p":"名詞","m":"再生"},{"w":"met with","p":"熟語","m":"〜で迎えられた"},{"w":"put up with","p":"熟語","m":"〜に耐える"},{"w":"potholes","p":"名詞","m":"路面の穴"}]},{"id":847,"category":"文法模試セット11","question":"For preventive maintenance of your car, visit one of our ______ dealers at least once every six months.","A":"authority","B":"authorize","C":"authorized","D":"authorization","answer":"C","answer_word":"authorized","explanation":"■ 文の骨格\nFor preventive maintenance of your car, visit one of our ______ dealers at least once every six months.\n\n■ 空所に入るもの\n所有格 our と名詞 dealers の間にあり、受け身の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) authority … 名詞「権限、当局」 ×\n(B) authorize … 動詞（原形）「認可する」 ×\n(C) authorized … 過去分詞・形容詞「正規の、認可された」 ○\n(D) authorization … 名詞「認可」 ×\n\n■ 完成文\nFor preventive maintenance of your car, visit one of our authorized dealers at least once every six months.\n（お車の予防整備のため、少なくとも半年に一度は当社の正規販売店をご利用ください。）\n\n■ 解き方のポイント\nauthorized dealer＝「正規販売店」。名詞の前で受け身なら過去分詞。","words":[{"w":"preventive maintenance","p":"名詞","m":"予防整備"},{"w":"authorized","p":"形容詞","m":"正規の"},{"w":"dealers","p":"名詞","m":"販売店"},{"w":"at least","p":"熟語","m":"少なくとも"}]},{"id":848,"category":"文法模試セット11","question":"Before signing an agreement, ______ lease terms, especially in regard to the fees required.","A":"examines","B":"examine","C":"examined","D":"examining","answer":"B","answer_word":"examine","explanation":"■ 文の骨格\nBefore signing an agreement, ______ lease terms, especially in regard to the fees required.\n\n■ 空所に入るもの\n主語がなく、コンマの後ろから始まる命令文なので動詞は原形。\n→ 空所には「命令文の動詞（原形）」が必要です。\n\n■ 選択肢の確認\n(A) examines … 動詞（三人称単数現在形）「調べる」 ×\n(B) examine … 動詞（原形）「調べる」 ○\n(C) examined … 動詞の過去形・過去分詞「調べられた」 ×\n(D) examining … 現在分詞・動名詞「調べること」 ×\n\n■ 完成文\nBefore signing an agreement, examine lease terms, especially in regard to the fees required.\n（契約書に署名する前に、特に必要となる費用について賃貸条件を確認してください。）\n\n■ 解き方のポイント\n主語のない文は命令文。動詞は原形で始める。","words":[{"w":"signing","p":"動名詞","m":"署名すること"},{"w":"examine","p":"動詞","m":"調べる"},{"w":"lease terms","p":"名詞","m":"賃貸条件"},{"w":"in regard to","p":"熟語","m":"〜に関して"}]},{"id":849,"category":"文法模試セット11","question":"The Wellington Bus Service operates between City Airport and Central Train Station ______ two hours during the day, seven days a week.","A":"many","B":"every","C":"few","D":"both","answer":"B","answer_word":"every","explanation":"■ 文の骨格\nThe Wellington Bus Service operates between City Airport and Central Train Station ______ two hours during the day, seven days a week.\n\n■ 空所に入るもの\n〈every＋数詞＋複数名詞〉で「〜ごとに」という周期を表す。\n→ 空所には「周期を表す形容詞」が必要です。\n\n■ 選択肢の確認\n(A) many … 形容詞「多くの」 ×\n(B) every … 形容詞「〜ごとに」 ○\n(C) few … 形容詞「ほとんど〜ない」 ×\n(D) both … 形容詞「両方の」 ×\n\n■ 完成文\nThe Wellington Bus Service operates between City Airport and Central Train Station every two hours during the day, seven days a week.\n（Wellington バスは、週7日、日中は2時間ごとに City 空港と中央駅の間を運行している。）\n\n■ 解き方のポイント\nevery two hours＝「2時間ごとに」。every＋数詞＋複数名詞は例外的な形。","words":[{"w":"operates","p":"動詞","m":"運行する"},{"w":"every","p":"形容詞","m":"〜ごとに"},{"w":"during the day","p":"熟語","m":"日中は"}]},{"id":850,"category":"文法模試セット11","question":"Summerville town officials are currently developing a plan to reduce the ______ number of cars using Route 15.","A":"increase","B":"increases","C":"increasing","D":"increasingly","answer":"C","answer_word":"increasing","explanation":"■ 文の骨格\nSummerville town officials are currently developing a plan to reduce the ______ number of cars using Route 15.\n\n■ 空所に入るもの\nthe と名詞 number の間にあり、「増えつつある」と能動の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) increase … 名詞／動詞「増加／増える」 ×\n(B) increases … 動詞（三人称単数現在形）「増える」 ×\n(C) increasing … 現在分詞・形容詞「増えつつある」 ○\n(D) increasingly … 副詞「ますます」 ×\n\n■ 完成文\nSummerville town officials are currently developing a plan to reduce the increasing number of cars using Route 15.\n（Summerville の町当局は現在、15号線を利用する車の増加台数を減らす計画を立てている。）\n\n■ 解き方のポイント\nthe increasing number of X＝「増加するXの数」。名詞の前は形容詞相当語。","words":[{"w":"town officials","p":"名詞","m":"町当局"},{"w":"currently","p":"副詞","m":"現在"},{"w":"increasing","p":"形容詞","m":"増えつつある"},{"w":"Route","p":"名詞","m":"街道、道路"}]},{"id":851,"category":"文法模試セット11","question":"To enter the building you must swipe your employee card through the reader firmly, but not so firmly ______ damage the machine.","A":"so that","B":"as to","C":"if only","D":"in case","answer":"B","answer_word":"as to","explanation":"■ 文の骨格\nTo enter the building you must swipe your employee card through the reader firmly, but not so firmly ______ damage the machine.\n\n■ 空所に入るもの\nso ... as to do（〜するほど…）の形になる。\n→ 空所には「so と呼応して結果を表す語句」が必要です。\n\n■ 選択肢の確認\n(A) so that … 接続詞（群）「〜するために」 ×\n(B) as to … 群不定詞の一部「〜するほど」 ○\n(C) if only … 接続詞（群）「〜でありさえすれば」 ×\n(D) in case … 接続詞（群）「〜の場合に備えて」 ×\n\n■ 完成文\nTo enter the building you must swipe your employee card through the reader firmly, but not so firmly as to damage the machine.\n（建物に入るには社員証を読み取り機にしっかり通す必要があるが、機械を壊すほど強くしてはいけない。）\n\n■ 解き方のポイント\nso＋副詞＋as to do＝「〜するほど…」。so that との違いに注意。","words":[{"w":"swipe","p":"動詞","m":"（カードを）通す"},{"w":"reader","p":"名詞","m":"読み取り機"},{"w":"firmly","p":"副詞","m":"しっかりと"},{"w":"as to","p":"熟語","m":"〜するほど"}]},{"id":852,"category":"文法模試セット11","question":"Fresh Mart ______ the help of its suppliers to cut down on packaging and its impact on the environment.","A":"was enlisted","B":"enlisting","C":"is enlisting","D":"has been enlisted","answer":"C","answer_word":"is enlisting","explanation":"■ 文の骨格\nFresh Mart ______ the help of its suppliers to cut down on packaging and its impact on the environment.\n\n■ 空所に入るもの\n直後に目的語 the help があるので能動態が必要。主語は単数。\n→ 空所には「能動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) was enlisted … 受動態（過去）「要請された」 ×\n(B) enlisting … 現在分詞・動名詞「要請すること」 ×\n(C) is enlisting … 現在進行形（能動）「要請している」 ○\n(D) has been enlisted … 現在完了受動態「要請されてきた」 ×\n\n■ 完成文\nFresh Mart is enlisting the help of its suppliers to cut down on packaging and its impact on the environment.\n（Fresh Mart 社は、包装とその環境負荷を減らすため、仕入先の協力を求めている。）\n\n■ 解き方のポイント\n直後に目的語があれば能動態。文には述語動詞が必要。","words":[{"w":"is enlisting","p":"現在進行形","m":"要請している"},{"w":"suppliers","p":"名詞","m":"仕入先"},{"w":"cut down on","p":"熟語","m":"〜を減らす"},{"w":"packaging","p":"名詞","m":"包装"}]},{"id":853,"category":"文法模試セット11","question":"Tenants are usually required to inform their landlords at least 30 days in ______ if they wish to move out.","A":"advance","B":"advanced","C":"advancement","D":"advancing","answer":"A","answer_word":"advance","explanation":"■ 文の骨格\nTenants are usually required to inform their landlords at least 30 days in ______ if they wish to move out.\n\n■ 空所に入るもの\nin advance（前もって）という定型表現になる。\n→ 空所には「前置詞 in の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) advance … 名詞「前もって」 ○\n(B) advanced … 過去分詞・形容詞「高度な」 ×\n(C) advancement … 名詞「進歩、昇進」 ×\n(D) advancing … 現在分詞・動名詞「進むこと」 ×\n\n■ 完成文\nTenants are usually required to inform their landlords at least 30 days in advance if they wish to move out.\n（借主は通常、退去を希望する場合、少なくとも30日前までに大家に知らせることが求められる。）\n\n■ 解き方のポイント\nin advance＝「前もって」。前置詞＋名詞の定型。","words":[{"w":"Tenants","p":"名詞","m":"借主"},{"w":"landlords","p":"名詞","m":"大家"},{"w":"in advance","p":"熟語","m":"前もって"},{"w":"move out","p":"熟語","m":"退去する"}]},{"id":854,"category":"文法模試セット11","question":"Wave Instruments is now under ______ to produce watches that can display apps and notify wearers of incoming messages from social media.","A":"pressure","B":"burden","C":"weight","D":"rule","answer":"A","answer_word":"pressure","explanation":"■ 文の骨格\nWave Instruments is now under ______ to produce watches that can display apps and notify wearers of incoming messages from social media.\n\n■ 空所に入るもの\nunder pressure（圧力を受けて）という定型表現になる。\n→ 空所には「under と結びつく名詞」が必要です。\n\n■ 選択肢の確認\n(A) pressure … 名詞「圧力」 ○\n(B) burden … 名詞「負担」 ×\n(C) weight … 名詞「重さ」 ×\n(D) rule … 名詞「規則」 ×\n\n■ 完成文\nWave Instruments is now under pressure to produce watches that can display apps and notify wearers of incoming messages from social media.\n（Wave Instruments 社は現在、アプリを表示し SNS の着信を装着者に知らせる時計の製造を求める圧力にさらされている。）\n\n■ 解き方のポイント\nunder pressure to do＝「〜するよう圧力を受けて」。前置詞＋名詞は丸ごと覚える。","words":[{"w":"under pressure","p":"熟語","m":"圧力を受けて"},{"w":"produce","p":"動詞","m":"製造する"},{"w":"notify","p":"動詞","m":"知らせる"},{"w":"wearers","p":"名詞","m":"装着者"}]},{"id":855,"category":"文法模試セット11","question":"Despite ______ requests from wholesalers and retailers, Orange Appliance has yet to develop a new refrigerator.","A":"numerous","B":"numerously","C":"numbering","D":"numbered","answer":"A","answer_word":"numerous","explanation":"■ 文の骨格\nDespite ______ requests from wholesalers and retailers, Orange Appliance has yet to develop a new refrigerator.\n\n■ 空所に入るもの\n前置詞 Despite の目的語 requests を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) numerous … 形容詞「多数の」 ○\n(B) numerously … 副詞「数多く」 ×\n(C) numbering … 現在分詞・動名詞「番号を振ること」 ×\n(D) numbered … 動詞の過去形・過去分詞「番号を振られた」 ×\n\n■ 完成文\nDespite numerous requests from wholesalers and retailers, Orange Appliance has yet to develop a new refrigerator.\n（卸売業者や小売業者から多数の要望があるにもかかわらず、Orange Appliance 社はまだ新しい冷蔵庫を開発していない。）\n\n■ 解き方のポイント\n名詞の直前は形容詞。-ous は形容詞の目印。","words":[{"w":"Despite","p":"前置詞","m":"〜にもかかわらず"},{"w":"numerous","p":"形容詞","m":"多数の"},{"w":"wholesalers","p":"名詞","m":"卸売業者"},{"w":"has yet to","p":"熟語","m":"まだ〜していない"}]},{"id":856,"category":"文法模試セット11","question":"Dr. Mitchell has shown compassion for ______ patients over the past thirty years.","A":"she","B":"her","C":"hers","D":"herself","answer":"B","answer_word":"her","explanation":"■ 文の骨格\nDr. Mitchell has shown compassion for ______ patients over the past thirty years.\n\n■ 空所に入るもの\n空所の後ろに名詞 patients があるので、所有格が必要。\n→ 空所には「名詞を修飾する所有格」が必要です。\n\n■ 選択肢の確認\n(A) she … 主格の代名詞「彼女は」 ×\n(B) her … 所有格「彼女の」 ○\n(C) hers … 所有代名詞「彼女のもの」 ×\n(D) herself … 再帰代名詞「彼女自身」 ×\n\n■ 完成文\nDr. Mitchell has shown compassion for her patients over the past thirty years.\n（Mitchell 医師は、過去30年にわたり自身の患者に思いやりを示してきた。）\n\n■ 解き方のポイント\n〈空所＋名詞〉は所有格。所有代名詞 hers は名詞を伴えない。","words":[{"w":"compassion","p":"名詞","m":"思いやり"},{"w":"her","p":"所有格","m":"彼女の"},{"w":"patients","p":"名詞","m":"患者"}]},{"id":857,"category":"文法模試セット11","question":"Hoffman Corporation's annual meeting ______ shareholders will be held on Wednesday, December 22 at 1:00 P.M.","A":"into","B":"for","C":"from","D":"throughout","answer":"B","answer_word":"for","explanation":"■ 文の骨格\nHoffman Corporation's annual meeting ______ shareholders will be held on Wednesday, December 22 at 1:00 P.M.\n\n■ 空所に入るもの\n会議の対象者を示す前置詞が文意に合う。\n→ 空所には「対象を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) into … 前置詞「〜の中へ」 ×\n(B) for … 前置詞「〜のための」 ○\n(C) fro
