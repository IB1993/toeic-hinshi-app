fter the holidays.","A":"compete","B":"competitive","C":"competitively","D":"competition","answer":"B","answer_word":"competitive","explanation":"■ 文の骨格\nIn December, toy stores usually receive lots of shipments and prices remain ______ until after the holidays.\n\n■ 空所に入るもの\nremain は S+V+C の形をとる動詞で、空所は主語 prices を説明する補語。\n→ 空所には「remain の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) compete … 動詞（原形）「競争する」 ×\n(B) competitive … 形容詞「競争力のある、手ごろな」 ○\n(C) competitively … 副詞「競争力をもって」 ×\n(D) competition … 名詞「競争」 ×\n\n■ 完成文\nIn December, toy stores usually receive lots of shipments and prices remain competitive until after the holidays.\n（12月はおもちゃ店に大量の入荷があり、価格は休暇シーズンが終わるまで手ごろなままだ。）\n\n■ 解き方のポイント\nremain / stay / become の後ろは補語＝形容詞。","words":[{"w":"shipments","p":"名詞","m":"入荷、出荷品"},{"w":"prices","p":"名詞","m":"価格"},{"w":"remain","p":"動詞","m":"〜のままである"},{"w":"competitive","p":"形容詞","m":"競争力のある"}]},{"id":142,"category":"品詞問題・実戦問題 応用編","question":"Because of its cool climate, the eastern region of Hokkaido is ______ for dairy farming.","A":"ideal","B":"idea","C":"ideally","D":"idealistic","answer":"A","answer_word":"ideal","explanation":"■ 文の骨格\nBecause of its cool climate, the eastern region of Hokkaido is ______ for dairy farming.\n\n■ 空所に入るもの\nis の補語が欠けており、for と結びついて意味が通る形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) ideal … 形容詞「理想的な」 ○\n(B) idea … 名詞「考え」 ×\n(C) ideally … 副詞「理想的に」 ×\n(D) idealistic … 形容詞「理想主義的な」 ×\n\n■ 完成文\nBecause of its cool climate, the eastern region of Hokkaido is ideal for dairy farming.\n（涼しい気候のため、北海道東部は酪農に理想的だ。）\n\n■ 解き方のポイント\nbe ideal for X＝「Xに理想的だ」。be動詞の補語は形容詞。","words":[{"w":"climate","p":"名詞","m":"気候"},{"w":"eastern region","p":"名詞","m":"東部地域"},{"w":"ideal","p":"形容詞","m":"理想的な"},{"w":"dairy farming","p":"名詞","m":"酪農"}]},{"id":143,"category":"品詞問題・実戦問題 応用編","question":"Seth Greene agreed to undertake the ______ task of redesigning the mining equipment.","A":"challenge","B":"challenges","C":"challenged","D":"challenging","answer":"D","answer_word":"challenging","explanation":"■ 文の骨格\nSeth Greene agreed to undertake the ______ task of redesigning the mining equipment.\n\n■ 空所に入るもの\nthe と名詞 task の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する現在分詞（形容詞的用法）」が必要です。\n\n■ 選択肢の確認\n(A) challenge … 名詞／動詞「課題／異議を唱える」 ×\n(B) challenges … 名詞（複数形）「課題」 ×\n(C) challenged … 過去分詞「異議を唱えられた」 ×\n(D) challenging … 形容詞（現在分詞由来）「やりがいのある」 ○\n\n■ 完成文\nSeth Greene agreed to undertake the challenging task of redesigning the mining equipment.\n（Seth Greene は、採掘機器を設計し直すというやりがいのある仕事を引き受けることに同意した。）\n\n■ 解き方のポイント\nchallenging＝「やりがいのある、骨の折れる」。名詞の前の空所は形容詞相当語。","words":[{"w":"undertake","p":"動詞","m":"引き受ける"},{"w":"challenging","p":"形容詞","m":"やりがいのある"},{"w":"task","p":"名詞","m":"仕事、課題"},{"w":"redesigning","p":"動名詞","m":"設計し直すこと"},{"w":"mining equipment","p":"名詞","m":"採掘機器"}]},{"id":144,"category":"品詞問題・実戦問題 応用編","question":"Mr. Song was recently awarded a prestigious research grant, which should come as no surprise to anyone ______ with his work.","A":"familiar","B":"familiarize","C":"familiarizing","D":"familiarity","answer":"A","answer_word":"familiar","explanation":"■ 文の骨格\nMr. Song was recently awarded a prestigious research grant, which should come as no surprise to anyone ______ with his work.\n\n■ 空所に入るもの\n代名詞 anyone を後ろから修飾し、with と結びつく形容詞が必要。\n→ 空所には「anyone を後ろから修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) familiar … 形容詞「精通した」 ○\n(B) familiarize … 動詞（原形）「慣れさせる」 ×\n(C) familiarizing … 現在分詞・動名詞「慣れさせること」 ×\n(D) familiarity … 名詞「精通、なじみ」 ×\n\n■ 完成文\nMr. Song was recently awarded a prestigious research grant, which should come as no surprise to anyone familiar with his work.\n（Song さんは最近、名誉ある研究助成金を授与されたが、彼の仕事を知る人にとっては驚くにあたらない。）\n\n■ 解き方のポイント\n-thing / -one で終わる代名詞は形容詞が後ろから修飾する。be familiar with X の形も手がかり。","words":[{"w":"awarded","p":"動詞（過去分詞）","m":"授与された"},{"w":"prestigious","p":"形容詞","m":"名誉ある"},{"w":"research grant","p":"名詞","m":"研究助成金"},{"w":"familiar","p":"形容詞","m":"精通した"}]},{"id":145,"category":"品詞問題・実戦問題 応用編","question":"A week has been set aside in February for new and current staff to undergo employee ______.","A":"train","B":"trainer","C":"trainable","D":"training","answer":"D","answer_word":"training","explanation":"■ 文の骨格\nA week has been set aside in February for new and current staff to undergo employee ______.\n\n■ 空所に入るもの\n他動詞 undergo の目的語で、employee と複合名詞をつくる語が必要。\n→ 空所には「undergo の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) train … 動詞（原形）「訓練する」 ×\n(B) trainer … 名詞「訓練する人、指導員」 ×\n(C) trainable … 形容詞「訓練できる」 ×\n(D) training … 名詞（不可算）「研修、訓練」 ○\n\n■ 完成文\nA week has been set aside in February for new and current staff to undergo employee training.\n（新入社員と現従業員が社員研修を受けるため、2月に1週間が確保されている。）\n\n■ 解き方のポイント\nemployee training（社員研修）は複合名詞。人を表す trainer とは意味が違う。","words":[{"w":"set aside","p":"熟語","m":"確保された"},{"w":"current","p":"形容詞","m":"現在の"},{"w":"undergo","p":"動詞","m":"受ける"},{"w":"training","p":"名詞","m":"研修"}]},{"id":146,"category":"品詞問題・実戦問題 応用編","question":"Members of the finance ______ have been in deliberations since 10 A.M., discussing the proposed budget cuts.","A":"committed","B":"committing","C":"commitment","D":"committee","answer":"D","answer_word":"committee","explanation":"■ 文の骨格\nMembers of the finance ______ have been in deliberations since 10 A.M., discussing the proposed budget cuts.\n\n■ 空所に入るもの\nMembers of the finance ______ が主語で、finance に続く名詞が必要。\n→ 空所には「finance と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) committed … 動詞の過去形・過去分詞「委ねた、専念した」 ×\n(B) committing … 現在分詞・動名詞「委ねること」 ×\n(C) commitment … 名詞「責任、献身」 ×\n(D) committee … 名詞「委員会」 ○\n\n■ 完成文\nMembers of the finance committee have been in deliberations since 10 A.M., discussing the proposed budget cuts.\n（財務委員会の委員は午前10時から審議に入り、提案された予算削減について話し合っている。）\n\n■ 解き方のポイント\nfinance committee（財務委員会）は複合名詞。commitment（献身）との混同に注意。","words":[{"w":"finance committee","p":"名詞","m":"財務委員会"},{"w":"deliberations","p":"名詞","m":"審議"},{"w":"proposed","p":"形容詞","m":"提案された"},{"w":"budget cuts","p":"名詞","m":"予算削減"}]},{"id":147,"category":"品詞問題・実戦問題 応用編","question":"Fujiyama Restaurant offers a variety of dishes made from fresh seasonal and ______ grown vegetables.","A":"local","B":"locally","C":"locality","D":"localize","answer":"B","answer_word":"locally","explanation":"■ 文の骨格\nFujiyama Restaurant offers a variety of dishes made from fresh seasonal and ______ grown vegetables.\n\n■ 空所に入るもの\ngrown vegetables（栽培された野菜）の分詞を修飾する位置。\n→ 空所には「過去分詞 grown を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) local … 形容詞「地元の」 ×\n(B) locally … 副詞「地元で」 ○\n(C) locality … 名詞「地域、地方」 ×\n(D) localize … 動詞（原形）「現地化する」 ×\n\n■ 完成文\nFujiyama Restaurant offers a variety of dishes made from fresh seasonal and locally grown vegetables.\n（Fujiyama レストランは、新鮮な旬の地元産野菜から作られる多彩な料理を提供している。）\n\n■ 解き方のポイント\n〈空所＋過去分詞＋名詞〉は副詞。locally grown（地元産の）は頻出表現。","words":[{"w":"a variety of","p":"熟語","m":"多彩な"},{"w":"dishes","p":"名詞","m":"料理"},{"w":"seasonal","p":"形容詞","m":"旬の"},{"w":"locally","p":"副詞","m":"地元で"},{"w":"grown","p":"過去分詞","m":"栽培された"}]},{"id":148,"category":"品詞問題・実戦問題 応用編","question":"The tables at the banquet were prepared in a style that was ______ yet elegant.","A":"simple","B":"simply","C":"simplify","D":"simplification","answer":"A","answer_word":"simple","explanation":"■ 文の骨格\nThe tables at the banquet were prepared in a style that was ______ yet elegant.\n\n■ 空所に入るもの\nyet（しかし）の後ろが形容詞 elegant なので、前も同じ形容詞が必要。\n→ 空所には「was の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) simple … 形容詞「簡素な」 ○\n(B) simply … 副詞「単に、簡素に」 ×\n(C) simplify … 動詞（原形）「簡素にする」 ×\n(D) simplification … 名詞「簡素化」 ×\n\n■ 完成文\nThe tables at the banquet were prepared in a style that was simple yet elegant.\n（宴会のテーブルは、簡素でありながら上品な様式で整えられていた。）\n\n■ 解き方のポイント\nyet は「しかし」を表す接続詞で、前後には同じ品詞が並ぶ。","words":[{"w":"banquet","p":"名詞","m":"宴会"},{"w":"prepared","p":"動詞（過去分詞）","m":"整えられた"},{"w":"simple","p":"形容詞","m":"簡素な"},{"w":"yet","p":"接続詞","m":"しかし"},{"w":"elegant","p":"形容詞","m":"上品な"}]},{"id":149,"category":"品詞問題・実戦問題 応用編","question":"Conference organizers made arrangements for all ______ guests to be presented with an information package.","A":"arrive","B":"arrives","C":"arrival","D":"arriving","answer":"D","answer_word":"arriving","explanation":"■ 文の骨格\nConference organizers made arrangements for all ______ guests to be presented with an information package.\n\n■ 空所に入るもの\nall と名詞 guests の間にあり、guests を能動の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) arrive … 動詞（原形）「到着する」 ×\n(B) arrives … 動詞（三人称単数現在形）「到着する」 ×\n(C) arrival … 名詞「到着」 ×\n(D) arriving … 現在分詞「到着する」 ○\n\n■ 完成文\nConference organizers made arrangements for all arriving guests to be presented with an information package.\n（会議の主催者は、到着するすべての来場者に資料一式が渡されるよう手配した。）\n\n■ 解き方のポイント\nguests が「到着する」側なので能動＝現在分詞。受け身なら過去分詞。","words":[{"w":"organizers","p":"名詞","m":"主催者"},{"w":"made arrangements","p":"熟語","m":"手配した"},{"w":"arriving","p":"現在分詞","m":"到着する"},{"w":"information package","p":"名詞","m":"資料一式"}]},{"id":150,"category":"品詞問題・実戦問題 応用編","question":"The number of orders for the month of May was estimated extremely ______, resulting in a substantial reduction in waste.","A":"accurate","B":"accurately","C":"accuracy","D":"accuracies","answer":"B","answer_word":"accurately","explanation":"■ 文の骨格\nThe number of orders for the month of May was estimated extremely ______, resulting in a substantial reduction in waste.\n\n■ 空所に入るもの\n受動態 was estimated がすでに成立しており、空所は修飾語の位置。\n→ 空所には「過去分詞 estimated を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) accurate … 形容詞「正確な」 ×\n(B) accurately … 副詞「正確に」 ○\n(C) accuracy … 名詞「正確さ」 ×\n(D) accuracies … 名詞（複数形）「正確さ」 ×\n\n■ 完成文\nThe number of orders for the month of May was estimated extremely accurately, resulting in a substantial reduction in waste.\n（5月の受注数は極めて正確に見積もられ、その結果、無駄が大幅に削減された。）\n\n■ 解き方のポイント\n副詞 extremely に続く位置なので、修飾される語も副詞。","words":[{"w":"orders","p":"名詞","m":"注文"},{"w":"estimated","p":"動詞（過去分詞）","m":"見積もられた"},{"w":"accurately","p":"副詞","m":"正確に"},{"w":"substantial","p":"形容詞","m":"大幅な"},{"w":"reduction","p":"名詞","m":"削減"}]},{"id":151,"category":"品詞問題・実戦問題 応用編","question":"The store display attracted a lot of attention from customers with its ______ colored packages and entertaining animated mannequins.","A":"brighten","B":"brightly","C":"brightened","D":"brightness","answer":"B","answer_word":"brightly","explanation":"■ 文の骨格\nThe store display attracted a lot of attention from customers with its ______ colored packages and entertaining animated mannequins.\n\n■ 空所に入るもの\ncolored packages という名詞のかたまりの前で、分詞を修飾する位置。\n→ 空所には「過去分詞 colored を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) brighten … 動詞（原形）「明るくする」 ×\n(B) brightly … 副詞「明るく」 ○\n(C) brightened … 動詞の過去形・過去分詞「明るくされた」 ×\n(D) brightness … 名詞「明るさ」 ×\n\n■ 完成文\nThe store display attracted a lot of attention from customers with its brightly colored packages and entertaining animated mannequins.\n（その店の陳列は、明るい色のパッケージと動く楽しいマネキンで、客の関心を大いに集めた。）\n\n■ 解き方のポイント\n〈空所＋過去分詞＋名詞〉は副詞。brightly colored（鮮やかな色の）は頻出。","words":[{"w":"display","p":"名詞","m":"陳列"},{"w":"attracted","p":"動詞（過去形）","m":"引き付けた"},{"w":"brightly","p":"副詞","m":"明るく"},{"w":"colored","p":"過去分詞","m":"色づけされた"},{"w":"mannequins","p":"名詞","m":"マネキン"}]},{"id":152,"category":"品詞問題・実戦問題 応用編","question":"As one of the fastest ______ distributors in the country, Falcon Supply Inc. is known for its commitment to quality.","A":"grow","B":"grew","C":"growing","D":"growth","answer":"C","answer_word":"growing","explanation":"■ 文の骨格\nAs one of the fastest ______ distributors in the country, Falcon Supply Inc. is known for its commitment to quality.\n\n■ 空所に入るもの\nthe fastest と名詞 distributors の間にあり、能動の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) grow … 動詞（原形）「成長する」 ×\n(B) grew … 動詞（過去形）「成長した」 ×\n(C) growing … 現在分詞「成長している」 ○\n(D) growth … 名詞「成長」 ×\n\n■ 完成文\nAs one of the fastest growing distributors in the country, Falcon Supply Inc. is known for its commitment to quality.\n（国内で最も急成長している卸売業者の1つとして、Falcon Supply 社は品質へのこだわりで知られている。）\n\n■ 解き方のポイント\nfastest growing（最も急成長している）は定型。distributors が成長する側なので現在分詞。","words":[{"w":"fastest","p":"最上級","m":"最も速い"},{"w":"growing","p":"現在分詞","m":"成長している"},{"w":"distributors","p":"名詞","m":"卸売業者"},{"w":"commitment","p":"名詞","m":"こだわり、献身"}]},{"id":153,"category":"品詞問題・実戦問題 応用編","question":"Crown Corporation has been the leading ______ of innovative fabrics for over 25 years.","A":"produce","B":"produced","C":"production","D":"producer","answer":"D","answer_word":"producer","explanation":"■ 文の骨格\nCrown Corporation has been the leading ______ of innovative fabrics for over 25 years.\n\n■ 空所に入るもの\nthe leading の後ろで、主語 Crown Corporation とイコールになる「人・組織」を表す名詞が必要。\n→ 空所には「be動詞の補語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) produce … 動詞（原形）／名詞「生産する／農産物」 ×\n(B) produced … 動詞の過去形・過去分詞「生産された」 ×\n(C) production … 名詞「生産（活動）」 ×\n(D) producer … 名詞「生産者、メーカー」 ○\n\n■ 完成文\nCrown Corporation has been the leading producer of innovative fabrics for over 25 years.\n（Crown 社は25年以上にわたり、革新的な生地の主要メーカーであり続けている。）\n\n■ 解き方のポイント\n主語が会社なので、補語も「人・組織」を表す名詞。production（生産活動）では意味が合わない。","words":[{"w":"leading","p":"形容詞","m":"主要な"},{"w":"producer","p":"名詞","m":"生産者、メーカー"},{"w":"innovative","p":"形容詞","m":"革新的な"},{"w":"fabrics","p":"名詞","m":"生地"}]},{"id":154,"category":"品詞問題・実戦問題 応用編","question":"If all single rooms are already booked, guests will be offered a double room for single use at a ______ higher rate.","A":"correspond","B":"corresponding","C":"correspondingly","D":"correspondence","answer":"C","answer_word":"correspondingly","explanation":"■ 文の骨格\nIf all single rooms are already booked, guests will be offered a double room for single use at a ______ higher rate.\n\n■ 空所に入るもの\n冠詞 a と形容詞 higher の間にあり、形容詞を修飾する位置。\n→ 空所には「形容詞（比較級）を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) correspond … 動詞（原形）「一致する」 ×\n(B) corresponding … 現在分詞・形容詞「対応する」 ×\n(C) correspondingly … 副詞「それに応じて」 ○\n(D) correspondence … 名詞「文通、通信」 ×\n\n■ 完成文\nIf all single rooms are already booked, guests will be offered a double room for single use at a correspondingly higher rate.\n（シングルルームがすべて予約済みの場合、お客様にはそれに応じて高い料金でダブルルームのシングル利用をご案内します。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋形容詞＋名詞〉は副詞の位置。","words":[{"w":"booked","p":"動詞（過去分詞）","m":"予約された"},{"w":"offered","p":"動詞（過去分詞）","m":"提供される"},{"w":"correspondingly","p":"副詞","m":"それに応じて"},{"w":"rate","p":"名詞","m":"料金"}]},{"id":155,"category":"品詞問題・実戦問題 応用編","question":"Dylan Clarke has been promoted to the position of marketing manager because he organized a national campaign ______.","A":"commend","B":"commendable","C":"commendably","D":"commended","answer":"C","answer_word":"commendably","explanation":"■ 文の骨格\nDylan Clarke has been promoted to the position of marketing manager because he organized a national campaign ______.\n\n■ 空所に入るもの\norganized a national campaign で SVO が完成しており、文末の空所は修飾語。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) commend … 動詞（原形）「称賛する」 ×\n(B) commendable … 形容詞「称賛に値する」 ×\n(C) commendably … 副詞「見事に、称賛に値するほど」 ○\n(D) commended … 動詞の過去形・過去分詞「称賛された」 ×\n\n■ 完成文\nDylan Clarke has been promoted to the position of marketing manager because he organized a national campaign commendably.\n（Dylan Clarke は全国キャンペーンを見事に取りまとめたため、マーケティング部長に昇進した。）\n\n■ 解き方のポイント\nSVO が完成した文末の空所は副詞。","words":[{"w":"promoted","p":"動詞（過去分詞）","m":"昇進した"},{"w":"position","p":"名詞","m":"職、ポスト"},{"w":"organized","p":"動詞（過去形）","m":"取りまとめた"},{"w":"commendably","p":"副詞","m":"見事に"}]},{"id":156,"category":"品詞問題・実戦問題 応用編","question":"Although construction has already been approved, the city is still looking for an ______ to coordinate the project.","A":"architect","B":"architecture","C":"architectural","D":"architecturally","answer":"A","answer_word":"architect","explanation":"■ 文の骨格\nAlthough construction has already been approved, the city is still looking for an ______ to coordinate the project.\n\n■ 空所に入るもの\n冠詞 an の後ろで、to coordinate（計画をまとめる）主体となる人を表す名詞が必要。\n→ 空所には「前置詞 for の目的語になる名詞（人）」が必要です。\n\n■ 選択肢の確認\n(A) architect … 名詞（人）「建築家」 ○\n(B) architecture … 名詞「建築（学）、建築様式」 ×\n(C) architectural … 形容詞「建築の」 ×\n(D) architecturally … 副詞「建築的に」 ×\n\n■ 完成文\nAlthough construction has already been approved, the city is still looking for an architect to coordinate the project.\n（工事はすでに承認されているが、市は計画をまとめる建築家をいまだ探している。）\n\n■ 解き方のポイント\n「人」か「もの・概念」かで名詞を選び分ける。ここは行為の主体なので人。","words":[{"w":"Although","p":"接続詞","m":"〜だけれども"},{"w":"approved","p":"動詞（過去分詞）","m":"承認された"},{"w":"architect","p":"名詞","m":"建築家"},{"w":"coordinate","p":"動詞","m":"取りまとめる"}]},{"id":157,"category":"品詞問題・実戦問題 応用編","question":"Since his appointment as CEO, Nathan Lee has been running the company much ______ than his predecessor.","A":"efficient","B":"efficiently","C":"more efficient","D":"more efficiently","answer":"D","answer_word":"more efficiently","explanation":"■ 文の骨格\nSince his appointment as CEO, Nathan Lee has been running the company much ______ than his predecessor.\n\n■ 空所に入るもの\nrunning the company で SVO が完成しており、than を伴う比較級の副詞が必要。\n→ 空所には「動詞を修飾する副詞（比較級）」が必要です。\n\n■ 選択肢の確認\n(A) efficient … 形容詞「効率的な」 ×\n(B) efficiently … 副詞「効率的に」 ×\n(C) more efficient … 形容詞（比較級）「より効率的な」 ×\n(D) more efficiently … 副詞（比較級）「より効率的に」 ○\n\n■ 完成文\nSince his appointment as CEO, Nathan Lee has been running the company much more efficiently than his predecessor.\n（CEO 就任以来、Nathan Lee は前任者よりはるかに効率的に会社を経営している。）\n\n■ 解き方のポイント\nthan があるので比較級。SVO が完成しているので副詞。much は比較級を強める語。","words":[{"w":"appointment","p":"名詞","m":"任命、就任"},{"w":"running","p":"現在分詞","m":"経営している"},{"w":"more efficiently","p":"副詞（比較級）","m":"より効率的に"},{"w":"predecessor","p":"名詞","m":"前任者"}]},{"id":158,"category":"品詞問題・実戦問題 応用編","question":"The Independent School Association has welcomed some of the ______ lecturers, authors, and performing artists in California.","A":"more prominent","B":"most prominent","C":"more prominently","D":"most prominently","answer":"B","answer_word":"most prominent","explanation":"■ 文の骨格\nThe Independent School Association has welcomed some of the ______ lecturers, authors, and performing artists in California.\n\n■ 空所に入るもの\nsome of the の後ろで、lecturers などの名詞を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞（最上級）」が必要です。\n\n■ 選択肢の確認\n(A) more prominent … 形容詞（比較級）「より著名な」 ×\n(B) most prominent … 形容詞（最上級）「最も著名な」 ○\n(C) more prominently … 副詞（比較級）「より目立って」 ×\n(D) most prominently … 副詞（最上級）「最も目立って」 ×\n\n■ 完成文\nThe Independent School Association has welcomed some of the most prominent lecturers, authors, and performing artists in California.\n（Independent School 協会は、カリフォルニアで最も著名な講師・著述家・実演芸術家の何人かを迎えている。）\n\n■ 解き方のポイント\nsome of the ＿＿＋名詞 の形は「最も〜な…のいくつか」。the があるので最上級。","words":[{"w":"Association","p":"名詞","m":"協会"},{"w":"welcomed","p":"動詞（過去分詞）","m":"迎えた"},{"w":"most prominent","p":"形容詞（最上級）","m":"最も著名な"},{"w":"lecturers","p":"名詞","m":"講師"},{"w":"performing artists","p":"名詞","m":"実演芸術家"}]},{"id":159,"category":"品詞問題・実戦問題 応用編","question":"The City University offers masters programs in civil engineering, construction, project ______, and information technology.","A":"manage","B":"managed","C":"manageable","D":"management","answer":"D","answer_word":"management","explanation":"■ 文の骨格\nThe City University offers masters programs in civil engineering, construction, project ______, and information technology.\n\n■ 空所に入るもの\ncivil engineering, construction などの名詞と並列になる名詞が必要。\n→ 空所には「project と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) manage … 動詞（原形）「管理する」 ×\n(B) managed … 動詞の過去形・過去分詞「管理された」 ×\n(C) manageable … 形容詞「扱いやすい」 ×\n(D) management … 名詞「管理」 ○\n\n■ 完成文\nThe City University offers masters programs in civil engineering, construction, project management, and information technology.\n（City 大学は、土木工学・建設・プロジェクト管理・情報技術の修士課程を提供している。）\n\n■ 解き方のポイント\n並列された名詞の一員なので名詞。project management は複合名詞。","words":[{"w":"masters programs","p":"名詞","m":"修士課程"},{"w":"civil engineering","p":"名詞","m":"土木工学"},{"w":"project management","p":"名詞","m":"プロジェクト管理"},{"w":"information technology","p":"名詞","m":"情報技術"}]},{"id":160,"category":"品詞問題・実戦問題 応用編","question":"Some contractors use special ______ tools to help pinpoint the source of common home problems.","A":"diagnose","B":"diagnosed","C":"diagnostic","D":"diagnostically","answer":"C","answer_word":"diagnostic","explanation":"■ 文の骨格\nSome contractors use special ______ tools to help pinpoint the source of common home problems.\n\n■ 空所に入るもの\n形容詞 special と名詞 tools の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) diagnose … 動詞（原形）「診断する」 ×\n(B) diagnosed … 動詞の過去形・過去分詞「診断された」 ×\n(C) diagnostic … 形容詞「診断用の」 ○\n(D) diagnostically … 副詞「診断的に」 ×\n\n■ 完成文\nSome contractors use special diagnostic tools to help pinpoint the source of common home problems.\n（一部の業者は、住宅によくある問題の原因を特定するため、特別な診断用機器を使う。）\n\n■ 解き方のポイント\n名詞の直前の空所は形容詞。-ic も形容詞の語尾。","words":[{"w":"contractors","p":"名詞","m":"業者、請負人"},{"w":"diagnostic","p":"形容詞","m":"診断用の"},{"w":"tools","p":"名詞","m":"機器、道具"},{"w":"pinpoint","p":"動詞","m":"特定する"},{"w":"source","p":"名詞","m":"原因、源"}]},{"id":161,"category":"品詞問題・実戦問題 応用編","question":"The policy that late fees are charged for books returned after the due date is stated quite ______ in the agreement.","A":"clear","B":"clearly","C":"clarity","D":"clearer","answer":"B","answer_word":"clearly","explanation":"■ 文の骨格\nThe policy that late fees are charged for books returned after the due date is stated quite ______ in the agreement.\n\n■ 空所に入るもの\n受動態 is stated がすでに成立しており、副詞 quite に続く修飾語の位置。\n→ 空所には「過去分詞 stated を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) clear … 形容詞「明確な」 ×\n(B) clearly … 副詞「明確に」 ○\n(C) clarity … 名詞「明確さ」 ×\n(D) clearer … 形容詞（比較級）「より明確な」 ×\n\n■ 完成文\nThe policy that late fees are charged for books returned after the due date is stated quite clearly in the agreement.\n（返却期限を過ぎた本には延滞料がかかるという規定は、契約書にきわめて明確に記されている。）\n\n■ 解き方のポイント\n副詞 quite に続く位置なので副詞。受動態の後ろも副詞の定位置。","words":[{"w":"policy","p":"名詞","m":"規定、方針"},{"w":"late fees","p":"名詞","m":"延滞料"},{"w":"due date","p":"名詞","m":"返却期限"},{"w":"stated","p":"動詞（過去分詞）","m":"記されている"},{"w":"clearly","p":"副詞","m":"明確に"}]},{"id":162,"category":"品詞問題・実戦問題 応用編","question":"Tullox Shoes are constructed in South East Asia according to the ______ standards for durability and comfort.","A":"strictly","B":"more strictly","C":"strictest","D":"strictness","answer":"C","answer_word":"strictest","explanation":"■ 文の骨格\nTullox Shoes are constructed in South East Asia according to the ______ standards for durability and comfort.\n\n■ 空所に入るもの\nthe と名詞 standards の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞（最上級）」が必要です。\n\n■ 選択肢の確認\n(A) strictly … 副詞「厳しく」 ×\n(B) more strictly … 副詞（比較級）「より厳しく」 ×\n(C) strictest … 形容詞（最上級）「最も厳しい」 ○\n(D) strictness … 名詞「厳しさ」 ×\n\n■ 完成文\nTullox Shoes are constructed in South East Asia according to the strictest standards for durability and comfort.\n（Tullox Shoes は、耐久性と快適性について最も厳しい基準に沿って東南アジアで製造されている。）\n\n■ 解き方のポイント\n〈the＋空所＋名詞〉は形容詞。the があるので最上級が入る。","words":[{"w":"constructed","p":"動詞（過去分詞）","m":"製造される"},{"w":"according to","p":"熟語","m":"〜に沿って"},{"w":"strictest","p":"形容詞（最上級）","m":"最も厳しい"},{"w":"durability","p":"名詞","m":"耐久性"}]},{"id":163,"category":"品詞問題・実戦問題 応用編","question":"The highly anticipated second album of William Roy is ______ from the first but no less remarkable.","A":"distinct","B":"distinguish","C":"distinction","D":"distinctly","answer":"A","answer_word":"distinct","explanation":"■ 文の骨格\nThe highly anticipated second album of William Roy is ______ from the first but no less remarkable.\n\n■ 空所に入るもの\nis の補語が欠けており、from と結びついて意味が通る形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) distinct … 形容詞「異なる、明確に違う」 ○\n(B) distinguish … 動詞（原形）「区別する」 ×\n(C) distinction … 名詞「区別」 ×\n(D) distinctly … 副詞「はっきりと」 ×\n\n■ 完成文\nThe highly anticipated second album of William Roy is distinct from the first but no less remarkable.\n（待望の William Roy の2枚目のアルバムは1枚目とは異なるが、劣らず見事な出来だ。）\n\n■ 解き方のポイント\nbe distinct from X＝「Xとは異なる」。be動詞の補語は形容詞。","words":[{"w":"highly anticipated","p":"形容詞句","m":"待望の"},{"w":"distinct","p":"形容詞","m":"異なる"},{"w":"no less","p":"熟語","m":"劣らず"},{"w":"remarkable","p":"形容詞","m":"見事な"}]},{"id":164,"category":"品詞問題・実戦問題 応用編","question":"The mission of the university store is to provide a wide range of ______ priced merchandise to students and faculty members.","A":"compete","B":"competitive","C":"competitively","D":"competition","answer":"C","answer_word":"competitively","explanation":"■ 文の骨格\nThe mission of the university store is to provide a wide range of ______ priced merchandise to students and faculty members.\n\n■ 空所に入るもの\npriced merchandise という名詞のかたまりの前で、分詞を修飾する位置。\n→ 空所には「過去分詞 priced を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) compete … 動詞（原形）「競争する」 ×\n(B) competitive … 形容詞「競争力のある」 ×\n(C) competitively … 副詞「手ごろな価格で」 ○\n(D) competition … 名詞「競争」 ×\n\n■ 完成文\nThe mission of the university store is to provide a wide range of competitively priced merchandise to students and faculty members.\n（大学生協の使命は、学生と教職員に手ごろな価格の商品を幅広く提供することだ。）\n\n■ 解き方のポイント\ncompetitively priced＝「手ごろな価格の」。〈空所＋過去分詞＋名詞〉は副詞。","words":[{"w":"mission","p":"名詞","m":"使命"},{"w":"a wide range of","p":"熟語","m":"幅広い"},{"w":"competitively","p":"副詞","m":"手ごろな価格で"},{"w":"priced","p":"過去分詞","m":"値付けされた"},{"w":"faculty members","p":"名詞","m":"教職員"}]},{"id":165,"category":"品詞問題・実戦問題 応用編","question":"Easy to handle, light, maneuverable, and powerful, the lawnmower is perfectly ______ to small lawns of up to 2,000 square feet.","A":"suit","B":"suited","C":"suiting","D":"suits","answer":"B","answer_word":"suited","explanation":"■ 文の骨格\nEasy to handle, light, maneuverable, and powerful, the lawnmower is perfectly ______ to small lawns of up to 2,000 square feet.\n\n■ 空所に入るもの\nis の後ろで、to と結びついて受動の意味をつくる語が必要。\n→ 空所には「be動詞と結びつく過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) suit … 動詞（原形）／名詞「合う／スーツ」 ×\n(B) suited … 過去分詞「適している」 ○\n(C) suiting … 現在分詞・動名詞「合わせること」 ×\n(D) suits … 動詞（三人称単数現在形）「合う」 ×\n\n■ 完成文\nEasy to handle, light, maneuverable, and powerful, the lawnmower is perfectly suited to small lawns of up to 2,000 square feet.\n（扱いやすく、軽く、取り回しがよく、パワーもあるこの芝刈り機は、2,000平方フィートまでの小さな芝生にぴったりだ。）\n\n■ 解き方のポイント\nbe suited to X＝「Xに適している」。受動の形で覚える。","words":[{"w":"handle","p":"動詞","m":"扱う"},{"w":"maneuverable","p":"形容詞","m":"取り回しのよい"},{"w":"lawnmower","p":"名詞","m":"芝刈り機"},{"w":"suited","p":"過去分詞","m":"適している"},{"w":"lawns","p":"名詞","m":"芝生"}]},{"id":166,"category":"品詞問題・実戦問題 応用編","question":"Japanese cuisine has received a lot of attention in the last 10 years, and ______ has gained popularity all over the world.","A":"consequent","B":"consequently","C":"consequence","D":"consequences","answer":"B","answer_word":"consequently","explanation":"■ 文の骨格\nJapanese cuisine has received a lot of attention in the last 10 years, and ______ has gained popularity all over the world.\n\n■ 空所に入るもの\nand の後ろに主語が省略された節が続き、述語動詞 has gained を修飾する副詞が必要。\n→ 空所には「文をつなぐ副詞」が必要です。\n\n■ 選択肢の確認\n(A) consequent … 形容詞「結果として生じる」 ×\n(B) consequently … 副詞「その結果」 ○\n(C) consequence … 名詞（単数形）「結果」 ×\n(D) consequences … 名詞（複数形）「結果」 ×\n\n■ 完成文\nJapanese cuisine has received a lot of attention in the last 10 years, and consequently has gained popularity all over the world.\n（日本料理はこの10年で大きな注目を集め、その結果、世界中で人気を得ている。）\n\n■ 解き方のポイント\n前文を受けて「その結果」とつなぐのは副詞 consequently。","words":[{"w":"cuisine","p":"名詞","m":"料理"},{"w":"attention","p":"名詞","m":"注目"},{"w":"consequently","p":"副詞","m":"その結果"},{"w":"gained","p":"動詞（過去分詞）","m":"得た"},{"w":"popularity","p":"名詞","m":"人気"}]},{"id":167,"category":"品詞問題・実戦問題 応用編","question":"Should you require ______ with your selection of tools, please talk to one of our experienced advisors.","A":"assist","B":"assisted","C":"assistance","D":"assists","answer":"C","answer_word":"assistance","explanation":"■ 文の骨格\nShould you require ______ with your selection of tools, please talk to one of our experienced advisors.\n\n■ 空所に入るもの\n他動詞 require の目的語が欠けている。冠詞がないので不可算名詞。\n→ 空所には「require の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) assist … 動詞（原形）「支援する」 ×\n(B) assisted … 動詞の過去形・過去分詞「支援された」 ×\n(C) assistance … 名詞（不可算）「支援、援助」 ○\n(D) assists … 動詞（三人称単数現在形）「支援する」 ×\n\n■ 完成文\nShould you require assistance with your selection of tools, please talk to one of our experienced advisors.\n（工具のお選びにあたりお手伝いが必要でしたら、経験豊富なアドバイザーにお声がけください。）\n\n■ 解き方のポイント\nassistance with X＝「Xに関する支援」。文頭 Should you ... は if you should ... の倒置。","words":[{"w":"require","p":"動詞","m":"必要とする"},{"w":"assistance","p":"名詞","m":"支援"},{"w":"selection","p":"名詞","m":"選択"},{"w":"experienced","p":"形容詞","m":"経験豊富な"},{"w":"advisors","p":"名詞","m":"アドバイザー"}]},{"id":168,"category":"品詞問題・実戦問題 応用編","question":"Not only does the new sedan have an ______ design, but it also offers its passengers more luggage room.","A":"appeal","B":"appealed","C":"appealing","D":"appealingly","answer":"C","answer_word":"appealing","explanation":"■ 文の骨格\nNot only does the new sedan have an ______ design, but it also offers its passengers more luggage room.\n\n■ 空所に入るもの\n冠詞 an と名詞 design の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) appeal … 名詞／動詞「魅力／訴える」 ×\n(B) appealed … 動詞の過去形・過去分詞「訴えられた」 ×\n(C) appealing … 形容詞（現在分詞由来）「魅力的な」 ○\n(D) appealingly … 副詞「魅力的に」 ×\n\n■ 完成文\nNot only does the new sedan have an appealing design, but it also offers its passengers more luggage room.\n（その新型セダンは魅力的なデザインであるだけでなく、乗客により広い荷室も提供する。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。文頭 Not only ... は倒置を伴う。","words":[{"w":"sedan","p":"名詞","m":"セダン（乗用車）"},{"w":"appealing","p":"形容詞","m":"魅力的な"},{"w":"design","p":"名詞","m":"デザイン"},{"w":"passengers","p":"名詞","m":"乗客"},{"w":"luggage room","p":"名詞","m":"荷室"}]},{"id":169,"category":"品詞問題・実戦問題 応用編","question":"______ scheduling vacation leave of one full week or more must obtain permission from their supervisors in advance.","A":"Employs","B":"Employed","C":"Employment","D":"Employees","answer":"D","answer_word":"Employees","explanation":"■ 文の骨格\n______ scheduling vacation leave of one full week or more must obtain permission from their supervisors in advance.\n\n■ 空所に入るもの\n文頭の空所が主語で、述語動詞 must obtain と their に対応する「人」を表す複数名詞が必要。\n→ 空所には「文の主語になる複数名詞（人）」が必要です。\n\n■ 選択肢の確認\n(A) Employs … 動詞（三人称単数現在形）「雇う」 ×\n(B) Employed … 動詞の過去形・過去分詞「雇われた」 ×\n(C) Employment … 名詞（不可算）「雇用」 ×\n(D) Employees … 名詞（複数形・人）「従業員」 ○\n\n■ 完成文\nEmployees scheduling vacation leave of one full week or more must obtain permission from their supervisors in advance.\n（まる1週間以上の休暇を予定している従業員は、事前に上司の許可を得なければならない。）\n\n■ 解き方のポイント\ntheir supervisors の their が「人の複数名詞」を要求している。","words":[{"w":"Employees","p":"名詞","m":"従業員"},{"w":"scheduling","p":"現在分詞","m":"予定している"},{"w":"vacation leave","p":"名詞","m":"休暇"},{"w":"obtain","p":"動詞","m":"得る"},{"w":"permission","p":"名詞","m":"許可"}]},{"id":170,"category":"品詞問題・実戦問題 応用編","question":"New ______ are eligible for a 30 day free trial period and will receive one free song download upon signing up.","A":"subscribe","B":"subscriptions","C":"subscribed","D":"subscribers","answer":"D","answer_word":"subscribers","explanation":"■ 文の骨格\nNew ______ are eligible for a 30 day free trial period and will receive one free song download upon signing up.\n\n■ 空所に入るもの\n述語動詞 are と will receive の主語で、「無料体験を受ける人」を表す名詞が必要。\n→ 空所には「文の主語になる複数名詞（人）」が必要です。\n\n■ 選択肢の確認\n(A) subscribe … 動詞（原形）「定期購読する」 ×\n(B) subscriptions … 名詞（複数形・もの）「定期購読」 ×\n(C) subscribed … 動詞の過去形・過去分詞「購読した」 ×\n(D) subscribers … 名詞（複数形・人）「購読者、加入者」 ○\n\n■ 完成文\nNew subscribers are eligible for a 30 day free trial period and will receive one free song download upon signing up.\n（新規加入者は30日間の無料体験期間の対象となり、登録時に楽曲を1曲無料でダウンロードできる。）\n\n■ 解き方のポイント\n「人」か「もの・行為」かで名詞を選び分ける。receive するのは人。","words":[{"w":"subscribers","p":"名詞","m":"加入者"},{"w":"eligible for","p":"熟語","m":"〜の資格がある"},{"w":"free trial period","p":"名詞","m":"無料体験期間"},{"w":"signing up","p":"動名詞","m":"登録すること"}]},{"id":171,"category":"品詞問題・実戦問題 応用編","question":"Rubber ______ are working hard to fill orders from the automobile industry which is expecting to sell record numbers of vehicles this year.","A":"produce","B":"produces","C":"productions","D":"producers","answer":"D","answer_word":"producers","explanation":"■ 文の骨格\nRubber ______ are working hard to fill orders from the automobile industry which is expecting to sell record numbers of vehicles this year.\n\n■ 空所に入るもの\n述語動詞 are working の主語で、Rubber と結びつき「働く主体」を表す名詞が必要。\n→ 空所には「文の主語になる複数名詞（人・企業）」が必要です。\n\n■ 選択肢の確認\n(A) produce … 動詞（原形）／名詞「生産する／農産物」 ×\n(B) produces … 動詞（三人称単数現在形）「生産する」 ×\n(C) productions … 名詞（複数形）「生産（活動）」 ×\n(D) producers … 名詞（複数形・人）「生産者、メーカー」 ○\n\n■ 完成文\nRubber producers are working hard to fill orders from the automobile industry which is expecting to sell record numbers of vehicles this year.\n（ゴムメーカーは、今年過去最多の車両販売を見込む自動車業界からの注文に応えるため懸命に働いている。）\n\n■ 解き方のポイント\nwork（働く）の主語になれるのは人・組織を表す名詞。","words":[{"w":"producers","p":"名詞","m":"生産者、メーカー"},{"w":"fill orders","p":"熟語","m":"注文に応じる"},{"w":"automobile industry","p":"名詞","m":"自動車業界"},{"w":"vehicles","p":"名詞","m":"車両"}]},{"id":172,"category":"品詞問題・実戦問題 応用編","question":"Fast & Falls is a Dallas-based interior design firm, known for ______ service and a sophisticated style.","A":"personalized","B":"personalize","C":"personalizes","D":"personalizing","answer":"A","answer_word":"personalized","explanation":"■ 文の骨格\nFast & Falls is a Dallas-based interior design firm, known for ______ service and a sophisticated style.\n\n■ 空所に入るもの\n前置詞 for の目的語 service を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞（過去分詞由来）」が必要です。\n\n■ 選択肢の確認\n(A) personalized … 形容詞（過去分詞由来）「個別対応の」 ○\n(B) personalize … 動詞（原形）「個人向けにする」 ×\n(C) personalizes … 動詞（三人称単数現在形）「個人向けにする」 ×\n(D) personalizing … 現在分詞・動名詞「個人向けにすること」 ×\n\n■ 完成文\nFast & Falls is a Dallas-based interior design firm, known for personalized service and a sophisticated style.\n（Fast & Falls は、きめ細かい個別対応のサービスと洗練されたスタイルで知られるダラス拠点のインテリアデザイン会社だ。）\n\n■ 解き方のポイント\n名詞の直前で受け身の意味なら過去分詞。personalized service は頻出表現。","words":[{"w":"Dallas-based","p":"形容詞","m":"ダラス拠点の"},{"w":"firm","p":"名詞","m":"会社"},{"w":"personalized","p":"形容詞","m":"個別対応の"},{"w":"sophisticated","p":"形容詞","m":"洗練された"}]},{"id":173,"category":"品詞問題・実戦問題 応用編","question":"This ______ should only be taken as directed by a qualified physician.","A":"medication","B":"medically","C":"medicated","D":"medications","answer":"A","answer_word":"medication","explanation":"■ 文の骨格\nThis ______ should only be taken as directed by a qualified physician.\n\n■ 空所に入るもの\nThis の後ろで、述語動詞 should be taken の主語となる単数名詞が必要。\n→ 空所には「文の主語になる単数名詞」が必要です。\n\n■ 選択肢の確認\n(A) medication … 名詞（単数形）「薬、薬物治療」 ○\n(B) medically … 副詞「医学的に」 ×\n(C) medicated … 動詞の過去形・過去分詞「投薬された」 ×\n(D) medications … 名詞（複数形）「薬」 ×\n\n■ 完成文\nThis medication should only be taken as directed by a qualified physician.\n（この薬は、有資格の医師の指示どおりにのみ服用してください。）\n\n■ 解き方のポイント\nThis は単数を指すので、続く名詞も単数形。","words":[{"w":"medication","p":"名詞","m":"薬"},{"w":"taken","p":"動詞（過去分詞）","m":"服用される"},{"w":"as directed","p":"熟語","m":"指示どおりに"},{"w":"qualified physician","p":"名詞","m":"有資格の医師"}]},{"id":174,"category":"品詞問題・実戦問題 応用編","question":"The jewelry box is covered in a thin layer of hand-stitched black leather stretched ______ around the frame.","A":"tightening","B":"tightly","C":"tighten","D":"tightness","answer":"B","answer_word":"tightly","explanation":"■ 文の骨格\nThe jewelry box is covered in a thin layer of hand-stitched black leather stretched ______ around the frame.\n\n■ 空所に入るもの\nstretched（張られた）を修飾する位置で、文の要素はすでにそろっている。\n→ 空所には「過去分詞 stretched を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) tightening … 現在分詞・動名詞「締めていること」 ×\n(B) tightly … 副詞「ぴんと、しっかりと」 ○\n(C) tighten … 動詞（原形）「締める」 ×\n(D) tightness … 名詞「きつさ」 ×\n\n■ 完成文\nThe jewelry box is covered in a thin layer of hand-stitched black leather stretched tightly around the frame.\n（その宝石箱は、手縫いの黒い革の薄い層で覆われ、枠の周りにぴんと張られている。）\n\n■ 解き方のポイント\n分詞の直後の空所は副詞。","words":[{"w":"jewelry box","p":"名詞","m":"宝石箱"},{"w":"layer","p":"名詞","m":"層"},{"w":"leather","p":"名詞","m":"革"},{"w":"stretched","p":"過去分詞","m":"張られた"},{"w":"tightly","p":"副詞","m":"ぴんと"}]},{"id":175,"category":"品詞問題・実戦問題 応用編","question":"Fun Toys is pleased to announce two shipments of the popular game will arrive this month, the first of which should come ______.","A":"shortly","B":"shorten","C":"short","D":"shortness","answer":"A","answer_word":"shortly","explanation":"■ 文の骨格\nFun Toys is pleased to announce two shipments of the popular game will arrive this month, the first of which should come ______.\n\n■ 空所に入るもの\n自動詞 come の直後で、動詞を修飾する位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) shortly … 副詞「まもなく」 ○\n(B) shorten … 動詞（原形）「短くする」 ×\n(C) short … 形容詞／副詞「短い／不足して」 ×\n(D) shortness … 名詞「短さ」 ×\n\n■ 完成文\nFun Toys is pleased to announce two shipments of the popular game will arrive this month, the first of which should come shortly.\n（Fun Toys は、人気ゲームの入荷が今月2回あり、1回目はまもなく到着することをお知らせします。）\n\n■ 解き方のポイント\nshortly＝soon（まもなく）。short（短い）と意味が違う点が狙われる。","words":[{"w":"shipments","p":"名詞","m":"入荷、出荷"},{"w":"arrive","p":"動詞","m":"到着する"},{"w":"shortly","p":"副詞","m":"まもなく"}]},{"id":176,"category":"品詞問題・実戦問題 応用編","question":"Ms. Watanabe's new coffee tumbler, which cost over 30 dollars, is stylish as well as ______.","A":"function","B":"functioned","C":"functional","D":"functionally","answer":"C","answer_word":"functional","explanation":"■ 文の骨格\nMs. Watanabe's new coffee tumbler, which cost over 30 dollars, is stylish as well as ______.\n\n■ 空所に入るもの\nas well as の前が形容詞 stylish なので、後ろも同じ形容詞が必要。\n→ 空所には「stylish と並列になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) function … 名詞／動詞「機能／機能する」 ×\n(B) functioned … 動詞の過去形・過去分詞「機能した」 ×\n(C) functional … 形容詞「機能的な、実用的な」 ○\n(D) functionally … 副詞「機能的に」 ×\n\n■ 完成文\nMs. Watanabe's new coffee tumbler, which cost over 30 dollars, is stylish as well as functional.\n（30ドル超した Watanabe さんの新しいコーヒータンブラーは、おしゃれなうえに実用的だ。）\n\n■ 解き方のポイント\nas well as の前後は同じ品詞。","words":[{"w":"tumbler","p":"名詞","m":"タンブラー"},{"w":"cost","p":"動詞（過去形）","m":"（費用が）かかった"},{"w":"stylish","p":"形容詞","m":"おしゃれな"},{"w":"functional","p":"形容詞","m":"機能的な"}]},{"id":177,"category":"品詞問題・実戦問題 応用編","question":"When placing an order during holiday seasons, please note that it will take ______ five to seven days for the delivery.","A":"approximate","B":"approximately","C":"approximation","D":"approximates","answer":"B","answer_word":"approximately","explanation":"■ 文の骨格\nWhen placing an order during holiday seasons, please note that it will take ______ five to seven days for the delivery.\n\n■ 空所に入るもの\ntake の目的語は five to seven days で、空所はその数量表現を修飾する位置。\n→ 空所には「数詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) approximate … 形容詞／動詞「おおよその／近づく」 ×\n(B) approximately … 副詞「およそ」 ○\n(C) approximation … 名詞「概算」 ×\n(D) approximates … 動詞（三人称単数現在形）「近づく」 ×\n\n■ 完成文\nWhen placing an order during holiday seasons, please note that it will take approximately five to seven days for the delivery.\n（繁忙期にご注文の際は、配送におよそ5〜7日かかりますことをご了承ください。）\n\n■ 解き方のポイント\n数量表現の前は副詞（approximately / about / nearly など）。","words":[{"w":"placing an order","p":"熟語","m":"注文すること"},{"w":"note","p":"動詞","m":"留意する"},{"w":"approximately","p":"副詞","m":"およそ"},{"w":"delivery","p":"名詞","m":"配送"}]},{"id":178,"category":"品詞問題・実戦問題 応用編","question":"Justin Moore's ______ jazz album from Spark Records combines modern rhythms with traditional elements.","A":"newer","B":"newly","C":"newest","D":"newness","answer":"C","answer_word":"newest","explanation":"■ 文の骨格\nJustin Moore's ______ jazz album from Spark Records combines modern rhythms with traditional elements.\n\n■ 空所に入るもの\n所有格 Justin Moore's と名詞 jazz album の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞（最上級）」が必要です。\n\n■ 選択肢の確認\n(A) newer … 形容詞（比較級）「より新しい」 ×\n(B) newly … 副詞「新しく」 ×\n(C) newest … 形容詞（最上級）「最新の」 ○\n(D) newness … 名詞「新しさ」 ×\n\n■ 完成文\nJustin Moore's newest jazz album from Spark Records combines modern rhythms with traditional elements.\n（Spark Records から出た Justin Moore の最新ジャズアルバムは、現代的なリズムと伝統的な要素を融合させている。）\n\n■ 解き方のポイント\n所有格は the の働きをするので最上級が使える。文意から「最新の」が自然。","words":[{"w":"newest","p":"形容詞（最上級）","m":"最新の"},{"w":"combines","p":"動詞","m":"融合させる"},{"w":"rhythms","p":"名詞","m":"リズム"},{"w":"elements","p":"名詞","m":"要素"}]},{"id":179,"category":"品詞問題・実戦問題 応用編","question":"The Darren Theater opened on Oct. 5, 1987, ______ eight years before Ms. Gonzalez was hired.","A":"precise","B":"precision","C":"precisely","D":"preciseness","answer":"C","answer_word":"precisely","explanation":"■ 文の骨格\nThe Darren Theater opened on Oct. 5, 1987, ______ eight years before Ms. Gonzalez was hired.\n\n■ 空所に入るもの\neight years という期間表現を修飾する位置。\n→ 空所には「数量表現を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) precise … 形容詞「正確な」 ×\n(B) precision … 名詞「正確さ」 ×\n(C) precisely … 副詞「ちょうど、正確に」 ○\n(D) preciseness … 名詞「正確さ」 ×\n\n■ 完成文\nThe Darren Theater opened on Oct. 5, 1987, precisely eight years before Ms. Gonzalez was hired.\n（Darren 劇場は1987年10月5日、Gonzalez さんが採用されるちょうど8年前に開場した。）\n\n■ 解き方のポイント\n数量・期間表現の直前は副詞。","words":[{"w":"Theater","p":"名詞","m":"劇場"},{"w":"opened","p":"動詞（過去形）","m":"開場した"},{"w":"precisely","p":"副詞","m":"ちょうど"},{"w":"hired","p":"動詞（過去分詞）","m":"採用された"}]},{"id":180,"category":"品詞問題・実戦問題 応用編","question":"Mr. McConnell studied Japanese business culture and practices ______ before transferring to the Sendai branch.","A":"exhaustive","B":"exhaustion","C":"exhausting","D":"exhaustively","answer":"D","answer_word":"exhaustively","explanation":"■ 文の骨格\nMr. McConnell studied Japanese business culture and practices ______ before transferring to the Sendai branch.\n\n■ 空所に入るもの\nstudied ... practices で SVO が完成しており、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) exhaustive … 形容詞「徹底的な」 ×\n(B) exhaustion … 名詞「疲労困憊」 ×\n(C) exhausting … 現在分詞・形容詞「疲れさせる」 ×\n(D) exhaustively … 副詞「徹底的に」 ○\n\n■ 完成文\nMr. McConnell studied Japanese business culture and practices exhaustively before transferring to the Sendai branch.\n（McConnell さんは仙台支店へ異動する前に、日本のビジネス文化と慣行を徹底的に学んだ。）\n\n■ 解き方のポイント\nSVO が完成した後の空所は副詞。","words":[{"w":"practices","p":"名詞","m":"慣行"},{"w":"exhaustively","p":"副詞","m":"徹底的に"},{"w":"transferring","p":"動名詞","m":"異動すること"},{"w":"branch","p":"名詞","m":"支店"}]},{"id":181,"category":"品詞問題・実戦問題 応用編","question":"Located near the Dallas Convention Center, Hotel Camel is the perfect choice for convention ______ who want accommodations close to the venue.","A":"attendance","B":"attendees","C":"attend","D":"attended","answer":"B","answer_word":"attendees","explanation":"■ 文の骨格\nLocated near the Dallas Convention Center, Hotel Camel is the perfect choice for convention ______ who want accommodations close to the venue.\n\n■ 空所に入るもの\n関係代名詞 who が続くので、先行詞は「人」を表す名詞でなければならない。\n→ 空所には「convention と複合名詞をつくる複数名詞（人）」が必要です。\n\n■ 選択肢の確認\n(A) attendance … 名詞（不可算）「出席（すること）」 ×\n(B) attendees … 名詞（複数形・人）「参加者」 ○\n(C) attend … 動詞（原形）「出席する」 ×\n(D) attended … 動詞の過去形・過去分詞「出席した」 ×\n\n■ 完成文\nLocated near the Dallas Convention Center, Hotel Camel is the perfect choice for convention attendees who want accommodations close to the venue.\n（ダラスコンベンションセンターの近くにある Hotel Camel は、会場に近い宿を求める会議参加者に最適な選択だ。）\n\n■ 解き方のポイント\n直後の who が「人」を要求する強い手がかり。attendance（出席）は人ではない。","words":[{"w":"Convention Center","p":"名詞","m":"コンベンションセンター"},{"w":"attendees","p":"名詞","m":"参加者"},{"w":"accommodations","p":"名詞","m":"宿泊施設"},{"w":"venue","p":"名詞","m":"会場"}]},{"id":182,"category":"品詞問題・実戦問題 応用編","question":"Mr. Larsen's name, which appeared in the original movie, was mistakenly removed from the ______ version.","A":"edit","B":"edited","C":"editing","D":"edits","answer":"B","answer_word":"edited","explanation":"■ 文の骨格\nMr. Larsen's name, which appeared in the original movie, was mistakenly removed from the ______ version.\n\n■ 空所に入るもの\nthe と名詞 version の間にあり、受け身の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) edit … 動詞（原形）「編集する」 ×\n(B) edited … 過去分詞・形容詞「編集された」 ○\n(C) editing … 現在分詞・動名詞「編集すること」 ×\n(D) edits … 動詞（三人称単数現在形）／名詞（複数形）「編集する／編集」 ×\n\n■ 完成文\nMr. Larsen's name, which appeared in the original movie, was mistakenly removed from the edited version.\n（元の映画に出ていた Larsen さんの名前は、編集版から誤って削除された。）\n\n■ 解き方のポイント\nversion は「編集される」側なので過去分詞。","words":[{"w":"appeared","p":"動詞（過去形）","m":"出ていた"},{"w":"mistakenly","p":"副詞","m":"誤って"},{"w":"removed","p":"動詞（過去分詞）","m":"削除された"},{"w":"edited","p":"過去分詞","m":"編集された"}]},{"id":183,"category":"品詞問題・実戦問題 応用編","question":"Only one year after its ______, Denton Publishing was awarded the Prize for Exceptional Creativity at an international competition in Vienna.","A":"found","B":"foundations","C":"founded","D":"foundation","answer":"D","answer_word":"foundation","explanation":"■ 文の骨格\nOnly one year after its ______, Denton Publishing was awarded the Prize for Exceptional Creativity at an international competition in Vienna.\n\n■ 空所に入るもの\n所有格 its の直後で、前置詞 after の目的語となる名詞が必要。\n→ 空所には「所有格 its の後ろに置く名詞」が必要です。\n\n■ 選択肢の確認\n(A) found … 動詞（原形）／過去形「設立する／見つけた」 ×\n(B) foundations … 名詞（複数形）「基盤、財団」 ×\n(C) founded … 動詞の過去形・過去分詞「設立された」 ×\n(D) foundation … 名詞（単数形）「設立」 ○\n\n■ 完成文\nOnly one year after its foundation, Denton Publishing was awarded the Prize for Exceptional Creativity at an international competition in Vienna.\n（Denton Publishing 社は設立からわずか1年で、ウィーンの国際コンクールで卓越創造性賞を受賞した。）\n\n■ 解き方のポイント\n〈所有格＋空所〉は名詞。its なので単数形を選ぶ。","words":[{"w":"foundation","p":"名詞","m":"設立"},{"w":"awarded","p":"動詞（過去分詞）","m":"授与された"},{"w":"Exceptional","p":"形容詞","m":"卓越した"},{"w":"competition","p":"名詞","m":"コンクール"}]},{"id":184,"category":"品詞問題・実戦問題 応用編","question":"Grape Computers is known for running ______ commercials to promote its innovative electronic devices.","A":"imaginative","B":"imagination","C":"imagine","D":"imaginary","answer":"A","answer_word":"imaginative","explanation":"■ 文の骨格\nGrape Computers is known for running ______ commercials to promote its innovative electronic devices.\n\n■ 空所に入るもの\n動名詞 running の目的語 commercials を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) imaginative … 形容詞「想像力豊かな」 ○\n(B) imagination … 名詞「想像力」 ×\n(C) imagine … 動詞（原形）「想像する」 ×\n(D) imaginary … 形容詞「架空の、想像上の」 ×\n\n■ 完成文\nGrape Computers is known for running imaginative commercials to promote its innovative electronic devices.\n（Grape Computers 社は、革新的な電子機器を宣伝する想像力豊かなコマーシャルを流すことで知られている。）\n\n■ 解き方のポイント\nimaginative（想像力豊かな）と imaginary（架空の）の意味の違いが狙われる。","words":[{"w":"running","p":"動名詞","m":"（広告を）流すこと"},{"w":"imaginative","p":"形容詞","m":"想像力豊かな"},{"w":"commercials","p":"名詞","m":"コマーシャル"},{"w":"promote","p":"動詞","m":"宣伝する"},{"w":"devices","p":"名詞","m":"機器"}]},{"id":185,"category":"品詞問題・実戦問題 応用編","question":"Original copies of Pirate Island are ______ rare, with only 18 copies in existence, of which 12 are in private hands.","A":"excessive","B":"exceed","C":"excess","D":"exceedingly","answer":"D","answer_word":"exceedingly","explanation":"■ 文の骨格\nOriginal copies of Pirate Island are ______ rare, with only 18 copies in existence, of which 12 are in private hands.\n\n■ 空所に入るもの\nare の補語として形容詞 rare がすでにあり、空所は修飾語の位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) excessive … 形容詞「過度の」 ×\n(B) exceed … 動詞（原形）「超える」 ×\n(C) excess … 名詞「超過」 ×\n(D) exceedingly … 副詞「極めて」 ○\n\n■ 完成文\nOriginal copies of Pirate Island are exceedingly rare, with only 18 copies in existence, of which 12 are in private hands.\n（『Pirate Island』の初版本は極めて希少で、現存するのは18部のみ、うち12部は個人の所有だ。）\n\n■ 解き方のポイント\n〈be動詞＋空所＋形容詞〉は副詞。","words":[{"w":"Original copies","p":"名詞","m":"初版本"},{"w":"exceedingly","p":"副詞","m":"極めて"},{"w":"rare","p":"形容詞","m":"希少な"},{"w":"in existence","p":"熟語","m":"現存して"},{"w":"private hands","p":"名詞","m":"個人の所有"}]},{"id":186,"category":"品詞問題・実戦問題 応用編","question":"Most users agree that the new smartphone has a ______ better picture and sound quality.","A":"notice","B":"noticeable","C":"noticeably","D":"noticing","answer":"C","answer_word":"noticeably","explanation":"■ 文の骨格\nMost users agree that the new smartphone has a ______ better picture and sound quality.\n\n■ 空所に入るもの\n冠詞 a と比較級 better の間にあり、形容詞を修飾する位置。\n→ 空所には「形容詞（比較級）を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) notice … 名詞／動詞「通知／気づく」 ×\n(B) noticeable … 形容詞「著しい」 ×\n(C) noticeably … 副詞「著しく」 ○\n(D) noticing … 現在分詞・動名詞「気づくこと」 ×\n\n■ 完成文\nMost users agree that the new smartphone has a noticeably better picture and sound quality.\n（大半のユーザーは、その新しいスマートフォンの画質と音質が著しく優れていると認めている。）\n\n■ 解き方のポイント\n比較級を修飾するのは副詞。〈冠詞＋空所＋比較級＋名詞〉の形。","words":[{"w":"users","p":"名詞","m":"ユーザー"},{"w":"noticeably","p":"副詞","m":"著しく"},{"w":"better","p":"比較級","m":"より良い"},{"w":"sound quality","p":"名詞","m":"音質"}]},{"id":187,"category":"品詞問題・実戦問題 応用編","question":"While Fire Art's new video games have already been launched in Asia, they will not be available ______ anytime soon.","A":"globe","B":"global","C":"globally","D":"globalization","answer":"C","answer_word":"globally","explanation":"■ 文の骨格\nWhile Fire Art's new video games have already been launched in Asia, they will not be available ______ anytime soon.\n\n■ 空所に入るもの\nbe の補語として形容詞 available がすでにあり、空所は修飾語の位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) globe … 名詞「地球」 ×\n(B) global … 形容詞「世界的な」 ×\n(C) globally … 副詞「世界的に」 ○\n(D) globalization … 名詞「グローバル化」 ×\n\n■ 完成文\nWhile Fire Art's new video games have already been launched in Asia, they will not be available globally anytime soon.\n（Fire Art 社の新作ゲームはすでにアジアで発売されているが、当面は世界的には入手できない。）\n\n■ 解き方のポイント\n形容詞 available の後ろの空所は副詞。","words":[{"w":"launched","p":"動詞（過去分詞）","m":"発売された"},{"w":"available","p":"形容詞","m":"入手できる"},{"w":"globally","p":"副詞","m":"世界的に"},{"w":"anytime soon","p":"熟語","m":"当面のうちに"}]},{"id":188,"category":"品詞問題・実戦問題 応用編","question":"Presented by Whole Family Foods, the event will feature cooking ______ and activities for kids.","A":"demonstrations","B":"demonstrates","C":"demonstrator","D":"demonstrated","answer":"A","answer_word":"demonstrations","explanation":"■ 文の骨格\nPresented by Whole Family Foods, the event will feature cooking ______ and activities for kids.\n\n■ 空所に入るもの\n他動詞 feature の目的語で、activities と並列になる名詞が必要。\n→ 空所には「cooking と複合名詞をつくる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) demonstrations … 名詞（複数形）「実演」 ○\n(B) demonstrates … 動詞（三人称単数現在形）「実演する」 ×\n(C) demonstrator … 名詞（人）「実演者」 ×\n(D) demonstrated … 動詞の過去形・過去分詞「実演された」 ×\n\n■ 完成文\nPresented by Whole Family Foods, the event will feature cooking demonstrations and activities for kids.\n（Whole Family Foods 提供のこのイベントでは、料理の実演と子ども向けの活動が呼び物となる。）\n\n■ 解き方のポイント\nand の後ろが複数名詞 activities なので、空所も複数名詞。","words":[{"w":"Presented by","p":"熟語","m":"〜提供の"},{"w":"feature","p":"動詞","m":"呼び物にする"},{"w":"demonstrations","p":"名詞","m":"実演"},{"w":"activities","p":"名詞","m":"活動"}]},{"id":189,"category":"品詞問題・実戦問題 応用編","question":"Paul Tanaka, the founder of Wheaton Technology, will come to the Seattle headquarters to participate in ______ and interact with employees.","A":"lecture","B":"lectured","C":"lectures","D":"lecturer","answer":"C","answer_word":"lectures","explanation":"■ 文の骨格\nPaul Tanaka, the founder of Wheaton Technology, will come to the Seattle headquarters to participate in ______ and interact with employees.\n\n■ 空所に入るもの\nparticipate in の後ろで、冠詞がないため複数形の名詞が必要。\n→ 空所には「前置詞 in の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) lecture … 名詞（単数形）「講義」 ×\n(B) lectured … 動詞の過去形・過去分詞「講義した」 ×\n(C) lectures … 名詞（複数形）「講義」 ○\n(D) lecturer … 名詞（人）「講師」 ×\n\n■ 完成文\nPaul Tanaka, the founder of Wheaton Technology, will come to the Seattle headquarters to participate in lectures and interact with employees.\n（Wheaton Technology 社の創業者 Paul Tanaka は、講義に参加し社員と交流するためシアトル本社を訪れる。）\n\n■ 解き方のポイント\n冠詞のない可算名詞は複数形。participate in は自動詞＋前置詞。","words":[{"w":"founder","p":"名詞","m":"創業者"},{"w":"participate in","p":"熟語","m":"〜に参加する"},{"w":"lectures","p":"名詞","m":"講義"},{"w":"interact with","p":"熟語","m":"〜と交流する"}]},{"id":190,"category":"品詞問題・実戦問題 応用編","question":"All staff members of Premium Promotion have extensive experience in ______ or a related field.","A":"advertising","B":"advertiser","C":"advertised","D":"advertises","answer":"A","answer_word":"advertising","explanation":"■ 文の骨格\nAll staff members of Premium Promotion have extensive experience in ______ or a related field.\n\n■ 空所に入るもの\nin の後ろで、a related field と並列になる分野を表す名詞が必要。\n→ 空所には「前置詞 in の目的語になる名詞（不可算）」が必要です。\n\n■ 選択肢の確認\n(A) advertising … 名詞（不可算）「広告業」 ○\n(B) advertiser … 名詞（人）「広告主」 ×\n(C) advertised … 動詞の過去形・過去分詞「宣伝された」 ×\n(D) advertises … 動詞（三人称単数現在形）「宣伝する」 ×\n\n■ 完成文\nAll staff members of Premium Promotion have extensive experience in advertising or a related field.\n（Premium Promotion 社の社員は全員、広告業またはその関連分野で豊富な経験を持っている。）\n\n■ 解き方のポイント\n「分野」を表すのは advertising（広告業）。人を表す advertiser とは違う。","words":[{"w":"extensive","p":"形容詞","m":"豊富な"},{"w":"experience","p":"名詞","m":"経験"},{"w":"advertising","p":"名詞","m":"広告業"},{"w":"related field","p":"名詞","m":"関連分野"}]},{"id":191,"category":"品詞問題・実戦問題 応用編","question":"The award ceremony would not have been possible without ______ from several members, notably Mal Benjamin, who chairs the award committee.","A":"contribute","B":"contributed","C":"contributions","D":"contributor","answer":"C","answer_word":"contributions","explanation":"■ 文の骨格\nThe award ceremony would not have been possible without ______ from several members, notably Mal Benjamin, who chairs the award committee.\n\n■ 空所に入るもの\nwithout の後ろで、from several members を伴う名詞が必要。冠詞がないので複数形。\n→ 空所には「前置詞 without の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) contribute … 動詞（原形）「貢献する」 ×\n(B) contributed … 動詞の過去形・過去分詞「貢献した」 ×\n(C) contributions … 名詞（複数形）「貢献、寄付」 ○\n(D) contributor … 名詞（人・単数形）「貢献者」 ×\n\n■ 完成文\nThe award ceremony would not have been possible without contributions from several members, notably Mal Benjamin, who chairs the award committee.\n（この授賞式は、数名の会員、とりわけ授賞委員会の委員長を務める Mal Benjamin の貢献なしには実現しなかっただろう。）\n\n■ 解き方のポイント\n前置詞の直後は名詞。冠詞がなければ複数形。","words":[{"w":"would not have been","p":"仮定法","m":"〜ではなかっただろう"},{"w":"contributions","p":"名詞","m":"貢献"},{"w":"notably","p":"副詞","m":"とりわけ"},{"w":"chairs","p":"動詞","m":"委員長を務める"}]},{"id":192,"category":"品詞問題・実戦問題 応用編","question":"Since the benefits seemed evident, Mr. Tucker was ______ that his proposal would be accepted by the board of directors.","A":"confident","B":"confidential","C":"confidently","D":"confidence","answer":"A","answer_word":"confident","explanation":"■ 文の骨格\nSince the benefits seemed evident, Mr. Tucker was ______ that his proposal would be accepted by the board of directors.\n\n■ 空所に入るもの\nwas の補語が欠けており、that 節を従える形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) confident … 形容詞「確信して」 ○\n(B) confidential … 形容詞「機密の」 ×\n(C) confidently … 副詞「自信をもって」 ×\n(D) confidence … 名詞「自信」 ×\n\n■ 完成文\nSince the benefits seemed evident, Mr. Tucker was confident that his proposal would be accepted by the board of directors.\n（利点が明白に思えたので、Tucker さんは自分の提案が取締役会で承認されると確信していた。）\n\n■ 解き方のポイント\nbe confident that ... の形。confident（確信して）と confidential（機密の）の混同に注意。","words":[{"w":"benefits","p":"名詞","m":"利点"},{"w":"evident","p":"形容詞","m":"明白な"},{"w":"confident","p":"形容詞","m":"確信して"},{"w":"proposal","p":"名詞","m":"提案"},{"w":"board of directors","p":"名詞","m":"取締役会"}]},{"id":193,"category":"品詞問題・実戦問題 応用編","question":"All requests for personal time off must be submitted for ______ using the appropriate request form.","A":"approve","B":"approved","C":"approval","D":"approvingly","answer":"C","answer_word":"approval","explanation":"■ 文の骨格\nAll requests for personal time off must be submitted for ______ using the appropriate request form.\n\n■ 空所に入るもの\n前置詞 for の後ろは名詞が入る位置。\n→ 空所には「前置詞 for の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) approve … 動詞（原形）「承認する」 ×\n(B) approved … 動詞の過去形・過去分詞「承認された」 ×\n(C) approval … 名詞「承認」 ○\n(D) approvingly … 副詞「賛成して」 ×\n\n■ 完成文\nAll requests for personal time off must be submitted for approval using the appropriate request form.\n（私用休暇の申請はすべて、所定の申請書を使って承認を得るために提出しなければならない。）\n\n■ 解き方のポイント\n前置詞の直後は名詞。-al で終わるが approval は名詞。","words":[{"w":"requests","p":"名詞","m":"申請"},{"w":"time off","p":"名詞","m":"休暇"},{"w":"submitted","p":"動詞（過去分詞）","m":"提出される"},{"w":"approval","p":"名詞","m":"承認"},{"w":"appropriate","p":"形容詞","m":"所定の、適切な"}]},{"id":194,"category":"品詞問題・実戦問題 応用編","question":"The assistant office manager, Ms. Reed, will explain the ______ paper recycling policy at the next weekly meeting.","A":"revise","B":"revised","C":"revising","D":"revision","answer":"B","answer_word":"revised","explanation":"■ 文の骨格\nThe assistant office manager, Ms. Reed, will explain the ______ paper recycling policy at the next weekly meeting.\n\n■ 空所に入るもの\nthe と名詞句 paper recycling policy の間にあり、受け身の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) revise … 動詞（原形）「改訂する」 ×\n(B) revised … 過去分詞・形容詞「改訂された」 ○\n(C) revising … 現在分詞・動名詞「改訂すること」 ×\n(D) revision … 名詞「改訂」 ×\n\n■ 完成文\nThe assistant office manager, Ms. Reed, will explain the revised paper recycling policy at the next weekly meeting.\n（総務課長補佐の Reed さんが、次回の週次会議で改訂された古紙リサイクル方針を説明する。）\n\n■ 解き方のポイント\npolicy は「改訂される」側なので過去分詞。","words":[{"w":"assistant","p":"形容詞","m":"補佐の"},{"w":"explain","p":"動詞","m":"説明する"},{"w":"revised","p":"過去分詞","m":"改訂された"},{"w":"recycling policy","p":"名詞","m":"リサイクル方針"}]},{"id":195,"category":"品詞問題・実戦問題 応用編","question":"Pacific Home Designs has been a reliable ______ of home furnishings for more than 30 years.","A":"manufacture","B":"manufactures","C":"manufacturing","D":"manufacturer","answer":"D","answer_word":"manufacturer","explanation":"■ 文の骨格\nPacific Home Designs has been a reliable ______ of home furnishings for more than 30 years.\n\n■ 空所に入るもの\n主語が会社なので、イコール関係になる「組織」を表す名詞が必要。\n→ 空所には「be動詞の補語になる名詞（人・組織）」が必要です。\n\n■ 選択肢の確認\n(A) manufacture … 動詞（原形）／名詞「製造する／製造」 ×\n(B) manufactures … 動詞（三人称単数現在形）「製造する」 ×\n(C) manufacturing … 名詞「製造業」 ×\n(D) manufacturer … 名詞（人・組織）「製造業者、メーカー」 ○\n\n■ 完成文\nPacific Home Designs has been a reliable manufacturer of home furnishings for more than 30 years.\n（Pacific Home Designs 社は30年以上にわたり、家庭用家具の信頼できるメーカーであり続けている。）\n\n■ 解き方のポイント\n主語＝補語の関係。会社と等しくなるのは「メーカー」。","words":[{"w":"reliable","p":"形容詞","m":"信頼できる"},{"w":"manufacturer","p":"名詞","m":"メーカー"},{"w":"home furnishings","p":"名詞","m":"家庭用家具"}]},{"id":196,"category":"品詞問題・実戦問題 応用編","question":"Mr. Li should be available to meet with the newly hired employees this week as he has no ______ travel plans.","A":"schedule","B":"scheduled","C":"scheduling","D":"scheduler","answer":"B","answer_word":"scheduled","explanation":"■ 文の骨格\nMr. Li should be available to meet with the newly hired employees this week as he has no ______ travel plans.\n\n■ 空所に入るもの\nno と名詞 travel plans の間にあり、受け身の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) schedule … 名詞／動詞「予定／予定する」 ×\n(B) scheduled … 過去分詞・形容詞「予定された」 ○\n(C) scheduling … 現在分詞・動名詞「予定を組むこと」 ×\n(D) scheduler … 名詞（人・もの）「スケジュール管理者」 ×\n\n■ 完成文\nMr. Li should be available to meet with the newly hired employees this week as he has no scheduled travel plans.\n（Li さんは予定された出張がないので、今週は新入社員と面会できるはずだ。）\n\n■ 解き方のポイント\nplans は「予定される」側なので過去分詞。","words":[{"w":"available","p":"形容詞","m":"都合がつく"},{"w":"newly hired","p":"形容詞句","m":"新しく採用された"},{"w":"scheduled","p":"過去分詞","m":"予定された"},{"w":"travel plans","p":"名詞","m":"出張の予定"}]},{"id":197,"category":"品詞問題・実戦問題 応用編","question":"To spread the workload more ______ within the organization, the project team has decided to assign roles to specific individuals.","A":"even","B":"evens","C":"evening","D":"evenly","answer":"D","answer_word":"evenly","explanation":"■ 文の骨格\nTo spread the workload more ______ within the organization, the project team has decided to assign roles to specific individuals.\n\n■ 空所に入るもの\nspread the workload で他動詞＋目的語が完成しており、more とともに比較級をつくる副詞が必要。\n→ 空所には「動詞を修飾する副詞（比較級）」が必要です。\n\n■ 選択肢の確認\n(A) even … 形容詞／副詞「均等な／さらに」 ×\n(B) evens … 動詞（三人称単数現在形）「ならす」 ×\n(C) evening … 名詞「夕方」 ×\n(D) evenly … 副詞「均等に」 ○\n\n■ 完成文\nTo spread the workload more evenly within the organization, the project team has decided to assign roles to specific individuals.\n（組織内で業務量をより均等に配分するため、プロジェクトチームは特定の個人に役割を割り当てることにした。）\n\n■ 解き方のポイント\nSVO の後ろの more ＿＿ は副詞の比較級。","words":[{"w":"spread","p":"動詞","m":"配分する"},{"w":"workload","p":"名詞","m":"業務量"},{"w":"evenly","p":"副詞","m":"均等に"},{"w":"assign","p":"動詞","m":"割り当てる"},{"w":"individuals","p":"名詞","m":"個人"}]},{"id":198,"category":"品詞問題・実戦問題 応用編","question":"______ are nearly complete for the product demonstration at the press conference on Friday next week.","A":"Preparations","B":"Prepare","C":"Prepares","D":"Preparers","answer":"A","answer_word":"Preparations","explanation":"■ 文の骨格\n______ are nearly complete for the product demonstration at the press conference on Friday next week.\n\n■ 空所に入るもの\n文頭が空所で、述語動詞 are に対応する複数形の主語が必要。\n→ 空所には「文の主語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) Preparations … 名詞（複数形）「準備」 ○\n(B) Prepare … 動詞（原形）「準備する」 ×\n(C) Prepares … 動詞（三人称単数現在形）「準備する」 ×\n(D) Preparers … 名詞（人・複数形）「準備する人」 ×\n\n■ 完成文\nPreparations are nearly complete for the product demonstration at the press conference on Friday next week.\n（来週金曜の記者会見での製品実演に向けた準備は、ほぼ整っている。）\n\n■ 解き方のポイント\n述語動詞 are から、主語は複数名詞と分かる。","words":[{"w":"Preparations","p":"名詞","m":"準備"},{"w":"nearly","p":"副詞","m":"ほぼ"},{"w":"complete","p":"形容詞","m":"完了した"},{"w":"demonstration","p":"名詞","m":"実演"},{"w":"press conference","p":"名詞","m":"記者会見"}]},{"id":199,"category":"品詞問題・実戦問題 応用編","question":"An ______ large number of our customers now make reservations online rather than by phone.","A":"increase","B":"increases","C":"increasing","D":"increasingly","answer":"D","answer_word":"increasingly","explanation":"■ 文の骨格\nAn ______ large number of our customers now make reservations online rather than by phone.\n\n■ 空所に入るもの\n冠詞 An と形容詞 large の間にあり、形容詞を修飾する位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) increase … 動詞（原形）／名詞「増える／増加」 ×\n(B) increases … 動詞（三人称単数現在形）「増える」 ×\n(C) increasing … 現在分詞・形容詞「増えている」 ×\n(D) increasingly … 副詞「ますます」 ○\n\n■ 完成文\nAn increasingly large number of our customers now make reservations online rather than by phone.\n（ますます多くのお客様が、電話ではなくオンラインで予約するようになっている。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋形容詞＋名詞〉は副詞。An になっているのは increasingly の母音のため。","words":[{"w":"increasingly","p":"副詞","m":"ますます"},{"w":"customers","p":"名詞","m":"顧客"},{"w":"make reservations","p":"熟語","m":"予約する"},{"w":"rather than","p":"熟語","m":"〜ではなく"}]},{"id":200,"category":"品詞問題・実戦問題 応用編","question":"News of Felix Schneider's retirement spread quickly as he had made many friends and ______ during his 20 years on the job.","A":"acquaint","B":"acquainted","C":"acquaintance","D":"acquaintances","answer":"D","answer_word":"acquaintances","explanation":"■ 文の骨格\nNews of Felix Schneider's retirement spread quickly as he had made many friends and ______ during his 20 years on the job.\n\n■ 空所に入るもの\nand の前が複数名詞 friends なので、後ろも複数名詞が必要。\n→ 空所には「friends と並列になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) acquaint … 動詞（原形）「知り合いにする」 ×\n(B) acquainted … 動詞の過去形・過去分詞「知らされた」 ×\n(C) acquaintance … 名詞（単数形）「知人」 ×\n(D) acquaintances … 名詞（複数形）「知人」 ○\n\n■ 完成文\nNews of Felix Schneider's retirement spread quickly as he had made many friends and acquaintances during his 20 years on the job.\n（Felix Schneider の退職の知らせは瞬く間に広まった。20年の勤務の間に多くの友人と知人を得ていたからだ。）\n\n■ 解き方のポイント\nand の前後は同じ品詞・同じ数。make friends and acquaintances は定型。","words":[{"w":"retirement","p":"名詞","m":"退職"},{"w":"spread","p":"動詞（過去形）","m":"広まった"},{"w":"acquaintances","p":"名詞","m":"知人"},{"w":"on the job","p":"熟語","m":"勤務して"}]},{"id":201,"category":"品詞問題・実戦問題 応用編","question":"The advertising campaigns Mr. Weyden had developed before he left were ______ implemented by his colleagues.","A":"subsequent","B":"most subsequent","C":"subsequently","D":"subsequence","answer":"C","answer_word":"subsequently","explanation":"■ 文の骨格\nThe advertising campaigns Mr. Weyden had developed before he left were ______ implemented by his colleagues.\n\n■ 空所に入るもの\n受動態 were implemented の間に入る修飾語の位置。\n→ 空所には「過去分詞 implemented を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) subsequent … 形容詞「その後の」 ×\n(B) most subsequent … 形容詞（最上級）「最もその後の」 ×\n(C) subsequently … 副詞「その後」 ○\n(D) subsequence … 名詞「後続」 ×\n\n■ 完成文\nThe advertising campaigns Mr. Weyden had developed before he left were subsequently implemented by his colleagues.\n（Weyden さんが退職前に立案した広告キャンペーンは、その後同僚たちによって実施された。）\n\n■ 解き方のポイント\n〈be動詞＋空所＋過去分詞〉は副詞の定位置。","words":[{"w":"campaigns","p":"名詞","m":"キャンペーン"},{"w":"developed","p":"動詞（過去分詞）","m":"立案した"},{"w":"subsequently","p":"副詞","m":"その後"},{"w":"implemented","p":"動詞（過去分詞）","m":"実施された"},{"w":"colleagues","p":"名詞","m":"同僚"}]},{"id":202,"category":"品詞問題・実戦問題 応用編","question":"Under ______ and CEO Jack Thompson, Thompson Legal has become a successful law firm within a relatively short span of time.","A":"foundation","B":"founder","C":"found","D":"founded","answer":"B","answer_word":"founder","explanation":"■ 文の骨格\nUnder ______ and CEO Jack Thompson, Thompson Legal has become a successful law firm within a relatively short span of time.\n\n■ 空所に入るもの\nand の後ろが役職を表す名詞 CEO なので、前も人の役職を表す名詞が必要。\n→ 空所には「CEO と並列になる名詞（人）」が必要です。\n\n■ 選択肢の確認\n(A) foundation … 名詞（もの）「設立、基盤」 ×\n(B) founder … 名詞（人）「創業者」 ○\n(C) found … 動詞（原形）／過去形「設立する／見つけた」 ×\n(D) founded … 動詞の過去形・過去分詞「設立された」 ×\n\n■ 完成文\nUnder founder and CEO Jack Thompson, Thompson Legal has become a successful law firm within a relatively short span of time.\n（創業者兼 CEO の Jack Thompson のもと、Thompson Legal は比較的短期間で成功した法律事務所となった。）\n\n■ 解き方のポイント\n人名の前に置かれる役職名は「人」を表す名詞。","words":[{"w":"founder","p":"名詞","m":"創業者"},{"w":"law firm","p":"名詞","m":"法律事務所"},{"w":"relatively","p":"副詞","m":"比較的"},{"w":"span of time","p":"名詞","m":"期間"}]},{"id":203,"category":"品詞問題・実戦問題 応用編","question":"Mr. Aiden Roy, an award-winning ______ at Calgary Daily Press, has agreed to chair an ad hoc committee on the newspaper's 75th anniversary.","A":"journal","B":"journalism","C":"journalist","D":"journalistic","answer":"C","answer_word":"journalist","explanation":"■ 文の骨格\nMr. Aiden Roy, an award-winning ______ at Calgary Daily Press, has agreed to chair an ad hoc committee on the newspaper's 75th anniversary.\n\n■ 空所に入るもの\nMr. Aiden Roy と同格になる位置なので、「人」を表す名詞が必要。\n→ 空所には「人を表す単数名詞」が必要です。\n\n■ 選択肢の確認\n(A) journal … 名詞「日誌、専門誌」 ×\n(B) journalism … 名詞（不可算）「報道、ジャーナリズム」 ×\n(C) journalist … 名詞（人）「記者、ジャーナリスト」 ○\n(D) journalistic … 形容詞「報道の」 ×\n\n■ 完成文\nMr. Aiden Roy, an award-winning journalist at Calgary Daily Press, has agreed to chair an ad hoc committee on the newspaper's 75th anniversary.\n（Calgary Daily Press 紙の受賞歴のある記者 Aiden Roy 氏は、同紙の創刊75周年に関する特別委員会の委員長を引き受けた。）\n\n■ 解き方のポイント\n人名と同格に置かれる名詞は「人」。-ist は人を表す語尾。","words":[{"w":"award-winning","p":"形容詞","m":"受賞歴のある"},{"w":"journalist","p":"名詞","m":"記者"},{"w":"chair","p":"動詞","m":"委員長を務める"},{"w":"ad hoc committee","p":"名詞","m":"特別委員会"}]},{"id":204,"category":"品詞問題・実戦問題 応用編","question":"The award will promote workplace values within the company by giving recognition to successful managers who demonstrate ______ for subordinates.","A":"respect","B":"respected","C":"respecting","D":"respectable","answer":"A","answer_word":"respect","explanation":"■ 文の骨格\nThe award will promote workplace values within the company by giving recognition to successful managers who demonstrate ______ for subordinates.\n\n■ 空所に入るもの\n他動詞 demonstrate の目的語が欠けており、for と結びつく名詞が必要。\n→ 空所には「demonstrate の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) respect … 名詞「敬意」 ○\n(B) respected … 動詞の過去形・過去分詞「尊敬された」 ×\n(C) respecting … 現在分詞・動名詞「尊敬すること」 ×\n(D) respectable … 形容詞「立派な」 ×\n\n■ 完成文\nThe award will promote workplace values within the company by giving recognition to successful managers who demonstrate respect for subordinates.\n（この賞は、部下への敬意を示す優れた管理職を表彰することで、社内の職場価値観を高めるものだ。）\n\n■ 解き方のポイント\nrespect for X＝「Xへの敬意」。他動詞の直後は名詞。","words":[{"w":"promote","p":"動詞","m":"高める、促進する"},{"w":"recognition","p":"名詞","m":"表彰、評価"},{"w":"demonstrate","p":"動詞","m":"示す"},{"w":"respect","p":"名詞","m":"敬意"},{"w":"subordinates","p":"名詞","m":"部下"}]},{"id":205,"category":"品詞問題・実戦問題 応用編","question":"Small manufacturers operating using a limited workforce with ______ skills have recently been on the rise.","A":"specialize","B":"specialized","C":"specializing","D":"specialization","answer":"B","answer_word":"specialized","explanation":"■ 文の骨格\nSmall manufacturers operating using a limited workforce with ______ skills have recently been on the rise.\n\n■ 空所に入るもの\nwith と名詞 skills の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) specialize … 動詞（原形）「専門にする」 ×\n(B) specialized … 過去分詞・形容詞「専門的な」 ○\n(C) specializing … 現在分詞・動名詞「専門にすること」 ×\n(D) specialization … 名詞「専門化」 ×\n\n■ 完成文\nSmall manufacturers operating using a limited workforce with specialized skills have recently been on the rise.\n（限られた人員で専門的な技能を用いて操業する小規模メーカーが、最近増加している。）\n\n■ 解き方のポイント\n名詞の直前で受け身の意味なら過去分詞。specialized skills は頻出。","words":[{"w":"manufacturers","p":"名詞","m":"メーカー"},{"w":"workforce","p":"名詞","m":"従業員、人員"},{"w":"specialized","p":"形容詞","m":"専門的な"},{"w":"on the rise","p":"熟語","m":"増加傾向にある"}]},{"id":206,"category":"品詞問題・実戦問題 応用編","question":"Happy Wholesale is the main ______ of Wonder Toys' products including toys, video games, and kids' PCs.","A":"distributor","B":"distributing","C":"distribute","D":"distribution","answer":"A","answer_word":"distributor","explanation":"■ 文の骨格\nHappy Wholesale is the main ______ of Wonder Toys' products including toys, video games, and kids' PCs.\n\n■ 空所に入るもの\n主語が会社なので、イコール関係になる「組織」を表す名詞が必要。\n→ 空所には「be動詞の補語になる名詞（人・組織）」が必要です。\n\n■ 選択肢の確認\n(A) distributor … 名詞（人・組織）「販売代理店、卸売業者」 ○\n(B) distributing … 現在分詞・動名詞「流通させること」 ×\n(C) distribute … 動詞（原形）「流通させる」 ×\n(D) distribution … 名詞（行為）「流通、配布」 ×\n\n■ 完成文\nHappy Wholesale is the main distributor of Wonder Toys' products including toys, video games, and kids' PCs.\n（Happy Wholesale 社は、おもちゃ・ビデオゲーム・子ども用 PC を含む Wonder Toys 社製品の主要販売代理店だ。）\n\n■ 解き方のポイント\n主語＝補語の関係。会社と等しくなるのは「業者」。","words":[{"w":"Wholesale","p":"名詞","m":"卸売"},{"w":"distributor","p":"名詞","m":"販売代理店"},{"w":"products","p":"名詞","m":"製品"},{"w":"including","p":"前置詞","m":"〜を含めて"}]},{"id":207,"category":"品詞問題・実戦問題 応用編","question":"Current plant workers will be given hiring preference for the newly ______ jobs at the company's production facility in Kawasaki.","A":"creates","B":"creating","C":"created","D":"creation","answer":"C","answer_word":"created","explanation":"■ 文の骨格\nCurrent plant workers will be given hiring preference for the newly ______ jobs at the company's production facility in Kawasaki.\n\n■ 空所に入るもの\n副詞 newly と名詞 jobs の間にあり、受け身の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) creates … 動詞（三人称単数現在形）「創出する」 ×\n(B) creating … 現在分詞・動名詞「創出すること」 ×\n(C) created … 過去分詞「創出された」 ○\n(D) creation … 名詞「創造」 ×\n\n■ 完成文\nCurrent plant workers will be given hiring preference for the newly created jobs at the company's production facility in Kawasaki.\n（現在の工場従業員は、川崎の生産施設で新たに創出される職に対して優先的に採用される。）\n\n■ 解き方のポイント\n〈副詞＋空所＋名詞〉で受け身の意味なら過去分詞。newly created は頻出。","words":[{"w":"Current","p":"形容詞","m":"現在の"},{"w":"hiring preference","p":"名詞","m":"採用の優先権"},{"w":"created","p":"過去分詞","m":"創出された"},{"w":"production facility","p":"名詞","m":"生産施設"}]},{"id":208,"category":"品詞問題・実戦問題 応用編","question":"As of February 1, the no-smoking policy at the Mountain Tower apartments will be more ______ enforced.","A":"strict","B":"strictly","C":"stricter","D":"strictness","answer":"B","answer_word":"strictly","explanation":"■ 文の骨格\nAs of February 1, the no-smoking policy at the Mountain Tower apartments will be more ______ enforced.\n\n■ 空所に入るもの\n受動態 will be enforced の間で、more とともに比較級をつくる副詞が必要。\n→ 空所には「過去分詞 enforced を修飾する副詞（比較級）」が必要です。\n\n■ 選択肢の確認\n(A) strict … 形容詞「厳しい」 ×\n(B) strictly … 副詞「厳しく」 ○\n(C) stricter … 形容詞（比較級）「より厳しい」 ×\n(D) strictness … 名詞「厳しさ」 ×\n\n■ 完成文\nAs of February 1, the no-smoking policy at the Mountain Tower apartments will be more strictly enforced.\n（2月1日より、Mountain Tower アパートの禁煙規則はより厳格に施行される。）\n\n■ 解き方のポイント\nmore ＿＿＋過去分詞 の空所は副詞。","words":[{"w":"As of","p":"熟語","m":"〜より、〜時点で"},{"w":"no-smoking policy","p":"名詞","m":"禁煙規則"},{"w":"strictly","p":"副詞","m":"厳しく"},{"w":"enforced","p":"動詞（過去分詞）","m":"施行される"}]},{"id":209,"category":"品詞問題・実戦問題 応用編","question":"In the last decade, there has been a ______ rapid increase in the number of public locations for wireless Internet usage.","A":"remark","B":"remarks","C":"remarking","D":"remarkably","answer":"D","answer_word":"remarkably","explanation":"■ 文の骨格\nIn the last decade, there has been a ______ rapid increase in the number of public locations for wireless Internet usage.\n\n■ 空所に入るもの\n冠詞 a と形容詞 rapid の間にあり、形容詞を修飾する位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) remark … 名詞／動詞「意見／述べる」 ×\n(B) remarks … 名詞（複数形）「意見」 ×\n(C) remarking … 現在分詞・動名詞「述べること」 ×\n(D) remarkably … 副詞「著しく」 ○\n\n■ 完成文\nIn the last decade, there has been a remarkably rapid increase in the number of public locations for wireless Internet usage.\n（この10年で、無線インターネットが使える公共の場所の数が著しく急増している。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋形容詞＋名詞〉は副詞。","words":[{"w":"decade","p":"名詞","m":"10年間"},{"w":"remarkably","p":"副詞","m":"著しく"},{"w":"rapid","p":"形容詞","m":"急速な"},{"w":"wireless","p":"形容詞","m":"無線の"},{"w":"usage","p":"名詞","m":"利用"}]},{"id":210,"category":"品詞問題・実戦問題 応用編","question":"All products made by Trust Computers come with a user's manual that contains ______ for installation as well as operating procedures.","A":"explain","B":"explanatory","C":"explanations","D":"explaining","answer":"C","answer_word":"explanations","explanation":"■ 文の骨格\nAll products made by Trust Computers come with a user's manual that contains ______ for installation as well as operating procedures.\n\n■ 空所に入るもの\n他動詞 contains の目的語が欠けており、冠詞がないので複数形が必要。\n→ 空所には「contains の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) explain … 動詞（原形）「説明する」 ×\n(B) explanatory … 形容詞「説明的な」 ×\n(C) explanations … 名詞（複数形）「説明」 ○\n(D) explaining … 現在分詞・動名詞「説明すること」 ×\n\n■ 完成文\nAll products made by Trust Computers come with a user's manual that contains explanations for installation as well as operating procedures.\n（Trust Computers 社の全製品には、操作手順に加えて設置の説明が載った取扱説明書が付いてくる。）\n\n■ 解き方のポイント\n他動詞の直後は名詞。冠詞がなければ複数形。","words":[{"w":"come with","p":"熟語","m":"〜が付いてくる"},{"w":"user's manual","p":"名詞","m":"取扱説明書"},{"w":"contains","p":"動詞","m":"含む"},{"w":"explanations","p":"名詞","m":"説明"},{"w":"operating procedures","p":"名詞","m":"操作手順"}]},{"id":211,"category":"品詞問題・実戦問題 応用編","question":"During the workshop, small business owners will learn how to develop ______ business relationships with their clients.","A":"prosper","B":"prosperity","C":"prosperous","D":"prospered","answer":"C","answer_word":"prosperous","explanation":"■ 文の骨格\nDuring the workshop, small business owners will learn how to develop ______ business relationships with their clients.\n\n■ 空所に入るもの\n他動詞 develop の目的語 business relationships を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) prosper … 動詞（原形）「繁栄する」 ×\n(B) prosperity … 名詞「繁栄」 ×\n(C) prosperous … 形容詞「実り多い、繁栄した」 ○\n(D) prospered … 動詞の過去形・過去分詞「繁栄した」 ×\n\n■ 完成文\nDuring the workshop, small business owners will learn how to develop prosperous business relationships with their clients.\n（研修会で、小規模事業主は顧客との実り多い取引関係を築く方法を学ぶ。）\n\n■ 解き方のポイント\n名詞のかたまりの前は形容詞。-ous は形容詞の目印。","words":[{"w":"workshop","p":"名詞","m":"研修会"},{"w":"business owners","p":"名詞","m":"事業主"},{"w":"develop","p":"動詞","m":"築く"},{"w":"prosperous","p":"形容詞","m":"実り多い"},{"w":"relationships","p":"名詞","m":"関係"}]},{"id":212,"category":"品詞問題・実戦問題 応用編","question":"Green Net Corporation reported a net profit of 40 million dollars for the third quarter, ______ exceeding analysts' forecasts.","A":"easy","B":"easing","C":"ease","D":"easily","answer":"D","answer_word":"easily","explanation":"■ 文の骨格\nGreen Net Corporation reported a net profit of 40 million dollars for the third quarter, ______ exceeding analysts' forecasts.\n\n■ 空所に入るもの\n分詞構文 exceeding ... を修飾する位置。\n→ 空所には「分詞 exceeding を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) easy … 形容詞「簡単な」 ×\n(B) easing … 現在分詞・動名詞「和らげること」 ×\n(C) ease … 名詞／動詞「容易さ／和らげる」 ×\n(D) easily … 副詞「容易に、楽々と」 ○\n\n■ 完成文\nGreen Net Corporation reported a net profit of 40 million dollars for the third quarter, easily exceeding analysts' forecasts.\n（Green Net 社は第3四半期に4,000万ドルの純利益を計上し、アナリストの予測を楽々と上回った。）\n\n■ 解き方のポイント\n分詞の直前の空所は副詞。","words":[{"w":"net profit","p":"名詞","m":"純利益"},{"w":"quarter","p":"名詞","m":"四半期"},{"w":"easily","p":"副詞","m":"楽々と"},{"w":"exceeding","p":"現在分詞","m":"上回っている"},{"w":"forecasts","p":"名詞","m":"予測"}]},{"id":213,"category":"品詞問題・実戦問題 応用編","question":"Tiger Motors intentionally cut back on fleet sales, which are less ______ than sales to individual customers.","A":"profit","B":"profitable","C":"profitably","D":"profits","answer":"B","answer_word":"profitable","explanation":"■ 文の骨格\nTiger Motors intentionally cut back on fleet sales, which are less ______ than sales to individual customers.\n\n■ 空所に入るもの\nare の補語で、less ... than の形をつくる形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞（比較級）」が必要です。\n\n■ 選択肢の確認\n(A) profit … 名詞／動詞「利益／利益を得る」 ×\n(B) profitable … 形容詞「もうかる、収益性の高い」 ○\n(C) profitably … 副詞「有利に」 ×\n(D) profits … 名詞（複数形）「利益」 ×\n\n■ 完成文\nTiger Motors intentionally cut back on fleet sales, which are less profitable than sales to individual customers.\n（Tiger Motors 社は、個人客への販売より収益性の低い法人一括販売を意図的に縮小した。）\n\n■ 解き方のポイント\nless ＿＿ than が be動詞の補語なら形容詞。","words":[{"w":"intentionally","p":"副詞","m":"意図的に"},{"w":"cut back on","p":"熟語","m":"〜を縮小する"},{"w":"fleet sales","p":"名詞","m":"法人一括販売"},{"w":"profitable","p":"形容詞","m":"収益性の高い"}]},{"id":214,"category":"品詞問題・実戦問題 応用編","question":"Newly hired staff members are required to attend a three-day training course on airport ______.","A":"secure","B":"secured","C":"security","D":"securely","answer":"C","answer_word":"security","explanation":"■ 文の骨格\nNewly hired staff members are required to attend a three-day training course on airport ______.\n\n■ 空所に入るもの\n前置詞 on の目的語で、airport に続く名詞が必要。\n→ 空所には「airport と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) secure … 形容詞／動詞「安全な／確保する」 ×\n(B) secured … 動詞の過去形・過去分詞「確保された」 ×\n(C) security … 名詞「保安、警備」 ○\n(D) securely … 副詞「安全に」 ×\n\n■ 完成文\nNewly hired staff members are required to attend a three-day training course on airport security.\n（新しく採用された職員は、空港保安に関する3日間の研修を受講しなければならない。）\n\n■ 解き方のポイント\nairport security（空港保安）は複合名詞。前置詞の直後は名詞。","words":[{"w":"Newly hired","p":"形容詞句","m":"新しく採用された"},{"w":"required","p":"動詞（過去分詞）","m":"求められる"},{"w":"training course","p":"名詞","m":"研修"},{"w":"security","p":"名詞","m":"保安"}]},{"id":215,"category":"品詞問題・実戦問題 応用編","question":"Diego Martinez is going to appear on a prime-time news program as a ______ for the anchor, David Lee.","A":"substitute","B":"substitutive","C":"substitutions","D":"substitutes","answer":"A","answer_word":"substitute","explanation":"■ 文の骨格\nDiego Martinez is going to appear on a prime-time news program as a ______ for the anchor, David Lee.\n\n■ 空所に入るもの\n冠詞 a の後ろで、「アンカーの代役となる人」を表す単数名詞が必要。\n→ 空所には「前置詞 as の目的語になる名詞（人）」が必要です。\n\n■ 選択肢の確認\n(A) substitute … 名詞（人・単数形）「代役、代理」 ○\n(B) substitutive … 形容詞「代用の」 ×\n(C) substitutions … 名詞（複数形）「代用、置換」 ×\n(D) substitutes … 名詞（複数形）／動詞「代役／代用する」 ×\n\n■ 完成文\nDiego Martinez is going to appear on a prime-time news program as a substitute for the anchor, David Lee.\n（Diego Martinez は、アンカーの David Lee の代役としてゴールデンタイムのニュース番組に出演する。）\n\n■ 解き方のポイント\na substitute for X＝「Xの代役」。冠詞 a があるので単数形。","words":[{"w":"appear on","p":"熟語","m":"〜に出演する"},{"w":"prime-time","p":"形容詞","m":"ゴールデンタイムの"},{"w":"substitute","p":"名詞","m":"代役"},{"w":"anchor","p":"名詞","m":"ニュースキャスター"}]},{"id":216,"category":"品詞問題・実戦問題 応用編","question":"Charlie Evans starts his day with a cup of coffee at Turner's Café ______ every morning.","A":"practical","B":"practically","C":"practice","D":"practicing","answer":"B","answer_word":"practically","explanation":"■ 文の骨格\nCharlie Evans starts his day with a cup of coffee at Turner's Café ______ every morning.\n\n■ 空所に入るもの\nSVO が完成しており、every morning を修飾する位置。\n→ 空所には「副詞句を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) practical … 形容詞「実用的な」 ×\n(B) practically … 副詞「ほとんど、実際上」 ○\n(C) practice … 名詞／動詞「練習／練習する」 ×\n(D) practicing … 現在分詞・動名詞「練習すること」 ×\n\n■ 完成文\nCharlie Evans starts his day with a cup of coffee at Turner's Café practically every morning.\n（Charlie Evans はほぼ毎朝、Turner’s カフェで1杯のコーヒーから一日を始める。）\n\n■ 解き方のポイント\npractically は「実用的に」だけでなく「ほとんど（＝almost）」の意味でも頻出。","words":[{"w":"starts","p":"動詞","m":"始める"},{"w":"practically","p":"副詞","m":"ほとんど"},{"w":"every morning","p":"名詞句","m":"毎朝"}]},{"id":217,"category":"品詞問題・実戦問題 応用編","question":"If you wish to enroll in the course, please complete the ______ application form and send it to us as quickly as possible.","A":"attach","B":"attaching","C":"attached","D":"attachment","answer":"C","answer_word":"attached","explanation":"■ 文の骨格\nIf you wish to enroll in the course, please complete the ______ application form and send it to us as quickly as possible.\n\n■ 空所に入るもの\nthe と名詞句 application form の間にあり、受け身の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) attach … 動詞（原形）「添付する」 ×\n(B) attaching … 現在分詞・動名詞「添付すること」 ×\n(C) attached … 過去分詞・形容詞「添付された」 ○\n(D) attachment … 名詞「添付物、愛着」 ×\n\n■ 完成文\nIf you wish to enroll in the course, please complete the attached application form and send it to us as quickly as possible.\n（この講座への登録をご希望の場合は、添付の申込書にご記入のうえ、できるだけ早くご送付ください。）\n\n■ 解き方のポイント\nform は「添付される」側なので過去分詞。attached は「添付の」として頻出。","words":[{"w":"enroll in","p":"熟語","m":"〜に登録する"},{"w":"complete","p":"動詞","m":"記入する"},{"w":"attached","p":"形容詞","m":"添付の"},{"w":"application form","p":"名詞","m":"申込書"}]},{"id":218,"category":"品詞問題・実戦問題 応用編","question":"The delayed departure of the plane added a further ______ to Mr. G
