s for obtaining short-term loans.\n\n■ 空所に入るもの\n主節の主語 First State Bank が「注力する」側なので、能動の分詞構文になる。\n→ 空所には「分詞構文をつくる現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) focus … 動詞（原形）／名詞「集中する／焦点」 ×\n(B) focusing … 現在分詞「注力して」 ○\n(C) focused … 動詞の過去形・過去分詞「集中した」 ×\n(D) focuses … 動詞（三人称単数現在形）「集中する」 ×\n\n■ 完成文\nFirst State Bank has streamlined its procedures for business clients, focusing on simplifying the process for obtaining short-term loans.\n（First State 銀行は、短期融資を受ける手続きの簡素化に注力し、法人顧客向けの手続きを合理化した。）\n\n■ 解き方のポイント\nコンマの後ろで補足説明を加えるのは分詞構文（-ing）。","words":[{"w":"streamlined","p":"動詞（過去分詞）","m":"合理化した"},{"w":"procedures","p":"名詞","m":"手続き"},{"w":"focusing on","p":"熟語","m":"〜に注力して"},{"w":"simplifying","p":"動名詞","m":"簡素化すること"},{"w":"short-term loans","p":"名詞","m":"短期融資"}]},{"id":370,"category":"動詞問題・実戦問題 基本編","question":"Participants in last week's business trip ______ to submit the travel expense report as promptly as possible.","A":"have required","B":"are requiring","C":"will require","D":"are required","answer":"D","answer_word":"are required","explanation":"■ 文の骨格\nParticipants in last week's business trip ______ to submit the travel expense report as promptly as possible.\n\n■ 空所に入るもの\n主語 Participants は「求められる」側なので受動態が必要。\n→ 空所には「受動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) have required … 現在完了形（能動）「求めてきた」 ×\n(B) are requiring … 現在進行形（能動）「求めている」 ×\n(C) will require … 未来形（能動）「求めるだろう」 ×\n(D) are required … 受動態（現在形）「求められている」 ○\n\n■ 完成文\nParticipants in last week's business trip are required to submit the travel expense report as promptly as possible.\n（先週の出張の参加者は、旅費精算書をできるだけ速やかに提出するよう求められている。）\n\n■ 解き方のポイント\nbe required to do＝「〜するよう求められる」。主語が「される側」なら受動態。","words":[{"w":"Participants","p":"名詞","m":"参加者"},{"w":"business trip","p":"名詞","m":"出張"},{"w":"are required","p":"受動態","m":"求められている"},{"w":"travel expense report","p":"名詞","m":"旅費精算書"},{"w":"promptly","p":"副詞","m":"速やかに"}]},{"id":371,"category":"動詞問題・実戦問題 基本編","question":"Residents of Yankton recently received a letter from the mayor ______ them to attend a community meeting on May 1.","A":"inviting","B":"invite","C":"invited","D":"are invited","answer":"A","answer_word":"inviting","explanation":"■ 文の骨格\nResidents of Yankton recently received a letter from the mayor ______ them to attend a community meeting on May 1.\n\n■ 空所に入るもの\n名詞 a letter を後ろから修飾し、them を目的語に取る語が必要。\n→ 空所には「名詞を後ろから修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) inviting … 現在分詞「招く」 ○\n(B) invite … 動詞（原形）「招く」 ×\n(C) invited … 過去分詞「招かれた」 ×\n(D) are invited … 受動態「招かれている」 ×\n\n■ 完成文\nResidents of Yankton recently received a letter from the mayor inviting them to attend a community meeting on May 1.\n（Yankton の住民は最近、5月1日の地域集会への出席を呼びかける手紙を市長から受け取った。）\n\n■ 解き方のポイント\n名詞の後ろで目的語を取る分詞は現在分詞。","words":[{"w":"Residents","p":"名詞","m":"住民"},{"w":"mayor","p":"名詞","m":"市長"},{"w":"inviting","p":"現在分詞","m":"招く"},{"w":"attend","p":"動詞","m":"出席する"},{"w":"community meeting","p":"名詞","m":"地域集会"}]},{"id":372,"category":"動詞問題・実戦問題 基本編","question":"Mr. Stallard has requested that sales representatives ______ their customers' telephone calls immediately and without fail.","A":"return","B":"returned","C":"returning","D":"to return","answer":"A","answer_word":"return","explanation":"■ 文の骨格\nMr. Stallard has requested that sales representatives ______ their customers' telephone calls immediately and without fail.\n\n■ 空所に入るもの\nrequest のような要求・提案を表す動詞に続く that 節では、動詞が原形になる。\n→ 空所には「request that 節内の動詞（原形）」が必要です。\n\n■ 選択肢の確認\n(A) return … 動詞（原形）「折り返す、返す」 ○\n(B) returned … 動詞の過去形・過去分詞「返した」 ×\n(C) returning … 現在分詞・動名詞「返すこと」 ×\n(D) to return … 不定詞「返すこと」 ×\n\n■ 完成文\nMr. Stallard has requested that sales representatives return their customers' telephone calls immediately and without fail.\n（Stallard 氏は営業担当者に対し、顧客からの電話には必ずすぐ折り返すよう求めている。）\n\n■ 解き方のポイント\nrequest / require / suggest / recommend / insist に続く that 節は動詞が原形。","words":[{"w":"requested","p":"動詞（過去分詞）","m":"求めた"},{"w":"sales representatives","p":"名詞","m":"営業担当者"},{"w":"return","p":"動詞","m":"折り返す"},{"w":"without fail","p":"熟語","m":"必ず"}]},{"id":373,"category":"動詞問題・実戦問題 基本編","question":"Members of the historical society ______ a budget proposal for the exhibition to the museum's curator.","A":"are submitted","B":"have submitted","C":"submitting","D":"submits","answer":"B","answer_word":"have submitted","explanation":"■ 文の骨格\nMembers of the historical society ______ a budget proposal for the exhibition to the museum's curator.\n\n■ 空所に入るもの\n主語 Members は「提出する」側で複数。目的語 a budget proposal があるので能動態。\n→ 空所には「能動態の述語動詞（複数主語）」が必要です。\n\n■ 選択肢の確認\n(A) are submitted … 受動態「提出された」 ×\n(B) have submitted … 現在完了形（能動）「提出した」 ○\n(C) submitting … 現在分詞・動名詞「提出すること」 ×\n(D) submits … 動詞（三人称単数現在形）「提出する」 ×\n\n■ 完成文\nMembers of the historical society have submitted a budget proposal for the exhibition to the museum's curator.\n（歴史協会の会員は、展覧会の予算案を博物館の学芸員に提出した。）\n\n■ 解き方のポイント\n直後に目的語があれば能動態。主語が複数なので submits は不可。","words":[{"w":"historical society","p":"名詞","m":"歴史協会"},{"w":"have submitted","p":"現在完了","m":"提出した"},{"w":"budget proposal","p":"名詞","m":"予算案"},{"w":"exhibition","p":"名詞","m":"展覧会"},{"w":"curator","p":"名詞","m":"学芸員"}]},{"id":374,"category":"動詞問題・実戦問題 基本編","question":"The Tokyo Symphony Orchestra has become well known around the world, having ______ more than 20 countries.","A":"tour","B":"tours","C":"toured","D":"touring","answer":"C","answer_word":"toured","explanation":"■ 文の骨格\nThe Tokyo Symphony Orchestra has become well known around the world, having ______ more than 20 countries.\n\n■ 空所に入るもの\nhaving ＋過去分詞 で完了分詞構文をつくる。\n→ 空所には「完了分詞構文をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) tour … 動詞（原形）／名詞「巡演する／ツアー」 ×\n(B) tours … 動詞（三人称単数現在形）／名詞（複数形）「巡演する／ツアー」 ×\n(C) toured … 過去分詞「巡演した」 ○\n(D) touring … 現在分詞・動名詞「巡演すること」 ×\n\n■ 完成文\nThe Tokyo Symphony Orchestra has become well known around the world, having toured more than 20 countries.\n（東京交響楽団は20か国以上を巡演し、世界中で広く知られるようになった。）\n\n■ 解き方のポイント\nhaving＋過去分詞＝完了分詞構文。主節より前の出来事を表す。","words":[{"w":"Symphony Orchestra","p":"名詞","m":"交響楽団"},{"w":"well known","p":"形容詞句","m":"広く知られた"},{"w":"toured","p":"過去分詞","m":"巡演した"},{"w":"countries","p":"名詞","m":"国"}]},{"id":375,"category":"動詞問題・実戦問題 基本編","question":"Smooth Communication's Chairperson, Mr. Roberts, said the board had no plans ______ its CEO because they had absolute confidence in his ability.","A":"replace","B":"replaced","C":"to replace","D":"replacement","answer":"C","answer_word":"to replace","explanation":"■ 文の骨格\nSmooth Communication's Chairperson, Mr. Roberts, said the board had no plans ______ its CEO because they had absolute confidence in his ability.\n\n■ 空所に入るもの\n名詞 plans を後ろから修飾し、「〜する予定」を表す不定詞が必要。\n→ 空所には「名詞を修飾する不定詞」が必要です。\n\n■ 選択肢の確認\n(A) replace … 動詞（原形）「交代させる」 ×\n(B) replaced … 動詞の過去形・過去分詞「交代させられた」 ×\n(C) to replace … 不定詞「交代させる（という）」 ○\n(D) replacement … 名詞「交代、後任」 ×\n\n■ 完成文\nSmooth Communication's Chairperson, Mr. Roberts, said the board had no plans to replace its CEO because they had absolute confidence in his ability.\n（Smooth Communication 社の会長 Roberts 氏は、CEO の能力を全面的に信頼しているため、取締役会には彼を交代させる予定はないと述べた。）\n\n■ 解き方のポイント\nplan / decision / ability / effort などの名詞は不定詞を後ろに従える。","words":[{"w":"Chairperson","p":"名詞","m":"会長"},{"w":"board","p":"名詞","m":"取締役会"},{"w":"to replace","p":"不定詞","m":"交代させる"},{"w":"absolute confidence","p":"名詞","m":"全面的な信頼"}]},{"id":376,"category":"動詞問題・実戦問題 基本編","question":"The new software provides users with an option ______ higher quality prints although it takes substantially longer.","A":"request","B":"to request","C":"requested","D":"requesting","answer":"B","answer_word":"to request","explanation":"■ 文の骨格\nThe new software provides users with an option ______ higher quality prints although it takes substantially longer.\n\n■ 空所に入るもの\n名詞 an option を後ろから修飾し、「〜するという選択肢」を表す不定詞が必要。\n→ 空所には「名詞を修飾する不定詞」が必要です。\n\n■ 選択肢の確認\n(A) request … 動詞（原形）／名詞「要求する／要望」 ×\n(B) to request … 不定詞「要求する（という）」 ○\n(C) requested … 動詞の過去形・過去分詞「要求された」 ×\n(D) requesting … 現在分詞・動名詞「要求すること」 ×\n\n■ 完成文\nThe new software provides users with an option to request higher quality prints although it takes substantially longer.\n（その新しいソフトは、かなり時間はかかるものの、より高品質な印刷を要求できる選択肢をユーザーに提供する。）\n\n■ 解き方のポイント\noption / chance / opportunity なども不定詞を従える名詞。","words":[{"w":"provides","p":"動詞","m":"提供する"},{"w":"option","p":"名詞","m":"選択肢"},{"w":"to request","p":"不定詞","m":"要求する"},{"w":"substantially","p":"副詞","m":"かなり"}]},{"id":377,"category":"動詞問題・実戦問題 基本編","question":"It is recommended that customers ______ snow tires in November as stock is often quite limited by early December.","A":"purchase","B":"purchased","C":"purchases","D":"had purchased","answer":"A","answer_word":"purchase","explanation":"■ 文の骨格\nIt is recommended that customers ______ snow tires in November as stock is often quite limited by early December.\n\n■ 空所に入るもの\nrecommend に続く that 節では、主語の人称・数に関係なく動詞が原形になる。\n→ 空所には「recommend that 節内の動詞（原形）」が必要です。\n\n■ 選択肢の確認\n(A) purchase … 動詞（原形）「購入する」 ○\n(B) purchased … 動詞の過去形・過去分詞「購入した」 ×\n(C) purchases … 動詞（三人称単数現在形）「購入する」 ×\n(D) had purchased … 過去完了形「購入していた」 ×\n\n■ 完成文\nIt is recommended that customers purchase snow tires in November as stock is often quite limited by early December.\n（12月初旬には在庫がかなり限られることが多いため、お客様には11月中のスノータイヤのご購入をお勧めします。）\n\n■ 解き方のポイント\nIt is recommended [suggested / necessary] that ... の節内は動詞の原形。","words":[{"w":"recommended","p":"動詞（過去分詞）","m":"推奨される"},{"w":"customers","p":"名詞","m":"顧客"},{"w":"purchase","p":"動詞","m":"購入する"},{"w":"stock","p":"名詞","m":"在庫"},{"w":"limited","p":"形容詞","m":"限られた"}]},{"id":378,"category":"動詞問題・実戦問題 基本編","question":"Swan Air has received approval ______ daily flights between St. Petersburg and Brussels starting in May.","A":"perform","B":"to perform","C":"performing","D":"performance","answer":"B","answer_word":"to perform","explanation":"■ 文の骨格\nSwan Air has received approval ______ daily flights between St. Petersburg and Brussels starting in May.\n\n■ 空所に入るもの\n名詞 approval を後ろから修飾し、「〜する認可」を表す不定詞が必要。\n→ 空所には「名詞を修飾する不定詞」が必要です。\n\n■ 選択肢の確認\n(A) perform … 動詞（原形）「運航する」 ×\n(B) to perform … 不定詞「運航する（という）」 ○\n(C) performing … 現在分詞・動名詞「運航すること」 ×\n(D) performance … 名詞「実施、業績」 ×\n\n■ 完成文\nSwan Air has received approval to perform daily flights between St. Petersburg and Brussels starting in May.\n（Swan 航空は、5月からサンクトペテルブルクとブリュッセル間で毎日運航する認可を得た。）\n\n■ 解き方のポイント\napproval / permission / right などの名詞も不定詞を従える。","words":[{"w":"approval","p":"名詞","m":"認可"},{"w":"to perform","p":"不定詞","m":"運航する"},{"w":"daily flights","p":"名詞","m":"毎日の運航便"},{"w":"starting in","p":"熟語","m":"〜から"}]},{"id":379,"category":"動詞問題・実戦問題 基本編","question":"Sophie Reid, one of the professors at Glasgow College, ______ extensive research of historical sites in Scotland.","A":"have conducted","B":"conducting","C":"will be conducted","D":"has conducted","answer":"D","answer_word":"has conducted","explanation":"■ 文の骨格\nSophie Reid, one of the professors at Glasgow College, ______ extensive research of historical sites in Scotland.\n\n■ 空所に入るもの\n主語は Sophie Reid（単数）。目的語 extensive research があるので能動態。\n→ 空所には「単数主語に対応する能動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) have conducted … 現在完了形（複数対応）「行ってきた」 ×\n(B) conducting … 現在分詞・動名詞「行うこと」 ×\n(C) will be conducted … 受動態（未来）「行われるだろう」 ×\n(D) has conducted … 現在完了形（単数対応）「行ってきた」 ○\n\n■ 完成文\nSophie Reid, one of the professors at Glasgow College, has conducted extensive research of historical sites in Scotland.\n（Glasgow College の教授の1人である Sophie Reid は、スコットランドの史跡について広範な研究を行ってきた。）\n\n■ 解き方のポイント\nコンマに挟まれた同格部分は主語ではない。主語は Sophie Reid で単数。","words":[{"w":"professors","p":"名詞","m":"教授"},{"w":"has conducted","p":"現在完了","m":"行ってきた"},{"w":"extensive","p":"形容詞","m":"広範な"},{"w":"historical sites","p":"名詞","m":"史跡"}]},{"id":380,"category":"動詞問題・実戦問題 基本編","question":"Legrand Auto's new sports car is ______ with technologies designed to keep its occupants comfortable and safe.","A":"equip","B":"equipped","C":"equipping","D":"equips","answer":"B","answer_word":"equipped","explanation":"■ 文の骨格\nLegrand Auto's new sports car is ______ with technologies designed to keep its occupants comfortable and safe.\n\n■ 空所に入るもの\nis の後ろで、主語 sports car は「搭載される」側なので過去分詞が必要。\n→ 空所には「受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) equip … 動詞（原形）「装備する」 ×\n(B) equipped … 過去分詞「装備された」 ○\n(C) equipping … 現在分詞・動名詞「装備すること」 ×\n(D) equips … 動詞（三人称単数現在形）「装備する」 ×\n\n■ 完成文\nLegrand Auto's new sports car is equipped with technologies designed to keep its occupants comfortable and safe.\n（Legrand Auto 社の新型スポーツカーは、乗員を快適かつ安全に保つよう設計された技術を搭載している。）\n\n■ 解き方のポイント\nbe equipped with X＝「Xを備えている」。with が受動態の目印。","words":[{"w":"equipped","p":"過去分詞","m":"装備された"},{"w":"technologies","p":"名詞","m":"技術"},{"w":"designed","p":"過去分詞","m":"設計された"},{"w":"occupants","p":"名詞","m":"乗員"}]},{"id":381,"category":"動詞問題・実戦問題 基本編","question":"Study results ______ earlier this year indicated that candidates with lower-pitched voices may have an edge in a job interview.","A":"will be published","B":"were published","C":"published","D":"publishing","answer":"C","answer_word":"published","explanation":"■ 文の骨格\nStudy results ______ earlier this year indicated that candidates with lower-pitched voices may have an edge in a job interview.\n\n■ 空所に入るもの\n述語動詞 indicated がすでにあるため、空所は主語 Study results を修飾する分詞。\n→ 空所には「名詞を後ろから修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) will be published … 受動態（未来）「公表されるだろう」 ×\n(B) were published … 受動態（過去）「公表された」 ×\n(C) published … 過去分詞「公表された」 ○\n(D) publishing … 現在分詞・動名詞「公表すること」 ×\n\n■ 完成文\nStudy results published earlier this year indicated that candidates with lower-pitched voices may have an edge in a job interview.\n（今年初めに公表された調査結果は、低い声の候補者が就職面接で有利になる可能性を示した。）\n\n■ 解き方のポイント\n述語動詞がすでにある文で動詞の形が問われたら、分詞（修飾語）を疑う。","words":[{"w":"Study results","p":"名詞","m":"調査結果"},{"w":"published","p":"過去分詞","m":"公表された"},{"w":"indicated","p":"動詞（過去形）","m":"示した"},{"w":"lower-pitched","p":"形容詞","m":"低い音程の"},{"w":"edge","p":"名詞","m":"優位"}]},{"id":382,"category":"動詞問題・実戦問題 基本編","question":"Diego Garcia is a fashion entrepreneur whose firm is known for ______ shoes well-suited to professional athletes.","A":"create","B":"creation","C":"creates","D":"creating","answer":"D","answer_word":"creating","explanation":"■ 文の骨格\nDiego Garcia is a fashion entrepreneur whose firm is known for ______ shoes well-suited to professional athletes.\n\n■ 空所に入るもの\nbe known for の for は前置詞。さらに目的語 shoes を取るので動名詞が必要。\n→ 空所には「前置詞 for の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) create … 動詞（原形）「作る」 ×\n(B) creation … 名詞「創造、創作物」 ×\n(C) creates … 動詞（三人称単数現在形）「作る」 ×\n(D) creating … 動名詞「作ること」 ○\n\n■ 完成文\nDiego Garcia is a fashion entrepreneur whose firm is known for creating shoes well-suited to professional athletes.\n（Diego Garcia は、プロ選手にぴったりの靴を作ることで知られる会社を持つファッション起業家だ。）\n\n■ 解き方のポイント\n前置詞の後ろで目的語を取るなら動名詞。名詞 creation では shoes を目的語にできない。","words":[{"w":"entrepreneur","p":"名詞","m":"起業家"},{"w":"firm","p":"名詞","m":"会社"},{"w":"known for","p":"熟語","m":"〜で知られる"},{"w":"creating","p":"動名詞","m":"作ること"},{"w":"well-suited to","p":"熟語","m":"〜にぴったりの"}]},{"id":383,"category":"動詞問題・実戦問題 基本編","question":"Copies of Mr. Sato's presentation materials ______ to all department staff by the end of this week.","A":"have been distributed","B":"will distribute","C":"are distributing","D":"will be distributed","answer":"D","answer_word":"will be distributed","explanation":"■ 文の骨格\nCopies of Mr. Sato's presentation materials ______ to all department staff by the end of this week.\n\n■ 空所に入るもの\nby the end of this week（今週末までに）が未来を示し、Copies は「配付される」側。\n→ 空所には「未来の受動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) have been distributed … 現在完了受動態「配付された」 ×\n(B) will distribute … 未来形（能動）「配付するだろう」 ×\n(C) are distributing … 現在進行形（能動）「配付している」 ×\n(D) will be distributed … 未来形（受動）「配付される」 ○\n\n■ 完成文\nCopies of Mr. Sato's presentation materials will be distributed to all department staff by the end of this week.\n（Sato さんのプレゼン資料のコピーは、今週末までに全部署の職員へ配付される。）\n\n■ 解き方のポイント\nby＋未来の時点 → 未来形。主語が「される側」なら受動態。","words":[{"w":"Copies","p":"名詞","m":"コピー、部数"},{"w":"presentation materials","p":"名詞","m":"プレゼン資料"},{"w":"will be distributed","p":"未来受動態","m":"配付される"},{"w":"department","p":"名詞","m":"部署"}]},{"id":384,"category":"動詞問題・実戦問題 基本編","question":"The advertising agency suggested that the packaging design ______ in order to improve the product image.","A":"be modified","B":"is modifying","C":"were modified","D":"will modify","answer":"A","answer_word":"be modified","explanation":"■ 文の骨格\nThe advertising agency suggested that the packaging design ______ in order to improve the product image.\n\n■ 空所に入るもの\nsuggest に続く that 節では動詞が原形。design は「変更される」側なので be＋過去分詞。\n→ 空所には「suggest that 節内の動詞（原形の受動態）」が必要です。\n\n■ 選択肢の確認\n(A) be modified … 原形の受動態「変更される」 ○\n(B) is modifying … 現在進行形「変更している」 ×\n(C) were modified … 過去形の受動態「変更された」 ×\n(D) will modify … 未来形（能動）「変更するだろう」 ×\n\n■ 完成文\nThe advertising agency suggested that the packaging design be modified in order to improve the product image.\n（広告代理店は、製品イメージを高めるためにパッケージデザインを変更するよう提案した。）\n\n■ 解き方のポイント\nsuggest / recommend / propose に続く that 節は動詞が原形。受動なら be＋過去分詞。","words":[{"w":"advertising agency","p":"名詞","m":"広告代理店"},{"w":"suggested","p":"動詞（過去形）","m":"提案した"},{"w":"packaging design","p":"名詞","m":"パッケージデザイン"},{"w":"be modified","p":"原形の受動態","m":"変更される"},{"w":"improve","p":"動詞","m":"高める"}]},{"id":385,"category":"動詞問題・実戦問題 基本編","question":"Due to routine maintenance of the equipment, production ______ from March 31 to April 7.","A":"halt","B":"will be halted","C":"to halt","D":"have been halted","answer":"B","answer_word":"will be halted","explanation":"■ 文の骨格\nDue to routine maintenance of the equipment, production ______ from March 31 to April 7.\n\n■ 空所に入るもの\n主語 production は「止められる」側で、日付は今後の予定を表すので未来の受動態。\n→ 空所には「未来の受動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) halt … 動詞（原形）「止める」 ×\n(B) will be halted … 未来形（受動）「停止される」 ○\n(C) to halt … 不定詞「止めること」 ×\n(D) have been halted … 現在完了受動態（複数対応）「停止されてきた」 ×\n\n■ 完成文\nDue to routine maintenance of the equipment, production will be halted from March 31 to April 7.\n（機器の定期点検のため、3月31日から4月7日まで生産は停止される。）\n\n■ 解き方のポイント\n主語が「される側」なら受動態。production は単数なので have は不可。","words":[{"w":"routine maintenance","p":"名詞","m":"定期点検"},{"w":"equipment","p":"名詞","m":"機器"},{"w":"production","p":"名詞","m":"生産"},{"w":"will be halted","p":"未来受動態","m":"停止される"}]},{"id":386,"category":"動詞問題・実戦問題 基本編","question":"Lighting engineers have managed ______ most of the street lights in the community with brighter, longer lasting ones.","A":"replaced","B":"replacement","C":"had replaced","D":"to replace","answer":"D","answer_word":"to replace","explanation":"■ 文の骨格\nLighting engineers have managed ______ most of the street lights in the community with brighter, longer lasting ones.\n\n■ 空所に入るもの\nmanage to do（どうにか〜する）の形をとるので、不定詞が必要。\n→ 空所には「manage に続く不定詞」が必要です。\n\n■ 選択肢の確認\n(A) replaced … 動詞の過去形・過去分詞「交換された」 ×\n(B) replacement … 名詞「交換」 ×\n(C) had replaced … 過去完了形「交換していた」 ×\n(D) to replace … 不定詞「交換すること」 ○\n\n■ 完成文\nLighting engineers have managed to replace most of the street lights in the community with brighter, longer lasting ones.\n（照明技師たちは、地域のほとんどの街灯をより明るく長持ちするものに交換することをやり遂げた。）\n\n■ 解き方のポイント\nmanage / decide / plan / hope などは不定詞を目的語に取る。","words":[{"w":"Lighting engineers","p":"名詞","m":"照明技師"},{"w":"managed to","p":"熟語","m":"どうにか〜した"},{"w":"to replace","p":"不定詞","m":"交換すること"},{"w":"street lights","p":"名詞","m":"街灯"},{"w":"longer lasting","p":"形容詞句","m":"長持ちする"}]},{"id":387,"category":"動詞問題・実戦問題 基本編","question":"Uncle Joe's Café is one of the popular coffee chains ______ light meals in addition to coffees, teas, and other beverages.","A":"sell","B":"selling","C":"are selling","D":"will sell","answer":"B","answer_word":"selling","explanation":"■ 文の骨格\nUncle Joe's Café is one of the popular coffee chains ______ light meals in addition to coffees, teas, and other beverages.\n\n■ 空所に入るもの\n述語動詞 is がすでにあるため、空所は名詞 chains を修飾する分詞。chains が「売る」側なので能動。\n→ 空所には「名詞を後ろから修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) sell … 動詞（原形）「売る」 ×\n(B) selling … 現在分詞「売っている」 ○\n(C) are selling … 現在進行形「売っている」 ×\n(D) will sell … 未来形「売るだろう」 ×\n\n■ 完成文\nUncle Joe's Café is one of the popular coffee chains selling light meals in addition to coffees, teas, and other beverages.\n（Uncle Joe’s Café は、コーヒーや紅茶などの飲み物に加えて軽食も売る人気コーヒーチェーンの1つだ。）\n\n■ 解き方のポイント\n述語動詞がすでにある文では、動詞の形が問われたら分詞を疑う。","words":[{"w":"chains","p":"名詞","m":"チェーン店"},{"w":"selling","p":"現在分詞","m":"売っている"},{"w":"light meals","p":"名詞","m":"軽食"},{"w":"in addition to","p":"熟語","m":"〜に加えて"},{"w":"beverages","p":"名詞","m":"飲み物"}]},{"id":388,"category":"動詞問題・実戦問題 基本編","question":"The TBR Health Organization yesterday marked its 10th anniversary with a luncheon ______ its founding members.","A":"honor","B":"honors","C":"honored","D":"honoring","answer":"D","answer_word":"honoring","explanation":"■ 文の骨格\nThe TBR Health Organization yesterday marked its 10th anniversary with a luncheon ______ its founding members.\n\n■ 空所に入るもの\n名詞 a luncheon を後ろから修飾し、its founding members を目的語に取る語が必要。\n→ 空所には「名詞を後ろから修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) honor … 動詞（原形）／名詞「称える／名誉」 ×\n(B) honors … 動詞（三人称単数現在形）「称える」 ×\n(C) honored … 過去分詞「称えられた」 ×\n(D) honoring … 現在分詞「称える」 ○\n\n■ 完成文\nThe TBR Health Organization yesterday marked its 10th anniversary with a luncheon honoring its founding members.\n（TBR 保健機構は昨日、創設メンバーを称える昼食会を開いて10周年を祝った。）\n\n■ 解き方のポイント\n名詞の後ろで目的語を取る分詞は現在分詞。","words":[{"w":"marked","p":"動詞（過去形）","m":"祝った"},{"w":"anniversary","p":"名詞","m":"周年"},{"w":"luncheon","p":"名詞","m":"昼食会"},{"w":"honoring","p":"現在分詞","m":"称える"},{"w":"founding members","p":"名詞","m":"創設メンバー"}]},{"id":389,"category":"動詞問題・実戦問題 基本編","question":"Please note that the entrance to the visitor's parking lot ______ on Binkley Avenue adjacent to the Blanton Student Service Building.","A":"locates","B":"locating","C":"was locating","D":"is located","answer":"D","answer_word":"is located","explanation":"■ 文の骨格\nPlease note that the entrance to the visitor's parking lot ______ on Binkley Avenue adjacent to the Blanton Student Service Building.\n\n■ 空所に入るもの\nbe located on＝「〜に位置している」という受動の定型表現になる。\n→ 空所には「受動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) locates … 動詞（三人称単数現在形）「位置づける」 ×\n(B) locating … 現在分詞・動名詞「位置づけること」 ×\n(C) was locating … 過去進行形「位置づけていた」 ×\n(D) is located … 受動態（現在形）「位置している」 ○\n\n■ 完成文\nPlease note that the entrance to the visitor's parking lot is located on Binkley Avenue adjacent to the Blanton Student Service Building.\n（来客用駐車場の入口は、Blanton 学生サービス棟に隣接する Binkley 通りにありますのでご注意ください。）\n\n■ 解き方のポイント\nbe located／be situated は「位置している」を表す受動の定型。","words":[{"w":"entrance","p":"名詞","m":"入口"},{"w":"parking lot","p":"名詞","m":"駐車場"},{"w":"is located","p":"受動態","m":"位置している"},{"w":"adjacent to","p":"熟語","m":"〜に隣接する"}]},{"id":390,"category":"動詞問題・実戦問題 基本編","question":"The Lewiston Football Team is ______ mostly through the generous donations of local residents and businesses.","A":"fund","B":"funded","C":"funding","D":"funds","answer":"B","answer_word":"funded","explanation":"■ 文の骨格\nThe Lewiston Football Team is ______ mostly through the generous donations of local residents and businesses.\n\n■ 空所に入るもの\nis の後ろで、主語 Team は「資金提供される」側なので過去分詞が必要。\n→ 空所には「受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) fund … 動詞（原形）／名詞「資金を出す／基金」 ×\n(B) funded … 過去分詞「資金提供された」 ○\n(C) funding … 現在分詞・動名詞「資金を出すこと」 ×\n(D) funds … 動詞（三人称単数現在形）／名詞（複数形）「資金を出す／資金」 ×\n\n■ 完成文\nThe Lewiston Football Team is funded mostly through the generous donations of local residents and businesses.\n（Lewiston フットボールチームは、主に地元住民と企業からの寛大な寄付によって資金がまかなわれている。）\n\n■ 解き方のポイント\nthrough／by で「〜によって」とあれば受動態。","words":[{"w":"funded","p":"過去分詞","m":"資金提供された"},{"w":"mostly","p":"副詞","m":"主に"},{"w":"generous","p":"形容詞","m":"寛大な"},{"w":"donations","p":"名詞","m":"寄付"},{"w":"residents","p":"名詞","m":"住民"}]},{"id":391,"category":"動詞問題・実戦問題 基本編","question":"Unlike their competitors, Wealth Furniture has been successful at ______ a position as a premium brand among wealthy customers.","A":"establish","B":"establishes","C":"establishing","D":"established","answer":"C","answer_word":"establishing","explanation":"■ 文の骨格\nUnlike their competitors, Wealth Furniture has been successful at ______ a position as a premium brand among wealthy customers.\n\n■ 空所に入るもの\n前置詞 at の後ろで、さらに目的語 a position を取るので動名詞が必要。\n→ 空所には「前置詞 at の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) establish … 動詞（原形）「確立する」 ×\n(B) establishes … 動詞（三人称単数現在形）「確立する」 ×\n(C) establishing … 動名詞「確立すること」 ○\n(D) established … 動詞の過去形・過去分詞「確立された」 ×\n\n■ 完成文\nUnlike their competitors, Wealth Furniture has been successful at establishing a position as a premium brand among wealthy customers.\n（競合他社と異なり、Wealth Furniture 社は富裕層の顧客の間で高級ブランドとしての地位を確立することに成功している。）\n\n■ 解き方のポイント\nbe successful at [in] doing の形。前置詞の後ろは動名詞。","words":[{"w":"Unlike","p":"前置詞","m":"〜と違って"},{"w":"competitors","p":"名詞","m":"競合他社"},{"w":"establishing","p":"動名詞","m":"確立すること"},{"w":"premium brand","p":"名詞","m":"高級ブランド"},{"w":"wealthy","p":"形容詞","m":"富裕な"}]},{"id":392,"category":"動詞問題・実戦問題 基本編","question":"Cherry Bank plans to upgrade its core processing system within a year ______ the quality of its service.","A":"enhance","B":"has enhanced","C":"will enhance","D":"to enhance","answer":"D","answer_word":"to enhance","explanation":"■ 文の骨格\nCherry Bank plans to upgrade its core processing system within a year ______ the quality of its service.\n\n■ 空所に入るもの\n空所の前で文が完成しており、「〜するために」を表す不定詞が入る。\n→ 空所には「目的を表す不定詞」が必要です。\n\n■ 選択肢の確認\n(A) enhance … 動詞（原形）「高める」 ×\n(B) has enhanced … 現在完了形「高めてきた」 ×\n(C) will enhance … 未来形「高めるだろう」 ×\n(D) to enhance … 不定詞「高めるために」 ○\n\n■ 完成文\nCherry Bank plans to upgrade its core processing system within a year to enhance the quality of its service.\n（Cherry 銀行は、サービスの質を高めるため、1年以内に基幹処理システムを更新する計画だ。）\n\n■ 解き方のポイント\n文が完成した後ろで目的を表すのは不定詞。述語動詞はもう入らない。","words":[{"w":"upgrade","p":"動詞","m":"更新する"},{"w":"core processing system","p":"名詞","m":"基幹処理システム"},{"w":"to enhance","p":"不定詞","m":"高めるために"},{"w":"quality","p":"名詞","m":"質"}]},{"id":393,"category":"動詞問題・実戦問題 基本編","question":"All vacation time should be at a time agreeable to both the staff member and the supervisor and ______ well in advance.","A":"request","B":"requesting","C":"requested","D":"requests","answer":"C","answer_word":"requested","explanation":"■ 文の骨格\nAll vacation time should be at a time agreeable to both the staff member and the supervisor and ______ well in advance.\n\n■ 空所に入るもの\nshould be の後ろに and で並列される要素で、休暇は「申請される」側なので過去分詞。\n→ 空所には「be動詞に続く過去分詞（並列）」が必要です。\n\n■ 選択肢の確認\n(A) request … 動詞（原形）／名詞「申請する／要望」 ×\n(B) requesting … 現在分詞・動名詞「申請すること」 ×\n(C) requested … 過去分詞「申請された」 ○\n(D) requests … 動詞（三人称単数現在形）／名詞（複数形）「申請する／要望」 ×\n\n■ 完成文\nAll vacation time should be at a time agreeable to both the staff member and the supervisor and requested well in advance.\n（休暇はすべて、職員と上司の双方が了承できる時期に取り、十分前もって申請しなければならない。）\n\n■ 解き方のポイント\nshould be A and (be) B の並列。and の前後は同じ形。","words":[{"w":"vacation time","p":"名詞","m":"休暇"},{"w":"agreeable to","p":"熟語","m":"〜が了承できる"},{"w":"supervisor","p":"名詞","m":"上司"},{"w":"requested","p":"過去分詞","m":"申請された"},{"w":"in advance","p":"熟語","m":"前もって"}]},{"id":394,"category":"動詞問題・実戦問題 基本編","question":"All staff members agree that Ms. Smith's dedication to the company ______ her promotion to the position of vice president.","A":"justify","B":"justifying","C":"justifies","D":"justification","answer":"C","answer_word":"justifies","explanation":"■ 文の骨格\nAll staff members agree that Ms. Smith's dedication to the company ______ her promotion to the position of vice president.\n\n■ 空所に入るもの\nthat 節の主語 dedication は単数なので、動詞に -s が必要。\n→ 空所には「単数主語に対応する述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) justify … 動詞（原形・複数対応）「正当化する」 ×\n(B) justifying … 現在分詞・動名詞「正当化すること」 ×\n(C) justifies … 動詞（三人称単数現在形）「正当化する」 ○\n(D) justification … 名詞「正当化、根拠」 ×\n\n■ 完成文\nAll staff members agree that Ms. Smith's dedication to the company justifies her promotion to the position of vice president.\n（Smith さんの会社への献身は副社長職への昇進に十分値すると、職員全員が認めている。）\n\n■ 解き方のポイント\n長い主語では核となる名詞（ここでは dedication）の単複を見る。","words":[{"w":"dedication","p":"名詞","m":"献身"},{"w":"justifies","p":"動詞","m":"正当化する"},{"w":"promotion","p":"名詞","m":"昇進"},{"w":"vice president","p":"名詞","m":"副社長"}]},{"id":395,"category":"動詞問題・実戦問題 基本編","question":"Please save all of your work to an external drive so that old computers ______ over the weekend.","A":"replace","B":"were replaced","C":"can replace","D":"can be replaced","answer":"D","answer_word":"can be replaced","explanation":"■ 文の骨格\nPlease save all of your work to an external drive so that old computers ______ over the weekend.\n\n■ 空所に入るもの\n主語 old computers は「交換される」側なので、can＋be＋過去分詞が必要。\n→ 空所には「助動詞に続く受動態」が必要です。\n\n■ 選択肢の確認\n(A) replace … 動詞（原形・能動）「交換する」 ×\n(B) were replaced … 受動態（過去形）「交換された」 ×\n(C) can replace … 助動詞＋能動「交換できる」 ×\n(D) can be replaced … 助動詞＋受動「交換されうる」 ○\n\n■ 完成文\nPlease save all of your work to an external drive so that old computers can be replaced over the weekend.\n（週末に古いコンピュータを交換できるよう、作業データはすべて外付けドライブに保存してください。）\n\n■ 解き方のポイント\nso that S can V の形。主語が「される側」なら can be＋過去分詞。","words":[{"w":"save","p":"動詞","m":"保存する"},{"w":"external drive","p":"名詞","m":"外付けドライブ"},{"w":"can be replaced","p":"助動詞＋受動態","m":"交換されうる"},{"w":"over the weekend","p":"熟語","m":"週末の間に"}]},{"id":396,"category":"動詞問題・実戦問題 基本編","question":"Collectible items from the old stadium, including seats, signage, and benches, will ______ online from 6 P.M. next Wednesday.","A":"be sold","B":"have been sold","C":"selling","D":"have been selling","answer":"A","answer_word":"be sold","explanation":"■ 文の骨格\nCollectible items from the old stadium, including seats, signage, and benches, will ______ online from 6 P.M. next Wednesday.\n\n■ 空所に入るもの\n助動詞 will の後ろで、主語 items は「売られる」側なので be＋過去分詞。\n→ 空所には「助動詞に続く受動態の原形」が必要です。\n\n■ 選択肢の確認\n(A) be sold … 受動態（原形）「販売される」 ○\n(B) have been sold … 現在完了受動態「販売された」 ×\n(C) selling … 現在分詞・動名詞「売ること」 ×\n(D) have been selling … 現在完了進行形「売り続けている」 ×\n\n■ 完成文\nCollectible items from the old stadium, including seats, signage, and benches, will be sold online from 6 P.M. next Wednesday.\n（旧スタジアムの座席・看板・ベンチなどの収集品は、来週水曜の午後6時からオンラインで販売される。）\n\n■ 解き方のポイント\n助動詞の後ろは原形。will have been sold のように助動詞＋完了形にすると時制が合わない。","words":[{"w":"Collectible items","p":"名詞","m":"収集品"},{"w":"stadium","p":"名詞","m":"スタジアム"},{"w":"signage","p":"名詞","m":"看板"},{"w":"be sold","p":"受動態（原形）","m":"販売される"}]},{"id":397,"category":"動詞問題・実戦問題 基本編","question":"If time ______, visit the local train museum, where railway enthusiasts have constructed a model of the famous Japanese Bullet Train.","A":"allow","B":"allows","C":"allowed","D":"allowing","answer":"B","answer_word":"allows","explanation":"■ 文の骨格\nIf time ______, visit the local train museum, where railway enthusiasts have constructed a model of the famous Japanese Bullet Train.\n\n■ 空所に入るもの\nIf 節の主語 time は単数扱いなので、動詞に -s が必要。\n→ 空所には「単数主語に対応する述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) allow … 動詞（原形・複数対応）「許す」 ×\n(B) allows … 動詞（三人称単数現在形）「許す」 ○\n(C) allowed … 動詞の過去形・過去分詞「許した」 ×\n(D) allowing … 現在分詞・動名詞「許すこと」 ×\n\n■ 完成文\nIf time allows, visit the local train museum, where railway enthusiasts have constructed a model of the famous Japanese Bullet Train.\n（時間が許せば、鉄道愛好家が有名な日本の新幹線の模型を作った地元の鉄道博物館を訪れてみてください。）\n\n■ 解き方のポイント\nif time allows＝「時間が許せば」。条件節では未来のことも現在形で表す。","words":[{"w":"allows","p":"動詞","m":"許す"},{"w":"railway enthusiasts","p":"名詞","m":"鉄道愛好家"},{"w":"constructed","p":"動詞（過去分詞）","m":"作った"},{"w":"model","p":"名詞","m":"模型"},{"w":"Bullet Train","p":"名詞","m":"新幹線"}]},{"id":398,"category":"動詞問題・実戦問題 基本編","question":"Arnold Insurance is pleased to announce that the firm ______ with Drakes Ltd. by the end of the month.","A":"has merged","B":"was merging","C":"will have merged","D":"had been merging","answer":"C","answer_word":"will have merged","explanation":"■ 文の骨格\nArnold Insurance is pleased to announce that the firm ______ with Drakes Ltd. by the end of the month.\n\n■ 空所に入るもの\nby the end of the month（月末までに）は「その時点までに完了している」ことを表すので未来完了。\n→ 空所には「未来完了形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) has merged … 現在完了形「合併した」 ×\n(B) was merging … 過去進行形「合併しつつあった」 ×\n(C) will have merged … 未来完了形「合併し終えているだろう」 ○\n(D) had been merging … 過去完了進行形「合併し続けていた」 ×\n\n■ 完成文\nArnold Insurance is pleased to announce that the firm will have merged with Drakes Ltd. by the end of the month.\n（Arnold 保険は、月末までに Drakes 社との合併を完了する見込みであることをお知らせします。）\n\n■ 解き方のポイント\nby＋未来の時点＋完了の意味 → 未来完了形〈will have＋過去分詞〉。","words":[{"w":"Insurance","p":"名詞","m":"保険"},{"w":"pleased to","p":"熟語","m":"喜んで〜する"},{"w":"firm","p":"名詞","m":"会社"},{"w":"will have merged","p":"未来完了","m":"合併し終えている"}]},{"id":399,"category":"動詞問題・実戦問題 基本編","question":"No matter what type of heating system you choose, it needs to be professionally ______ for optimal performance.","A":"install","B":"installing","C":"installation","D":"installed","answer":"D","answer_word":"installed","explanation":"■ 文の骨格\nNo matter what type of heating system you choose, it needs to be professionally ______ for optimal performance.\n\n■ 空所に入るもの\nto be の後ろで、主語 it（暖房システム）は「設置される」側なので過去分詞が必要。\n→ 空所には「受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) install … 動詞（原形）「設置する」 ×\n(B) installing … 現在分詞・動名詞「設置すること」 ×\n(C) installation … 名詞「設置」 ×\n(D) installed … 過去分詞「設置された」 ○\n\n■ 完成文\nNo matter what type of heating system you choose, it needs to be professionally installed for optimal performance.\n（どのタイプの暖房システムを選んでも、性能を最大限に引き出すには専門業者による設置が必要だ。）\n\n■ 解き方のポイント\n〈be＋副詞＋空所〉で主語が「される側」なら過去分詞。","words":[{"w":"No matter what","p":"熟語","m":"どんな〜でも"},{"w":"heating system","p":"名詞","m":"暖房システム"},{"w":"professionally","p":"副詞","m":"専門的に"},{"w":"installed","p":"過去分詞","m":"設置された"},{"w":"optimal","p":"形容詞","m":"最適な"}]},{"id":400,"category":"動詞問題・実戦問題 基本編","question":"Join the workshop and learn from master painter Claudia Morales as she ______ acrylic landscape painting on November 12.","A":"demonstrating","B":"demonstrated","C":"demonstrate","D":"demonstrates","answer":"D","answer_word":"demonstrates","explanation":"■ 文の骨格\nJoin the workshop and learn from master painter Claudia Morales as she ______ acrylic landscape painting on November 12.\n\n■ 空所に入るもの\nas 節の主語 she は三人称単数なので、動詞に -s が必要。\n→ 空所には「単数主語に対応する述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) demonstrating … 現在分詞・動名詞「実演すること」 ×\n(B) demonstrated … 動詞の過去形・過去分詞「実演した」 ×\n(C) demonstrate … 動詞（原形）「実演する」 ×\n(D) demonstrates … 動詞（三人称単数現在形）「実演する」 ○\n\n■ 完成文\nJoin the workshop and learn from master painter Claudia Morales as she demonstrates acrylic landscape painting on November 12.\n（11月12日のワークショップに参加し、巨匠 Claudia Morales がアクリル風景画を実演するのを見て学びましょう。）\n\n■ 解き方のポイント\n接続詞 as の後ろも〈主語＋動詞〉。主語の人称・数に動詞を合わせる。","words":[{"w":"Join","p":"動詞","m":"参加する"},{"w":"master painter","p":"名詞","m":"巨匠画家"},{"w":"demonstrates","p":"動詞","m":"実演する"},{"w":"acrylic","p":"形容詞","m":"アクリルの"},{"w":"landscape painting","p":"名詞","m":"風景画"}]},{"id":401,"category":"動詞問題・実戦問題 基本編","question":"Later this month, Mr. Schmidt will travel to Hamburg, where his schedule ______ a client meeting, a news conference, and dinner with the mayor.","A":"include","B":"is included","C":"including","D":"includes","answer":"D","answer_word":"includes","explanation":"■ 文の骨格\nLater this month, Mr. Schmidt will travel to Hamburg, where his schedule ______ a client meeting, a news conference, and dinner with the mayor.\n\n■ 空所に入るもの\nwhere 節の主語 his schedule は単数なので、動詞に -s が必要。\n→ 空所には「単数主語に対応する述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) include … 動詞（原形・複数対応）「含む」 ×\n(B) is included … 受動態「含まれる」 ×\n(C) including … 現在分詞・動名詞「含むこと」 ×\n(D) includes … 動詞（三人称単数現在形）「含む」 ○\n\n■ 完成文\nLater this month, Mr. Schmidt will travel to Hamburg, where his schedule includes a client meeting, a news conference, and dinner with the mayor.\n（今月後半、Schmidt さんはハンブルクへ出張し、そこでの予定には顧客との打ち合わせ、記者会見、市長との夕食が含まれる。）\n\n■ 解き方のポイント\n直後に目的語が3つ並ぶので能動態。主語 schedule は単数。","words":[{"w":"schedule","p":"名詞","m":"予定"},{"w":"includes","p":"動詞","m":"含む"},{"w":"client meeting","p":"名詞","m":"顧客との打ち合わせ"},{"w":"news conference","p":"名詞","m":"記者会見"},{"w":"mayor","p":"名詞","m":"市長"}]},{"id":402,"category":"動詞問題・実戦問題 基本編","question":"Earlier this year, the International Wilderness Conservation Society ______ over 10,000 species for their ability to survive climate change.","A":"evaluates","B":"evaluated","C":"has evaluated","D":"will evaluate","answer":"B","answer_word":"evaluated","explanation":"■ 文の骨格\nEarlier this year, the International Wilderness Conservation Society ______ over 10,000 species for their ability to survive climate change.\n\n■ 空所に入るもの\nEarlier this year（今年これまでに）は過去を表すので、動詞は過去形。\n→ 空所には「過去形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) evaluates … 現在形「評価する」 ×\n(B) evaluated … 動詞（過去形）「評価した」 ○\n(C) has evaluated … 現在完了形「評価してきた」 ×\n(D) will evaluate … 未来形「評価するだろう」 ×\n\n■ 完成文\nEarlier this year, the International Wilderness Conservation Society evaluated over 10,000 species for their ability to survive climate change.\n（今年初め、国際原生自然保護協会は1万種以上について、気候変動を生き延びる能力を評価した。）\n\n■ 解き方のポイント\n時を表す語句から時制を決める。earlier this year は過去。","words":[{"w":"Conservation","p":"名詞","m":"保護"},{"w":"evaluated","p":"動詞（過去形）","m":"評価した"},{"w":"species","p":"名詞","m":"（生物の）種"},{"w":"survive","p":"動詞","m":"生き延びる"},{"w":"climate change","p":"名詞","m":"気候変動"}]},{"id":403,"category":"動詞問題・実戦問題 基本編","question":"Mr. Wood predicts the construction cost for the new city library ______ the budget approved by the city.","A":"has surpassed","B":"will surpass","C":"surpass","D":"surpassing","answer":"B","answer_word":"will surpass","explanation":"■ 文の骨格\nMr. Wood predicts the construction cost for the new city library ______ the budget approved by the city.\n\n■ 空所に入るもの\npredict（予測する）の内容なので、これから起こることを表す未来形が必要。\n→ 空所には「未来を表す述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) has surpassed … 現在完了形「上回った」 ×\n(B) will surpass … 未来形「上回るだろう」 ○\n(C) surpass … 動詞（原形）「上回る」 ×\n(D) surpassing … 現在分詞・動名詞「上回ること」 ×\n\n■ 完成文\nMr. Wood predicts the construction cost for the new city library will surpass the budget approved by the city.\n（Wood 氏は、新しい市立図書館の建設費が市の承認した予算を上回るだろうと予測している。）\n\n■ 解き方のポイント\npredict / expect / believe に続く節の内容が未来なら未来形。","words":[{"w":"predicts","p":"動詞","m":"予測する"},{"w":"construction cost","p":"名詞","m":"建設費"},{"w":"will surpass","p":"未来形","m":"上回るだろう"},{"w":"budget","p":"名詞","m":"予算"},{"w":"approved","p":"過去分詞","m":"承認された"}]},{"id":404,"category":"動詞問題・実戦問題 基本編","question":"The agreement that was reached ______ the company to continue selling products featuring the characters from a popular cartoon.","A":"allow","B":"allowable","C":"allowing","D":"allowed","answer":"D","answer_word":"allowed","explanation":"■ 文の骨格\nThe agreement that was reached ______ the company to continue selling products featuring the characters from a popular cartoon.\n\n■ 空所に入るもの\n主語 The agreement に対する述語動詞が欠けている。that was reached は関係詞節。\n→ 空所には「過去形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) allow … 動詞（原形・複数対応）「可能にする」 ×\n(B) allowable … 形容詞「許容できる」 ×\n(C) allowing … 現在分詞・動名詞「可能にすること」 ×\n(D) allowed … 動詞（過去形）「可能にした」 ○\n\n■ 完成文\nThe agreement that was reached allowed the company to continue selling products featuring the characters from a popular cartoon.\n（成立した合意により、その企業は人気漫画のキャラクターを使った製品の販売を継続できるようになった。）\n\n■ 解き方のポイント\n関係詞節を外して主語と述語を確認する。The agreement ______ the company の形。","words":[{"w":"agreement","p":"名詞","m":"合意"},{"w":"reached","p":"動詞（過去分詞）","m":"達成された"},{"w":"allowed","p":"動詞（過去形）","m":"可能にした"},{"w":"featuring","p":"現在分詞","m":"〜を使った"},{"w":"cartoon","p":"名詞","m":"漫画、アニメ"}]},{"id":405,"category":"動詞問題・実戦問題 基本編","question":"Once all entries have been submitted, Daniel Miller, the advertising director, ______ the winning slogan.","A":"choose","B":"has chosen","C":"was choosing","D":"will choose","answer":"D","answer_word":"will choose","explanation":"■ 文の骨格\nOnce all entries have been submitted, Daniel Miller, the advertising director, ______ the winning slogan.\n\n■ 空所に入るもの\nOnce 節が「提出され次第」という今後の話なので、主節は未来形になる。\n→ 空所には「未来を表す述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) choose … 動詞（原形・複数対応）「選ぶ」 ×\n(B) has chosen … 現在完了形「選んだ」 ×\n(C) was choosing … 過去進行形「選んでいた」 ×\n(D) will choose … 未来形「選ぶだろう」 ○\n\n■ 完成文\nOnce all entries have been submitted, Daniel Miller, the advertising director, will choose the winning slogan.\n（すべての応募が提出され次第、広告担当ディレクターの Daniel Miller が最優秀のキャッチコピーを選ぶ。）\n\n■ 解き方のポイント\n時・条件を表す副詞節では現在形（完了形）を使い、主節は未来形にする。","words":[{"w":"Once","p":"接続詞","m":"いったん〜すれば"},{"w":"entries","p":"名詞","m":"応募作品"},{"w":"advertising director","p":"名詞","m":"広告担当ディレクター"},{"w":"will choose","p":"未来形","m":"選ぶだろう"},{"w":"slogan","p":"名詞","m":"キャッチコピー"}]},{"id":406,"category":"動詞問題・実戦問題 基本編","question":"As of tomorrow, new security procedures will ______ to minimize the number of staff with access to confidential data files.","A":"be implemented","B":"implementing","C":"implements","D":"have implemented","answer":"A","answer_word":"be implemented","explanation":"■ 文の骨格\nAs of tomorrow, new security procedures will ______ to minimize the number of staff with access to confidential data files.\n\n■ 空所に入るもの\n助動詞 will の後ろで、主語 procedures は「施行される」側なので be＋過去分詞。\n→ 空所には「助動詞に続く受動態の原形」が必要です。\n\n■ 選択肢の確認\n(A) be implemented … 受動態（原形）「施行される」 ○\n(B) implementing … 現在分詞・動名詞「施行すること」 ×\n(C) implements … 動詞（三人称単数現在形）「施行する」 ×\n(D) have implemented … 現在完了形（能動）「施行してきた」 ×\n\n■ 完成文\nAs of tomorrow, new security procedures will be implemented to minimize the number of staff with access to confidential data files.\n（明日より、機密データファイルにアクセスできる職員の数を最小限にするため、新しいセキュリティ手順が施行される。）\n\n■ 解き方のポイント\n〈助動詞＋be＋過去分詞〉で助動詞を含む受動態。","words":[{"w":"As of","p":"熟語","m":"〜より、〜時点で"},{"w":"security procedures","p":"名詞","m":"セキュリティ手順"},{"w":"be implemented","p":"受動態（原形）","m":"施行される"},{"w":"minimize","p":"動詞","m":"最小限にする"},{"w":"confidential","p":"形容詞","m":"機密の"}]},{"id":407,"category":"動詞問題・実戦問題 基本編","question":"A reminder about security was sent to staff after a document containing personal information ______ in a meeting room last week.","A":"left","B":"is being left","C":"was left","D":"has left","answer":"C","answer_word":"was left","explanation":"■ 文の骨格\nA reminder about security was sent to staff after a document containing personal information ______ in a meeting room last week.\n\n■ 空所に入るもの\nafter 節の主語 a document は「置き忘れられる」側で、last week があるので過去の受動態。\n→ 空所には「過去の受動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) left … 動詞の過去形・過去分詞「置いた」 ×\n(B) is being left … 受動進行形（現在）「置き去りにされつつある」 ×\n(C) was left … 受動態（過去形）「置き忘れられた」 ○\n(D) has left … 現在完了形（能動）「去った」 ×\n\n■ 完成文\nA reminder about security was sent to staff after a document containing personal information was left in a meeting room last week.\n（先週、個人情報を含む書類が会議室に置き忘れられたことを受けて、セキュリティに関する注意喚起が職員へ送られた。）\n\n■ 解き方のポイント\nlast week があるので過去。書類は「置かれる」側なので受動態。","words":[{"w":"reminder","p":"名詞","m":"注意喚起"},{"w":"containing","p":"現在分詞","m":"含んでいる"},{"w":"personal information","p":"名詞","m":"個人情報"},{"w":"was left","p":"受動態（過去）","m":"置き忘れられた"}]},{"id":408,"category":"動詞問題・実戦問題 基本編","question":"All successful candidates ______ a letter of acceptance within a week of their interview.","A":"sent","B":"sending","C":"will be sent","D":"have sent","answer":"C","answer_word":"will be sent","explanation":"■ 文の骨格\nAll successful candidates ______ a letter of acceptance within a week of their interview.\n\n■ 空所に入るもの\n主語 candidates は「送られる」側で、面接後の話なので未来の受動態。\n→ 空所には「未来の受動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) sent … 動詞の過去形・過去分詞「送った」 ×\n(B) sending … 現在分詞・動名詞「送ること」 ×\n(C) will be sent … 未来形（受動）「送られる」 ○\n(D) have sent … 現在完了形（能動）「送った」 ×\n\n■ 完成文\nAll successful candidates will be sent a letter of acceptance within a week of their interview.\n（合格した応募者には全員、面接から1週間以内に採用通知が送られる。）\n\n■ 解き方のポイント\nsend は〈人＋物〉の2目的語を取るので、人を主語にした受動態でも後ろに物が残る。","words":[{"w":"successful candidates","p":"名詞","m":"合格した応募者"},{"w":"will be sent","p":"未来受動態","m":"送られる"},{"w":"letter of acceptance","p":"名詞","m":"採用通知"},{"w":"interview","p":"名詞","m":"面接"}]},{"id":409,"category":"動詞問題・実戦問題 基本編","question":"The company announced the appointment of Mr. Ishikawa as the new CEO, hoping it ______ its falling share price.","A":"improve","B":"would improve","C":"was improved","D":"improving","answer":"B","answer_word":"would improve","explanation":"■ 文の骨格\nThe company announced the appointment of Mr. Ishikawa as the new CEO, hoping it ______ its falling share price.\n\n■ 空所に入るもの\n主節が過去形 announced なので、hoping 以下の節も過去から見た未来（would＋原形）になる。\n→ 空所には「時制の一致に合う助動詞＋動詞」が必要です。\n\n■ 選択肢の確認\n(A) improve … 動詞（原形）「改善する」 ×\n(B) would improve … 過去から見た未来「改善するだろう」 ○\n(C) was improved … 受動態（過去）「改善された」 ×\n(D) improving … 現在分詞・動名詞「改善すること」 ×\n\n■ 完成文\nThe company announced the appointment of Mr. Ishikawa as the new CEO, hoping it would improve its falling share price.\n（同社は、下落する株価が改善することを期待して、Ishikawa 氏の新 CEO 就任を発表した。）\n\n■ 解き方のポイント\n主節が過去なら従属節も過去に合わせる（時制の一致）。will → would。","words":[{"w":"appointment","p":"名詞","m":"就任、任命"},{"w":"hoping","p":"現在分詞","m":"期待して"},{"w":"would improve","p":"助動詞＋動詞","m":"改善するだろう"},{"w":"falling","p":"形容詞","m":"下落する"},{"w":"share price","p":"名詞","m":"株価"}]},{"id":410,"category":"動詞問題・実戦問題 基本編","question":"A banquet will be organized for those who ______ in the project to celebrate its completion.","A":"involve","B":"are involving","C":"are to involve","D":"have been involved","answer":"D","answer_word":"have been involved","explanation":"■ 文の骨格\nA banquet will be organized for those who ______ in the project to celebrate its completion.\n\n■ 空所に入るもの\n関係代名詞 who の先行詞 those は「関わってもらった」側なので受動態が必要。\n→ 空所には「受動態の述語動詞（現在完了）」が必要です。\n\n■ 選択肢の確認\n(A) involve … 動詞（原形・能動）「巻き込む」 ×\n(B) are involving … 現在進行形（能動）「巻き込んでいる」 ×\n(C) are to involve … 予定を表す形（能動）「巻き込む予定である」 ×\n(D) have been involved … 現在完了受動態「関わってきた」 ○\n\n■ 完成文\nA banquet will be organized for those who have been involved in the project to celebrate its completion.\n（プロジェクトの完了を祝うため、そこに関わった人たちのための祝賀会が催される。）\n\n■ 解き方のポイント\nbe involved in X＝「Xに関わる」。involve は他動詞なので、人が主語なら受動態。","words":[{"w":"banquet","p":"名詞","m":"祝賀会"},{"w":"organized","p":"動詞（過去分詞）","m":"催される"},{"w":"have been involved","p":"現在完了受動態","m":"関わってきた"},{"w":"celebrate","p":"動詞","m":"祝う"},{"w":"completion","p":"名詞","m":"完了"}]},{"id":411,"category":"動詞問題・実戦問題 基本編","question":"Mr. Yokoyama received a letter from a customer who ______ with the service offered at his café.","A":"was satisfied","B":"satisfies","C":"has satisfied","D":"satisfied","answer":"A","answer_word":"was satisfied","explanation":"■ 文の骨格\nMr. Yokoyama received a letter from a customer who ______ with the service offered at his café.\n\n■ 空所に入るもの\n先行詞 a customer は「満足させられる」側なので受動態。主節が過去形なので過去に合わせる。\n→ 空所には「受動態の述語動詞（過去形）」が必要です。\n\n■ 選択肢の確認\n(A) was satisfied … 受動態（過去形）「満足していた」 ○\n(B) satisfies … 動詞（三人称単数現在形）「満足させる」 ×\n(C) has satisfied … 現在完了形（能動）「満足させた」 ×\n(D) satisfied … 動詞（過去形・能動）「満足させた」 ×\n\n■ 完成文\nMr. Yokoyama received a letter from a customer who was satisfied with the service offered at his café.\n（Yokoyama さんは、彼のカフェで提供されたサービスに満足した客から手紙を受け取った。）\n\n■ 解き方のポイント\nbe satisfied with X＝「Xに満足している」。感情の動詞は人が主語なら受動態。","words":[{"w":"received","p":"動詞（過去形）","m":"受け取った"},{"w":"was satisfied","p":"受動態","m":"満足していた"},{"w":"service","p":"名詞","m":"サービス"},{"w":"offered","p":"過去分詞","m":"提供された"}]},{"id":412,"category":"動詞問題・実戦問題 基本編","question":"The new CEO ______ by analysts and investors for quickly turning around his company's mobile phone business.","A":"praises","B":"has praised","C":"has been praising","D":"has been praised","answer":"D","answer_word":"has been praised","explanation":"■ 文の骨格\nThe new CEO ______ by analysts and investors for quickly turning around his company's mobile phone business.\n\n■ 空所に入るもの\n主語 The new CEO は「称賛される」側で、by ... があるので受動態が必要。\n→ 空所には「現在完了の受動態」が必要です。\n\n■ 選択肢の確認\n(A) praises … 動詞（三人称単数現在形・能動）「称賛する」 ×\n(B) has praised … 現在完了形（能動）「称賛した」 ×\n(C) has been praising … 現在完了進行形（能動）「称賛し続けている」 ×\n(D) has been praised … 現在完了受動態「称賛されてきた」 ○\n\n■ 完成文\nThe new CEO has been praised by analysts and investors for quickly turning around his company's mobile phone business.\n（新しい CEO は、自社の携帯電話事業を素早く立て直したことで、アナリストや投資家から高く評価されている。）\n\n■ 解き方のポイント\nby ＋行為者 は受動態の目印。〈has been＋過去分詞〉が現在完了の受動態。","words":[{"w":"analysts","p":"名詞","m":"アナリスト"},{"w":"investors","p":"名詞","m":"投資家"},{"w":"has been praised","p":"現在完了受動態","m":"称賛されてきた"},{"w":"turning around","p":"熟語","m":"立て直すこと"}]},{"id":413,"category":"動詞問題・実戦問題 基本編","question":"All of the statistics published in the report ______ by experts from the University of Hartford.","A":"were verified","B":"has verified","C":"verifying","D":"verified","answer":"A","answer_word":"were verified","explanation":"■ 文の骨格\nAll of the statistics published in the report ______ by experts from the University of Hartford.\n\n■ 空所に入るもの\n主語 All of the statistics は複数で「検証される」側。published 以下は主語を修飾する分詞。\n→ 空所には「過去の受動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) were verified … 受動態（過去形・複数）「検証された」 ○\n(B) has verified … 現在完了形（単数・能動）「検証した」 ×\n(C) verifying … 現在分詞・動名詞「検証すること」 ×\n(D) verified … 動詞の過去形・過去分詞（能動）「検証した」 ×\n\n■ 完成文\nAll of the statistics published in the report were verified by experts from the University of Hartford.\n（報告書で公表された統計値はすべて、Hartford 大学の専門家によって検証された。）\n\n■ 解き方のポイント\n主語の後ろの分詞句にだまされない。核となる主語 statistics は複数。","words":[{"w":"statistics","p":"名詞","m":"統計値"},{"w":"published","p":"過去分詞","m":"公表された"},{"w":"were verified","p":"受動態（過去）","m":"検証された"},{"w":"experts","p":"名詞","m":"専門家"}]},{"id":414,"category":"動詞問題・実戦問題 基本編","question":"The priority of the fire department ______ the highest level of service to the citizens of Brewster and surrounding areas.","A":"provide","B":"is provided","C":"is to provide","D":"will have provided","answer":"C","answer_word":"is to provide","explanation":"■ 文の骨格\nThe priority of the fire department ______ the highest level of service to the citizens of Brewster and surrounding areas.\n\n■ 空所に入るもの\n主語 The priority の内容を説明する補語が必要で、「〜すること」を表す不定詞が入る。\n→ 空所には「be動詞＋不定詞（補語）」が必要です。\n\n■ 選択肢の確認\n(A) provide … 動詞（原形・複数対応）「提供する」 ×\n(B) is provided … 受動態「提供される」 ×\n(C) is to provide … be動詞＋不定詞「提供することである」 ○\n(D) will have provided … 未来完了形「提供し終えているだろう」 ×\n\n■ 完成文\nThe priority of the fire department is to provide the highest level of service to the citizens of Brewster and surrounding areas.\n（消防署の最優先事項は、Brewster 市とその周辺地域の市民に最高水準のサービスを提供することだ。）\n\n■ 解き方のポイント\n〈主語＝〜すること〉の関係なら be＋不定詞。直後に目的語があるので受動態は不可。","words":[{"w":"priority","p":"名詞","m":"優先事項"},{"w":"fire department","p":"名詞","m":"消防署"},{"w":"is to provide","p":"be動詞＋不定詞","m":"提供することである"},{"w":"citizens","p":"名詞","m":"市民"},{"w":"surrounding","p":"形容詞","m":"周辺の"}]},{"id":415,"category":"動詞問題・実戦問題 基本編","question":"Ms. Thomas is the author of Small Business Survival, a book ______ marketing strategies that help small businesses increase income.","A":"outline","B":"outlining","C":"outlined","D":"outlines","answer":"B","answer_word":"outlining","explanation":"■ 文の骨格\nMs. Thomas is the author of Small Business Survival, a book ______ marketing strategies that help small businesses increase income.\n\n■ 空所に入るもの\n名詞 a book を後ろから修飾し、marketing strategies を目的語に取る語が必要。\n→ 空所には「名詞を後ろから修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) outline … 動詞（原形）／名詞「概説する／概要」 ×\n(B) outlining … 現在分詞「概説する」 ○\n(C) outlined … 過去分詞「概説された」 ×\n(D) outlines … 動詞（三人称単数現在形）「概説する」 ×\n\n■ 完成文\nMs. Thomas is the author of Small Business Survival, a book outlining marketing strategies that help small businesses increase income.\n（Thomas さんは、小規模事業の増収を助けるマーケティング戦略を概説した本『Small Business Survival』の著者だ。）\n\n■ 解き方のポイント\n文頭からコンマまでで文が完成。後ろは名詞を修飾する分詞句。","words":[{"w":"author","p":"名詞","m":"著者"},{"w":"outlining","p":"現在分詞","m":"概説する"},{"w":"marketing strategies","p":"名詞","m":"マーケティング戦略"},{"w":"income","p":"名詞","m":"収入"}]},{"id":416,"category":"動詞問題・実戦問題 基本編","question":"A team of the meteorologists led by Ms. Ida is ______ to providing accurate weather forecasts to the Kyoto area.","A":"dedication","B":"dedicating","C":"dedicated","D":"dedicatedly","answer":"C","answer_word":"dedicated","explanation":"■ 文の骨格\nA team of the meteorologists led by Ms. Ida is ______ to providing accurate weather forecasts to the Kyoto area.\n\n■ 空所に入るもの\nbe dedicated to X＝「Xに専念している」という受動の定型表現になる。\n→ 空所には「be動詞の補語になる過去分詞（形容詞化）」が必要です。\n\n■ 選択肢の確認\n(A) dedication … 名詞「献身」 ×\n(B) dedicating … 現在分詞・動名詞「捧げること」 ×\n(C) dedicated … 過去分詞・形容詞「専念している」 ○\n(D) dedicatedly … 副詞「献身的に」 ×\n\n■ 完成文\nA team of the meteorologists led by Ms. Ida is dedicated to providing accurate weather forecasts to the Kyoto area.\n（Ida さんが率いる気象学者チームは、京都地域に正確な天気予報を提供することに専念している。）\n\n■ 解き方のポイント\nbe dedicated [committed] to doing の to は前置詞。後ろが動名詞なのも手がかり。","words":[{"w":"meteorologists","p":"名詞","m":"気象学者"},{"w":"led by","p":"熟語","m":"〜に率いられた"},{"w":"dedicated to","p":"熟語","m":"〜に専念している"},{"w":"accurate","p":"形容詞","m":"正確な"},{"w":"weather forecasts","p":"名詞","m":"天気予報"}]},{"id":417,"category":"動詞問題・実戦問題 基本編","question":"According to traffic updates, all flights ______ from Haneda have been delayed due to the inclement weather.","A":"originating","B":"are originating","C":"originate","D":"will originate","answer":"A","answer_word":"originating","explanation":"■ 文の骨格\nAccording to traffic updates, all flights ______ from Haneda have been delayed due to the inclement weather.\n\n■ 空所に入るもの\n述語動詞 have been delayed がすでにあるため、空所は主語 all flights を修飾する分詞。\n→ 空所には「名詞を後ろから修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) originating … 現在分詞「出発する」 ○\n(B) are originating … 現在進行形「出発している」 ×\n(C) originate … 動詞（原形）「始まる」 ×\n(D) will originate … 未来形「出発するだろう」 ×\n\n■ 完成文\nAccording to traffic updates, all flights originating from Haneda have been delayed due to the inclement weather.\n（交通情報によれば、羽田発の全便が悪天候のため遅延している。）\n\n■ 解き方のポイント\n述語動詞がすでにある文では、動詞の形が問われたら分詞（修飾語）。","words":[{"w":"traffic updates","p":"名詞","m":"交通情報"},{"w":"flights","p":"名詞","m":"便"},{"w":"originating from","p":"熟語","m":"〜発の"},{"w":"delayed","p":"動詞（過去分詞）","m":"遅延した"},{"w":"inclement weather","p":"名詞","m":"悪天候"}]},{"id":418,"category":"動詞問題・実戦問題 基本編","question":"Turner Hospital has established a good reputation and has been highly ______ for the professional conduct of its employees.","A":"recommend","B":"recommends","C":"recommended","D":"recommending","answer":"C","answer_word":"recommended","explanation":"■ 文の骨格\nTurner Hospital has established a good reputation and has been highly ______ for the professional conduct of its employees.\n\n■ 空所に入るもの\nhas been の後ろで、主語 Hospital は「推薦される」側なので過去分詞が必要。\n→ 空所には「現在完了受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) recommend … 動詞（原形）「推薦する」 ×\n(B) recommends … 動詞（三人称単数現在形）「推薦する」 ×\n(C) recommended … 過去分詞「推薦された」 ○\n(D) recommending … 現在分詞・動名詞「推薦すること」 ×\n\n■ 完成文\nTurner Hospital has established a good reputation and has been highly recommended for the professional conduct of its employees.\n（Turner 病院は良い評判を築き、職員のプロらしい対応で高く推薦されてきた。）\n\n■ 解き方のポイント\n〈has been＋副詞＋空所〉で主語が「される側」なら過去分詞。","words":[{"w":"established","p":"動詞（過去分詞）","m":"築いた"},{"w":"reputation","p":"名詞","m":"評判"},{"w":"recommended","p":"過去分詞","m":"推薦された"},{"w":"professional conduct","p":"名詞","m":"プロらしい対応"}]},{"id":419,"category":"動詞問題・実戦問題 基本編","question":"Visitors who do not have access to the Internet from home can ask that documents ______ for them at the circulation desk.","A":"print","B":"printed","C":"be printed","D":"printing","answer":"C","answer_word":"be printed","explanation":"■ 文の骨格\nVisitors who do not have access to the Internet from home can ask that documents ______ for them at the circulation desk.\n\n■ 空所に入るもの\nask that ... の節内では動詞が原形。documents は「印刷される」側なので be＋過去分詞。\n→ 空所には「ask that 節内の動詞（原形の受動態）」が必要です。\n\n■ 選択肢の確認\n(A) print … 動詞（原形・能動）「印刷する」 ×\n(B) printed … 動詞の過去形・過去分詞「印刷された」 ×\n(C) be printed … 原形の受動態「印刷される」 ○\n(D) printing … 現在分詞・動名詞「印刷すること」 ×\n\n■ 完成文\nVisitors who do not have access to the Internet from home can ask that documents be printed for them at the circulation desk.\n（自宅からインターネットを使えない利用者は、貸出カウンターで書類を印刷してもらうよう依頼できる。）\n\n■ 解き方のポイント\nask / request / demand に続く that 節は動詞が原形。受動なら be＋過去分詞。","words":[{"w":"Visitors","p":"名詞","m":"利用者、来館者"},{"w":"access","p":"名詞","m":"アクセス手段"},{"w":"be printed","p":"原形の受動態","m":"印刷される"},{"w":"circulation desk","p":"名詞","m":"貸出カウンター"}]},{"id":420,"category":"動詞問題・実戦問題 基本編","question":"Many businesses use online documents, which can be ______ from anywhere by employees, who are given usernames and passwords.","A":"access","B":"accessed","C":"accessibly","D":"accessing","answer":"B","answer_word":"accessed","explanation":"■ 文の骨格\nMany businesses use online documents, which can be ______ from anywhere by employees, who are given usernames and passwords.\n\n■ 空所に入るもの\ncan be の後ろで、先行詞 documents は「アクセスされる」側なので過去分詞が必要。\n→ 空所には「受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) access … 動詞（原形）／名詞「アクセスする／接近」 ×\n(B) accessed … 過去分詞「アクセスされた」 ○\n(C) accessibly … 副詞「利用しやすく」 ×\n(D) accessing … 現在分詞・動名詞「アクセスすること」 ×\n\n■ 完成文\nMany businesses use online documents, which can be accessed from anywhere by employees, who are given usernames and passwords.\n（多くの企業がオンライン文書を使っており、ユーザー名とパスワードを与えられた従業員はどこからでもアクセスできる。）\n\n■ 解き方のポイント\n〈助動詞＋be＋空所〉は過去分詞。access は他動詞なので前置詞不要。","words":[{"w":"businesses","p":"名詞","m":"企業"},{"w":"accessed","p":"過去分詞","m":"アクセスされた"},{"w":"anywhere","p":"副詞","m":"どこからでも"},{"w":"usernames","p":"名詞","m":"ユーザー名"}]},{"id":421,"category":"動詞問題・実戦問題 基本編","question":"The manager makes a point of testing all food ______ at the restaurant to ensure quality.","A":"serve","B":"serves","C":"serving","D":"served","answer":"D","answer_word":"served","explanation":"■ 文の骨格\nThe manager makes a point of testing all food ______ at the restaurant to ensure quality.\n\n■ 空所に入るもの\n空所の前で文の要素が完成しており、名詞 all food を修飾する分詞が入る。食べ物は「出される」側。\n→ 空所には「名詞を後ろから修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) serve … 動詞（原形）「提供する」 ×\n(B) serves … 動詞（三人称単数現在形）「提供する」 ×\n(C) serving … 現在分詞・動名詞「提供すること」 ×\n(D) served … 過去分詞「提供された」 ○\n\n■ 完成文\nThe manager makes a point of testing all food served at the restaurant to ensure quality.\n（その店長は品質を保つため、レストランで出されるすべての料理を必ず試食するようにしている。）\n\n■ 解き方のポイント\n名詞の後ろの分詞は、受け身なら過去分詞。make a point of doing＝「必ず〜する」。","words":[{"w":"makes a point of","p":"熟語","m":"必ず〜する"},{"w":"testing","p":"動名詞","m":"試食すること"},{"w":"served","p":"過去分詞","m":"提供された"},{"w":"ensure","p":"動詞","m":"確保する"}]},{"id":422,"category":"動詞問題・実戦問題 基本編","question":"Ms. Zhao should ______ that she was required to speak at a training seminar, but only found out on the day.","A":"have informed","B":"being informed","C":"have been informed","D":"was informing","answer":"C","answer_word":"have been informed","explanation":"■ 文の骨格\nMs. Zhao should ______ that she was required to speak at a training seminar, but only found out on the day.\n\n■ 空所に入るもの\nshould have＋過去分詞（〜すべきだったのに）の形で、Zhao さんは「知らされる」側。\n→ 空所には「助動詞＋完了形の受動態」が必要です。\n\n■ 選択肢の確認\n(A) have informed … 助動詞＋完了形（能動）「知らせるべきだった」 ×\n(B) being informed … 現在分詞（受動）「知らされていること」 ×\n(C) have been informed … 助動詞＋完了受動態「知らされるべきだった」 ○\n(D) was informing … 過去進行形「知らせていた」 ×\n\n■ 完成文\nMs. Zhao should have been informed that she was required to speak at a training seminar, but only found out on the day.\n（Zhao さんは研修セミナーで話す必要があることを知らされているべきだったが、当日になって初めて知った。）\n\n■ 解き方のポイント\nshould have＋過去分詞＝「〜すべきだったのに（しなかった）」。受動なら have been＋過去分詞。","words":[{"w":"have been informed","p":"助動詞＋完了受動態","m":"知らされるべきだった"},{"w":"required","p":"動詞（過去分詞）","m":"求められた"},{"w":"training seminar","p":"名詞","m":"研修セミナー"},{"w":"found out","p":"熟語","m":"知った"}]},{"id":423,"category":"動詞問題・実戦問題 基本編","question":"Steven Holloway's rendition of Starry Night at the open air concert was stellar, ______ the event organizers and audience members alike.","A":"delighting","B":"delight","C":"delighted","D":"delights","answer":"A","answer_word":"delighting","explanation":"■ 文の骨格\nSteven Holloway's rendition of Starry Night at the open air concert was stellar, ______ the event organizers and audience members alike.\n\n■ 空所に入るもの\n前文の内容を受けて「その結果〜させた」と続けるので、能動の分詞構文になる。\n→ 空所には「分詞構文をつくる現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) delighting … 現在分詞「喜ばせて」 ○\n(B) delight … 動詞（原形）／名詞「喜ばせる／喜び」 ×\n(C) delighted … 過去分詞・形容詞「喜んでいる（人が主語）」 ×\n(D) delights … 動詞（三人称単数現在形）／名詞（複数形）「喜ばせる／喜び」 ×\n\n■ 完成文\nSteven Holloway's rendition of Starry Night at the open air concert was stellar, delighting the event organizers and audience members alike.\n（野外コンサートでの Steven Holloway による『Starry Night』の演奏は見事で、主催者も観客もひとしく喜ばせた。）\n\n■ 解き方のポイント\nコンマの後ろで結果を表すのは分詞構文（-ing）。","words":[{"w":"rendition","p":"名詞","m":"演奏、表現"},{"w":"open air concert","p":"名詞","m":"野外コンサート"},{"w":"stellar","p":"形容詞","m":"見事な"},{"w":"delighting","p":"現在分詞","m":"喜ばせて"},{"w":"alike","p":"副詞","m":"ひとしく"}]},{"id":424,"category":"動詞問題・実戦問題 基本編","question":"Employees should use the elevators at the rear entrance while the ones in the lobby ______.","A":"fixes","B":"are fixing","C":"have fixed","D":"are being fixed","answer":"D","answer_word":"are being fixed","explanation":"■ 文の骨格\nEmployees should use the elevators at the rear entrance while the ones in the lobby ______.\n\n■ 空所に入るもの\n主語 the ones（エレベーター）は「修理される」側で、「〜されている間」なので受動進行形。\n→ 空所には「受動進行形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) fixes … 動詞（三人称単数現在形・能動）「直す」 ×\n(B) are fixing … 現在進行形（能動）「直している」 ×\n(C) have fixed … 現在完了形（能動）「直した」 ×\n(D) are being fixed … 受動進行形「修理されている」 ○\n\n■ 完成文\nEmployees should use the elevators at the rear entrance while the ones in the lobby are being fixed.\n（ロビーのエレベーターが修理されている間、従業員は裏口のエレベーターを使ってください。）\n\n■ 解き方のポイント\n〈be動詞＋being＋過去分詞〉で「〜されている最中」を表す。","words":[{"w":"rear entrance","p":"名詞","m":"裏口"},{"w":"while","p":"接続詞","m":"〜している間"},{"w":"are being fixed","p":"受動進行形","m":"修理されている"},{"w":"lobby","p":"名詞","m":"ロビー"}]},{"id":425,"category":"動詞問題・実戦問題 基本編","question":"An organizing committee was assembled to arrange a farewell party for Bruce Marshal, who is ______ in May.","A":"retired","B":"retiree","C":"retirement","D":"to retire","answer":"D","answer_word":"to retire","explanation":"■ 文の骨格\nAn organizing committee was assembled to arrange a farewell party for Bruce Marshal, who is ______ in May.\n\n■ 空所に入るもの\nbe to do で「〜する予定である」という確定した予定を表す。\n→ 空所には「be動詞＋不定詞（予定）」が必要です。\n\n■ 選択肢の確認\n(A) retired … 動詞の過去形・過去分詞「引退した」 ×\n(B) retiree … 名詞（人）「退職者」 ×\n(C) retirement … 名詞「退職」 ×\n(D) to retire … 不定詞「引退する予定である」 ○\n\n■ 完成文\nAn organizing committee was assembled to arrange a farewell party for Bruce Marshal, who is to retire in May.\n（5月に引退する Bruce Marshal の送別会を手配するため、準備委員会が招集された。）\n\n■ 解き方のポイント\nbe to do＝予定・義務・可能などを表す。ここは「〜する予定」。","words":[{"w":"organizing committee","p":"名詞","m":"準備委員会"},{"w":"assembled","p":"動詞（過去分詞）","m":"招集された"},{"w":"farewell party","p":"名詞","m":"送別会"},{"w":"to retire","p":"不定詞","m":"引退する（予定）"}]},{"id":426,"category":"動詞問題・実戦問題 基本編","question":"The event organizer announced that those who had bought tickets for the canceled performance would have their money ______.","A":"refunded","B":"refund","C":"refunding","D":"to refund","answer":"A","answer_word":"refunded","explanation":"■ 文の骨格\nThe event organizer announced that those who had bought tickets for the canceled performance would have their money ______.\n\n■ 空所に入るもの\nhave X done（Xを〜してもらう）の形で、money は「払い戻される」側なので過去分詞。\n→ 空所には「have O C の C になる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) refunded … 過去分詞「払い戻された」 ○\n(B) refund … 動詞（原形）／名詞「払い戻す／払戻金」 ×\n(C) refunding … 現在分詞・動名詞「払い戻すこと」 ×\n(D) to refund … 不定詞「払い戻すこと」 ×\n\n■ 完成文\nThe event organizer announced that those who had bought tickets for the canceled performance would have their money refunded.\n（イベント主催者は、中止された公演のチケットを購入した人には代金を払い戻すと発表した。）\n\n■ 解き方のポイント\nhave X done＝「Xを〜してもらう」。能動関係なら have X do [doing]。","words":[{"w":"organizer","p":"名詞","m":"主催者"},{"w":"announced","p":"動詞（過去形）","m":"発表した"},{"w":"canceled","p":"形容詞","m":"中止された"},{"w":"refunded","p":"過去分詞","m":"払い戻された"}]},{"id":427,"category":"動詞問題・実戦問題 基本編","question":"Before ______ to the factory, each component is carefully checked for imperfections by quality control staff hired by the supplier.","A":"deliver","B":"being delivered","C":"delivered","D":"having delivered","answer":"B","answer_word":"being delivered","explanation":"■ 文の骨格\nBefore ______ to the factory, each component is carefully checked for imperfections by quality control staff hired by the supplier.\n\n■ 空所に入るもの\nBefore はここでは前置詞。部品は「配送される」側なので being＋過去分詞。\n→ 空所には「前置詞 Before の目的語になる受動の動名詞」が必要です。\n\n■ 選択肢の確認\n(A) deliver … 動詞（原形・能動）「配送する」 ×\n(B) being delivered … 受動の動名詞「配送されること」 ○\n(C) delivered … 動詞の過去形・過去分詞「配送された」 ×\n(D) having delivered … 完了動名詞（能動）「配送してしまったこと」 ×\n\n■ 完成文\nBefore being delivered to the factory, each component is carefully checked for imperfections by quality control staff hired by the supplier.\n（工場へ配送される前に、各部品は供給業者が雇った品質管理スタッフによって欠陥がないか入念に検査される。）\n\n■ 解き方のポイント\n前置詞＋受動の動名詞は〈being＋過去分詞〉。","words":[{"w":"component","p":"名詞","m":"部品"},{"w":"being delivered","p":"受動の動名詞","m":"配送されること"},{"w":"imperfections","p":"名詞","m":"欠陥"},{"w":"quality control","p":"名詞","m":"品質管理"},{"w":"supplier","p":"名詞","m":"供給業者"}]},{"id":428,"category":"動詞問題・実戦問題 基本編","question":"In celebration of Wonder Words Festival, the library ______ a traveling exhibit of miniature books at the beginning of next month.","A":"hosted","B":"is hosting","C":"will be hosted","D":"had been hosting","answer":"B","answer_word":"is hosting","explanation":"■ 文の骨格\nIn celebration of Wonder Words Festival, the library ______ a traveling exhibit of miniature books at the beginning of next month.\n\n■ 空所に入るもの\nnext month（来月）という確定した予定なので、現在進行形で未来を表す。\n→ 空所には「未来の予定を表す現在進行形」が必要です。\n\n■ 選択肢の確認\n(A) hosted … 動詞（過去形）「主催した」 ×\n(B) is hosting … 現在進行形「主催する（予定）」 ○\n(C) will be hosted … 未来形（受動）「主催されるだろう」 ×\n(D) had been hosting … 過去完了進行形「主催し続けていた」 ×\n\n■ 完成文\nIn celebration of Wonder Words Festival, the library is hosting a traveling exhibit of miniature books at the beginning of next month.\n（Wonder Words Festival を記念して、図書館は来月初めに豆本の巡回展を開催する。）\n\n■ 解き方のポイント\n確定した予定は現在進行形で未来を表せる。直後に目的語があるので受動態は不可。","words":[{"w":"In celebration of","p":"熟語","m":"〜を記念して"},{"w":"is hosting","p":"現在進行形","m":"主催する"},{"w":"traveling exhibit","p":"名詞","m":"巡回展"},{"w":"miniature books","p":"名詞","m":"豆本"}]},{"id":429,"category":"動詞問題・実戦問題 基本編","question":"Employees must shut down their computers, printers, and other electronic devices when ______ the office for the day.","A":"leave","B":"leaves","C":"left","D":"leaving","answer":"D","answer_word":"leaving","explanation":"■ 文の骨格\nEmployees must shut down their computers, printers, and other electronic devices when ______ the office for the day.\n\n■ 空所に入るもの\nwhen 節の主語と be動詞が省略された形。主語 Employees は「退出する」側なので現在分詞。\n→ 空所には「分詞構文をつくる現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) leave … 動詞（原形）「去る」 ×\n(B) leaves … 動詞（三人称単数現在形）「去る」 ×\n(C) left … 動詞の過去形・過去分詞「去った」 ×\n(D) leaving … 現在分詞「去るとき」 ○\n\n■ 完成文\nEmployees must shut down their computers, printers, and other electronic devices when leaving the office for the day.\n（従業員は、その日の業務を終えてオフィスを出るときに、コンピュータ・プリンタなどの電子機器の電源を切らなければならない。）\n\n■ 解き方のポイント\n接続詞＋分詞の形（when doing）。主語が能動なら -ing。","words":[{"w":"shut down","p":"熟語","m":"電源を切る"},{"w":"electronic devices","p":"名詞","m":"電子機器"},{"w":"leaving","p":"現在分詞","m":"去るとき"},{"w":"for the day","p":"熟語","m":"その日の業務を終えて"}]},{"id":430,"category":"動詞問題・実戦問題 基本編","question":"The opening of the concert hall ______ until a thorough safety inspection has been carried out.","A":"delay","B":"to delay","C":"has been delayed","D":"will be delaying","answer":"C","answer_word":"has been delayed","explanation":"■ 文の骨格\nThe opening of the concert hall ______ until a thorough safety inspection has been carried out.\n\n■ 空所に入るもの\n主語 The opening は「延期される」側で、すでに決まったことなので現在完了の受動態。\n→ 空所には「現在完了の受動態」が必要です。\n\n■ 選択肢の確認\n(A) delay … 動詞（原形・能動）「延期する」 ×\n(B) to delay … 不定詞「延期すること」 ×\n(C) has been delayed … 現在完了受動態「延期された」 ○\n(D) will be delaying … 未来進行形（能動）「延期しているだろう」 ×\n\n■ 完成文\nThe opening of the concert hall has been delayed until a thorough safety inspection has been carried out.\n（そのコンサートホールの開館は、徹底的な安全点検が行われるまで延期された。）\n\n■ 解き方のポイント\n主語が「される側」なら受動態。until 節が現在完了なのも手がかり。","words":[{"w":"opening","p":"名詞","m":"開館"},{"w":"has been delayed","p":"現在完了受動態","m":"延期された"},{"w":"thorough","p":"形容詞","m":"徹底的な"},{"w":"safety inspection","p":"名詞","m":"安全点検"},{"w":"carried out","p":"熟語","m":"実施される"}]},{"id":431,"category":"動詞問題・実戦問題 基本編","question":"______ about 20 kilometers from the city center is the Benin City Airport.","A":"Situates","B":"Situated","C":"Situating","D":"Situation","answer":"B","answer_word":"Situated","explanation":"■ 文の骨格\n______ about 20 kilometers from the city center is the Benin City Airport.\n\n■ 空所に入るもの\nThe Benin City Airport is ______ ... の補語部分が文頭に出た倒置。空港は「位置づけられる」側。\n→ 空所には「倒置文の文頭に置く過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) Situates … 動詞（三人称単数現在形）「位置づける」 ×\n(B) Situated … 過去分詞「位置している」 ○\n(C) Situating … 現在分詞・動名詞「位置づけること」 ×\n(D) Situation … 名詞「状況」 ×\n\n■ 完成文\nSituated about 20 kilometers from the city center is the Benin City Airport.\n（Benin City 空港は、市の中心部から約20キロのところにある。）\n\n■ 解き方のポイント\nSituated / Located ＋場所 ＋is ＋主語 という倒置は頻出。","words":[{"w":"Situated","p":"過去分詞","m":"位置している"},{"w":"city center","p":"名詞","m":"市の中心部"},{"w":"Airport","p":"名詞","m":"空港"}]},{"id":432,"category":"前置詞or接続詞問題・トレーニング","question":"______ a recent survey, the top characteristics of effective managers include adaptability and sensitivity.","A":"According to","B":"When","C":"In case","D":"Since","answer":"A","answer_word":"According to","explanation":"■ 文の骨格\n______ a recent survey, the top characteristics of effective managers include adaptability and sensitivity.\n\n■ 空所に入るもの\n直後が名詞句 a recent survey なので、名詞を目的語に取れる前置詞（群）が必要。\n→ 空所には「名詞句を導く前置詞（群）」が必要です。\n\n■ 選択肢の確認\n(A) According to … 群前置詞「〜によると」 ○\n(B) When … 接続詞「〜のとき」 ×\n(C) In case … 接続詞（群）「〜の場合に備えて」 ×\n(D) Since … 接続詞「〜なので、〜以来」 ×\n\n■ 完成文\nAccording to a recent survey, the top characteristics of effective managers include adaptability and sensitivity.\n（最近の調査によると、優れた管理職に多く見られる特徴には、順応性と感受性が含まれる。）\n\n■ 解き方のポイント\n後ろが〈名詞〉なら前置詞、〈主語＋動詞〉なら接続詞。According to は名詞を取る。","words":[{"w":"According to","p":"群前置詞","m":"〜によると"},{"w":"survey","p":"名詞","m":"調査"},{"w":"characteristics","p":"名詞","m":"特徴"},{"w":"adaptability","p":"名詞","m":"順応性"},{"w":"sensitivity","p":"名詞","m":"感受性"}]},{"id":433,"category":"前置詞or接続詞問題・トレーニング","question":"______ you finish writing your report, please e-mail it to Ms. Garcia, one of the seminar instructors.","A":"As well as","B":"In addition to","C":"As soon as","D":"In regard to","answer":"C","answer_word":"As soon as","explanation":"■ 文の骨格\n______ you finish writing your report, please e-mail it to Ms. Garcia, one of the seminar instructors.\n\n■ 空所に入るもの\n空所の後ろに〈主語＋動詞〉が2組あり、それらをつなぐ接続詞が必要。\n→ 空所には「2つの節をつなぐ接続詞」が必要です。\n\n■ 選択肢の確認\n(A) As well as … 群前置詞「〜と同様に」 ×\n(B) In addition to … 群前置詞「〜に加えて」 ×\n(C) As soon as … 接続詞（群）「〜したらすぐに」 ○\n(D) In regard to … 群前置詞「〜に関して」 ×\n\n■ 完成文\nAs soon as you finish writing your report, please e-mail it to Ms. Garcia, one of the seminar instructors.\n（レポートを書き終えたらすぐに、セミナー講師の1人である Garcia さんにメールで送ってください。）\n\n■ 解き方のポイント\n後ろが〈主語＋動詞〉なら接続詞、〈名詞〉なら前置詞。まずこれを確認する。","words":[{"w":"finish","p":"動詞","m":"終える"},{"w":"report","p":"名詞","m":"レポート"},{"w":"instructors","p":"名詞","m":"講師"}]},{"id":434,"category":"前置詞or接続詞問題・トレーニング","question":"We thank you for your order ______ regret to advise that it cannot be processed because the items are currently out of stock.","A":"or","B":"but","C":"whether","D":"either","answer":"B","answer_word":"but","explanation":"■ 文の骨格\nWe thank you for your order ______ regret to advise that it cannot be processed because the items are currently out of stock.\n\n■ 空所に入るもの\n前が「注文への感謝」、後ろが「処理できないお知らせ」で内容が逆転している。\n→ 空所には「逆接を表す等位接続詞」が必要です。\n\n■ 選択肢の確認\n(A) or … 等位接続詞「または」 ×\n(B) but … 等位接続詞「しかし」 ○\n(C) whether … 接続詞「〜かどうか」 ×\n(D) either … 相関語「どちらか一方」 ×\n\n■ 完成文\nWe thank you for your order but regret to advise that it cannot be processed because the items are currently out of stock.\n（ご注文に感謝いたしますが、あいにく現在品切れのため処理できないことをお知らせします。）\n\n■ 解き方のポイント\nthank ... but regret ... のように、and/but の前後は同じ形（ここでは動詞）が並ぶ。","words":[{"w":"thank","p":"動詞","m":"感謝する"},{"w":"regret","p":"動詞","m":"残念に思う"},{"w":"processed","p":"動詞（過去分詞）","m":"処理される"},{"w":"out of stock","p":"熟語","m":"品切れで"}]},{"id":435,"category":"前置詞or接続詞問題・トレーニング","question":"Customers must show proof of identification ______ opening a new account with the Banana Bank.","A":"when","B":"because","C":"then","D":"so that","answer":"A","answer_word":"when","explanation":"■ 文の骨格\nCustomers must show proof of identification ______ opening a new account with the Banana Bank.\n\n■ 空所に入るもの\nwhen (customers are) opening のように〈主語＋be動詞〉を省略できる接続詞が必要。\n→ 空所には「分詞を伴える接続詞」が必要です。\n\n■ 選択肢の確認\n(A) when … 接続詞「〜するとき」 ○\n(B) because … 接続詞「〜なので」 ×\n(C) then … 副詞「そのとき」 ×\n(D) so that … 接続詞（群）「〜するために」 ×\n\n■ 完成文\nCustomers must show proof of identification when opening a new account with the Banana Bank.\n（Banana 銀行で新しく口座を開設する際、顧客は身分証明書を提示しなければならない。）\n\n■ 解き方のポイント\nwhen / while / if などは、主語が主節と同じなら〈主語＋be動詞〉を省略できる。","words":[{"w":"proof of identification","p":"名詞","m":"身分証明書"},{"w":"opening","p":"現在分詞","m":"開設するとき"},{"w":"account","p":"名詞","m":"口座"}]},{"id":436,"category":"前置詞or接続詞問題・トレーニング","question":"The Skyway Bridge will be closed for roadwork on Friday, ______ commuters should consider other means of transportation.","A":"when","B":"so","C":"though","D":"unless","answer":"B","answer_word":"so","explanation":"■ 文の骨格\nThe Skyway Bridge will be closed for roadwork on Friday, ______ commuters should consider other means of transportation.\n\n■ 空所に入るもの\n前が「橋の閉鎖」、後ろがそれに伴う行動の提案で、結果の関係になっている。\n→ 空所には「結果を表す等位接続詞」が必要です。\n\n■ 選択肢の確認\n(A) when … 接続詞「〜のとき」 ×\n(B) so … 等位接続詞「だから」 ○\n(C) though … 接続詞「〜だけれども」 ×\n(D) unless … 接続詞「〜でない限り」 ×\n\n■ 完成文\nThe Skyway Bridge will be closed for roadwork on Friday, so commuters should consider other means of transportation.\n（Skyway 橋は金曜日に道路工事のため閉鎖されるので、通勤客はほかの交通手段を検討したほうがよい。）\n\n■ 解き方のポイント\n前後の因果関係を確認する。〈原因, so 結果〉の形。","words":[{"w":"roadwork","p":"名詞","m":"道路工事"},{"w":"commuters","p":"名詞","m":"通勤客"},{"w":"means of transportation","p":"名詞","m":"交通手段"}]},{"id":437,"category":"前置詞or接続詞問題・トレーニング","question":"______ Dr. Martin expected his patients to take advantage of the extended office hours, but they actually preferred earlier appointments.","A":"Although","B":"In light of","C":"Despite","D":"At first","answer":"D","answer_word":"At first","explanation":"■ 文の骨格\n______ Dr. Martin expected his patients to take advantage of the extended office hours, but they actually preferred earlier appointments.\n\n■ 空所に入るもの\n接続詞 but がすでにあり、空所がなくても2つの節がつながるため、空所は副詞の位置。\n→ 空所には「文全体を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) Although … 接続詞「〜だけれども」 ×\n(B) In light of … 群前置詞「〜を考慮して」 ×\n(C) Despite … 前置詞「〜にもかかわらず」 ×\n(D) At first … 副詞句「最初は」 ○\n\n■ 完成文\nAt first Dr. Martin expected his patients to take advantage of the extended office hours, but they actually preferred earlier appointments.\n（Martin 医師は当初、患者が延長した診療時間を利用すると思っていたが、実際には彼らは早い時間の予約を好んだ。）\n\n■ 解き方のポイント\nすでに接続詞がある文にもう1つ接続詞は入らない。空所は副詞。","words":[{"w":"patients","p":"名詞","m":"患者"},{"w":"take advantage of","p":"熟語","m":"利用する"},{"w":"extended","p":"形容詞","m":"延長された"},{"w":"appointments","p":"名詞","m":"予約"}]},{"id":438,"category":"前置詞or接続詞問題・トレーニング","question":"A recent survey indicates ______ 47 percent of travelers do not get enough sleep on business trips.","A":"that","B":"what","C":"which","D":"those","answer":"A","answer_word":"that","explanation":"■ 文の骨格\nA recent survey indicates ______ 47 percent of travelers do not get enough sleep on business trips.\n\n■ 空所に入るもの\nindicate の目的語として〈主語＋動詞〉のかたまりを導く接続詞が必要。\n→ 空所には「名詞節を導く接続詞」が必要です。\n\n■ 選択肢の確認\n(A) that … 接続詞「〜ということ」 ○\n(B) what … 関係代名詞「〜すること（先行詞を含む）」 ×\n(C) which … 関係代名詞「どちら」 ×\n(D) those … 代名詞「それら」 ×\n\n■ 完成文\nA recent survey indicates that 47 percent of travelers do not get enough sleep on business trips.\n（最近の調査は、旅行者の47％が出張時に十分な睡眠を取れていないことを示している。）\n\n■ 解き方のポイント\nindicate / show / say などの後ろは that 節。that の後ろは完全な文になる。","words":[{"w":"survey","p":"名詞","m":"調査"},{"w":"indicates","p":"動詞","m":"示す"},{"w":"travelers","p":"名詞","m":"旅行者"},{"w":"business trips","p":"名詞","m":"出張"}]},{"id":439,"category":"前置詞or接続詞問題・トレーニング","question":"All city bus passengers should exit through the rear door, ______ passengers with small children and strollers.","A":"even though","B":"furthermore","C":"in spite of","D":"except","answer":"D","answer_word":"except","explanation":"■ 文の骨格\nAll city bus passengers should exit through the rear door, ______ passengers with small children and strollers.\n\n■ 空所に入るもの\n空所の後ろが名詞句 passengers with ... なので、前置詞が必要。\n→ 空所には「名詞句を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) even though … 接続詞（群）「〜だけれども」 ×\n(B) furthermore … 副詞「さらに」 ×\n(C) in spite of … 群前置詞「〜にもかかわらず」 ×\n(D) except … 前置詞「〜を除いて」 ○\n\n■ 完成文\nAll city bus passengers should exit through the rear door, except passengers with small children and strollers.\n（市バスの乗客は、幼児連れやベビーカーを利用する乗客を除き、後部ドアから降りること。）\n\n■ 解き方のポイント\n後ろが名詞なら前置詞。規則の例外を表すのは except。","words":[{"w":"passengers","p":"名詞","m":"乗客"},{"w":"exit","p":"動詞","m":"降りる"},{"w":"rear door","p":"名詞","m":"後部ドア"},{"w":"strollers","p":"名詞","m":"ベビーカー"}]},{"id":440,"category":"前置詞or接続詞問題・実戦問題","question":"Currently, the Tokyo Central Bank has overseas branches in the UK, Hong Kong, ______ China.","A":"and","B":"if","C":"such","D":"but","answer":"A","answer_word":"and","explanation":"■ 文の骨格\nCurrently, the Tokyo Central Bank has overseas branches in the UK, Hong Kong, ______ China.\n\n■ 空所に入るもの\nA, B, and C の形で3つの名詞を並列する接続詞が必要。\n→ 空所には「3つ以上の名詞を並べる等位接続詞」が必要です。\n\n■ 選択肢の確認\n(A) and … 等位接続詞「そして」 ○\n(B) if … 接続詞「もし〜なら」 ×\n(C) such … 形容詞「そのような」 ×\n(D) but … 等位接続詞「しかし」 ×\n\n■ 完成文\nCurrently, the Tokyo Central Bank has overseas branches in the UK, Hong Kong, and China.\n（現在、東京中央銀行はイギリス、香港、中国に海外支店を持っている。）\n\n■ 解き方のポイント\nA, B, and C は並列の基本形。3つ以上ではコンマ＋and。","words":[{"w":"Currently","p":"副詞","m":"現在"},{"w":"overseas branches","p":"名詞","m":"海外支店"},{"w":"bank","p":"名詞","m":"銀行"},{"w":"and","p":"等位接続詞","m":"そして"}]},{"id":441,"category":"前置詞or接続詞問題・実戦問題","question":"Apple Hills residents are encouraged to renew their driver's licenses online ______ they have already expired.","A":"whether","B":"so","C":"unless","D":"due to","answer":"C","answer_word":"unless","explanation":"■ 文の骨格\nApple Hills residents are encouraged to renew their driver's licenses online ______ they have already expired.\n\n■ 空所に入るもの\n後ろが〈主語＋動詞〉で、「〜でない限り」という条件を表す接続詞が文意に合う。\n→ 空所には「条件の否定を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) whether … 接続詞「〜かどうか」 ×\n(B) so … 等位接続詞「だから」 ×\n(C) unless … 接続詞「〜でない限り」 ○\n(D) due to … 群前置詞「〜のため」 ×\n\n■ 完成文\nApple Hills residents are encouraged to renew their driver's licenses online unless they have already expired.\n（Apple Hills の住民は、すでに期限が切れている場合を除き、運転免許証をオンラインで更新するよう勧められている。）\n\n■ 解き方のポイント\nunless＝if ... not。否定の条件を1語で表す。","words":[{"w":"residents","p":"名詞","m":"住民"},{"w":"encouraged","p":"動詞（過去分詞）","m":"勧められる"},{"w":"renew","p":"動詞","m":"更新する"},{"w":"expired","p":"動詞（過去分詞）","m":"期限が切れた"}]},{"id":442,"category":"前置詞or接続詞問題・実戦問題","question":"Jackets are required for club members in the main dining room ______ casual dress is acceptable in all other areas of the club.","A":"during","B":"what","C":"such","D":"while","answer":"D","answer_word":"while","explanation":"■ 文の骨格\nJackets are required for club members in the main dining room ______ casual dress is acceptable in all other areas of the club.\n\n■ 空所に入るもの\n後ろが〈主語＋動詞〉で、前後が対照的な内容になっている。\n→ 空所には「対比を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) during … 前置詞「〜の間」 ×\n(B) what … 関係代名詞「〜すること」 ×\n(C) such … 形容詞「そのような」 ×\n(D) while … 接続詞「〜する一方で」 ○\n\n■ 完成文\nJackets are required for club members in the main dining room while casual dress is acceptable in all other areas of the club.\n（クラブのほかの場所では普段着が許される一方、メインダイニングではクラブ会員はジャケット着用が必要だ。）\n\n■ 解き方のポイント\nwhile は「〜している間」だけでなく「〜する一方で」という対比でも頻出。","words":[{"w":"required","p":"動詞（過去分詞）","m":"必要とされる"},{"w":"dining room","p":"名詞","m":"食堂"},{"w":"casual dress","p":"名詞","m":"普段着"},{"w":"acceptable","p":"形容詞","m":"許容される"}]},{"id":443,"category":"前置詞or接続詞問題・実戦問題","question":"______ she has already proved herself a versatile actress, Helen Kuroshima continues to study to develop her acting style.","A":"Not only","B":"Although","C":"Despite","D":"Consequently","answer":"B","answer_word":"Although","explanation":"■ 文の骨格\n______ she has already proved herself a versatile actress, Helen Kuroshima continues to study to develop her acting style.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、前後が譲歩の関係になっている。\n→ 空所には「譲歩を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) Not only … 相関語「〜だけでなく」 ×\n(B) Although … 接続詞「〜だけれども」 ○\n(C) Despite … 前置詞「〜にもかかわらず」 ×\n(D) Consequently … 副詞「その結果」 ×\n\n■ 完成文\nAlthough she has already proved herself a versatile actress, Helen Kuroshima continues to study to develop her acting style.\n（すでに多才な女優であることを証明しているものの、Helen Kuroshima は演技スタイルを磨くために学び続けている。）\n\n■ 解き方のポイント\nAlthough（接続詞）と Despite（前置詞）の使い分けが最頻出。後ろの形で判断する。","words":[{"w":"proved","p":"動詞（過去分詞）","m":"証明した"},{"w":"versatile","p":"形容詞","m":"多才な"},{"w":"actress","p":"名詞","m":"女優"},{"w":"acting style","p":"名詞","m":"演技スタイル"}]},{"id":444,"category":"前置詞or接続詞問題・実戦問題","question":"With the exce
