ex Gupta has hired additional sales clerks for the store, he hopes that there will be fewer ______ from shoppers.","A":"complains","B":"complainer","C":"complaining","D":"complaints","answer":"D","answer_word":"complaints","explanation":"■ 文の骨格\nNow that Alex Gupta has hired additional sales clerks for the store, he hopes that there will be fewer ______ from shoppers.\n\n■ 空所に入るもの\nfewer は可算名詞の複数形を修飾するので、複数名詞が必要。\n→ 空所には「fewer に修飾される複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) complains … 動詞（三人称単数現在形）「不満を言う」 ×\n(B) complainer … 名詞（人）「苦情を言う人」 ×\n(C) complaining … 現在分詞・動名詞「不満を言うこと」 ×\n(D) complaints … 名詞（複数形）「苦情」 ○\n\n■ 完成文\nNow that Alex Gupta has hired additional sales clerks for the store, he hopes that there will be fewer complaints from shoppers.\n（Alex Gupta は店に販売員を増やしたので、買い物客からの苦情が減ることを期待している。）\n\n■ 解き方のポイント\nfewer＋可算名詞の複数形／less＋不可算名詞 の使い分けも重要。","words":[{"w":"Now that","p":"接続詞","m":"今や〜なので"},{"w":"sales clerks","p":"名詞","m":"販売員"},{"w":"fewer","p":"比較級","m":"より少ない"},{"w":"complaints","p":"名詞","m":"苦情"}]},{"id":294,"category":"品詞問題・実戦問題 発展編","question":"All inquiries ______ the Orange Appliance returns policy should be directed to the e-mail address provided on the warranty form.","A":"regard","B":"regarding","C":"regarded","D":"regards","answer":"B","answer_word":"regarding","explanation":"■ 文の骨格\nAll inquiries ______ the Orange Appliance returns policy should be directed to the e-mail address provided on the warranty form.\n\n■ 空所に入るもの\n主語 All inquiries を後ろから修飾し、名詞 the ... policy を目的語に取る語が必要。\n→ 空所には「前置詞として働く現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) regard … 動詞（原形）／名詞「見なす／点」 ×\n(B) regarding … 前置詞（現在分詞由来）「〜に関する」 ○\n(C) regarded … 動詞の過去形・過去分詞「見なされた」 ×\n(D) regards … 動詞（三人称単数現在形）／名詞「見なす／よろしく」 ×\n\n■ 完成文\nAll inquiries regarding the Orange Appliance returns policy should be directed to the e-mail address provided on the warranty form.\n（Orange Appliance 社の返品方針に関するお問い合わせはすべて、保証書に記載のメールアドレス宛にお送りください。）\n\n■ 解き方のポイント\nregarding／concerning／including は前置詞として働く分詞。直後に名詞が来る。","words":[{"w":"inquiries","p":"名詞","m":"問い合わせ"},{"w":"regarding","p":"前置詞","m":"〜に関する"},{"w":"returns policy","p":"名詞","m":"返品方針"},{"w":"directed","p":"動詞（過去分詞）","m":"向けられる"},{"w":"warranty form","p":"名詞","m":"保証書"}]},{"id":295,"category":"品詞問題・実戦問題 発展編","question":"All car batteries sold at Oil World come with a ______ two-year warranty.","A":"comprehensive","B":"comprehensively","C":"more comprehensively","D":"comprehensiveness","answer":"A","answer_word":"comprehensive","explanation":"■ 文の骨格\nAll car batteries sold at Oil World come with a ______ two-year warranty.\n\n■ 空所に入るもの\n冠詞 a と名詞句 two-year warranty の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) comprehensive … 形容詞「総合的な、包括的な」 ○\n(B) comprehensively … 副詞「包括的に」 ×\n(C) more comprehensively … 副詞（比較級）「より包括的に」 ×\n(D) comprehensiveness … 名詞「包括性」 ×\n\n■ 完成文\nAll car batteries sold at Oil World come with a comprehensive two-year warranty.\n（Oil World で販売されている自動車用バッテリーはすべて、総合的な2年保証付きだ。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。","words":[{"w":"batteries","p":"名詞","m":"バッテリー"},{"w":"come with","p":"熟語","m":"〜が付いてくる"},{"w":"comprehensive","p":"形容詞","m":"総合的な"},{"w":"warranty","p":"名詞","m":"保証"}]},{"id":296,"category":"品詞問題・実戦問題 発展編","question":"All of the negotiations that had been held between the two companies became ______ after ownership changed hands this month.","A":"point","B":"pointing","C":"pointed","D":"pointless","answer":"D","answer_word":"pointless","explanation":"■ 文の骨格\nAll of the negotiations that had been held between the two companies became ______ after ownership changed hands this month.\n\n■ 空所に入るもの\nbecome は S+V+C の形をとる動詞で、主語 negotiations の状態を表す補語が必要。\n→ 空所には「become の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) point … 名詞／動詞「点／指す」 ×\n(B) pointing … 現在分詞・動名詞「指すこと」 ×\n(C) pointed … 過去分詞・形容詞「とがった、鋭い」 ×\n(D) pointless … 形容詞「無意味な」 ○\n\n■ 完成文\nAll of the negotiations that had been held between the two companies became pointless after ownership changed hands this month.\n（今月所有者が変わったことで、両社間で行われてきた交渉はすべて無意味なものとなった。）\n\n■ 解き方のポイント\nbecome の後ろは補語＝形容詞。-less は「〜がない」を表す形容詞の語尾。","words":[{"w":"negotiations","p":"名詞","m":"交渉"},{"w":"became","p":"動詞（過去形）","m":"〜になった"},{"w":"pointless","p":"形容詞","m":"無意味な"},{"w":"ownership","p":"名詞","m":"所有権"},{"w":"changed hands","p":"熟語","m":"持ち主が変わった"}]},{"id":297,"category":"品詞問題・実戦問題 発展編","question":"Breakthrough Business School is rated highly among students as its teachers ______ engage in discussions with students before and after classes.","A":"active","B":"actively","C":"activate","D":"activity","answer":"B","answer_word":"actively","explanation":"■ 文の骨格\nBreakthrough Business School is rated highly among students as its teachers ______ engage in discussions with students before and after classes.\n\n■ 空所に入るもの\n主語 its teachers と述語動詞 engage の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) active … 形容詞「活発な」 ×\n(B) actively … 副詞「積極的に」 ○\n(C) activate … 動詞（原形）「作動させる」 ×\n(D) activity … 名詞「活動」 ×\n\n■ 完成文\nBreakthrough Business School is rated highly among students as its teachers actively engage in discussions with students before and after classes.\n（Breakthrough Business School は、講師が授業の前後に積極的に生徒と議論するため、学生から高く評価されている。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉は副詞の定位置。","words":[{"w":"rated highly","p":"熟語","m":"高く評価される"},{"w":"actively","p":"副詞","m":"積極的に"},{"w":"engage in","p":"熟語","m":"〜に参加する"},{"w":"discussions","p":"名詞","m":"議論"}]},{"id":298,"category":"品詞問題・実戦問題 発展編","question":"In recent years, municipal governments have taken on ______ more responsibilities for social services and community development than in the past.","A":"considerable","B":"consideration","C":"considerate","D":"considerably","answer":"D","answer_word":"considerably","explanation":"■ 文の骨格\nIn recent years, municipal governments have taken on ______ more responsibilities for social services and community development than in the past.\n\n■ 空所に入るもの\nhave taken on までで文の要素がそろっており、比較級 more を強める副詞が必要。\n→ 空所には「比較級 more を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) considerable … 形容詞「かなりの」 ×\n(B) consideration … 名詞「考慮」 ×\n(C) considerate … 形容詞「思いやりのある」 ×\n(D) considerably … 副詞「かなり」 ○\n\n■ 完成文\nIn recent years, municipal governments have taken on considerably more responsibilities for social services and community development than in the past.\n（近年、地方自治体は社会福祉と地域振興について、過去に比べかなり多くの責務を負うようになっている。）\n\n■ 解き方のポイント\n比較級 more を修飾するのは副詞。much / far / considerably などが使える。","words":[{"w":"municipal governments","p":"名詞","m":"地方自治体"},{"w":"taken on","p":"熟語","m":"引き受けた"},{"w":"considerably","p":"副詞","m":"かなり"},{"w":"responsibilities","p":"名詞","m":"責務"},{"w":"community development","p":"名詞","m":"地域振興"}]},{"id":299,"category":"品詞問題・実戦問題 発展編","question":"Lorenzo Rossi, the CEO of Rossi Cosmetics, announced his decision to appoint Ms. Moretti as vice-president, ______ next month.","A":"effective","B":"effect","C":"effects","D":"effectively","answer":"A","answer_word":"effective","explanation":"■ 文の骨格\nLorenzo Rossi, the CEO of Rossi Cosmetics, announced his decision to appoint Ms. Moretti as vice-president, ______ next month.\n\n■ 空所に入るもの\neffective ＋時期 で「〜付けで、〜から有効な」を表す定型表現になる。\n→ 空所には「時期を示す形容詞」が必要です。\n\n■ 選択肢の確認\n(A) effective … 形容詞「（〜付けで）発効する」 ○\n(B) effect … 名詞／動詞「効果／もたらす」 ×\n(C) effects … 名詞（複数形）「効果」 ×\n(D) effectively … 副詞「効果的に」 ×\n\n■ 完成文\nLorenzo Rossi, the CEO of Rossi Cosmetics, announced his decision to appoint Ms. Moretti as vice-president, effective next month.\n（Rossi Cosmetics 社の CEO である Lorenzo Rossi 氏は、来月付けで Moretti 氏を副社長に任命する決定を発表した。）\n\n■ 解き方のポイント\neffective next month＝「来月付けで」。日付・時期の前に置く形容詞用法は頻出。","words":[{"w":"announced","p":"動詞（過去形）","m":"発表した"},{"w":"appoint","p":"動詞","m":"任命する"},{"w":"vice-president","p":"名詞","m":"副社長"},{"w":"effective","p":"形容詞","m":"（〜付けで）発効する"}]},{"id":300,"category":"品詞問題・実戦問題 発展編","question":"All of the artwork used in the short film was painted by John English, a local animation ______.","A":"enthusiastic","B":"enthusiastically","C":"enthusiasm","D":"enthusiast","answer":"D","answer_word":"enthusiast","explanation":"■ 文の骨格\nAll of the artwork used in the short film was painted by John English, a local animation ______.\n\n■ 空所に入るもの\n人名 John English と同格になる位置なので、「人」を表す名詞が必要。\n→ 空所には「人を表す名詞」が必要です。\n\n■ 選択肢の確認\n(A) enthusiastic … 形容詞「熱心な」 ×\n(B) enthusiastically … 副詞「熱心に」 ×\n(C) enthusiasm … 名詞（不可算）「熱意」 ×\n(D) enthusiast … 名詞（人）「愛好家、熱狂的ファン」 ○\n\n■ 完成文\nAll of the artwork used in the short film was painted by John English, a local animation enthusiast.\n（その短編映画に使われた美術はすべて、地元のアニメーション愛好家である John English が描いた。）\n\n■ 解き方のポイント\n人名との同格は「人」を表す名詞。-ist と同様に -ast も人を表す語尾。","words":[{"w":"artwork","p":"名詞","m":"美術、原画"},{"w":"short film","p":"名詞","m":"短編映画"},{"w":"painted","p":"動詞（過去分詞）","m":"描かれた"},{"w":"enthusiast","p":"名詞","m":"愛好家"}]},{"id":301,"category":"品詞問題・実戦問題 発展編","question":"Donations to the school's art department are strictly ______ and contributions are only accepted anonymously.","A":"voluntary","B":"volunteer","C":"volunteering","D":"volunteered","answer":"A","answer_word":"voluntary","explanation":"■ 文の骨格\nDonations to the school's art department are strictly ______ and contributions are only accepted anonymously.\n\n■ 空所に入るもの\nare の補語が欠けており、主語 Donations の性質を表す形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) voluntary … 形容詞「任意の、自発的な」 ○\n(B) volunteer … 名詞（人）／動詞「ボランティア／志願する」 ×\n(C) volunteering … 現在分詞・動名詞「志願すること」 ×\n(D) volunteered … 動詞の過去形・過去分詞「志願した」 ×\n\n■ 完成文\nDonations to the school's art department are strictly voluntary and contributions are only accepted anonymously.\n（学校の美術部門への寄付は完全に任意であり、献金は匿名でのみ受け付けられる。）\n\n■ 解き方のポイント\nbe動詞の補語は形容詞。voluntary（任意の）と volunteer（志願者）の品詞差が狙われる。","words":[{"w":"Donations","p":"名詞","m":"寄付"},{"w":"strictly","p":"副詞","m":"完全に、厳密に"},{"w":"voluntary","p":"形容詞","m":"任意の"},{"w":"contributions","p":"名詞","m":"献金"},{"w":"anonymously","p":"副詞","m":"匿名で"}]},{"id":302,"category":"品詞問題・実戦問題 発展編","question":"Tullworth Stores provide refunds and exchanges only for items ______ by the original receipts.","A":"accompany","B":"accompanies","C":"accompanying","D":"accompanied","answer":"D","answer_word":"accompanied","explanation":"■ 文の骨格\nTullworth Stores provide refunds and exchanges only for items ______ by the original receipts.\n\n■ 空所に入るもの\n名詞 items を後ろから修飾する位置で、items と accompany は受け身の関係。\n→ 空所には「名詞を後ろから修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) accompany … 動詞（原形）「付き添う、伴う」 ×\n(B) accompanies … 動詞（三人称単数現在形）「伴う」 ×\n(C) accompanying … 現在分詞「伴っている」 ×\n(D) accompanied … 過去分詞「添えられた」 ○\n\n■ 完成文\nTullworth Stores provide refunds and exchanges only for items accompanied by the original receipts.\n（Tullworth Stores は、レシート原本が添えられた商品に限り、返金と交換に応じる。）\n\n■ 解き方のポイント\nbe accompanied by X＝「Xを伴う」。後ろに by があるので受け身。","words":[{"w":"refunds","p":"名詞","m":"返金"},{"w":"exchanges","p":"名詞","m":"交換"},{"w":"items","p":"名詞","m":"商品"},{"w":"accompanied","p":"過去分詞","m":"添えられた"},{"w":"original receipts","p":"名詞","m":"レシート原本"}]},{"id":303,"category":"品詞問題・実戦問題 発展編","question":"As ______, Nobel Corporations' new advertising campaign has increased its sales substantially in the southern region of the country.","A":"predict","B":"prediction","C":"predictably","D":"predicted","answer":"D","answer_word":"predicted","explanation":"■ 文の骨格\nAs ______, Nobel Corporations' new advertising campaign has increased its sales substantially in the southern region of the country.\n\n■ 空所に入るもの\nAs (it was) ______ の省略形で、受け身の意味を表す過去分詞が必要。\n→ 空所には「As と結びつく過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) predict … 動詞（原形）「予測する」 ×\n(B) prediction … 名詞「予測」 ×\n(C) predictably … 副詞「予測どおり」 ×\n(D) predicted … 過去分詞「予測された」 ○\n\n■ 完成文\nAs predicted, Nobel Corporations' new advertising campaign has increased its sales substantially in the southern region of the country.\n（予想どおり、Nobel 社の新しい広告キャンペーンは国の南部地域で売上を大幅に伸ばした。）\n\n■ 解き方のポイント\nas predicted／as expected／as scheduled は「予想どおり」を表す定型。","words":[{"w":"predicted","p":"過去分詞","m":"予測された"},{"w":"campaign","p":"名詞","m":"キャンペーン"},{"w":"substantially","p":"副詞","m":"大幅に"},{"w":"southern region","p":"名詞","m":"南部地域"}]},{"id":304,"category":"品詞問題・実戦問題 発展編","question":"At Metal Rock Magazine, rules regarding the submission deadlines for articles are applied ______ than at other publications.","A":"stringent","B":"stringently","C":"more stringent","D":"more stringently","answer":"D","answer_word":"more stringently","explanation":"■ 文の骨格\nAt Metal Rock Magazine, rules regarding the submission deadlines for articles are applied ______ than at other publications.\n\n■ 空所に入るもの\n受動態 are applied がすでに成立しており、than を伴う比較級の副詞が必要。\n→ 空所には「動詞を修飾する副詞（比較級）」が必要です。\n\n■ 選択肢の確認\n(A) stringent … 形容詞「厳格な」 ×\n(B) stringently … 副詞「厳格に」 ×\n(C) more stringent … 形容詞（比較級）「より厳格な」 ×\n(D) more stringently … 副詞（比較級）「より厳格に」 ○\n\n■ 完成文\nAt Metal Rock Magazine, rules regarding the submission deadlines for articles are applied more stringently than at other publications.\n（Metal Rock Magazine では、記事の提出期限に関する規則がほかの出版社より厳しく適用されている。）\n\n■ 解き方のポイント\nthan があるので比較級。受動態の後ろなので副詞。","words":[{"w":"regarding","p":"前置詞","m":"〜に関する"},{"w":"submission deadlines","p":"名詞","m":"提出期限"},{"w":"applied","p":"動詞（過去分詞）","m":"適用される"},{"w":"more stringently","p":"副詞（比較級）","m":"より厳格に"},{"w":"publications","p":"名詞","m":"出版社、出版物"}]},{"id":305,"category":"品詞問題・実戦問題 発展編","question":"The Thomas Walker Comic Fair's director of public relations said that he was surprised at how ______ the tickets had been sold.","A":"quicker","B":"quickly","C":"quickness","D":"quickest","answer":"B","answer_word":"quickly","explanation":"■ 文の骨格\nThe Thomas Walker Comic Fair's director of public relations said that he was surprised at how ______ the tickets had been sold.\n\n■ 空所に入るもの\nhow の直後で、had been sold を修飾する副詞が必要。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) quicker … 形容詞（比較級）「より速い」 ×\n(B) quickly … 副詞「速く」 ○\n(C) quickness … 名詞「速さ」 ×\n(D) quickest … 形容詞（最上級）「最も速い」 ×\n\n■ 完成文\nThe Thomas Walker Comic Fair's director of public relations said that he was surprised at how quickly the tickets had been sold.\n（Thomas Walker コミックフェアの広報部長は、チケットが売れる速さに驚いたと述べた。）\n\n■ 解き方のポイント\n〈how＋副詞＋S＋V〉の形。動詞を修飾するので副詞。","words":[{"w":"public relations","p":"名詞","m":"広報"},{"w":"surprised at","p":"熟語","m":"〜に驚いた"},{"w":"quickly","p":"副詞","m":"速く"},{"w":"sold","p":"動詞（過去分詞）","m":"売れた"}]},{"id":306,"category":"品詞問題・実戦問題 発展編","question":"With thousands of visitors attending the Harbor Markets' events, all vendors must park their cars in the ______ area.","A":"designate","B":"designated","C":"designating","D":"designation","answer":"B","answer_word":"designated","explanation":"■ 文の骨格\nWith thousands of visitors attending the Harbor Markets' events, all vendors must park their cars in the ______ area.\n\n■ 空所に入るもの\nthe と名詞 area の間にあり、受け身の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) designate … 動詞（原形）「指定する」 ×\n(B) designated … 過去分詞・形容詞「指定された」 ○\n(C) designating … 現在分詞・動名詞「指定すること」 ×\n(D) designation … 名詞「指定、名称」 ×\n\n■ 完成文\nWith thousands of visitors attending the Harbor Markets' events, all vendors must park their cars in the designated area.\n（Harbor Markets のイベントには何千人もの来場者が訪れるため、出店者は全員、指定区域に駐車しなければならない。）\n\n■ 解き方のポイント\narea は「指定される」側なので過去分詞。designated area は頻出。","words":[{"w":"thousands of","p":"熟語","m":"何千もの"},{"w":"vendors","p":"名詞","m":"出店者、販売業者"},{"w":"park","p":"動詞","m":"駐車する"},{"w":"designated","p":"形容詞","m":"指定された"},{"w":"area","p":"名詞","m":"区域"}]},{"id":307,"category":"品詞問題・実戦問題 発展編","question":"BookOn has reported that Oliver Harris, a senior vice president, is a ______ candidate to take over from Ms. Hoffmann as CEO.","A":"like","B":"liking","C":"likely","D":"likeness","answer":"C","answer_word":"likely","explanation":"■ 文の骨格\nBookOn has reported that Oliver Harris, a senior vice president, is a ______ candidate to take over from Ms. Hoffmann as CEO.\n\n■ 空所に入るもの\n冠詞 a と名詞 candidate の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) like … 前置詞／動詞「〜のような／好む」 ×\n(B) liking … 名詞「好み」 ×\n(C) likely … 形容詞「有力な、可能性が高い」 ○\n(D) likeness … 名詞「似ていること、肖像」 ×\n\n■ 完成文\nBookOn has reported that Oliver Harris, a senior vice president, is a likely candidate to take over from Ms. Hoffmann as CEO.\n（BookOn 社は、上級副社長の Oliver Harris 氏が Hoffmann 氏から CEO を引き継ぐ有力候補だと報じた。）\n\n■ 解き方のポイント\nlikely は -ly で終わるが形容詞（「〜しそうな」）。","words":[{"w":"senior vice president","p":"名詞","m":"上級副社長"},{"w":"likely","p":"形容詞","m":"有力な"},{"w":"candidate","p":"名詞","m":"候補者"},{"w":"take over from","p":"熟語","m":"〜から引き継ぐ"}]},{"id":308,"category":"品詞問題・実戦問題 発展編","question":"Your mailing and e-mail addresses are kept entirely ______ and used solely for the purpose of notifying you of upcoming shows at Roadside Theater.","A":"private","B":"privatize","C":"privatizing","D":"privately","answer":"A","answer_word":"private","explanation":"■ 文の骨格\nYour mailing and e-mail addresses are kept entirely ______ and used solely for the purpose of notifying you of upcoming shows at Roadside Theater.\n\n■ 空所に入るもの\nkeep O C の形で、主語（住所）の状態を表す補語の形容詞が必要。\n→ 空所には「keep の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) private … 形容詞「非公開の」 ○\n(B) privatize … 動詞（原形）「民営化する」 ×\n(C) privatizing … 現在分詞・動名詞「民営化すること」 ×\n(D) privately … 副詞「内密に」 ×\n\n■ 完成文\nYour mailing and e-mail addresses are kept entirely private and used solely for the purpose of notifying you of upcoming shows at Roadside Theater.\n（お客様の住所とメールアドレスは完全に非公開に保たれ、Roadside 劇場の今後の公演をお知らせする目的にのみ使用されます。）\n\n■ 解き方のポイント\nbe kept ＿＿ の空所は補語＝形容詞。副詞は補語になれない。","words":[{"w":"mailing address","p":"名詞","m":"住所"},{"w":"kept","p":"動詞（過去分詞）","m":"保たれる"},{"w":"private","p":"形容詞","m":"非公開の"},{"w":"solely","p":"副詞","m":"もっぱら"},{"w":"upcoming","p":"形容詞","m":"今後の"}]},{"id":309,"category":"品詞問題・実戦問題 発展編","question":"When making an online flight booking, passengers are requested to specify their meal ______.","A":"preferable","B":"preferred","C":"preferably","D":"preferences","answer":"D","answer_word":"preferences","explanation":"■ 文の骨格\nWhen making an online flight booking, passengers are requested to specify their meal ______.\n\n■ 空所に入るもの\n所有格 their と meal の後ろで、specify の目的語となる名詞が必要。\n→ 空所には「meal と複合名詞をつくる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) preferable … 形容詞「望ましい」 ×\n(B) preferred … 過去分詞・形容詞「好まれる」 ×\n(C) preferably … 副詞「できれば」 ×\n(D) preferences … 名詞（複数形）「好み、希望」 ○\n\n■ 完成文\nWhen making an online flight booking, passengers are requested to specify their meal preferences.\n（オンラインで航空券を予約する際、乗客は食事の希望を指定するよう求められる。）\n\n■ 解き方のポイント\nmeal preferences（食事の好み）は複合名詞。文末の空所は名詞が多い。","words":[{"w":"booking","p":"名詞","m":"予約"},{"w":"passengers","p":"名詞","m":"乗客"},{"w":"specify","p":"動詞","m":"指定する"},{"w":"preferences","p":"名詞","m":"好み、希望"}]},{"id":310,"category":"品詞問題・実戦問題 発展編","question":"The results of the survey were declared ______ when an error was found in the counting system.","A":"invalid","B":"invalidly","C":"invalidity","D":"invalided","answer":"A","answer_word":"invalid","explanation":"■ 文の骨格\nThe results of the survey were declared ______ when an error was found in the counting system.\n\n■ 空所に入るもの\ndeclare O C（OをCだと宣言する）の受動形で、主語の状態を表す補語が必要。\n→ 空所には「declare の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) invalid … 形容詞「無効な」 ○\n(B) invalidly … 副詞「無効に」 ×\n(C) invalidity … 名詞「無効」 ×\n(D) invalided … 動詞の過去形・過去分詞「病人にされた」 ×\n\n■ 完成文\nThe results of the survey were declared invalid when an error was found in the counting system.\n（集計システムにエラーが見つかり、その調査結果は無効だと宣言された。）\n\n■ 解き方のポイント\nbe declared ＿＿ の空所は補語＝形容詞。","words":[{"w":"results","p":"名詞","m":"結果"},{"w":"declared","p":"動詞（過去分詞）","m":"宣言された"},{"w":"invalid","p":"形容詞","m":"無効な"},{"w":"counting system","p":"名詞","m":"集計システム"}]},{"id":311,"category":"品詞問題・実戦問題 発展編","question":"The Glasgow Glass Factory recently issued important updates to its ______ regulations for employees.","A":"safe","B":"safely","C":"safety","D":"safes","answer":"C","answer_word":"safety","explanation":"■ 文の骨格\nThe Glasgow Glass Factory recently issued important updates to its ______ regulations for employees.\n\n■ 空所に入るもの\n所有格 its と名詞 regulations の間で、safety regulations という複合名詞をつくる。\n→ 空所には「regulations と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) safe … 形容詞「安全な」 ×\n(B) safely … 副詞「安全に」 ×\n(C) safety … 名詞「安全」 ○\n(D) safes … 名詞（複数形）「金庫」 ×\n\n■ 完成文\nThe Glasgow Glass Factory recently issued important updates to its safety regulations for employees.\n（Glasgow Glass 工場は最近、従業員向け安全規則の重要な改訂を発表した。）\n\n■ 解き方のポイント\nsafety regulations（安全規則）は複合名詞。safe regulations とは言わない。","words":[{"w":"issued","p":"動詞（過去形）","m":"発表した"},{"w":"updates","p":"名詞","m":"改訂、更新"},{"w":"safety regulations","p":"名詞","m":"安全規則"},{"w":"employees","p":"名詞","m":"従業員"}]},{"id":312,"category":"品詞問題・実戦問題 発展編","question":"According to a recent survey, a company's performance is ______ on employees' perceptions that they are receiving fair performance evaluations.","A":"depended","B":"dependence","C":"dependable","D":"dependent","answer":"D","answer_word":"dependent","explanation":"■ 文の骨格\nAccording to a recent survey, a company's performance is ______ on employees' perceptions that they are receiving fair performance evaluations.\n\n■ 空所に入るもの\nis の補語が欠けており、on と結びついて意味が通る形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) depended … 動詞の過去形・過去分詞「依存した」 ×\n(B) dependence … 名詞「依存」 ×\n(C) dependable … 形容詞「信頼できる」 ×\n(D) dependent … 形容詞「左右される」 ○\n\n■ 完成文\nAccording to a recent survey, a company's performance is dependent on employees' perceptions that they are receiving fair performance evaluations.\n（最近の調査によれば、会社の業績は、公正な人事評価を受けているという従業員の認識に左右される。）\n\n■ 解き方のポイント\nbe dependent on X＝「Xに左右される」。自動詞 depend の過去分詞では受動態にならない。","words":[{"w":"performance","p":"名詞","m":"業績"},{"w":"dependent","p":"形容詞","m":"左右される"},{"w":"perceptions","p":"名詞","m":"認識"},{"w":"fair","p":"形容詞","m":"公正な"},{"w":"evaluations","p":"名詞","m":"評価"}]},{"id":313,"category":"品詞問題・実戦問題 発展編","question":"An ______ from Ms. Nielsen's award-winning novel, Number the Stars, was printed in today's Copenhagen Times.","A":"extract","B":"extractable","C":"extracted","D":"extractability","answer":"A","answer_word":"extract","explanation":"■ 文の骨格\nAn ______ from Ms. Nielsen's award-winning novel, Number the Stars, was printed in today's Copenhagen Times.\n\n■ 空所に入るもの\n冠詞 An の後ろで、述語動詞 was printed の主語となる名詞が必要。\n→ 空所には「文の主語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) extract … 名詞「抜粋」 ○\n(B) extractable … 形容詞「抽出できる」 ×\n(C) extracted … 動詞の過去形・過去分詞「抽出された」 ×\n(D) extractability … 名詞「抽出可能性」 ×\n\n■ 完成文\nAn extract from Ms. Nielsen's award-winning novel, Number the Stars, was printed in today's Copenhagen Times.\n（Nielsen さんの受賞作『Number the Stars』からの抜粋が、本日の Copenhagen Times 紙に掲載された。）\n\n■ 解き方のポイント\n冠詞の直後は名詞。extract は名詞「抜粋」・動詞「抽出する」の多品詞語。","words":[{"w":"extract","p":"名詞","m":"抜粋"},{"w":"award-winning","p":"形容詞","m":"受賞歴のある"},{"w":"novel","p":"名詞","m":"小説"},{"w":"printed","p":"動詞（過去分詞）","m":"掲載された"}]},{"id":314,"category":"品詞問題・実戦問題 発展編","question":"Mr. Schulz said that results in the first half of the fiscal year were not always ______ of outcomes for the full year.","A":"indicate","B":"indicative","C":"indicated","D":"indication","answer":"B","answer_word":"indicative","explanation":"■ 文の骨格\nMr. Schulz said that results in the first half of the fiscal year were not always ______ of outcomes for the full year.\n\n■ 空所に入るもの\nwere の補語が欠けており、of と結びついて意味が通る形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) indicate … 動詞（原形）「示す」 ×\n(B) indicative … 形容詞「示している、予兆となる」 ○\n(C) indicated … 動詞の過去形・過去分詞「示された」 ×\n(D) indication … 名詞「兆候、表示」 ×\n\n■ 完成文\nMr. Schulz said that results in the first half of the fiscal year were not always indicative of outcomes for the full year.\n（Schulz 氏は、年度前半の結果が必ずしも通年の成果を示すわけではないと述べた。）\n\n■ 解き方のポイント\nbe indicative of X＝「Xを示している」。-ive は形容詞の目印。","words":[{"w":"fiscal year","p":"名詞","m":"会計年度"},{"w":"not always","p":"熟語","m":"必ずしも〜ない"},{"w":"indicative","p":"形容詞","m":"示している"},{"w":"outcomes","p":"名詞","m":"成果"}]},{"id":315,"category":"品詞問題・実戦問題 発展編","question":"Mars Motors' new clamping system makes their vehicles ______ even during emergency braking.","A":"controlling","B":"controllable","C":"controllability","D":"controls","answer":"B","answer_word":"controllable","explanation":"■ 文の骨格\nMars Motors' new clamping system makes their vehicles ______ even during emergency braking.\n\n■ 空所に入るもの\nmake O C の形で、目的語 their vehicles の状態を表す補語が必要。\n→ 空所には「make の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) controlling … 現在分詞・動名詞「制御していること」 ×\n(B) controllable … 形容詞「制御できる」 ○\n(C) controllability … 名詞「制御可能性」 ×\n(D) controls … 動詞（三人称単数現在形）／名詞（複数形）「制御する／制御装置」 ×\n\n■ 完成文\nMars Motors' new clamping system makes their vehicles controllable even during emergency braking.\n（Mars Motors 社の新しいクランプ機構は、非常ブレーキ時でも車両を制御可能にする。）\n\n■ 解き方のポイント\nmake O C の C は形容詞。vehicles＝controllable のイコール関係。","words":[{"w":"clamping system","p":"名詞","m":"クランプ機構"},{"w":"vehicles","p":"名詞","m":"車両"},{"w":"controllable","p":"形容詞","m":"制御できる"},{"w":"emergency braking","p":"名詞","m":"非常ブレーキ"}]},{"id":316,"category":"品詞問題・実戦問題 発展編","question":"The newspaper recently employed an interior designer to match the drapes and wallpaper ______ with the antique desk in the editor's office.","A":"perfect","B":"perfected","C":"perfectly","D":"perfection","answer":"C","answer_word":"perfectly","explanation":"■ 文の骨格\nThe newspaper recently employed an interior designer to match the drapes and wallpaper ______ with the antique desk in the editor's office.\n\n■ 空所に入るもの\nmatch the drapes and wallpaper で他動詞＋目的語が完成しており、空所は修飾語。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) perfect … 形容詞「完璧な」 ×\n(B) perfected … 動詞の過去形・過去分詞「完成された」 ×\n(C) perfectly … 副詞「完璧に」 ○\n(D) perfection … 名詞「完璧さ」 ×\n\n■ 完成文\nThe newspaper recently employed an interior designer to match the drapes and wallpaper perfectly with the antique desk in the editor's office.\n（その新聞社は最近、編集長室のアンティーク机にカーテンと壁紙を完璧に合わせるため、インテリアデザイナーを雇った。）\n\n■ 解き方のポイント\n他動詞＋目的語の後ろの空所は副詞。","words":[{"w":"employed","p":"動詞（過去形）","m":"雇った"},{"w":"match","p":"動詞","m":"合わせる"},{"w":"drapes","p":"名詞","m":"カーテン"},{"w":"wallpaper","p":"名詞","m":"壁紙"},{"w":"perfectly","p":"副詞","m":"完璧に"}]},{"id":317,"category":"品詞問題・実戦問題 発展編","question":"The walls of the main dining room were decorated with a pattern ______ different from the other dining areas to create a sense of exclusivity.","A":"distinct","B":"distinctly","C":"distinguish","D":"distinction","answer":"B","answer_word":"distinctly","explanation":"■ 文の骨格\nThe walls of the main dining room were decorated with a pattern ______ different from the other dining areas to create a sense of exclusivity.\n\n■ 空所に入るもの\n名詞 a pattern を後ろから修飾する形容詞 different があり、空所はそれを修飾する位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) distinct … 形容詞「はっきり異なる」 ×\n(B) distinctly … 副詞「はっきりと、まったく」 ○\n(C) distinguish … 動詞（原形）「区別する」 ×\n(D) distinction … 名詞「区別」 ×\n\n■ 完成文\nThe walls of the main dining room were decorated with a pattern distinctly different from the other dining areas to create a sense of exclusivity.\n（メインダイニングルームの壁は、特別感を出すため、ほかのダイニングスペースとはまったく異なる模様で装飾された。）\n\n■ 解き方のポイント\n形容詞の直前の空所は副詞。","words":[{"w":"decorated","p":"動詞（過去分詞）","m":"装飾された"},{"w":"pattern","p":"名詞","m":"模様"},{"w":"distinctly","p":"副詞","m":"はっきりと"},{"w":"different from","p":"熟語","m":"〜と異なる"},{"w":"exclusivity","p":"名詞","m":"特別感、高級感"}]},{"id":318,"category":"品詞問題・実戦問題 発展編","question":"Yamato Insurance Group has designed a new automobile insurance policy ______ to appeal to senior drivers.","A":"specify","B":"specifying","C":"specifications","D":"specifically","answer":"D","answer_word":"specifically","explanation":"■ 文の骨格\nYamato Insurance Group has designed a new automobile insurance policy ______ to appeal to senior drivers.\n\n■ 空所に入るもの\ndesigned ... to appeal という形がすでに成立しており、空所は目的を表す不定詞を修飾する位置。\n→ 空所には「不定詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) specify … 動詞（原形）「明記する」 ×\n(B) specifying … 現在分詞・動名詞「明記すること」 ×\n(C) specifications … 名詞（複数形）「仕様書」 ×\n(D) specifically … 副詞「特に、とりわけ」 ○\n\n■ 完成文\nYamato Insurance Group has designed a new automobile insurance policy specifically to appeal to senior drivers.\n（Yamato 保険グループは、とりわけ高齢ドライバーに訴求するための新しい自動車保険を設計した。）\n\n■ 解き方のポイント\nspecifically to do＝「特に〜するために」。文の要素が完成していれば副詞。","words":[{"w":"Insurance","p":"名詞","m":"保険"},{"w":"designed","p":"動詞（過去分詞）","m":"設計した"},{"w":"policy","p":"名詞","m":"保険契約、方針"},{"w":"specifically","p":"副詞","m":"特に"},{"w":"appeal to","p":"熟語","m":"〜に訴求する"}]},{"id":319,"category":"品詞問題・実戦問題 発展編","question":"OnePhone is getting ready to send a software update to its customers that will allow the device to more ______ display signal reception.","A":"accurate","B":"accurately","C":"accuracy","D":"accuracies","answer":"B","answer_word":"accurately","explanation":"■ 文の骨格\nOnePhone is getting ready to send a software update to its customers that will allow the device to more ______ display signal reception.\n\n■ 空所に入るもの\ndisplay signal reception で動詞＋目的語が成立しており、more とともに比較級をつくる副詞が必要。\n→ 空所には「動詞を修飾する副詞（比較級）」が必要です。\n\n■ 選択肢の確認\n(A) accurate … 形容詞「正確な」 ×\n(B) accurately … 副詞「正確に」 ○\n(C) accuracy … 名詞「正確さ」 ×\n(D) accuracies … 名詞（複数形）「正確さ」 ×\n\n■ 完成文\nOnePhone is getting ready to send a software update to its customers that will allow the device to more accurately display signal reception.\n（OnePhone 社は、機器が信号受信をより正確に表示できるようにするソフトウェア更新を顧客へ配信する準備を進めている。）\n\n■ 解き方のポイント\n〈more＋空所＋動詞〉は副詞の比較級。","words":[{"w":"software update","p":"名詞","m":"ソフトウェア更新"},{"w":"device","p":"名詞","m":"機器"},{"w":"accurately","p":"副詞","m":"正確に"},{"w":"display","p":"動詞","m":"表示する"},{"w":"signal reception","p":"名詞","m":"信号受信"}]},{"id":320,"category":"品詞問題・実戦問題 発展編","question":"A number of major airlines are planning to offer Internet ______ to passengers on international flights for a fee.","A":"connect","B":"connecting","C":"connections","D":"connects","answer":"C","answer_word":"connections","explanation":"■ 文の骨格\nA number of major airlines are planning to offer Internet ______ to passengers on international flights for a fee.\n\n■ 空所に入るもの\n他動詞 offer の目的語で、冠詞がないので複数形の名詞が必要。\n→ 空所には「Internet と複合名詞をつくる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) connect … 動詞（原形）「接続する」 ×\n(B) connecting … 現在分詞・動名詞「接続すること」 ×\n(C) connections … 名詞（複数形）「接続（サービス）」 ○\n(D) connects … 動詞（三人称単数現在形）「接続する」 ×\n\n■ 完成文\nA number of major airlines are planning to offer Internet connections to passengers on international flights for a fee.\n（多くの大手航空会社が、国際線の乗客に有料でインターネット接続を提供する計画を立てている。）\n\n■ 解き方のポイント\nInternet connections（インターネット接続）は複合名詞。冠詞がなければ複数形。","words":[{"w":"A number of","p":"熟語","m":"多くの"},{"w":"airlines","p":"名詞","m":"航空会社"},{"w":"connections","p":"名詞","m":"接続"},{"w":"international flights","p":"名詞","m":"国際線"},{"w":"for a fee","p":"熟語","m":"有料で"}]},{"id":321,"category":"品詞問題・実戦問題 発展編","question":"Mr. Lydon is an ______ musician who has performed with several of the world's most famous symphonic orchestras.","A":"accomplish","B":"accomplished","C":"accomplishing","D":"accomplishment","answer":"B","answer_word":"accomplished","explanation":"■ 文の骨格\nMr. Lydon is an ______ musician who has performed with several of the world's most famous symphonic orchestras.\n\n■ 空所に入るもの\n冠詞 an と名詞 musician の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する過去分詞（形容詞化）」が必要です。\n\n■ 選択肢の確認\n(A) accomplish … 動詞（原形）「成し遂げる」 ×\n(B) accomplished … 形容詞（過去分詞由来）「熟練した、優れた」 ○\n(C) accomplishing … 現在分詞・動名詞「成し遂げること」 ×\n(D) accomplishment … 名詞「業績、達成」 ×\n\n■ 完成文\nMr. Lydon is an accomplished musician who has performed with several of the world's most famous symphonic orchestras.\n（Lydon 氏は、世界で最も有名な交響楽団のいくつかと共演してきた熟練の音楽家だ。）\n\n■ 解き方のポイント\nan accomplished ＋人＝「熟練した〜」。過去分詞から形容詞化した語。","words":[{"w":"accomplished","p":"形容詞","m":"熟練した"},{"w":"musician","p":"名詞","m":"音楽家"},{"w":"performed","p":"動詞（過去分詞）","m":"演奏した"},{"w":"symphonic orchestras","p":"名詞","m":"交響楽団"}]},{"id":322,"category":"品詞問題・実戦問題 発展編","question":"Due to low ______ last year, it has been decided that this year's conference will be held in a smaller venue.","A":"attend","B":"attendees","C":"attendance","D":"attending","answer":"C","answer_word":"attendance","explanation":"■ 文の骨格\nDue to low ______ last year, it has been decided that this year's conference will be held in a smaller venue.\n\n■ 空所に入るもの\nDue to の目的語で、冠詞がないので不可算名詞が必要。\n→ 空所には「形容詞 low に修飾される名詞（不可算）」が必要です。\n\n■ 選択肢の確認\n(A) attend … 動詞（原形）「出席する」 ×\n(B) attendees … 名詞（複数形・人）「参加者」 ×\n(C) attendance … 名詞（不可算）「出席者数、参加率」 ○\n(D) attending … 現在分詞・動名詞「出席すること」 ×\n\n■ 完成文\nDue to low attendance last year, it has been decided that this year's conference will be held in a smaller venue.\n（昨年の参加者数が少なかったため、今年の会議はより小さな会場で開催されることが決まった。）\n\n■ 解き方のポイント\nlow attendance（参加者数が少ない）。冠詞がなければ不可算名詞。","words":[{"w":"Due to","p":"熟語","m":"〜のため"},{"w":"attendance","p":"名詞","m":"出席者数"},{"w":"conference","p":"名詞","m":"会議"},{"w":"venue","p":"名詞","m":"会場"}]},{"id":323,"category":"品詞問題・実戦問題 発展編","question":"Tropical Hotel's central location makes it ______ for business and leisure travelers who wish to stay in the hub of Melbourne.","A":"ideal","B":"idealize","C":"ideally","D":"idealization","answer":"A","answer_word":"ideal","explanation":"■ 文の骨格\nTropical Hotel's central location makes it ______ for business and leisure travelers who wish to stay in the hub of Melbourne.\n\n■ 空所に入るもの\nmake O C の形で、目的語 it の状態を表す補語が必要。\n→ 空所には「make の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) ideal … 形容詞「理想的な」 ○\n(B) idealize … 動詞（原形）「理想化する」 ×\n(C) ideally … 副詞「理想的に」 ×\n(D) idealization … 名詞「理想化」 ×\n\n■ 完成文\nTropical Hotel's central location makes it ideal for business and leisure travelers who wish to stay in the hub of Melbourne.\n（Tropical ホテルは都心の立地により、メルボルンの中心部に滞在したい出張・観光の旅行者にとって理想的だ。）\n\n■ 解き方のポイント\nmake it ＿＿ for X の空所は補語＝形容詞。","words":[{"w":"central location","p":"名詞","m":"都心の立地"},{"w":"ideal","p":"形容詞","m":"理想的な"},{"w":"leisure","p":"名詞","m":"余暇、観光"},{"w":"hub","p":"名詞","m":"中心部"}]},{"id":324,"category":"品詞問題・実戦問題 発展編","question":"Many restaurants in the state have been selling their ______ cooking oil for use as an alternative fuel source.","A":"use","B":"used","C":"using","D":"uses","answer":"B","answer_word":"used","explanation":"■ 文の骨格\nMany restaurants in the state have been selling their ______ cooking oil for use as an alternative fuel source.\n\n■ 空所に入るもの\n所有格 their と名詞句 cooking oil の間にあり、受け身の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) use … 名詞／動詞「使用／使う」 ×\n(B) used … 過去分詞・形容詞「使用済みの」 ○\n(C) using … 現在分詞・動名詞「使うこと」 ×\n(D) uses … 動詞（三人称単数現在形）／名詞（複数形）「使う／用途」 ×\n\n■ 完成文\nMany restaurants in the state have been selling their used cooking oil for use as an alternative fuel source.\n（その州の多くのレストランは、代替燃料源としての用途で使用済み食用油を販売している。）\n\n■ 解き方のポイント\nused cooking oil＝「使用済み食用油」。名詞の前で受け身なら過去分詞。","words":[{"w":"state","p":"名詞","m":"州"},{"w":"used","p":"形容詞","m":"使用済みの"},{"w":"cooking oil","p":"名詞","m":"食用油"},{"w":"alternative","p":"形容詞","m":"代替の"},{"w":"fuel source","p":"名詞","m":"燃料源"}]},{"id":325,"category":"品詞問題・実戦問題 発展編","question":"Some delays can be expected during the ______ of the Southeast Freeway from two lanes to four.","A":"widening","B":"wide","C":"widely","D":"width","answer":"A","answer_word":"widening","explanation":"■ 文の骨格\nSome delays can be expected during the ______ of the Southeast Freeway from two lanes to four.\n\n■ 空所に入るもの\n前置詞 during の目的語で、the と of に挟まれた名詞が必要。\n→ 空所には「the と of の間に置く名詞（動名詞由来）」が必要です。\n\n■ 選択肢の確認\n(A) widening … 名詞（動名詞由来）「拡幅」 ○\n(B) wide … 形容詞「広い」 ×\n(C) widely … 副詞「広く」 ×\n(D) width … 名詞「幅」 ×\n\n■ 完成文\nSome delays can be expected during the widening of the Southeast Freeway from two lanes to four.\n（南東高速道路を2車線から4車線に拡幅する工事の間、多少の遅れが予想される。）\n\n■ 解き方のポイント\n〈the ＿＿ of〉は名詞。動名詞が名詞化した widening が文意に合う。","words":[{"w":"delays","p":"名詞","m":"遅れ"},{"w":"expected","p":"動詞（過去分詞）","m":"予想される"},{"w":"widening","p":"名詞","m":"拡幅"},{"w":"Freeway","p":"名詞","m":"高速道路"},{"w":"lanes","p":"名詞","m":"車線"}]},{"id":326,"category":"品詞問題・実戦問題 発展編","question":"Seminar ______ who filled in the survey on the last day were awarded a pen marked with the logo of the organizers.","A":"participate","B":"participant","C":"participation","D":"participants","answer":"D","answer_word":"participants","explanation":"■ 文の骨格\nSeminar ______ who filled in the survey on the last day were awarded a pen marked with the logo of the organizers.\n\n■ 空所に入るもの\n関係代名詞 who が続くので先行詞は「人」。述語動詞 were から複数形。\n→ 空所には「Seminar と複合名詞をつくる複数名詞（人）」が必要です。\n\n■ 選択肢の確認\n(A) participate … 動詞（原形）「参加する」 ×\n(B) participant … 名詞（単数形・人）「参加者」 ×\n(C) participation … 名詞（不可算）「参加」 ×\n(D) participants … 名詞（複数形・人）「参加者」 ○\n\n■ 完成文\nSeminar participants who filled in the survey on the last day were awarded a pen marked with the logo of the organizers.\n（最終日にアンケートに記入したセミナー参加者には、主催者のロゴ入りのペンが贈られた。）\n\n■ 解き方のポイント\nwho＝人、were＝複数。2つの手がかりで複数形の人名詞に絞れる。","words":[{"w":"participants","p":"名詞","m":"参加者"},{"w":"filled in","p":"熟語","m":"記入した"},{"w":"survey","p":"名詞","m":"アンケート"},{"w":"awarded","p":"動詞（過去分詞）","m":"贈られた"},{"w":"organizers","p":"名詞","m":"主催者"}]},{"id":327,"category":"品詞問題・実戦問題 発展編","question":"Lucas Janssen has requested that the marketing department examine trends ______ when implementing promotional campaigns.","A":"attentive","B":"attention","C":"most attentive","D":"more attentively","answer":"D","answer_word":"more attentively","explanation":"■ 文の骨格\nLucas Janssen has requested that the marketing department examine trends ______ when implementing promotional campaigns.\n\n■ 空所に入るもの\nexamine trends で他動詞＋目的語が完成しており、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞（比較級）」が必要です。\n\n■ 選択肢の確認\n(A) attentive … 形容詞「注意深い」 ×\n(B) attention … 名詞「注意」 ×\n(C) most attentive … 形容詞（最上級）「最も注意深い」 ×\n(D) more attentively … 副詞（比較級）「より注意深く」 ○\n\n■ 完成文\nLucas Janssen has requested that the marketing department examine trends more attentively when implementing promotional campaigns.\n（Lucas Janssen は、販促キャンペーンを実施する際にマーケティング部がトレンドをより注意深く分析するよう求めた。）\n\n■ 解き方のポイント\nSVO の後ろの空所は副詞。request that の後の動詞が原形（examine）である点も要チェック。","words":[{"w":"requested","p":"動詞（過去分詞）","m":"要求した"},{"w":"examine","p":"動詞","m":"分析する、調べる"},{"w":"trends","p":"名詞","m":"トレンド、傾向"},{"w":"more attentively","p":"副詞（比較級）","m":"より注意深く"},{"w":"implementing","p":"動名詞","m":"実施すること"}]},{"id":328,"category":"品詞問題・実戦問題 発展編","question":"Each ______ is asked to fill out an evaluation form to provide comments and suggestions for improving the workshop.","A":"individual","B":"individuals","C":"individualistic","D":"individualism","answer":"A","answer_word":"individual","explanation":"■ 文の骨格\nEach ______ is asked to fill out an evaluation form to provide comments and suggestions for improving the workshop.\n\n■ 空所に入るもの\nEach の後ろは必ず単数名詞。述語動詞も is で単数。\n→ 空所には「文の主語になる単数名詞」が必要です。\n\n■ 選択肢の確認\n(A) individual … 名詞（単数形・人）「個人、各人」 ○\n(B) individuals … 名詞（複数形）「個人」 ×\n(C) individualistic … 形容詞「個人主義的な」 ×\n(D) individualism … 名詞「個人主義」 ×\n\n■ 完成文\nEach individual is asked to fill out an evaluation form to provide comments and suggestions for improving the workshop.\n（各参加者は、ワークショップ改善のための意見や提案を記す評価用紙への記入を求められる。）\n\n■ 解き方のポイント\neach／every の後ろは単数名詞。動詞 is も単数の手がかり。","words":[{"w":"Each","p":"形容詞","m":"それぞれの"},{"w":"individual","p":"名詞","m":"個人、各人"},{"w":"fill out","p":"熟語","m":"記入する"},{"w":"evaluation form","p":"名詞","m":"評価用紙"},{"w":"suggestions","p":"名詞","m":"提案"}]},{"id":329,"category":"品詞問題・実戦問題 発展編","question":"The acknowledgements section of a book usually appears on the page ______ the table of contents.","A":"follow","B":"following","C":"follows","D":"follower","answer":"B","answer_word":"following","explanation":"■ 文の骨格\nThe acknowledgements section of a book usually appears on the page ______ the table of contents.\n\n■ 空所に入るもの\n名詞 the page を後ろから修飾し、the table of contents を目的語に取る語が必要。\n→ 空所には「名詞を後ろから修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) follow … 動詞（原形）「続く」 ×\n(B) following … 現在分詞「〜に続く」 ○\n(C) follows … 動詞（三人称単数現在形）「続く」 ×\n(D) follower … 名詞（人）「支持者」 ×\n\n■ 完成文\nThe acknowledgements section of a book usually appears on the page following the table of contents.\n（本の謝辞欄は通常、目次の次のページにある。）\n\n■ 解き方のポイント\n名詞の後ろで目的語を取る分詞は、能動なら現在分詞。","words":[{"w":"acknowledgements","p":"名詞","m":"謝辞"},{"w":"section","p":"名詞","m":"欄、章"},{"w":"appears","p":"動詞","m":"現れる、載る"},{"w":"following","p":"現在分詞","m":"〜に続く"},{"w":"table of contents","p":"名詞","m":"目次"}]},{"id":330,"category":"品詞問題・実戦問題 発展編","question":"Philips Pharmaceuticals announced to ______ that its sales revenue in the fourth quarter is likely to exceed expectations.","A":"invest","B":"investments","C":"investors","D":"investing","answer":"C","answer_word":"investors","explanation":"■ 文の骨格\nPhilips Pharmaceuticals announced to ______ that its sales revenue in the fourth quarter is likely to exceed expectations.\n\n■ 空所に入るもの\nannounce to X that ... の X にあたる「知らせる相手＝人」を表す名詞が必要。\n→ 空所には「前置詞 to の目的語になる複数名詞（人）」が必要です。\n\n■ 選択肢の確認\n(A) invest … 動詞（原形）「投資する」 ×\n(B) investments … 名詞（複数形・もの）「投資」 ×\n(C) investors … 名詞（複数形・人）「投資家」 ○\n(D) investing … 現在分詞・動名詞「投資すること」 ×\n\n■ 完成文\nPhilips Pharmaceuticals announced to investors that its sales revenue in the fourth quarter is likely to exceed expectations.\n（Philips Pharmaceuticals 社は投資家に対し、第4四半期の売上高が予想を上回りそうだと発表した。）\n\n■ 解き方のポイント\n「知らせる相手」なので人を表す名詞。-or は人を表す語尾。","words":[{"w":"Pharmaceuticals","p":"名詞","m":"製薬会社"},{"w":"investors","p":"名詞","m":"投資家"},{"w":"sales revenue","p":"名詞","m":"売上高"},{"w":"exceed","p":"動詞","m":"上回る"},{"w":"expectations","p":"名詞","m":"予想"}]},{"id":331,"category":"品詞問題・実戦問題 発展編","question":"Of all the ______ in the museum, the landscape painting by Susan Owen is by far the most famous.","A":"work","B":"works","C":"working","D":"worked","answer":"B","answer_word":"works","explanation":"■ 文の骨格\nOf all the ______ in the museum, the landscape painting by Susan Owen is by far the most famous.\n\n■ 空所に入るもの\nOf all the の後ろなので、複数形の名詞が必要。\n→ 空所には「前置詞 of の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) work … 名詞（不可算）「仕事」 ×\n(B) works … 名詞（複数形）「作品」 ○\n(C) working … 現在分詞・動名詞「働くこと」 ×\n(D) worked … 動詞の過去形・過去分詞「働いた」 ×\n\n■ 完成文\nOf all the works in the museum, the landscape painting by Susan Owen is by far the most famous.\n（美術館の全作品の中で、Susan Owen による風景画は群を抜いて最も有名だ。）\n\n■ 解き方のポイント\nwork は「仕事」なら不可算、「作品」なら可算。all the の後ろは複数形。","words":[{"w":"works","p":"名詞","m":"作品"},{"w":"museum","p":"名詞","m":"美術館"},{"w":"landscape painting","p":"名詞","m":"風景画"},{"w":"by far","p":"熟語","m":"群を抜いて"}]},{"id":332,"category":"品詞問題・実戦問題 発展編","question":"Please ensure that your submissions are ______ with the requirements of the Jules Mann Art Prize as outlined in the rulebook.","A":"complied","B":"compliance","C":"comply","D":"compliant","answer":"D","answer_word":"compliant","explanation":"■ 文の骨格\nPlease ensure that your submissions are ______ with the requirements of the Jules Mann Art Prize as outlined in the rulebook.\n\n■ 空所に入るもの\nare の補語が欠けており、with と結びついて意味が通る形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) complied … 動詞の過去形・過去分詞「従った」 ×\n(B) compliance … 名詞「順守」 ×\n(C) comply … 動詞（原形）「従う」 ×\n(D) compliant … 形容詞「順守している」 ○\n\n■ 完成文\nPlease ensure that your submissions are compliant with the requirements of the Jules Mann Art Prize as outlined in the rulebook.\n（応募作品が規則集に記載された Jules Mann Art Prize の要件を満たしていることを必ずご確認ください。）\n\n■ 解き方のポイント\nbe compliant with X＝「Xを順守している」。自動詞 comply の過去分詞では受動態にならない。","words":[{"w":"ensure","p":"動詞","m":"確認する"},{"w":"submissions","p":"名詞","m":"応募作品"},{"w":"compliant","p":"形容詞","m":"順守している"},{"w":"requirements","p":"名詞","m":"要件"},{"w":"outlined","p":"動詞（過去分詞）","m":"概説された"}]},{"id":333,"category":"動詞問題・トレーニング","question":"Seaside Hotel is now ______ a manager for their newly opened branch in Urayasu.","A":"recruit","B":"recruits","C":"recruiting","D":"recruitment","answer":"C","answer_word":"recruiting","explanation":"■ 文の骨格\nSeaside Hotel is now ______ a manager for their newly opened branch in Urayasu.\n\n■ 空所に入るもの\nbe動詞 is の後ろで、目的語 a manager を取る現在進行形が必要。\n→ 空所には「進行形をつくる現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) recruit … 動詞（原形）「採用する」 ×\n(B) recruits … 動詞（三人称単数現在形）「採用する」 ×\n(C) recruiting … 現在分詞「採用している」 ○\n(D) recruitment … 名詞「採用（活動）」 ×\n\n■ 完成文\nSeaside Hotel is now recruiting a manager for their newly opened branch in Urayasu.\n（Seaside ホテルは現在、浦安に新しく開業した支店の支配人を募集している。）\n\n■ 解き方のポイント\n〈be動詞＋空所〉で後ろに目的語があれば進行形（-ing）。","words":[{"w":"recruiting","p":"現在分詞","m":"採用している"},{"w":"manager","p":"名詞","m":"支配人"},{"w":"newly opened","p":"形容詞句","m":"新しく開業した"},{"w":"branch","p":"名詞","m":"支店"}]},{"id":334,"category":"動詞問題・トレーニング","question":"The new city regulation ______ only to companies with 100 or more employees.","A":"pertinent","B":"pertains","C":"pertaining","D":"pertain","answer":"B","answer_word":"pertains","explanation":"■ 文の骨格\nThe new city regulation ______ only to companies with 100 or more employees.\n\n■ 空所に入るもの\n主語 The new city regulation に対する述語動詞が欠けている。主語は単数。\n→ 空所には「述語動詞（三人称単数現在形）」が必要です。\n\n■ 選択肢の確認\n(A) pertinent … 形容詞「関連する」 ×\n(B) pertains … 動詞（三人称単数現在形）「関係する、当てはまる」 ○\n(C) pertaining … 現在分詞・動名詞「関係している」 ×\n(D) pertain … 動詞（原形）「関係する」 ×\n\n■ 完成文\nThe new city regulation pertains only to companies with 100 or more employees.\n（新しい市の条例は、従業員100人以上の企業にのみ適用される。）\n\n■ 解き方のポイント\n主語が三人称単数なので動詞に -s。pertain to X＝「Xに関係する」。","words":[{"w":"regulation","p":"名詞","m":"条例、規則"},{"w":"pertains to","p":"熟語","m":"〜に当てはまる"},{"w":"companies","p":"名詞","m":"企業"},{"w":"employees","p":"名詞","m":"従業員"}]},{"id":335,"category":"動詞問題・トレーニング","question":"Fountain Investment could possibly ______ the goal of a 30 percent reduction in operational costs for the year.","A":"achieve","B":"achieving","C":"achieves","D":"achievable","answer":"A","answer_word":"achieve","explanation":"■ 文の骨格\nFountain Investment could possibly ______ the goal of a 30 percent reduction in operational costs for the year.\n\n■ 空所に入るもの\n助動詞 could の後ろなので、動詞は原形でなければならない。\n→ 空所には「助動詞の後に置く動詞の原形」が必要です。\n\n■ 選択肢の確認\n(A) achieve … 動詞（原形）「達成する」 ○\n(B) achieving … 現在分詞・動名詞「達成すること」 ×\n(C) achieves … 動詞（三人称単数現在形）「達成する」 ×\n(D) achievable … 形容詞「達成可能な」 ×\n\n■ 完成文\nFountain Investment could possibly achieve the goal of a 30 percent reduction in operational costs for the year.\n（Fountain Investment 社は、今年の運用コスト30％削減という目標を達成できるかもしれない。）\n\n■ 解き方のポイント\n助動詞（can/could/will/must など）の直後は必ず動詞の原形。","words":[{"w":"possibly","p":"副詞","m":"ひょっとすると"},{"w":"achieve","p":"動詞","m":"達成する"},{"w":"goal","p":"名詞","m":"目標"},{"w":"reduction","p":"名詞","m":"削減"},{"w":"operational costs","p":"名詞","m":"運用コスト"}]},{"id":336,"category":"動詞問題・トレーニング","question":"For a short time, Greg Smith lived in the Village of Caronport before ______ to Vancouver Island at the age of eighteen.","A":"move","B":"moves","C":"moving","D":"movement","answer":"C","answer_word":"moving","explanation":"■ 文の骨格\nFor a short time, Greg Smith lived in the Village of Caronport before ______ to Vancouver Island at the age of eighteen.\n\n■ 空所に入るもの\nbefore はここでは前置詞で、後ろには名詞か動名詞が入る。\n→ 空所には「前置詞 before の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) move … 動詞（原形）「引っ越す」 ×\n(B) moves … 動詞（三人称単数現在形）「引っ越す」 ×\n(C) moving … 動名詞「引っ越すこと」 ○\n(D) movement … 名詞「動き、運動」 ×\n\n■ 完成文\nFor a short time, Greg Smith lived in the Village of Caronport before moving to Vancouver Island at the age of eighteen.\n（Greg Smith は18歳で Vancouver 島に引っ越す前、短い期間 Caronport 村に住んでいた。）\n\n■ 解き方のポイント\nbefore / after は接続詞にも前置詞にもなる。後ろに主語がなければ前置詞＋動名詞。","words":[{"w":"Village","p":"名詞","m":"村"},{"w":"before","p":"前置詞","m":"〜の前に"},{"w":"moving","p":"動名詞","m":"引っ越すこと"},{"w":"at the age of","p":"熟語","m":"〜歳のときに"}]},{"id":337,"category":"動詞問題・トレーニング","question":"Gary Anderson was honored by family and friends at a party ______ his retirement after nearly 35 years of service.","A":"celebrate","B":"celebrating","C":"celebrated","D":"celebration","answer":"B","answer_word":"celebrating","explanation":"■ 文の骨格\nGary Anderson was honored by family and friends at a party ______ his retirement after nearly 35 years of service.\n\n■ 空所に入るもの\n名詞 a party を後ろから修飾し、his retirement を目的語に取る語が必要。\n→ 空所には「名詞を後ろから修飾する現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) celebrate … 動詞（原形）「祝う」 ×\n(B) celebrating … 現在分詞「祝う」 ○\n(C) celebrated … 過去分詞「祝われた」 ×\n(D) celebration … 名詞「祝賀」 ×\n\n■ 完成文\nGary Anderson was honored by family and friends at a party celebrating his retirement after nearly 35 years of service.\n（Gary Anderson は、35年近い勤務を経た退職を祝うパーティーで、家族と友人から称えられた。）\n\n■ 解き方のポイント\n名詞の後ろで目的語を取る分詞は、能動なら現在分詞。","words":[{"w":"honored","p":"動詞（過去分詞）","m":"称えられた"},{"w":"celebrating","p":"現在分詞","m":"祝う"},{"w":"retirement","p":"名詞","m":"退職"},{"w":"service","p":"名詞","m":"勤務"}]},{"id":338,"category":"動詞問題・トレーニング","question":"To apply for a patent, several countries still require that all documents ______ into their own languages.","A":"translate","B":"are translating","C":"translated","D":"be translated","answer":"D","answer_word":"be translated","explanation":"■ 文の骨格\nTo apply for a patent, several countries still require that all documents ______ into their own languages.\n\n■ 空所に入るもの\nrequire that ... の節内では動詞が原形になる。documents は「翻訳される」側なので受動。\n→ 空所には「require that 節内の動詞（原形）」が必要です。\n\n■ 選択肢の確認\n(A) translate … 動詞（原形・能動）「翻訳する」 ×\n(B) are translating … 現在進行形「翻訳している」 ×\n(C) translated … 動詞の過去形・過去分詞「翻訳された」 ×\n(D) be translated … 原形の受動態「翻訳される」 ○\n\n■ 完成文\nTo apply for a patent, several countries still require that all documents be translated into their own languages.\n（特許を出願するには、いくつかの国では今も全書類を自国語に翻訳することを求めている。）\n\n■ 解き方のポイント\nrequire / request / suggest / recommend に続く that 節は動詞が原形。受動なら be＋過去分詞。","words":[{"w":"apply for","p":"熟語","m":"出願する"},{"w":"patent","p":"名詞","m":"特許"},{"w":"require","p":"動詞","m":"求める"},{"w":"documents","p":"名詞","m":"書類"},{"w":"be translated","p":"受動態（原形）","m":"翻訳される"}]},{"id":339,"category":"動詞問題・トレーニング","question":"Future Software is a company that produces language learning materials for which it ______ numerous awards over the past ten years.","A":"receives","B":"has received","C":"is receiving","D":"would receive","answer":"B","answer_word":"has received","explanation":"■ 文の骨格\nFuture Software is a company that produces language learning materials for which it ______ numerous awards over the past ten years.\n\n■ 空所に入るもの\nover the past ten years（この10年間で）は現在完了形と結びつく。\n→ 空所には「現在完了形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) receives … 現在形「受け取る」 ×\n(B) has received … 現在完了形「受け取ってきた」 ○\n(C) is receiving … 現在進行形「受け取っている」 ×\n(D) would receive … 過去未来形「受け取るだろう」 ×\n\n■ 完成文\nFuture Software is a company that produces language learning materials for which it has received numerous awards over the past ten years.\n（Future Software 社は語学教材を制作する会社で、この10年間にその教材で数多くの賞を受けてきた。）\n\n■ 解き方のポイント\nover the past ... / for the last ... は現在完了形の目印。","words":[{"w":"produces","p":"動詞","m":"制作する"},{"w":"language learning materials","p":"名詞","m":"語学教材"},{"w":"has received","p":"動詞（現在完了）","m":"受けてきた"},{"w":"numerous","p":"形容詞","m":"数多くの"}]},{"id":340,"category":"動詞問題・トレーニング","question":"The lounges on the third floor ______ for business and first-class passengers with a same-day return ticket.","A":"reserved","B":"have been reserving","C":"reserving","D":"are reserved","answer":"D","answer_word":"are reserved","explanation":"■ 文の骨格\nThe lounges on the third floor ______ for business and first-class passengers with a same-day return ticket.\n\n■ 空所に入るもの\n主語 The lounges は「確保される」側なので受動態が必要。\n→ 空所には「受動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) reserved … 動詞の過去形・過去分詞「確保した」 ×\n(B) have been reserving … 現在完了進行形「確保し続けている」 ×\n(C) reserving … 現在分詞・動名詞「確保すること」 ×\n(D) are reserved … 受動態（現在形）「確保されている」 ○\n\n■ 完成文\nThe lounges on the third floor are reserved for business and first-class passengers with a same-day return ticket.\n（3階のラウンジは、当日往復チケットをお持ちのビジネスクラスおよびファーストクラスのお客様専用です。）\n\n■ 解き方のポイント\n主語が「する側」か「される側」かで能動・受動を決める。ラウンジは確保される側。","words":[{"w":"lounges","p":"名詞","m":"ラウンジ"},{"w":"are reserved","p":"受動態","m":"確保されている"},{"w":"passengers","p":"名詞","m":"乗客"},{"w":"same-day","p":"形容詞","m":"当日の"}]},{"id":341,"category":"動詞問題・トレーニング","question":"______ more than 1,000 people, Sunshine Manufacturing is one of the most important businesses in the town of Bicol.","A":"Employ","B":"Employed","C":"Employing","D":"Employment","answer":"C","answer_word":"Employing","explanation":"■ 文の骨格\n______ more than 1,000 people, Sunshine Manufacturing is one of the most important businesses in the town of Bicol.\n\n■ 空所に入るもの\n主節の主語 Sunshine Manufacturing が「雇う」側なので、能動の分詞構文になる。\n→ 空所には「分詞構文をつくる現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) Employ … 動詞（原形）「雇う」 ×\n(B) Employed … 過去分詞「雇われた」 ×\n(C) Employing … 現在分詞「雇っている」 ○\n(D) Employment … 名詞「雇用」 ×\n\n■ 完成文\nEmploying more than 1,000 people, Sunshine Manufacturing is one of the most important businesses in the town of Bicol.\n（1,000人以上を雇用する Sunshine Manufacturing 社は、Bicol 町で最も重要な企業の1つだ。）\n\n■ 解き方のポイント\n分詞構文は主節の主語との関係で決まる。能動なら -ing、受動なら過去分詞。","words":[{"w":"Employing","p":"現在分詞","m":"雇っている"},{"w":"Manufacturing","p":"名詞","m":"製造（会社）"},{"w":"businesses","p":"名詞","m":"企業"},{"w":"town","p":"名詞","m":"町"}]},{"id":342,"category":"動詞問題・実戦問題 基本編","question":"Before submitting a request, please ______ to the vacation policy printed in the employee manual.","A":"refer","B":"referred","C":"referring","D":"to refer","answer":"A","answer_word":"refer","explanation":"■ 文の骨格\nBefore submitting a request, please ______ to the vacation policy printed in the employee manual.\n\n■ 空所に入るもの\nplease に続く命令文なので、動詞は原形でなければならない。\n→ 空所には「命令文の動詞（原形）」が必要です。\n\n■ 選択肢の確認\n(A) refer … 動詞（原形）「参照する」 ○\n(B) referred … 動詞の過去形・過去分詞「参照した」 ×\n(C) referring … 現在分詞・動名詞「参照すること」 ×\n(D) to refer … 不定詞「参照すること」 ×\n\n■ 完成文\nBefore submitting a request, please refer to the vacation policy printed in the employee manual.\n（申請書を提出する前に、就業規則に記載の休暇方針をご参照ください。）\n\n■ 解き方のポイント\nPlease＋動詞の原形。refer to X＝「Xを参照する」。","words":[{"w":"submitting","p":"動名詞","m":"提出すること"},{"w":"refer to","p":"熟語","m":"参照する"},{"w":"vacation policy","p":"名詞","m":"休暇方針"},{"w":"employee manual","p":"名詞","m":"就業規則、社員手帳"}]},{"id":343,"category":"動詞問題・実戦問題 基本編","question":"As Ms. Smith has already received a permit from the city, she looks forward to ______ construction of her driveway soon.","A":"begin","B":"began","C":"begins","D":"beginning","answer":"D","answer_word":"beginning","explanation":"■ 文の骨格\nAs Ms. Smith has already received a permit from the city, she looks forward to ______ construction of her driveway soon.\n\n■ 空所に入るもの\nlook forward to の to は前置詞なので、後ろは動名詞。さらに目的語 construction を取る。\n→ 空所には「前置詞 to の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) begin … 動詞（原形）「始める」 ×\n(B) began … 動詞（過去形）「始めた」 ×\n(C) begins … 動詞（三人称単数現在形）「始める」 ×\n(D) beginning … 動名詞「始めること」 ○\n\n■ 完成文\nAs Ms. Smith has already received a permit from the city, she looks forward to beginning construction of her driveway soon.\n（Smith さんはすでに市から許可証を得ているので、まもなく私道の工事を始めることを楽しみにしている。）\n\n■ 解き方のポイント\nlook forward to の to は前置詞。不定詞と混同させる頻出パターン。","words":[{"w":"permit","p":"名詞","m":"許可証"},{"w":"looks forward to","p":"熟語","m":"〜を楽しみにする"},{"w":"beginning","p":"動名詞","m":"始めること"},{"w":"driveway","p":"名詞","m":"私道"}]},{"id":344,"category":"動詞問題・実戦問題 基本編","question":"Apple Airways announced that it will temporarily ______ the number of weekly flights to Bangkok from June 1.","A":"reduce","B":"reduces","C":"reduced","D":"reducing","answer":"A","answer_word":"reduce","explanation":"■ 文の骨格\nApple Airways announced that it will temporarily ______ the number of weekly flights to Bangkok from June 1.\n\n■ 空所に入るもの\n助動詞 will と副詞 temporarily の後ろなので、動詞は原形。\n→ 空所には「助動詞の後に置く動詞の原形」が必要です。\n\n■ 選択肢の確認\n(A) reduce … 動詞（原形）「減らす」 ○\n(B) reduces … 動詞（三人称単数現在形）「減らす」 ×\n(C) reduced … 動詞の過去形・過去分詞「減らした」 ×\n(D) reducing … 現在分詞・動名詞「減らすこと」 ×\n\n■ 完成文\nApple Airways announced that it will temporarily reduce the number of weekly flights to Bangkok from June 1.\n（Apple 航空は、6月1日からバンコク行きの週間便数を一時的に減らすと発表した。）\n\n■ 解き方のポイント\n助動詞と動詞の間に副詞が入っても、動詞は原形のまま。","words":[{"w":"announced","p":"動詞（過去形）","m":"発表した"},{"w":"temporarily","p":"副詞","m":"一時的に"},{"w":"reduce","p":"動詞","m":"減らす"},{"w":"weekly flights","p":"名詞","m":"週間便"}]},{"id":345,"category":"動詞問題・実戦問題 基本編","question":"The Tokyo Tribune ______ 50 percent off home delivery for new readers when they sign up for a year's subscription.","A":"offer","B":"is offering","C":"offering","D":"have offered","answer":"B","answer_word":"is offering","explanation":"■ 文の骨格\nThe Tokyo Tribune ______ 50 percent off home delivery for new readers when they sign up for a year's subscription.\n\n■ 空所に入るもの\n主語 The Tokyo Tribune は単数なので、動詞も単数に対応する形が必要。\n→ 空所には「単数主語に対応する述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) offer … 動詞（原形・複数対応）「提供する」 ×\n(B) is offering … 現在進行形（単数）「提供している」 ○\n(C) offering … 現在分詞・動名詞「提供すること」 ×\n(D) have offered … 現在完了形（複数対応）「提供してきた」 ×\n\n■ 完成文\nThe Tokyo Tribune is offering 50 percent off home delivery for new readers when they sign up for a year's subscription.\n（The Tokyo Tribune 紙は、年間購読を申し込む新規読者に宅配料金の50％割引を提供している。）\n\n■ 解き方のポイント\n主語の単複と動詞の一致を確認する。新聞名は単数扱い。","words":[{"w":"is offering","p":"現在進行形","m":"提供している"},{"w":"home delivery","p":"名詞","m":"宅配"},{"w":"sign up for","p":"熟語","m":"〜を申し込む"},{"w":"subscription","p":"名詞","m":"定期購読"}]},{"id":346,"category":"動詞問題・実戦問題 基本編","question":"A passenger criticized the travel agency for ______ to respond quickly to her request for discount tickets.","A":"failing","B":"was failing","C":"has failed","D":"fails","answer":"A","answer_word":"failing","explanation":"■ 文の骨格\nA passenger criticized the travel agency for ______ to respond quickly to her request for discount tickets.\n\n■ 空所に入るもの\ncriticize X for doing の形で、前置詞 for の後ろは動名詞。\n→ 空所には「前置詞 for の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) failing … 動名詞「〜しそこなうこと」 ○\n(B) was failing … 過去進行形「失敗していた」 ×\n(C) has failed … 現在完了形「失敗した」 ×\n(D) fails … 動詞（三人称単数現在形）「失敗する」 ×\n\n■ 完成文\nA passenger criticized the travel agency for failing to respond quickly to her request for discount tickets.\n（ある乗客は、割引チケットの依頼に迅速に対応しなかったとして旅行代理店を批判した。）\n\n■ 解き方のポイント\ncriticize X for doing／thank X for doing など、for の後ろは動名詞。","words":[{"w":"passenger","p":"名詞","m":"乗客"},{"w":"criticized","p":"動詞（過去形）","m":"批判した"},{"w":"travel agency","p":"名詞","m":"旅行代理店"},{"w":"failing to","p":"熟語","m":"〜しそこなうこと"},{"w":"respond","p":"動詞","m":"対応する"}]},{"id":347,"category":"動詞問題・実戦問題 基本編","question":"Mail carriers ______ to wear comfortable shoes as their work involves considerable walking.","A":"encourage","B":"encouraging","C":"are encouraged","D":"have encouraged","answer":"C","answer_word":"are encouraged","explanation":"■ 文の骨格\nMail carriers ______ to wear comfortable shoes as their work involves considerable walking.\n\n■ 空所に入るもの\n主語 Mail carriers は「奨励される」側なので受動態が必要。\n→ 空所には「受動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) encourage … 動詞（原形）「奨励する」 ×\n(B) encouraging … 現在分詞・動名詞「奨励すること」 ×\n(C) are encouraged … 受動態（現在形）「奨励されている」 ○\n(D) have encouraged … 現在完了形（能動）「奨励してきた」 ×\n\n■ 完成文\nMail carriers are encouraged to wear comfortable shoes as their work involves considerable walking.\n（郵便配達員は業務でかなりの距離を歩くため、履き心地のよい靴を履くよう奨励されている。）\n\n■ 解き方のポイント\nbe encouraged to do＝「〜するよう奨励される」。主語が「される側」なら受動態。","words":[{"w":"Mail carriers","p":"名詞","m":"郵便配達員"},{"w":"are encouraged","p":"受動態","m":"奨励されている"},{"w":"comfortable","p":"形容詞","m":"履き心地のよい"},{"w":"involves","p":"動詞","m":"伴う"},{"w":"considerable","p":"形容詞","m":"かなりの"}]},{"id":348,"category":"動詞問題・実戦問題 基本編","question":"The DroidPhone 9000 is built for durability and should ______ being dropped from heights of up to seven meters.","A":"withstand","B":"withstood","C":"withstanding","D":"withstands","answer":"A","answer_word":"withstand","explanation":"■ 文の骨格\nThe DroidPhone 9000 is built for durability and should ______ being dropped from heights of up to seven meters.\n\n■ 空所に入るもの\n助動詞 should の後ろなので、動詞は原形でなければならない。\n→ 空所には「助動詞の後に置く動詞の原形」が必要です。\n\n■ 選択肢の確認\n(A) withstand … 動詞（原形）「耐える」 ○\n(B) withstood … 動詞の過去形・過去分詞「耐えた」 ×\n(C) withstanding … 現在分詞・動名詞「耐えること」 ×\n(D) withstands … 動詞（三人称単数現在形）「耐える」 ×\n\n■ 完成文\nThe DroidPhone 9000 is built for durability and should withstand being dropped from heights of up to seven meters.\n（DroidPhone 9000 は耐久性を重視して作られており、最大7メートルの高さからの落下にも耐えられるはずだ。）\n\n■ 解き方のポイント\n助動詞の直後は必ず動詞の原形。","words":[{"w":"built","p":"動詞（過去分詞）","m":"作られた"},{"w":"durability","p":"名詞","m":"耐久性"},{"w":"withstand","p":"動詞","m":"耐える"},{"w":"dropped","p":"動詞（過去分詞）","m":"落とされた"},{"w":"heights","p":"名詞","m":"高さ"}]},{"id":349,"category":"動詞問題・実戦問題 基本編","question":"The manager hired additional employees ______ in the store during the busy summer months.","A":"assist","B":"assisted","C":"assists","D":"to assist","answer":"D","answer_word":"to assist","explanation":"■ 文の骨格\nThe manager hired additional employees ______ in the store during the busy summer months.\n\n■ 空所に入るもの\nhired additional employees で SVO が完成しており、「〜するために」を表す不定詞が入る。\n→ 空所には「目的を表す不定詞」が必要です。\n\n■ 選択肢の確認\n(A) assist … 動詞（原形）「手伝う」 ×\n(B) assisted … 動詞の過去形・過去分詞「手伝った」 ×\n(C) assists … 動詞（三人称単数現在形）「手伝う」 ×\n(D) to assist … 不定詞「手伝うために」 ○\n\n■ 完成文\nThe manager hired additional employees to assist in the store during the busy summer months.\n（店長は、繁忙期の夏の数か月間に店を手伝ってもらうため、追加の従業員を雇った。）\n\n■ 解き方のポイント\n文の要素が完成した後ろで「〜するために」を表すのは不定詞。","words":[{"w":"hired","p":"動詞（過去形）","m":"雇った"},{"w":"additional","p":"形容詞","m":"追加の"},{"w":"to assist","p":"不定詞","m":"手伝うために"},{"w":"busy","p":"形容詞","m":"忙しい"}]},{"id":350,"category":"動詞問題・実戦問題 基本編","question":"Beyond the dwindling supply, the multinational oil giant is facing a growing number of risks that could ______ its future.","A":"jeopardize","B":"jeopardized","C":"jeopardizing","D":"will jeopardize","answer":"A","answer_word":"jeopardize","explanation":"■ 文の骨格\nBeyond the dwindling supply, the multinational oil giant is facing a growing number of risks that could ______ its future.\n\n■ 空所に入るもの\n助動詞 could の後ろなので、動詞は原形でなければならない。\n→ 空所には「助動詞の後に置く動詞の原形」が必要です。\n\n■ 選択肢の確認\n(A) jeopardize … 動詞（原形）「危うくする」 ○\n(B) jeopardized … 動詞の過去形・過去分詞「危うくされた」 ×\n(C) jeopardizing … 現在分詞・動名詞「危うくすること」 ×\n(D) will jeopardize … 助動詞＋動詞「危うくするだろう」 ×\n\n■ 完成文\nBeyond the dwindling supply, the multinational oil giant is facing a growing number of risks that could jeopardize its future.\n（供給の先細りに加え、その多国籍石油大手は将来を脅かしかねないリスクの増加に直面している。）\n\n■ 解き方のポイント\n助動詞の直後は原形。助動詞は2つ重ねられない（could will ×）。","words":[{"w":"dwindling","p":"形容詞","m":"先細りの"},{"w":"supply","p":"名詞","m":"供給"},{"w":"multinational","p":"形容詞","m":"多国籍の"},{"w":"jeopardize","p":"動詞","m":"危うくする"},{"w":"risks","p":"名詞","m":"リスク"}]},{"id":351,"category":"動詞問題・実戦問題 基本編","question":"To help us assist your business further, please ______ a customer satisfaction survey.","A":"complete","B":"completed","C":"completion","D":"completely","answer":"A","answer_word":"complete","explanation":"■ 文の骨格\nTo help us assist your business further, please ______ a customer satisfaction survey.\n\n■ 空所に入るもの\nplease に続く命令文なので、動詞は原形でなければならない。\n→ 空所には「命令文の動詞（原形）」が必要です。\n\n■ 選択肢の確認\n(A) complete … 動詞（原形）「記入する、完成させる」 ○\n(B) completed … 動詞の過去形・過去分詞「記入された」 ×\n(C) completion … 名詞「完成」 ×\n(D) completely … 副詞「完全に」 ×\n\n■ 完成文\nTo help us assist your business further, please complete a customer satisfaction survey.\n（御社の事業をよりよくお手伝いするため、顧客満足度調査へのご記入をお願いいたします。）\n\n■ 解き方のポイント\nPlease＋動詞の原形。complete は「記入する」の意味でも頻出。","words":[{"w":"assist","p":"動詞","m":"手伝う"},{"w":"further","p":"副詞","m":"さらに"},{"w":"complete","p":"動詞","m":"記入する"},{"w":"customer satisfaction survey","p":"名詞","m":"顧客満足度調査"}]},{"id":352,"category":"動詞問題・実戦問題 基本編","question":"Premium Luxury Products experienced another year of strong growth, ______ its leadership in the cosmetics industry.","A":"confirms","B":"confirmed","C":"confirming","D":"confirmation","answer":"C","answer_word":"confirming","explanation":"■ 文の骨格\nPremium Luxury Products experienced another year of strong growth, ______ its leadership in the cosmetics industry.\n\n■ 空所に入るもの\n主節の主語が「確固たるものにする」側なので、能動の分詞構文になる。\n→ 空所には「分詞構文をつくる現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) confirms … 動詞（三人称単数現在形）「確固たるものにする」 ×\n(B) confirmed … 動詞の過去形・過去分詞「確認された」 ×\n(C) confirming … 現在分詞「確固たるものにして」 ○\n(D) confirmation … 名詞「確認」 ×\n\n■ 完成文\nPremium Luxury Products experienced another year of strong growth, confirming its leadership in the cosmetics industry.\n（Premium Luxury Products 社は再び大きな成長の1年を経験し、化粧品業界での首位の地位を確固たるものにした。）\n\n■ 解き方のポイント\nコンマの後ろで前文の内容を受けて説明を続けるのは分詞構文（-ing）。","words":[{"w":"experienced","p":"動詞（過去形）","m":"経験した"},{"w":"growth","p":"名詞","m":"成長"},{"w":"confirming","p":"現在分詞","m":"確固たるものにして"},{"w":"leadership","p":"名詞","m":"首位、主導的地位"},{"w":"cosmetics industry","p":"名詞","m":"化粧品業界"}]},{"id":353,"category":"動詞問題・実戦問題 基本編","question":"Because personal computers ______ outdated so rapidly, many large companies are choosing to lease.","A":"become","B":"becomes","C":"is becoming","D":"becoming","answer":"A","answer_word":"become","explanation":"■ 文の骨格\nBecause personal computers ______ outdated so rapidly, many large companies are choosing to lease.\n\n■ 空所に入るもの\nBecause 節の主語 personal computers は複数なので、動詞も複数に対応する形が必要。\n→ 空所には「複数主語に対応する述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) become … 動詞（現在形・複数対応）「〜になる」 ○\n(B) becomes … 動詞（三人称単数現在形）「〜になる」 ×\n(C) is becoming … 現在進行形（単数）「〜になりつつある」 ×\n(D) becoming … 現在分詞・動名詞「〜になること」 ×\n\n■ 完成文\nBecause personal computers become outdated so rapidly, many large companies are choosing to lease.\n（パソコンは時代遅れになるのが非常に速いため、多くの大企業はリースを選んでいる。）\n\n■ 解き方のポイント\n主語の単複と動詞の一致を確認する。","words":[{"w":"become","p":"動詞","m":"〜になる"},{"w":"outdated","p":"形容詞","m":"時代遅れの"},{"w":"rapidly","p":"副詞","m":"急速に"},{"w":"lease","p":"動詞","m":"リースする"}]},{"id":354,"category":"動詞問題・実戦問題 基本編","question":"The newly appointed president has already ______ to resign if the company does not reach profitability by the end of the year.","A":"promise","B":"promised","C":"promises","D":"promising","answer":"B","answer_word":"promised","explanation":"■ 文の骨格\nThe newly appointed president has already ______ to resign if the company does not reach profitability by the end of the year.\n\n■ 空所に入るもの\nhas already の後ろなので、現在完了形をつくる過去分詞が必要。\n→ 空所には「現在完了形をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) promise … 動詞（原形）「約束する」 ×\n(B) promised … 過去分詞「約束した」 ○\n(C) promises … 動詞（三人称単数現在形）「約束する」 ×\n(D) promising … 現在分詞・動名詞「約束すること」 ×\n\n■ 完成文\nThe newly appointed president has already promised to resign if the company does not reach profitability by the end of the year.\n（新しく就任した社長は、年末までに会社が黒字化しなければ辞任するとすでに約束している。）\n\n■ 解き方のポイント\n〈have/has＋過去分詞〉が現在完了形。already は完了形と相性がよい。","words":[{"w":"newly appointed","p":"形容詞句","m":"新しく就任した"},{"w":"promised","p":"過去分詞","m":"約束した"},{"w":"resign","p":"動詞","m":"辞任する"},{"w":"profitability","p":"名詞","m":"収益性、黒字"}]},{"id":355,"category":"動詞問題・実戦問題 基本編","question":"Because the warranty ______ already, the dealer will not be able to cover the repair cost.","A":"is expiring","B":"has expired","C":"will expire","D":"expires","answer":"B","answer_word":"has expired","explanation":"■ 文の骨格\nBecause the warranty ______ already, the dealer will not be able to cover the repair cost.\n\n■ 空所に入るもの\nalready があり、「すでに切れてしまっている」という完了の意味を表す形が必要。\n→ 空所には「現在完了形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) is expiring … 現在進行形「期限が切れつつある」 ×\n(B) has expired … 現在完了形「期限が切れてしまった」 ○\n(C) will expire … 未来形「期限が切れるだろう」 ×\n(D) expires … 現在形「期限が切れる」 ×\n\n■ 完成文\nBecause the warranty has expired already, the dealer will not be able to cover the repair cost.\n（保証期間がすでに切れているため、販売店は修理費用を負担できない。）\n\n■ 解き方のポイント\nalready／just／yet は現在完了形と結びつく副詞。","words":[{"w":"warranty","p":"名詞","m":"保証"},{"w":"has expired","p":"動詞（現在完了）","m":"期限が切れた"},{"w":"dealer","p":"名詞","m":"販売店"},{"w":"cover","p":"動詞","m":"負担する"},{"w":"repair cost","p":"名詞","m":"修理費用"}]},{"id":356,"category":"動詞問題・実戦問題 基本編","question":"Ms. Adams ______ office supplies on the third Friday of each month, so you should contact her if you need any.","A":"order","B":"ordered","C":"orders","D":"to order","answer":"C","answer_word":"orders","explanation":"■ 文の骨格\nMs. Adams ______ office supplies on the third Friday of each month, so you should contact her if you need any.\n\n■ 空所に入るもの\n主語 Ms. Adams は三人称単数で、習慣を表す現在形なので動詞に -s が必要。\n→ 空所には「三人称単数現在形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) order … 動詞（原形）「注文する」 ×\n(B) ordered … 動詞（過去形）「注文した」 ×\n(C) orders … 動詞（三人称単数現在形）「注文する」 ○\n(D) to order … 不定詞「注文すること」 ×\n\n■ 完成文\nMs. Adams orders office supplies on the third Friday of each month, so you should contact her if you need any.\n（Adams さんは毎月第3金曜日に事務用品を注文するので、必要なものがあれば彼女に連絡してください。）\n\n■ 解き方のポイント\n毎月の習慣なので現在形。主語が三人称単数なので -s が付く。","words":[{"w":"orders","p":"動詞","m":"注文する"},{"w":"office supplies","p":"名詞","m":"事務用品"},{"w":"contact","p":"動詞","m":"連絡する"}]},{"id":357,"category":"動詞問題・実戦問題 基本編","question":"Yesterday morning, the district supervisor ______ by a local store for her monthly visit.","A":"drop","B":"will drop","C":"dropped","D":"was dropped","answer":"C","answer_word":"dropped","explanation":"■ 文の骨格\nYesterday morning, the district supervisor ______ by a local store for her monthly visit.\n\n■ 空所に入るもの\nYesterday morning という過去を表す語句があるので、動詞は過去形。\n→ 空所には「過去形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) drop … 動詞（原形）「立ち寄る」 ×\n(B) will drop … 未来形「立ち寄るだろう」 ×\n(C) dropped … 動詞（過去形）「立ち寄った」 ○\n(D) was dropped … 受動態（過去形）「落とされた」 ×\n\n■ 完成文\nYesterday morning, the district supervisor dropped by a local store for her monthly visit.\n（昨日の朝、その地区の責任者が月例訪問で地元の店に立ち寄った。）\n\n■ 解き方のポイント\nyesterday／last week などの過去表現があれば過去形。drop by＝「立ち寄る」。","words":[{"w":"district supervisor","p":"名詞","m":"地区責任者"},{"w":"dropped by","p":"熟語","m":"立ち寄った"},{"w":"local store","p":"名詞","m":"地元の店"},{"w":"monthly visit","p":"名詞","m":"月例訪問"}]},{"id":358,"category":"動詞問題・実戦問題 基本編","question":"Attracted by lower rent and convenient access to public transportation, Magic Media Company ______ to Tarrytown next spring.","A":"was relocated","B":"to relocate","C":"will relocate","D":"relocated","answer":"C","answer_word":"will relocate","explanation":"■ 文の骨格\nAttracted by lower rent and convenient access to public transportation, Magic Media Company ______ to Tarrytown next spring.\n\n■ 空所に入るもの\nnext spring（来春）という未来を表す語句があるので、未来形が必要。\n→ 空所には「未来を表す述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) was relocated … 受動態（過去形）「移転させられた」 ×\n(B) to relocate … 不定詞「移転すること」 ×\n(C) will relocate … 未来形「移転する」 ○\n(D) relocated … 動詞（過去形）「移転した」 ×\n\n■ 完成文\nAttracted by lower rent and convenient access to public transportation, Magic Media Company will relocate to Tarrytown next spring.\n（低い賃料と公共交通機関への便利なアクセスに引かれ、Magic Media 社は来春 Tarrytown へ移転する。）\n\n■ 解き方のポイント\nnext ... / tomorrow などの未来表現があれば未来形。","words":[{"w":"Attracted by","p":"過去分詞","m":"〜に引かれて"},{"w":"rent","p":"名詞","m":"賃料"},{"w":"public transportation","p":"名詞","m":"公共交通機関"},{"w":"will relocate","p":"未来形","m":"移転する"}]},{"id":359,"category":"動詞問題・実戦問題 基本編","question":"Twenty one percent of those surveyed believe house prices in Richland ______ by 10% or more in the next twelve months.","A":"be raised","B":"will rise","C":"rising","D":"rose","answer":"B","answer_word":"will rise","explanation":"■ 文の骨格\nTwenty one percent of those surveyed believe house prices in Richland ______ by 10% or more in the next twelve months.\n\n■ 空所に入るもの\nin the next twelve months（今後12か月で）が未来を示し、prices は自ら「上がる」側。\n→ 空所には「未来を表す自動詞」が必要です。\n\n■ 選択肢の確認\n(A) be raised … 受動態「上げられる」 ×\n(B) will rise … 未来形（自動詞）「上昇するだろう」 ○\n(C) rising … 現在分詞・動名詞「上昇すること」 ×\n(D) rose … 動詞（過去形）「上昇した」 ×\n\n■ 完成文\nTwenty one percent of those surveyed believe house prices in Richland will rise by 10% or more in the next twelve months.\n（調査対象者の21％は、Richland の住宅価格が今後12か月で10％以上上昇すると考えている。）\n\n■ 解き方のポイント\nrise（自動詞・上がる）と raise（他動詞・上げる）の区別は頻出。価格は自ら上がる。","words":[{"w":"surveyed","p":"過去分詞","m":"調査を受けた"},{"w":"house prices","p":"名詞","m":"住宅価格"},{"w":"will rise","p":"未来形","m":"上昇するだろう"}]},{"id":360,"category":"動詞問題・実戦問題 基本編","question":"Designers at Star Electronics are ______ about the prospect of winning the prestigious award.","A":"excite","B":"excited","C":"exciting","D":"excitement","answer":"B","answer_word":"excited","explanation":"■ 文の骨格\nDesigners at Star Electronics are ______ about the prospect of winning the prestigious award.\n\n■ 空所に入るもの\n感情を「受ける側」が主語（人）なので、-ed 形の分詞形容詞が必要。\n→ 空所には「be動詞の補語になる過去分詞（形容詞化）」が必要です。\n\n■ 選択肢の確認\n(A) excite … 動詞（原形）「興奮させる」 ×\n(B) excited … 過去分詞・形容詞「わくわくしている」 ○\n(C) exciting … 現在分詞・形容詞「わくわくさせる」 ×\n(D) excitement … 名詞「興奮」 ×\n\n■ 完成文\nDesigners at Star Electronics are excited about the prospect of winning the prestigious award.\n（Star Electronics 社のデザイナーたちは、名誉ある賞を受賞できる見込みにわくわくしている。）\n\n■ 解き方のポイント\n感情の分詞は、人が主語なら -ed、物事が主語なら -ing。","words":[{"w":"Designers","p":"名詞","m":"デザイナー"},{"w":"excited","p":"形容詞","m":"わくわくしている"},{"w":"prospect","p":"名詞","m":"見込み"},{"w":"prestigious","p":"形容詞","m":"名誉ある"}]},{"id":361,"category":"動詞問題・実戦問題 基本編","question":"Transcripts of all the presentations that were ______ during the conference can be found on the official Web site.","A":"give","B":"gave","C":"given","D":"giving","answer":"C","answer_word":"given","explanation":"■ 文の骨格\nTranscripts of all the presentations that were ______ during the conference can be found on the official Web site.\n\n■ 空所に入るもの\n主格の関係代名詞 that の先行詞は the presentations。プレゼンは「行われる」側なので were＋過去分詞。\n→ 空所には「受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) give … 動詞（原形）「与える、行う」 ×\n(B) gave … 動詞（過去形）「行った」 ×\n(C) given … 過去分詞「行われた」 ○\n(D) giving … 現在分詞・動名詞「行うこと」 ×\n\n■ 完成文\nTranscripts of all the presentations that were given during the conference can be found on the official Web site.\n（会議中に行われたすべてのプレゼンの書き起こしは、公式ウェブサイトで見ることができる。）\n\n■ 解き方のポイント\n〈be動詞＋空所〉で主語が「される側」なら過去分詞。","words":[{"w":"Transcripts","p":"名詞","m":"書き起こし"},{"w":"presentations","p":"名詞","m":"プレゼン、発表"},{"w":"given","p":"過去分詞","m":"行われた"},{"w":"conference","p":"名詞","m":"会議"}]},{"id":362,"category":"動詞問題・実戦問題 基本編","question":"The information that you requested will be ______ to your e-mail address within 24 hours.","A":"send","B":"sending","C":"sent","D":"sends","answer":"C","answer_word":"sent","explanation":"■ 文の骨格\nThe information that you requested will be ______ to your e-mail address within 24 hours.\n\n■ 空所に入るもの\nwill be の後ろで、主語 The information は「送られる」側なので過去分詞が必要。\n→ 空所には「受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) send … 動詞（原形）「送る」 ×\n(B) sending … 現在分詞・動名詞「送ること」 ×\n(C) sent … 過去分詞「送られた」 ○\n(D) sends … 動詞（三人称単数現在形）「送る」 ×\n\n■ 完成文\nThe information that you requested will be sent to your e-mail address within 24 hours.\n（ご依頼の情報は、24時間以内にあなたのメールアドレスへお送りします。）\n\n■ 解き方のポイント\nsend-sent-sent の活用。〈be＋過去分詞〉で受動態。","words":[{"w":"information","p":"名詞","m":"情報"},{"w":"requested","p":"動詞（過去形）","m":"依頼した"},{"w":"sent","p":"過去分詞","m":"送られた"},{"w":"within","p":"前置詞","m":"〜以内に"}]},{"id":363,"category":"動詞問題・実戦問題 基本編","question":"The addition of a new dish to the menu, featuring local food, ______ in favorable feedback from customers.","A":"resulted","B":"resulting","C":"was resulted","D":"have resulted","answer":"A","answer_word":"resulted","explanation":"■ 文の骨格\nThe addition of a new dish to the menu, featuring local food, ______ in favorable feedback from customers.\n\n■ 空所に入るもの\n主語 The addition に対する述語動詞が欠けている。result in は自動詞なので能動態。\n→ 空所には「過去形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) resulted … 動詞（過去形）「結果として〜になった」 ○\n(B) resulting … 現在分詞・動名詞「結果として生じること」 ×\n(C) was resulted … 受動態（誤用）「※ result in は自動詞のため受動態にできない」 ×\n(D) have resulted … 現在完了形（複数対応）「結果として生じてきた」 ×\n\n■ 完成文\nThe addition of a new dish to the menu, featuring local food, resulted in favorable feedback from customers.\n（地元食材を使った新しい料理をメニューに加えたことが、顧客からの好意的な反応につながった。）\n\n■ 解き方のポイント\nresult in は自動詞なので受動態にできない。主語 addition は単数。","words":[{"w":"addition","p":"名詞","m":"追加"},{"w":"dish","p":"名詞","m":"料理"},{"w":"featuring","p":"現在分詞","m":"〜を目玉にした"},{"w":"resulted in","p":"熟語","m":"〜という結果になった"},{"w":"favorable","p":"形容詞","m":"好意的な"}]},{"id":364,"category":"動詞問題・実戦問題 基本編","question":"A wonderful antique chair was ______ to the museum by an anonymous donor.","A":"contribute","B":"contributed","C":"contributing","D":"contributions","answer":"B","answer_word":"contributed","explanation":"■ 文の骨格\nA wonderful antique chair was ______ to the museum by an anonymous donor.\n\n■ 空所に入るもの\nwas の後ろで、主語 chair は「寄贈される」側なので過去分詞が必要。\n→ 空所には「受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) contribute … 動詞（原形）「寄贈する」 ×\n(B) contributed … 過去分詞「寄贈された」 ○\n(C) contributing … 現在分詞・動名詞「寄贈すること」 ×\n(D) contributions … 名詞（複数形）「寄付」 ×\n\n■ 完成文\nA wonderful antique chair was contributed to the museum by an anonymous donor.\n（すばらしい年代物の椅子が、匿名の寄贈者から博物館へ寄贈された。）\n\n■ 解き方のポイント\nby ... があるのは受動態の目印。","words":[{"w":"antique","p":"形容詞","m":"年代物の"},{"w":"contributed","p":"過去分詞","m":"寄贈された"},{"w":"anonymous","p":"形容詞","m":"匿名の"},{"w":"donor","p":"名詞","m":"寄贈者"}]},{"id":365,"category":"動詞問題・実戦問題 基本編","question":"Audio One has been ______ this year despite the fact that personal music players are selling at record numbers.","A":"struggle","B":"struggles","C":"struggled","D":"struggling","answer":"D","answer_word":"struggling","explanation":"■ 文の骨格\nAudio One has been ______ this year despite the fact that personal music players are selling at record numbers.\n\n■ 空所に入るもの\nhas been の後ろで、「〜し続けている」という進行の意味を表す -ing 形が必要。\n→ 空所には「現在完了進行形をつくる現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) struggle … 動詞（原形）／名詞「もがく／苦闘」 ×\n(B) struggles … 動詞（三人称単数現在形）「もがく」 ×\n(C) struggled … 動詞の過去形・過去分詞「もがいた」 ×\n(D) struggling … 現在分詞「苦戦している」 ○\n\n■ 完成文\nAudio One has been struggling this year despite the fact that personal music players are selling at record numbers.\n（携帯音楽プレーヤーが記録的に売れているにもかかわらず、Audio One 社は今年苦戦が続いている。）\n\n■ 解き方のポイント\nhas been ＋ -ing で現在完了進行形。struggle は自動詞なので受動態にならない。","words":[{"w":"struggling","p":"現在分詞","m":"苦戦している"},{"w":"despite","p":"前置詞","m":"〜にもかかわらず"},{"w":"record numbers","p":"名詞","m":"記録的な数"}]},{"id":366,"category":"動詞問題・実戦問題 基本編","question":"Nippon Noodle sells most of its products online, but some of them can also ______ at Asian grocery stores.","A":"buy","B":"buying","C":"to buy","D":"be bought","answer":"D","answer_word":"be bought","explanation":"■ 文の骨格\nNippon Noodle sells most of its products online, but some of them can also ______ at Asian grocery stores.\n\n■ 空所に入るもの\n主語 some of them（製品）は「買われる」側なので、can＋be＋過去分詞が必要。\n→ 空所には「助動詞に続く受動態の原形」が必要です。\n\n■ 選択肢の確認\n(A) buy … 動詞（原形・能動）「買う」 ×\n(B) buying … 現在分詞・動名詞「買うこと」 ×\n(C) to buy … 不定詞「買うこと」 ×\n(D) be bought … 受動態（原形）「買われる」 ○\n\n■ 完成文\nNippon Noodle sells most of its products online, but some of them can also be bought at Asian grocery stores.\n（Nippon Noodle 社は製品の大半をオンラインで販売しているが、一部はアジア食材店でも購入できる。）\n\n■ 解き方のポイント\n助動詞の後ろの受動態は〈助動詞＋be＋過去分詞〉。","words":[{"w":"products","p":"名詞","m":"製品"},{"w":"be bought","p":"受動態（原形）","m":"買われる"},{"w":"grocery stores","p":"名詞","m":"食料品店"}]},{"id":367,"category":"動詞問題・実戦問題 基本編","question":"Mr. Murphy sent a letter of complaint to the manufacturer, as two of the garden lamps he received were ______ and did not operate properly.","A":"broken","B":"breaker","C":"breaks","D":"breaking","answer":"A","answer_word":"broken","explanation":"■ 文の骨格\nMr. Murphy sent a letter of complaint to the manufacturer, as two of the garden lamps he received were ______ and did not operate properly.\n\n■ 空所に入るもの\nwere の補語が欠けており、主語 two of the lamps の状態を表す語が必要。\n→ 空所には「be動詞の補語になる過去分詞（形容詞化）」が必要です。\n\n■ 選択肢の確認\n(A) broken … 過去分詞・形容詞「壊れている」 ○\n(B) breaker … 名詞（人・もの）「ブレーカー」 ×\n(C) breaks … 動詞（三人称単数現在形）／名詞（複数形）「壊す／休憩」 ×\n(D) breaking … 現在分詞・動名詞「壊すこと」 ×\n\n■ 完成文\nMr. Murphy sent a letter of complaint to the manufacturer, as two of the garden lamps he received were broken and did not operate properly.\n（Murphy さんは、受け取ったガーデンライトのうち2つが壊れていて正常に動かなかったため、メーカーに苦情の手紙を送った。）\n\n■ 解き方のポイント\nbreak-broke-broken。be broken＝「壊れている」。","words":[{"w":"letter of complaint","p":"名詞","m":"苦情の手紙"},{"w":"manufacturer","p":"名詞","m":"メーカー"},{"w":"broken","p":"形容詞","m":"壊れている"},{"w":"operate","p":"動詞","m":"作動する"},{"w":"properly","p":"副詞","m":"正常に"}]},{"id":368,"category":"動詞問題・実戦問題 基本編","question":"According to a national survey, purchases of cars fell 0.2 percent, while money ______ on utilities was unchanged.","A":"spend","B":"spends","C":"spent","D":"will spend","answer":"C","answer_word":"spent","explanation":"■ 文の骨格\nAccording to a national survey, purchases of cars fell 0.2 percent, while money ______ on utilities was unchanged.\n\n■ 空所に入るもの\n主語 money を後ろから修飾する位置。money は「使われる」側なので過去分詞。\n→ 空所には「名詞を後ろから修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) spend … 動詞（原形）「使う」 ×\n(B) spends … 動詞（三人称単数現在形）「使う」 ×\n(C) spent … 過去分詞「使われた」 ○\n(D) will spend … 未来形「使うだろう」 ×\n\n■ 完成文\nAccording to a national survey, purchases of cars fell 0.2 percent, while money spent on utilities was unchanged.\n（全国調査によると、公共料金への支出額が変わらない一方で、自動車の購入は0.2％減少した。）\n\n■ 解き方のポイント\n述語動詞 was がすでにあるので、空所は主語を修飾する分詞。","words":[{"w":"purchases","p":"名詞","m":"購入"},{"w":"fell","p":"動詞（過去形）","m":"下がった"},{"w":"spent","p":"過去分詞","m":"使われた"},{"w":"utilities","p":"名詞","m":"公共料金"},{"w":"unchanged","p":"形容詞","m":"変わらない"}]},{"id":369,"category":"動詞問題・実戦問題 基本編","question":"First State Bank has streamlined its procedures for business clients, ______ on simplifying the process for obtaining short-term loans.","A":"focus","B":"focusing","C":"focused","D":"focuses","answer":"B","answer_word":"focusing","explanation":"■ 文の骨格\nFirst State Bank has streamlined its procedures for business clients, ______ on simplifying the proces
