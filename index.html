動詞「驚き／驚かせる」 ×\n(B) surprised … 形容詞「驚いた（人が主語）」 ×\n(C) surprisingly … 副詞「驚くほど」 ○\n(D) surprises … 動詞（三人称単数現在形）／名詞（複数形）「驚かせる／驚き」 ×\n\n■ 完成文\nDr. Matthews has received a surprisingly large number of calls in response to her lectures at medical schools nationwide.\n（Matthews 博士は、全国の医科大学での講義への反響として、驚くほど多くの電話を受けた。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋形容詞＋名詞〉は副詞が入る位置。","words":[{"w":"received","p":"動詞（過去分詞）","m":"受けた"},{"w":"surprisingly","p":"副詞","m":"驚くほど"},{"w":"in response to","p":"熟語","m":"〜への反響として"},{"w":"lectures","p":"名詞","m":"講義"},{"w":"nationwide","p":"副詞","m":"全国で"}]},{"id":64,"category":"品詞問題・実戦問題 基本編","question":"BioTech’s corporate structure and financial information are ______ accessible to customers on the Web site at www.biotech.com.","A":"ready","B":"readying","C":"readily","D":"readiness","answer":"C","answer_word":"readily","explanation":"■ 文の骨格\nBioTech’s corporate structure and financial information are ______ accessible to customers on the Web site at www.biotech.com.\n\n■ 空所に入るもの\nare の補語として形容詞 accessible がすでにあり、空所は修飾語の位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) ready … 形容詞「用意ができた」 ×\n(B) readying … 現在分詞・動名詞「準備している」 ×\n(C) readily … 副詞「容易に、すぐに」 ○\n(D) readiness … 名詞「準備ができていること」 ×\n\n■ 完成文\nBioTech’s corporate structure and financial information are readily accessible to customers on the Web site at www.biotech.com.\n（BioTech 社の会社組織と財務情報は、ウェブサイト www.biotech.com で顧客が容易に閲覧できる。）\n\n■ 解き方のポイント\n〈be動詞＋空所＋形容詞〉は副詞。ready（形容詞）と readily（副詞）の形の違いに注意。","words":[{"w":"corporate structure","p":"名詞","m":"会社組織"},{"w":"financial information","p":"名詞","m":"財務情報"},{"w":"readily","p":"副詞","m":"容易に"},{"w":"accessible","p":"形容詞","m":"利用できる"}]},{"id":65,"category":"品詞問題・実戦問題 基本編","question":"There has been speculation that Techsoft’s board is trying to find a ______ for its chief executive by the end of the year.","A":"replace","B":"replaced","C":"replacing","D":"replacement","answer":"D","answer_word":"replacement","explanation":"■ 文の骨格\nThere has been speculation that Techsoft’s board is trying to find a ______ for its chief executive by the end of the year.\n\n■ 空所に入るもの\n冠詞 a の後ろで、他動詞 find の目的語となる名詞が必要。\n→ 空所には「find の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) replace … 動詞（原形）「取り替える」 ×\n(B) replaced … 動詞の過去形・過去分詞「取り替えられた」 ×\n(C) replacing … 現在分詞・動名詞「取り替えること」 ×\n(D) replacement … 名詞「後任、交代要員」 ○\n\n■ 完成文\nThere has been speculation that Techsoft’s board is trying to find a replacement for its chief executive by the end of the year.\n（Techsoft 社の取締役会が年末までに社長の後任を探しているという憶測が出ている。）\n\n■ 解き方のポイント\n-ment で終わる語は名詞。冠詞の直後は名詞。","words":[{"w":"speculation","p":"名詞","m":"憶測"},{"w":"board","p":"名詞","m":"取締役会"},{"w":"replacement","p":"名詞","m":"後任"},{"w":"chief executive","p":"名詞","m":"社長、最高責任者"}]},{"id":66,"category":"品詞問題・実戦問題 基本編","question":"Our design consultants generate concepts combining visual impact, clear messages, and a high level of ______.","A":"create","B":"creative","C":"creatively","D":"creativity","answer":"D","answer_word":"creativity","explanation":"■ 文の骨格\nOur design consultants generate concepts combining visual impact, clear messages, and a high level of ______.\n\n■ 空所に入るもの\na high level of の後ろで、名詞が必要。\n→ 空所には「前置詞 of の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) create … 動詞（原形）「創造する」 ×\n(B) creative … 形容詞「創造的な」 ×\n(C) creatively … 副詞「創造的に」 ×\n(D) creativity … 名詞「創造性」 ○\n\n■ 完成文\nOur design consultants generate concepts combining visual impact, clear messages, and a high level of creativity.\n（当社のデザインコンサルタントは、視覚的インパクト、明快なメッセージ、そして高い創造性を組み合わせたコンセプトを生み出す。）\n\n■ 解き方のポイント\n前置詞の直後は名詞。-ity は名詞の目印。","words":[{"w":"consultants","p":"名詞","m":"コンサルタント"},{"w":"generate","p":"動詞","m":"生み出す"},{"w":"combining","p":"現在分詞","m":"組み合わせている"},{"w":"visual impact","p":"名詞","m":"視覚的な印象"},{"w":"creativity","p":"名詞","m":"創造性"}]},{"id":67,"category":"品詞問題・実戦問題 基本編","question":"Bookmart.com promises to make ______ to the Web site, and there could be an updated version as early as November.","A":"improve","B":"improvements","C":"improves","D":"improving","answer":"B","answer_word":"improvements","explanation":"■ 文の骨格\nBookmart.com promises to make ______ to the Web site, and there could be an updated version as early as November.\n\n■ 空所に入るもの\n他動詞 make の目的語が欠けている。冠詞がないので複数形の名詞が入る。\n→ 空所には「make の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) improve … 動詞（原形）「改善する」 ×\n(B) improvements … 名詞（複数形）「改善（点）」 ○\n(C) improves … 動詞（三人称単数現在形）「改善する」 ×\n(D) improving … 現在分詞・動名詞「改善すること」 ×\n\n■ 完成文\nBookmart.com promises to make improvements to the Web site, and there could be an updated version as early as November.\n（Bookmart.com はウェブサイトの改善を約束しており、早ければ11月に更新版が出る可能性がある。）\n\n■ 解き方のポイント\nmake improvements to X＝「Xを改善する」。冠詞がなければ複数形。","words":[{"w":"promises","p":"動詞","m":"約束する"},{"w":"improvements","p":"名詞","m":"改善"},{"w":"updated version","p":"名詞","m":"更新版"},{"w":"as early as","p":"熟語","m":"早ければ〜に"}]},{"id":68,"category":"品詞問題・実戦問題 基本編","question":"The company will provide an ______ day of paid vacation when an annual leave day falls on a public holiday.","A":"add","B":"additional","C":"additionally","D":"additive","answer":"B","answer_word":"additional","explanation":"■ 文の骨格\nThe company will provide an ______ day of paid vacation when an annual leave day falls on a public holiday.\n\n■ 空所に入るもの\n冠詞 an と名詞 day の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) add … 動詞（原形）「加える」 ×\n(B) additional … 形容詞「追加の」 ○\n(C) additionally … 副詞「加えて」 ×\n(D) additive … 形容詞／名詞「添加の／添加物」 ×\n\n■ 完成文\nThe company will provide an additional day of paid vacation when an annual leave day falls on a public holiday.\n（年次休暇が祝日と重なった場合、会社は有給休暇を1日追加で付与する。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。an になっているのは additional の a の音のため。","words":[{"w":"provide","p":"動詞","m":"提供する"},{"w":"additional","p":"形容詞","m":"追加の"},{"w":"paid vacation","p":"名詞","m":"有給休暇"},{"w":"annual leave","p":"名詞","m":"年次休暇"},{"w":"public holiday","p":"名詞","m":"祝日"}]},{"id":69,"category":"品詞問題・実戦問題 基本編","question":"Travelpal Luggage is the perfect choice for travelers whether they are traveling on business or for ______.","A":"pleased","B":"pleasant","C":"pleasure","D":"please","answer":"C","answer_word":"pleasure","explanation":"■ 文の骨格\nTravelpal Luggage is the perfect choice for travelers whether they are traveling on business or for ______.\n\n■ 空所に入るもの\non business と for ______ が並列で、前置詞の目的語となる名詞が必要。\n→ 空所には「前置詞 for の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) pleased … 動詞の過去形・過去分詞「喜んだ」 ×\n(B) pleasant … 形容詞「楽しい、感じのよい」 ×\n(C) pleasure … 名詞「楽しみ、娯楽」 ○\n(D) please … 動詞（原形）「喜ばせる」 ×\n\n■ 完成文\nTravelpal Luggage is the perfect choice for travelers whether they are traveling on business or for pleasure.\n（Travelpal Luggage は、出張でも観光でも、旅行者にとって最適の選択です。）\n\n■ 解き方のポイント\nfor pleasure＝「遊び・観光で」。on business との対比で覚える。","words":[{"w":"Luggage","p":"名詞","m":"かばん、手荷物"},{"w":"perfect choice","p":"名詞","m":"最適の選択"},{"w":"on business","p":"熟語","m":"仕事で"},{"w":"pleasure","p":"名詞","m":"楽しみ、娯楽"}]},{"id":70,"category":"品詞問題・実戦問題 基本編","question":"All visitors to the hotel during the construction phase must wear ______ goggles and helmets at all times.","A":"protect","B":"protects","C":"protective","D":"protectively","answer":"C","answer_word":"protective","explanation":"■ 文の骨格\nAll visitors to the hotel during the construction phase must wear ______ goggles and helmets at all times.\n\n■ 空所に入るもの\n他動詞 wear の目的語 goggles and helmets を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) protect … 動詞（原形）「保護する」 ×\n(B) protects … 動詞（三人称単数現在形）「保護する」 ×\n(C) protective … 形容詞「保護用の」 ○\n(D) protectively … 副詞「保護して」 ×\n\n■ 完成文\nAll visitors to the hotel during the construction phase must wear protective goggles and helmets at all times.\n（工事期間中にホテルを訪れる人は全員、常に保護ゴーグルとヘルメットを着用しなければならない。）\n\n■ 解き方のポイント\n名詞の前の空所は形容詞。-ive は形容詞の目印。","words":[{"w":"visitors","p":"名詞","m":"訪問者"},{"w":"construction phase","p":"名詞","m":"工事期間"},{"w":"protective","p":"形容詞","m":"保護用の"},{"w":"goggles","p":"名詞","m":"ゴーグル"},{"w":"at all times","p":"熟語","m":"常に"}]},{"id":71,"category":"品詞問題・実戦問題 基本編","question":"The client’s files must be arranged ______ rather than by date to allow for easier searching.","A":"alphabet","B":"alphabets","C":"alphabetical","D":"alphabetically","answer":"D","answer_word":"alphabetically","explanation":"■ 文の骨格\nThe client’s files must be arranged ______ rather than by date to allow for easier searching.\n\n■ 空所に入るもの\n述語動詞 must be arranged がそろっており、by date（前置詞句＝副詞相当）と並ぶ修飾語が必要。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) alphabet … 名詞「アルファベット」 ×\n(B) alphabets … 名詞（複数形）「アルファベット」 ×\n(C) alphabetical … 形容詞「アルファベット順の」 ×\n(D) alphabetically … 副詞「アルファベット順に」 ○\n\n■ 完成文\nThe client’s files must be arranged alphabetically rather than by date to allow for easier searching.\n（顧客ファイルは検索しやすくするため、日付順ではなくアルファベット順に並べなければならない。）\n\n■ 解き方のポイント\nrather than の後ろが副詞相当（by date）なら、前も副詞。","words":[{"w":"arranged","p":"動詞（過去分詞）","m":"並べられる"},{"w":"alphabetically","p":"副詞","m":"アルファベット順に"},{"w":"rather than","p":"熟語","m":"〜ではなく"},{"w":"allow for","p":"熟語","m":"〜を可能にする"}]},{"id":72,"category":"品詞問題・実戦問題 基本編","question":"Kaseguma Design has brightly colored meeting spaces, which are intended to help employees think ______.","A":"create","B":"creative","C":"creatively","D":"creation","answer":"C","answer_word":"creatively","explanation":"■ 文の骨格\nKaseguma Design has brightly colored meeting spaces, which are intended to help employees think ______.\n\n■ 空所に入るもの\nthink はここでは自動詞で目的語を必要としないため、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) create … 動詞（原形）「創造する」 ×\n(B) creative … 形容詞「創造的な」 ×\n(C) creatively … 副詞「創造的に」 ○\n(D) creation … 名詞「創造」 ×\n\n■ 完成文\nKaseguma Design has brightly colored meeting spaces, which are intended to help employees think creatively.\n（Kaseguma Design 社には明るい色の会議スペースがあり、社員が創造的に考える助けとなることを狙っている。）\n\n■ 解き方のポイント\n自動詞の後ろの空所は副詞。think は自動詞・他動詞の両方で使う。","words":[{"w":"brightly","p":"副詞","m":"明るく"},{"w":"colored","p":"形容詞","m":"色づけされた"},{"w":"intended","p":"動詞（過去分詞）","m":"意図されている"},{"w":"creatively","p":"副詞","m":"創造的に"}]},{"id":73,"category":"品詞問題・実戦問題 基本編","question":"TAA Airlines has a ______ dress code which all staff adhere to diligently.","A":"strict","B":"strictly","C":"strictness","D":"strictest","answer":"A","answer_word":"strict","explanation":"■ 文の骨格\nTAA Airlines has a ______ dress code which all staff adhere to diligently.\n\n■ 空所に入るもの\n冠詞 a と名詞 dress code の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) strict … 形容詞「厳しい」 ○\n(B) strictly … 副詞「厳しく」 ×\n(C) strictness … 名詞「厳しさ」 ×\n(D) strictest … 形容詞（最上級）「最も厳しい」 ×\n\n■ 完成文\nTAA Airlines has a strict dress code which all staff adhere to diligently.\n（TAA 航空には、全社員が入念に順守する厳しい服装規定がある。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。最上級は the を伴うのが原則なので a とは合わない。","words":[{"w":"strict","p":"形容詞","m":"厳しい"},{"w":"dress code","p":"名詞","m":"服装規定"},{"w":"adhere to","p":"熟語","m":"〜を順守する"},{"w":"diligently","p":"副詞","m":"入念に"}]},{"id":74,"category":"品詞問題・実戦問題 基本編","question":"The spokesperson for Carter Robotics says its new room cleaning robot will ______ be revolutionary.","A":"assured","B":"assuredness","C":"more assured","D":"assuredly","answer":"D","answer_word":"assuredly","explanation":"■ 文の骨格\nThe spokesperson for Carter Robotics says its new room cleaning robot will ______ be revolutionary.\n\n■ 空所に入るもの\n助動詞 will と動詞 be の間で、文の要素はすでにそろっている。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) assured … 動詞の過去形・過去分詞「保証された」 ×\n(B) assuredness … 名詞「確実さ」 ×\n(C) more assured … 形容詞（比較級）「より確信した」 ×\n(D) assuredly … 副詞「間違いなく」 ○\n\n■ 完成文\nThe spokesperson for Carter Robotics says its new room cleaning robot will assuredly be revolutionary.\n（Carter Robotics 社の広報担当は、同社の新しい掃除ロボットは間違いなく画期的なものになると述べている。）\n\n■ 解き方のポイント\n〈助動詞＋空所＋動詞〉は副詞の定位置。","words":[{"w":"spokesperson","p":"名詞","m":"広報担当"},{"w":"assuredly","p":"副詞","m":"間違いなく"},{"w":"revolutionary","p":"形容詞","m":"画期的な"}]},{"id":75,"category":"品詞問題・実戦問題 基本編","question":"The office manager is ______ for regularly checking the inventory of office supplies and placing orders if needed.","A":"responsibilities","B":"responsibility","C":"responsible","D":"responsibly","answer":"C","answer_word":"responsible","explanation":"■ 文の骨格\nThe office manager is ______ for regularly checking the inventory of office supplies and placing orders if needed.\n\n■ 空所に入るもの\nis の補語が欠けており、for と結びついて意味が通る語が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) responsibilities … 名詞（複数形）「責務」 ×\n(B) responsibility … 名詞（単数形）「責任」 ×\n(C) responsible … 形容詞「責任がある」 ○\n(D) responsibly … 副詞「責任をもって」 ×\n\n■ 完成文\nThe office manager is responsible for regularly checking the inventory of office supplies and placing orders if needed.\n（総務課長は、事務用品の在庫を定期的に確認し、必要なら発注する責任がある。）\n\n■ 解き方のポイント\nbe responsible for X＝「Xの責任がある」。後ろの for が決め手。","words":[{"w":"office manager","p":"名詞","m":"総務課長"},{"w":"responsible","p":"形容詞","m":"責任がある"},{"w":"inventory","p":"名詞","m":"在庫"},{"w":"office supplies","p":"名詞","m":"事務用品"},{"w":"placing orders","p":"熟語","m":"発注すること"}]},{"id":76,"category":"品詞問題・実戦問題 基本編","question":"Shares of Wellington Depot rose ______ after the retailer reported record sales in December.","A":"sharp","B":"sharpen","C":"sharply","D":"sharpness","answer":"C","answer_word":"sharply","explanation":"■ 文の骨格\nShares of Wellington Depot rose ______ after the retailer reported record sales in December.\n\n■ 空所に入るもの\n自動詞 rose の直後で、動詞を修飾する位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) sharp … 形容詞「鋭い、急な」 ×\n(B) sharpen … 動詞（原形）「鋭くする」 ×\n(C) sharply … 副詞「急激に」 ○\n(D) sharpness … 名詞「鋭さ」 ×\n\n■ 完成文\nShares of Wellington Depot rose sharply after the retailer reported record sales in December.\n（その小売業者が12月に過去最高の売上を発表すると、Wellington Depot 社の株価は急激に上昇した。）\n\n■ 解き方のポイント\n自動詞の直後は副詞。rise sharply（急上昇する）は頻出コロケーション。","words":[{"w":"Shares","p":"名詞","m":"株式"},{"w":"rose","p":"動詞（過去形）","m":"上昇した"},{"w":"sharply","p":"副詞","m":"急激に"},{"w":"retailer","p":"名詞","m":"小売業者"},{"w":"record sales","p":"名詞","m":"過去最高の売上"}]},{"id":77,"category":"品詞問題・実戦問題 基本編","question":"A professional ______ is one of the key elements of a successful job interview.","A":"appearance","B":"appear","C":"appeared","D":"appears","answer":"A","answer_word":"appearance","explanation":"■ 文の骨格\nA professional ______ is one of the key elements of a successful job interview.\n\n■ 空所に入るもの\n冠詞 A と形容詞 professional の後ろで、述語動詞 is の主語となる名詞が必要。\n→ 空所には「文の主語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) appearance … 名詞「外見、身だしなみ」 ○\n(B) appear … 動詞（原形）「現れる」 ×\n(C) appeared … 動詞の過去形・過去分詞「現れた」 ×\n(D) appears … 動詞（三人称単数現在形）「現れる」 ×\n\n■ 完成文\nA professional appearance is one of the key elements of a successful job interview.\n（プロらしい身だしなみは、就職面接を成功させる重要な要素の1つだ。）\n\n■ 解き方のポイント\n〈冠詞＋形容詞＋空所〉は名詞。-ance は名詞の目印。","words":[{"w":"professional","p":"形容詞","m":"プロらしい"},{"w":"appearance","p":"名詞","m":"外見、身だしなみ"},{"w":"key elements","p":"名詞","m":"重要な要素"},{"w":"job interview","p":"名詞","m":"就職面接"}]},{"id":78,"category":"品詞問題・実戦問題 基本編","question":"Located in the heart of Manhattan, Gilford’s café offers a large ______ of traditional and contemporary American, Japanese, and Chinese dishes.","A":"select","B":"selection","C":"selects","D":"selecting","answer":"B","answer_word":"selection","explanation":"■ 文の骨格\nLocated in the heart of Manhattan, Gilford’s café offers a large ______ of traditional and contemporary American, Japanese, and Chinese dishes.\n\n■ 空所に入るもの\n冠詞 a と形容詞 large の後ろ、of の前で、名詞が必要。\n→ 空所には「offers の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) select … 動詞（原形）「選ぶ」 ×\n(B) selection … 名詞「品ぞろえ、選択」 ○\n(C) selects … 動詞（三人称単数現在形）「選ぶ」 ×\n(D) selecting … 現在分詞・動名詞「選ぶこと」 ×\n\n■ 完成文\nLocated in the heart of Manhattan, Gilford’s café offers a large selection of traditional and contemporary American, Japanese, and Chinese dishes.\n（マンハッタンの中心部にある Gilford’s カフェは、アメリカ・日本・中国の伝統的な料理と現代的な料理を幅広く提供している。）\n\n■ 解き方のポイント\na large selection of X＝「豊富なXの品ぞろえ」。〈冠詞＋形容詞＋空所＋of〉は名詞。","words":[{"w":"Located","p":"過去分詞","m":"位置している"},{"w":"heart","p":"名詞","m":"中心部"},{"w":"selection","p":"名詞","m":"品ぞろえ"},{"w":"contemporary","p":"形容詞","m":"現代的な"},{"w":"dishes","p":"名詞","m":"料理"}]},{"id":79,"category":"品詞問題・実戦問題 基本編","question":"Although Michael Young has been performing as a guitarist for many years, he is ______ unknown in the Japanese music industry.","A":"relative","B":"relatively","C":"relation","D":"relate","answer":"B","answer_word":"relatively","explanation":"■ 文の骨格\nAlthough Michael Young has been performing as a guitarist for many years, he is ______ unknown in the Japanese music industry.\n\n■ 空所に入るもの\nis の補語として形容詞 unknown がすでにあり、空所は修飾語の位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) relative … 形容詞／名詞「相対的な／親戚」 ×\n(B) relatively … 副詞「比較的」 ○\n(C) relation … 名詞「関係」 ×\n(D) relate … 動詞（原形）「関連づける」 ×\n\n■ 完成文\nAlthough Michael Young has been performing as a guitarist for many years, he is relatively unknown in the Japanese music industry.\n（Michael Young は長年ギタリストとして活動しているが、日本の音楽業界では比較的知られていない。）\n\n■ 解き方のポイント\n〈be動詞＋空所＋形容詞〉は副詞。","words":[{"w":"Although","p":"接続詞","m":"〜だけれども"},{"w":"performing","p":"現在分詞","m":"演奏している"},{"w":"relatively","p":"副詞","m":"比較的"},{"w":"unknown","p":"形容詞","m":"知られていない"},{"w":"music industry","p":"名詞","m":"音楽業界"}]},{"id":80,"category":"品詞問題・実戦問題 基本編","question":"Ms. Patel’s ______ novel, Clipped Wings, has been translated into 13 languages since it was first published.","A":"late","B":"lately","C":"latest","D":"lateness","answer":"C","answer_word":"latest","explanation":"■ 文の骨格\nMs. Patel’s ______ novel, Clipped Wings, has been translated into 13 languages since it was first published.\n\n■ 空所に入るもの\n所有格 Ms. Patel’s と名詞 novel の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞（最上級）」が必要です。\n\n■ 選択肢の確認\n(A) late … 形容詞／副詞「遅い／遅く」 ×\n(B) lately … 副詞「最近」 ×\n(C) latest … 形容詞（最上級）「最新の」 ○\n(D) lateness … 名詞「遅さ」 ×\n\n■ 完成文\nMs. Patel’s latest novel, Clipped Wings, has been translated into 13 languages since it was first published.\n（Patel さんの最新小説『Clipped Wings』は、最初に出版されて以来13の言語に翻訳されている。）\n\n■ 解き方のポイント\nlatest（最新の）と last（最後の）の意味の違いも頻出。","words":[{"w":"latest","p":"形容詞","m":"最新の"},{"w":"novel","p":"名詞","m":"小説"},{"w":"translated","p":"動詞（過去分詞）","m":"翻訳された"},{"w":"published","p":"動詞（過去分詞）","m":"出版された"}]},{"id":81,"category":"品詞問題・実戦問題 基本編","question":"The residents of Jamestown and Tomasville ______ approved the construction of a highway to connect the two cities.","A":"overwhelm","B":"overwhelming","C":"overwhelmingly","D":"overwhelmed","answer":"C","answer_word":"overwhelmingly","explanation":"■ 文の骨格\nThe residents of Jamestown and Tomasville ______ approved the construction of a highway to connect the two cities.\n\n■ 空所に入るもの\n主語 The residents と述語動詞 approved の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) overwhelm … 動詞（原形）「圧倒する」 ×\n(B) overwhelming … 現在分詞・形容詞「圧倒的な」 ×\n(C) overwhelmingly … 副詞「圧倒的に」 ○\n(D) overwhelmed … 動詞の過去形・過去分詞「圧倒された」 ×\n\n■ 完成文\nThe residents of Jamestown and Tomasville overwhelmingly approved the construction of a highway to connect the two cities.\n（Jamestown と Tomasville の住民は、2つの市をつなぐ幹線道路の建設を圧倒的多数で承認した。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉は副詞の定位置。","words":[{"w":"residents","p":"名詞","m":"住民"},{"w":"overwhelmingly","p":"副詞","m":"圧倒的に"},{"w":"approved","p":"動詞（過去形）","m":"承認した"},{"w":"highway","p":"名詞","m":"幹線道路"},{"w":"connect","p":"動詞","m":"つなぐ"}]},{"id":82,"category":"品詞問題・実戦問題 基本編","question":"The most imaginative ______ in the photography competition will receive a new laptop computer from Candy Computers.","A":"submission","B":"submitted","C":"submit","D":"submitting","answer":"A","answer_word":"submission","explanation":"■ 文の骨格\nThe most imaginative ______ in the photography competition will receive a new laptop computer from Candy Computers.\n\n■ 空所に入るもの\nThe most imaginative（最も想像力豊かな）に修飾される名詞が必要。\n→ 空所には「文の主語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) submission … 名詞「応募作品、提出物」 ○\n(B) submitted … 動詞の過去形・過去分詞「提出された」 ×\n(C) submit … 動詞（原形）「提出する」 ×\n(D) submitting … 現在分詞・動名詞「提出すること」 ×\n\n■ 完成文\nThe most imaginative submission in the photography competition will receive a new laptop computer from Candy Computers.\n（写真コンテストで最も想像力豊かな応募作品には、Candy Computers 社から新しいノートパソコンが贈られる。）\n\n■ 解き方のポイント\n最上級の形容詞の後ろは名詞。-sion は名詞の目印。","words":[{"w":"imaginative","p":"形容詞","m":"想像力豊かな"},{"w":"submission","p":"名詞","m":"応募作品"},{"w":"photography competition","p":"名詞","m":"写真コンテスト"},{"w":"laptop computer","p":"名詞","m":"ノートパソコン"}]},{"id":83,"category":"品詞問題・実戦問題 基本編","question":"A great ______ of employees use public transport to get to work because of the cost of parking in the city.","A":"major","B":"majority","C":"majors","D":"majoring","answer":"B","answer_word":"majority","explanation":"■ 文の骨格\nA great ______ of employees use public transport to get to work because of the cost of parking in the city.\n\n■ 空所に入るもの\nA great と of の間にあり、述語動詞 use の主語となる名詞が必要。\n→ 空所には「文の主語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) major … 形容詞「主要な」 ×\n(B) majority … 名詞「大多数、大部分」 ○\n(C) majors … 名詞（複数形）「専攻科目」 ×\n(D) majoring … 現在分詞・動名詞「専攻すること」 ×\n\n■ 完成文\nA great majority of employees use public transport to get to work because of the cost of parking in the city.\n（市内の駐車料金のため、従業員の大多数は公共交通機関を使って通勤している。）\n\n■ 解き方のポイント\na great majority of X＝「Xの大多数」。〈冠詞＋形容詞＋空所＋of〉は名詞。","words":[{"w":"majority","p":"名詞","m":"大多数"},{"w":"public transport","p":"名詞","m":"公共交通機関"},{"w":"get to work","p":"熟語","m":"通勤する"},{"w":"parking","p":"名詞","m":"駐車"}]},{"id":84,"category":"品詞問題・実戦問題 基本編","question":"The communications manager from Golden Egg Appliances says the company is studying the ______ of retooling its factory in Ohio.","A":"feasible","B":"more feasible","C":"feasibility","D":"feasibly","answer":"C","answer_word":"feasibility","explanation":"■ 文の骨格\nThe communications manager from Golden Egg Appliances says the company is studying the ______ of retooling its factory in Ohio.\n\n■ 空所に入るもの\nthe と of に挟まれた位置で、名詞が必要。\n→ 空所には「the の後ろに置く名詞」が必要です。\n\n■ 選択肢の確認\n(A) feasible … 形容詞「実現可能な」 ×\n(B) more feasible … 形容詞（比較級）「より実現可能な」 ×\n(C) feasibility … 名詞「実現可能性」 ○\n(D) feasibly … 副詞「実行可能なほどに」 ×\n\n■ 完成文\nThe communications manager from Golden Egg Appliances says the company is studying the feasibility of retooling its factory in Ohio.\n（Golden Egg Appliances 社の広報部長は、同社がオハイオ工場の設備一新の実現可能性を検討中だと述べている。）\n\n■ 解き方のポイント\n〈the ＿＿ of〉は名詞。-ity は名詞の目印。","words":[{"w":"communications manager","p":"名詞","m":"広報部長"},{"w":"feasibility","p":"名詞","m":"実現可能性"},{"w":"retooling","p":"動名詞","m":"設備を一新すること"},{"w":"factory","p":"名詞","m":"工場"}]},{"id":85,"category":"品詞問題・実戦問題 基本編","question":"Hospital staff members are not permitted to share patients’ ______ details with outside parties without written consent.","A":"private","B":"privatize","C":"privately","D":"privatization","answer":"A","answer_word":"private","explanation":"■ 文の骨格\nHospital staff members are not permitted to share patients’ ______ details with outside parties without written consent.\n\n■ 空所に入るもの\n所有格 patients’ と名詞 details の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) private … 形容詞「個人的な、私的な」 ○\n(B) privatize … 動詞（原形）「民営化する」 ×\n(C) privately … 副詞「私的に」 ×\n(D) privatization … 名詞「民営化」 ×\n\n■ 完成文\nHospital staff members are not permitted to share patients’ private details with outside parties without written consent.\n（病院の職員は、書面による同意なしに患者の個人情報を外部に共有することを許されていない。）\n\n■ 解き方のポイント\n〈所有格＋空所＋名詞〉は形容詞。privatization（民営化）は意味が全く違う。","words":[{"w":"permitted","p":"動詞（過去分詞）","m":"許可される"},{"w":"private","p":"形容詞","m":"個人的な"},{"w":"details","p":"名詞","m":"情報、詳細"},{"w":"outside parties","p":"名詞","m":"外部の関係者"},{"w":"consent","p":"名詞","m":"同意"}]},{"id":86,"category":"品詞問題・実戦問題 基本編","question":"The large drugstore includes a pharmacy with a doctor on hand for ______ during the week.","A":"consulted","B":"consultation","C":"consultant","D":"to consult","answer":"B","answer_word":"consultation","explanation":"■ 文の骨格\nThe large drugstore includes a pharmacy with a doctor on hand for ______ during the week.\n\n■ 空所に入るもの\nfor と during に挟まれた位置で、名詞が必要。冠詞がないので不可算名詞。\n→ 空所には「前置詞 for の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) consulted … 動詞の過去形・過去分詞「相談された」 ×\n(B) consultation … 名詞（不可算）「相談」 ○\n(C) consultant … 名詞（可算）「相談役、コンサルタント」 ×\n(D) to consult … 不定詞「相談すること」 ×\n\n■ 完成文\nThe large drugstore includes a pharmacy with a doctor on hand for consultation during the week.\n（その大型ドラッグストアには薬局が入っており、平日は相談に応じる医師が常駐している。）\n\n■ 解き方のポイント\n前置詞に挟まれた空所は名詞。冠詞がなければ不可算名詞を選ぶ。","words":[{"w":"drugstore","p":"名詞","m":"ドラッグストア"},{"w":"pharmacy","p":"名詞","m":"薬局"},{"w":"on hand","p":"熟語","m":"そばに控えて"},{"w":"consultation","p":"名詞","m":"相談"}]},{"id":87,"category":"品詞問題・実戦問題 基本編","question":"The fashion chain announced that it expected to record a substantial ______ in the second quarter.","A":"lost","B":"loss","C":"lose","D":"losing","answer":"B","answer_word":"loss","explanation":"■ 文の骨格\nThe fashion chain announced that it expected to record a substantial ______ in the second quarter.\n\n■ 空所に入るもの\n冠詞 a と形容詞 substantial の後ろで、名詞が必要。\n→ 空所には「record の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) lost … 動詞の過去形・過去分詞「失った」 ×\n(B) loss … 名詞「損失」 ○\n(C) lose … 動詞（原形）「失う」 ×\n(D) losing … 現在分詞・動名詞「失うこと」 ×\n\n■ 完成文\nThe fashion chain announced that it expected to record a substantial loss in the second quarter.\n（そのファッションチェーンは、第2四半期に多額の損失を計上する見込みだと発表した。）\n\n■ 解き方のポイント\nlose（動詞）／loss（名詞）／lost（過去形・過去分詞）の使い分けは頻出。","words":[{"w":"announced","p":"動詞（過去形）","m":"発表した"},{"w":"record","p":"動詞","m":"計上する"},{"w":"substantial","p":"形容詞","m":"多額の"},{"w":"loss","p":"名詞","m":"損失"},{"w":"quarter","p":"名詞","m":"四半期"}]},{"id":88,"category":"品詞問題・実戦問題 基本編","question":"At the dawn of the Internet, a ______ venture called Next Net was founded to create one of the first search engines.","A":"cooperate","B":"cooperatively","C":"cooperatives","D":"cooperative","answer":"D","answer_word":"cooperative","explanation":"■ 文の骨格\nAt the dawn of the Internet, a ______ venture called Next Net was founded to create one of the first search engines.\n\n■ 空所に入るもの\n冠詞 a と名詞 venture の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) cooperate … 動詞（原形）「協力する」 ×\n(B) cooperatively … 副詞「協力して」 ×\n(C) cooperatives … 名詞（複数形）「協同組合」 ×\n(D) cooperative … 形容詞「共同の、協力的な」 ○\n\n■ 完成文\nAt the dawn of the Internet, a cooperative venture called Next Net was founded to create one of the first search engines.\n（インターネット黎明期に、最初期の検索エンジンの1つを作るため Next Net という共同事業が設立された。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。cooperative は形容詞・名詞の両方があるが、ここは形容詞。","words":[{"w":"dawn","p":"名詞","m":"黎明期、始まり"},{"w":"cooperative","p":"形容詞","m":"共同の"},{"w":"venture","p":"名詞","m":"事業"},{"w":"founded","p":"動詞（過去分詞）","m":"設立された"},{"w":"search engines","p":"名詞","m":"検索エンジン"}]},{"id":89,"category":"品詞問題・実戦問題 基本編","question":"A ______ variety of amenities and services are provided by the newly opened Oakridge Hotel.","A":"broad","B":"breadth","C":"broaden","D":"broadly","answer":"A","answer_word":"broad","explanation":"■ 文の骨格\nA ______ variety of amenities and services are provided by the newly opened Oakridge Hotel.\n\n■ 空所に入るもの\n冠詞 A と名詞 variety の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) broad … 形容詞「幅広い」 ○\n(B) breadth … 名詞「幅」 ×\n(C) broaden … 動詞（原形）「広げる」 ×\n(D) broadly … 副詞「広く」 ×\n\n■ 完成文\nA broad variety of amenities and services are provided by the newly opened Oakridge Hotel.\n（新しく開業した Oakridge ホテルでは、幅広い設備とサービスが提供されている。）\n\n■ 解き方のポイント\na broad [wide] variety of X＝「幅広いX」。どちらもTOEIC頻出。","words":[{"w":"broad","p":"形容詞","m":"幅広い"},{"w":"variety","p":"名詞","m":"多様性、種類"},{"w":"amenities","p":"名詞","m":"設備、備品"},{"w":"newly opened","p":"形容詞句","m":"新しく開業した"}]},{"id":90,"category":"品詞問題・実戦問題 基本編","question":"Consumers tend to prefer domestic brands when buying ______ like milk, medicines, or diapers.","A":"necessitate","B":"necessary","C":"necessarily","D":"necessities","answer":"D","answer_word":"necessities","explanation":"■ 文の骨格\nConsumers tend to prefer domestic brands when buying ______ like milk, medicines, or diapers.\n\n■ 空所に入るもの\n動名詞 buying の目的語が欠けており、like 以下の例に対応する複数名詞が必要。\n→ 空所には「buying の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) necessitate … 動詞（原形）「必要とする」 ×\n(B) necessary … 形容詞「必要な」 ×\n(C) necessarily … 副詞「必ずしも（〜ない）」 ×\n(D) necessities … 名詞（複数形）「生活必需品」 ○\n\n■ 完成文\nConsumers tend to prefer domestic brands when buying necessities like milk, medicines, or diapers.\n（消費者は、牛乳・薬・おむつのような生活必需品を買うときは国産ブランドを好む傾向がある。）\n\n■ 解き方のポイント\n目的語の位置には名詞。冠詞がなければ複数形を選ぶ。","words":[{"w":"Consumers","p":"名詞","m":"消費者"},{"w":"tend to","p":"熟語","m":"〜する傾向がある"},{"w":"domestic brands","p":"名詞","m":"国産ブランド"},{"w":"necessities","p":"名詞","m":"生活必需品"},{"w":"diapers","p":"名詞","m":"おむつ"}]},{"id":91,"category":"品詞問題・実戦問題 基本編","question":"Hareyama Flowers provides the ______ arrangements for any occasion including anniversaries, graduations, and weddings.","A":"perfect","B":"perfectly","C":"perfects","D":"perfection","answer":"A","answer_word":"perfect","explanation":"■ 文の骨格\nHareyama Flowers provides the ______ arrangements for any occasion including anniversaries, graduations, and weddings.\n\n■ 空所に入るもの\nthe と名詞 arrangements の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) perfect … 形容詞「完璧な、最適な」 ○\n(B) perfectly … 副詞「完璧に」 ×\n(C) perfects … 動詞（三人称単数現在形）「完璧にする」 ×\n(D) perfection … 名詞「完璧さ」 ×\n\n■ 完成文\nHareyama Flowers provides the perfect arrangements for any occasion including anniversaries, graduations, and weddings.\n（Hareyama Flowers は、記念日・卒業式・結婚式など、あらゆる行事にぴったりのアレンジメントを提供している。）\n\n■ 解き方のポイント\n〈the＋空所＋名詞〉は形容詞。","words":[{"w":"provides","p":"動詞","m":"提供する"},{"w":"perfect","p":"形容詞","m":"完璧な、最適な"},{"w":"arrangements","p":"名詞","m":"（花の）アレンジメント"},{"w":"occasion","p":"名詞","m":"行事、場合"},{"w":"anniversaries","p":"名詞","m":"記念日"}]},{"id":92,"category":"品詞問題・実戦問題 基本編","question":"Hiring ______ for the new board members will be announced at the meeting this afternoon.","A":"deciding","B":"decisions","C":"decided","D":"to decide","answer":"B","answer_word":"decisions","explanation":"■ 文の骨格\nHiring ______ for the new board members will be announced at the meeting this afternoon.\n\n■ 空所に入るもの\nHiring と複合名詞をつくり、述語動詞 will be announced の主語となる名詞が必要。\n→ 空所には「文の主語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) deciding … 現在分詞・動名詞「決めること」 ×\n(B) decisions … 名詞（複数形）「決定」 ○\n(C) decided … 動詞の過去形・過去分詞「決められた」 ×\n(D) to decide … 不定詞「決めること」 ×\n\n■ 完成文\nHiring decisions for the new board members will be announced at the meeting this afternoon.\n（新しい取締役の採用に関する決定は、今日の午後の会議で発表される。）\n\n■ 解き方のポイント\n名詞＋名詞の複合名詞（hiring decisions＝採用の決定）。","words":[{"w":"Hiring","p":"名詞","m":"採用"},{"w":"decisions","p":"名詞","m":"決定"},{"w":"board members","p":"名詞","m":"取締役"},{"w":"announced","p":"動詞（過去分詞）","m":"発表される"}]},{"id":93,"category":"品詞問題・実戦問題 基本編","question":"The photographs featured on our Web site may be purchased ______ from the photographers using the links provided below.","A":"direction","B":"directing","C":"directed","D":"directly","answer":"D","answer_word":"directly","explanation":"■ 文の骨格\nThe photographs featured on our Web site may be purchased ______ from the photographers using the links provided below.\n\n■ 空所に入るもの\n述語動詞 may be purchased がそろっており、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) direction … 名詞「方向、指揮」 ×\n(B) directing … 現在分詞・動名詞「指揮している」 ×\n(C) directed … 動詞の過去形・過去分詞「指揮された」 ×\n(D) directly … 副詞「直接に」 ○\n\n■ 完成文\nThe photographs featured on our Web site may be purchased directly from the photographers using the links provided below.\n（当ウェブサイトに掲載されている写真は、下記のリンクから写真家より直接購入いただけます。）\n\n■ 解き方のポイント\n受動態〈be＋過去分詞〉の直後は副詞が入る定位置。","words":[{"w":"photographs","p":"名詞","m":"写真"},{"w":"featured","p":"過去分詞","m":"掲載された"},{"w":"purchased","p":"動詞（過去分詞）","m":"購入される"},{"w":"directly","p":"副詞","m":"直接に"},{"w":"photographers","p":"名詞","m":"写真家"}]},{"id":94,"category":"品詞問題・実戦問題 基本編","question":"Attendees will be asked to complete a ______ survey at the beginning and end of the training program.","A":"brief","B":"briefed","C":"briefest","D":"briefly","answer":"A","answer_word":"brief","explanation":"■ 文の骨格\nAttendees will be asked to complete a ______ survey at the beginning and end of the training program.\n\n■ 空所に入るもの\n冠詞 a と名詞 survey の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) brief … 形容詞「短い、簡単な」 ○\n(B) briefed … 動詞の過去形・過去分詞「説明を受けた」 ×\n(C) briefest … 形容詞（最上級）「最も短い」 ×\n(D) briefly … 副詞「手短に」 ×\n\n■ 完成文\nAttendees will be asked to complete a brief survey at the beginning and end of the training program.\n（参加者は、研修プログラムの開始時と終了時に簡単なアンケートへの記入を求められる。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。最上級は the を伴うので a とは合わない。","words":[{"w":"Attendees","p":"名詞","m":"参加者"},{"w":"complete","p":"動詞","m":"記入する"},{"w":"brief","p":"形容詞","m":"簡単な"},{"w":"survey","p":"名詞","m":"アンケート、調査"},{"w":"training program","p":"名詞","m":"研修プログラム"}]},{"id":95,"category":"品詞問題・実戦問題 基本編","question":"Mr. Hamilton pointed out that most clerical errors are ______, and suggested a system of checks to resolve the problem.","A":"preventable","B":"prevent","C":"preventing","D":"prevention","answer":"A","answer_word":"preventable","explanation":"■ 文の骨格\nMr. Hamilton pointed out that most clerical errors are ______, and suggested a system of checks to resolve the problem.\n\n■ 空所に入るもの\nthat 節の主語 most clerical errors とイコール関係になる補語が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) preventable … 形容詞「予防可能な」 ○\n(B) prevent … 動詞（原形）「防ぐ」 ×\n(C) preventing … 現在分詞・動名詞「防ぐこと」 ×\n(D) prevention … 名詞「予防」 ×\n\n■ 完成文\nMr. Hamilton pointed out that most clerical errors are preventable, and suggested a system of checks to resolve the problem.\n（Hamilton さんは、事務的なミスの大半は予防可能だと指摘し、問題解決のためのチェック体制を提案した。）\n\n■ 解き方のポイント\nbe動詞の後ろの補語には形容詞。-able は形容詞の目印。","words":[{"w":"pointed out","p":"熟語","m":"指摘した"},{"w":"clerical errors","p":"名詞","m":"事務的なミス"},{"w":"preventable","p":"形容詞","m":"予防可能な"},{"w":"suggested","p":"動詞（過去形）","m":"提案した"},{"w":"resolve","p":"動詞","m":"解決する"}]},{"id":96,"category":"品詞問題・実戦問題 基本編","question":"Urbandale City College provides several management courses that will improve your employment prospects and add to your ______.","A":"qualify","B":"qualified","C":"qualifications","D":"qualifier","answer":"C","answer_word":"qualifications","explanation":"■ 文の骨格\nUrbandale City College provides several management courses that will improve your employment prospects and add to your ______.\n\n■ 空所に入るもの\n所有格 your の直後は所有物を表す名詞が入る位置。\n→ 空所には「所有格の後ろに置く名詞」が必要です。\n\n■ 選択肢の確認\n(A) qualify … 動詞（原形）「資格を与える」 ×\n(B) qualified … 動詞の過去形・過去分詞／形容詞「資格のある」 ×\n(C) qualifications … 名詞（複数形）「資格」 ○\n(D) qualifier … 名詞（単数形）「予選、限定する語」 ×\n\n■ 完成文\nUrbandale City College provides several management courses that will improve your employment prospects and add to your qualifications.\n（Urbandale City College は、あなたの就職の見込みを高め、資格を増やす経営コースをいくつか提供している。）\n\n■ 解き方のポイント\n〈所有格＋空所〉は名詞。add to your qualifications で「資格を増やす」。","words":[{"w":"provides","p":"動詞","m":"提供する"},{"w":"management courses","p":"名詞","m":"経営コース"},{"w":"employment prospects","p":"名詞","m":"就職の見込み"},{"w":"qualifications","p":"名詞","m":"資格"}]},{"id":97,"category":"品詞問題・実戦問題 基本編","question":"The use of recyclable materials has expanded ______ in the last few years, thanks to the conscientious effort of manufacturers.","A":"consider","B":"considerate","C":"considerable","D":"considerably","answer":"D","answer_word":"considerably","explanation":"■ 文の骨格\nThe use of recyclable materials has expanded ______ in the last few years, thanks to the conscientious effort of manufacturers.\n\n■ 空所に入るもの\n現在完了形 has expanded がすでに成立しており、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) consider … 動詞（原形）「考慮する」 ×\n(B) considerate … 形容詞「思いやりのある」 ×\n(C) considerable … 形容詞「かなりの、相当な」 ×\n(D) considerably … 副詞「かなり」 ○\n\n■ 完成文\nThe use of recyclable materials has expanded considerably in the last few years, thanks to the conscientious effort of manufacturers.\n（製造業者の誠実な努力のおかげで、この数年でリサイクル可能な素材の利用がかなり広がっている。）\n\n■ 解き方のポイント\nconsiderable（かなりの＝形容詞）と considerate（思いやりのある）の混同に注意。","words":[{"w":"recyclable","p":"形容詞","m":"リサイクル可能な"},{"w":"expanded","p":"動詞（過去分詞）","m":"広がった"},{"w":"considerably","p":"副詞","m":"かなり"},{"w":"conscientious","p":"形容詞","m":"誠実な"},{"w":"manufacturers","p":"名詞","m":"製造業者"}]},{"id":98,"category":"品詞問題・実戦問題 基本編","question":"Torres Furniture’s old location has been ______ since last February, when the store moved to 1630 Sherman Avenue.","A":"vacant","B":"vacating","C":"vacancy","D":"vacantly","answer":"A","answer_word":"vacant","explanation":"■ 文の骨格\nTorres Furniture’s old location has been ______ since last February, when the store moved to 1630 Sherman Avenue.\n\n■ 空所に入るもの\n現在完了形 has been の補語が欠けており、主語とイコール関係になる形容詞が必要。\n→ 空所には「has been の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) vacant … 形容詞「空いている」 ○\n(B) vacating … 現在分詞・動名詞「立ち退いている」 ×\n(C) vacancy … 名詞「空き、欠員」 ×\n(D) vacantly … 副詞「ぼんやりと」 ×\n\n■ 完成文\nTorres Furniture’s old location has been vacant since last February, when the store moved to 1630 Sherman Avenue.\n（Torres 家具店の旧所在地は、店舗が Sherman 街1630番地に移転した昨年2月以来空いたままだ。）\n\n■ 解き方のポイント\nbe動詞の補語には形容詞。vacancy（名詞）との使い分けに注意。","words":[{"w":"location","p":"名詞","m":"所在地"},{"w":"vacant","p":"形容詞","m":"空いている"},{"w":"since","p":"前置詞","m":"〜以来"},{"w":"moved","p":"動詞（過去形）","m":"移転した"}]},{"id":99,"category":"品詞問題・実戦問題 基本編","question":"The results of recent water quality monitoring in the area verify that community health and safety concerns have been ______ addressed.","A":"effect","B":"effective","C":"effectively","D":"effectiveness","answer":"C","answer_word":"effectively","explanation":"■ 文の骨格\nThe results of recent water quality monitoring in the area verify that community health and safety concerns have been ______ addressed.\n\n■ 空所に入るもの\n現在完了受動態 have been addressed の間に入る修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) effect … 名詞／動詞「効果／もたらす」 ×\n(B) effective … 形容詞「効果的な」 ×\n(C) effectively … 副詞「効果的に」 ○\n(D) effectiveness … 名詞「有効性」 ×\n\n■ 完成文\nThe results of recent water quality monitoring in the area verify that community health and safety concerns have been effectively addressed.\n（その地域の最近の水質調査の結果は、地域の健康と安全に関する懸念が効果的に対処されていることを裏づけている。）\n\n■ 解き方のポイント\n〈have been＋空所＋過去分詞〉は副詞の定位置。","words":[{"w":"water quality","p":"名詞","m":"水質"},{"w":"verify","p":"動詞","m":"裏づける、実証する"},{"w":"concerns","p":"名詞","m":"懸念"},{"w":"effectively","p":"副詞","m":"効果的に"},{"w":"addressed","p":"動詞（過去分詞）","m":"対処された"}]},{"id":100,"category":"品詞問題・実戦問題 基本編","question":"The curtains, designed by Elaine Hutton, are ______ by such distinctive motifs as tulips, stylized birds, and other animals.","A":"identify","B":"identifies","C":"identity","D":"identifiable","answer":"D","answer_word":"identifiable","explanation":"■ 文の骨格\nThe curtains, designed by Elaine Hutton, are ______ by such distinctive motifs as tulips, stylized birds, and other animals.\n\n■ 空所に入るもの\nare の補語が欠けており、by 以下と結びついて意味が通る形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) identify … 動詞（原形）「識別する」 ×\n(B) identifies … 動詞（三人称単数現在形）「識別する」 ×\n(C) identity … 名詞「身元、独自性」 ×\n(D) identifiable … 形容詞「識別できる」 ○\n\n■ 完成文\nThe curtains, designed by Elaine Hutton, are identifiable by such distinctive motifs as tulips, stylized birds, and other animals.\n（Elaine Hutton がデザインしたカーテンは、チューリップや図案化された鳥などの独特なモチーフによって見分けがつく。）\n\n■ 解き方のポイント\n-able で終わる語は形容詞。be identifiable by X＝「Xで見分けがつく」。","words":[{"w":"curtains","p":"名詞","m":"カーテン"},{"w":"designed","p":"過去分詞","m":"デザインされた"},{"w":"identifiable","p":"形容詞","m":"識別できる"},{"w":"distinctive","p":"形容詞","m":"独特な"},{"w":"stylized","p":"形容詞","m":"図案化された"}]},{"id":101,"category":"品詞問題・実戦問題 基本編","question":"The ______ use of office space and equipment in the Tokyo branch has been emulated by several of the other international branches.","A":"economize","B":"economical","C":"economy","D":"economist","answer":"B","answer_word":"economical","explanation":"■ 文の骨格\nThe ______ use of office space and equipment in the Tokyo branch has been emulated by several of the other international branches.\n\n■ 空所に入るもの\nthe と名詞 use の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) economize … 動詞（原形）「節約する」 ×\n(B) economical … 形容詞「経済的な、無駄のない」 ○\n(C) economy … 名詞「経済」 ×\n(D) economist … 名詞「経済学者」 ×\n\n■ 完成文\nThe economical use of office space and equipment in the Tokyo branch has been emulated by several of the other international branches.\n（東京支店の経済的な事務所スペースと設備の使い方は、ほかのいくつかの海外支店の手本となっている。）\n\n■ 解き方のポイント\neconomic（経済の）と economical（節約になる）の意味の違いはTOEIC頻出。","words":[{"w":"economical","p":"形容詞","m":"経済的な"},{"w":"equipment","p":"名詞","m":"設備"},{"w":"branch","p":"名詞","m":"支店"},{"w":"emulated","p":"動詞（過去分詞）","m":"手本にされた"}]},{"id":102,"category":"品詞問題・実戦問題 基本編","question":"For the agreement to be ______, you need to fill out the attached application form and submit it to the human resources manager.","A":"valid","B":"validate","C":"validity","D":"validates","answer":"A","answer_word":"valid","explanation":"■ 文の骨格\nFor the agreement to be ______, you need to fill out the attached application form and submit it to the human resources manager.\n\n■ 空所に入るもの\nto be の後ろで、主語 the agreement とイコール関係になる補語が必要。\n→ 空所には「be の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) valid … 形容詞「有効な」 ○\n(B) validate … 動詞（原形）「有効にする」 ×\n(C) validity … 名詞「有効性」 ×\n(D) validates … 動詞（三人称単数現在形）「有効にする」 ×\n\n■ 完成文\nFor the agreement to be valid, you need to fill out the attached application form and submit it to the human resources manager.\n（この契約を有効にするには、添付の申請書に記入し、人事部長に提出する必要がある。）\n\n■ 解き方のポイント\nbe動詞の後ろの補語は形容詞が基本。名詞 validity では「契約＝有効性」となり意味が通らない。","words":[{"w":"agreement","p":"名詞","m":"契約、合意"},{"w":"valid","p":"形容詞","m":"有効な"},{"w":"fill out","p":"熟語","m":"記入する"},{"w":"attached","p":"形容詞","m":"添付の"},{"w":"human resources","p":"名詞","m":"人事"}]},{"id":103,"category":"品詞問題・実戦問題 基本編","question":"Huber Online Bookstore guarantees ______ of your order within two working days, provided you order before 4 P.M.","A":"deliver","B":"delivers","C":"delivering","D":"delivery","answer":"D","answer_word":"delivery","explanation":"■ 文の骨格\nHuber Online Bookstore guarantees ______ of your order within two working days, provided you order before 4 P.M.\n\n■ 空所に入るもの\n他動詞 guarantees の目的語が欠けており、of と結びつく名詞が必要。\n→ 空所には「guarantees の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) deliver … 動詞（原形）「配達する」 ×\n(B) delivers … 動詞（三人称単数現在形）「配達する」 ×\n(C) delivering … 現在分詞・動名詞「配達すること」 ×\n(D) delivery … 名詞「配達」 ○\n\n■ 完成文\nHuber Online Bookstore guarantees delivery of your order within two working days, provided you order before 4 P.M.\n（Huber Online Bookstore は、午後4時までにご注文いただければ2営業日以内の配達を保証します。）\n\n■ 解き方のポイント\n他動詞の直後は目的語＝名詞。deliver（動詞）／delivery（名詞）の対応を覚える。","words":[{"w":"guarantees","p":"動詞","m":"保証する"},{"w":"delivery","p":"名詞","m":"配達"},{"w":"order","p":"名詞","m":"注文"},{"w":"working days","p":"名詞","m":"営業日"},{"w":"provided","p":"接続詞","m":"〜という条件で"}]},{"id":104,"category":"品詞問題・実戦問題 基本編","question":"One of the ______ of the office manager is to identify volunteers for the emergency evacuation team.","A":"responsible","B":"responsibly","C":"responsibility","D":"responsibilities","answer":"D","answer_word":"responsibilities","explanation":"■ 文の骨格\nOne of the ______ of the office manager is to identify volunteers for the emergency evacuation team.\n\n■ 空所に入るもの\nOne of the ... の形なので、of の後ろは必ず複数名詞。\n→ 空所には「of の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) responsible … 形容詞「責任がある」 ×\n(B) responsibly … 副詞「責任をもって」 ×\n(C) responsibility … 名詞（単数形）「責任」 ×\n(D) responsibilities … 名詞（複数形）「責務」 ○\n\n■ 完成文\nOne of the responsibilities of the office manager is to identify volunteers for the emergency evacuation team.\n（総務課長の責務の1つは、緊急避難チームの志願者を見つけることだ。）\n\n■ 解き方のポイント\none of the ＿＿ の空所は必ず複数名詞。述語動詞は one に合わせて単数（is）。","words":[{"w":"responsibilities","p":"名詞","m":"責務"},{"w":"office manager","p":"名詞","m":"総務課長"},{"w":"identify","p":"動詞","m":"見つけ出す"},{"w":"volunteers","p":"名詞","m":"志願者"},{"w":"evacuation","p":"名詞","m":"避難"}]},{"id":105,"category":"品詞問題・実戦問題 基本編","question":"Ms. Kim received a ______ just three months after being hired as a sales representative at Wilson Manufacturing.","A":"promote","B":"promoting","C":"promotion","D":"promoted","answer":"C","answer_word":"promotion","explanation":"■ 文の骨格\nMs. Kim received a ______ just three months after being hired as a sales representative at Wilson Manufacturing.\n\n■ 空所に入るもの\n冠詞 a の後ろで、他動詞 received の目的語となる名詞が必要。\n→ 空所には「received の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) promote … 動詞（原形）「昇進させる、促進する」 ×\n(B) promoting … 現在分詞・動名詞「促進すること」 ×\n(C) promotion … 名詞「昇進、販売促進」 ○\n(D) promoted … 動詞の過去形・過去分詞「昇進した」 ×\n\n■ 完成文\nMs. Kim received a promotion just three months after being hired as a sales representative at Wilson Manufacturing.\n（Kim さんは、Wilson Manufacturing 社に営業担当として採用されたわずか3カ月後に昇進した。）\n\n■ 解き方のポイント\n冠詞の直後は名詞。-tion は名詞の目印。","words":[{"w":"received","p":"動詞（過去形）","m":"受けた"},{"w":"promotion","p":"名詞","m":"昇進"},{"w":"hired","p":"動詞（過去分詞）","m":"採用された"},{"w":"sales representative","p":"名詞","m":"営業担当"}]},{"id":106,"category":"品詞問題・実戦問題 基本編","question":"The product concept is derived from the Karaoke sing-along, a popular pastime in Japan that has been ______ successful in the U.S. as well.","A":"moderate","B":"moderately","C":"moderating","D":"moderator","answer":"B","answer_word":"moderately","explanation":"■ 文の骨格\nThe product concept is derived from the Karaoke sing-along, a popular pastime in Japan that has been ______ successful in the U.S. as well.\n\n■ 空所に入るもの\nhas been の補語として形容詞 successful がすでにあり、空所は修飾語の位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) moderate … 形容詞「適度な」 ×\n(B) moderately … 副詞「ほどほどに、ある程度」 ○\n(C) moderating … 現在分詞・動名詞「和らげている」 ×\n(D) moderator … 名詞「司会者」 ×\n\n■ 完成文\nThe product concept is derived from the Karaoke sing-along, a popular pastime in Japan that has been moderately successful in the U.S. as well.\n（その商品コンセプトは、日本で人気の娯楽であり、アメリカでもある程度成功しているカラオケに由来している。）\n\n■ 解き方のポイント\n〈be動詞＋空所＋形容詞〉は副詞。","words":[{"w":"derived from","p":"熟語","m":"〜に由来する"},{"w":"pastime","p":"名詞","m":"娯楽"},{"w":"moderately","p":"副詞","m":"ある程度"},{"w":"successful","p":"形容詞","m":"成功した"}]},{"id":107,"category":"品詞問題・実戦問題 基本編","question":"Due to positive reviews and popular demand, the theatrical production will continue for an ______ period of time.","A":"extend","B":"extended","C":"extensively","D":"extension","answer":"B","answer_word":"extended","explanation":"■ 文の骨格\nDue to positive reviews and popular demand, the theatrical production will continue for an ______ period of time.\n\n■ 空所に入るもの\n冠詞 an と名詞 period の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する過去分詞（形容詞的用法）」が必要です。\n\n■ 選択肢の確認\n(A) extend … 動詞（原形）「延長する」 ×\n(B) extended … 過去分詞・形容詞「延長された、長期の」 ○\n(C) extensively … 副詞「広範囲に」 ×\n(D) extension … 名詞「延長、内線」 ×\n\n■ 完成文\nDue to positive reviews and popular demand, the theatrical production will continue for an extended period of time.\n（好意的な批評と高い需要により、その舞台作品は長期にわたって上演が続く。）\n\n■ 解き方のポイント\nan extended period of time＝「長期間」。名詞の前の空所は形容詞相当語。","words":[{"w":"positive reviews","p":"名詞","m":"好意的な批評"},{"w":"demand","p":"名詞","m":"需要"},{"w":"theatrical production","p":"名詞","m":"舞台作品"},{"w":"extended","p":"形容詞","m":"延長された、長期の"}]},{"id":108,"category":"品詞問題・実戦問題 基本編","question":"R&D managers must ______ find a way to reduce the production cost of the new portable computer.","A":"quick","B":"quicker","C":"quickest","D":"quickly","answer":"D","answer_word":"quickly","explanation":"■ 文の骨格\nR&D managers must ______ find a way to reduce the production cost of the new portable computer.\n\n■ 空所に入るもの\n助動詞 must と動詞 find の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) quick … 形容詞「素早い」 ×\n(B) quicker … 形容詞（比較級）「より素早い」 ×\n(C) quickest … 形容詞（最上級）「最も素早い」 ×\n(D) quickly … 副詞「素早く」 ○\n\n■ 完成文\nR&D managers must quickly find a way to reduce the production cost of the new portable computer.\n（研究開発部長たちは、新しい携帯コンピュータの製造コストを削減する方法を早急に見つけなければならない。）\n\n■ 解き方のポイント\n〈助動詞＋空所＋動詞の原形〉は副詞の定位置。R&D＝research and development。","words":[{"w":"R&D","p":"名詞","m":"研究開発"},{"w":"quickly","p":"副詞","m":"素早く"},{"w":"reduce","p":"動詞","m":"削減する"},{"w":"production cost","p":"名詞","m":"製造コスト"},{"w":"portable","p":"形容詞","m":"携帯型の"}]},{"id":109,"category":"品詞問題・実戦問題 基本編","question":"A well-designed logo that is ______ recognizable makes a company seem more dependable.","A":"universe","B":"universal","C":"universally","D":"universality","answer":"C","answer_word":"universally","explanation":"■ 文の骨格\nA well-designed logo that is ______ recognizable makes a company seem more dependable.\n\n■ 空所に入るもの\nis の補語として形容詞 recognizable がすでにあり、空所は修飾語の位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) universe … 名詞「宇宙」 ×\n(B) universal … 形容詞「普遍的な」 ×\n(C) universally … 副詞「誰にでも、普遍的に」 ○\n(D) universality … 名詞「普遍性」 ×\n\n■ 完成文\nA well-designed logo that is universally recognizable makes a company seem more dependable.\n（よく設計され、誰にでもすぐ分かるロゴは、会社をより信頼できるものに見せる。）\n\n■ 解き方のポイント\n〈be動詞＋空所＋形容詞〉は副詞。","words":[{"w":"well-designed","p":"形容詞","m":"よく設計された"},{"w":"universally","p":"副詞","m":"誰にでも"},{"w":"recognizable","p":"形容詞","m":"認識できる"},{"w":"dependable","p":"形容詞","m":"信頼できる"}]},{"id":110,"category":"品詞問題・実戦問題 基本編","question":"Located approximately 150 miles south of Rome, Deer Island can ______ be reached by plane from Napoli Airport.","A":"easily","B":"easy","C":"ease","D":"easiness","answer":"A","answer_word":"easily","explanation":"■ 文の骨格\nLocated approximately 150 miles south of Rome, Deer Island can ______ be reached by plane from Napoli Airport.\n\n■ 空所に入るもの\n助動詞 can と be reached の間の位置で、文の要素はそろっている。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) easily … 副詞「簡単に」 ○\n(B) easy … 形容詞「簡単な」 ×\n(C) ease … 名詞／動詞「容易さ／和らげる」 ×\n(D) easiness … 名詞「容易さ」 ×\n\n■ 完成文\nLocated approximately 150 miles south of Rome, Deer Island can easily be reached by plane from Napoli Airport.\n（ローマの約150マイル南に位置する Deer 島へは、ナポリ空港から飛行機で簡単に行くことができる。）\n\n■ 解き方のポイント\n〈助動詞＋空所＋動詞〉は副詞。","words":[{"w":"approximately","p":"副詞","m":"およそ"},{"w":"easily","p":"副詞","m":"簡単に"},{"w":"reached","p":"動詞（過去分詞）","m":"到達される"},{"w":"Airport","p":"名詞","m":"空港"}]},{"id":111,"category":"品詞問題・実戦問題 基本編","question":"The age of its components and the cost of repair can indicate whether or not it is ______ to purchase a new computer.","A":"necessitate","B":"necessity","C":"necessary","D":"necessarily","answer":"C","answer_word":"necessary","explanation":"■ 文の骨格\nThe age of its components and the cost of repair can indicate whether or not it is ______ to purchase a new computer.\n\n■ 空所に入るもの\nit is ______ to do の形で、形式主語 it に対応する補語の形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) necessitate … 動詞（原形）「必要とさせる」 ×\n(B) necessity … 名詞「必要性」 ×\n(C) necessary … 形容詞「必要な」 ○\n(D) necessarily … 副詞「必ずしも（〜ない）」 ×\n\n■ 完成文\nThe age of its components and the cost of repair can indicate whether or not it is necessary to purchase a new computer.\n（部品の古さと修理費用は、新しいコンピュータを買う必要があるかどうかの判断材料になる。）\n\n■ 解き方のポイント\nIt is ＿＿ to do. の空所は形容詞。形式主語構文の定番。","words":[{"w":"components","p":"名詞","m":"部品"},{"w":"repair","p":"名詞","m":"修理"},{"w":"indicate","p":"動詞","m":"示す"},{"w":"necessary","p":"形容詞","m":"必要な"},{"w":"purchase","p":"動詞","m":"購入する"}]},{"id":112,"category":"品詞問題・実戦問題 基本編","question":"Employee training is ______ to running a smooth business and maintaining compliance with industry standards.","A":"vitalize","B":"vitality","C":"vital","D":"vitally","answer":"C","answer_word":"vital","explanation":"■ 文の骨格\nEmployee training is ______ to running a smooth business and maintaining compliance with industry standards.\n\n■ 空所に入るもの\nis の補語が欠けており、to と結びついて意味が通る形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) vitalize … 動詞（原形）「活性化する」 ×\n(B) vitality … 名詞「活力」 ×\n(C) vital … 形容詞「不可欠な」 ○\n(D) vitally … 副詞「極めて重要に」 ×\n\n■ 完成文\nEmployee training is vital to running a smooth business and maintaining compliance with industry standards.\n（従業員研修は、円滑な事業運営と業界基準の順守を維持するうえで不可欠である。）\n\n■ 解き方のポイント\nbe vital to X＝「Xに不可欠だ」。be動詞の補語は形容詞。","words":[{"w":"Employee training","p":"名詞","m":"従業員研修"},{"w":"vital","p":"形容詞","m":"不可欠な"},{"w":"smooth","p":"形容詞","m":"円滑な"},{"w":"compliance","p":"名詞","m":"順守"},{"w":"industry standards","p":"名詞","m":"業界基準"}]},{"id":113,"category":"品詞問題・実戦問題 基本編","question":"Once the board of directors approves the plan, construction of the new ______ will begin.","A":"build","B":"builder","C":"to build","D":"building","answer":"D","answer_word":"building","explanation":"■ 文の骨格\nOnce the board of directors approves the plan, construction of the new ______ will begin.\n\n■ 空所に入るもの\nthe new の後ろで、前置詞 of の目的語となる名詞が必要。\n→ 空所には「前置詞 of の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) build … 動詞（原形）「建てる」 ×\n(B) builder … 名詞「建設業者」 ×\n(C) to build … 不定詞「建てること」 ×\n(D) building … 名詞「建物、ビル」 ○\n\n■ 完成文\nOnce the board of directors approves the plan, construction of the new building will begin.\n（取締役会が計画を承認したらすぐに、新しいビルの建設が始まる。）\n\n■ 解き方のポイント\n「新しい〜の建設」に合うのは building（建物）。builder（建設者）では意味が通らない。","words":[{"w":"board of directors","p":"名詞","m":"取締役会"},{"w":"approves","p":"動詞","m":"承認する"},{"w":"construction","p":"名詞","m":"建設"},{"w":"building","p":"名詞","m":"建物"}]},{"id":114,"category":"品詞問題・実戦問題 基本編","question":"Strong Steels Inc. is ______ regarded as one of the leading steel engineering companies in Asia.","A":"wider","B":"widened","C":"widening","D":"widely","answer":"D","answer_word":"widely","explanation":"■ 文の骨格\nStrong Steels Inc. is ______ regarded as one of the leading steel engineering companies in Asia.\n\n■ 空所に入るもの\n受動態 is regarded の間に入る修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) wider … 形容詞（比較級）「より広い」 ×\n(B) widened … 動詞の過去形・過去分詞「広げられた」 ×\n(C) widening … 現在分詞・動名詞「広げている」 ×\n(D) widely … 副詞「広く」 ○\n\n■ 完成文\nStrong Steels Inc. is widely regarded as one of the leading steel engineering companies in Asia.\n（Strong Steels 社は、アジアを代表する鉄鋼エンジニアリング企業の1つとして広く認知されている。）\n\n■ 解き方のポイント\nbe widely regarded as X＝「Xとして広く見なされている」。","words":[{"w":"widely","p":"副詞","m":"広く"},{"w":"regarded as","p":"熟語","m":"〜と見なされる"},{"w":"leading","p":"形容詞","m":"主要な"},{"w":"steel","p":"名詞","m":"鉄鋼"}]},{"id":115,"category":"品詞問題・実戦問題 基本編","question":"Ms. Anderson is looking for a dress that is both ______ and comfortable to wear to her supervisor’s retirement party.","A":"elegant","B":"elegance","C":"elegantly","D":"more elegantly","answer":"A","answer_word":"elegant","explanation":"■ 文の骨格\nMs. Anderson is looking for a dress that is both ______ and comfortable to wear to her supervisor’s retirement party.\n\n■ 空所に入るもの\nboth A and B の形で、and の後ろが形容詞 comfortable なので前も形容詞。\n→ 空所には「comfortable と並列になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) elegant … 形容詞「上品な」 ○\n(B) elegance … 名詞「上品さ」 ×\n(C) elegantly … 副詞「上品に」 ×\n(D) more elegantly … 副詞（比較級）「より上品に」 ×\n\n■ 完成文\nMs. Anderson is looking for a dress that is both elegant and comfortable to wear to her supervisor’s retirement party.\n（Anderson さんは、上司の退職パーティーに着ていく、上品で着心地のよいドレスを探している。）\n\n■ 解き方のポイント\nboth A and B は同じ品詞が並ぶ。後ろを見れば前が決まる。","words":[{"w":"looking for","p":"熟語","m":"探している"},{"w":"elegant","p":"形容詞","m":"上品な"},{"w":"comfortable","p":"形容詞","m":"快適な"},{"w":"supervisor","p":"名詞","m":"上司"},{"w":"retirement party","p":"名詞","m":"退職パーティー"}]},{"id":116,"category":"品詞問題・実戦問題 基本編","question":"Iznik, the site of the ancient Greek Council of Nicaea, has ______ been an important center for ceramics production.","A":"history","B":"historian","C":"historical","D":"historically","answer":"D","answer_word":"historically","explanation":"■ 文の骨格\nIznik, the site of the ancient Greek Council of Nicaea, has ______ been an important center for ceramics production.\n\n■ 空所に入るもの\n現在完了形 has been の間に入る修飾語の位置で、文の要素はそろっている。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) history … 名詞「歴史」 ×\n(B) historian … 名詞「歴史家」 ×\n(C) historical … 形容詞「歴史的な」 ×\n(D) historically … 副詞「歴史的に」 ○\n\n■ 完成文\nIznik, the site of the ancient Greek Council of Nicaea, has historically been an important center for ceramics production.\n（古代ギリシャのニカイア公会議が開かれた地である Iznik は、歴史的に陶磁器生産の重要な拠点であり続けている。）\n\n■ 解き方のポイント\n〈has/have＋空所＋過去分詞〉は副詞の定位置。","words":[{"w":"site","p":"名詞","m":"場所、跡地"},{"w":"ancient","p":"形容詞","m":"古代の"},{"w":"Council","p":"名詞","m":"公会議、評議会"},{"w":"historically","p":"副詞","m":"歴史的に"},{"w":"ceramics","p":"名詞","m":"陶磁器"}]},{"id":117,"category":"品詞問題・実戦問題 基本編","question":"Most of the business travelers surveyed rated Starlight Hotel highly because of the ______ of the rooms and its convenient location.","A":"clean","B":"cleanly","C":"cleanliness","D":"cleans","answer":"C","answer_word":"cleanliness","explanation":"■ 文の骨格\nMost of the business travelers surveyed rated Starlight Hotel highly because of the ______ of the rooms and its convenient location.\n\n■ 空所に入るもの\nthe と of に挟まれた位置で、名詞が必要。\n→ 空所には「the の後ろに置く名詞」が必要です。\n\n■ 選択肢の確認\n(A) clean … 形容詞／動詞「きれいな／掃除する」 ×\n(B) cleanly … 副詞「きれいに」 ×\n(C) cleanliness … 名詞「清潔さ」 ○\n(D) cleans … 動詞（三人称単数現在形）「掃除する」 ×\n\n■ 完成文\nMost of the business travelers surveyed rated Starlight Hotel highly because of the cleanliness of the rooms and its convenient location.\n（調査に答えた出張者の大半は、部屋の清潔さと立地の便利さから Starlight ホテルを高く評価した。）\n\n■ 解き方のポイント\n〈the ＿＿ of〉は名詞。-ness は名詞の目印。","words":[{"w":"business travelers","p":"名詞","m":"出張者"},{"w":"surveyed","p":"過去分詞","m":"調査を受けた"},{"w":"rated","p":"動詞（過去形）","m":"評価した"},{"w":"cleanliness","p":"名詞","m":"清潔さ"},{"w":"convenient","p":"形容詞","m":"便利な"}]},{"id":118,"category":"品詞問題・実戦問題 基本編","question":"Venture capital firms are considering contests that offer competing entrepreneurs multimillion-dollar prizes if they come up with ______ technologies.","A":"innovate","B":"innovative","C":"innovates","D":"innovatively","answer":"B","answer_word":"innovative","explanation":"■ 文の骨格\nVenture capital firms are considering contests that offer competing entrepreneurs multimillion-dollar prizes if they come up with ______ technologies.\n\n■ 空所に入るもの\n他動詞句 come up with の目的語 technologies を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) innovate … 動詞（原形）「革新する」 ×\n(B) innovative … 形容詞「革新的な」 ○\n(C) innovates … 動詞（三人称単数現在形）「革新する」 ×\n(D) innovatively … 副詞「革新的に」 ×\n\n■ 完成文\nVenture capital firms are considering contests that offer competing entrepreneurs multimillion-dollar prizes if they come up with innovative technologies.\n（ベンチャー投資会社は、競い合う起業家が革新的な技術を考え出せば数百万ドルの賞金を与えるコンテストを検討している。）\n\n■ 解き方のポイント\n名詞の直前の空所は形容詞。-ive は形容詞の目印。","words":[{"w":"Venture capital firms","p":"名詞","m":"ベンチャー投資会社"},{"w":"competing","p":"形容詞","m":"競い合う"},{"w":"entrepreneurs","p":"名詞","m":"起業家"},{"w":"come up with","p":"熟語","m":"考え出す"},{"w":"innovative","p":"形容詞","m":"革新的な"}]},{"id":119,"category":"品詞問題・実戦問題 基本編","question":"The company’s recent rise in ______ can be attributed to the managerial acumen of the newly appointed CEO, Leonie Wagner.","A":"profitability","B":"profitable","C":"profited","D":"to profit","answer":"A","answer_word":"profitability","explanation":"■ 文の骨格\nThe company’s recent rise in ______ can be attributed to the managerial acumen of the newly appointed CEO, Leonie Wagner.\n\n■ 空所に入るもの\n前置詞 in の後ろは名詞が入る位置。\n→ 空所には「前置詞 in の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) profitability … 名詞「収益性」 ○\n(B) profitable … 形容詞「もうかる」 ×\n(C) profited … 動詞の過去形・過去分詞「利益を得た」 ×\n(D) to profit … 不定詞「利益を得ること」 ×\n\n■ 完成文\nThe company’s recent rise in profitability can be attributed to the managerial acumen of the newly appointed CEO, Leonie Wagner.\n（同社の最近の収益性の向上は、新しく就任した CEO、Leonie Wagner の経営手腕によるものと考えられる。）\n\n■ 解き方のポイント\n前置詞の直後は名詞。-ity は名詞の目印。","words":[{"w":"rise","p":"名詞","m":"上昇"},{"w":"profitability","p":"名詞","m":"収益性"},{"w":"attributed to","p":"熟語","m":"〜によるものとされる"},{"w":"managerial acumen","p":"名詞","m":"経営手腕"},{"w":"appointed","p":"過去分詞","m":"任命された"}]},{"id":120,"category":"品詞問題・実戦問題 基本編","question":"Smile Fitness Center, an exclusive fitness club in Seoul, is ______ seeking full-time personal trainers.","A":"urgent","B":"most urgent","C":"urgency","D":"urgently","answer":"D","answer_word":"urgently","explanation":"■ 文の骨格\nSmile Fitness Center, an exclusive fitness club in Seoul, is ______ seeking full-time personal trainers.\n\n■ 空所に入るもの\n現在進行形 is seeking の間に入る修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) urgent … 形容詞「緊急の」 ×\n(B) most urgent … 形容詞（最上級）「最も緊急の」 ×\n(C) urgency … 名詞「緊急性」 ×\n(D) urgently … 副詞「緊急に、大至急」 ○\n\n■ 完成文\nSmile Fitness Center, an exclusive fitness club in Seoul, is urgently seeking full-time personal trainers.\n（ソウルの会員制フィットネスクラブ Smile Fitness Center は、常勤のパーソナルトレーナーを急募している。）\n\n■ 解き方のポイント\n〈be動詞＋空所＋-ing〉は副詞の定位置。","words":[{"w":"exclusive","p":"形容詞","m":"会員制の、高級な"},{"w":"urgently","p":"副詞","m":"緊急に"},{"w":"seeking","p":"現在分詞","m":"探している"},{"w":"full-time","p":"形容詞","m":"常勤の"}]},{"id":121,"category":"品詞問題・実戦問題 基本編","question":"______ of your order will be sent within 24 hours to the e-mail address you have provided.","A":"Confirmation","B":"Confirms","C":"Confirmed","D":"Confirming","answer":"A","answer_word":"Confirmation","explanation":"■ 文の骨格\n______ of your order will be sent within 24 hours to the e-mail address you have provided.\n\n■ 空所に入るもの\n文頭が空所で、述語動詞 will be sent に対応する主語が欠けている。\n→ 空所には「文の主語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) Confirmation … 名詞「確認（通知）」 ○\n(B) Confirms … 動詞（三人称単数現在形）「確認する」 ×\n(C) Confirmed … 動詞の過去形・過去分詞「確認された」 ×\n(D) Confirming … 現在分詞・動名詞「確認すること」 ×\n\n■ 完成文\nConfirmation of your order will be sent within 24 hours to the e-mail address you have provided.\n（ご注文の確認メールは、ご登録のメールアドレスへ24時間以内にお送りします。）\n\n■ 解き方のポイント\n文頭の空所＋of ＋名詞 → 主語となる名詞。","words":[{"w":"Confirmation","p":"名詞","m":"確認"},{"w":"order","p":"名詞","m":"注文"},{"w":"sent","p":"動詞（過去分詞）","m":"送られる"},{"w":"provided","p":"動詞（過去分詞）","m":"提供した"}]},{"id":122,"category":"品詞問題・実戦問題 基本編","question":"Smokey Joe’s café has three ______ in Tokyo, including one recently opened in Aoyama.","A":"locate","B":"locates","C":"located","D":"locations","answer":"D","answer_word":"locations","explanation":"■ 文の骨格\nSmokey Joe’s café has three ______ in Tokyo, including one recently opened in Aoyama.\n\n■ 空所に入るもの\n数詞 three の後ろなので、複数形の名詞が必要。\n→ 空所には「has の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) locate … 動詞（原形）「位置づける」 ×\n(B) locates … 動詞（三人称単数現在形）「位置づける」 ×\n(C) located … 動詞の過去形・過去分詞「位置している」 ×\n(D) locations … 名詞（複数形）「店舗、所在地」 ○\n\n■ 完成文\nSmokey Joe’s café has three locations in Tokyo, including one recently opened in Aoyama.\n（Smokey Joe’s カフェは、最近青山に開店した1店を含め、東京に3店舗ある。）\n\n■ 解き方のポイント\n数詞の直後は複数名詞。location は「店舗」の意味でもよく使う。","words":[{"w":"locations","p":"名詞","m":"店舗、所在地"},{"w":"including","p":"前置詞","m":"〜を含めて"},{"w":"recently","p":"副詞","m":"最近"},{"w":"opened","p":"過去分詞","m":"開店した"}]},{"id":123,"category":"品詞問題・実戦問題 基本編","question":"During the probationary period, all newly hired engineers of Thunder Engineering work very ______ with their supervisors.","A":"close","B":"closely","C":"closer","D":"closest","answer":"B","answer_word":"closely","explanation":"■ 文の骨格\nDuring the probationary period, all newly hired engineers of Thunder Engineering work very ______ with their supervisors.\n\n■ 空所に入るもの\n自動詞 work と副詞 very の後ろで、動詞を修飾する位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) close … 形容詞／副詞「近い／接近して」 ×\n(B) closely … 副詞「密接に」 ○\n(C) closer … 比較級「より近い」 ×\n(D) closest … 最上級「最も近い」 ×\n\n■ 完成文\nDuring the probationary period, all newly hired engineers of Thunder Engineering work very closely with their supervisors.\n（試用期間中、Thunder Engineering 社に新しく採用された技術者は全員、上司と密に仕事をする。）\n\n■ 解き方のポイント\nwork closely with X＝「Xと密に協働する」。close（距離が近い）と closely（密接に）は意味が違う。","words":[{"w":"probationary period","p":"名詞","m":"試用期間"},{"w":"newly hired","p":"形容詞句","m":"新しく採用された"},{"w":"closely","p":"副詞","m":"密接に"},{"w":"supervisors","p":"名詞","m":"上司"}]},{"id":124,"category":"品詞問題・実戦問題 基本編","question":"The company’s annual strategy meeting was held at the headquarters on Tuesday to discuss steps to enhance ______ among the different departments.","A":"cooperate","B":"cooperated","C":"cooperative","D":"cooperation","answer":"D","answer_word":"cooperation","explanation":"■ 文の骨格\nThe company’s annual strategy meeting was held at the headquarters on Tuesday to discuss steps to enhance ______ among the different departments.\n\n■ 空所に入るもの\n他動詞 enhance の目的語が欠けている。\n→ 空所には「enhance の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) cooperate … 動詞（原形）「協力する」 ×\n(B) cooperated … 動詞の過去形・過去分詞「協力した」 ×\n(C) cooperative … 形容詞「協力的な」 ×\n(D) cooperation … 名詞「連携、協力」 ○\n\n■ 完成文\nThe company’s annual strategy meeting was held at the headquarters on Tuesday to discuss steps to enhance cooperation among the different departments.\n（部門間の連携を強化する方策を話し合うため、火曜日に本社で会社の年次戦略会議が開かれた。）\n\n■ 解き方のポイント\n他動詞の直後は目的語＝名詞。-tion は名詞の目印。","words":[{"w":"annual","p":"形容詞","m":"年次の"},{"w":"strategy meeting","p":"名詞","m":"戦略会議"},{"w":"headquarters","p":"名詞","m":"本社"},{"w":"enhance","p":"動詞","m":"強化する"},{"w":"cooperation","p":"名詞","m":"連携"}]},{"id":125,"category":"品詞問題・実戦問題 基本編","question":"The strategic partnership agreement with a leading Canadian business publisher will enable Bear Publishing to reach a ______ group of readers.","A":"diverse","B":"diversity","C":"diversely","D":"diversify","answer":"A","answer_word":"diverse","explanation":"■ 文の骨格\nThe strategic partnership agreement with a leading Canadian business publisher will enable Bear Publishing to reach a ______ group of readers.\n\n■ 空所に入るもの\n冠詞 a と名詞 group の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) diverse … 形容詞「多様な」 ○\n(B) diversity … 名詞「多様性」 ×\n(C) diversely … 副詞「多様に」 ×\n(D) diversify … 動詞（原形）「多様化する」 ×\n\n■ 完成文\nThe strategic partnership agreement with a leading Canadian business publisher will enable Bear Publishing to reach a diverse group of readers.\n（カナダの大手ビジネス出版社との戦略提携により、Bear Publishing 社は多様な読者層に届けられるようになる。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。","words":[{"w":"strategic partnership","p":"名詞","m":"戦略提携"},{"w":"leading","p":"形容詞","m":"大手の"},{"w":"publisher","p":"名詞","m":"出版社"},{"w":"enable","p":"動詞","m":"可能にする"},{"w":"diverse","p":"形容詞","m":"多様な"}]},{"id":126,"category":"品詞問題・実戦問題 基本編","question":"Situated in the center of Budapest, Royal Sky Hotel is easily ______ to business travelers using public transport.","A":"access","B":"accesses","C":"accessible","D":"accessibility","answer":"C","answer_word":"accessible","explanation":"■ 文の骨格\nSituated in the center of Budapest, Royal Sky Hotel is easily ______ to business travelers using public transport.\n\n■ 空所に入るもの\nis の補語が欠けており、副詞 easily に修飾される形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) access … 名詞／動詞「接近／アクセスする」 ×\n(B) accesses … 動詞（三人称単数現在形）「アクセスする」 ×\n(C) accessible … 形容詞「行きやすい、利用しやすい」 ○\n(D) accessibility … 名詞「利用しやすさ」 ×\n\n■ 完成文\nSituated in the center of Budapest, Royal Sky Hotel is easily accessible to business travelers using public transport.\n（ブダペスト中心部に位置する Royal Sky ホテルは、公共交通機関を使う出張者にとって行きやすい。）\n\n■ 解き方のポイント\nbe accessible to X＝「Xが利用しやすい」。-ible は形容詞の目印。","words":[{"w":"Situated","p":"過去分詞","m":"位置している"},{"w":"accessible","p":"形容詞","m":"行きやすい"},{"w":"business travelers","p":"名詞","m":"出張者"},{"w":"public transport","p":"名詞","m":"公共交通機関"}]},{"id":127,"category":"品詞問題・実戦問題 基本編","question":"Please show ______ for other guests by refraining from conversing during the performance.","A":"consider","B":"considerate","C":"consideration","D":"considerably","answer":"C","answer_word":"consideration","explanation":"■ 文の骨格\nPlease show ______ for other guests by refraining from conversing during the performance.\n\n■ 空所に入るもの\n他動詞 show の目的語が欠けている。\n→ 空所には「show の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) consider … 動詞（原形）「考慮する」 ×\n(B) considerate … 形容詞「思いやりのある」 ×\n(C) consideration … 名詞「配慮、思いやり」 ○\n(D) considerably … 副詞「かなり」 ×\n\n■ 完成文\nPlease show consideration for other guests by refraining from conversing during the performance.\n（公演中は会話をお控えいただき、ほかのお客様へのご配慮をお願いします。）\n\n■ 解き方のポイント\nshow consideration for X＝「Xに配慮を示す」。他動詞の直後は名詞。","words":[{"w":"show","p":"動詞","m":"示す"},{"w":"consideration","p":"名詞","m":"配慮"},{"w":"refraining from","p":"熟語","m":"〜を控えること"},{"w":"conversing","p":"動名詞","m":"会話すること"}]},{"id":128,"category":"品詞問題・実戦問題 基本編","question":"Ms. Carter’s presentation included a ______ explanation of the hiring practices leading companies use to find suitable candidates.","A":"length","B":"lengthy","C":"lengthily","D":"lengthen","answer":"B","answer_word":"lengthy","explanation":"■ 文の骨格\nMs. Carter’s presentation included a ______ explanation of the hiring practices leading companies use to find suitable candidates.\n\n■ 空所に入るもの\n冠詞 a と名詞 explanation の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) length … 名詞「長さ」 ×\n(B) lengthy … 形容詞「長々とした」 ○\n(C) lengthily … 副詞「長々と」 ×\n(D) lengthen … 動詞（原形）「長くする」 ×\n\n■ 完成文\nMs. Carter’s presentation included a lengthy explanation of the hiring practices leading companies use to find suitable candidates.\n（Carter さんのプレゼンには、一流企業が適した候補者を見つけるために使う採用手法についての長い説明が含まれていた。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。-y も形容詞の語尾の1つ。","words":[{"w":"included","p":"動詞（過去形）","m":"含んでいた"},{"w":"lengthy","p":"形容詞","m":"長々とした"},{"w":"explanation","p":"名詞","m":"説明"},{"w":"hiring practices","p":"名詞","m":"採用手法"},{"w":"candidates","p":"名詞","m":"候補者"}]},{"id":129,"category":"品詞問題・実戦問題 基本編","question":"Sales figures from the Shinjuku, Shibuya, and Yokohama stores showed a ______ rise in the volume of winter clothing sold during September and October.","A":"notice","B":"noticing","C":"noticeable","D":"noticeably","answer":"C","answer_word":"noticeable","explanation":"■ 文の骨格\nSales figures from the Shinjuku, Shibuya, and Yokohama stores showed a ______ rise in the volume of winter clothing sold during September and October.\n\n■ 空所に入るもの\n冠詞 a と名詞 rise の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) notice … 名詞／動詞「通知／気づく」 ×\n(B) noticing … 現在分詞・動名詞「気づくこと」 ×\n(C) noticeable … 形容詞「著しい、目立つ」 ○\n(D) noticeably … 副詞「著しく」 ×\n\n■ 完成文\nSales figures from the Shinjuku, Shibuya, and Yokohama stores showed a noticeable rise in the volume of winter clothing sold during September and October.\n（新宿・渋谷・横浜の各店の売上高は、9月と10月の冬物衣料の販売量が著しく伸びたことを示した。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。-able は形容詞の目印。","words":[{"w":"Sales figures","p":"名詞","m":"売上高"},{"w":"noticeable","p":"形容詞","m":"著しい"},{"w":"rise","p":"名詞","m":"増加"},{"w":"volume","p":"名詞","m":"量"},{"w":"clothing","p":"名詞","m":"衣料"}]},{"id":130,"category":"品詞問題・実戦問題 基本編","question":"Mr. Ali ______ threw away the copies of his itinerary for his trip to Mumbai, so he had to have new ones printed.","A":"mistake","B":"mistakenly","C":"mistakes","D":"mistook","answer":"B","answer_word":"mistakenly","explanation":"■ 文の骨格\nMr. Ali ______ threw away the copies of his itinerary for his trip to Mumbai, so he had to have new ones printed.\n\n■ 空所に入るもの\n主語 Mr. Ali と述語動詞 threw の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) mistake … 名詞／動詞「間違い／間違える」 ×\n(B) mistakenly … 副詞「誤って」 ○\n(C) mistakes … 動詞（三人称単数現在形）／名詞（複数形）「間違える／間違い」 ×\n(D) mistook … 動詞（過去形）「間違えた」 ×\n\n■ 完成文\nMr. Ali mistakenly threw away the copies of his itinerary for his trip to Mumbai, so he had to have new ones printed.\n（Ali さんはムンバイ出張の旅程表のコピーを誤って捨ててしまったので、新しいものを印刷してもらわなければならなかった。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉は副詞の定位置。","words":[{"w":"mistakenly","p":"副詞","m":"誤って"},{"w":"threw away","p":"熟語","m":"捨てた"},{"w":"itinerary","p":"名詞","m":"旅程表"},{"w":"printed","p":"過去分詞","m":"印刷された"}]},{"id":131,"category":"品詞問題・実戦問題 基本編","question":"Repairs on Highway 12 are likely to cause ______ in the delivery of supplies to local restaurants.","A":"delays","B":"delayed","C":"to delay","D":"be delayed","answer":"A","answer_word":"delays","explanation":"■ 文の骨格\nRepairs on Highway 12 are likely to cause ______ in the delivery of supplies to local restaurants.\n\n■ 空所に入るもの\n他動詞 cause の目的語が欠けている。冠詞がないので複数形。\n→ 空所には「cause の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) delays … 名詞（複数形）「遅れ」 ○\n(B) delayed … 動詞の過去形・過去分詞「遅らせた」 ×\n(C) to delay … 不定詞「遅らせること」 ×\n(D) be delayed … 受動態の一部「遅らされる」 ×\n\n■ 完成文\nRepairs on Highway 12 are likely to cause delays in the delivery of supplies to local restaurants.\n（12号線の補修工事は、地元レストランへの物資配送に遅れを生じさせる可能性が高い。）\n\n■ 解き方のポイント\n他動詞の直後は名詞。冠詞がなければ複数形を選ぶ。","words":[{"w":"Repairs","p":"名詞","m":"補修工事"},{"w":"likely to","p":"熟語","m":"〜しそうだ"},{"w":"cause","p":"動詞","m":"引き起こす"},{"w":"delays","p":"名詞","m":"遅れ"},{"w":"supplies","p":"名詞","m":"物資"}]},{"id":132,"category":"品詞問題・実戦問題 基本編","question":"The ______ in the produce section of the Freshone Supermarket will feature exotic fruit from Australia.","A":"display","B":"displaying","C":"displayed","D":"displayable","answer":"A","answer_word":"display","explanation":"■ 文の骨格\nThe ______ in the produce section of the Freshone Supermarket will feature exotic fruit from Australia.\n\n■ 空所に入るもの\nThe の後ろで、述語動詞 will feature の主語となる名詞が必要。\n→ 空所には「文の主語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) display … 名詞「陳列、展示」 ○\n(B) displaying … 現在分詞・動名詞「陳列すること」 ×\n(C) displayed … 動詞の過去形・過去分詞「陳列された」 ×\n(D) displayable … 形容詞「表示できる」 ×\n\n■ 完成文\nThe display in the produce section of the Freshone Supermarket will feature exotic fruit from Australia.\n（Freshone スーパーの青果コーナーの陳列では、オーストラリア産の珍しい果物を目玉として扱う。）\n\n■ 解き方のポイント\n〈The＋空所＋前置詞句〉は主語となる名詞。","words":[{"w":"display","p":"名詞","m":"陳列"},{"w":"produce section","p":"名詞","m":"青果コーナー"},{"w":"feature","p":"動詞","m":"目玉として扱う"},{"w":"exotic","p":"形容詞","m":"珍しい、外来の"}]},{"id":133,"category":"品詞問題・実戦問題 応用編","question":"The company picnic will be held on a beach, but the weather ______ is predicting heavy rain.","A":"forecast","B":"forecasts","C":"will forecast","D":"to forecast","answer":"A","answer_word":"forecast","explanation":"■ 文の骨格\nThe company picnic will be held on a beach, but the weather ______ is predicting heavy rain.\n\n■ 空所に入るもの\n述語動詞 is predicting の主語となる単数名詞が必要。\n→ 空所には「weather と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) forecast … 名詞（単数形）「予報」 ○\n(B) forecasts … 名詞（複数形）／動詞「予報／予報する」 ×\n(C) will forecast … 未来形の動詞「予報するだろう」 ×\n(D) to forecast … 不定詞「予報すること」 ×\n\n■ 完成文\nThe company picnic will be held on a beach, but the weather forecast is predicting heavy rain.\n（会社のピクニックは浜辺で開かれる予定だが、天気予報は大雨を伝えている。）\n\n■ 解き方のポイント\nweather forecast（天気予報）は複合名詞。動詞 is に合わせて単数形を選ぶ。","words":[{"w":"company picnic","p":"名詞","m":"会社のピクニック"},{"w":"weather forecast","p":"名詞","m":"天気予報"},{"w":"predicting","p":"現在分詞","m":"予測している"},{"w":"heavy rain","p":"名詞","m":"大雨"}]},{"id":134,"category":"品詞問題・実戦問題 応用編","question":"The board conducted a second round of ______ with the four selected candidates for the position on Tuesday.","A":"interview","B":"interviews","C":"interviewed","D":"interviewer","answer":"B","answer_word":"interviews","explanation":"■ 文の骨格\nThe board conducted a second round of ______ with the four selected candidates for the position on Tuesday.\n\n■ 空所に入るもの\na second round of の後ろで、複数回行われるものを表す名詞が必要。\n→ 空所には「前置詞 of の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) interview … 名詞（単数形）「面接」 ×\n(B) interviews … 名詞（複数形）「面接」 ○\n(C) interviewed … 動詞の過去形・過去分詞「面接した」 ×\n(D) interviewer … 名詞「面接官」 ×\n\n■ 完成文\nThe board conducted a second round of interviews with the four selected candidates for the position on Tuesday.\n（取締役会は火曜日、その職に選ばれた4人の候補者と2回目の面接を実施した。）\n\n■ 解き方のポイント\na round of ＿＿ は複数回行われる行為なので複数名詞。","words":[{"w":"board","p":"名詞","m":"取締役会"},{"w":"conducted","p":"動詞（過去形）","m":"実施した"},{"w":"round","p":"名詞","m":"（一連の）回"},{"w":"interviews","p":"名詞","m":"面接"},{"w":"candidates","p":"名詞","m":"候補者"}]},{"id":135,"category":"品詞問題・実戦問題 応用編","question":"More than half of the respondents said television was more ______ than any other form of advertising.","A":"memory","B":"memorize","C":"memorable","D":"memorably","answer":"C","answer_word":"memorable","explanation":"■ 文の骨格\nMore than half of the respondents said television was more ______ than any other form of advertising.\n\n■ 空所に入るもの\nmore ... than の形で比較級をつくる補語の形容詞が必要。\n→ 空所には「was の補語になる形容詞（比較級）」が必要です。\n\n■ 選択肢の確認\n(A) memory … 名詞「記憶」 ×\n(B) memorize … 動詞（原形）「暗記する」 ×\n(C) memorable … 形容詞「印象に残る」 ○\n(D) memorably … 副詞「印象的に」 ×\n\n■ 完成文\nMore than half of the respondents said television was more memorable than any other form of advertising.\n（回答者の半数以上が、テレビはほかのどの広告形態よりも印象に残ると答えた。）\n\n■ 解き方のポイント\nmore ＿＿ than の空所は、be動詞の補語なら形容詞、動詞修飾なら副詞。ここは was の補語。","words":[{"w":"respondents","p":"名詞","m":"回答者"},{"w":"memorable","p":"形容詞","m":"印象に残る"},{"w":"form","p":"名詞","m":"形態"},{"w":"advertising","p":"名詞","m":"広告"}]},{"id":136,"category":"品詞問題・実戦問題 応用編","question":"All students who wish to be considered for financial aid for the fall semester should file their ______ by May 30.","A":"applications","B":"applicants","C":"applicability","D":"applies","answer":"A","answer_word":"applications","explanation":"■ 文の骨格\nAll students who wish to be considered for financial aid for the fall semester should file their ______ by May 30.\n\n■ 空所に入るもの\n所有格 their の後ろで、他動詞 file の目的語となる名詞が必要。\n→ 空所には「file の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) applications … 名詞（複数形）「申請書」 ○\n(B) applicants … 名詞（複数形）「応募者」 ×\n(C) applicability … 名詞「適用可能性」 ×\n(D) applies … 動詞（三人称単数現在形）「応募する」 ×\n\n■ 完成文\nAll students who wish to be considered for financial aid for the fall semester should file their applications by May 30.\n（秋学期の奨学金の審査を希望する学生は全員、5月30日までに申請書を提出すること。）\n\n■ 解き方のポイント\napplication（申請書）と applicant（応募者）の違いに注意。「提出する」のは書類。","words":[{"w":"financial aid","p":"名詞","m":"奨学金、学資援助"},{"w":"fall semester","p":"名詞","m":"秋学期"},{"w":"file","p":"動詞","m":"提出する"},{"w":"applications","p":"名詞","m":"申請書"}]},{"id":137,"category":"品詞問題・実戦問題 応用編","question":"Texas Carbide is looking for three marketing professionals who have work experience in the textile ______.","A":"industry","B":"industrialize","C":"industrial","D":"industrialist","answer":"A","answer_word":"industry","explanation":"■ 文の骨格\nTexas Carbide is looking for three marketing professionals who have work experience in the textile ______.\n\n■ 空所に入るもの\n前置詞 in の目的語で、the textile に続く名詞が必要。\n→ 空所には「textile と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) industry … 名詞「産業、業界」 ○\n(B) industrialize … 動詞（原形）「工業化する」 ×\n(C) industrial … 形容詞「産業の」 ×\n(D) industrialist … 名詞「実業家」 ×\n\n■ 完成文\nTexas Carbide is looking for three marketing professionals who have work experience in the textile industry.\n（Texas Carbide 社は、繊維業界での実務経験があるマーケティング専門職を3名募集している。）\n\n■ 解き方のポイント\ntextile industry（繊維産業）は複合名詞。文末の空所は名詞であることが多い。","words":[{"w":"looking for","p":"熟語","m":"探している"},{"w":"professionals","p":"名詞","m":"専門職"},{"w":"work experience","p":"名詞","m":"実務経験"},{"w":"textile industry","p":"名詞","m":"繊維産業"}]},{"id":138,"category":"品詞問題・実戦問題 応用編","question":"The company performed well this year and ______ surpassed last year's profits.","A":"neared","B":"nearly","C":"nearest","D":"nearness","answer":"B","answer_word":"nearly","explanation":"■ 文の骨格\nThe company performed well this year and ______ surpassed last year's profits.\n\n■ 空所に入るもの\nand の後ろの述語動詞 surpassed を修飾する位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) neared … 動詞の過去形・過去分詞「近づいた」 ×\n(B) nearly … 副詞「ほぼ、〜近く」 ○\n(C) nearest … 最上級「最も近い」 ×\n(D) nearness … 名詞「近さ」 ×\n\n■ 完成文\nThe company performed well this year and nearly surpassed last year's profits.\n（同社は今年好調で、昨年の利益をほぼ上回った。）\n\n■ 解き方のポイント\n動詞の直前の空所は副詞。","words":[{"w":"performed well","p":"熟語","m":"好調だった"},{"w":"nearly","p":"副詞","m":"ほぼ"},{"w":"surpassed","p":"動詞（過去形）","m":"上回った"},{"w":"profits","p":"名詞","m":"利益"}]},{"id":139,"category":"品詞問題・実戦問題 応用編","question":"After the six-month probationary period, new employees may be eligible for an ______ in salary.","A":"increase","B":"increasing","C":"increasingly","D":"increased","answer":"A","answer_word":"increase","explanation":"■ 文の骨格\nAfter the six-month probationary period, new employees may be eligible for an ______ in salary.\n\n■ 空所に入るもの\n前置詞 for の目的語で、冠詞 an に続く単数名詞が必要。\n→ 空所には「冠詞 an の後ろに置く名詞」が必要です。\n\n■ 選択肢の確認\n(A) increase … 名詞「昇給、増加」 ○\n(B) increasing … 現在分詞・動名詞「増加している」 ×\n(C) increasingly … 副詞「ますます」 ×\n(D) increased … 動詞の過去形・過去分詞「増加した」 ×\n\n■ 完成文\nAfter the six-month probationary period, new employees may be eligible for an increase in salary.\n（6カ月の試用期間を終えると、新入社員は昇給の対象となる場合がある。）\n\n■ 解き方のポイント\nan increase in X＝「Xの増加」。冠詞の直後は名詞。","words":[{"w":"probationary period","p":"名詞","m":"試用期間"},{"w":"eligible for","p":"熟語","m":"〜の資格がある"},{"w":"increase","p":"名詞","m":"増加、昇給"},{"w":"salary","p":"名詞","m":"給与"}]},{"id":140,"category":"品詞問題・実戦問題 応用編","question":"It took several days for the managers to decide on which applicant was the most ______ for the position.","A":"qualify","B":"qualified","C":"qualification","D":"qualifies","answer":"B","answer_word":"qualified","explanation":"■ 文の骨格\nIt took several days for the managers to decide on which applicant was the most ______ for the position.\n\n■ 空所に入るもの\nthe most とともに最上級をつくる補語の形容詞が必要。\n→ 空所には「was の補語になる形容詞（最上級）」が必要です。\n\n■ 選択肢の確認\n(A) qualify … 動詞（原形）「資格を与える」 ×\n(B) qualified … 形容詞（過去分詞由来）「適任の、資格のある」 ○\n(C) qualification … 名詞「資格」 ×\n(D) qualifies … 動詞（三人称単数現在形）「資格を与える」 ×\n\n■ 完成文\nIt took several days for the managers to decide on which applicant was the most qualified for the position.\n（管理職たちは、どの応募者がその職に最も適任かを判断するのに数日を要した。）\n\n■ 解き方のポイント\nthe most ＿＿ が補語なら形容詞。qualified は過去分詞から形容詞化した語。","words":[{"w":"applicant","p":"名詞","m":"応募者"},{"w":"qualified","p":"形容詞","m":"適任の"},{"w":"position","p":"名詞","m":"職、ポスト"}]},{"id":141,"category":"品詞問題・実戦問題 応用編","question":"In December, toy stores usually receive lots of shipments and prices remain ______ until a
