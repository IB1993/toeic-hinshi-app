ption of a few pavilions, all are slated for removal or demolition ______ the trade show closes on October 31.","A":"after","B":"either","C":"due to","D":"during","answer":"A","answer_word":"after","explanation":"■ 文の骨格\nWith the exception of a few pavilions, all are slated for removal or demolition ______ the trade show closes on October 31.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、時の前後関係を表す接続詞が必要。\n→ 空所には「時を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) after … 接続詞「〜したあとで」 ○\n(B) either … 相関語「どちらか」 ×\n(C) due to … 群前置詞「〜のため」 ×\n(D) during … 前置詞「〜の間」 ×\n\n■ 完成文\nWith the exception of a few pavilions, all are slated for removal or demolition after the trade show closes on October 31.\n（いくつかのパビリオンを除き、10月31日に展示会が閉幕したあと、すべて撤去または取り壊しが予定されている。）\n\n■ 解き方のポイント\nafter は接続詞・前置詞の両方で使える。ここは後ろが節なので接続詞。","words":[{"w":"exception","p":"名詞","m":"例外"},{"w":"pavilions","p":"名詞","m":"パビリオン"},{"w":"slated for","p":"熟語","m":"〜が予定されている"},{"w":"demolition","p":"名詞","m":"取り壊し"}]},{"id":445,"category":"前置詞or接続詞問題・実戦問題","question":"Smile Cable Television offers a variety of movie channels ______ local news and sports.","A":"always","B":"in case of","C":"in addition to","D":"next","answer":"C","answer_word":"in addition to","explanation":"■ 文の骨格\nSmile Cable Television offers a variety of movie channels ______ local news and sports.\n\n■ 空所に入るもの\n空所の後ろが名詞句 local news and sports なので、前置詞が必要。\n→ 空所には「名詞句を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) always … 副詞「いつも」 ×\n(B) in case of … 群前置詞「〜の場合には」 ×\n(C) in addition to … 群前置詞「〜に加えて」 ○\n(D) next … 副詞「次に」 ×\n\n■ 完成文\nSmile Cable Television offers a variety of movie channels in addition to local news and sports.\n（Smile ケーブルテレビは、地元ニュースとスポーツに加えて、多彩な映画チャンネルを提供している。）\n\n■ 解き方のポイント\nin addition to の to は前置詞。後ろは名詞か動名詞。","words":[{"w":"offers","p":"動詞","m":"提供する"},{"w":"a variety of","p":"熟語","m":"多彩な"},{"w":"channels","p":"名詞","m":"チャンネル"}]},{"id":446,"category":"前置詞or接続詞問題・実戦問題","question":"Payroll procedure changed ______ the company merged with Olsson Corporation in July.","A":"when","B":"soon","C":"without","D":"between","answer":"A","answer_word":"when","explanation":"■ 文の骨格\nPayroll procedure changed ______ the company merged with Olsson Corporation in July.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、出来事の時点を表す接続詞が必要。\n→ 空所には「時を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) when … 接続詞「〜したとき」 ○\n(B) soon … 副詞「すぐに」 ×\n(C) without … 前置詞「〜なしに」 ×\n(D) between … 前置詞「〜の間に」 ×\n\n■ 完成文\nPayroll procedure changed when the company merged with Olsson Corporation in July.\n（7月に会社が Olsson 社と合併したとき、給与支払いの手続きが変更された。）\n\n■ 解き方のポイント\n後ろに〈主語＋動詞〉があれば接続詞しか入らない。","words":[{"w":"Payroll","p":"名詞","m":"給与支払い"},{"w":"procedure","p":"名詞","m":"手続き"},{"w":"merged with","p":"熟語","m":"〜と合併した"}]},{"id":447,"category":"前置詞or接続詞問題・実戦問題","question":"Swallow Airways Flight 990 arrived at HwangBo International Airport on time ______ the adverse weather conditions.","A":"because","B":"even though","C":"now that","D":"despite","answer":"D","answer_word":"despite","explanation":"■ 文の骨格\nSwallow Airways Flight 990 arrived at HwangBo International Airport on time ______ the adverse weather conditions.\n\n■ 空所に入るもの\n空所の後ろが名詞句 the adverse weather conditions なので、前置詞が必要。\n→ 空所には「名詞句を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) because … 接続詞「〜なので」 ×\n(B) even though … 接続詞（群）「〜だけれども」 ×\n(C) now that … 接続詞（群）「今や〜なので」 ×\n(D) despite … 前置詞「〜にもかかわらず」 ○\n\n■ 完成文\nSwallow Airways Flight 990 arrived at HwangBo International Airport on time despite the adverse weather conditions.\n（Swallow 航空990便は、悪天候にもかかわらず定刻どおり HwangBo 国際空港に到着した。）\n\n■ 解き方のポイント\ndespite＋名詞／even though＋節。後ろの形で選ぶのが鉄則。","words":[{"w":"Flight","p":"名詞","m":"便"},{"w":"on time","p":"熟語","m":"定刻どおりに"},{"w":"adverse","p":"形容詞","m":"悪い、不利な"},{"w":"weather conditions","p":"名詞","m":"気象条件"}]},{"id":448,"category":"前置詞or接続詞問題・実戦問題","question":"The workshop is expected to be well attended ______ we recommend that you make reservations in advance.","A":"for","B":"or","C":"so","D":"either","answer":"C","answer_word":"so","explanation":"■ 文の骨格\nThe workshop is expected to be well attended ______ we recommend that you make reservations in advance.\n\n■ 空所に入るもの\n前が理由、後ろがそれに基づく勧めなので、結果を表す接続詞が必要。\n→ 空所には「結果を表す等位接続詞」が必要です。\n\n■ 選択肢の確認\n(A) for … 前置詞・接続詞「〜のために」 ×\n(B) or … 等位接続詞「または」 ×\n(C) so … 等位接続詞「だから」 ○\n(D) either … 相関語「どちらか」 ×\n\n■ 完成文\nThe workshop is expected to be well attended so we recommend that you make reservations in advance.\n（そのワークショップは参加者が多いと見込まれるので、事前のご予約をお勧めします。）\n\n■ 解き方のポイント\n〈原因 so 結果〉。for も理由を表すが〈結果 for 原因〉の順になる。","words":[{"w":"expected","p":"動詞（過去分詞）","m":"見込まれる"},{"w":"well attended","p":"形容詞句","m":"参加者が多い"},{"w":"reservations","p":"名詞","m":"予約"},{"w":"in advance","p":"熟語","m":"事前に"}]},{"id":449,"category":"前置詞or接続詞問題・実戦問題","question":"It is a good idea to limit your cover letter to a single page ______ that is not specifically indicated in the job advertisement.","A":"even if","B":"as though","C":"rather than","D":"so that","answer":"A","answer_word":"even if","explanation":"■ 文の骨格\nIt is a good idea to limit your cover letter to a single page ______ that is not specifically indicated in the job advertisement.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、「たとえ〜でも」という譲歩の条件を表す接続詞が必要。\n→ 空所には「譲歩の条件を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) even if … 接続詞（群）「たとえ〜でも」 ○\n(B) as though … 接続詞（群）「まるで〜のように」 ×\n(C) rather than … 群前置詞「〜よりむしろ」 ×\n(D) so that … 接続詞（群）「〜するために」 ×\n\n■ 完成文\nIt is a good idea to limit your cover letter to a single page even if that is not specifically indicated in the job advertisement.\n（求人広告に具体的な指定がなくても、カバーレターは1ページに収めるのがよい。）\n\n■ 解き方のポイント\neven if（たとえ〜でも／仮定）と even though（〜だけれども／事実）の違いに注意。","words":[{"w":"limit","p":"動詞","m":"制限する"},{"w":"cover letter","p":"名詞","m":"カバーレター、添え状"},{"w":"specifically","p":"副詞","m":"具体的に"},{"w":"job advertisement","p":"名詞","m":"求人広告"}]},{"id":450,"category":"前置詞or接続詞問題・実戦問題","question":"______ sales have been rising, Western Chemicals has been struggling to maintain a profit.","A":"If not","B":"Such as","C":"Even though","D":"In case","answer":"C","answer_word":"Even though","explanation":"■ 文の骨格\n______ sales have been rising, Western Chemicals has been struggling to maintain a profit.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、前後が対立する内容になっている。\n→ 空所には「譲歩を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) If not … 副詞句「そうでなければ」 ×\n(B) Such as … 群前置詞「〜のような」 ×\n(C) Even though … 接続詞（群）「〜だけれども」 ○\n(D) In case … 接続詞（群）「〜の場合に備えて」 ×\n\n■ 完成文\nEven though sales have been rising, Western Chemicals has been struggling to maintain a profit.\n（売上は伸びているものの、Western Chemicals 社は利益の確保に苦戦している。）\n\n■ 解き方のポイント\n後ろが節なので接続詞。売上増と苦戦という対立関係から譲歩を選ぶ。","words":[{"w":"sales","p":"名詞","m":"売上"},{"w":"rising","p":"現在分詞","m":"伸びている"},{"w":"struggling","p":"現在分詞","m":"苦戦している"},{"w":"profit","p":"名詞","m":"利益"}]},{"id":451,"category":"前置詞or接続詞問題・実戦問題","question":"Mr. Ikeda had no time to purchase gifts for coworkers ______ his stay in Tokyo.","A":"when","B":"also","C":"during","D":"while","answer":"C","answer_word":"during","explanation":"■ 文の骨格\nMr. Ikeda had no time to purchase gifts for coworkers ______ his stay in Tokyo.\n\n■ 空所に入るもの\n空所の後ろが名詞句 his stay in Tokyo なので、前置詞が必要。\n→ 空所には「名詞句を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) when … 接続詞「〜のとき」 ×\n(B) also … 副詞「〜もまた」 ×\n(C) during … 前置詞「〜の間」 ○\n(D) while … 接続詞「〜する間」 ×\n\n■ 完成文\nMr. Ikeda had no time to purchase gifts for coworkers during his stay in Tokyo.\n（Ikeda さんは東京滞在中、同僚への土産を買う時間がなかった。）\n\n■ 解き方のポイント\nduring＋名詞／while＋節。この対比はTOEIC最頻出。","words":[{"w":"purchase","p":"動詞","m":"買う"},{"w":"gifts","p":"名詞","m":"土産、贈り物"},{"w":"coworkers","p":"名詞","m":"同僚"},{"w":"stay","p":"名詞","m":"滞在"}]},{"id":452,"category":"前置詞or接続詞問題・実戦問題","question":"Eastbound Highway 66 was shut down Monday morning ______ icy road conditions.","A":"while","B":"in order to","C":"now that","D":"due to","answer":"D","answer_word":"due to","explanation":"■ 文の骨格\nEastbound Highway 66 was shut down Monday morning ______ icy road conditions.\n\n■ 空所に入るもの\n空所の後ろが名詞句 icy road conditions なので、前置詞が必要。\n→ 空所には「名詞句を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) while … 接続詞「〜する間」 ×\n(B) in order to … 群不定詞「〜するために」 ×\n(C) now that … 接続詞（群）「今や〜なので」 ×\n(D) due to … 群前置詞「〜のため」 ○\n\n■ 完成文\nEastbound Highway 66 was shut down Monday morning due to icy road conditions.\n（東行きの66号線は、路面凍結のため月曜の朝に閉鎖された。）\n\n■ 解き方のポイント\ndue to／because of＋名詞、because＋節。","words":[{"w":"Eastbound","p":"形容詞","m":"東行きの"},{"w":"shut down","p":"熟語","m":"閉鎖された"},{"w":"icy","p":"形容詞","m":"凍結した"},{"w":"road conditions","p":"名詞","m":"路面状態"}]},{"id":453,"category":"前置詞or接続詞問題・実戦問題","question":"Under the new recycling regulations, manufacturers are required to accept old equipment for disposal ______ a customer is purchasing a new item.","A":"if","B":"likewise","C":"nevertheless","D":"besides","answer":"A","answer_word":"if","explanation":"■ 文の骨格\nUnder the new recycling regulations, manufacturers are required to accept old equipment for disposal ______ a customer is purchasing a new item.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、条件を表す接続詞が文意に合う。\n→ 空所には「条件を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) if … 接続詞「もし〜なら」 ○\n(B) likewise … 副詞「同様に」 ×\n(C) nevertheless … 副詞「それにもかかわらず」 ×\n(D) besides … 副詞「そのうえ」 ×\n\n■ 完成文\nUnder the new recycling regulations, manufacturers are required to accept old equipment for disposal if a customer is purchasing a new item.\n（新しいリサイクル規制では、顧客が新品を購入する場合、製造業者は古い機器を処分のために引き取ることが求められる。）\n\n■ 解き方のポイント\n選択肢に副詞が並ぶときは、節をつなげるかどうかで絞り込む。","words":[{"w":"regulations","p":"名詞","m":"規制"},{"w":"manufacturers","p":"名詞","m":"製造業者"},{"w":"equipment","p":"名詞","m":"機器"},{"w":"disposal","p":"名詞","m":"処分"}]},{"id":454,"category":"前置詞or接続詞問題・実戦問題","question":"______ a short rainy period from March to May, the climate in Red Desert is mostly hot and dry.","A":"Although","B":"However","C":"Except for","D":"Even if","answer":"C","answer_word":"Except for","explanation":"■ 文の骨格\n______ a short rainy period from March to May, the climate in Red Desert is mostly hot and dry.\n\n■ 空所に入るもの\n空所の後ろが名詞句 a short rainy period なので、前置詞が必要。\n→ 空所には「名詞句を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) Although … 接続詞「〜だけれども」 ×\n(B) However … 副詞「しかしながら」 ×\n(C) Except for … 群前置詞「〜を除いて」 ○\n(D) Even if … 接続詞（群）「たとえ〜でも」 ×\n\n■ 完成文\nExcept for a short rainy period from March to May, the climate in Red Desert is mostly hot and dry.\n（3月から5月までの短い雨季を除けば、Red Desert の気候はおおむね高温で乾燥している。）\n\n■ 解き方のポイント\n後ろが名詞なら前置詞。例外を表すのは except for。","words":[{"w":"rainy period","p":"名詞","m":"雨季"},{"w":"climate","p":"名詞","m":"気候"},{"w":"mostly","p":"副詞","m":"おおむね"},{"w":"dry","p":"形容詞","m":"乾燥した"}]},{"id":455,"category":"前置詞or接続詞問題・実戦問題","question":"______ track work for street railways is taking longer than expected, temporary bus services will be available until the work is complete.","A":"Because","B":"During","C":"Should","D":"Where","answer":"A","answer_word":"Because","explanation":"■ 文の骨格\n______ track work for street railways is taking longer than expected, temporary bus services will be available until the work is complete.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、後半の理由を表す接続詞が必要。\n→ 空所には「理由を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) Because … 接続詞「〜なので」 ○\n(B) During … 前置詞「〜の間」 ×\n(C) Should … 助動詞（倒置）「万一〜なら」 ×\n(D) Where … 接続詞「〜する場所で」 ×\n\n■ 完成文\nBecause track work for street railways is taking longer than expected, temporary bus services will be available until the work is complete.\n（路面電車の線路工事が予想より長引いているため、工事完了まで臨時のバス運行が利用できる。）\n\n■ 解き方のポイント\n理由を表すのは because（接続詞）。前置詞の during とは後ろの形で区別する。","words":[{"w":"track work","p":"名詞","m":"線路工事"},{"w":"street railways","p":"名詞","m":"路面電車"},{"w":"temporary","p":"形容詞","m":"臨時の"},{"w":"complete","p":"形容詞","m":"完了した"}]},{"id":456,"category":"前置詞or接続詞問題・実戦問題","question":"______ she can spend more time with her family, Emily Gomez decided to change her job.","A":"Apart from","B":"So that","C":"Because of","D":"Rather than","answer":"B","answer_word":"So that","explanation":"■ 文の骨格\n______ she can spend more time with her family, Emily Gomez decided to change her job.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋助動詞＋動詞〉で、目的を表す接続詞が文意に合う。\n→ 空所には「目的を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) Apart from … 群前置詞「〜は別として」 ×\n(B) So that … 接続詞（群）「〜するために」 ○\n(C) Because of … 群前置詞「〜のために（理由）」 ×\n(D) Rather than … 群前置詞「〜よりむしろ」 ×\n\n■ 完成文\nSo that she can spend more time with her family, Emily Gomez decided to change her job.\n（家族ともっと時間を過ごせるように、Emily Gomez は転職することにした。）\n\n■ 解き方のポイント\nso that S can V＝「SがVできるように」。目的を表す定型。","words":[{"w":"spend","p":"動詞","m":"過ごす"},{"w":"family","p":"名詞","m":"家族"},{"w":"decided","p":"動詞（過去形）","m":"決めた"},{"w":"change her job","p":"熟語","m":"転職する"}]},{"id":457,"category":"前置詞or接続詞問題・実戦問題","question":"Purchases of over $100 should not be made ______ authorization from department heads.","A":"even","B":"despite","C":"unless","D":"without","answer":"D","answer_word":"without","explanation":"■ 文の骨格\nPurchases of over $100 should not be made ______ authorization from department heads.\n\n■ 空所に入るもの\n空所の後ろが名詞 authorization なので、前置詞が必要。\n→ 空所には「名詞句を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) even … 副詞「〜さえ」 ×\n(B) despite … 前置詞「〜にもかかわらず」 ×\n(C) unless … 接続詞「〜でない限り」 ×\n(D) without … 前置詞「〜なしに」 ○\n\n■ 完成文\nPurchases of over $100 should not be made without authorization from department heads.\n（100ドルを超える購入は、部門長の承認なしに行ってはならない。）\n\n■ 解き方のポイント\n後ろが名詞なら前置詞。unless は接続詞なので節が必要。","words":[{"w":"Purchases","p":"名詞","m":"購入"},{"w":"authorization","p":"名詞","m":"承認"},{"w":"department heads","p":"名詞","m":"部門長"}]},{"id":458,"category":"前置詞or接続詞問題・実戦問題","question":"In the first quarter, the company managed to expand its market share slightly ______ its closest competitor suffered a major drop in sales.","A":"throughout","B":"whereas","C":"that","D":"despite","answer":"B","answer_word":"whereas","explanation":"■ 文の骨格\nIn the first quarter, the company managed to expand its market share slightly ______ its closest competitor suffered a major drop in sales.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、前後が対照的な内容になっている。\n→ 空所には「対比を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) throughout … 前置詞「〜の間じゅう」 ×\n(B) whereas … 接続詞「〜する一方で」 ○\n(C) that … 接続詞「〜ということ」 ×\n(D) despite … 前置詞「〜にもかかわらず」 ×\n\n■ 完成文\nIn the first quarter, the company managed to expand its market share slightly whereas its closest competitor suffered a major drop in sales.\n（第1四半期、最大の競合が売上を大きく落とした一方で、同社は市場シェアをわずかに拡大できた。）\n\n■ 解き方のポイント\nwhereas＝while（対比）。後ろが節なので前置詞は不可。","words":[{"w":"quarter","p":"名詞","m":"四半期"},{"w":"market share","p":"名詞","m":"市場シェア"},{"w":"competitor","p":"名詞","m":"競合"},{"w":"suffered","p":"動詞（過去形）","m":"被った"}]},{"id":459,"category":"前置詞or接続詞問題・実戦問題","question":"Mr. Morozov will complete the expense report and submit it to the accounting office ______ he returns from Shanghai.","A":"among","B":"beside","C":"after","D":"within","answer":"C","answer_word":"after","explanation":"■ 文の骨格\nMr. Morozov will complete the expense report and submit it to the accounting office ______ he returns from Shanghai.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、時の前後関係を表す接続詞が必要。\n→ 空所には「時を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) among … 前置詞「〜の中で（3つ以上）」 ×\n(B) beside … 前置詞「〜のそばに」 ×\n(C) after … 接続詞「〜したあとで」 ○\n(D) within … 前置詞「〜以内に」 ×\n\n■ 完成文\nMr. Morozov will complete the expense report and submit it to the accounting office after he returns from Shanghai.\n（Morozov さんは上海から戻ったあと、経費報告書を完成させて経理部に提出する。）\n\n■ 解き方のポイント\n時・条件を表す副詞節では、未来のことも現在形（returns）で表す。","words":[{"w":"expense report","p":"名詞","m":"経費報告書"},{"w":"submit","p":"動詞","m":"提出する"},{"w":"accounting office","p":"名詞","m":"経理部"},{"w":"returns","p":"動詞","m":"戻る"}]},{"id":460,"category":"前置詞or接続詞問題・実戦問題","question":"Highland Road has been closed for a week ______ repairs being made to the bridge over Douglas Creek.","A":"since","B":"even though","C":"while","D":"because of","answer":"D","answer_word":"because of","explanation":"■ 文の骨格\nHighland Road has been closed for a week ______ repairs being made to the bridge over Douglas Creek.\n\n■ 空所に入るもの\n空所の後ろが名詞句 repairs being made ... なので、前置詞が必要。\n→ 空所には「名詞句を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) since … 前置詞・接続詞「〜以来」 ×\n(B) even though … 接続詞（群）「〜だけれども」 ×\n(C) while … 接続詞「〜する間」 ×\n(D) because of … 群前置詞「〜のため」 ○\n\n■ 完成文\nHighland Road has been closed for a week because of repairs being made to the bridge over Douglas Creek.\n（Highland 通りは、Douglas 川にかかる橋の補修工事のため1週間閉鎖されている。）\n\n■ 解き方のポイント\nbecause of＋名詞／because＋節。後ろに動詞がなければ前置詞。","words":[{"w":"closed","p":"動詞（過去分詞）","m":"閉鎖された"},{"w":"repairs","p":"名詞","m":"補修工事"},{"w":"bridge","p":"名詞","m":"橋"},{"w":"Creek","p":"名詞","m":"小川"}]},{"id":461,"category":"前置詞or接続詞問題・実戦問題","question":"Pearl Online will request information such as name, billing address, and credit card number ______ that we can process and fill your order.","A":"so","B":"even","C":"until","D":"also","answer":"A","answer_word":"so","explanation":"■ 文の骨格\nPearl Online will request information such as name, billing address, and credit card number ______ that we can process and fill your order.\n\n■ 空所に入るもの\n直後の that と結びついて so that（〜するために）という接続詞をつくる。\n→ 空所には「目的を表す接続詞の一部」が必要です。\n\n■ 選択肢の確認\n(A) so … 接続詞（群の一部）「〜するために」 ○\n(B) even … 副詞「〜さえ」 ×\n(C) until … 接続詞・前置詞「〜まで」 ×\n(D) also … 副詞「〜もまた」 ×\n\n■ 完成文\nPearl Online will request information such as name, billing address, and credit card number so that we can process and fill your order.\n（Pearl Online 社は、ご注文を処理し発送できるよう、氏名・請求先住所・クレジットカード番号などの情報を求めます。）\n\n■ 解き方のポイント\nso that S can V＝目的。that の直前に入る語を問う形もよく出る。","words":[{"w":"request","p":"動詞","m":"求める"},{"w":"billing address","p":"名詞","m":"請求先住所"},{"w":"process","p":"動詞","m":"処理する"},{"w":"fill your order","p":"熟語","m":"注文に応じる"}]},{"id":462,"category":"前置詞or接続詞問題・実戦問題","question":"______ all technical issues associated with the new product have been resolved, the marketing plan will be finalized.","A":"Rather","B":"Once","C":"Moreover","D":"Meanwhile","answer":"B","answer_word":"Once","explanation":"■ 文の骨格\n______ all technical issues associated with the new product have been resolved, the marketing plan will be finalized.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、「いったん〜すれば」という時の条件を表す接続詞が必要。\n→ 空所には「時を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) Rather … 副詞「むしろ」 ×\n(B) Once … 接続詞「いったん〜すれば」 ○\n(C) Moreover … 副詞「さらに」 ×\n(D) Meanwhile … 副詞「その間に」 ×\n\n■ 完成文\nOnce all technical issues associated with the new product have been resolved, the marketing plan will be finalized.\n（新製品に関わる技術的な問題がすべて解決され次第、マーケティング計画が最終決定される。）\n\n■ 解き方のポイント\nOnce は接続詞で「いったん〜すれば」。副詞の選択肢は節をつなげない。","words":[{"w":"technical issues","p":"名詞","m":"技術的な問題"},{"w":"associated with","p":"熟語","m":"〜に関わる"},{"w":"resolved","p":"動詞（過去分詞）","m":"解決された"},{"w":"finalized","p":"動詞（過去分詞）","m":"最終決定される"}]},{"id":463,"category":"前置詞or接続詞問題・実戦問題","question":"In the hotel lobby, there are many exhibits that participants can visit ______ attending the conference.","A":"then","B":"while","C":"because","D":"near","answer":"B","answer_word":"while","explanation":"■ 文の骨格\nIn the hotel lobby, there are many exhibits that participants can visit ______ attending the conference.\n\n■ 空所に入るもの\nwhile (they are) attending のように〈主語＋be動詞〉を省略できる接続詞が必要。\n→ 空所には「分詞を伴える接続詞」が必要です。\n\n■ 選択肢の確認\n(A) then … 副詞「そのとき」 ×\n(B) while … 接続詞「〜している間」 ○\n(C) because … 接続詞「〜なので」 ×\n(D) near … 前置詞「〜の近くに」 ×\n\n■ 完成文\nIn the hotel lobby, there are many exhibits that participants can visit while attending the conference.\n（ホテルのロビーには、参加者が会議に出席している間に見て回れる展示がたくさんある。）\n\n■ 解き方のポイント\nwhile doing の形は〈主語＋be動詞〉の省略。because は省略できない。","words":[{"w":"lobby","p":"名詞","m":"ロビー"},{"w":"exhibits","p":"名詞","m":"展示"},{"w":"participants","p":"名詞","m":"参加者"},{"w":"attending","p":"現在分詞","m":"出席している"}]},{"id":464,"category":"前置詞or接続詞問題・実戦問題","question":"The company has agreed to remedy the construction errors ______ of the cost.","A":"despite","B":"even though","C":"regardless","D":"now that","answer":"C","answer_word":"regardless","explanation":"■ 文の骨格\nThe company has agreed to remedy the construction errors ______ of the cost.\n\n■ 空所に入るもの\n直後の of と結びついて regardless of（〜に関係なく）という群前置詞をつくる。\n→ 空所には「of と結びついて群前置詞をつくる語」が必要です。\n\n■ 選択肢の確認\n(A) despite … 前置詞「〜にもかかわらず」 ×\n(B) even though … 接続詞（群）「〜だけれども」 ×\n(C) regardless … 副詞（群前置詞の一部）「〜に関係なく」 ○\n(D) now that … 接続詞（群）「今や〜なので」 ×\n\n■ 完成文\nThe company has agreed to remedy the construction errors regardless of the cost.\n（その企業は、費用に関係なく施工ミスを修正することに同意した。）\n\n■ 解き方のポイント\nregardless of＝「〜に関係なく」。of とセットで覚える。","words":[{"w":"agreed","p":"動詞（過去分詞）","m":"同意した"},{"w":"remedy","p":"動詞","m":"修正する"},{"w":"construction errors","p":"名詞","m":"施工ミス"},{"w":"cost","p":"名詞","m":"費用"}]},{"id":465,"category":"前置詞or接続詞問題・実戦問題","question":"______ Mr. Yaguchi retired ten years ago, companies still request his assistance in an advisory role.","A":"Although","B":"Once","C":"Despite","D":"Until","answer":"A","answer_word":"Although","explanation":"■ 文の骨格\n______ Mr. Yaguchi retired ten years ago, companies still request his assistance in an advisory role.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、前後が対立する内容になっている。\n→ 空所には「譲歩を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) Although … 接続詞「〜だけれども」 ○\n(B) Once … 接続詞「いったん〜すれば」 ×\n(C) Despite … 前置詞「〜にもかかわらず」 ×\n(D) Until … 接続詞・前置詞「〜まで」 ×\n\n■ 完成文\nAlthough Mr. Yaguchi retired ten years ago, companies still request his assistance in an advisory role.\n（Yaguchi さんは10年前に退職したが、企業は今も顧問として彼の助力を求めている。）\n\n■ 解き方のポイント\nAlthough＋節／Despite＋名詞。後ろの形が決め手。","words":[{"w":"retired","p":"動詞（過去形）","m":"退職した"},{"w":"request","p":"動詞","m":"求める"},{"w":"assistance","p":"名詞","m":"助力"},{"w":"advisory role","p":"名詞","m":"顧問の役割"}]},{"id":466,"category":"前置詞or接続詞問題・実戦問題","question":"Everyone in the finance division ______ staff members working on special projects is expected to attend the meeting tomorrow afternoon.","A":"apart","B":"even though","C":"also","D":"except for","answer":"D","answer_word":"except for","explanation":"■ 文の骨格\nEveryone in the finance division ______ staff members working on special projects is expected to attend the meeting tomorrow afternoon.\n\n■ 空所に入るもの\n空所の後ろが名詞句 staff members working ... なので、前置詞が必要。\n→ 空所には「名詞句を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) apart … 副詞「離れて」 ×\n(B) even though … 接続詞（群）「〜だけれども」 ×\n(C) also … 副詞「〜もまた」 ×\n(D) except for … 群前置詞「〜を除いて」 ○\n\n■ 完成文\nEveryone in the finance division except for staff members working on special projects is expected to attend the meeting tomorrow afternoon.\n（特別プロジェクトに従事している職員を除き、財務部の全員が明日午後の会議に出席することになっている。）\n\n■ 解き方のポイント\n後ろが名詞なら前置詞。除外を表すのは except for。","words":[{"w":"finance division","p":"名詞","m":"財務部"},{"w":"staff members","p":"名詞","m":"職員"},{"w":"special projects","p":"名詞","m":"特別プロジェクト"},{"w":"attend","p":"動詞","m":"出席する"}]},{"id":467,"category":"前置詞or接続詞問題・実戦問題","question":"To receive the following month's issue, subscriptions should be sent in by the 15th of each month ______ submitted electronically or by mail.","A":"whether","B":"because","C":"since","D":"therefore","answer":"A","answer_word":"whether","explanation":"■ 文の骨格\nTo receive the following month's issue, subscriptions should be sent in by the 15th of each month ______ submitted electronically or by mail.\n\n■ 空所に入るもの\n直後に or があり、whether ... or ...（〜であれ〜であれ）の形になる。\n→ 空所には「whether A or B の形をつくる接続詞」が必要です。\n\n■ 選択肢の確認\n(A) whether … 接続詞「〜であろうと」 ○\n(B) because … 接続詞「〜なので」 ×\n(C) since … 接続詞・前置詞「〜以来」 ×\n(D) therefore … 副詞「したがって」 ×\n\n■ 完成文\nTo receive the following month's issue, subscriptions should be sent in by the 15th of each month whether submitted electronically or by mail.\n（翌月号を受け取るには、電子的に送るか郵送するかにかかわらず、毎月15日までに購読申込を送る必要がある。）\n\n■ 解き方のポイント\nwhether A or B＝「AであれBであれ」。or があれば whether を疑う。","words":[{"w":"issue","p":"名詞","m":"（雑誌の）号"},{"w":"subscriptions","p":"名詞","m":"購読申込"},{"w":"submitted","p":"過去分詞","m":"提出された"},{"w":"electronically","p":"副詞","m":"電子的に"}]},{"id":468,"category":"前置詞or接続詞問題・実戦問題","question":"Workers can leave the factory early ______ they have received permission to do so from a supervisor.","A":"otherwise","B":"except for","C":"in spite of","D":"provided that","answer":"D","answer_word":"provided that","explanation":"■ 文の骨格\nWorkers can leave the factory early ______ they have received permission to do so from a supervisor.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、条件を表す接続詞が文意に合う。\n→ 空所には「条件を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) otherwise … 副詞「そうでなければ」 ×\n(B) except for … 群前置詞「〜を除いて」 ×\n(C) in spite of … 群前置詞「〜にもかかわらず」 ×\n(D) provided that … 接続詞（群）「〜という条件で」 ○\n\n■ 完成文\nWorkers can leave the factory early provided that they have received permission to do so from a supervisor.\n（作業員は、上司から許可を得ている場合に限り、工場を早退できる。）\n\n■ 解き方のポイント\nprovided (that)／providing (that)＝if の堅い言い方。","words":[{"w":"leave","p":"動詞","m":"出る、退出する"},{"w":"factory","p":"名詞","m":"工場"},{"w":"permission","p":"名詞","m":"許可"},{"w":"supervisor","p":"名詞","m":"上司"}]},{"id":469,"category":"前置詞or接続詞問題・実戦問題","question":"Mr. Williams usually brings gifts to his colleagues ______ he returns from an overseas business trip.","A":"which","B":"whenever","C":"whether","D":"what","answer":"B","answer_word":"whenever","explanation":"■ 文の骨格\nMr. Williams usually brings gifts to his colleagues ______ he returns from an overseas business trip.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、「〜するときはいつでも」を表す語が文意に合う。\n→ 空所には「時を表す複合関係副詞」が必要です。\n\n■ 選択肢の確認\n(A) which … 関係代名詞「どちら」 ×\n(B) whenever … 複合関係副詞「〜するときはいつでも」 ○\n(C) whether … 接続詞「〜かどうか」 ×\n(D) what … 関係代名詞「〜すること」 ×\n\n■ 完成文\nMr. Williams usually brings gifts to his colleagues whenever he returns from an overseas business trip.\n（Williams さんは海外出張から戻ると、たいてい同僚に土産を持ってくる。）\n\n■ 解き方のポイント\nwhenever＝at any time when。usually との相性もヒント。","words":[{"w":"colleagues","p":"名詞","m":"同僚"},{"w":"returns","p":"動詞","m":"戻る"},{"w":"overseas","p":"形容詞","m":"海外の"},{"w":"business trip","p":"名詞","m":"出張"}]},{"id":470,"category":"前置詞or接続詞問題・実戦問題","question":"Tanton City passed legislation requiring all drivers age 75 and older to pass a vision test ______ renewing their driver's license.","A":"although","B":"before","C":"and","D":"from","answer":"B","answer_word":"before","explanation":"■ 文の骨格\nTanton City passed legislation requiring all drivers age 75 and older to pass a vision test ______ renewing their driver's license.\n\n■ 空所に入るもの\n空所の後ろが動名詞 renewing なので、前置詞として働く語が必要。\n→ 空所には「動名詞を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) although … 接続詞「〜だけれども」 ×\n(B) before … 前置詞・接続詞「〜の前に」 ○\n(C) and … 等位接続詞「そして」 ×\n(D) from … 前置詞「〜から」 ×\n\n■ 完成文\nTanton City passed legislation requiring all drivers age 75 and older to pass a vision test before renewing their driver's license.\n（Tanton 市は、75歳以上のすべての運転者に免許更新前の視力検査合格を義務づける法律を可決した。）\n\n■ 解き方のポイント\nbefore / after は前置詞としても使え、後ろに動名詞を取れる。","words":[{"w":"passed legislation","p":"熟語","m":"法律を可決した"},{"w":"requiring","p":"現在分詞","m":"義務づける"},{"w":"vision test","p":"名詞","m":"視力検査"},{"w":"renewing","p":"動名詞","m":"更新すること"}]},{"id":471,"category":"前置詞or接続詞問題・実戦問題","question":"______ the book may be understood by non-specialists, the first two chapters provide a detailed introduction.","A":"In regard to","B":"Because of","C":"However","D":"In order that","answer":"D","answer_word":"In order that","explanation":"■ 文の骨格\n______ the book may be understood by non-specialists, the first two chapters provide a detailed introduction.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋助動詞＋動詞〉で、目的を表す接続詞が文意に合う。\n→ 空所には「目的を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) In regard to … 群前置詞「〜に関して」 ×\n(B) Because of … 群前置詞「〜のため（理由）」 ×\n(C) However … 副詞「しかしながら」 ×\n(D) In order that … 接続詞（群）「〜するために」 ○\n\n■ 完成文\nIn order that the book may be understood by non-specialists, the first two chapters provide a detailed introduction.\n（専門家でない人にも理解してもらえるよう、その本の最初の2章は詳しい導入になっている。）\n\n■ 解き方のポイント\nin order that S may [can] V＝目的を表す。so that とほぼ同義。","words":[{"w":"understood","p":"動詞（過去分詞）","m":"理解される"},{"w":"non-specialists","p":"名詞","m":"専門家でない人"},{"w":"chapters","p":"名詞","m":"章"},{"w":"detailed","p":"形容詞","m":"詳しい"}]},{"id":472,"category":"前置詞or接続詞問題・実戦問題","question":"______ her extensive experience and past successes, Ms. Isohi is expected to be an invaluable asset to our company.","A":"So","B":"That","C":"Given","D":"Since","answer":"C","answer_word":"Given","explanation":"■ 文の骨格\n______ her extensive experience and past successes, Ms. Isohi is expected to be an invaluable asset to our company.\n\n■ 空所に入るもの\n空所の後ろが名詞句 her extensive experience ... なので、前置詞が必要。\n→ 空所には「名詞句を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) So … 等位接続詞「だから」 ×\n(B) That … 接続詞「〜ということ」 ×\n(C) Given … 前置詞（分詞由来）「〜を考えると」 ○\n(D) Since … 接続詞「〜なので」 ×\n\n■ 完成文\nGiven her extensive experience and past successes, Ms. Isohi is expected to be an invaluable asset to our company.\n（豊富な経験と過去の実績を考えると、Isohi さんは当社にとってかけがえのない人材になると期待される。）\n\n■ 解き方のポイント\nGiven＋名詞＝「〜を考慮すると」。Given that＋節の形もある。","words":[{"w":"extensive","p":"形容詞","m":"豊富な"},{"w":"successes","p":"名詞","m":"実績、成功"},{"w":"invaluable","p":"形容詞","m":"かけがえのない"},{"w":"asset","p":"名詞","m":"財産、人材"}]},{"id":473,"category":"前置詞or接続詞問題・実戦問題","question":"The fun run will be postponed until March 23 ______ the weather clears up by Friday.","A":"unless","B":"however","C":"because of","D":"so that","answer":"A","answer_word":"unless","explanation":"■ 文の骨格\nThe fun run will be postponed until March 23 ______ the weather clears up by Friday.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、「〜でない限り」という条件が文意に合う。\n→ 空所には「否定の条件を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) unless … 接続詞「〜でない限り」 ○\n(B) however … 副詞「しかしながら」 ×\n(C) because of … 群前置詞「〜のため」 ×\n(D) so that … 接続詞（群）「〜するために」 ×\n\n■ 完成文\nThe fun run will be postponed until March 23 unless the weather clears up by Friday.\n（金曜日までに天気が回復しない限り、その市民マラソンは3月23日まで延期される。）\n\n■ 解き方のポイント\nunless＝if ... not。延期される条件は「回復しないこと」。","words":[{"w":"fun run","p":"名詞","m":"市民マラソン"},{"w":"postponed","p":"動詞（過去分詞）","m":"延期される"},{"w":"clears up","p":"熟語","m":"（天気が）回復する"}]},{"id":474,"category":"前置詞or接続詞問題・実戦問題","question":"Due to excessive requests for support, GeoMax Technologies has decided to remove a map application from its mobile phones, ______ the product's popularity.","A":"although","B":"notwithstanding","C":"however","D":"even","answer":"B","answer_word":"notwithstanding","explanation":"■ 文の骨格\nDue to excessive requests for support, GeoMax Technologies has decided to remove a map application from its mobile phones, ______ the product's popularity.\n\n■ 空所に入るもの\n空所の後ろが名詞句 the product's popularity なので、前置詞が必要。\n→ 空所には「名詞句を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) although … 接続詞「〜だけれども」 ×\n(B) notwithstanding … 前置詞「〜にもかかわらず」 ○\n(C) however … 副詞「しかしながら」 ×\n(D) even … 副詞「〜さえ」 ×\n\n■ 完成文\nDue to excessive requests for support, GeoMax Technologies has decided to remove a map application from its mobile phones, notwithstanding the product's popularity.\n（サポート依頼が多すぎるため、GeoMax Technologies 社は製品の人気にもかかわらず、携帯電話から地図アプリを削除することにした。）\n\n■ 解き方のポイント\nnotwithstanding＝despite（前置詞）。硬い語だがTOEICでも出る。","words":[{"w":"excessive","p":"形容詞","m":"過度の"},{"w":"remove","p":"動詞","m":"削除する"},{"w":"application","p":"名詞","m":"アプリ"},{"w":"popularity","p":"名詞","m":"人気"}]},{"id":475,"category":"前置詞or接続詞問題・実戦問題","question":"All city residents must obtain a construction permit from the city ______ building a driveway.","A":"prior to","B":"because","C":"soon","D":"so that","answer":"A","answer_word":"prior to","explanation":"■ 文の骨格\nAll city residents must obtain a construction permit from the city ______ building a driveway.\n\n■ 空所に入るもの\n空所の後ろが動名詞 building なので、前置詞として働く語句が必要。\n→ 空所には「動名詞を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) prior to … 群前置詞「〜の前に」 ○\n(B) because … 接続詞「〜なので」 ×\n(C) soon … 副詞「すぐに」 ×\n(D) so that … 接続詞（群）「〜するために」 ×\n\n■ 完成文\nAll city residents must obtain a construction permit from the city prior to building a driveway.\n（市内の住民はすべて、私道を造る前に市から建設許可証を取得しなければならない。）\n\n■ 解き方のポイント\nprior to の to は前置詞。後ろは名詞か動名詞。","words":[{"w":"residents","p":"名詞","m":"住民"},{"w":"obtain","p":"動詞","m":"取得する"},{"w":"construction permit","p":"名詞","m":"建設許可証"},{"w":"driveway","p":"名詞","m":"私道"}]},{"id":476,"category":"前置詞or接続詞問題・実戦問題","question":"The leadership workshop covers a range of topics, ______ career development, social networking, and recruiting new members.","A":"so that","B":"as of","C":"in that","D":"such as","answer":"D","answer_word":"such as","explanation":"■ 文の骨格\nThe leadership workshop covers a range of topics, ______ career development, social networking, and recruiting new members.\n\n■ 空所に入るもの\n空所の後ろが名詞の列挙なので、例を挙げる前置詞が必要。\n→ 空所には「例示を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) so that … 接続詞（群）「〜するために」 ×\n(B) as of … 群前置詞「〜の時点で」 ×\n(C) in that … 接続詞（群）「〜という点で」 ×\n(D) such as … 群前置詞「〜のような」 ○\n\n■ 完成文\nThe leadership workshop covers a range of topics, such as career development, social networking, and recruiting new members.\n（そのリーダーシップ研修は、キャリア開発、人脈づくり、新会員の勧誘など幅広いテーマを扱う。）\n\n■ 解き方のポイント\nsuch as＝「たとえば〜など」。後ろに具体例が並ぶ。","words":[{"w":"covers","p":"動詞","m":"扱う"},{"w":"a range of","p":"熟語","m":"幅広い"},{"w":"career development","p":"名詞","m":"キャリア開発"},{"w":"recruiting","p":"動名詞","m":"勧誘すること"}]},{"id":477,"category":"前置詞or接続詞問題・実戦問題","question":"______ booking flights and making accommodation reservations, Waterfall Travel agents arrange private tours for small groups.","A":"As much as","B":"Moreover","C":"Included in","D":"In addition to","answer":"D","answer_word":"In addition to","explanation":"■ 文の骨格\n______ booking flights and making accommodation reservations, Waterfall Travel agents arrange private tours for small groups.\n\n■ 空所に入るもの\n空所の後ろが動名詞 booking なので、前置詞として働く語句が必要。\n→ 空所には「動名詞を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) As much as … 接続詞（群）「〜と同じくらい」 ×\n(B) Moreover … 副詞「さらに」 ×\n(C) Included in … 過去分詞句「〜に含まれる」 ×\n(D) In addition to … 群前置詞「〜に加えて」 ○\n\n■ 完成文\nIn addition to booking flights and making accommodation reservations, Waterfall Travel agents arrange private tours for small groups.\n（航空券の予約や宿泊施設の手配に加えて、Waterfall 旅行社は少人数向けの個人ツアーも手配する。）\n\n■ 解き方のポイント\nin addition to の to は前置詞。後ろに動名詞が来る点が狙われる。","words":[{"w":"booking","p":"動名詞","m":"予約すること"},{"w":"accommodation","p":"名詞","m":"宿泊施設"},{"w":"arrange","p":"動詞","m":"手配する"},{"w":"private tours","p":"名詞","m":"個人ツアー"}]},{"id":478,"category":"前置詞or接続詞問題・実戦問題","question":"Ridgeway Associates agreed to pay an early completion bonus ______ construction of their new headquarters was completed by March 30.","A":"in spite of","B":"as long as","C":"since then","D":"due to","answer":"B","answer_word":"as long as","explanation":"■ 文の骨格\nRidgeway Associates agreed to pay an early completion bonus ______ construction of their new headquarters was completed by March 30.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、条件を表す接続詞が文意に合う。\n→ 空所には「条件を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) in spite of … 群前置詞「〜にもかかわらず」 ×\n(B) as long as … 接続詞（群）「〜する限りは」 ○\n(C) since then … 副詞句「それ以来」 ×\n(D) due to … 群前置詞「〜のため」 ×\n\n■ 完成文\nRidgeway Associates agreed to pay an early completion bonus as long as construction of their new headquarters was completed by March 30.\n（Ridgeway Associates 社は、新本社の建設が3月30日までに完了することを条件に、早期完了ボーナスを支払うことに同意した。）\n\n■ 解き方のポイント\nas long as＝条件「〜しさえすれば」。as far as は範囲を表す。","words":[{"w":"agreed","p":"動詞（過去形）","m":"同意した"},{"w":"early completion","p":"名詞","m":"早期完了"},{"w":"headquarters","p":"名詞","m":"本社"},{"w":"completed","p":"動詞（過去分詞）","m":"完了した"}]},{"id":479,"category":"前置詞or接続詞問題・実戦問題","question":"______ the difficulties he faced, Mr. Chang managed to complete his master's degree at the University of Abeno last year.","A":"Although","B":"Despite","C":"However","D":"Whereas","answer":"B","answer_word":"Despite","explanation":"■ 文の骨格\n______ the difficulties he faced, Mr. Chang managed to complete his master's degree at the University of Abeno last year.\n\n■ 空所に入るもの\n空所の後ろが名詞句 the difficulties he faced なので、前置詞が必要。\n→ 空所には「名詞句を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) Although … 接続詞「〜だけれども」 ×\n(B) Despite … 前置詞「〜にもかかわらず」 ○\n(C) However … 副詞「しかしながら」 ×\n(D) Whereas … 接続詞「〜する一方で」 ×\n\n■ 完成文\nDespite the difficulties he faced, Mr. Chang managed to complete his master's degree at the University of Abeno last year.\n（直面した困難にもかかわらず、Chang さんは昨年 Abeno 大学で修士課程を修了することができた。）\n\n■ 解き方のポイント\nthe difficulties (that) he faced は関係詞が省略された名詞句。動詞があっても核は名詞。","words":[{"w":"difficulties","p":"名詞","m":"困難"},{"w":"faced","p":"動詞（過去形）","m":"直面した"},{"w":"managed to","p":"熟語","m":"どうにか〜した"},{"w":"master's degree","p":"名詞","m":"修士号"}]},{"id":480,"category":"前置詞or接続詞問題・実戦問題","question":"______ Mr. Bruno contributed significantly to the success of the advertising campaign, his promotion to the manager position is well deserved.","A":"If so","B":"Rather than","C":"Owing to","D":"Given that","answer":"D","answer_word":"Given that","explanation":"■ 文の骨格\n______ Mr. Bruno contributed significantly to the success of the advertising campaign, his promotion to the manager position is well deserved.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、理由・根拠を表す接続詞が文意に合う。\n→ 空所には「節を導く接続詞（群）」が必要です。\n\n■ 選択肢の確認\n(A) If so … 副詞句「もしそうなら」 ×\n(B) Rather than … 群前置詞「〜よりむしろ」 ×\n(C) Owing to … 群前置詞「〜のため」 ×\n(D) Given that … 接続詞（群）「〜を考えると」 ○\n\n■ 完成文\nGiven that Mr. Bruno contributed significantly to the success of the advertising campaign, his promotion to the manager position is well deserved.\n（Bruno さんが広告キャンペーンの成功に大きく貢献したことを考えれば、彼のマネージャー職への昇進は当然だ。）\n\n■ 解き方のポイント\nGiven＋名詞／Given that＋節。that の有無で品詞が変わる。","words":[{"w":"contributed","p":"動詞（過去形）","m":"貢献した"},{"w":"significantly","p":"副詞","m":"大きく"},{"w":"promotion","p":"名詞","m":"昇進"},{"w":"well deserved","p":"形容詞句","m":"当然の、ふさわしい"}]},{"id":481,"category":"前置詞or接続詞問題・実戦問題","question":"______ Isabella Hill has received a high rating on her evaluation, it is likely that her salary will increase next year.","A":"Besides","B":"So that","C":"As","D":"Due to","answer":"C","answer_word":"As","explanation":"■ 文の骨格\n______ Isabella Hill has received a high rating on her evaluation, it is likely that her salary will increase next year.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、後半の理由を表す接続詞が必要。\n→ 空所には「理由を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) Besides … 副詞・前置詞「そのうえ／〜に加えて」 ×\n(B) So that … 接続詞（群）「〜するために」 ×\n(C) As … 接続詞「〜なので」 ○\n(D) Due to … 群前置詞「〜のため」 ×\n\n■ 完成文\nAs Isabella Hill has received a high rating on her evaluation, it is likely that her salary will increase next year.\n（Isabella Hill は評価で高い評点を得たので、来年は給与が上がる見込みだ。）\n\n■ 解き方のポイント\nas は「〜なので（理由）」「〜するとき」「〜につれて」など多義。後ろが節。","words":[{"w":"rating","p":"名詞","m":"評点"},{"w":"evaluation","p":"名詞","m":"評価"},{"w":"likely","p":"形容詞","m":"ありそうな"},{"w":"salary","p":"名詞","m":"給与"}]},{"id":482,"category":"前置詞or接続詞問題・実戦問題","question":"Mr. Murphy has requested that the second seminar be held tomorrow ______ having him return next week.","A":"even though","B":"rather than","C":"as soon as","D":"so that","answer":"B","answer_word":"rather than","explanation":"■ 文の骨格\nMr. Murphy has requested that the second seminar be held tomorrow ______ having him return next week.\n\n■ 空所に入るもの\n空所の後ろが動名詞 having なので、前置詞として働く語句が必要。\n→ 空所には「動名詞を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) even though … 接続詞（群）「〜だけれども」 ×\n(B) rather than … 群前置詞「〜よりむしろ」 ○\n(C) as soon as … 接続詞（群）「〜したらすぐに」 ×\n(D) so that … 接続詞（群）「〜するために」 ×\n\n■ 完成文\nMr. Murphy has requested that the second seminar be held tomorrow rather than having him return next week.\n（Murphy さんは、翌週にまた来てもらうのではなく、2回目のセミナーを明日開催するよう求めた。）\n\n■ 解き方のポイント\nrather than の後ろは名詞・動名詞・原形などを取る。request that の節内が原形 be である点も要チェック。","words":[{"w":"requested","p":"動詞（過去分詞）","m":"求めた"},{"w":"be held","p":"原形の受動態","m":"開催される"},{"w":"rather than","p":"熟語","m":"〜よりむしろ"},{"w":"return","p":"動詞","m":"戻る"}]},{"id":483,"category":"前置詞or接続詞問題・実戦問題","question":"______ Ms. Contreras began working as a sales representative, she has successfully expanded our client base.","A":"Since","B":"When","C":"Before","D":"Whereas","answer":"A","answer_word":"Since","explanation":"■ 文の骨格\n______ Ms. Contreras began working as a sales representative, she has successfully expanded our client base.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、主節が現在完了形なので「〜以来」が文意に合う。\n→ 空所には「起点を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) Since … 接続詞「〜して以来」 ○\n(B) When … 接続詞「〜のとき」 ×\n(C) Before … 接続詞「〜の前に」 ×\n(D) Whereas … 接続詞「〜する一方で」 ×\n\n■ 完成文\nSince Ms. Contreras began working as a sales representative, she has successfully expanded our client base.\n（Contreras さんは営業担当として働き始めて以来、当社の顧客基盤を順調に拡大してきた。）\n\n■ 解き方のポイント\nsince（〜以来）は主節が現在完了形になるのが目印。","words":[{"w":"sales representative","p":"名詞","m":"営業担当"},{"w":"successfully","p":"副詞","m":"順調に"},{"w":"expanded","p":"動詞（過去分詞）","m":"拡大した"},{"w":"client base","p":"名詞","m":"顧客基盤"}]},{"id":484,"category":"前置詞or接続詞問題・実戦問題","question":"Please note that breakfast and dinner are included in the price of the room, ______ that lunch costs extra.","A":"either","B":"but","C":"or","D":"then","answer":"B","answer_word":"but","explanation":"■ 文の骨格\nPlease note that breakfast and dinner are included in the price of the room, ______ that lunch costs extra.\n\n■ 空所に入るもの\n2つの that 節を対比的につなぐ接続詞が必要。\n→ 空所には「逆接を表す等位接続詞」が必要です。\n\n■ 選択肢の確認\n(A) either … 相関語「どちらか」 ×\n(B) but … 等位接続詞「しかし」 ○\n(C) or … 等位接続詞「または」 ×\n(D) then … 副詞「そのとき」 ×\n\n■ 完成文\nPlease note that breakfast and dinner are included in the price of the room, but that lunch costs extra.\n（朝食と夕食は部屋代に含まれますが、昼食は別料金となりますのでご留意ください。）\n\n■ 解き方のポイント\nnote that A but that B の形。and/but の前後は同じ形が並ぶ。","words":[{"w":"note","p":"動詞","m":"留意する"},{"w":"included","p":"動詞（過去分詞）","m":"含まれる"},{"w":"costs extra","p":"熟語","m":"追加料金がかかる"}]},{"id":485,"category":"前置詞or接続詞問題・実戦問題","question":"Tim Rothschild has a number of important qualifications as a market researcher ______ his experience at Bridgeport Advertising.","A":"while","B":"only if","C":"moreover","D":"aside from","answer":"D","answer_word":"aside from","explanation":"■ 文の骨格\nTim Rothschild has a number of important qualifications as a market researcher ______ his experience at Bridgeport Advertising.\n\n■ 空所に入るもの\n空所の後ろが名詞句 his experience なので、前置詞が必要。\n→ 空所には「名詞句を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) while … 接続詞「〜する一方で」 ×\n(B) only if … 接続詞（群）「〜の場合に限り」 ×\n(C) moreover … 副詞「さらに」 ×\n(D) aside from … 群前置詞「〜のほかに」 ○\n\n■ 完成文\nTim Rothschild has a number of important qualifications as a market researcher aside from his experience at Bridgeport Advertising.\n（Tim Rothschild は、Bridgeport Advertising 社での経験のほかにも、市場調査員として重要な資格を多く持っている。）\n\n■ 解き方のポイント\naside from＝apart from＝besides（〜のほかに）。","words":[{"w":"qualifications","p":"名詞","m":"資格"},{"w":"market researcher","p":"名詞","m":"市場調査員"},{"w":"aside from","p":"熟語","m":"〜のほかに"},{"w":"experience","p":"名詞","m":"経験"}]},{"id":486,"category":"前置詞or接続詞問題・実戦問題","question":"Mr. Hasegawa decided to purchase the movie tickets early ______ he would not have to wait in line at the box office.","A":"so that","B":"in order","C":"as if","D":"even yet","answer":"A","answer_word":"so that","explanation":"■ 文の骨格\nMr. Hasegawa decided to purchase the movie tickets early ______ he would not have to wait in line at the box office.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋助動詞＋動詞〉で、目的を表す接続詞が文意に合う。\n→ 空所には「目的を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) so that … 接続詞（群）「〜するために」 ○\n(B) in order … 名詞（群不定詞の一部）「順序、〜のために」 ×\n(C) as if … 接続詞（群）「まるで〜のように」 ×\n(D) even yet … 副詞句「さらにまだ」 ×\n\n■ 完成文\nMr. Hasegawa decided to purchase the movie tickets early so that he would not have to wait in line at the box office.\n（Hasegawa さんは、チケット売り場で並ばずに済むよう、映画のチケットを早めに買うことにした。）\n\n■ 解き方のポイント\nso that S will [would] not V＝「Sが〜しないように」。in order は to か that を伴う。","words":[{"w":"purchase","p":"動詞","m":"買う"},{"w":"wait in line","p":"熟語","m":"列に並ぶ"},{"w":"box office","p":"名詞","m":"チケット売り場"}]},{"id":487,"category":"前置詞or接続詞問題・実戦問題","question":"______ periodic maintenance is carried out according to the manufacturer's specifications, the TD24 paper folder will continue to function for a good many years.","A":"For","B":"Therefore","C":"Providing","D":"Over","answer":"C","answer_word":"Providing","explanation":"■ 文の骨格\n______ periodic maintenance is carried out according to the manufacturer's specifications, the TD24 paper folder will continue to function for a good many years.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、条件を表す接続詞が文意に合う。\n→ 空所には「条件を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) For … 前置詞・接続詞「〜のために」 ×\n(B) Therefore … 副詞「したがって」 ×\n(C) Providing … 接続詞（分詞由来）「〜という条件で」 ○\n(D) Over … 前置詞「〜にわたって」 ×\n\n■ 完成文\nProviding periodic maintenance is carried out according to the manufacturer's specifications, the TD24 paper folder will continue to function for a good many years.\n（メーカーの仕様どおりに定期メンテナンスが行われれば、TD24 紙折り機は長年にわたり機能し続ける。）\n\n■ 解き方のポイント\nproviding (that)／provided (that)＝if。分詞から接続詞化した語。","words":[{"w":"periodic maintenance","p":"名詞","m":"定期メンテナンス"},{"w":"carried out","p":"熟語","m":"行われる"},{"w":"specifications","p":"名詞","m":"仕様"},{"w":"function","p":"動詞","m":"機能する"}]},{"id":488,"category":"前置詞or接続詞問題・実戦問題","question":"Please let us know ______ you prefer to be notified by e-mail or telephone in case we have to reschedule your appointment.","A":"than","B":"whereas","C":"whether","D":"such","answer":"C","answer_word":"whether","explanation":"■ 文の骨格\nPlease let us know ______ you prefer to be notified by e-mail or telephone in case we have to reschedule your appointment.\n\n■ 空所に入るもの\nlet us know の目的語となる名詞節を導き、後ろの or と呼応する接続詞が必要。\n→ 空所には「名詞節を導く接続詞」が必要です。\n\n■ 選択肢の確認\n(A) than … 接続詞・前置詞「〜よりも」 ×\n(B) whereas … 接続詞「〜する一方で」 ×\n(C) whether … 接続詞「〜かどうか」 ○\n(D) such … 形容詞「そのような」 ×\n\n■ 完成文\nPlease let us know whether you prefer to be notified by e-mail or telephone in case we have to reschedule your appointment.\n（ご予約の変更が必要な場合に備え、メールと電話のどちらでのご連絡をご希望かお知らせください。）\n\n■ 解き方のポイント\nwhether A or B が名詞節をつくる。know の目的語になれるのは whether／that／if。","words":[{"w":"let us know","p":"熟語","m":"知らせる"},{"w":"prefer","p":"動詞","m":"好む"},{"w":"notified","p":"動詞（過去分詞）","m":"知らされる"},{"w":"reschedule","p":"動詞","m":"日程を変更する"}]},{"id":489,"category":"前置詞or接続詞問題・実戦問題","question":"The tour group left for Osaka, ______ they had not received their complete itinerary from the travel agency.","A":"in spite of","B":"because of","C":"even though","D":"so that","answer":"C","answer_word":"even though","explanation":"■ 文の骨格\nThe tour group left for Osaka, ______ they had not received their complete itinerary from the travel agency.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、前後が対立する内容になっている。\n→ 空所には「譲歩を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) in spite of … 群前置詞「〜にもかかわらず」 ×\n(B) because of … 群前置詞「〜のため」 ×\n(C) even though … 接続詞（群）「〜だけれども」 ○\n(D) so that … 接続詞（群）「〜するために」 ×\n\n■ 完成文\nThe tour group left for Osaka, even though they had not received their complete itinerary from the travel agency.\n（旅行会社から完全な旅程表をまだ受け取っていなかったが、そのツアーグループは大阪へ出発した。）\n\n■ 解き方のポイント\neven though＋節／in spite of＋名詞。後ろの形で選ぶ。","words":[{"w":"left for","p":"熟語","m":"〜へ出発した"},{"w":"complete","p":"形容詞","m":"完全な"},{"w":"itinerary","p":"名詞","m":"旅程表"},{"w":"travel agency","p":"名詞","m":"旅行会社"}]},{"id":490,"category":"前置詞or接続詞問題・実戦問題","question":"Mr. Roy called to ask if the deadline for submission of the draft could be postponed ______ after midnight.","A":"during","B":"until","C":"since","D":"when","answer":"B","answer_word":"until","explanation":"■ 文の骨格\nMr. Roy called to ask if the deadline for submission of the draft could be postponed ______ after midnight.\n\n■ 空所に入るもの\n「〜まで（ずっと）」という継続の終点を表す前置詞が文意に合う。\n→ 空所には「期限を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) during … 前置詞「〜の間」 ×\n(B) until … 前置詞「〜まで」 ○\n(C) since … 前置詞・接続詞「〜以来」 ×\n(D) when … 接続詞「〜のとき」 ×\n\n■ 完成文\nMr. Roy called to ask if the deadline for submission of the draft could be postponed until after midnight.\n（Roy さんは、原稿提出の締切を真夜中過ぎまで延ばせないか尋ねるために電話をかけた。）\n\n■ 解き方のポイント\nuntil は継続の終点、by は期限（それまでに）。postpone とは until が相性がよい。","words":[{"w":"deadline","p":"名詞","m":"締切"},{"w":"submission","p":"名詞","m":"提出"},{"w":"draft","p":"名詞","m":"原稿"},{"w":"postponed","p":"動詞（過去分詞）","m":"延期される"}]},{"id":491,"category":"前置詞or接続詞問題・実戦問題","question":"Applicants for the position will be sent an acknowledgement letter ______ the Human Resources Department has received the applications.","A":"among","B":"despite","C":"unless","D":"once","answer":"D","answer_word":"once","explanation":"■ 文の骨格\nApplicants for the position will be sent an acknowledgement letter ______ the Human Resources Department has received the applications.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、「いったん〜すれば」という時の条件が文意に合う。\n→ 空所には「時を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) among … 前置詞「〜の中で」 ×\n(B) despite … 前置詞「〜にもかかわらず」 ×\n(C) unless … 接続詞「〜でない限り」 ×\n(D) once … 接続詞「いったん〜すれば」 ○\n\n■ 完成文\nApplicants for the position will be sent an acknowledgement letter once the Human Resources Department has received the applications.\n（人事部が応募書類を受け取り次第、この職の応募者には受領通知が送られる。）\n\n■ 解き方のポイント\nonce＝as soon as。副詞「かつて」との違いに注意。","words":[{"w":"Applicants","p":"名詞","m":"応募者"},{"w":"acknowledgement letter","p":"名詞","m":"受領通知"},{"w":"Human Resources Department","p":"名詞","m":"人事部"},{"w":"applications","p":"名詞","m":"応募書類"}]},{"id":492,"category":"前置詞or接続詞問題・実戦問題","question":"Administration keeps records of all vehicle registration numbers, ______ whether they are company owned or not.","A":"due to","B":"even though","C":"rather than","D":"regardless of","answer":"D","answer_word":"regardless of","explanation":"■ 文の骨格\nAdministration keeps records of all vehicle registration numbers, ______ whether they are company owned or not.\n\n■ 空所に入るもの\nregardless of whether ...（〜かどうかにかかわらず）という形になる。\n→ 空所には「whether 節を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) due to … 群前置詞「〜のため」 ×\n(B) even though … 接続詞（群）「〜だけれども」 ×\n(C) rather than … 群前置詞「〜よりむしろ」 ×\n(D) regardless of … 群前置詞「〜に関係なく」 ○\n\n■ 完成文\nAdministration keeps records of all vehicle registration numbers, regardless of whether they are company owned or not.\n（管理部門は、社有かどうかにかかわらず、すべての車両登録番号の記録を保管している。）\n\n■ 解き方のポイント\nregardless of の of は前置詞だが、whether 節を目的語に取れる。","words":[{"w":"Administration","p":"名詞","m":"管理部門"},{"w":"records","p":"名詞","m":"記録"},{"w":"vehicle registration","p":"名詞","m":"車両登録"},{"w":"regardless of","p":"熟語","m":"〜に関係なく"}]},{"id":493,"category":"前置詞or接続詞問題・実戦問題","question":"Producers of the children's animation series Team Power shortened the program by two minutes, ______ meeting the requirements of broadcasters.","A":"thereby","B":"because","C":"whenever","D":"during","answer":"A","answer_word":"thereby","explanation":"■ 文の骨格\nProducers of the children's animation series Team Power shortened the program by two minutes, ______ meeting the requirements of broadcasters.\n\n■ 空所に入るもの\n分詞構文 meeting ... を修飾し、「それによって」と結果を示す副詞が必要。\n→ 空所には「分詞構文を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) thereby … 副詞「それによって」 ○\n(B) because … 接続詞「〜なので」 ×\n(C) whenever … 複合関係副詞「〜するときはいつでも」 ×\n(D) during … 前置詞「〜の間」 ×\n\n■ 完成文\nProducers of the children's animation series Team Power shortened the program by two minutes, thereby meeting the requirements of broadcasters.\n（子ども向けアニメ『Team Power』の制作陣は番組を2分短縮し、それによって放送局の要件を満たした。）\n\n■ 解き方のポイント\nthereby doing＝「それによって〜する」。分詞構文と組み合わせる定型。","words":[{"w":"Producers","p":"名詞","m":"制作陣"},{"w":"shortened","p":"動詞（過去形）","m":"短縮した"},{"w":"thereby","p":"副詞","m":"それによって"},{"w":"requirements","p":"名詞","m":"要件"},{"w":"broadcasters","p":"名詞","m":"放送局"}]},{"id":494,"category":"前置詞or接続詞問題・実戦問題","question":"Employees are required to book in advance ______ intending to use a company vehicle.","A":"whereas","B":"from","C":"if","D":"even","answer":"C","answer_word":"if","explanation":"■ 文の骨格\nEmployees are required to book in advance ______ intending to use a company vehicle.\n\n■ 空所に入るもの\nif (they are) intending のように〈主語＋be動詞〉を省略できる接続詞が必要。\n→ 空所には「分詞を伴える接続詞」が必要です。\n\n■ 選択肢の確認\n(A) whereas … 接続詞「〜する一方で」 ×\n(B) from … 前置詞「〜から」 ×\n(C) if … 接続詞「もし〜なら」 ○\n(D) even … 副詞「〜さえ」 ×\n\n■ 完成文\nEmployees are required to book in advance if intending to use a company vehicle.\n（従業員は、社用車を使う予定であれば事前に予約することが求められる。）\n\n■ 解き方のポイント\nif / when / while は〈主語＋be動詞〉を省略して分詞を続けられる。","words":[{"w":"book","p":"動詞","m":"予約する"},{"w":"in advance","p":"熟語","m":"事前に"},{"w":"intending","p":"現在分詞","m":"〜するつもりである"},{"w":"company vehicle","p":"名詞","m":"社用車"}]},{"id":495,"category":"前置詞or接続詞問題・実戦問題","question":"______ retiring from Smith Computer Technologies two years ago, Bill Smith has been devoting more time to charity events.","A":"When","B":"Since","C":"Already","D":"From","answer":"B","answer_word":"Since","explanation":"■ 文の骨格\n______ retiring from Smith Computer Technologies two years ago, Bill Smith has been devoting more time to charity events.\n\n■ 空所に入るもの\n空所の後ろが動名詞 retiring で、主節が現在完了形なので「〜以来」が文意に合う。\n→ 空所には「動名詞を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) When … 接続詞「〜のとき」 ×\n(B) Since … 前置詞・接続詞「〜以来」 ○\n(C) Already … 副詞「すでに」 ×\n(D) From … 前置詞「〜から」 ×\n\n■ 完成文\nSince retiring from Smith Computer Technologies two years ago, Bill Smith has been devoting more time to charity events.\n（2年前に Smith Computer Technologies 社を退職して以来、Bill Smith は慈善イベントにより多くの時間を割いている。）\n\n■ 解き方のポイント\nsince は前置詞・接続詞の両方で使え、後ろに動名詞も取れる。主節の現在完了が目印。","words":[{"w":"retiring","p":"動名詞","m":"退職すること"},{"w":"devoting","p":"現在分詞","m":"割いている"},{"w":"charity events","p":"名詞","m":"慈善イベント"}]},{"id":496,"category":"前置詞or接続詞問題・実戦問題","question":"______ recent changes made to the schedule, employees are to be given an additional day off next Friday.","A":"Because","B":"As far as","C":"In light of","D":"Except for","answer":"C","answer_word":"In light of","explanation":"■ 文の骨格\n______ recent changes made to the schedule, employees are to be given an additional day off next Friday.\n\n■ 空所に入るもの\n空所の後ろが名詞句 recent changes ... なので、前置詞が必要。\n→ 空所には「名詞句を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) Because … 接続詞「〜なので」 ×\n(B) As far as … 接続詞（群）「〜する限り」 ×\n(C) In light of … 群前置詞「〜を考慮して」 ○\n(D) Except for … 群前置詞「〜を除いて」 ×\n\n■ 完成文\nIn light of recent changes made to the schedule, employees are to be given an additional day off next Friday.\n（スケジュールの最近の変更を踏まえ、従業員は来週金曜日に追加の休暇が与えられることになっている。）\n\n■ 解き方のポイント\nin light of＝considering（〜を考慮して）。後ろは名詞。","words":[{"w":"recent changes","p":"名詞","m":"最近の変更"},{"w":"in light of","p":"熟語","m":"〜を考慮して"},{"w":"additional","p":"形容詞","m":"追加の"},{"w":"day off","p":"名詞","m":"休日"}]},{"id":497,"category":"前置詞or接続詞問題・実戦問題","question":"Members of the purchasing department should follow the current procedures for the issuing of purchase orders to vendors, unless ______ instructed by the manager.","A":"otherwise","B":"furthermore","C":"however","D":"if","answer":"A","answer_word":"otherwise","explanation":"■ 文の骨格\nMembers of the purchasing department should follow the current procedures for the issuing of purchase orders to vendors, unless ______ instructed by the manager.\n\n■ 空所に入るもの\nunless (they are) ______ instructed の形で、過去分詞を修飾する副詞が必要。\n→ 空所には「過去分詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) otherwise … 副詞「別段に、そうでなく」 ○\n(B) furthermore … 副詞「さらに」 ×\n(C) however … 副詞「しかしながら」 ×\n(D) if … 接続詞「もし〜なら」 ×\n\n■ 完成文\nMembers of the purchasing department should follow the current procedures for the issuing of purchase orders to vendors, unless otherwise instructed by the manager.\n（購買部の担当者は、部長から別段の指示がない限り、業者への発注に関する現行の手順に従わなければならない。）\n\n■ 解き方のポイント\nunless otherwise instructed [stated / noted]＝「別段の指示がない限り」は定型。","words":[{"w":"purchasing department","p":"名詞","m":"購買部"},{"w":"procedures","p":"名詞","m":"手順"},{"w":"purchase orders","p":"名詞","m":"発注書"},{"w":"vendors","p":"名詞","m":"業者"},{"w":"otherwise","p":"副詞","m":"別段に"}]},{"id":498,"category":"代名詞問題・トレーニング","question":"If you take office stationery from the storeroom, please contact Ms. Nelson so that ______ can keep an inventory of office supplies.","A":"she","B":"her","C":"hers","D":"herself","answer":"A","answer_word":"she","explanation":"■ 文の骨格\nIf you take office stationery from the storeroom, please contact Ms. Nelson so that ______ can keep an inventory of office supplies.\n\n■ 空所に入るもの\nso that 節の主語が欠けているので、主格の代名詞が必要。\n→ 空所には「節の主語になる主格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) she … 主格の代名詞「彼女は」 ○\n(B) her … 目的格・所有格「彼女を／彼女の」 ×\n(C) hers … 所有代名詞「彼女のもの」 ×\n(D) herself … 再帰代名詞「彼女自身」 ×\n\n■ 完成文\nIf you take office stationery from the storeroom, please contact Ms. Nelson so that she can keep an inventory of office supplies.\n（倉庫から事務用品を持ち出す際は、事務用品の在庫を管理できるよう Nelson さんにご連絡ください。）\n\n■ 解き方のポイント\n動詞の前で主語が欠けていれば主格。代名詞問題はまず空所の役割を確認する。","words":[{"w":"stationery","p":"名詞","m":"文房具"},{"w":"storeroom","p":"名詞","m":"倉庫"},{"w":"inventory","p":"名詞","m":"在庫"},{"w":"office supplies","p":"名詞","m":"事務用品"}]},{"id":499,"category":"代名詞問題・トレーニング","question":"Mr. Bando was told by the building's owner that the monthly rent should be paid directly to ______.","A":"she","B":"her","C":"hers","D":"herself","answer":"B","answer_word":"her","explanation":"■ 文の骨格\nMr. Bando was told by the building's owner that the monthly rent should be paid directly to ______.\n\n■ 空所に入るもの\n前置詞 to の後ろなので、目的格の代名詞が必要。\n→ 空所には「前置詞の目的語になる目的格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) she … 主格の代名詞「彼女は」 ×\n(B) her … 目的格の代名詞「彼女に」 ○\n(C) hers … 所有代名詞「彼女のもの」 ×\n(D) herself … 再帰代名詞「彼女自身」 ×\n\n■ 完成文\nMr. Bando was told by the building's owner that the monthly rent should be paid directly to her.\n（Bando さんはビルの所有者から、毎月の家賃を直接彼女に支払うよう言われた。）\n\n■ 解き方のポイント\n前置詞の直後は目的格。主語（owner）と別人ではないが、to oneself だと意味が変わる点にも注意。","words":[{"w":"owner","p":"名詞","m":"所有者"},{"w":"monthly rent","p":"名詞","m":"毎月の家賃"},{"w":"paid","p":"動詞（過去分詞）","m":"支払われる"},{"w":"directly","p":"副詞","m":"直接"}]},{"id":500,"category":"代名詞問題・トレーニング","question":"Peter Hardy guided visitors around the company ______ while his secretary prepared refreshments in the cafeteria.","A":"he","B":"his","C":"him","D":"himself","answer":"D","answer_word":"himself","explanation":"■ 文の骨格\nPeter Hardy guided visitors around the company ______ while his secretary prepared refreshments in the cafeteria.\n\n■ 空所に入るもの\nguided visitors around the company で文の要素が完成しており、主語を強調する語が入る。\n→ 空所には「主語を強調する再帰代名詞」が必要です。\n\n■ 選択肢の確認\n(A) he … 主格の代名詞「彼は」 ×\n(B) his … 所有格「彼の」 ×\n(C) him … 目的格の代名詞「彼を」 ×\n(D) himself … 再帰代名詞「彼自身が」 ○\n\n■ 完成文\nPeter Hardy guided visitors around the company himself while his secretary prepared refreshments in the cafeteria.\n（秘書がカフェテリアで軽食を用意している間、Peter Hardy は自ら来客を社内に案内した。）\n\n■ 解き方のポイント\n文が完成している位置の代名詞は、強調用法の再帰代名詞（〜自身が）。","words":[{"w":"guided","p":"動詞（過去形）","m":"案内した"},{"w":"visitors","p":"名詞","m":"来客"},{"w":"secretary","p":"名詞","m":"秘書"},{"w":"refreshments","p":"名詞","m":"軽食"}]},{"id":501,"category":"代名詞問題・トレーニング","question":"______ attending the International Toy Fair is asked to sign in at the entrance and wear a colored wristband according to their ticket type.","A":"Everyone","B":"Whoever","C":"They","D":"Several","answer":"A","answer_word":"Everyone","explanation":"■ 文の骨格\n______ attending the International Toy Fair is asked to sign in at the entrance and wear a colored wristband according to their ticket type.\n\n■ 空所に入るもの\n述語動詞 is に対応する単数扱いの主語が必要。\n→ 空所には「単数扱いの主語になる代名詞」が必要です。\n\n■ 選択肢の確認\n(A) Everyone … 代名詞（単数扱い）「誰もが」 ○\n(B) Whoever … 複合関係代名詞「〜する人は誰でも」 ×\n(C) They … 代名詞（複数）「彼らは」 ×\n(D) Several … 代名詞（複数扱い）「いくつかの」 ×\n\n■ 完成文\nEveryone attending the International Toy Fair is asked to sign in at the entrance and wear a colored wristband according to their ticket type.\n（国際玩具見本市に参加する人は全員、入口で記帳し、チケットの種類に応じた色のリストバンドを着用するよう求められる。）\n\n■ 解き方のポイント\neveryone / everybody は単数扱い。動詞 is が決め手。","words":[{"w":"Everyone","p":"代名詞","m":"誰もが"},{"w":"attending","p":"現在分詞","m":"参加している"},{"w":"sign in","p":"熟語","m":"記帳する"},{"w":"wristband","p":"名詞","m":"リストバンド"}]},{"id":502,"category":"代名詞問題・トレーニング","question":"The Human Resources department has received more than 20 résumés so far, but ______ are qualified for the position.","A":"nothing","B":"few","C":"someone","D":"every","answer":"B","answer_word":"few","explanation":"■ 文の骨格\nThe Human Resources department has received more than 20 résumés so far, but ______ are qualified for the position.\n\n■ 空所に入るもの\n述語動詞 are に対応する複数扱いの主語が必要で、前半と逆接になる意味の語が入る。\n→ 空所には「複数扱いの主語になる代名詞」が必要です。\n\n■ 選択肢の確認\n(A) nothing … 代名詞（単数扱い）「何も〜ない」 ×\n(B) few … 代名詞（複数扱い）「ほとんど〜ない」 ○\n(C) someone … 代名詞（単数扱い）「誰か」 ×\n(D) every … 形容詞「すべての」 ×\n\n■ 完成文\nThe Human Resources department has received more than 20 résumés so far, but few are qualified for the position.\n（人事部はこれまでに20通以上の履歴書を受け取ったが、その職に適任な人はほとんどいない。）\n\n■ 解き方のポイント\nfew は可算名詞を受けて「ほとんどない」。動詞 are から複数扱いと分かる。","words":[{"w":"résumés","p":"名詞","m":"履歴書"},{"w":"so far","p":"熟語","m":"これまでに"},{"w":"few","p":"代名詞","m":"ほとんど〜ない"},{"w":"qualified","p":"形容詞","m":"適任の"}]},{"id":503,"category":"代名詞問題・実戦問題","question":"Less than 40 percent of all physicians in Wichita are employed as full-time staff by the hospitals where ______ practice.","A":"they","B":"their","C":"them","D":"themselves","answer":"A","answer_word":"they","explanation":"■ 文の骨格\nLess than 40 percent of all physicians in Wichita are employed as full-time staff by the hospitals where ______ practice.\n\n■ 空所に入るもの\nwhere 以下は完全な節になる必要があり、動詞 practice の主語が欠けている。\n→ 空所には「関係副詞節の主語になる主格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) they … 主格の代名詞「彼らは」 ○\n(B) their … 所有格「彼らの」 ×\n(C) them … 目的格の代名詞「彼らを」 ×\n(D) themselves … 再帰代名詞「彼ら自身」 ×\n\n■ 完成文\nLess than 40 percent of all physicians in Wichita are employed as full-time staff by the hospitals where they practice.\n（ウィチタの医師のうち40％未満が、自らが勤務する病院に常勤職員として雇用されている。）\n\n■ 解き方のポイント\n関係副詞 where の後ろは完全な文。主語が欠けていれば主格の代名詞。","words":[{"w":"physicians","p":"名詞","m":"医師"},{"w":"employed","p":"動詞（過去分詞）","m":"雇用される"},{"w":"full-time","p":"形容詞","m":"常勤の"},{"w":"practice","p":"動詞","m":"（医師として）診療する"}]},{"id":504,"category":"代名詞問題・実戦問題","question":"Personnel at the manufacturing facility are required to have identification cards with ______ at all times.","A":"they","B":"their","C":"them","D":"theirs","answer":"C","answer_word":"them","explanation":"■ 文の骨格\nPersonnel at the manufacturing facility are required to have identification cards with ______ at all times.\n\n■ 空所に入るもの\n前置詞 with の後ろなので、目的格の代名詞が必要。\n→ 空所には「前置詞の目的語になる目的格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) they … 主格の代名詞「彼らは」 ×\n(B) their … 所有格「彼らの」 ×\n(C) them … 目的格の代名詞「彼らを」 ○\n(D) theirs … 所有代名詞「彼らのもの」 ×\n\n■ 完成文\nPersonnel at the manufacturing facility are required to have identification cards with them at all times.\n（製造施設の職員は、常に身分証を携帯することが求められている。）\n\n■ 解き方のポイント\nhave X with one＝「Xを携帯している」。前置詞の後ろは目的格。","words":[{"w":"Personnel","p":"名詞","m":"職員"},{"w":"manufacturing facility","p":"名詞","m":"製造施設"},{"w":"identification cards","p":"名詞","m":"身分証"},{"w":"at all times","p":"熟語","m":"常に"}]},{"id":505,"category":"代名詞問題・実戦問題","question":"As the seminar was understaffed, Ms. Tahara offered to distribute the documents ______ in order to save time.","A":"she","B":"her","C":"hers","D":"herself","answer":"D","answer_word":"herself","explanation":"■ 文の骨格\nAs the seminar was understaffed, Ms. Tahara offered to distribute the documents ______ in order to save time.\n\n■ 空所に入るもの\ndistribute the documents で動詞と目的語がそろっており、主語を強調する語が入る。\n→ 空所には「主語を強調する再帰代名詞」が必要です。\n\n■ 選択肢の確認\n(A) she … 主格の代名詞「彼女は」 ×\n(B) her … 目的格の代名詞「彼女を」 ×\n(C) hers … 所有代名詞「彼女のもの」 ×\n(D) herself … 再帰代名詞「彼女自身が」 ○\n\n■ 完成文\nAs the seminar was understaffed, Ms. Tahara offered to distribute the documents herself in order to save time.\n（セミナーは人手が足りなかったので、Tahara さんは時間を節約するため自ら資料を配ると申し出た。）\n\n■ 解き方のポイント\n文が完成している位置に入る代名詞は、強調の再帰代名詞。","words":[{"w":"understaffed","p":"形容詞","m":"人手不足の"},{"w":"offered","p":"動詞（過去形）","m":"申し出た"},{"w":"distribute","p":"動詞","m":"配る"},{"w":"save time","p":"熟語","m":"時間を節約する"}]},{"id":506,"category":"代名詞問題・実戦問題","question":"Steady sales of the new digital camera have been attributed to ______ high picture quality.","A":"its","B":"them","C":"itself","D":"theirs","answer":"A","answer_word":"its","explanation":"■ 文の骨格\nSteady sales of the new digital camera have been attributed to ______ high picture quality.\n\n■ 空所に入るもの\n空所の後ろに名詞句 high picture quality があるので、所有格が必要。\n→ 空所には「名詞を修飾する所有格」が必要です。\n\n■ 選択肢の確認\n(A) its … 所有格「その」 ○\n(B) them … 目的格の代名詞「それらを」 ×\n(C) itself … 再帰代名詞「それ自身」 ×\n(D) theirs … 所有代名詞「彼らのもの」 ×\n\n■ 完成文\nSteady sales of the new digital camera have been attributed to its high picture quality.\n（新型デジタルカメラの安定した売上は、その高い画質によるものとされている。）\n\n■ 解き方のポイント\n〈空所＋名詞〉なら所有格。単数の the camera を受けるので its。","words":[{"w":"Steady","p":"形容詞","m":"安定した"},{"w":"attributed to","p":"熟語","m":"〜によるものとされる"},{"w":"picture quality","p":"名詞","m":"画質"}]},{"id":507,"category":"代名詞問題・実戦問題","question":"Instead of purchasing ______, Mr. Filbert decided to lease photocopiers for his new office.","A":"them","B":"themselves","C":"their","D":"theirs","answer":"A","answer_word":"them","explanation":"■ 文の骨格\nInstead of purchasing ______, Mr. Filbert decided to lease photocopiers for his new office.\n\n■ 空所に入るもの\n動名詞 purchasing の目的語が必要で、photocopiers を指す代名詞が入る。\n→ 空所には「動名詞の目的語になる目的格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) them … 目的格の代名詞「それらを」 ○\n(B) themselves … 再帰代名詞「それら自身」 ×\n(C) their … 所有格「それらの」 ×\n(D) theirs … 所有代名詞「彼らのもの」 ×\n\n■ 完成文\nInstead of purchasing them, Mr. Filbert decided to lease photocopiers for his new office.\n（Filbert さんは、購入する代わりに新しいオフィス用のコピー機をリースすることにした。）\n\n■ 解き方のポイント\n動詞・動名詞の目的語は目的格。所有格は後ろに名詞が必要。","words":[{"w":"Instead of","p":"熟語","m":"〜の代わりに"},{"w":"purchasing","p":"動名詞","m":"購入すること"},{"w":"lease","p":"動詞","m":"リースする"},{"w":"photocopiers","p":"名詞","m":"コピー機"}]},{"id":508,"category":"代名詞問題・実戦問題","question":"As everyone else on the sales team was out of the office, Mr. Bruno had to take care of all client calls ______.","A":"he","B":"his own","C":"his","D":"himself","answer":"D","answer_word":"himself","explanation":"■ 文の骨格\nAs everyone else on the sales team was out of the office, Mr. Bruno had to take care of all client calls ______.\n\n■ 空所に入るもの\ntake care of all client calls で文の要素が完成しており、主語を強調する語が入る。\n→ 空所には「主語を強調する再帰代名詞」が必要です。\n\n■ 選択肢の確認\n(A) he … 主格の代名詞「彼は」 ×\n(B) his own … 所有格＋own「彼自身の」 ×\n(C) his … 所有格・所有代名詞「彼の／彼のもの」 ×\n(D) himself … 再帰代名詞「彼自身が」 ○\n\n■ 完成文\nAs everyone else on the sales team was out of the office, Mr. Bruno had to take care of all client calls himself.\n（営業チームのほかの全員が外出していたので、Bruno さんは顧客からの電話すべてに自分で対応しなければならなかった。）\n\n■ 解き方のポイント\n文末の空所で文がすでに完成していれば、強調の再帰代名詞。","words":[{"w":"out of the office","p":"熟語","m":"外出して"},{"w":"take care of","p":"熟語","m":"対応する"},{"w":"client calls","p":"名詞","m":"顧客からの電話"}]},{"id":509,"category":"代名詞問題・実戦問題","question":"Applicants for the position must be able to lift heavy items and move ______ to and from various locations.","A":"they","B":"their","C":"them","D":"themselves","answer":"C","answer_word":"them","explanation":"■ 文の骨格\nApplicants for the position must be able to lift heavy items and move ______ to and from various locations.\n\n■ 空所に入るもの\n他動詞 move の目的語が必要で、heavy items を指す代名詞が入る。\n→ 空所には「動詞の目的語になる目的格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) they … 主格の代名詞「彼らは」 ×\n(B) their … 所有格「彼らの」 ×\n(C) them … 目的格の代名詞「それらを」 ○\n(D) themselves … 再帰代名詞「彼ら自身」 ×\n\n■ 完成文\nApplicants for the position must be able to lift heavy items and move them to and from various locations.\n（この職の応募者は、重い物を持ち上げ、それをさまざまな場所へ運ぶことができなければならない。）\n\n■ 解き方のポイント\nthemselves にすると「応募者自身が移動する」となり文意が変わる。何を指すかを確認する。","words":[{"w":"Applicants","p":"名詞","m":"応募者"},{"w":"lift","p":"動詞","m":"持ち上げる"},{"w":"heavy items","p":"名詞","m":"重い物"},{"w":"various locations","p":"名詞","m":"さまざまな場所"}]},{"id":510,"category":"代名詞問題・実戦問題","question":"Participants at the workshop will be served a complimentary lunch but will have to make dinner arrangements ______.","A":"itself","B":"themselves","C":"ourselves","D":"yourself","answer":"B","answer_word":"themselves","explanation":"■ 文の骨格\nParticipants at the workshop will be served a complimentary lunch but will have to make dinner arrangements ______.\n\n■ 空所に入るもの\nmake dinner arrangements で動詞と目的語がそろっており、主語を強調する語が入る。\n→ 空所には「主語を強調する再帰代名詞」が必要です。\n\n■ 選択肢の確認\n(A) itself … 再帰代名詞（単数・物）「それ自身」 ×\n(B) themselves … 再帰代名詞（複数）「彼ら自身で」 ○\n(C) ourselves … 再帰代名詞（一人称複数）「私たち自身で」 ×\n(D) yourself … 再帰代名詞（二人称単数）「あなた自身で」 ×\n\n■ 完成文\nParticipants at the workshop will be served a complimentary lunch but will have to make dinner arrangements themselves.\n（ワークショップの参加者には無料の昼食が提供されるが、夕食は各自で手配しなければならない。）\n\n■ 解き方のポイント\n再帰代名詞は主語と人称・数を一致させる。主語は Participants（三人称複数）。","words":[{"w":"Participants","p":"名詞","m":"参加者"},{"w":"complimentary","p":"形容詞","m":"無料の"},{"w":"arrangements","p":"名詞","m":"手配"}]},{"id":511,"category":"代名詞問題・実戦問題","question":"The assembly line supervisor is working on the work schedule and will forward it to all of ______ by the end of the week.","A":"us","B":"our","C":"we","D":"ourselves","answer":"A","answer_word":"us","explanation":"■ 文の骨格\nThe assembly line supervisor is working on the work schedule and will forward it to all of ______ by the end of the week.\n\n■ 空所に入るもの\nall of の後ろは前置詞の目的語なので、目的格の代名詞が必要。\n→ 空所には「前置詞の目的語になる目的格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) us … 目的格の代名詞「私たちを」 ○\n(B) our … 所有格「私たちの」 ×\n(C) we … 主格の代名詞「私たちは」 ×\n(D) ourselves … 再帰代名詞「私たち自身」 ×\n\n■ 完成文\nThe assembly line supervisor is working on the work schedule and will forward it to all of us by the end of the week.\n（組立ラインの監督者が勤務表を作成中で、今週末までに私たち全員へ転送する。）\n\n■ 解き方のポイント\nall of／both of／some of の後ろは目的格。","words":[{"w":"assembly line","p":"名詞","m":"組立ライン"},{"w":"supervisor","p":"名詞","m":"監督者"},{"w":"forward","p":"動詞","m":"転送する"},{"w":"work schedule","p":"名詞","m":"勤務表"}]},{"id":512,"category":"代名詞問題・実戦問題","question":"Sunflower Media will issue a formal statement this afternoon confirming ______ acquisition of the Tokyo Daily.","A":"itself","B":"its","C":"ours","D":"us","answer":"B","answer_word":"its","explanation":"■ 文の骨格\nSunflower Media will issue a formal statement this afternoon confirming ______ acquisition of the Tokyo Daily.\n\n■ 空所に入るもの\n空所の後ろに名詞 acquisition があるので、所有格が必要。\n→ 空所には「名詞を修飾する所有格」が必要です。\n\n■ 選択肢の確認\n(A) itself … 再帰代名詞「それ自身」 ×\n(B) its … 所有格「その」 ○\n(C) ours … 所有代名詞「私たちのもの」 ×\n(D) us … 目的格の代名詞「私たちを」 ×\n\n■ 完成文\nSunflower Media will issue a formal statement this afternoon confirming its acquisition of the Tokyo Daily.\n（Sunflower Media 社は今日の午後、Tokyo Daily 紙の買収を認める正式声明を発表する。）\n\n■ 解き方のポイント\n〈空所＋名詞〉は所有格。会社は単数扱いなので its。","words":[{"w":"issue","p":"動詞","m":"発表する"},{"w":"formal statement","p":"名詞","m":"正式声明"},{"w":"confirming","p":"現在分詞","m":"認める"},{"w":"acquisition","p":"名詞","m":"買収"}]},{"id":513,"category":"代名詞問題・実戦問題","question":"The furniture they bought was too heavy for Mr. Baker and Ms. Roberts to move by ______.","A":"their","B":"theirs","C":"themselves","D":"their own","answer":"C","answer_word":"themselves","explanation":"■ 文の骨格\nThe furniture they bought was too heavy for Mr. Baker and Ms. Roberts to move by ______.\n\n■ 空所に入るもの\nby oneself（自分たちだけで）という慣用表現になる。\n→ 空所には「by oneself の形をつくる再帰代名詞」が必要です。\n\n■ 選択肢の確認\n(A) their … 所有格「彼らの」 ×\n(B) theirs … 所有代名詞「彼らのもの」 ×\n(C) themselves … 再帰代名詞「彼ら自身」 ○\n(D) their own … 所有格＋own「彼ら自身の」 ×\n\n■ 完成文\nThe furniture they bought was too heavy for Mr. Baker and Ms. Roberts to move by themselves.\n（彼らが買った家具は重すぎて、Baker さんと Roberts さんだけでは動かせなかった。）\n\n■ 解き方のポイント\nby oneself＝「自分（たち）だけで」。on one's own もほぼ同義。","words":[{"w":"furniture","p":"名詞","m":"家具"},{"w":"too ... to","p":"熟語","m":"〜すぎて…できない"},{"w":"by themselves","p":"熟語","m":"自分たちだけで"}]},{"id":514,"category":"代名詞問題・実戦問題","question":"Ms. Gao requested that the department staff send ______ the final draft of the sales report before submitting it to management.","A":"she","B":"her","C":"hers","D":"herself","answer":"B","answer_word":"her","explanation":"■ 文の骨格\nMs. Gao requested that the department staff send ______ the final draft of the sales report before submitting it to management.\n\n■ 空所に入るもの\nsend＋人＋物 の形で、空所は「人」にあたる間接目的語。\n→ 空所には「間接目的語になる目的格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) she … 主格の代名詞「彼女は」 ×\n(B) her … 目的格の代名詞「彼女に」 ○\n(C) hers … 所有代名詞「彼女のもの」 ×\n(D) herself … 再帰代名詞「彼女自身」 ×\n\n■ 完成文\nMs. Gao requested that the department staff send her the final draft of the sales report before submitting it to management.\n（Gao さんは部署の職員に対し、営業報告書の最終稿を経営陣へ提出する前に自分へ送るよう求めた。）\n\n■ 解き方のポイント\nsend／give／show などは〈人＋物〉の語順を取る。人の位置は目的格。","words":[{"w":"requested","p":"動詞（過去形）","m":"求めた"},{"w":"final draft","p":"名詞","m":"最終稿"},{"w":"sales report","p":"名詞","m":"営業報告書"},{"w":"management","p":"名詞","m":"経営陣"}]},{"id":515,"category":"代名詞問題・実戦問題","question":"Before Lucia Gomez and Daniel White moved to their offices on the first floor, both of ______ had been working on the second floor.","A":"they","B":"their","C":"them","D":"theirs","answer":"C","answer_word":"them","explanation":"■ 文の骨格\nBefore Lucia Gomez and Daniel White moved to their offices on the first floor, both of ______ had been working on the second floor.\n\n■ 空所に入るもの\nboth of の後ろは前置詞の目的語なので、目的格の代名詞が必要。\n→ 空所には「前置詞の目的語になる目的格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) they … 主格の代名詞「彼らは」 ×\n(B) their … 所有格「彼らの」 ×\n(C) them … 目的格の代名詞「彼らを」 ○\n(D) theirs … 所有代名詞「彼らのもの」 ×\n\n■ 完成文\nBefore Lucia Gomez and Daniel White moved to their offices on the first floor, both of them had been working on the second floor.\n（Lucia Gomez と Daniel White が1階の執務室へ移る前は、2人とも2階で働いていた。）\n\n■ 解き方のポイント\nboth of them／all of us のように、of の後ろは必ず目的格。","words":[{"w":"moved","p":"動詞（過去形）","m":"移った"},{"w":"offices","p":"名詞","m":"執務室"},{"w":"both of","p":"熟語","m":"〜の両方"}]},{"id":516,"category":"代名詞問題・実戦問題","question":"Ms. Smith's decision to resign in advance of her contract expiration next summer was ______ own rather than a request from the CEO.","A":"she","B":"her","C":"hers","D":"herself","answer":"B","answer_word":"her","explanation":"■ 文の骨格\nMs. Smith's decision to resign in advance of her contract expiration next summer was ______ own rather than a request from the CEO.\n\n■ 空所に入るもの\nown の直前には必ず所有格が置かれる。\n→ 空所には「own の前に置く所有格」が必要です。\n\n■ 選択肢の確認\n(A) she … 主格の代名詞「彼女は」 ×\n(B) her … 所有格「彼女の」 ○\n(C) hers … 所有代名詞「彼女のもの」 ×\n(D) herself … 再帰代名詞「彼女自身」 ×\n\n■ 完成文\nMs. Smith's decision to resign in advance of her contract expiration next summer was her own rather than a request from the CEO.\n（来夏の契約満了を前に辞任するという Smith さんの決断は、CEO からの要請ではなく彼女自身のものだった。）\n\n■ 解き方のポイント\nown の前は所有格（my own／her own／their own）。所有代名詞は置けない。","words":[{"w":"decision","p":"名詞","m":"決断"},{"w":"resign","p":"動詞","m":"辞任する"},{"w":"in advance of","p":"熟語","m":"〜に先立って"},{"w":"expiration","p":"名詞","m":"満了"}]},{"id":517,"category":"代名詞問題・実戦問題","question":"The CEO, Mr. Wozniak, has shown ______ to have a polished manner, confidence as a speaker, and the ability to make a deep impression on audiences.","A":"he","B":"his","C":"him","D":"himself","answer":"D","answer_word":"himself","explanation":"■ 文の骨格\nThe CEO, Mr. Wozniak, has shown ______ to have a polished manner, confidence as a speaker, and the ability to make a deep impression on audiences.\n\n■ 空所に入るもの\nshow oneself to be [do]（自らが〜であると示す）の形で、主語と同一人物を指す。\n→ 空所には「show の目的語になる再帰代名詞」が必要です。\n\n■ 選択肢の確認\n(A) he … 主格の代名詞「彼は」 ×\n(B) his … 所有格・所有代名詞「彼の／彼のもの」 ×\n(C) him … 目的格の代名詞「彼を」 ×\n(D) himself … 再帰代名詞「彼自身を」 ○\n\n■ 完成文\nThe CEO, Mr. Wozniak, has shown himself to have a polished manner, confidence as a speaker, and the ability to make a deep impression on audiences.\n（CEO の Wozniak 氏は、洗練された物腰、話し手としての自信、聴衆に強い印象を与える力を備えていることを自ら示してきた。）\n\n■ 解き方のポイント\n主語と目的語が同一人物なら再帰代名詞。him だと別人になる。","words":[{"w":"polished","p":"形容詞","m":"洗練された"},{"w":"manner","p":"名詞","m":"物腰"},{"w":"confidence","p":"名詞","m":"自信"},{"w":"impression","p":"名詞","m":"印象"}]},{"id":518,"category":"代名詞問題・実戦問題","question":"Working for a publisher in Mumbai and later for ______ company, Tiger Books, Mr. Singh translated scores of major Indian novels into English.","A":"he","B":"him","C":"himself","D":"his own","answer":"D","answer_word":"his own","explanation":"■ 文の骨格\nWorking for a publisher in Mumbai and later for ______ company, Tiger Books, Mr. Singh translated scores of major Indian novels into English.\n\n■ 空所に入るもの\n空所の後ろに名詞 company があり、「彼自身の会社」を表す形が必要。\n→ 空所には「名詞を修飾する〈所有格＋own〉」が必要です。\n\n■ 選択肢の確認\n(A) he … 主格の代名詞「彼は」 ×\n(B) him … 目的格の代名詞「彼を」 ×\n(C) himself … 再帰代名詞「彼自身」 ×\n(D) his own … 所有格＋own「彼自身の」 ○\n\n■ 完成文\nWorking for a publisher in Mumbai and later for his own company, Tiger Books, Mr. Singh translated scores of major Indian novels into English.\n（ムンバイの出版社で、のちには自身の会社 Tiger Books で働きながら、Singh 氏は多くの主要なインド小説を英語に翻訳した。）\n\n■ 解き方のポイント\n〈空所＋名詞〉なので所有格を含む形。his own＝「彼自身の」。","words":[{"w":"publisher","p":"名詞","m":"出版社"},{"w":"his own","p":"所有表現","m":"彼自身の"},{"w":"translated","p":"動詞（過去形）","m":"翻訳した"},{"w":"scores of","p":"熟語","m":"多数の"}]},{"id":519,"category":"代名詞問題・実戦問題","question":"Given ______ many years of experience in customer service, Ms. Mori is well qualified for the position.","A":"she","B":"her","C":"hers","D":"herself","answer":"B","answer_word":"her","explanation":"■ 文の骨格\nGiven ______ many years of experience in customer service, Ms. Mori is well qualified for the position.\n\n■ 空所に入るもの\n空所の後ろに名詞句 many years of experience があるので、所有格が必要。\n→ 空所には「名詞句を修飾する所有格」が必要です。\n\n■ 選択肢の確認\n(A) she … 主格の代名詞「彼女は」 ×\n(B) her … 所有格「彼女の」 ○\n(C) hers … 所有代名詞「彼女のもの」 ×\n(D) herself … 再帰代名詞「彼女自身」 ×\n\n■ 完成文\nGiven her many years of experience in customer service, Ms. Mori is well qualified for the position.\n（顧客サービスでの長年の経験を考えれば、Mori さんはその職に十分ふさわしい。）\n\n■ 解き方のポイント\n〈空所＋名詞〉は所有格。Given＋名詞＝「〜を考えると」。","words":[{"w":"Given","p":"前置詞","m":"〜を考えると"},{"w":"customer service","p":"名詞","m":"顧客サービス"},{"w":"qualified","p":"形容詞","m":"ふさわしい"},{"w":"position","p":"名詞","m":"職"}]},{"id":520,"category":"代名詞問題・実戦問題","question":"Richard Martinez spent over 20 years in the food service industry before deciding to open a restaurant on ______.","A":"he","B":"him","C":"himself","D":"his own","answer":"D","answer_word":"his own","explanation":"■ 文の骨格\nRichard Martinez spent over 20 years in the food service industry before deciding to open a restaurant on ______.\n\n■ 空所に入るもの\non one's own（独力で）という慣用表現になる。\n→ 空所には「on one's own の形をつくる表現」が必要です。\n\n■ 選択肢の確認\n(A) he … 主格の代名詞「彼は」 ×\n(B) him … 目的格の代名詞「彼を」 ×\n(C) himself … 再帰代名詞「彼自身」 ×\n(D) his own … 所有格＋own「彼自身の力で」 ○\n\n■ 完成文\nRichard Martinez spent over 20 years in the food service industry before deciding to open a restaurant on his own.\n（Richard Martinez は外食産業で20年以上働いたのち、独力でレストランを開くことを決めた。）\n\n■ 解き方のポイント\non one's own＝「独力で」。by oneself と混同しやすいので前置詞で覚える。","words":[{"w":"food service industry","p":"名詞","m":"外食産業"},{"w":"deciding","p":"動名詞","m":"決めること"},{"w":"on his own","p":"熟語","m":"独力で"}]},{"id":521,"category":"代名詞問題・実戦問題","question":"International companies such as ______ often need to hire financial specialists because of the different regulations that exist in various countries.","A":"our","B":"itself","C":"ours","D":"we","answer":"C","answer_word":"ours","explanation":"■ 文の骨格\nInternational companies such as ______ often need to hire financial specialists because of the different regulations that exist in various countries.\n\n■ 空所に入るもの\nsuch as の後ろで単独で「私たちの会社」を表す語が必要。\n→ 空所には「単独で名詞として働く所有代名詞」が必要です。\n\n■ 選択肢の確認\n(A) our … 所有格「私たちの」 ×\n(B) itself … 再帰代名詞「それ自身」 ×\n(C) ours … 所有代名詞「私たちのもの（＝当社）」 ○\n(D) we … 主格の代名詞「私たちは」 ×\n\n■ 完成文\nInternational companies such as ours often need to hire financial specialists because of the different regulations that exist in various countries.\n（当社のような国際企業は、国ごとに異なる規制があるため、財務の専門家を雇う必要がしばしばある。）\n\n■ 解き方のポイント\n所有代名詞（ours／theirs）は〈所有格＋名詞〉のかたまりを1語で表す。","words":[{"w":"International companies","p":"名詞","m":"国際企業"},{"w":"ours","p":"所有代名詞","m":"当社（のもの）"},{"w":"financial specialists","p":"名詞","m":"財務の専門家"},{"w":"regulations","p":"名詞","m":"規制"}]},{"id":522,"category":"代名詞問題・実戦問題","question":"The printing company provides a design service for catalogs and brochures that clients cannot fully develop ______.","A":"they","B":"their","C":"them","D":"themselves","answer":"D","answer_word":"themselves","explanation":"■ 文の骨格\nThe printing company provides a design service for catalogs and brochures that clients cannot fully develop ______.\n\n■ 空所に入るもの\nclients cannot fully develop まで文の要素がそろっており、主語を強調する語が入る。\n→ 空所には「主語を強調する再帰代名詞」が必要です。\n\n■ 選択肢の確認\n(A) they … 主格の代名詞「彼らは」 ×\n(B) their … 所有格「彼らの」 ×\n(C) them … 目的格の代名詞「彼らを」 ×\n(D) themselves … 再帰代名詞「彼ら自身で」 ○\n\n■ 完成文\nThe printing company provides a design service for catalogs and brochures that clients cannot fully develop themselves.\n（その印刷会社は、顧客が自分たちだけでは十分に作れないカタログやパンフレットのデザインサービスを提供している。）\n\n■ 解き方のポイント\n関係詞節の目的語（that）はすでにあるので、空所は強調の再帰代名詞。","words":[{"w":"printing company","p":"名詞","m":"印刷会社"},{"w":"brochures","p":"名詞","m":"パンフレット"},{"w":"clients","p":"名詞","m":"顧客"},{"w":"develop","p":"動詞","m":"作り上げる"}]},{"id":523,"category":"代名詞問題・実戦問題","question":"For ______ interested in flower arrangement, Maya Li will be providing an introductory course in the first week of May.","A":"they","B":"their","C":"them","D":"those","answer":"D","answer_word":"those","explanation":"■ 文の骨格\nFor ______ interested in flower arrangement, Maya Li will be providing an introductory course in the first week of May.\n\n■ 空所に入るもの\n前置詞 For の目的語で、後ろの形容詞句 interested in ... に修飾される代名詞が必要。\n→ 空所には「分詞句に修飾される代名詞」が必要です。\n\n■ 選択肢の確認\n(A) they … 主格の代名詞「彼らは」 ×\n(B) their … 所有格「彼らの」 ×\n(C) them … 目的格の代名詞「彼らを」 ×\n(D) those … 代名詞「〜する人々」 ○\n\n■ 完成文\nFor those interested in flower arrangement, Maya Li will be providing an introductory course in the first week of May.\n（フラワーアレンジメントに関心のある方に向けて、Maya Li が5月第1週に入門講座を開く。）\n\n■ 解き方のポイント\nthose who ...／those＋分詞＝「〜する人々」。them は後ろから修飾できない。","words":[{"w":"those","p":"代名詞","m":"〜する人々"},{"w":"interested in","p":"熟語","m":"〜に関心のある"},{"w":"flower arrangement","p":"名詞","m":"フラワーアレンジメント"}
