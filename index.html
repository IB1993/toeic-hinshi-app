m … 前置詞「〜から」 ×\n(D) throughout … 前置詞「〜の至る所に」 ×\n\n■ 完成文\nHoffman Corporation's annual meeting for shareholders will be held on Wednesday, December 22 at 1:00 P.M.\n（Hoffman 社の株主向け年次総会は、12月22日水曜日の午後1時に開催される。）\n\n■ 解き方のポイント\nfor は「〜のための、〜向けの」と対象を表す。","words":[{"w":"annual meeting","p":"名詞","m":"年次総会"},{"w":"for","p":"前置詞","m":"〜のための"},{"w":"shareholders","p":"名詞","m":"株主"},{"w":"held","p":"動詞（過去分詞）","m":"開催される"}]},{"id":858,"category":"文法模試セット11","question":"When sending staff members overseas, it is essential that companies take ______ measures to ensure their employees' health.","A":"prevent","B":"prevents","C":"preventive","D":"prevented","answer":"C","answer_word":"preventive","explanation":"■ 文の骨格\nWhen sending staff members overseas, it is essential that companies take ______ measures to ensure their employees' health.\n\n■ 空所に入るもの\n他動詞 take の目的語 measures を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) prevent … 動詞（原形）「防ぐ」 ×\n(B) prevents … 動詞（三人称単数現在形）「防ぐ」 ×\n(C) preventive … 形容詞「予防的な」 ○\n(D) prevented … 動詞の過去形・過去分詞「防がれた」 ×\n\n■ 完成文\nWhen sending staff members overseas, it is essential that companies take preventive measures to ensure their employees' health.\n（職員を海外に派遣する際、企業が従業員の健康を守る予防策を講じることが不可欠だ。）\n\n■ 解き方のポイント\ntake preventive measures＝「予防策を講じる」。名詞の前は形容詞。","words":[{"w":"overseas","p":"副詞","m":"海外へ"},{"w":"essential","p":"形容詞","m":"不可欠な"},{"w":"preventive measures","p":"名詞","m":"予防策"},{"w":"ensure","p":"動詞","m":"確保する"}]},{"id":859,"category":"文法模試セット11","question":"The CEO will review the third-quarter sales reports ______ they are submitted to the auditing firm.","A":"upon","B":"before","C":"around","D":"from","answer":"B","answer_word":"before","explanation":"■ 文の骨格\nThe CEO will review the third-quarter sales reports ______ they are submitted to the auditing firm.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、時の前後関係を表す接続詞が必要。\n→ 空所には「時を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) upon … 前置詞「〜するとすぐに」 ×\n(B) before … 接続詞「〜する前に」 ○\n(C) around … 前置詞「〜のあたりに」 ×\n(D) from … 前置詞「〜から」 ×\n\n■ 完成文\nThe CEO will review the third-quarter sales reports before they are submitted to the auditing firm.\n（CEO は、第3四半期の売上報告書が監査法人へ提出される前に確認する。）\n\n■ 解き方のポイント\n後ろが〈主語＋動詞〉なら接続詞。upon は前置詞で名詞・動名詞を取る。","words":[{"w":"review","p":"動詞","m":"確認する"},{"w":"third-quarter","p":"形容詞","m":"第3四半期の"},{"w":"submitted","p":"動詞（過去分詞）","m":"提出される"},{"w":"auditing firm","p":"名詞","m":"監査法人"}]},{"id":860,"category":"文法模試セット11","question":"The manufacturer ______ set its prices below cost in an effort to drive out a competitor.","A":"deliberate","B":"deliberated","C":"deliberately","D":"deliberation","answer":"C","answer_word":"deliberately","explanation":"■ 文の骨格\nThe manufacturer ______ set its prices below cost in an effort to drive out a competitor.\n\n■ 空所に入るもの\n主語 The manufacturer と述語動詞 set の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) deliberate … 形容詞「意図的な」 ×\n(B) deliberated … 動詞の過去形・過去分詞「熟考した」 ×\n(C) deliberately … 副詞「意図的に」 ○\n(D) deliberation … 名詞「熟考」 ×\n\n■ 完成文\nThe manufacturer deliberately set its prices below cost in an effort to drive out a competitor.\n（そのメーカーは競合を締め出そうとして、意図的に価格を原価以下に設定した。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉は副詞の定位置。","words":[{"w":"manufacturer","p":"名詞","m":"メーカー"},{"w":"deliberately","p":"副詞","m":"意図的に"},{"w":"below cost","p":"熟語","m":"原価以下で"},{"w":"drive out","p":"熟語","m":"締め出す"}]},{"id":861,"category":"文法模試セット11","question":"Popular jazz singer Olivia Price will be holding two concerts in Tokyo in April, ______ an announcement on her Web site.","A":"if only","B":"provided that","C":"according to","D":"even though","answer":"C","answer_word":"according to","explanation":"■ 文の骨格\nPopular jazz singer Olivia Price will be holding two concerts in Tokyo in April, ______ an announcement on her Web site.\n\n■ 空所に入るもの\n空所の後ろが名詞句 an announcement なので、前置詞が必要。\n→ 空所には「名詞句を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) if only … 接続詞（群）「〜でありさえすれば」 ×\n(B) provided that … 接続詞（群）「〜という条件で」 ×\n(C) according to … 群前置詞「〜によれば」 ○\n(D) even though … 接続詞（群）「〜だけれども」 ×\n\n■ 完成文\nPopular jazz singer Olivia Price will be holding two concerts in Tokyo in April, according to an announcement on her Web site.\n（彼女のウェブサイトの告知によれば、人気ジャズ歌手の Olivia Price は4月に東京で2回のコンサートを開く。）\n\n■ 解き方のポイント\naccording to＋名詞＝「〜によれば」。情報源を示す。","words":[{"w":"holding","p":"現在分詞","m":"開催している"},{"w":"according to","p":"熟語","m":"〜によれば"},{"w":"announcement","p":"名詞","m":"告知"}]},{"id":862,"category":"文法模試セット11","question":"The company ______ that the national advertising campaign had not generated the expected results.","A":"was concluded","B":"have concluded","C":"concluding","D":"concluded","answer":"D","answer_word":"concluded","explanation":"■ 文の骨格\nThe company ______ that the national advertising campaign had not generated the expected results.\n\n■ 空所に入るもの\n直後に that 節があるので能動態が必要。主語は単数。\n→ 空所には「that 節を目的語に取る能動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) was concluded … 受動態（過去）「結論づけられた」 ×\n(B) have concluded … 現在完了形（複数対応）「結論づけた」 ×\n(C) concluding … 現在分詞・動名詞「結論づけること」 ×\n(D) concluded … 動詞（過去形・能動）「結論づけた」 ○\n\n■ 完成文\nThe company concluded that the national advertising campaign had not generated the expected results.\n（その会社は、全国広告キャンペーンが期待した成果を生まなかったと結論づけた。）\n\n■ 解き方のポイント\n直後に that 節（目的語）があれば能動態。主語 The company は単数。","words":[{"w":"concluded","p":"動詞（過去形）","m":"結論づけた"},{"w":"national","p":"形容詞","m":"全国的な"},{"w":"generated","p":"動詞（過去分詞）","m":"生み出した"},{"w":"expected results","p":"名詞","m":"期待した成果"}]},{"id":863,"category":"文法模試セット12","question":"The meeting this afternoon will be held in the conference room on the fourth floor at 3 P.M. ______.","A":"precise","B":"most precise","C":"more precisely","D":"precisely","answer":"D","answer_word":"precisely","explanation":"■ 文の骨格\nThe meeting this afternoon will be held in the conference room on the fourth floor at 3 P.M. ______.\n\n■ 空所に入るもの\n文の要素がそろっており、at 3 P.M. を補足する副詞が入る。\n→ 空所には「時刻表現を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) precise … 形容詞「正確な」 ×\n(B) most precise … 形容詞（最上級）「最も正確な」 ×\n(C) more precisely … 副詞（比較級）「より正確に」 ×\n(D) precisely … 副詞「ちょうど」 ○\n\n■ 完成文\nThe meeting this afternoon will be held in the conference room on the fourth floor at 3 P.M. precisely.\n（今日の午後の会議は、4階の会議室でちょうど3時に開かれる。）\n\n■ 解き方のポイント\n文が完成している位置の空所は副詞。at 3 P.M. precisely＝「3時ちょうどに」。","words":[{"w":"conference room","p":"名詞","m":"会議室"},{"w":"precisely","p":"副詞","m":"ちょうど"},{"w":"held","p":"動詞（過去分詞）","m":"開かれる"}]},{"id":864,"category":"文法模試セット12","question":"Applicants for the position are expected to be ______ in English, although no certificate is required.","A":"proficient","B":"proficiently","C":"proficiency","D":"more proficiently","answer":"A","answer_word":"proficient","explanation":"■ 文の骨格\nApplicants for the position are expected to be ______ in English, although no certificate is required.\n\n■ 空所に入るもの\nto be の後ろで、in と結びついて意味が通る形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) proficient … 形容詞「堪能な」 ○\n(B) proficiently … 副詞「堪能に」 ×\n(C) proficiency … 名詞「熟達」 ×\n(D) more proficiently … 副詞（比較級）「より堪能に」 ×\n\n■ 完成文\nApplicants for the position are expected to be proficient in English, although no certificate is required.\n（資格証は不要だが、この職の応募者は英語に堪能であることが期待される。）\n\n■ 解き方のポイント\nbe proficient in X＝「Xに堪能である」。be動詞の補語は形容詞。","words":[{"w":"Applicants","p":"名詞","m":"応募者"},{"w":"proficient in","p":"熟語","m":"〜に堪能な"},{"w":"certificate","p":"名詞","m":"資格証"}]},{"id":865,"category":"文法模試セット12","question":"We ask that you ______ your mobile phone during the performance as a matter of courtesy to other audience members.","A":"silences","B":"silenced","C":"silence","D":"silencing","answer":"C","answer_word":"silence","explanation":"■ 文の骨格\nWe ask that you ______ your mobile phone during the performance as a matter of courtesy to other audience members.\n\n■ 空所に入るもの\nask that ... の節内では、主語に関係なく動詞が原形になる。\n→ 空所には「ask that 節内の動詞（原形）」が必要です。\n\n■ 選択肢の確認\n(A) silences … 動詞（三人称単数現在形）「静かにする」 ×\n(B) silenced … 動詞の過去形・過去分詞「静かにした」 ×\n(C) silence … 動詞（原形）「消音にする」 ○\n(D) silencing … 現在分詞・動名詞「消音にすること」 ×\n\n■ 完成文\nWe ask that you silence your mobile phone during the performance as a matter of courtesy to other audience members.\n（ほかのお客様への配慮として、公演中は携帯電話を消音にしていただくようお願いします。）\n\n■ 解き方のポイント\nask／request／require／suggest に続く that 節は動詞が原形。","words":[{"w":"silence","p":"動詞","m":"消音にする"},{"w":"performance","p":"名詞","m":"公演"},{"w":"as a matter of courtesy","p":"熟語","m":"礼儀として"},{"w":"audience","p":"名詞","m":"観客"}]},{"id":866,"category":"文法模試セット12","question":"The language school boasts that over 80 percent of its students make significant ______ in both listening and speaking after three months of tuition.","A":"progressive","B":"progress","C":"progressively","D":"progressed","answer":"B","answer_word":"progress","explanation":"■ 文の骨格\nThe language school boasts that over 80 percent of its students make significant ______ in both listening and speaking after three months of tuition.\n\n■ 空所に入るもの\n形容詞 significant に修飾され、他動詞 make の目的語となる名詞が必要。\n→ 空所には「make の目的語になる不可算名詞」が必要です。\n\n■ 選択肢の確認\n(A) progressive … 形容詞「進歩的な」 ×\n(B) progress … 名詞（不可算）「進歩」 ○\n(C) progressively … 副詞「次第に」 ×\n(D) progressed … 動詞の過去形・過去分詞「進歩した」 ×\n\n■ 完成文\nThe language school boasts that over 80 percent of its students make significant progress in both listening and speaking after three months of tuition.\n（その語学学校は、生徒の8割超が3か月の受講後にリスニングとスピーキングの両方で大きな進歩を遂げると謳っている。）\n\n■ 解き方のポイント\nmake progress＝「進歩する」。progress は不可算なので冠詞も複数形も付かない。","words":[{"w":"boasts","p":"動詞","m":"誇る、謳う"},{"w":"significant","p":"形容詞","m":"大きな"},{"w":"progress","p":"名詞","m":"進歩"},{"w":"tuition","p":"名詞","m":"授業、指導"}]},{"id":867,"category":"文法模試セット12","question":"Marketing department staff members are invited to tour the plant to see ______ the quality control procedures are implemented.","A":"during","B":"how","C":"about","D":"whom","answer":"B","answer_word":"how","explanation":"■ 文の骨格\nMarketing department staff members are invited to tour the plant to see ______ the quality control procedures are implemented.\n\n■ 空所に入るもの\nsee の目的語となる名詞節を導き、「どのように」を表す語が必要。\n→ 空所には「名詞節を導く疑問副詞」が必要です。\n\n■ 選択肢の確認\n(A) during … 前置詞「〜の間」 ×\n(B) how … 疑問副詞「どのように」 ○\n(C) about … 前置詞「〜について」 ×\n(D) whom … 関係代名詞（目的格・人）「〜する人を」 ×\n\n■ 完成文\nMarketing department staff members are invited to tour the plant to see how the quality control procedures are implemented.\n（マーケティング部の職員は、品質管理手順がどのように実施されているかを見るため工場見学に招かれている。）\n\n■ 解き方のポイント\nhow＋完全な文 で名詞節をつくる。see の目的語になれる。","words":[{"w":"tour","p":"動詞","m":"見学する"},{"w":"plant","p":"名詞","m":"工場"},{"w":"how","p":"疑問副詞","m":"どのように"},{"w":"quality control","p":"名詞","m":"品質管理"},{"w":"implemented","p":"動詞（過去分詞）","m":"実施される"}]},{"id":868,"category":"文法模試セット12","question":"Brad Jessen presented an ______ to the City Council for heating and air conditioning at the new convention center.","A":"estimate","B":"estimated","C":"estimating","D":"estimates","answer":"A","answer_word":"estimate","explanation":"■ 文の骨格\nBrad Jessen presented an ______ to the City Council for heating and air conditioning at the new convention center.\n\n■ 空所に入るもの\n冠詞 an の後ろで、他動詞 presented の目的語となる単数名詞が必要。\n→ 空所には「presented の目的語になる単数名詞」が必要です。\n\n■ 選択肢の確認\n(A) estimate … 名詞（単数形）「見積書」 ○\n(B) estimated … 動詞の過去形・過去分詞「見積もられた」 ×\n(C) estimating … 現在分詞・動名詞「見積もること」 ×\n(D) estimates … 名詞（複数形）「見積書」 ×\n\n■ 完成文\nBrad Jessen presented an estimate to the City Council for heating and air conditioning at the new convention center.\n（Brad Jessen は、新しいコンベンションセンターの暖房と空調に関する見積書を市議会に提出した。）\n\n■ 解き方のポイント\n冠詞 an があるので単数形。estimate は名詞「見積もり」でも使う。","words":[{"w":"presented","p":"動詞（過去形）","m":"提出した"},{"w":"estimate","p":"名詞","m":"見積書"},{"w":"City Council","p":"名詞","m":"市議会"},{"w":"air conditioning","p":"名詞","m":"空調"}]},{"id":869,"category":"文法模試セット12","question":"Through a translator, Ms. Ivanov spoke with ______ by phone from Moscow about her role in the new film.","A":"we","B":"our","C":"us","D":"ourselves","answer":"C","answer_word":"us","explanation":"■ 文の骨格\nThrough a translator, Ms. Ivanov spoke with ______ by phone from Moscow about her role in the new film.\n\n■ 空所に入るもの\n前置詞 with の後ろなので、目的格の代名詞が必要。\n→ 空所には「前置詞の目的語になる目的格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) we … 主格の代名詞「私たちは」 ×\n(B) our … 所有格「私たちの」 ×\n(C) us … 目的格の代名詞「私たちに」 ○\n(D) ourselves … 再帰代名詞「私たち自身」 ×\n\n■ 完成文\nThrough a translator, Ms. Ivanov spoke with us by phone from Moscow about her role in the new film.\n（通訳を介して、Ivanov さんはモスクワから電話で新作映画での自身の役について私たちに語った。）\n\n■ 解き方のポイント\n前置詞の直後は目的格。主語と別なので再帰代名詞は不可。","words":[{"w":"translator","p":"名詞","m":"通訳"},{"w":"us","p":"目的格の代名詞","m":"私たちに"},{"w":"by phone","p":"熟語","m":"電話で"},{"w":"role","p":"名詞","m":"役"}]},{"id":870,"category":"文法模試セット12","question":"Baliwood Hotel ______ conducts guest surveys to gather information that will help it find what areas of its services need improvement.","A":"regularize","B":"regularizing","C":"regularity","D":"regularly","answer":"D","answer_word":"regularly","explanation":"■ 文の骨格\nBaliwood Hotel ______ conducts guest surveys to gather information that will help it find what areas of its services need improvement.\n\n■ 空所に入るもの\n主語 Baliwood Hotel と述語動詞 conducts の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) regularize … 動詞（原形）「規格化する」 ×\n(B) regularizing … 現在分詞・動名詞「規格化すること」 ×\n(C) regularity … 名詞「規則正しさ」 ×\n(D) regularly … 副詞「定期的に」 ○\n\n■ 完成文\nBaliwood Hotel regularly conducts guest surveys to gather information that will help it find what areas of its services need improvement.\n（Baliwood ホテルは、どのサービス分野に改善が必要かを見つける手がかりを得るため、定期的に宿泊客調査を実施している。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉は副詞の定位置。","words":[{"w":"regularly","p":"副詞","m":"定期的に"},{"w":"conducts","p":"動詞","m":"実施する"},{"w":"guest surveys","p":"名詞","m":"宿泊客調査"},{"w":"improvement","p":"名詞","m":"改善"}]},{"id":871,"category":"文法模試セット12","question":"During the conference, a ______ meal will be served from 3:00 P.M. to 3:30 P.M. in the Tower Café located on the fifth floor.","A":"lightness","B":"lightly","C":"light","D":"lightest","answer":"C","answer_word":"light","explanation":"■ 文の骨格\nDuring the conference, a ______ meal will be served from 3:00 P.M. to 3:30 P.M. in the Tower Café located on the fifth floor.\n\n■ 空所に入るもの\n冠詞 a と名詞 meal の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) lightness … 名詞「軽さ」 ×\n(B) lightly … 副詞「軽く」 ×\n(C) light … 形容詞「軽い」 ○\n(D) lightest … 形容詞（最上級）「最も軽い」 ×\n\n■ 完成文\nDuring the conference, a light meal will be served from 3:00 P.M. to 3:30 P.M. in the Tower Café located on the fifth floor.\n（会議中、5階の Tower Café で午後3時から3時30分まで軽食が提供される。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。最上級は the を伴うので a とは合わない。","words":[{"w":"conference","p":"名詞","m":"会議"},{"w":"light meal","p":"名詞","m":"軽食"},{"w":"served","p":"動詞（過去分詞）","m":"提供される"},{"w":"located","p":"過去分詞","m":"位置している"}]},{"id":872,"category":"文法模試セット12","question":"The company has expanded suddenly, ______ a move to larger premises with a dedicated parking lot.","A":"necessitate","B":"necessitating","C":"necessitated","D":"necessitates","answer":"B","answer_word":"necessitating","explanation":"■ 文の骨格\nThe company has expanded suddenly, ______ a move to larger premises with a dedicated parking lot.\n\n■ 空所に入るもの\nコンマの後ろで前文の結果を表し、目的語 a move を取る形が必要。\n→ 空所には「分詞構文をつくる現在分詞」が必要です。\n\n■ 選択肢の確認\n(A) necessitate … 動詞（原形）「必要とさせる」 ×\n(B) necessitating … 現在分詞「必要とさせて」 ○\n(C) necessitated … 動詞の過去形・過去分詞「必要とされた」 ×\n(D) necessitates … 動詞（三人称単数現在形）「必要とさせる」 ×\n\n■ 完成文\nThe company has expanded suddenly, necessitating a move to larger premises with a dedicated parking lot.\n（その会社は急速に拡大し、その結果、専用駐車場のあるより広い施設への移転が必要になった。）\n\n■ 解き方のポイント\nコンマの後ろで結果を表すのは分詞構文（-ing）。目的語があるので能動。","words":[{"w":"expanded","p":"動詞（過去分詞）","m":"拡大した"},{"w":"necessitating","p":"現在分詞","m":"必要とさせて"},{"w":"premises","p":"名詞","m":"施設、敷地"},{"w":"dedicated","p":"形容詞","m":"専用の"}]},{"id":873,"category":"文法模試セット12","question":"Gilbert Public Schools' technology department already has plans to replace the ______ computers this summer.","A":"outdate","B":"outdated","C":"outdates","D":"outdating","answer":"B","answer_word":"outdated","explanation":"■ 文の骨格\nGilbert Public Schools' technology department already has plans to replace the ______ computers this summer.\n\n■ 空所に入るもの\nthe と名詞 computers の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) outdate … 動詞（原形）「時代遅れにする」 ×\n(B) outdated … 過去分詞・形容詞「時代遅れの」 ○\n(C) outdates … 動詞（三人称単数現在形）「時代遅れにする」 ×\n(D) outdating … 現在分詞・動名詞「時代遅れにすること」 ×\n\n■ 完成文\nGilbert Public Schools' technology department already has plans to replace the outdated computers this summer.\n（Gilbert 公立学校の技術部門は、今夏に旧式のコンピュータを入れ替える計画をすでに立てている。）\n\n■ 解き方のポイント\noutdated＝「時代遅れの」。過去分詞から形容詞化した語。","words":[{"w":"technology department","p":"名詞","m":"技術部門"},{"w":"replace","p":"動詞","m":"入れ替える"},{"w":"outdated","p":"形容詞","m":"時代遅れの"}]},{"id":874,"category":"文法模試セット12","question":"While traditional manufacturing is still ideal for high-volume production of metallic parts, 3D printing offers the option to ______ produce low-volume mock-ups.","A":"speed","B":"speeded","C":"speedy","D":"speedily","answer":"D","answer_word":"speedily","explanation":"■ 文の骨格\nWhile traditional manufacturing is still ideal for high-volume production of metallic parts, 3D printing offers the option to ______ produce low-volume mock-ups.\n\n■ 空所に入るもの\nto と動詞 produce の間の位置で、動詞を修飾する副詞が必要。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) speed … 名詞／動詞「速度／急ぐ」 ×\n(B) speeded … 動詞の過去形・過去分詞「速められた」 ×\n(C) speedy … 形容詞「素早い」 ×\n(D) speedily … 副詞「素早く」 ○\n\n■ 完成文\nWhile traditional manufacturing is still ideal for high-volume production of metallic parts, 3D printing offers the option to speedily produce low-volume mock-ups.\n（金属部品の大量生産には従来の製造法が依然として理想的だが、3D プリンティングは少量の試作品を素早く作る選択肢を提供する。）\n\n■ 解き方のポイント\n〈to＋空所＋動詞の原形〉は副詞。不定詞の間に副詞が入る形。","words":[{"w":"traditional","p":"形容詞","m":"従来の"},{"w":"high-volume","p":"形容詞","m":"大量の"},{"w":"speedily","p":"副詞","m":"素早く"},{"w":"mock-ups","p":"名詞","m":"試作品、模型"}]},{"id":875,"category":"文法模試セット12","question":"Aya Hernandez was one of the top five finalists of the piano competition, ______ whom audience members will choose a winner.","A":"around","B":"during","C":"from","D":"above","answer":"C","answer_word":"from","explanation":"■ 文の骨格\nAya Hernandez was one of the top five finalists of the piano competition, ______ whom audience members will choose a winner.\n\n■ 空所に入るもの\n5人の中から1人を選ぶという意味を表す前置詞が必要。\n→ 空所には「whom と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) around … 前置詞「〜の周りに」 ×\n(B) during … 前置詞「〜の間」 ×\n(C) from … 前置詞「〜の中から」 ○\n(D) above … 前置詞「〜の上に」 ×\n\n■ 完成文\nAya Hernandez was one of the top five finalists of the piano competition, from whom audience members will choose a winner.\n（Aya Hernandez はピアノコンクールの上位5人の最終選考者の1人で、その中から観客が優勝者を選ぶ。）\n\n■ 解き方のポイント\nchoose A from B＝「BからAを選ぶ」。〈前置詞＋whom〉の形も頻出。","words":[{"w":"finalists","p":"名詞","m":"最終選考者"},{"w":"competition","p":"名詞","m":"コンクール"},{"w":"from whom","p":"関係詞句","m":"その中から"},{"w":"winner","p":"名詞","m":"優勝者"}]},{"id":876,"category":"文法模試セット12","question":"______ she has a previous engagement with her client, Louise Simon will not be in attendance at today's meeting.","A":"Nevertheless","B":"Rather","C":"Because","D":"Whether","answer":"C","answer_word":"Because","explanation":"■ 文の骨格\n______ she has a previous engagement with her client, Louise Simon will not be in attendance at today's meeting.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、後半の理由を表す接続詞が必要。\n→ 空所には「理由を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) Nevertheless … 副詞「それにもかかわらず」 ×\n(B) Rather … 副詞「むしろ」 ×\n(C) Because … 接続詞「〜なので」 ○\n(D) Whether … 接続詞「〜かどうか」 ×\n\n■ 完成文\nBecause she has a previous engagement with her client, Louise Simon will not be in attendance at today's meeting.\n（顧客との先約があるため、Louise Simon は今日の会議には出席しない。）\n\n■ 解き方のポイント\n副詞は節をつなげない。後ろが節なら接続詞を選ぶ。","words":[{"w":"previous engagement","p":"名詞","m":"先約"},{"w":"client","p":"名詞","m":"顧客"},{"w":"Because","p":"接続詞","m":"〜なので"},{"w":"in attendance","p":"熟語","m":"出席して"}]},{"id":877,"category":"文法模試セット12","question":"Next year, Bernier Corporation's major objective is to establish even ______ ties between its domestic and international divisions.","A":"strong","B":"stronger","C":"strongly","D":"strongest","answer":"B","answer_word":"stronger","explanation":"■ 文の骨格\nNext year, Bernier Corporation's major objective is to establish even ______ ties between its domestic and international divisions.\n\n■ 空所に入るもの\neven は比較級を強める副詞なので、直後には比較級が必要。\n→ 空所には「比較級の形容詞」が必要です。\n\n■ 選択肢の確認\n(A) strong … 形容詞（原級）「強い」 ×\n(B) stronger … 形容詞（比較級）「より強い」 ○\n(C) strongly … 副詞「強く」 ×\n(D) strongest … 形容詞（最上級）「最も強い」 ×\n\n■ 完成文\nNext year, Bernier Corporation's major objective is to establish even stronger ties between its domestic and international divisions.\n（来年、Bernier 社の主要目標は、国内部門と海外部門の間により強固な結びつきを築くことだ。）\n\n■ 解き方のポイント\neven／much／far は比較級を強める。even の直後は比較級。","words":[{"w":"objective","p":"名詞","m":"目標"},{"w":"establish","p":"動詞","m":"築く"},{"w":"stronger","p":"比較級","m":"より強い"},{"w":"ties","p":"名詞","m":"結びつき"}]},{"id":878,"category":"文法模試セット12","question":"Successful candidates should possess a university degree in marketing or another ______ field.","A":"rely","B":"relying","C":"relevant","D":"relevancy","answer":"C","answer_word":"relevant","explanation":"■ 文の骨格\nSuccessful candidates should possess a university degree in marketing or another ______ field.\n\n■ 空所に入るもの\nanother と名詞 field の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) rely … 動詞（原形）「頼る」 ×\n(B) relying … 現在分詞・動名詞「頼ること」 ×\n(C) relevant … 形容詞「関連する」 ○\n(D) relevancy … 名詞「関連性」 ×\n\n■ 完成文\nSuccessful candidates should possess a university degree in marketing or another relevant field.\n（合格者は、マーケティングまたはその他の関連分野の学位を持っている必要がある。）\n\n■ 解き方のポイント\n名詞の直前は形容詞。relevant field＝「関連分野」。","words":[{"w":"candidates","p":"名詞","m":"候補者"},{"w":"possess","p":"動詞","m":"持っている"},{"w":"degree","p":"名詞","m":"学位"},{"w":"relevant","p":"形容詞","m":"関連する"}]},{"id":879,"category":"文法模試セット12","question":"Ms. Kim is considering relocating to Evergreen Town because ______ would be more convenient to her base of clients.","A":"it","B":"she","C":"which","D":"some","answer":"A","answer_word":"it","explanation":"■ 文の骨格\nMs. Kim is considering relocating to Evergreen Town because ______ would be more convenient to her base of clients.\n\n■ 空所に入るもの\nbecause 節の主語が欠けており、前の内容（移転すること）を受ける代名詞が必要。\n→ 空所には「because 節の主語になる代名詞」が必要です。\n\n■ 選択肢の確認\n(A) it … 代名詞（it）「そのほうが」 ○\n(B) she … 主格の代名詞「彼女は」 ×\n(C) which … 関係代名詞「どちら」 ×\n(D) some … 代名詞「いくらか」 ×\n\n■ 完成文\nMs. Kim is considering relocating to Evergreen Town because it would be more convenient to her base of clients.\n（Kim さんは、そのほうが顧客層に近く便利になるため、Evergreen Town への移転を検討している。）\n\n■ 解き方のポイント\nit は前に述べた事柄（relocating）を受けられる。she だと文意が通らない。","words":[{"w":"considering","p":"現在分詞","m":"検討している"},{"w":"relocating","p":"動名詞","m":"移転すること"},{"w":"convenient","p":"形容詞","m":"便利な"},{"w":"base of clients","p":"名詞","m":"顧客層"}]},{"id":880,"category":"文法模試セット12","question":"Every room of the hotel has an ______ view of Lake Tahoma and Millwood Mountain.","A":"expand","B":"expansive","C":"expansively","D":"expansion","answer":"B","answer_word":"expansive","explanation":"■ 文の骨格\nEvery room of the hotel has an ______ view of Lake Tahoma and Millwood Mountain.\n\n■ 空所に入るもの\n冠詞 an と名詞 view の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) expand … 動詞（原形）「広げる」 ×\n(B) expansive … 形容詞「広々とした」 ○\n(C) expansively … 副詞「広々と」 ×\n(D) expansion … 名詞「拡大」 ×\n\n■ 完成文\nEvery room of the hotel has an expansive view of Lake Tahoma and Millwood Mountain.\n（そのホテルの全室から、Tahoma 湖と Millwood 山の広々とした眺めが楽しめる。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。-ive は形容詞の目印。","words":[{"w":"Every room","p":"名詞句","m":"全室"},{"w":"expansive","p":"形容詞","m":"広々とした"},{"w":"view","p":"名詞","m":"眺め"}]},{"id":881,"category":"文法模試セット12","question":"Experts are predicting that the market for mobile phones ______ by over 5 percent over the next five years.","A":"are growing","B":"will grow","C":"have grown","D":"had grown","answer":"B","answer_word":"will grow","explanation":"■ 文の骨格\nExperts are predicting that the market for mobile phones ______ by over 5 percent over the next five years.\n\n■ 空所に入るもの\nover the next five years（今後5年で）が未来を示し、主語 the market は単数。\n→ 空所には「未来を表す述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) are growing … 現在進行形（複数対応）「成長している」 ×\n(B) will grow … 未来形「成長するだろう」 ○\n(C) have grown … 現在完了形（複数対応）「成長した」 ×\n(D) had grown … 過去完了形「成長していた」 ×\n\n■ 完成文\nExperts are predicting that the market for mobile phones will grow by over 5 percent over the next five years.\n（専門家は、携帯電話市場が今後5年で5％以上成長すると予測している。）\n\n■ 解き方のポイント\nover the next ...＝未来。主語 the market は単数なので are／have は不可。","words":[{"w":"Experts","p":"名詞","m":"専門家"},{"w":"predicting","p":"現在分詞","m":"予測している"},{"w":"will grow","p":"未来形","m":"成長するだろう"},{"w":"market","p":"名詞","m":"市場"}]},{"id":882,"category":"文法模試セット12","question":"The main lobby of the Grace Hotel is ______ decorated with ceramic tiles, crystal chandeliers, and a lighted water fountain.","A":"beauty","B":"beautiful","C":"beautifully","D":"beautified","answer":"C","answer_word":"beautifully","explanation":"■ 文の骨格\nThe main lobby of the Grace Hotel is ______ decorated with ceramic tiles, crystal chandeliers, and a lighted water fountain.\n\n■ 空所に入るもの\n受動態 is decorated の間に入る修飾語の位置。\n→ 空所には「過去分詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) beauty … 名詞「美しさ」 ×\n(B) beautiful … 形容詞「美しい」 ×\n(C) beautifully … 副詞「美しく」 ○\n(D) beautified … 動詞の過去形・過去分詞「美化された」 ×\n\n■ 完成文\nThe main lobby of the Grace Hotel is beautifully decorated with ceramic tiles, crystal chandeliers, and a lighted water fountain.\n（Grace ホテルのメインロビーは、陶製タイル、クリスタルのシャンデリア、照明付きの噴水で美しく装飾されている。）\n\n■ 解き方のポイント\n〈be＋空所＋過去分詞〉は副詞の定位置。","words":[{"w":"main lobby","p":"名詞","m":"メインロビー"},{"w":"beautifully","p":"副詞","m":"美しく"},{"w":"decorated","p":"動詞（過去分詞）","m":"装飾された"},{"w":"water fountain","p":"名詞","m":"噴水"}]},{"id":883,"category":"文法模試セット12","question":"Many of the suppliers have ______ to submit invoices for services received in December.","A":"yet","B":"already","C":"after","D":"until","answer":"A","answer_word":"yet","explanation":"■ 文の骨格\nMany of the suppliers have ______ to submit invoices for services received in December.\n\n■ 空所に入るもの\nhave yet to do（まだ〜していない）という定型表現になる。\n→ 空所には「have と不定詞を結ぶ副詞」が必要です。\n\n■ 選択肢の確認\n(A) yet … 副詞「まだ〜していない」 ○\n(B) already … 副詞「すでに」 ×\n(C) after … 前置詞・接続詞「〜のあとに」 ×\n(D) until … 前置詞・接続詞「〜まで」 ×\n\n■ 完成文\nMany of the suppliers have yet to submit invoices for services received in December.\n（多くの仕入先は、12月に提供したサービスの請求書をまだ提出していない。）\n\n■ 解き方のポイント\nhave yet to do＝「まだ〜していない」。be yet to do も同義。","words":[{"w":"suppliers","p":"名詞","m":"仕入先"},{"w":"have yet to","p":"熟語","m":"まだ〜していない"},{"w":"submit","p":"動詞","m":"提出する"},{"w":"invoices","p":"名詞","m":"請求書"}]},{"id":884,"category":"文法模試セット12","question":"The Voyage Savor jams are made ______ locally grown, organic ingredients from the Drome region.","A":"from","B":"below","C":"to","D":"into","answer":"A","answer_word":"from","explanation":"■ 文の骨格\nThe Voyage Savor jams are made ______ locally grown, organic ingredients from the Drome region.\n\n■ 空所に入るもの\nbe made from X（Xから作られる）という組み合わせになる。\n→ 空所には「原料を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) from … 前置詞「〜から（原料）」 ○\n(B) below … 前置詞「〜の下に」 ×\n(C) to … 前置詞「〜へ」 ×\n(D) into … 前置詞「〜の中へ」 ×\n\n■ 完成文\nThe Voyage Savor jams are made from locally grown, organic ingredients from the Drome region.\n（Voyage Savor のジャムは、Drome 地方産の地元で育った有機素材から作られている。）\n\n■ 解き方のポイント\nbe made from（原料が変化）／be made of（材料が見た目に残る）。","words":[{"w":"jams","p":"名詞","m":"ジャム"},{"w":"made from","p":"熟語","m":"〜から作られる"},{"w":"locally grown","p":"形容詞句","m":"地元産の"},{"w":"organic ingredients","p":"名詞","m":"有機素材"}]},{"id":885,"category":"文法模試セット12","question":"The factory foreman conducts ______ inspections of the facility to ensure that all the machinery is working efficiently.","A":"frequent","B":"frequently","C":"frequency","D":"frequencies","answer":"A","answer_word":"frequent","explanation":"■ 文の骨格\nThe factory foreman conducts ______ inspections of the facility to ensure that all the machinery is working efficiently.\n\n■ 空所に入るもの\n他動詞 conducts の目的語 inspections を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) frequent … 形容詞「頻繁な」 ○\n(B) frequently … 副詞「頻繁に」 ×\n(C) frequency … 名詞「頻度」 ×\n(D) frequencies … 名詞（複数形）「頻度」 ×\n\n■ 完成文\nThe factory foreman conducts frequent inspections of the facility to ensure that all the machinery is working efficiently.\n（工場長は、機械がすべて効率よく稼働していることを確かめるため、施設の点検を頻繁に行っている。）\n\n■ 解き方のポイント\n名詞の直前は形容詞。副詞は名詞を修飾できない。","words":[{"w":"foreman","p":"名詞","m":"工場長、現場監督"},{"w":"frequent","p":"形容詞","m":"頻繁な"},{"w":"inspections","p":"名詞","m":"点検"},{"w":"machinery","p":"名詞","m":"機械"}]},{"id":886,"category":"文法模試セット12","question":"After returning to Florence in 1985, Mr. Moretti produced a number of paintings, ______ of which are housed in Moretti Memorial Museum.","A":"other","B":"several","C":"that","D":"anything","answer":"B","answer_word":"several","explanation":"■ 文の骨格\nAfter returning to Florence in 1985, Mr. Moretti produced a number of paintings, ______ of which are housed in Moretti Memorial Museum.\n\n■ 空所に入るもの\n〈数量表現＋of which〉の形で、前の paintings の一部を指す語が必要。\n→ 空所には「of which の前に置く数量表現」が必要です。\n\n■ 選択肢の確認\n(A) other … 形容詞「ほかの」 ×\n(B) several … 代名詞（複数扱い）「いくつか」 ○\n(C) that … 関係代名詞「前置詞の後ろでは使えない」 ×\n(D) anything … 代名詞「何でも」 ×\n\n■ 完成文\nAfter returning to Florence in 1985, Mr. Moretti produced a number of paintings, several of which are housed in Moretti Memorial Museum.\n（1985年にフィレンツェに戻ったあと、Moretti 氏は多くの絵画を制作し、そのいくつかは Moretti 記念美術館に所蔵されている。）\n\n■ 解き方のポイント\n〈some／several／most＋of which〉は非制限用法の定番。that は前置詞の後ろに置けない。","words":[{"w":"produced","p":"動詞（過去形）","m":"制作した"},{"w":"several","p":"代名詞","m":"いくつか"},{"w":"housed","p":"動詞（過去分詞）","m":"所蔵されている"},{"w":"Memorial Museum","p":"名詞","m":"記念美術館"}]},{"id":887,"category":"文法模試セット12","question":"______ the annual company banquet, Mr. Garcia and his team volunteered to work in the cloakroom.","A":"When","B":"While","C":"Instead","D":"During","answer":"D","answer_word":"During","explanation":"■ 文の骨格\n______ the annual company banquet, Mr. Garcia and his team volunteered to work in the cloakroom.\n\n■ 空所に入るもの\n空所の後ろが名詞句 the annual company banquet なので、前置詞が必要。\n→ 空所には「名詞句を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) When … 接続詞「〜のとき」 ×\n(B) While … 接続詞「〜する間」 ×\n(C) Instead … 副詞「その代わりに」 ×\n(D) During … 前置詞「〜の間」 ○\n\n■ 完成文\nDuring the annual company banquet, Mr. Garcia and his team volunteered to work in the cloakroom.\n（年次社内宴会の間、Garcia さんと彼のチームはクローク係を志願した。）\n\n■ 解き方のポイント\nduring＋名詞／while＋節。後ろの形で選ぶ。","words":[{"w":"During","p":"前置詞","m":"〜の間"},{"w":"banquet","p":"名詞","m":"宴会"},{"w":"volunteered","p":"動詞（過去形）","m":"志願した"},{"w":"cloakroom","p":"名詞","m":"クローク"}]},{"id":888,"category":"文法模試セット12","question":"Our certified technicians provide a full range of services ______ vehicles such as oil changes, scheduled maintenance, and brake upgrades.","A":"by","B":"for","C":"from","D":"in","answer":"B","answer_word":"for","explanation":"■ 文の骨格\nOur certified technicians provide a full range of services ______ vehicles such as oil changes, scheduled maintenance, and brake upgrades.\n\n■ 空所に入るもの\nサービスの対象を示す前置詞が必要。\n→ 空所には「対象を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) by … 前置詞「〜によって」 ×\n(B) for … 前置詞「〜向けの」 ○\n(C) from … 前置詞「〜から」 ×\n(D) in … 前置詞「〜の中に」 ×\n\n■ 完成文\nOur certified technicians provide a full range of services for vehicles such as oil changes, scheduled maintenance, and brake upgrades.\n（当社の認定技術者は、オイル交換、定期整備、ブレーキ強化など、車両向けの幅広いサービスを提供している。）\n\n■ 解き方のポイント\nfor は「〜向けの、〜のための」と対象を表す。","words":[{"w":"certified","p":"形容詞","m":"認定された"},{"w":"technicians","p":"名詞","m":"技術者"},{"w":"a full range of","p":"熟語","m":"幅広い"},{"w":"vehicles","p":"名詞","m":"車両"}]},{"id":889,"category":"文法模試セット12","question":"The Real Estate Show will offer an excellent opportunity for home owners to acquaint ______ with the latest trends in home furnishings.","A":"they","B":"their","C":"them","D":"themselves","answer":"D","answer_word":"themselves","explanation":"■ 文の骨格\nThe Real Estate Show will offer an excellent opportunity for home owners to acquaint ______ with the latest trends in home furnishings.\n\n■ 空所に入るもの\nacquaint oneself with X（Xに精通する）の形で、意味上の主語と同じものを指す。\n→ 空所には「acquaint の目的語になる再帰代名詞」が必要です。\n\n■ 選択肢の確認\n(A) they … 主格の代名詞「彼らは」 ×\n(B) their … 所有格「彼らの」 ×\n(C) them … 目的格の代名詞「彼らを」 ×\n(D) themselves … 再帰代名詞「彼ら自身を」 ○\n\n■ 完成文\nThe Real Estate Show will offer an excellent opportunity for home owners to acquaint themselves with the latest trends in home furnishings.\n（その不動産展は、住宅所有者が住宅用家具の最新動向に触れる絶好の機会となる。）\n\n■ 解き方のポイント\nacquaint oneself with X＝「Xを知る、精通する」。主語と同一なら再帰代名詞。","words":[{"w":"Real Estate","p":"名詞","m":"不動産"},{"w":"acquaint oneself with","p":"熟語","m":"〜に精通する"},{"w":"trends","p":"名詞","m":"動向"},{"w":"home furnishings","p":"名詞","m":"住宅用家具"}]},{"id":890,"category":"文法模試セット12","question":"The renowned architect Stuart Silk ______ to design nine custom homes near Shanghai with no restrictions on style or budget.","A":"was commissioning","B":"be commissioning","C":"will have commissioned","D":"has been commissioned","answer":"D","answer_word":"has been commissioned","explanation":"■ 文の骨格\nThe renowned architect Stuart Silk ______ to design nine custom homes near Shanghai with no restrictions on style or budget.\n\n■ 空所に入るもの\n主語 Stuart Silk は「依頼される」側なので受動態が必要。\n→ 空所には「現在完了の受動態」が必要です。\n\n■ 選択肢の確認\n(A) was commissioning … 過去進行形（能動）「依頼していた」 ×\n(B) be commissioning … 原形（文法的に不完全）「この形では述語動詞にならない」 ×\n(C) will have commissioned … 未来完了形（能動）「依頼し終えているだろう」 ×\n(D) has been commissioned … 現在完了受動態「依頼されている」 ○\n\n■ 完成文\nThe renowned architect Stuart Silk has been commissioned to design nine custom homes near Shanghai with no restrictions on style or budget.\n（著名建築家の Stuart Silk は、様式も予算も制限のない9軒の注文住宅を上海近郊に設計するよう依頼された。）\n\n■ 解き方のポイント\nbe commissioned to do＝「〜するよう依頼される」。主語が「される側」なら受動態。","words":[{"w":"renowned","p":"形容詞","m":"著名な"},{"w":"architect","p":"名詞","m":"建築家"},{"w":"has been commissioned","p":"現在完了受動態","m":"依頼されている"},{"w":"custom homes","p":"名詞","m":"注文住宅"}]},{"id":891,"category":"文法模試セット12","question":"Mr. Lyle was asked to contact the human resources department to arrange a follow-up ______ for the accounting position.","A":"interviewed","B":"interview","C":"interviewing","D":"interviews","answer":"B","answer_word":"interview","explanation":"■ 文の骨格\nMr. Lyle was asked to contact the human resources department to arrange a follow-up ______ for the accounting position.\n\n■ 空所に入るもの\n冠詞 a と形容詞 follow-up の後ろで、arrange の目的語となる単数名詞が必要。\n→ 空所には「冠詞の後ろに置く単数名詞」が必要です。\n\n■ 選択肢の確認\n(A) interviewed … 動詞の過去形・過去分詞「面接された」 ×\n(B) interview … 名詞（単数形）「面接」 ○\n(C) interviewing … 現在分詞・動名詞「面接すること」 ×\n(D) interviews … 名詞（複数形）「面接」 ×\n\n■ 完成文\nMr. Lyle was asked to contact the human resources department to arrange a follow-up interview for the accounting position.\n（Lyle さんは、経理職の二次面接を設定するため人事部に連絡するよう求められた。）\n\n■ 解き方のポイント\n冠詞 a があるので単数形。follow-up interview＝「二次面接」。","words":[{"w":"human resources department","p":"名詞","m":"人事部"},{"w":"arrange","p":"動詞","m":"設定する"},{"w":"follow-up","p":"形容詞","m":"追加の、二次の"},{"w":"interview","p":"名詞","m":"面接"}]},{"id":892,"category":"文法模試セット12","question":"The museum announced today that Alan Cooper has been ______ director and chief executive officer.","A":"returned","B":"appointed","C":"regarded","D":"promoted","answer":"B","answer_word":"appointed","explanation":"■ 文の骨格\nThe museum announced today that Alan Cooper has been ______ director and chief executive officer.\n\n■ 空所に入るもの\n後ろに役職名が続くので、appoint A B（AをBに任命する）の受動形になる。\n→ 空所には「〈人＋役職〉の形を取る過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) returned … 過去分詞「返却された」 ×\n(B) appointed … 過去分詞「任命された」 ○\n(C) regarded … 過去分詞「見なされた（as が必要）」 ×\n(D) promoted … 過去分詞「昇進した（to が必要）」 ×\n\n■ 完成文\nThe museum announced today that Alan Cooper has been appointed director and chief executive officer.\n（その美術館は本日、Alan Cooper 氏が館長兼最高経営責任者に任命されたと発表した。）\n\n■ 解き方のポイント\nappoint A B は前置詞不要。regard A as B／promote A to B は前置詞が必要。","words":[{"w":"announced","p":"動詞（過去形）","m":"発表した"},{"w":"appointed","p":"過去分詞","m":"任命された"},{"w":"director","p":"名詞","m":"館長"},{"w":"chief executive officer","p":"名詞","m":"最高経営責任者"}]},{"id":893,"category":"文法模試セット13","question":"Common Questions & Answers About Investment is a ______ written book that is easy to use.","A":"thought","B":"thoughtful","C":"thoughtfully","D":"thoughtfulness","answer":"C","answer_word":"thoughtfully","explanation":"■ 文の骨格\nCommon Questions & Answers About Investment is a ______ written book that is easy to use.\n\n■ 空所に入るもの\n冠詞 a と written book の間にあり、分詞を修飾する位置。\n→ 空所には「過去分詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) thought … 名詞／動詞「考え／考える」 ×\n(B) thoughtful … 形容詞「思いやりのある、よく考えられた」 ×\n(C) thoughtfully … 副詞「よく考えて」 ○\n(D) thoughtfulness … 名詞「思慮深さ」 ×\n\n■ 完成文\nCommon Questions & Answers About Investment is a thoughtfully written book that is easy to use.\n（『Common Questions & Answers About Investment』は、よく練られて書かれた使いやすい本だ。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋過去分詞＋名詞〉は副詞。","words":[{"w":"Investment","p":"名詞","m":"投資"},{"w":"thoughtfully","p":"副詞","m":"よく考えて"},{"w":"written","p":"過去分詞","m":"書かれた"},{"w":"easy to use","p":"形容詞句","m":"使いやすい"}]},{"id":894,"category":"文法模試セット13","question":"Amenities at Palm Tree Hotel ______ modern convenience and old-world elegance.","A":"exemplify","B":"exemplifying","C":"exemplifies","D":"exemplification","answer":"A","answer_word":"exemplify","explanation":"■ 文の骨格\nAmenities at Palm Tree Hotel ______ modern convenience and old-world elegance.\n\n■ 空所に入るもの\n主語 Amenities は複数で、直後に目的語があるので能動態の複数形が必要。\n→ 空所には「複数主語に対応する述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) exemplify … 動詞（現在形・複数対応）「体現する」 ○\n(B) exemplifying … 現在分詞・動名詞「体現すること」 ×\n(C) exemplifies … 動詞（三人称単数現在形）「体現する」 ×\n(D) exemplification … 名詞「例示」 ×\n\n■ 完成文\nAmenities at Palm Tree Hotel exemplify modern convenience and old-world elegance.\n（Palm Tree ホテルの設備は、現代的な快適さと古き良き優雅さを体現している。）\n\n■ 解き方のポイント\n主語の単複と動詞の一致。Amenities は複数なので -s は付かない。","words":[{"w":"Amenities","p":"名詞","m":"設備、備品"},{"w":"exemplify","p":"動詞","m":"体現する"},{"w":"convenience","p":"名詞","m":"快適さ、便利さ"},{"w":"elegance","p":"名詞","m":"優雅さ"}]},{"id":895,"category":"文法模試セット13","question":"Tickets for the train tour of Fort Worth can be purchased ______ the station or online.","A":"with","B":"upon","C":"between","D":"inside","answer":"D","answer_word":"inside","explanation":"■ 文の骨格\nTickets for the train tour of Fort Worth can be purchased ______ the station or online.\n\n■ 空所に入るもの\nオンラインと対比される購入場所を表す前置詞が必要。\n→ 空所には「場所を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) with … 前置詞「〜とともに」 ×\n(B) upon … 前置詞「〜するとすぐに」 ×\n(C) between … 前置詞「〜の間に」 ×\n(D) inside … 前置詞「〜の中で」 ○\n\n■ 完成文\nTickets for the train tour of Fort Worth can be purchased inside the station or online.\n（Fort Worth の列車ツアーのチケットは、駅構内またはオンラインで購入できる。）\n\n■ 解き方のポイント\ninside＝「〜の内部で」。online との対比で「駅構内で」を表す。","words":[{"w":"purchased","p":"動詞（過去分詞）","m":"購入される"},{"w":"inside","p":"前置詞","m":"〜の中で"},{"w":"station","p":"名詞","m":"駅"}]},{"id":896,"category":"文法模試セット13","question":"Should you wish to terminate the lease, you need to give ______ two months' notice before leaving the apartment.","A":"we","B":"our","C":"us","D":"ours","answer":"C","answer_word":"us","explanation":"■ 文の骨格\nShould you wish to terminate the lease, you need to give ______ two months' notice before leaving the apartment.\n\n■ 空所に入るもの\ngive＋人＋物 の形で、空所は「人」にあたる間接目的語。\n→ 空所には「間接目的語になる目的格の代名詞」が必要です。\n\n■ 選択肢の確認\n(A) we … 主格の代名詞「私たちは」 ×\n(B) our … 所有格「私たちの」 ×\n(C) us … 目的格の代名詞「私たちに」 ○\n(D) ours … 所有代名詞「私たちのもの」 ×\n\n■ 完成文\nShould you wish to terminate the lease, you need to give us two months' notice before leaving the apartment.\n（賃貸契約を解除される場合は、退去前に2か月前の通知を当方へお出しください。）\n\n■ 解き方のポイント\ngive／send／show は〈人＋物〉の語順。人の位置は目的格。","words":[{"w":"terminate","p":"動詞","m":"解除する"},{"w":"lease","p":"名詞","m":"賃貸契約"},{"w":"us","p":"目的格の代名詞","m":"私たちに"},{"w":"notice","p":"名詞","m":"通知"}]},{"id":897,"category":"文法模試セット13","question":"Laptop Stand Pro comes equipped with a flat base and rubber pads to keep your laptop computer ______ on your desk.","A":"stable","B":"stabilization","C":"stabilize","D":"stabilizer","answer":"A","answer_word":"stable","explanation":"■ 文の骨格\nLaptop Stand Pro comes equipped with a flat base and rubber pads to keep your laptop computer ______ on your desk.\n\n■ 空所に入るもの\nkeep O C の形で、目的語 your laptop computer の状態を表す補語が必要。\n→ 空所には「keep の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) stable … 形容詞「安定した」 ○\n(B) stabilization … 名詞「安定化」 ×\n(C) stabilize … 動詞（原形）「安定させる」 ×\n(D) stabilizer … 名詞「安定装置」 ×\n\n■ 完成文\nLaptop Stand Pro comes equipped with a flat base and rubber pads to keep your laptop computer stable on your desk.\n（Laptop Stand Pro には平らな台座とゴムパッドが付いており、机の上でノートパソコンを安定させておける。）\n\n■ 解き方のポイント\nkeep O C の C は形容詞。名詞では O とイコールにならない。","words":[{"w":"comes equipped with","p":"熟語","m":"〜を備えている"},{"w":"flat base","p":"名詞","m":"平らな台座"},{"w":"rubber pads","p":"名詞","m":"ゴムパッド"},{"w":"stable","p":"形容詞","m":"安定した"}]},{"id":898,"category":"文法模試セット13","question":"Ms. Brown has been teaching at Skyline University ______ the day it was built 25 years ago.","A":"as soon as","B":"then","C":"until","D":"ever since","answer":"D","answer_word":"ever since","explanation":"■ 文の骨格\nMs. Brown has been teaching at Skyline University ______ the day it was built 25 years ago.\n\n■ 空所に入るもの\n現在完了進行形とともに、継続の起点を表す前置詞句が必要。\n→ 空所には「起点を表す前置詞句」が必要です。\n\n■ 選択肢の確認\n(A) as soon as … 接続詞（群）「〜したらすぐに」 ×\n(B) then … 副詞「そのとき」 ×\n(C) until … 前置詞・接続詞「〜まで」 ×\n(D) ever since … 前置詞句「〜以来ずっと」 ○\n\n■ 完成文\nMs. Brown has been teaching at Skyline University ever since the day it was built 25 years ago.\n（Brown さんは、25年前に Skyline 大学が建てられた日からずっとそこで教えている。）\n\n■ 解き方のポイント\never since＝「〜以来ずっと」。since を強調した形で現在完了と呼応する。","words":[{"w":"has been teaching","p":"現在完了進行形","m":"教え続けている"},{"w":"ever since","p":"熟語","m":"〜以来ずっと"},{"w":"built","p":"動詞（過去分詞）","m":"建てられた"}]},{"id":899,"category":"文法模試セット13","question":"The device conforms to the current safety regulations and is subjected to ______ testing before shipment.","A":"extend","B":"extensive","C":"extensively","D":"extension","answer":"B","answer_word":"extensive","explanation":"■ 文の骨格\nThe device conforms to the current safety regulations and is subjected to ______ testing before shipment.\n\n■ 空所に入るもの\n前置詞 to の目的語 testing を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) extend … 動詞（原形）「延長する」 ×\n(B) extensive … 形容詞「広範な、徹底的な」 ○\n(C) extensively … 副詞「広範囲に」 ×\n(D) extension … 名詞「延長、内線」 ×\n\n■ 完成文\nThe device conforms to the current safety regulations and is subjected to extensive testing before shipment.\n（その機器は現行の安全規則に適合しており、出荷前に徹底的な試験を受ける。）\n\n■ 解き方のポイント\n名詞の直前は形容詞。-ive は形容詞の目印。","words":[{"w":"device","p":"名詞","m":"機器"},{"w":"conforms to","p":"熟語","m":"〜に適合する"},{"w":"subjected to","p":"熟語","m":"〜を受ける"},{"w":"extensive","p":"形容詞","m":"徹底的な"}]},{"id":900,"category":"文法模試セット13","question":"The fund-raising event has always attracted corporate donations, and this year's organizers have ______ managed to secure funds from local businesses.","A":"enough","B":"likewise","C":"quite","D":"much","answer":"B","answer_word":"likewise","explanation":"■ 文の骨格\nThe fund-raising event has always attracted corporate donations, and this year's organizers have ______ managed to secure funds from local businesses.\n\n■ 空所に入るもの\n現在完了形 have managed の間に入る修飾語の位置で、前文と同様であることを表す。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) enough … 形容詞・副詞「十分な／十分に」 ×\n(B) likewise … 副詞「同様に」 ○\n(C) quite … 副詞「かなり」 ×\n(D) much … 副詞・形容詞「たくさん」 ×\n\n■ 完成文\nThe fund-raising event has always attracted corporate donations, and this year's organizers have likewise managed to secure funds from local businesses.\n（その資金調達イベントはこれまでも企業からの寄付を集めてきたが、今年の主催者も同様に地元企業から資金を確保できた。）\n\n■ 解き方のポイント\nlikewise＝「同様に」。前文と同じ内容が続くことを示す副詞。","words":[{"w":"fund-raising","p":"形容詞","m":"資金調達の"},{"w":"donations","p":"名詞","m":"寄付"},{"w":"likewise","p":"副詞","m":"同様に"},{"w":"secure funds","p":"熟語","m":"資金を確保する"}]},{"id":901,"category":"文法模試セット13","question":"For decades, wristwatches have been endorsed by ______ such as movie stars and professional athletes.","A":"celebration","B":"celebrate","C":"celebrating","D":"celebrities","answer":"D","answer_word":"celebrities","explanation":"■ 文の骨格\nFor decades, wristwatches have been endorsed by ______ such as movie stars and professional athletes.\n\n■ 空所に入るもの\nsuch as 以下に人の例が挙がっているので、「人」を表す複数名詞が必要。\n→ 空所には「前置詞 by の目的語になる複数名詞（人）」が必要です。\n\n■ 選択肢の確認\n(A) celebration … 名詞「祝賀」 ×\n(B) celebrate … 動詞（原形）「祝う」 ×\n(C) celebrating … 現在分詞・動名詞「祝うこと」 ×\n(D) celebrities … 名詞（複数形・人）「著名人」 ○\n\n■ 完成文\nFor decades, wristwatches have been endorsed by celebrities such as movie stars and professional athletes.\n（何十年もの間、腕時計は映画スターやプロ選手といった著名人によって宣伝されてきた。）\n\n■ 解き方のポイント\nsuch as の後ろの例（movie stars など）から「人」を表す名詞と判断する。","words":[{"w":"decades","p":"名詞","m":"何十年"},{"w":"wristwatches","p":"名詞","m":"腕時計"},{"w":"endorsed","p":"動詞（過去分詞）","m":"宣伝された"},{"w":"celebrities","p":"名詞","m":"著名人"}]},{"id":902,"category":"文法模試セット13","question":"Ozaki Law Firm in downtown Kyoto has an opening for an administrative assistant ______ April 1.","A":"start","B":"started","C":"starting","D":"starts","answer":"C","answer_word":"starting","explanation":"■ 文の骨格\nOzaki Law Firm in downtown Kyoto has an opening for an administrative assistant ______ April 1.\n\n■ 空所に入るもの\n名詞 an administrative assistant を後ろから修飾し、開始日を示す語が必要。\n→ 空所には「日付を導く現在分詞（前置詞的用法）」が必要です。\n\n■ 選択肢の確認\n(A) start … 動詞（原形）「始まる」 ×\n(B) started … 動詞の過去形・過去分詞「始まった」 ×\n(C) starting … 現在分詞「〜から始まる」 ○\n(D) starts … 動詞（三人称単数現在形）「始まる」 ×\n\n■ 完成文\nOzaki Law Firm in downtown Kyoto has an opening for an administrative assistant starting April 1.\n（京都市中心部の Ozaki 法律事務所では、4月1日開始の事務補佐の求人がある。）\n\n■ 解き方のポイント\nstarting [beginning／effective]＋日付＝「〜から」。前置詞のように使う分詞。","words":[{"w":"Law Firm","p":"名詞","m":"法律事務所"},{"w":"opening","p":"名詞","m":"求人、欠員"},{"w":"administrative assistant","p":"名詞","m":"事務補佐"},{"w":"starting","p":"現在分詞","m":"〜から始まる"}]},{"id":903,"category":"文法模試セット13","question":"In a news release, the mayor announced plans to replace most street lights with ______ ones to improve visibility.","A":"brightly","B":"brighter","C":"brightest","D":"brightness","answer":"B","answer_word":"brighter","explanation":"■ 文の骨格\nIn a news release, the mayor announced plans to replace most street lights with ______ ones to improve visibility.\n\n■ 空所に入るもの\n代名詞 ones を修飾し、既存の照明との比較を表す形容詞が必要。\n→ 空所には「名詞を修飾する比較級の形容詞」が必要です。\n\n■ 選択肢の確認\n(A) brightly … 副詞「明るく」 ×\n(B) brighter … 形容詞（比較級）「より明るい」 ○\n(C) brightest … 形容詞（最上級）「最も明るい」 ×\n(D) brightness … 名詞「明るさ」 ×\n\n■ 完成文\nIn a news release, the mayor announced plans to replace most street lights with brighter ones to improve visibility.\n（報道発表で市長は、視認性を高めるため大半の街灯をより明るいものに交換する計画を発表した。）\n\n■ 解き方のポイント\nones（＝street lights）を修飾するので形容詞。最上級は the を伴う。","words":[{"w":"news release","p":"名詞","m":"報道発表"},{"w":"mayor","p":"名詞","m":"市長"},{"w":"brighter","p":"比較級","m":"より明るい"},{"w":"visibility","p":"名詞","m":"視認性"}]},{"id":904,"category":"文法模試セット13","question":"All staff members are required to wear the new uniforms that were provided ______ the meeting last week.","A":"with","B":"at","C":"on","D":"of","answer":"B","answer_word":"at","explanation":"■ 文の骨格\nAll staff members are required to wear the new uniforms that were provided ______ the meeting last week.\n\n■ 空所に入るもの\n配付が行われた機会を示す前置詞が必要。\n→ 空所には「地点・機会を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) with … 前置詞「〜とともに」 ×\n(B) at … 前置詞「〜で（地点・機会）」 ○\n(C) on … 前置詞「〜の上に」 ×\n(D) of … 前置詞「〜の」 ×\n\n■ 完成文\nAll staff members are required to wear the new uniforms that were provided at the meeting last week.\n（全職員は、先週の会議で配付された新しい制服を着用しなければならない。）\n\n■ 解き方のポイント\nat the meeting／at the conference のように、催し物の場は at。","words":[{"w":"uniforms","p":"名詞","m":"制服"},{"w":"provided","p":"動詞（過去分詞）","m":"配付された"},{"w":"at","p":"前置詞","m":"〜で"}]},{"id":905,"category":"文法模試セット13","question":"In addition to high salaries, the real estate agency offers outstanding opportunities for professional ______.","A":"developer","B":"develop","C":"developed","D":"development","answer":"D","answer_word":"development","explanation":"■ 文の骨格\nIn addition to high salaries, the real estate agency offers outstanding opportunities for professional ______.\n\n■ 空所に入るもの\n形容詞 professional に修飾され、前置詞 for の目的語となる名詞が必要。\n→ 空所には「前置詞 for の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) developer … 名詞（人）「開発者」 ×\n(B) develop … 動詞（原形）「発展する」 ×\n(C) developed … 動詞の過去形・過去分詞「開発された」 ×\n(D) development … 名詞「成長、能力開発」 ○\n\n■ 完成文\nIn addition to high salaries, the real estate agency offers outstanding opportunities for professional development.\n（高給に加えて、その不動産会社は professional development（能力開発）の優れた機会を提供している。）\n\n■ 解き方のポイント\nprofessional development＝「能力開発、キャリア形成」。前置詞の後ろは名詞。","words":[{"w":"salaries","p":"名詞","m":"給与"},{"w":"real estate agency","p":"名詞","m":"不動産会社"},{"w":"outstanding","p":"形容詞","m":"優れた"},{"w":"development","p":"名詞","m":"成長、能力開発"}]},{"id":906,"category":"文法模試セット13","question":"With the launch date only weeks away, the advertising director ______ has not decided on a name for the product line.","A":"very","B":"yet","C":"recent","D":"still","answer":"D","answer_word":"still","explanation":"■ 文の骨格\nWith the launch date only weeks away, the advertising director ______ has not decided on a name for the product line.\n\n■ 空所に入るもの\n主語と述語動詞の間に入り、「今もなお〜していない」を表す副詞が必要。\n→ 空所には「否定文で継続を表す副詞」が必要です。\n\n■ 選択肢の確認\n(A) very … 副詞「とても（原級を強める）」 ×\n(B) yet … 副詞「まだ（否定文の文末に置く）」 ×\n(C) recent … 形容詞「最近の」 ×\n(D) still … 副詞「いまだに」 ○\n\n■ 完成文\nWith the launch date only weeks away, the advertising director still has not decided on a name for the product line.\n（発売日まで数週間しかないのに、広告部長は製品シリーズの名前をいまだに決めていない。）\n\n■ 解き方のポイント\nstill は否定語の前、yet は文末に置く。位置の違いが狙われる。","words":[{"w":"launch date","p":"名詞","m":"発売日"},{"w":"advertising director","p":"名詞","m":"広告部長"},{"w":"still","p":"副詞","m":"いまだに"},{"w":"product line","p":"名詞","m":"製品シリーズ"}]},{"id":907,"category":"文法模試セット13","question":"Before leaving Howell University last year, Mr. Kaufman had ______ to the position of director of physics.","A":"advanced","B":"identified","C":"recommended","D":"promoted","answer":"A","answer_word":"advanced","explanation":"■ 文の骨格\nBefore leaving Howell University last year, Mr. Kaufman had ______ to the position of director of physics.\n\n■ 空所に入るもの\n後ろが to＋役職なので、前置詞 to を伴う自動詞が必要。\n→ 空所には「to と結びつく自動詞の過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) advanced … 過去分詞「昇進した」 ○\n(B) identified … 過去分詞「特定した（他動詞）」 ×\n(C) recommended … 過去分詞「推薦した（他動詞）」 ×\n(D) promoted … 過去分詞「昇進させた（受動態が必要）」 ×\n\n■ 完成文\nBefore leaving Howell University last year, Mr. Kaufman had advanced to the position of director of physics.\n（昨年 Howell 大学を去る前に、Kaufman 氏は物理学部長の職まで昇進していた。）\n\n■ 解き方のポイント\nadvance to＝「〜へ昇進する」（自動詞）。promote は他動詞なので be promoted to の形になる。","words":[{"w":"advanced to","p":"熟語","m":"〜へ昇進した"},{"w":"position","p":"名詞","m":"職"},{"w":"director","p":"名詞","m":"部長"},{"w":"physics","p":"名詞","m":"物理学"}]},{"id":908,"category":"文法模試セット13","question":"______ promising, the research findings are still tentative and need further investigation.","A":"Despite","B":"Because","C":"Though","D":"Therefore","answer":"C","answer_word":"Though","explanation":"■ 文の骨格\n______ promising, the research findings are still tentative and need further investigation.\n\n■ 空所に入るもの\nThough (they are) promising のように〈主語＋be動詞〉を省略できる接続詞が必要。\n→ 空所には「分詞・形容詞を伴える接続詞」が必要です。\n\n■ 選択肢の確認\n(A) Despite … 前置詞「〜にもかかわらず」 ×\n(B) Because … 接続詞「〜なので」 ×\n(C) Though … 接続詞「〜だけれども」 ○\n(D) Therefore … 副詞「したがって」 ×\n\n■ 完成文\nThough promising, the research findings are still tentative and need further investigation.\n（有望ではあるものの、その研究結果はまだ暫定的で、さらなる調査が必要だ。）\n\n■ 解き方のポイント\nthough／although／while は〈主語＋be動詞〉を省略して形容詞を直接続けられる。","words":[{"w":"Though","p":"接続詞","m":"〜だけれども"},{"w":"promising","p":"形容詞","m":"有望な"},{"w":"findings","p":"名詞","m":"研究結果"},{"w":"tentative","p":"形容詞","m":"暫定的な"}]},{"id":909,"category":"文法模試セット13","question":"While standard orders usually ship within two business days, express delivery is available for an additional ______.","A":"charge","B":"pay","C":"money","D":"admission","answer":"A","answer_word":"charge","explanation":"■ 文の骨格\nWhile standard orders usually ship within two business days, express delivery is available for an additional ______.\n\n■ 空所に入るもの\n冠詞 an と形容詞 additional の後ろで、料金を表す可算名詞が必要。\n→ 空所には「冠詞の後ろに置く可算名詞」が必要です。\n\n■ 選択肢の確認\n(A) charge … 名詞（可算）「料金」 ○\n(B) pay … 名詞／動詞「給料／支払う」 ×\n(C) money … 名詞（不可算）「お金」 ×\n(D) admission … 名詞「入場、入場料」 ×\n\n■ 完成文\nWhile standard orders usually ship within two business days, express delivery is available for an additional charge.\n（通常注文は2営業日以内に発送されるが、速達配送は追加料金でご利用いただける。）\n\n■ 解き方のポイント\nfor an additional charge＝「追加料金で」。money は不可算で冠詞が付かない。","words":[{"w":"standard orders","p":"名詞","m":"通常注文"},{"w":"business days","p":"名詞","m":"営業日"},{"w":"express delivery","p":"名詞","m":"速達配送"},{"w":"charge","p":"名詞","m":"料金"}]},{"id":910,"category":"文法模試セット13","question":"The interviewers created a set of technical questions to help ______ between candidates for the position.","A":"different","B":"differently","C":"difference","D":"differentiate","answer":"D","answer_word":"differentiate","explanation":"■ 文の骨格\nThe interviewers created a set of technical questions to help ______ between candidates for the position.\n\n■ 空所に入るもの\nhelp (to) do の形で、原形不定詞が入る位置。\n→ 空所には「help に続く動詞の原形」が必要です。\n\n■ 選択肢の確認\n(A) different … 形容詞「異なる」 ×\n(B) differently … 副詞「異なって」 ×\n(C) difference … 名詞「違い」 ×\n(D) differentiate … 動詞（原形）「区別する」 ○\n\n■ 完成文\nThe interviewers created a set of technical questions to help differentiate between candidates for the position.\n（面接官は、その職の候補者を区別するのに役立つ一連の技術的な質問を作成した。）\n\n■ 解き方のポイント\nhelp＋(to) do。原形不定詞を取る動詞。differentiate between A and B の形も覚える。","words":[{"w":"interviewers","p":"名詞","m":"面接官"},{"w":"technical questions","p":"名詞","m":"技術的な質問"},{"w":"differentiate","p":"動詞","m":"区別する"},{"w":"candidates","p":"名詞","m":"候補者"}]},{"id":911,"category":"文法模試セット13","question":"The one-week summer program is for university students who aspire to become leaders ______ their peers.","A":"during","B":"under","C":"among","D":"from","answer":"C","answer_word":"among","explanation":"■ 文の骨格\nThe one-week summer program is for university students who aspire to become leaders ______ their peers.\n\n■ 空所に入るもの\n複数の仲間の中でという意味を表す前置詞が必要。\n→ 空所には「3つ以上の集団を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) during … 前置詞「〜の間（期間）」 ×\n(B) under … 前置詞「〜の下に」 ×\n(C) among … 前置詞「〜の中で（3つ以上）」 ○\n(D) from … 前置詞「〜から」 ×\n\n■ 完成文\nThe one-week summer program is for university students who aspire to become leaders among their peers.\n（その1週間の夏期プログラムは、仲間の中でリーダーになることを志す大学生向けだ。）\n\n■ 解き方のポイント\namong＋複数名詞（3つ以上の中で）、between＋2つ。","words":[{"w":"aspire to","p":"熟語","m":"〜を志す"},{"w":"leaders","p":"名詞","m":"リーダー"},{"w":"among","p":"前置詞","m":"〜の中で"},{"w":"peers","p":"名詞","m":"仲間、同輩"}]},{"id":912,"category":"文法模試セット13","question":"Ms. Valois has applied for a supervisor position that will allow her to demonstrate her management ______.","A":"expertise","B":"expertly","C":"expertized","D":"expert","answer":"A","answer_word":"expertise","explanation":"■ 文の骨格\nMs. Valois has applied for a supervisor position that will allow her to demonstrate her management ______.\n\n■ 空所に入るもの\n所有格 her と management の後ろで、demonstrate の目的語となる名詞が必要。\n→ 空所には「management と複合名詞をつくる名詞」が必要です。\n\n■ 選択肢の確認\n(A) expertise … 名詞（不可算）「専門知識、手腕」 ○\n(B) expertly … 副詞「巧みに」 ×\n(C) expertized … 動詞の過去形・過去分詞「専門化された」 ×\n(D) expert … 名詞（人）／形容詞「専門家／熟練した」 ×\n\n■ 完成文\nMs. Valois has applied for a supervisor position that will allow her to demonstrate her management expertise.\n（Valois さんは、自身の管理手腕を発揮できる管理職に応募した。）\n\n■ 解き方のポイント\nmanagement expertise＝「管理の専門知識」。expert（人）とは意味が違う。","words":[{"w":"applied for","p":"熟語","m":"応募した"},{"w":"supervisor position","p":"名詞","m":"管理職"},{"w":"demonstrate","p":"動詞","m":"発揮する"},{"w":"expertise","p":"名詞","m":"専門知識、手腕"}]},{"id":913,"category":"文法模試セット13","question":"The new order-tracking system will highlight outstanding orders that need to be ______.","A":"expedite","B":"expediting","C":"expedited","D":"expedites","answer":"C","answer_word":"expedited","explanation":"■ 文の骨格\nThe new order-tracking system will highlight outstanding orders that need to be ______.\n\n■ 空所に入るもの\nto be の後ろで、主語 orders は「迅速に処理される」側なので過去分詞が必要。\n→ 空所には「受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) expedite … 動詞（原形）「迅速に処理する」 ×\n(B) expediting … 現在分詞・動名詞「迅速に処理すること」 ×\n(C) expedited … 過去分詞「迅速に処理された」 ○\n(D) expedites … 動詞（三人称単数現在形）「迅速に処理する」 ×\n\n■ 完成文\nThe new order-tracking system will highlight outstanding orders that need to be expedited.\n（新しい注文追跡システムは、急いで処理すべき未処理の注文を目立たせる。）\n\n■ 解き方のポイント\n〈need to be＋過去分詞〉で「〜される必要がある」。","words":[{"w":"order-tracking","p":"形容詞","m":"注文追跡の"},{"w":"highlight","p":"動詞","m":"目立たせる"},{"w":"outstanding orders","p":"名詞","m":"未処理の注文"},{"w":"expedited","p":"過去分詞","m":"迅速に処理された"}]},{"id":914,"category":"文法模試セット13","question":"______ starting their own business, Mr. Amano and Mr. Akazaki had been classmates at Kamakura Institute of Technology.","A":"By means of","B":"In order to","C":"Former","D":"Prior to","answer":"D","answer_word":"Prior to","explanation":"■ 文の骨格\n______ starting their own business, Mr. Amano and Mr. Akazaki had been classmates at Kamakura Institute of Technology.\n\n■ 空所に入るもの\n空所の後ろが動名詞 starting なので、前置詞として働く語句が必要。\n→ 空所には「動名詞を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) By means of … 群前置詞「〜によって」 ×\n(B) In order to … 群不定詞「〜するために」 ×\n(C) Former … 形容詞「以前の」 ×\n(D) Prior to … 群前置詞「〜より前に」 ○\n\n■ 完成文\nPrior to starting their own business, Mr. Amano and Mr. Akazaki had been classmates at Kamakura Institute of Technology.\n（自ら事業を始める前、Amano さんと Akazaki さんは鎌倉工科大学の同級生だった。）\n\n■ 解き方のポイント\nprior to の to は前置詞。後ろは名詞か動名詞。","words":[{"w":"Prior to","p":"熟語","m":"〜より前に"},{"w":"starting","p":"動名詞","m":"始めること"},{"w":"classmates","p":"名詞","m":"同級生"},{"w":"Institute of Technology","p":"名詞","m":"工科大学"}]},{"id":915,"category":"文法模試セット13","question":"Over the past 20 years, Vertelli Apparel has developed an ______ reputation as a leader in the fashion industry.","A":"envy","B":"envying","C":"enviable","D":"enviably","answer":"C","answer_word":"enviable","explanation":"■ 文の骨格\nOver the past 20 years, Vertelli Apparel has developed an ______ reputation as a leader in the fashion industry.\n\n■ 空所に入るもの\n冠詞 an と名詞 reputation の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) envy … 名詞／動詞「羨望／うらやむ」 ×\n(B) envying … 現在分詞・動名詞「うらやむこと」 ×\n(C) enviable … 形容詞「うらやましいほどの」 ○\n(D) enviably … 副詞「うらやましいほどに」 ×\n\n■ 完成文\nOver the past 20 years, Vertelli Apparel has developed an enviable reputation as a leader in the fashion industry.\n（過去20年で、Vertelli Apparel 社はファッション業界のリーダーとしてうらやまれるほどの評判を築いた。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。-able は形容詞の目印。","words":[{"w":"Apparel","p":"名詞","m":"アパレル、衣料"},{"w":"enviable","p":"形容詞","m":"うらやましいほどの"},{"w":"reputation","p":"名詞","m":"評判"},{"w":"fashion industry","p":"名詞","m":"ファッション業界"}]},{"id":916,"category":"文法模試セット13","question":"Please note that the conference venue may change ______ the registered attendees number more than 100.","A":"despite","B":"if","C":"due to","D":"consequently","answer":"B","answer_word":"if","explanation":"■ 文の骨格\nPlease note that the conference venue may change ______ the registered attendees number more than 100.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、条件を表す接続詞が文意に合う。\n→ 空所には「条件を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) despite … 前置詞「〜にもかかわらず」 ×\n(B) if … 接続詞「もし〜なら」 ○\n(C) due to … 群前置詞「〜のため」 ×\n(D) consequently … 副詞「その結果」 ×\n\n■ 完成文\nPlease note that the conference venue may change if the registered attendees number more than 100.\n（登録参加者が100人を超える場合、会議の会場が変更になることがありますのでご留意ください。）\n\n■ 解き方のポイント\n後ろが〈主語＋動詞〉なら接続詞。前置詞・副詞は節をつなげない。","words":[{"w":"venue","p":"名詞","m":"会場"},{"w":"if","p":"接続詞","m":"もし〜なら"},{"w":"registered","p":"形容詞","m":"登録された"},{"w":"number","p":"動詞","m":"（数が）〜に達する"}]},{"id":917,"category":"文法模試セット13","question":"Staff members are advised that any technology developed while in the ______ of Grandocom belongs exclusively to the company.","A":"employ","B":"employed","C":"employing","D":"employer","answer":"A","answer_word":"employ","explanation":"■ 文の骨格\nStaff members are advised that any technology developed while in the ______ of Grandocom belongs exclusively to the company.\n\n■ 空所に入るもの\nin the employ of X（Xに雇用されて）という定型表現になる。\n→ 空所には「the と of に挟まれた名詞」が必要です。\n\n■ 選択肢の確認\n(A) employ … 名詞「雇用」 ○\n(B) employed … 動詞の過去形・過去分詞「雇われた」 ×\n(C) employing … 現在分詞・動名詞「雇うこと」 ×\n(D) employer … 名詞（人）「雇用主」 ×\n\n■ 完成文\nStaff members are advised that any technology developed while in the employ of Grandocom belongs exclusively to the company.\n（職員は、Grandocom 社に在職中に開発した技術はすべて会社に専属的に帰属すると通知されている。）\n\n■ 解き方のポイント\nin the employ of X＝「Xに雇われて」。employ は名詞でも使う。","words":[{"w":"technology","p":"名詞","m":"技術"},{"w":"in the employ of","p":"熟語","m":"〜に雇用されて"},{"w":"belongs to","p":"熟語","m":"〜に帰属する"},{"w":"exclusively","p":"副詞","m":"専属的に"}]},{"id":918,"category":"文法模試セット13","question":"The Sunnyside Inn offers spacious rooms ______ afford beautiful views of the Still River Valley throughout the seasons.","A":"and","B":"that","C":"then","D":"when","answer":"B","answer_word":"that","explanation":"■ 文の骨格\nThe Sunnyside Inn offers spacious rooms ______ afford beautiful views of the Still River Valley throughout the seasons.\n\n■ 空所に入るもの\n先行詞 spacious rooms を受け、関係詞節の主語になる語が必要。\n→ 空所には「物を先行詞とする主格の関係代名詞」が必要です。\n\n■ 選択肢の確認\n(A) and … 等位接続詞「そして」 ×\n(B) that … 関係代名詞（主格）「それらは」 ○\n(C) then … 副詞「そのとき」 ×\n(D) when … 関係副詞「〜するとき」 ×\n\n■ 完成文\nThe Sunnyside Inn offers spacious rooms that afford beautiful views of the Still River Valley throughout the seasons.\n（Sunnyside Inn は、四季を通じて Still River 渓谷の美しい眺めが楽しめる広々とした客室を提供している。）\n\n■ 解き方のポイント\nand だと動詞が2つ並んで主語が不足する。つなぐ働きと主語を兼ねる関係代名詞が必要。","words":[{"w":"spacious","p":"形容詞","m":"広々とした"},{"w":"that","p":"関係代名詞","m":"それらは"},{"w":"afford","p":"動詞","m":"（眺めを）与える"},{"w":"Valley","p":"名詞","m":"渓谷"}]},{"id":919,"category":"文法模試セット13","question":"Ken Gupta's latest novel, Listen to the Song of the Wind, certainly lends ______ to being adapted for film.","A":"them","B":"it","C":"themselves","D":"itself","answer":"D","answer_word":"itself","explanation":"■ 文の骨格\nKen Gupta's latest novel, Listen to the Song of the Wind, certainly lends ______ to being adapted for film.\n\n■ 空所に入るもの\nlend itself to X（Xに適している）という定型表現で、主語と同じものを指す。\n→ 空所には「lend の目的語になる再帰代名詞」が必要です。\n\n■ 選択肢の確認\n(A) them … 目的格の代名詞（複数）「それらを」 ×\n(B) it … 目的格の代名詞（単数）「それを」 ×\n(C) themselves … 再帰代名詞（複数）「それら自身」 ×\n(D) itself … 再帰代名詞（単数）「それ自身を」 ○\n\n■ 完成文\nKen Gupta's latest novel, Listen to the Song of the Wind, certainly lends itself to being adapted for film.\n（Ken Gupta の最新作『Listen to the Song of the Wind』は、確かに映画化に向いている。）\n\n■ 解き方のポイント\nlend itself to X＝「Xに適している」。主語が単数なので itself。","words":[{"w":"latest novel","p":"名詞","m":"最新作の小説"},{"w":"certainly","p":"副詞","m":"確かに"},{"w":"lends itself to","p":"熟語","m":"〜に適している"},{"w":"adapted","p":"動詞（過去分詞）","m":"翻案された"}]},{"id":920,"category":"文法模試セット13","question":"Situated near the city center, Dolphin Hotel is ______ enough to reach on foot from Central Station.","A":"close","B":"closely","C":"closed","D":"closure","answer":"A","answer_word":"close","explanation":"■ 文の骨格\nSituated near the city center, Dolphin Hotel is ______ enough to reach on foot from Central Station.\n\n■ 空所に入るもの\nis の補語が欠けており、enough to do を伴う形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) close … 形容詞「近い」 ○\n(B) closely … 副詞「密接に」 ×\n(C) closed … 過去分詞・形容詞「閉まっている」 ×\n(D) closure … 名詞「閉鎖」 ×\n\n■ 完成文\nSituated near the city center, Dolphin Hotel is close enough to reach on foot from Central Station.\n（市の中心部近くに位置する Dolphin ホテルは、中央駅から歩いて行けるほど近い。）\n\n■ 解き方のポイント\n形容詞＋enough to do＝「〜するほど…だ」。close（近い）と closely（密接に）を区別。","words":[{"w":"Situated","p":"過去分詞","m":"位置している"},{"w":"close","p":"形容詞","m":"近い"},{"w":"enough to","p":"熟語","m":"〜するのに十分"},{"w":"on foot","p":"熟語","m":"徒歩で"}]},{"id":921,"category":"文法模試セット13","question":"Factory workers are required to wear protective clothing ______ that fire, electrical, or chemical hazards exist.","A":"when","B":"because of","C":"anywhere","D":"even if","answer":"C","answer_word":"anywhere","explanation":"■ 文の骨格\nFactory workers are required to wear protective clothing ______ that fire, electrical, or chemical hazards exist.\n\n■ 空所に入るもの\n空所の後ろに〈主語＋動詞〉を含む節が続き、場所を表す語が必要。\n→ 空所には「節を導く複合関係副詞」が必要です。\n\n■ 選択肢の確認\n(A) when … 接続詞「〜のとき」 ×\n(B) because of … 群前置詞「〜のため」 ×\n(C) anywhere … 複合関係副詞「〜する場所ならどこでも」 ○\n(D) even if … 接続詞（群）「たとえ〜でも」 ×\n\n■ 完成文\nFactory workers are required to wear protective clothing anywhere that fire, electrical, or chemical hazards exist.\n（工場労働者は、火災・電気・化学の危険がある場所ではどこでも防護服を着用することが求められる。）\n\n■ 解き方のポイント\nanywhere (that)＋節＝「〜する場所ならどこでも」。場所を表す節を導く。","words":[{"w":"protective clothing","p":"名詞","m":"防護服"},{"w":"anywhere","p":"複合関係副詞","m":"〜する場所ならどこでも"},{"w":"hazards","p":"名詞","m":"危険"},{"w":"exist","p":"動詞","m":"存在する"}]},{"id":922,"category":"文法模試セット13","question":"A few board members expressed concerns about expansion into China, but ______ are looking forward to investing in the area.","A":"most","B":"much","C":"another","D":"other","answer":"A","answer_word":"most","explanation":"■ 文の骨格\nA few board members expressed concerns about expansion into China, but ______ are looking forward to investing in the area.\n\n■ 空所に入るもの\n述語動詞 are に対応する複数扱いの主語が必要で、前半の a few と対比になる語が入る。\n→ 空所には「複数扱いの主語になる代名詞」が必要です。\n\n■ 選択肢の確認\n(A) most … 代名詞（複数扱い）「大半」 ○\n(B) much … 代名詞（不可算・単数扱い）「多く」 ×\n(C) another … 代名詞（単数扱い）「もう1つ」 ×\n(D) other … 形容詞「ほかの」 ×\n\n■ 完成文\nA few board members expressed concerns about expansion into China, but most are looking forward to investing in the area.\n（数名の取締役は中国進出への懸念を示したが、大半はその地域への投資を楽しみにしている。）\n\n■ 解き方のポイント\nmost は単独で代名詞として使え、可算名詞を受ければ複数扱い。","words":[{"w":"board members","p":"名詞","m":"取締役"},{"w":"concerns","p":"名詞","m":"懸念"},{"w":"expansion","p":"名詞","m":"進出、拡大"},{"w":"most","p":"代名詞","m":"大半"},{"w":"investing","p":"動名詞","m":"投資すること"}]}];

const PROG_KEY = 'toeic_progress_v2';
const STAR_KEY = 'toeic_stars_v2';
let progress = JSON.parse(localStorage.getItem(PROG_KEY)||'{}');
let stars     = JSON.parse(localStorage.getItem(STAR_KEY)||'{}');
const saveProg = () => localStorage.setItem(PROG_KEY, JSON.stringify(progress));
const saveStar = () => localStorage.setItem(STAR_KEY, JSON.stringify(stars));

// ── Helpers ─────────────────────────────────────────────────
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function groupQs(g){return QUESTIONS.filter(q=>g.cats.includes(q.category))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2000)}

// ── Screen management ────────────────────────────────────────
let screenStack = ['home'];
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id+'-screen').classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const nb = document.getElementById('nav-'+id);
  if(nb) nb.classList.add('active');
  document.getElementById('hdr-back').style.display = ['home','list','stats'].includes(id)?'none':'block';
  const titles = {home:'TOEIC 文法問題',list:'問題一覧',stats:'成績',detail:'カテゴリ詳細',quiz:'問題'};
  document.getElementById('hdr-title').textContent = titles[id]||'TOEIC 文法問題';
  if(id==='home') renderHome();
  if(id==='list') renderList();
  if(id==='stats') renderStats();
  screenStack.push(id);
}
function goBack(){
  screenStack.pop();
  const prev = screenStack[screenStack.length-1]||'home';
  screenStack.pop();
  showScreen(prev);
}

// ── Home ─────────────────────────────────────────────────────
function renderHome(){
  const ans = Object.keys(progress).length;
  const cor = Object.values(progress).filter(v=>v==='correct').length;
  const wrg = Object.values(progress).filter(v=>v==='wrong').length;
  const stc = Object.keys(stars).filter(k=>stars[k]).length;
  document.getElementById('hs-ans').textContent  = ans;
  document.getElementById('hs-rate').textContent = ans>0?Math.round(cor/ans*100)+'%':'-%';
  document.getElementById('hs-star').textContent = stc;
  document.querySelectorAll('.qs-wrong-count').forEach(el=>el.textContent=wrg+'問');
  document.querySelectorAll('.qs-star-count').forEach(el=>el.textContent=stc+'問');
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = '';
  GROUPS.forEach(g=>{
    const qs  = groupQs(g);
    const cor = qs.filter(q=>progress[q.id]==='correct').length;
    const tot = qs.length;
    const pct = tot>0?Math.round(cor/tot*100):0;
    const el  = document.createElement('div');
    el.className = 'cg';
    el.innerHTML = `<div class="cg-icon">${g.icon}</div>
      <div class="cg-name">${g.name}</div>
      <div class="cg-count">${tot}問・正解 ${cor}問</div>
      <div class="cg-bar"><div class="cg-fill" style="width:${pct}%;background:${g.color}"></div></div>
      <div class="cg-rate">${pct}% 正解率</div>`;
    el.onclick = ()=>openCatDetail(g);
    grid.appendChild(el);
  });
}

// ── Category detail ──────────────────────────────────────────
let curGroup = null;
function openCatDetail(g){
  curGroup = g;
  showScreen('detail');
  document.getElementById('hdr-title').textContent = g.name;
  const list = document.getElementById('detail-list');
  list.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.padding = '8px 12px';
  // Start buttons
  const sb = document.createElement('div');
  sb.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;margin-top:8px';
  sb.innerHTML = `
    <button onclick="startQuiz('group')" style="background:${g.color};color:white;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:.9rem;cursor:pointer">おすすめ順</button>
    <button onclick="startQuiz('group-wrong')" style="background:white;color:${g.color};border:2px solid ${g.color};border-radius:12px;padding:13px;font-weight:700;font-size:.9rem;cursor:pointer">不正解のみ</button>`;
  wrap.appendChild(sb);
  groupQs(g).forEach(q=>{
    const div = document.createElement('div');
    div.className = 'li';
    const st = progress[q.id];
    const isStar = stars[q.id];
    div.innerHTML = `<div class="li-top">
      <span class="li-num">#${q.id}</span>
      ${st==='correct'?'<span class="li-badge correct">正解</span>':st==='wrong'?'<span class="li-badge wrong">不正解</span>':''}
      ${isStar?'<span class="li-badge star">★</span>':''}
    </div><div class="li-q">${esc(q.question)}</div>`;
    div.onclick = ()=>startSingleQ(q);
    wrap.appendChild(div);
  });
  list.appendChild(wrap);
}

// ── List screen ──────────────────────────────────────────────
function renderList(){
  const filter = document.getElementById('list-filter').value;
  let qs = QUESTIONS;
  if(filter==='wrong')      qs=QUESTIONS.filter(q=>progress[q.id]==='wrong');
  if(filter==='correct')    qs=QUESTIONS.filter(q=>progress[q.id]==='correct');
  if(filter==='unanswered') qs=QUESTIONS.filter(q=>!progress[q.id]);
  if(filter==='star')       qs=QUESTIONS.filter(q=>stars[q.id]);
  const body = document.getElementById('list-body');
  body.innerHTML = '';
  qs.forEach(q=>{
    const div = document.createElement('div');
    div.className = 'li';
    const st=progress[q.id];
    div.innerHTML = `<div class="li-top">
      <span class="li-num">#${q.id}</span>
      ${st==='correct'?'<span class="li-badge correct">正解</span>':st==='wrong'?'<span class="li-badge wrong">不正解</span>':''}
      ${stars[q.id]?'<span class="li-badge star">★</span>':''}
    </div><div class="li-q">${esc(q.question)}</div>`;
    div.onclick=()=>startSingleQ(q);
    body.appendChild(div);
  });
  if(!qs.length) body.innerHTML='<div style="text-align:center;padding:40px;color:#94a3b8">該当なし</div>';
}

// ── Stats screen ─────────────────────────────────────────────
function renderStats(){
  const ans = Object.keys(progress).length;
  const cor = Object.values(progress).filter(v=>v==='correct').length;
  const wrg = Object.values(progress).filter(v=>v==='wrong').length;
  const stc = Object.keys(stars).filter(k=>stars[k]).length;
  let html = `<div class="stats-card"><h3>全体</h3>
    <div class="stats-row"><span class="stats-label">回答済み</span><span class="stats-val">${ans} / ${QUESTIONS.length}問</span></div>
    <div class="stats-row"><span class="stats-label">正解</span><span class="stats-val" style="color:#16a34a">${cor}問</span></div>
    <div class="stats-row"><span class="stats-label">不正解</span><span class="stats-val" style="color:#dc2626">${wrg}問</span></div>
    <div class="stats-row"><span class="stats-label">正解率</span><span class="stats-val">${ans>0?Math.round(cor/ans*100):0}%</span></div>
    <div class="stats-row"><span class="stats-label">★チェック</span><span class="stats-val">${stc}問</span></div>
  </div><div class="stats-card"><h3>カテゴリ別</h3>`;
  GROUPS.forEach(g=>{
    const qs=groupQs(g);
    const c=qs.filter(q=>progress[q.id]==='correct').length;
    const t=qs.length;
    const pct=t>0?Math.round(c/t*100):0;
    html+=`<div class="stats-row">
      <span class="stats-label">${g.name}</span>
      <span class="stats-val">${pct}% (${c}/${t})</span>
    </div>`;
  });
  html+='</div>';
  document.getElementById('stats-body').innerHTML=html;
}

// ── Quiz logic ───────────────────────────────────────────────
let queue=[], qIdx=0, curQ=null, answered=false, sesCor=0, sesTot=0;

function buildQueue(pool){
  const una=shuffle(pool.filter(q=>!progress[q.id]));
  const wrg=shuffle(pool.filter(q=>progress[q.id]==='wrong'));
  const cor=shuffle(pool.filter(q=>progress[q.id]==='correct'));
  return [...una,...wrg,...cor];
}

function startQuiz(mode){
  let pool;
  if(mode==='all')         pool=QUESTIONS;
  else if(mode==='wrong')  pool=QUESTIONS.filter(q=>progress[q.id]==='wrong');
  else if(mode==='star')   pool=QUESTIONS.filter(q=>stars[q.id]);
  else if(mode==='group')  pool=groupQs(curGroup);
  else if(mode==='group-wrong') pool=groupQs(curGroup).filter(q=>progress[q.id]==='wrong');
  else pool=QUESTIONS;
  if(!pool.length){toast('該当する問題がありません');return;}
  queue=buildQueue(pool);
  qIdx=0; sesCor=0; sesTot=0;
  showScreen('quiz');
  showQ();
}

function startSingleQ(q){
  queue=[q]; qIdx=0; sesCor=0; sesTot=0;
  showScreen('quiz');
  showQ();
}

function showQ(){
  if(qIdx>=queue.length){
    toast(`セッション終了 ${sesCor}/${sesTot} 正解`);
    goBack();
    return;
  }
  curQ=queue[qIdx]; answered=false;
  document.getElementById('q-num').textContent=`${qIdx+1} / ${queue.length}`;
  document.getElementById('q-cat').textContent=curQ.category||'';
  document.getElementById('q-text').textContent=curQ.question;
  document.getElementById('q-star').textContent=stars[curQ.id]?'★':'☆';
  document.getElementById('q-prog-fill').style.width=(qIdx/queue.length*100)+'%';
  ['A','B','C','D'].forEach(k=>{
    document.getElementById('ct-'+k).textContent=curQ[k];
  });
  document.querySelectorAll('.c-btn').forEach(b=>{
    b.disabled=false;
    b.className='c-btn';
  });
  // Hint
  const hb=document.getElementById('hint-btn');
  const hbox=document.getElementById('hint-box');
  hb.style.display='block'; hbox.style.display='none';
  hbox.textContent='';
  // Exp
  const ew=document.getElementById('exp-wrap');
  ew.classList.remove('show'); ew.innerHTML='';
  document.getElementById('btn-next').style.display='none';
}

function showHint(){
  const exp=curQ.explanation||'';
  let hint='';
  if(exp.includes('■')){
    const m=exp.match(/■[\s\S]*?空所に入るもの[\s\S]*?\n([\s\S]*?)(?=\n■|$)/);
    hint=m?m[1].trim().split('\n')[0]:'';
  }
  if(!hint){
    const dot=exp.indexOf('。');
    hint=dot>0&&dot<130?exp.substring(0,dot+1):exp.substring(0,90)+'…';
  }
  document.getElementById('hint-btn').style.display='none';
  const hbox=document.getElementById('hint-box');
  hbox.textContent=hint;
  hbox.style.display='block';
}

function checkAnswer(q,sel){
  if(answered)return;
  answered=true;
  const ok=sel===q.answer;
  progress[q.id]=ok?'correct':'wrong';
  saveProg();
  sesCor+=ok?1:0; sesTot++;
  document.querySelectorAll('.c-btn').forEach((b,i)=>{
    const k=['A','B','C','D'][i];
    b.disabled=true;
    if(k===q.answer) b.classList.add(ok&&k===sel?'ok':'show-ok');
    if(k===sel&&!ok) b.classList.add('ng');
  });
  document.getElementById('hint-btn').style.display='none';
  document.getElementById('hint-box').style.display='none';
  // Build explanation
  const ew=document.getElementById('exp-wrap');
  ew.innerHTML=
    `<div class="exp-result ${ok?'ok':'ng'}">${ok?'&#9989; 正解！':'&#10060; 不正解'}</div>`+
    `<div class="exp-ans"><span class="aw">正答: (${q.answer}) ${esc(q.answer_word)}</span>`+
    `<span class="ao">(A)${esc(q.A)} (B)${esc(q.B)} (C)${esc(q.C)} (D)${esc(q.D)}</span></div>`+
    `<div class="exp-body">&#128218; 解説<br>${formatExp(q)}</div>`;
  requestAnimationFrame(()=>ew.classList.add('show'));
  document.getElementById('btn-next').style.display='block';
}

function nextQ(){qIdx++;showQ();}

function toggleStar(){
  if(!curQ)return;
  stars[curQ.id]=!stars[curQ.id];
  saveStar();
  document.getElementById('q-star').textContent=stars[curQ.id]?'★':'☆';
  toast(stars[curQ.id]?'★ チェックに追加':'チェックを解除');
}

function showStarList(){
  document.getElementById('list-filter').value='star';
  showScreen('list');
}

// ── Explanation formatter ────────────────────────────────────
function buildWordMap(words){
  const m={};
  if(words) words.forEach(w=>m[w.w.toLowerCase()]=w);
  return m;
}

function annotateSentence(sentence, wm){
  if(!sentence)return'';
  const tokens=sentence.split(/(\s+)/);
  return tokens.map(tok=>{
    if(/^\s+$/.test(tok))return' ';
    const clean=tok.replace(/[^a-zA-Z\-']/g,'').toLowerCase();
    const info=wm[clean];
    if(info&&(info.p||info.m)){
      return`<span class="wa"><span class="wt">${esc(tok)}</span><span class="wi">(${esc(info.p)}) ${esc(info.m)}</span></span>`;
    }
    return`<span class="wa"><span class="wt wt-plain">${esc(tok)}</span><span class="wi"></span></span>`;
  }).join('');
}

function formatExp(q){
  const text=q.explanation||'';
  if(!text)return'';
  const wm=buildWordMap(q.words);

  if(!text.includes('■')){
    // 日本語解説
    let s=esc(text);
    const aw=esc(q.answer_word);
    if(aw)s=s.replace(new RegExp(aw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),'<span class="ab">'+aw+'</span>');
    s=s.replace(/\(([ABCD])\)/g,'(<b>$1</b>)');
    s=s.replace(/「([^」]{1,30})」/g,'「<b>$1</b>」');
    return'<div style="margin-top:8px">'+s.replace(/\n/g,'<br>')+'</div>';
  }

  // 丁寧解説
  const parts=text.split(/(■[^\n]+)/);
  let out='';
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    if(p.startsWith('■')){
      const title=p.trim();
      const body=(parts[++i]||'').trim();
      if(title==='■ 完成文'||title==='■完成文'){
        const lines=body.split('\n').map(l=>l.trim()).filter(l=>l);
        const eng=lines.find(l=>/^[A-Za-z]/.test(l))||'';
        const jp=lines.find(l=>/^（/.test(l))||'';
        out+=`<div class="exp-sec"><div class="exp-sec-title">${esc(title)}</div>`+
             `<div class="exp-sentence">${annotateSentence(eng,wm)}</div>`+
             (jp?`<div class="exp-jp">${esc(jp)}</div>`:'')+`</div>`;
      }else{
        const aw=esc(q.answer_word);
        let bh=esc(body)
          .replace(/\(([ABCD])\)/g,'(<b>$1</b>)')
          .replace(/「([^」]{1,40})」/g,'「<b>$1</b>」')
          .replace(/→([^\n]+)/g,'<span class="exp-arrow">→$1</span>')
          .replace(/○/g,'<span class="exp-ok">○</span>')
          .replace(/×/g,'<span class="exp-ng">×</span>')
          .replace(/\n/g,'<br>');
        if(aw)bh=bh.replace(new RegExp(aw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),'<span class="ab">'+aw+'</span>');
        out+=`<div class="exp-sec"><div class="exp-sec-title">${esc(title)}</div><div class="exp-sec-body">${bh}</div></div>`;
      }
    }else if(p.trim()){
      out+='<div style="margin-bottom:8px">'+esc(p).replace(/\n/g,'<br>')+'</div>';
    }
  }
  return out;
}

renderHome();
