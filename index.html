<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TOEIC 文法問題</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
/* ── Header ── */
#hdr{background:#2563eb;color:white;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#hdr-back{display:none;background:none;border:none;color:white;font-size:22px;cursor:pointer;padding:0 6px 0 0}
#hdr-title{font-size:1.05rem;font-weight:700;flex:1}
#hdr-star{font-size:1.3rem;cursor:pointer;background:none;border:none;color:white;padding:0}
/* ── Screens ── */
.screen{display:none;padding-bottom:80px}
.screen.active{display:block}
/* ── Bottom nav ── */
#nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e2e8f0;display:flex;z-index:100}
.nav-btn{flex:1;padding:10px 0 8px;border:none;background:none;font-size:10px;color:#64748b;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav-btn.active{color:#2563eb}
.nav-btn svg{width:22px;height:22px}
/* ── Home screen ── */
#home-stats{background:#2563eb;padding:0 16px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-card{background:rgba(255,255,255,.18);border-radius:12px;padding:14px 10px;text-align:center;color:white}
.stat-val{font-size:1.7rem;font-weight:800}
.stat-lbl{font-size:.72rem;opacity:.85;margin-top:2px}
#home-body{padding:16px}
.sec-title{font-size:.78rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
/* Quick start cards */
.qs-card{background:white;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.07);-webkit-user-select:none}
.qs-card:active{opacity:.7}
.qs-icon{font-size:1.6rem;width:40px;text-align:center}
.qs-main{flex:1}
.qs-name{font-weight:700;font-size:.95rem;color:#2563eb}
.qs-sub{font-size:.78rem;color:#64748b;margin-top:2px}
.qs-arr{color:#94a3b8;font-size:1.1rem}
/* Category grid */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cg{background:white;border-radius:14px;padding:14px 12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.cg:active{opacity:.7}
.cg-icon{font-size:1.5rem;margin-bottom:6px}
.cg-name{font-weight:700;font-size:.9rem;margin-bottom:4px}
.cg-count{font-size:.75rem;color:#64748b}
.cg-bar{height:4px;background:#e2e8f0;border-radius:2px;margin:8px 0 4px}
.cg-fill{height:4px;border-radius:2px}
.cg-rate{font-size:.75rem;color:#64748b}
/* ── List screen ── */
#list-screen{padding-top:8px}
.list-header{padding:10px 16px;background:white;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:8px}
.list-header select{flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:.9rem;background:white}
#list-body{padding:8px 12px}
.li{background:white;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.li:active{opacity:.7}
.li-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.li-num{font-size:.75rem;color:#94a3b8;min-width:28px}
.li-badge{font-size:.7rem;padding:2px 7px;border-radius:10px;font-weight:700}
.li-badge.correct{background:#dcfce7;color:#15803d}
.li-badge.wrong{background:#fee2e2;color:#b91c1c}
.li-badge.star{background:#fef3c7;color:#92400e}
.li-q{font-size:.85rem;color:#374151;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ── Stats screen ── */
#stats-screen{padding:16px}
.stats-card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.stats-card h3{font-size:.9rem;font-weight:700;color:#64748b;margin-bottom:12px}
.stats-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9}
.stats-row:last-child{border-bottom:none}
.stats-label{font-size:.88rem;color:#374151}
.stats-val{font-weight:700;font-size:.95rem}
/* ── Detail screen ── */
#detail-screen{padding-top:8px}
#detail-list{padding:8px 12px}
/* ── Quiz screen ── */
#quiz-screen{padding:0}
#q-wrap{padding:14px 14px 6px;position:relative}
#q-num{font-size:.78rem;color:#94a3b8;margin-bottom:6px}
#q-star{position:absolute;top:14px;right:14px;font-size:1.4rem;cursor:pointer;background:none;border:none;padding:4px}
#q-cat{font-size:.72rem;color:#2563eb;font-weight:700;margin-bottom:8px}
#q-text{font-size:1rem;line-height:1.65;font-weight:500}
#hint-wrap{padding:0 14px 8px}
#hint-btn{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:9px 16px;font-size:.85rem;font-weight:700;cursor:pointer;width:100%}
#hint-box{display:none;background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px 14px;font-size:.85rem;color:#78350f;line-height:1.6}
#choices{padding:0 14px}
.c-btn{width:100%;background:white;border:1.5px solid #e2e8f0;border-radius:12px;padding:13px 14px;margin-bottom:10px;font-size:.95rem;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:inherit;-webkit-user-select:none}
.c-btn:active{opacity:.75}
.c-label{font-weight:800;color:#64748b;min-width:18px}
.c-btn.ok{background:#dcfce7;border-color:#16a34a;color:#15803d}
.c-btn.show-ok{border-color:#16a34a}
.c-btn.ng{background:#fee2e2;border-color:#dc2626;color:#b91c1c}
#exp-wrap{padding:10px 14px 0;max-height:0;overflow:hidden;transition:max-height .4s ease,opacity .4s ease;opacity:0}
#exp-wrap.show{max-height:2000px;opacity:1}
.exp-result{font-size:1rem;font-weight:800;padding:10px 14px;border-radius:10px;margin-bottom:10px}
.exp-result.ok{background:#dcfce7;color:#15803d}
.exp-result.ng{background:#fee2e2;color:#b91c1c}
.exp-ans{font-size:.85rem;margin-bottom:10px;color:#374151}
.aw{font-weight:700;color:#2563eb}
.ao{display:block;font-size:.78rem;color:#64748b;margin-top:3px}
.exp-body{background:#fffbeb;border-radius:12px;padding:12px 14px;font-size:.88rem;line-height:1.8}
.ab{color:#2563eb;font-weight:700}
/* 丁寧解説 sections */
.exp-sec{margin-bottom:12px}
.exp-sec-title{font-weight:800;color:#1e3a8a;font-size:.88rem;border-left:3px solid #2563eb;padding-left:8px;margin-bottom:6px}
.exp-sec-body{font-size:.86rem;line-height:1.85}
.exp-arrow{color:#2563eb;font-weight:700}
.exp-ok{color:#16a34a;font-weight:700}
.exp-ng{color:#dc2626;font-weight:700}
/* 完成文 word annotation */
.exp-sentence{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 6px;margin:8px 0;padding:10px 12px;background:white;border-radius:10px;line-height:1}
.wa{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom}
.wt{border-bottom:2px solid #2563eb;padding-bottom:2px;font-weight:600;font-size:.88rem;white-space:nowrap}
.wt-plain{border-bottom:2px solid #cbd5e1;font-weight:400;color:#374151}
.wi{font-size:.6rem;color:#1e40af;margin-top:3px;white-space:nowrap;text-align:center;min-height:1em}
.exp-jp{font-size:.83rem;color:#475569;margin-top:6px;padding:8px 10px;background:#f0f4ff;border-radius:8px}
#btn-next{display:none;margin:14px 14px 30px;width:calc(100% - 28px);background:#2563eb;color:white;border:none;border-radius:12px;padding:16px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
/* ── Progress bar ── */
#q-prog{height:3px;background:#e2e8f0;margin-bottom:0}
#q-prog-fill{height:3px;background:#2563eb;transition:width .3s}
/* ── Toast ── */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:9px 18px;border-radius:20px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;white-space:nowrap}
</style>
</head>
<body>
<div id="hdr">
  <button id="hdr-back" onclick="goBack()">&#8249;</button>
  <span id="hdr-title">TOEIC 文法問題</span>
  <button id="hdr-star" onclick="showStarList()" title="★チェック">&#9733;</button>
</div>

<!-- Home -->
<div id="home-screen" class="screen active">
  <div id="home-stats">
    <div class="stat-card"><div class="stat-val" id="hs-ans">0</div><div class="stat-lbl">回答済み</div></div>
    <div class="stat-card"><div class="stat-val" id="hs-rate">-%</div><div class="stat-lbl">正解率</div></div>
    <div class="stat-card"><div class="stat-val" id="hs-star">0</div><div class="stat-lbl">&#9733; チェック</div></div>
  </div>
  <div id="home-body">
    <div class="sec-title" style="margin-bottom:10px">クイックスタート</div>
    <div class="qs-card" onclick="startQuiz('all')">
      <div class="qs-icon">&#127381;</div>
      <div class="qs-main"><div class="qs-name">おすすめ順で出題</div><div class="qs-sub">未学習 → 不正解 → 正解の順</div></div>
      <div class="qs-arr">›</div>
    </div>
    <div class="qs-card" onclick="startQuiz('wrong')">
      <div class="qs-icon">&#128260;</div>
      <div class="qs-main"><div class="qs-name">不正解を復習</div><div class="qs-sub qs-wrong-count">0問</div></div>
      <div class="qs-arr">›</div>
    </div>
    <div class="qs-card" onclick="startQuiz('star')">
      <div class="qs-icon">&#9733;</div>
      <div class="qs-main"><div class="qs-name">★チェック問題</div><div class="qs-sub qs-star-count">0問</div></div>
      <div class="qs-arr">›</div>
    </div>
    <div class="sec-title" style="margin-top:20px;margin-bottom:10px">カテゴリから選ぶ</div>
    <div class="cat-grid" id="cat-grid"></div>
  </div>
</div>

<!-- List -->
<div id="list-screen" class="screen">
  <div class="list-header">
    <select id="list-filter" onchange="renderList()">
      <option value="all">すべて</option>
      <option value="wrong">不正解</option>
      <option value="correct">正解済み</option>
      <option value="unanswered">未学習</option>
      <option value="star">★チェック</option>
    </select>
  </div>
  <div id="list-body"></div>
</div>

<!-- Stats -->
<div id="stats-screen" class="screen">
  <div id="stats-body" style="padding:16px"></div>
</div>

<!-- Category detail -->
<div id="detail-screen" class="screen">
  <div id="detail-list"></div>
</div>

<!-- Quiz -->
<div id="quiz-screen" class="screen">
  <div id="q-prog"><div id="q-prog-fill" style="width:0%"></div></div>
  <div id="q-wrap">
    <div id="q-num"></div>
    <div id="q-cat"></div>
    <button id="q-star" onclick="toggleStar()">&#9734;</button>
    <div id="q-text"></div>
  </div>
  <div id="hint-wrap">
    <button id="hint-btn" onclick="showHint()">&#128161; ヒント</button>
    <div id="hint-box"></div>
  </div>
  <div id="choices">
    <button class="c-btn" onclick="checkAnswer(curQ,'A')"><span class="c-label">A</span><span id="ct-A"></span></button>
    <button class="c-btn" onclick="checkAnswer(curQ,'B')"><span class="c-label">B</span><span id="ct-B"></span></button>
    <button class="c-btn" onclick="checkAnswer(curQ,'C')"><span class="c-label">C</span><span id="ct-C"></span></button>
    <button class="c-btn" onclick="checkAnswer(curQ,'D')"><span class="c-label">D</span><span id="ct-D"></span></button>
  </div>
  <div id="exp-wrap"></div>
  <button id="btn-next" onclick="nextQ()">次の問題 ›</button>
</div>

<div id="nav">
  <button class="nav-btn active" id="nav-home" onclick="showScreen('home')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>ホーム
  </button>
  <button class="nav-btn" id="nav-list" onclick="showScreen('list')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>一覧
  </button>
  <button class="nav-btn" id="nav-stats" onclick="showScreen('stats')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>成績
  </button>
</div>
<div id="toast"></div>

<script>
const QUESTIONS = [{"id":1,"category":"品詞問題・トレーニング","question":"The weather in Merizo is very ______ year-round, though there are showers almost daily from December through March.","A":"agreeable","B":"agree","C":"agreement","D":"agreeably","answer":"A","answer_word":"agreeable","explanation":"■ 文の骨格\nThe weather in Merizo is very ______ year-round, though there are showers almost daily from December through March.\n\n■ 空所に入るもの\nis の後ろに副詞 very があり、その後は補語の位置。文の要素は S+V+C で、空所は C にあたる。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) agreeable … 形容詞「快適な、心地よい」 ○\n(B) agree … 動詞（原形）「同意する」 ×\n(C) agreement … 名詞「合意、同意」 ×\n(D) agreeably … 副詞「気持ちよく」 ×\n\n■ 完成文\nThe weather in Merizo is very agreeable year-round, though there are showers almost daily from December through March.\n（12月から3月にかけてほぼ毎日にわか雨が降るが、Merizo の天候は1年中とても快適だ。）\n\n■ 解き方のポイント\nvery のような副詞の直後は、副詞ではなく形容詞が来る位置。-able で終わる語は形容詞と判断できる。","words":[{"w":"weather","p":"名詞","m":"天候、天気"},{"w":"very","p":"副詞","m":"とても"},{"w":"agreeable","p":"形容詞","m":"快適な"},{"w":"year-round","p":"副詞","m":"1年を通して"},{"w":"though","p":"接続詞","m":"〜だけれども"},{"w":"showers","p":"名詞","m":"にわか雨"},{"w":"almost","p":"副詞","m":"ほとんど"},{"w":"daily","p":"副詞","m":"毎日"},{"w":"through","p":"前置詞","m":"〜まで（ずっと）"}]},{"id":2,"category":"品詞問題・トレーニング","question":"______ for the competition should be submitted by November 28 at the latest.","A":"Enter","B":"Entered","C":"Entering","D":"Entries","answer":"D","answer_word":"Entries","explanation":"■ 文の骨格\n______ for the competition should be submitted by November 28 at the latest.\n\n■ 空所に入るもの\n文全体の主語が欠けており、述語動詞は should be submitted。\n→ 空所には「文の主語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) Enter … 動詞（原形）「参加する、入る」 ×\n(B) Entered … 動詞の過去形・過去分詞「参加した」 ×\n(C) Entering … 動名詞・現在分詞「参加すること」 ×\n(D) Entries … 名詞（複数形）「応募作品、エントリー作品」 ○\n\n■ 完成文\nEntries for the competition should be submitted by November 28 at the latest.\n（コンテストへの応募作品は、遅くとも11月28日までに提出してください。）\n\n■ 解き方のポイント\n文頭が空所で直後に前置詞句 → 「主語となる名詞が要る」と考える。","words":[{"w":"competition","p":"名詞","m":"コンテスト、競技会"},{"w":"submitted","p":"動詞（過去分詞）","m":"提出された"},{"w":"at the latest","p":"熟語","m":"遅くとも"}]},{"id":3,"category":"品詞問題・トレーニング","question":"Creek County approved ______ to create a transportation council, which will coordinate the planning of new roads and tunnels.","A":"legislation","B":"legislate","C":"legislated","D":"legislates","answer":"A","answer_word":"legislation","explanation":"■ 文の骨格\nCreek County approved ______ to create a transportation council, which will coordinate the planning of new roads and tunnels.\n\n■ 空所に入るもの\n主語 Creek County、述語動詞 approved はそろっており、その目的語が欠けている。\n→ 空所には「他動詞 approved の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) legislation … 名詞「法律、条例」 ○\n(B) legislate … 動詞（原形）「法律を制定する」 ×\n(C) legislated … 動詞の過去形・過去分詞「法律を制定した」 ×\n(D) legislates … 動詞（三人称単数現在形）「法律を制定する」 ×\n\n■ 完成文\nCreek County approved legislation to create a transportation council, which will coordinate the planning of new roads and tunnels.\n（Creek郡は、新しい道路とトンネルの計画を調整する運輸審議会を創設する条例を承認した。）\n\n■ 解き方のポイント\n他動詞の直後の空所は目的語＝名詞。-tion で終わる語は名詞と判断できる。","words":[{"w":"County","p":"名詞","m":"郡"},{"w":"approved","p":"動詞（過去形）","m":"承認した"},{"w":"legislation","p":"名詞","m":"法律、条例"},{"w":"create","p":"動詞","m":"創設する"},{"w":"transportation","p":"名詞","m":"運輸、交通"},{"w":"council","p":"名詞","m":"審議会"},{"w":"coordinate","p":"動詞","m":"調整する"},{"w":"planning","p":"名詞","m":"計画立案"},{"w":"tunnels","p":"名詞","m":"トンネル"}]},{"id":4,"category":"品詞問題・トレーニング","question":"The award ceremony ______ with a speech by the Chief Executive Officer, Harry Robinson.","A":"opening","B":"to open","C":"opener","D":"opened","answer":"D","answer_word":"opened","explanation":"■ 文の骨格\nThe award ceremony ______ with a speech by the Chief Executive Officer, Harry Robinson.\n\n■ 空所に入るもの\n主語 The award ceremony（授賞式）の直後に空所があり、この文には動詞が1つもない。\n→ 空所には「述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) opening … 動名詞・現在分詞「開くこと／（名詞で）欠員」 ×\n(B) to open … 不定詞「開くこと」 ×\n(C) opener … 名詞「開けるもの、栓抜き」 ×\n(D) opened … 動詞（過去形）「幕を開けた、始まった」 ○\n\n■ 完成文\nThe award ceremony opened with a speech by the Chief Executive Officer, Harry Robinson.\n（授賞式は、最高経営責任者である Harry Robinson のスピーチで幕を開けた。）\n\n■ 解き方のポイント\n主語の直後に空所 →「動詞が足りないのでは？」と考えるのが第一手。","words":[{"w":"award","p":"名詞","m":"賞"},{"w":"ceremony","p":"名詞","m":"式典"},{"w":"opened","p":"動詞（過去形）","m":"始まった"},{"w":"speech","p":"名詞","m":"スピーチ、演説"},{"w":"Chief Executive Officer","p":"名詞","m":"最高経営責任者"}]},{"id":5,"category":"品詞問題・トレーニング","question":"The ensemble’s performance was ______ impressive because they decided to enter the contest at the last minute.","A":"particular","B":"particularity","C":"particulars","D":"particularly","answer":"D","answer_word":"particularly","explanation":"■ 文の骨格\nThe ensemble’s performance was ______ impressive because they decided to enter the contest at the last minute.\n\n■ 空所に入るもの\nwas の補語として形容詞 impressive がすでにあり、S+V+C がそろっている。空所は修飾語の位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) particular … 形容詞「特定の」 ×\n(B) particularity … 名詞「特殊性」 ×\n(C) particulars … 名詞（複数形）「詳細」 ×\n(D) particularly … 副詞「特に、とりわけ」 ○\n\n■ 完成文\nThe ensemble’s performance was particularly impressive because they decided to enter the contest at the last minute.\n（その合奏団は土壇場でコンテストへの参加を決めたので、その演奏は特に印象的だった。）\n\n■ 解き方のポイント\n〈be動詞＋空所＋形容詞〉は副詞が正解になる頻出パターン。","words":[{"w":"ensemble","p":"名詞","m":"合奏団"},{"w":"performance","p":"名詞","m":"演奏、公演"},{"w":"particularly","p":"副詞","m":"特に"},{"w":"impressive","p":"形容詞","m":"印象的な"},{"w":"decided","p":"動詞（過去形）","m":"決めた"},{"w":"enter","p":"動詞","m":"参加する"},{"w":"contest","p":"名詞","m":"コンテスト"},{"w":"at the last minute","p":"熟語","m":"土壇場で"}]},{"id":6,"category":"品詞問題・トレーニング","question":"Ogawara Electronics is going to relocate its corporate headquarters to a larger facility in order to accommodate the ______ of a legal department.","A":"additive","B":"addition","C":"added","D":"add","answer":"B","answer_word":"addition","explanation":"■ 文の骨格\nOgawara Electronics is going to relocate its corporate headquarters to a larger facility in order to accommodate the ______ of a legal department.\n\n■ 空所に入るもの\nthe と of に挟まれた位置は名詞が入る場所。\n→ 空所には「冠詞 the の後に置かれる名詞」が必要です。\n\n■ 選択肢の確認\n(A) additive … 形容詞「添加の、付加的な」 ×\n(B) addition … 名詞「追加、増設」 ○\n(C) added … 動詞の過去形・過去分詞「加えられた」 ×\n(D) add … 動詞（原形）「加える」 ×\n\n■ 完成文\nOgawara Electronics is going to relocate its corporate headquarters to a larger facility in order to accommodate the addition of a legal department.\n（Ogawara Electronics は、法務部の増設に対応するため、本社をより広い施設へ移転する予定だ。）\n\n■ 解き方のポイント\n〈the ＿＿ of〉の形は、空所に名詞が入る典型パターン。","words":[{"w":"relocate","p":"動詞","m":"移転する"},{"w":"corporate","p":"形容詞","m":"企業の"},{"w":"headquarters","p":"名詞","m":"本社"},{"w":"facility","p":"名詞","m":"施設"},{"w":"accommodate","p":"動詞","m":"収容する、対応する"},{"w":"addition","p":"名詞","m":"追加"},{"w":"legal department","p":"名詞","m":"法務部"}]},{"id":7,"category":"品詞問題・トレーニング","question":"The shareholders meeting will begin ______ at 2 P.M. so all presenters should be well prepared by that time.","A":"prompt","B":"prompted","C":"promptly","D":"promptness","answer":"C","answer_word":"promptly","explanation":"■ 文の骨格\nThe shareholders meeting will begin ______ at 2 P.M. so all presenters should be well prepared by that time.\n\n■ 空所に入るもの\n主語 The shareholders meeting と述語動詞 will begin がそろっており、空所がなくても文が成立する。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) prompt … 形容詞「迅速な、時間どおりの」 ×\n(B) prompted … 動詞の過去形・過去分詞「促された」 ×\n(C) promptly … 副詞「時間どおりに、きっかり」 ○\n(D) promptness … 名詞「迅速さ」 ×\n\n■ 完成文\nThe shareholders meeting will begin promptly at 2 P.M. so all presenters should be well prepared by that time.\n（株主総会は午後2時ちょうどに始まるので、発表者は全員それまでにしっかり準備しておくこと。）\n\n■ 解き方のポイント\n文の要素がそろっていれば、空所に入るのは修飾語（副詞）。","words":[{"w":"shareholders meeting","p":"名詞","m":"株主総会"},{"w":"begin","p":"動詞","m":"始まる"},{"w":"promptly","p":"副詞","m":"時間どおりに"},{"w":"presenters","p":"名詞","m":"発表者"},{"w":"prepared","p":"形容詞","m":"準備ができた"}]},{"id":8,"category":"品詞問題・トレーニング","question":"During yesterday’s press conference, Mr. Shimura ______ denied that the company would acquire Seattle-based White Corporation.","A":"emphasized","B":"emphatic","C":"emphatically","D":"emphasis","answer":"C","answer_word":"emphatically","explanation":"■ 文の骨格\nDuring yesterday’s press conference, Mr. Shimura ______ denied that the company would acquire Seattle-based White Corporation.\n\n■ 空所に入るもの\n主語 Mr. Shimura と述語動詞 denied の間の空所で、文の要素はすでにそろっている。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) emphasized … 動詞の過去形・過去分詞「強調した」 ×\n(B) emphatic … 形容詞「断固とした」 ×\n(C) emphatically … 副詞「きっぱりと、断固として」 ○\n(D) emphasis … 名詞「強調」 ×\n\n■ 完成文\nDuring yesterday’s press conference, Mr. Shimura emphatically denied that the company would acquire Seattle-based White Corporation.\n（昨日の記者会見で Shimura さんは、自社がシアトルに拠点を置く White 社を買収することをきっぱりと否定した。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉の位置は副詞が入る定番の場所。","words":[{"w":"press conference","p":"名詞","m":"記者会見"},{"w":"emphatically","p":"副詞","m":"きっぱりと"},{"w":"denied","p":"動詞（過去形）","m":"否定した"},{"w":"acquire","p":"動詞","m":"買収する"},{"w":"Seattle-based","p":"形容詞","m":"シアトルを拠点とする"}]},{"id":9,"category":"品詞問題・トレーニング","question":"A proposal to upgrade the data security software will be considered at the next ______ scheduled meeting.","A":"regulating","B":"regularly","C":"regulate","D":"regulation","answer":"B","answer_word":"regularly","explanation":"■ 文の骨格\nA proposal to upgrade the data security software will be considered at the next ______ scheduled meeting.\n\n■ 空所に入るもの\nthe next と名詞 meeting の間にあり、scheduled（予定された）を修飾する位置。\n→ 空所には「過去分詞 scheduled を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) regulating … 現在分詞・動名詞「規制している」 ×\n(B) regularly … 副詞「定期的に」 ○\n(C) regulate … 動詞（原形）「規制する」 ×\n(D) regulation … 名詞「規制、規則」 ×\n\n■ 完成文\nA proposal to upgrade the data security software will be considered at the next regularly scheduled meeting.\n（データ保護ソフトをアップグレードするという提案は、次の定例会議で検討される。）\n\n■ 解き方のポイント\n〈副詞＋過去分詞＋名詞〉の語順。分詞の直前の空所は副詞を疑う。","words":[{"w":"proposal","p":"名詞","m":"提案"},{"w":"upgrade","p":"動詞","m":"アップグレードする"},{"w":"data security","p":"名詞","m":"データ保護"},{"w":"considered","p":"動詞（過去分詞）","m":"検討される"},{"w":"regularly","p":"副詞","m":"定期的に"},{"w":"scheduled","p":"動詞（過去分詞）","m":"予定された"}]},{"id":10,"category":"品詞問題・トレーニング","question":"Job ______ will be posted on the college Web site and normally remain open for one to two weeks depending on the position.","A":"open","B":"opens","C":"opened","D":"openings","answer":"D","answer_word":"openings","explanation":"■ 文の骨格\nJob ______ will be posted on the college Web site and normally remain open for one to two weeks depending on the position.\n\n■ 空所に入るもの\n文の主語が Job ______ で、述語動詞 will be posted に対応する名詞が必要。\n→ 空所には「主語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) open … 動詞（原形）・形容詞「開ける／開いている」 ×\n(B) opens … 動詞（三人称単数現在形）「開ける」 ×\n(C) opened … 動詞の過去形・過去分詞「開けられた」 ×\n(D) openings … 名詞（複数形）「求人、欠員」 ○\n\n■ 完成文\nJob openings will be posted on the college Web site and normally remain open for one to two weeks depending on the position.\n（求人情報は大学のウェブサイトに掲載され、職種にもよるが通常1〜2週間は掲載され続ける。）\n\n■ 解き方のポイント\njob opening（求人・欠員）は TOEIC 頻出の複合名詞。","words":[{"w":"Job openings","p":"名詞","m":"求人、欠員"},{"w":"posted","p":"動詞（過去分詞）","m":"掲載される"},{"w":"normally","p":"副詞","m":"通常は"},{"w":"remain","p":"動詞","m":"〜のままである"},{"w":"depending on","p":"熟語","m":"〜次第で"},{"w":"position","p":"名詞","m":"職、ポスト"}]},{"id":11,"category":"品詞問題・トレーニング","question":"During the company banquet, David Thomas was presented with a watch in ______ of his thirty years of service.","A":"appreciate","B":"appreciated","C":"appreciating","D":"appreciation","answer":"D","answer_word":"appreciation","explanation":"■ 文の骨格\nDuring the company banquet, David Thomas was presented with a watch in ______ of his thirty years of service.\n\n■ 空所に入るもの\nin と of に挟まれた位置で、前置詞の目的語となる名詞が必要。\n→ 空所には「前置詞 in の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) appreciate … 動詞（原形）「感謝する、評価する」 ×\n(B) appreciated … 動詞の過去形・過去分詞「感謝した」 ×\n(C) appreciating … 現在分詞・動名詞「感謝すること」 ×\n(D) appreciation … 名詞「感謝、評価」 ○\n\n■ 完成文\nDuring the company banquet, David Thomas was presented with a watch in appreciation of his thirty years of service.\n（社内の祝賀会で、David Thomas は勤続30年への感謝の印として腕時計を贈られた。）\n\n■ 解き方のポイント\nin appreciation of X で「Xへの感謝の印として」。前置詞に挟まれた空所は名詞。","words":[{"w":"banquet","p":"名詞","m":"祝賀会、宴会"},{"w":"presented with","p":"熟語","m":"〜を贈られる"},{"w":"appreciation","p":"名詞","m":"感謝"},{"w":"service","p":"名詞","m":"勤務、勤続"}]},{"id":12,"category":"品詞問題・トレーニング","question":"Shipping costs will be calculated ______ at the sales counter based on the product weight, size, and destination.","A":"automatic","B":"automatically","C":"automation","D":"automated","answer":"B","answer_word":"automatically","explanation":"■ 文の骨格\nShipping costs will be calculated ______ at the sales counter based on the product weight, size, and destination.\n\n■ 空所に入るもの\n述語動詞 will be calculated がすでにあり、空所がなくても文が成立する。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) automatic … 形容詞「自動の」 ×\n(B) automatically … 副詞「自動的に」 ○\n(C) automation … 名詞「自動化」 ×\n(D) automated … 動詞の過去形・過去分詞／形容詞「自動化された」 ×\n\n■ 完成文\nShipping costs will be calculated automatically at the sales counter based on the product weight, size, and destination.\n（配送料は、商品の重さ・サイズ・配送先に基づいて、販売カウンターで自動的に計算される。）\n\n■ 解き方のポイント\n受動態〈be＋過去分詞〉の直後も副詞が入る定位置。","words":[{"w":"Shipping costs","p":"名詞","m":"配送料"},{"w":"calculated","p":"動詞（過去分詞）","m":"計算される"},{"w":"automatically","p":"副詞","m":"自動的に"},{"w":"based on","p":"熟語","m":"〜に基づいて"},{"w":"weight","p":"名詞","m":"重さ"},{"w":"destination","p":"名詞","m":"配送先、目的地"}]},{"id":13,"category":"品詞問題・トレーニング","question":"Passengers on Air Atlanta may cancel their ______ for a nominal fee, if the requests are filed one week in advance.","A":"book","B":"booked","C":"bookings","D":"bookable","answer":"C","answer_word":"bookings","explanation":"■ 文の骨格\nPassengers on Air Atlanta may cancel their ______ for a nominal fee, if the requests are filed one week in advance.\n\n■ 空所に入るもの\n所有格 their の後ろは所有物を表す名詞の位置。\n→ 空所には「他動詞 cancel の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) book … 動詞（原形）／名詞「予約する／本」 ×\n(B) booked … 動詞の過去形・過去分詞「予約した」 ×\n(C) bookings … 名詞（複数形）「予約」 ○\n(D) bookable … 形容詞「予約できる」 ×\n\n■ 完成文\nPassengers on Air Atlanta may cancel their bookings for a nominal fee, if the requests are filed one week in advance.\n（Air Atlanta の乗客は、1週間前に申請すれば、わずかな手数料で予約を取り消せる。）\n\n■ 解き方のポイント\n〈所有格＋空所〉は名詞が入る典型パターン。","words":[{"w":"Passengers","p":"名詞","m":"乗客"},{"w":"cancel","p":"動詞","m":"取り消す"},{"w":"bookings","p":"名詞","m":"予約"},{"w":"nominal fee","p":"名詞","m":"わずかな手数料"},{"w":"filed","p":"動詞（過去分詞）","m":"提出される"},{"w":"in advance","p":"熟語","m":"前もって"}]},{"id":14,"category":"品詞問題・トレーニング","question":"Ms. Kelly was able to solve the issues with the new software ______ after consulting Mr. Lee in the technical support department.","A":"easily","B":"easy","C":"eased","D":"ease","answer":"A","answer_word":"easily","explanation":"■ 文の骨格\nMs. Kelly was able to solve the issues with the new software ______ after consulting Mr. Lee in the technical support department.\n\n■ 空所に入るもの\nwas able to solve という述語動詞と目的語 the issues がそろっており、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) easily … 副詞「簡単に、容易に」 ○\n(B) easy … 形容詞「簡単な」 ×\n(C) eased … 動詞の過去形・過去分詞「和らげた」 ×\n(D) ease … 名詞／動詞「気楽さ／和らげる」 ×\n\n■ 完成文\nMs. Kelly was able to solve the issues with the new software easily after consulting Mr. Lee in the technical support department.\n（Kelly さんは技術サポート部の Lee さんに相談したあと、新しいソフトの問題を簡単に解決できた。）\n\n■ 解き方のポイント\n文の要素が完成している位置の空所は副詞。","words":[{"w":"was able to","p":"熟語","m":"〜できた"},{"w":"solve","p":"動詞","m":"解決する"},{"w":"issues","p":"名詞","m":"問題"},{"w":"easily","p":"副詞","m":"簡単に"},{"w":"consulting","p":"動名詞","m":"相談すること"},{"w":"technical support department","p":"名詞","m":"技術サポート部"}]},{"id":15,"category":"品詞問題・トレーニング","question":"Mr. Garcia’s ______ for updating the current inventory control system will be reviewed at the next board meeting.","A":"recommend","B":"recommending","C":"recommendation","D":"recommendable","answer":"C","answer_word":"recommendation","explanation":"■ 文の骨格\nMr. Garcia’s ______ for updating the current inventory control system will be reviewed at the next board meeting.\n\n■ 空所に入るもの\n所有格 Mr. Garcia’s の後ろで、述語動詞 will be reviewed の主語となる名詞が必要。\n→ 空所には「文の主語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) recommend … 動詞（原形）「推薦する、勧める」 ×\n(B) recommending … 現在分詞・動名詞「勧めること」 ×\n(C) recommendation … 名詞「提案、推薦」 ○\n(D) recommendable … 形容詞「推薦できる」 ×\n\n■ 完成文\nMr. Garcia’s recommendation for updating the current inventory control system will be reviewed at the next board meeting.\n（現行の在庫管理システムを更新するという Garcia さんの提案は、次の取締役会で検討される。）\n\n■ 解き方のポイント\n〈所有格＋空所＋前置詞〉は名詞が入る形。","words":[{"w":"recommendation","p":"名詞","m":"提案、推薦"},{"w":"updating","p":"動名詞","m":"更新すること"},{"w":"current","p":"形容詞","m":"現行の"},{"w":"inventory control system","p":"名詞","m":"在庫管理システム"},{"w":"reviewed","p":"動詞（過去分詞）","m":"検討される"},{"w":"board meeting","p":"名詞","m":"取締役会"}]},{"id":16,"category":"品詞問題・トレーニング","question":"Department managers are required to ensure all the staff members they supervise have a ______ understanding of the company mission.","A":"clear","B":"clearly","C":"clarity","D":"clears","answer":"A","answer_word":"clear","explanation":"■ 文の骨格\nDepartment managers are required to ensure all the staff members they supervise have a ______ understanding of the company mission.\n\n■ 空所に入るもの\n冠詞 a と名詞 understanding の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) clear … 形容詞「明確な」 ○\n(B) clearly … 副詞「はっきりと」 ×\n(C) clarity … 名詞「明確さ」 ×\n(D) clears … 動詞（三人称単数現在形）「片づける」 ×\n\n■ 完成文\nDepartment managers are required to ensure all the staff members they supervise have a clear understanding of the company mission.\n（部門長は、監督下のスタッフ全員が企業理念を明確に理解しているようにする責任がある。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞が入る最頻出パターン。","words":[{"w":"Department managers","p":"名詞","m":"部門長"},{"w":"required","p":"動詞（過去分詞）","m":"求められる"},{"w":"ensure","p":"動詞","m":"確実にする"},{"w":"supervise","p":"動詞","m":"監督する"},{"w":"clear","p":"形容詞","m":"明確な"},{"w":"understanding","p":"名詞","m":"理解"},{"w":"company mission","p":"名詞","m":"企業理念"}]},{"id":17,"category":"品詞問題・トレーニング","question":"Yearly utility costs for the new energy efficient headquarters will be about 50% lower than those of ______ designed buildings.","A":"conventionally","B":"convention","C":"conventions","D":"conventional","answer":"A","answer_word":"conventionally","explanation":"■ 文の骨格\nYearly utility costs for the new energy efficient headquarters will be about 50% lower than those of ______ designed buildings.\n\n■ 空所に入るもの\ndesigned buildings（設計された建物）という名詞のかたまりの前で、分詞を修飾する位置。\n→ 空所には「過去分詞 designed を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) conventionally … 副詞「従来のやり方で」 ○\n(B) convention … 名詞「慣習、大会」 ×\n(C) conventions … 名詞（複数形）「慣習」 ×\n(D) conventional … 形容詞「従来の」 ×\n\n■ 完成文\nYearly utility costs for the new energy efficient headquarters will be about 50% lower than those of conventionally designed buildings.\n（新しい省エネ本社の年間光熱費は、従来の設計の建物より約50％低くなる見込みだ。）\n\n■ 解き方のポイント\n〈空所＋過去分詞＋名詞〉なら副詞。形容詞 conventional は分詞 designed を修飾できない。","words":[{"w":"Yearly","p":"形容詞","m":"年間の"},{"w":"utility costs","p":"名詞","m":"光熱費"},{"w":"energy efficient","p":"形容詞","m":"省エネの"},{"w":"headquarters","p":"名詞","m":"本社"},{"w":"conventionally","p":"副詞","m":"従来のやり方で"},{"w":"designed","p":"動詞（過去分詞）","m":"設計された"}]},{"id":18,"category":"品詞問題・トレーニング","question":"New and transferred employees must become ______ with company policies and procedures in order to perform their jobs safely and efficiently.","A":"familiar","B":"familiarize","C":"familiarizing","D":"familiarization","answer":"A","answer_word":"familiar","explanation":"■ 文の骨格\nNew and transferred employees must become ______ with company policies and procedures in order to perform their jobs safely and efficiently.\n\n■ 空所に入るもの\nbecome は S+V+C の形を取る動詞で、空所は補語の位置。\n→ 空所には「become の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) familiar … 形容詞「精通した、慣れた」 ○\n(B) familiarize … 動詞（原形）「慣れさせる」 ×\n(C) familiarizing … 現在分詞・動名詞「慣れさせること」 ×\n(D) familiarization … 名詞「習熟」 ×\n\n■ 完成文\nNew and transferred employees must become familiar with company policies and procedures in order to perform their jobs safely and efficiently.\n（新入社員と異動してきた社員は、安全かつ効率的に業務を行うために、会社の方針と手順に精通しなければならない。）\n\n■ 解き方のポイント\nbecome / remain / stay の後ろは形容詞（補語）。be familiar with X で「Xに精通している」。","words":[{"w":"transferred","p":"形容詞","m":"異動してきた"},{"w":"become","p":"動詞","m":"〜になる"},{"w":"familiar","p":"形容詞","m":"精通した"},{"w":"policies","p":"名詞","m":"方針"},{"w":"procedures","p":"名詞","m":"手順"},{"w":"perform","p":"動詞","m":"遂行する"},{"w":"efficiently","p":"副詞","m":"効率的に"}]},{"id":19,"category":"品詞問題・トレーニング","question":"Dream Painting Ltd. is a painting contractor with a solid reputation for ______ completing projects by tight deadlines.","A":"success","B":"successful","C":"successfully","D":"succeed","answer":"C","answer_word":"successfully","explanation":"■ 文の骨格\nDream Painting Ltd. is a painting contractor with a solid reputation for ______ completing projects by tight deadlines.\n\n■ 空所に入るもの\n前置詞 for の目的語は動名詞 completing であり、空所はそれを修飾する位置。\n→ 空所には「動名詞 completing を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) success … 名詞「成功」 ×\n(B) successful … 形容詞「成功した」 ×\n(C) successfully … 副詞「うまく、首尾よく」 ○\n(D) succeed … 動詞（原形）「成功する」 ×\n\n■ 完成文\nDream Painting Ltd. is a painting contractor with a solid reputation for successfully completing projects by tight deadlines.\n（Dream Painting 社は、厳しい納期でも仕事をきちんと完了させるという確かな評判を持つ塗装業者だ。）\n\n■ 解き方のポイント\n動名詞（-ing）を修飾するのは形容詞ではなく副詞。","words":[{"w":"contractor","p":"名詞","m":"請負業者"},{"w":"solid","p":"形容詞","m":"確かな"},{"w":"reputation","p":"名詞","m":"評判"},{"w":"successfully","p":"副詞","m":"うまく"},{"w":"completing","p":"動名詞","m":"完了させること"},{"w":"tight deadlines","p":"名詞","m":"厳しい納期"}]},{"id":20,"category":"品詞問題・トレーニング","question":"Over the past few years as the domestic market has matured, manufacturers in Japan have ______ turned to overseas markets.","A":"increase","B":"increases","C":"increasing","D":"increasingly","answer":"D","answer_word":"increasingly","explanation":"■ 文の骨格\nOver the past few years as the domestic market has matured, manufacturers in Japan have ______ turned to overseas markets.\n\n■ 空所に入るもの\n現在完了形 have turned がすでに成立しており、空所は have と過去分詞の間の修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) increase … 動詞（原形）／名詞「増える／増加」 ×\n(B) increases … 動詞（三人称単数現在形）「増える」 ×\n(C) increasing … 現在分詞・動名詞「増えている」 ×\n(D) increasingly … 副詞「ますます」 ○\n\n■ 完成文\nOver the past few years as the domestic market has matured, manufacturers in Japan have increasingly turned to overseas markets.\n（国内市場が成熟したここ数年で、日本のメーカーはますます海外市場に目を向けるようになってきた。）\n\n■ 解き方のポイント\n〈have/has ＋空所＋過去分詞〉は副詞が入る定位置。","words":[{"w":"domestic market","p":"名詞","m":"国内市場"},{"w":"matured","p":"動詞（過去分詞）","m":"成熟した"},{"w":"manufacturers","p":"名詞","m":"製造業者"},{"w":"increasingly","p":"副詞","m":"ますます"},{"w":"turned to","p":"熟語","m":"〜に目を向けた"},{"w":"overseas markets","p":"名詞","m":"海外市場"}]},{"id":21,"category":"品詞問題・トレーニング","question":"The purpose of the survey is to collect information from our customers in order to make our operations more efficient and ______.","A":"rely","B":"reliable","C":"reliably","D":"reliance","answer":"B","answer_word":"reliable","explanation":"■ 文の骨格\nThe purpose of the survey is to collect information from our customers in order to make our operations more efficient and ______.\n\n■ 空所に入るもの\n等位接続詞 and の前が形容詞 efficient なので、and の後ろも同じ品詞（形容詞）でなければならない。\n→ 空所には「efficient と並列になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) rely … 動詞（原形）「頼る」 ×\n(B) reliable … 形容詞「信頼できる」 ○\n(C) reliably … 副詞「確実に」 ×\n(D) reliance … 名詞「依存、信頼」 ×\n\n■ 完成文\nThe purpose of the survey is to collect information from our customers in order to make our operations more efficient and reliable.\n（この調査の目的は、事業運営をより効率的で信頼できるものにするために、顧客から情報を収集することだ。）\n\n■ 解き方のポイント\nand / or / but の前後は同じ品詞が並ぶ（並列構造）。前を見れば答えが決まる。","words":[{"w":"purpose","p":"名詞","m":"目的"},{"w":"survey","p":"名詞","m":"調査"},{"w":"collect","p":"動詞","m":"収集する"},{"w":"operations","p":"名詞","m":"事業運営"},{"w":"efficient","p":"形容詞","m":"効率的な"},{"w":"reliable","p":"形容詞","m":"信頼できる"}]},{"id":22,"category":"品詞問題・トレーニング","question":"The most recently completed section of the water tunnel is considered to be the largest ______ project ever undertaken in Nagasaki.","A":"construct","B":"constructed","C":"constructs","D":"construction","answer":"D","answer_word":"construction","explanation":"■ 文の骨格\nThe most recently completed section of the water tunnel is considered to be the largest ______ project ever undertaken in Nagasaki.\n\n■ 空所に入るもの\nthe largest と project の間にあり、construction project（建設事業）という複合名詞をつくる位置。\n→ 空所には「project を修飾する名詞」が必要です。\n\n■ 選択肢の確認\n(A) construct … 動詞（原形）「建設する」 ×\n(B) constructed … 動詞の過去形・過去分詞「建設された」 ×\n(C) constructs … 動詞（三人称単数現在形）「建設する」 ×\n(D) construction … 名詞「建設」 ○\n\n■ 完成文\nThe most recently completed section of the water tunnel is considered to be the largest construction project ever undertaken in Nagasaki.\n（この水路トンネルの直近で完成した区間は、長崎でこれまでに行われた最大の建設事業だと考えられている。）\n\n■ 解き方のポイント\n名詞＋名詞の複合名詞は TOEIC 頻出。construction project、sales representative など。","words":[{"w":"recently","p":"副詞","m":"最近"},{"w":"completed","p":"動詞（過去分詞）","m":"完成した"},{"w":"section","p":"名詞","m":"区間、部分"},{"w":"considered","p":"動詞（過去分詞）","m":"考えられている"},{"w":"construction","p":"名詞","m":"建設"},{"w":"undertaken","p":"動詞（過去分詞）","m":"着手された"}]},{"id":23,"category":"品詞問題・トレーニング","question":"Some of the ______ for employees at Sky Manufacturing include a company car and company stock options.","A":"benefit","B":"benefits","C":"beneficial","D":"beneficially","answer":"B","answer_word":"benefits","explanation":"■ 文の骨格\nSome of the ______ for employees at Sky Manufacturing include a company car and company stock options.\n\n■ 空所に入るもの\nSome of the ______ が主語で、述語動詞が複数形に対応する include なので複数名詞が必要。\n→ 空所には「of の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) benefit … 名詞（単数形）「利益、特典」 ×\n(B) benefits … 名詞（複数形）「福利厚生、特典」 ○\n(C) beneficial … 形容詞「有益な」 ×\n(D) beneficially … 副詞「有益に」 ×\n\n■ 完成文\nSome of the benefits for employees at Sky Manufacturing include a company car and company stock options.\n（Sky Manufacturing 社の従業員向け福利厚生には、社用車と自社株購入権が含まれる。）\n\n■ 解き方のポイント\nSome of the ＿＿ の後の動詞の形（include）から、単数か複数かを判断する。","words":[{"w":"employees","p":"名詞","m":"従業員"},{"w":"benefits","p":"名詞","m":"福利厚生、特典"},{"w":"include","p":"動詞","m":"含む"},{"w":"company car","p":"名詞","m":"社用車"},{"w":"stock options","p":"名詞","m":"自社株購入権"}]},{"id":24,"category":"品詞問題・トレーニング","question":"Francesco Romano opened a new wellness ______ on the first floor of his house after quitting his job as a television repairman.","A":"facilitate","B":"facility","C":"facilitates","D":"facilitation","answer":"B","answer_word":"facility","explanation":"■ 文の骨格\nFrancesco Romano opened a new wellness ______ on the first floor of his house after quitting his job as a television repairman.\n\n■ 空所に入るもの\na new wellness ______ が opened の目的語で、wellness と結びつく単数名詞が必要。\n→ 空所には「opened の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) facilitate … 動詞（原形）「促進する」 ×\n(B) facility … 名詞「施設」 ○\n(C) facilitates … 動詞（三人称単数現在形）「促進する」 ×\n(D) facilitation … 名詞「促進、円滑化」 ×\n\n■ 完成文\nFrancesco Romano opened a new wellness facility on the first floor of his house after quitting his job as a television repairman.\n（Francesco Romano はテレビ修理工の仕事を辞めたあと、自宅の1階に新しい健康増進施設を開いた。）\n\n■ 解き方のポイント\n冠詞 a があるので単数可算名詞。facility（施設）と facilitation（促進）の意味の違いに注意。","words":[{"w":"opened","p":"動詞（過去形）","m":"開いた"},{"w":"wellness","p":"名詞","m":"健康増進"},{"w":"facility","p":"名詞","m":"施設"},{"w":"first floor","p":"名詞","m":"1階"},{"w":"quitting","p":"動名詞","m":"辞めること"},{"w":"repairman","p":"名詞","m":"修理工"}]},{"id":25,"category":"品詞問題・トレーニング","question":"According to the event manager, it is important to complete urgent ______ in order of importance.","A":"task","B":"tasked","C":"tasking","D":"tasks","answer":"D","answer_word":"tasks","explanation":"■ 文の骨格\nAccording to the event manager, it is important to complete urgent ______ in order of importance.\n\n■ 空所に入るもの\n他動詞 complete の目的語が欠けており、形容詞 urgent に修飾される名詞が必要。冠詞がないので複数形。\n→ 空所には「complete の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) task … 名詞（単数形）「仕事、任務」 ×\n(B) tasked … 動詞の過去形・過去分詞「任された」 ×\n(C) tasking … 現在分詞・動名詞「任せること」 ×\n(D) tasks … 名詞（複数形）「仕事、任務」 ○\n\n■ 完成文\nAccording to the event manager, it is important to complete urgent tasks in order of importance.\n（イベント責任者によれば、緊急の業務を重要度の順に片づけることが大切だ。）\n\n■ 解き方のポイント\n可算名詞で冠詞（a/the）がなければ複数形を選ぶ。","words":[{"w":"urgent","p":"形容詞","m":"緊急の"},{"w":"tasks","p":"名詞","m":"仕事、業務"},{"w":"complete","p":"動詞","m":"完了する"},{"w":"in order of","p":"熟語","m":"〜の順に"},{"w":"importance","p":"名詞","m":"重要度"}]},{"id":26,"category":"品詞問題・トレーニング","question":"Harold’s Ice Cream recently launched a newly ______ Web site that showcases its innovative ice-cream desserts.","A":"design","B":"designs","C":"designed","D":"designing","answer":"C","answer_word":"designed","explanation":"■ 文の骨格\nHarold’s Ice Cream recently launched a newly ______ Web site that showcases its innovative ice-cream desserts.\n\n■ 空所に入るもの\n副詞 newly の後ろ、名詞 Web site の前で、「新しくデザインされた」と受け身の意味で名詞を修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) design … 動詞（原形）／名詞「設計する／デザイン」 ×\n(B) designs … 動詞（三人称単数現在形）「設計する」 ×\n(C) designed … 過去分詞「設計された」 ○\n(D) designing … 現在分詞・動名詞「設計している」 ×\n\n■ 完成文\nHarold’s Ice Cream recently launched a newly designed Web site that showcases its innovative ice-cream desserts.\n（Harold’s Ice Cream 社は最近、斬新なアイスクリームデザートを紹介する、新しく設計されたウェブサイトを立ち上げた。）\n\n■ 解き方のポイント\n〈副詞＋空所＋名詞〉で名詞との関係が受け身なら過去分詞。","words":[{"w":"launched","p":"動詞（過去形）","m":"立ち上げた"},{"w":"newly","p":"副詞","m":"新しく"},{"w":"designed","p":"過去分詞","m":"設計された"},{"w":"showcases","p":"動詞","m":"紹介する"},{"w":"innovative","p":"形容詞","m":"斬新な"}]},{"id":27,"category":"品詞問題・トレーニング","question":"The demand for electric automobiles has increased by ______ 50 percent over the past 10 years in Australia.","A":"nears","B":"nearly","C":"nearing","D":"nearness","answer":"B","answer_word":"nearly","explanation":"■ 文の骨格\nThe demand for electric automobiles has increased by ______ 50 percent over the past 10 years in Australia.\n\n■ 空所に入るもの\n前置詞 by の目的語は 50 percent で、空所はその数詞を修飾する位置。\n→ 空所には「数詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) nears … 動詞（三人称単数現在形）「近づく」 ×\n(B) nearly … 副詞「ほぼ、〜近く」 ○\n(C) nearing … 現在分詞・動名詞「近づいている」 ×\n(D) nearness … 名詞「近さ」 ×\n\n■ 完成文\nThe demand for electric automobiles has increased by nearly 50 percent over the past 10 years in Australia.\n（オーストラリアでは、電気自動車の需要が過去10年で50パーセント近く増加した。）\n\n■ 解き方のポイント\n数詞は形容詞の一種なので、それを修飾するのは副詞。nearly 50 percent＝「50％近く」。","words":[{"w":"demand","p":"名詞","m":"需要"},{"w":"electric automobiles","p":"名詞","m":"電気自動車"},{"w":"increased","p":"動詞（過去分詞）","m":"増加した"},{"w":"nearly","p":"副詞","m":"ほぼ、〜近く"}]},{"id":28,"category":"品詞問題・トレーニング","question":"Half of the board members of Bell Corporation are appointed on a ______ two-year basis.","A":"rotate","B":"rotates","C":"rotating","D":"rotation","answer":"C","answer_word":"rotating","explanation":"■ 文の骨格\nHalf of the board members of Bell Corporation are appointed on a ______ two-year basis.\n\n■ 空所に入るもの\n冠詞 a と two-year basis の間で、「交代する」という能動の意味で修飾する語が必要。\n→ 空所には「名詞句を修飾する現在分詞（形容詞的用法）」が必要です。\n\n■ 選択肢の確認\n(A) rotate … 動詞（原形）「回転する、交代する」 ×\n(B) rotates … 動詞（三人称単数現在形）「交代する」 ×\n(C) rotating … 現在分詞「交代制の」 ○\n(D) rotation … 名詞「回転、交代」 ×\n\n■ 完成文\nHalf of the board members of Bell Corporation are appointed on a rotating two-year basis.\n（Bell 社の取締役の半数は、2年ごとの交代制で任命される。）\n\n■ 解き方のポイント\non a ... basis で「〜の方式で」。空所は basis を修飾する形容詞相当語。","words":[{"w":"board members","p":"名詞","m":"取締役"},{"w":"appointed","p":"動詞（過去分詞）","m":"任命される"},{"w":"rotating","p":"現在分詞","m":"交代制の"},{"w":"basis","p":"名詞","m":"方式、基準"}]},{"id":29,"category":"品詞問題・トレーニング","question":"Restoration work on the Marysville Museum is ______ much slower than residents had hoped.","A":"regret","B":"regretful","C":"regrettable","D":"regrettably","answer":"D","answer_word":"regrettably","explanation":"■ 文の骨格\nRestoration work on the Marysville Museum is ______ much slower than residents had hoped.\n\n■ 空所に入るもの\nis の補語として slower がすでにあり、空所は修飾語の位置。\n→ 空所には「形容詞（比較級）を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) regret … 名詞／動詞「後悔／後悔する」 ×\n(B) regretful … 形容詞「残念に思っている（人が主語）」 ×\n(C) regrettable … 形容詞「遺憾な、残念な」 ×\n(D) regrettably … 副詞「残念ながら」 ○\n\n■ 完成文\nRestoration work on the Marysville Museum is regrettably much slower than residents had hoped.\n（Marysville 博物館の修復工事は、残念ながら住民が期待していたよりはるかに遅れている。）\n\n■ 解き方のポイント\n〈be動詞＋空所＋形容詞〉は副詞。regretful（人が後悔している）と regrettable（事柄が残念な）の違いも重要。","words":[{"w":"Restoration work","p":"名詞","m":"修復工事"},{"w":"regrettably","p":"副詞","m":"残念ながら"},{"w":"much slower","p":"比較級","m":"はるかに遅い"},{"w":"residents","p":"名詞","m":"住民"}]},{"id":30,"category":"品詞問題・トレーニング","question":"On many ______, Ms. Humphrey sketched and painted until after midnight, when the only sound was the cooing of pigeons on the roof.","A":"occasionally","B":"occasions","C":"occasional","D":"occasion","answer":"B","answer_word":"occasions","explanation":"■ 文の骨格\nOn many ______, Ms. Humphrey sketched and painted until after midnight, when the only sound was the cooing of pigeons on the roof.\n\n■ 空所に入るもの\n数量を表す many の後ろなので、複数形の名詞が必要。\n→ 空所には「前置詞 On の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) occasionally … 副詞「時々」 ×\n(B) occasions … 名詞（複数形）「時、機会」 ○\n(C) occasional … 形容詞「時々の」 ×\n(D) occasion … 名詞（単数形）「時、機会」 ×\n\n■ 完成文\nOn many occasions, Ms. Humphrey sketched and painted until after midnight, when the only sound was the cooing of pigeons on the roof.\n（Humphrey さんはたびたび、屋根のハトの鳴き声しか聞こえない真夜中過ぎまでスケッチや絵を描いていた。）\n\n■ 解き方のポイント\non many occasions＝「何度も、たびたび」。many の直後は必ず複数名詞。","words":[{"w":"occasions","p":"名詞","m":"時、機会"},{"w":"sketched","p":"動詞（過去形）","m":"スケッチした"},{"w":"midnight","p":"名詞","m":"真夜中"},{"w":"cooing","p":"名詞","m":"（ハトの）鳴き声"},{"w":"pigeons","p":"名詞","m":"ハト"}]},{"id":31,"category":"品詞問題・トレーニング","question":"Word-of-mouth ______ is considered highly effective, but remains a rarely studied phenomenon.","A":"advertise","B":"advertised","C":"advertising","D":"advertisements","answer":"C","answer_word":"advertising","explanation":"■ 文の骨格\nWord-of-mouth ______ is considered highly effective, but remains a rarely studied phenomenon.\n\n■ 空所に入るもの\n述語動詞 is considered に対する主語が必要で、Word-of-mouth と結びつく名詞が入る。\n→ 空所には「文の主語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) advertise … 動詞（原形）「宣伝する」 ×\n(B) advertised … 動詞の過去形・過去分詞「宣伝された」 ×\n(C) advertising … 名詞（不可算）「広告、宣伝（活動）」 ○\n(D) advertisements … 名詞（複数形）「広告（個々の作品）」 ×\n\n■ 完成文\nWord-of-mouth advertising is considered highly effective, but remains a rarely studied phenomenon.\n（クチコミによる宣伝は非常に効果的だと考えられているが、依然としてほとんど研究されていない現象である。）\n\n■ 解き方のポイント\nadvertising は「宣伝活動」（不可算）、advertisement は「広告1点」（可算）。動詞 is から単数扱いと分かる。","words":[{"w":"Word-of-mouth","p":"形容詞","m":"クチコミの"},{"w":"advertising","p":"名詞","m":"宣伝、広告活動"},{"w":"highly effective","p":"形容詞句","m":"非常に効果的な"},{"w":"rarely","p":"副詞","m":"めったに〜ない"},{"w":"phenomenon","p":"名詞","m":"現象"}]},{"id":32,"category":"品詞問題・トレーニング","question":"It is the job of flight attendants to make passengers feel as ______ as possible during the flight.","A":"comfortable","B":"comfortably","C":"comfort","D":"comforting","answer":"A","answer_word":"comfortable","explanation":"■ 文の骨格\nIt is the job of flight attendants to make passengers feel as ______ as possible during the flight.\n\n■ 空所に入るもの\nfeel は S+V+C の形をとる動詞で、as ... as possible の as を外すと feel ______ の形になる。\n→ 空所には「feel の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) comfortable … 形容詞「快適な、心地よい」 ○\n(B) comfortably … 副詞「快適に」 ×\n(C) comfort … 名詞／動詞「快適さ／慰める」 ×\n(D) comforting … 現在分詞・形容詞「慰めになる」 ×\n\n■ 完成文\nIt is the job of flight attendants to make passengers feel as comfortable as possible during the flight.\n（飛行中、乗客にできる限り快適に過ごしてもらうのが客室乗務員の仕事だ。）\n\n■ 解き方のポイント\nas ... as possible の間の品詞は、as を外して考えると見抜ける。","words":[{"w":"flight attendants","p":"名詞","m":"客室乗務員"},{"w":"passengers","p":"名詞","m":"乗客"},{"w":"feel","p":"動詞","m":"感じる"},{"w":"comfortable","p":"形容詞","m":"快適な"},{"w":"as ... as possible","p":"熟語","m":"できる限り〜"}]},{"id":33,"category":"品詞問題・実戦問題 基本編","question":"Mr. Tomiyasu returned the ______ merchandise to the manufacturer at his own expense.","A":"defect","B":"defective","C":"defectively","D":"defection","answer":"B","answer_word":"defective","explanation":"■ 文の骨格\nMr. Tomiyasu returned the ______ merchandise to the manufacturer at his own expense.\n\n■ 空所に入るもの\nthe と名詞 merchandise の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) defect … 名詞／動詞「欠陥／離反する」 ×\n(B) defective … 形容詞「欠陥のある」 ○\n(C) defectively … 副詞「不完全に」 ×\n(D) defection … 名詞「離反、亡命」 ×\n\n■ 完成文\nMr. Tomiyasu returned the defective merchandise to the manufacturer at his own expense.\n（Tomiyasu さんは、欠陥商品を自費でメーカーに返品した。）\n\n■ 解き方のポイント\n〈the＋空所＋名詞〉は形容詞。-ive で終わる語は形容詞と判断できる。","words":[{"w":"returned","p":"動詞（過去形）","m":"返品した"},{"w":"defective","p":"形容詞","m":"欠陥のある"},{"w":"merchandise","p":"名詞","m":"商品"},{"w":"manufacturer","p":"名詞","m":"メーカー、製造業者"},{"w":"at his own expense","p":"熟語","m":"自費で"}]},{"id":34,"category":"品詞問題・実戦問題 基本編","question":"Mr. Santos, who joined Wood Eco Institute just three months ago, has already proved himself to be a ______ employee.","A":"value","B":"valuable","C":"valuing","D":"valuation","answer":"B","answer_word":"valuable","explanation":"■ 文の骨格\nMr. Santos, who joined Wood Eco Institute just three months ago, has already proved himself to be a ______ employee.\n\n■ 空所に入るもの\n冠詞 a と名詞 employee の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) value … 名詞／動詞「価値／評価する」 ×\n(B) valuable … 形容詞「貴重な、有能な」 ○\n(C) valuing … 現在分詞・動名詞「評価している」 ×\n(D) valuation … 名詞「評価額、査定」 ×\n\n■ 完成文\nMr. Santos, who joined Wood Eco Institute just three months ago, has already proved himself to be a valuable employee.\n（わずか3カ月前に Wood Eco 研究所に加わった Santos さんは、すでに自らが有能な社員であることを証明している。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞が入る最頻出パターン。","words":[{"w":"joined","p":"動詞（過去形）","m":"加わった"},{"w":"proved","p":"動詞（過去分詞）","m":"証明した"},{"w":"valuable","p":"形容詞","m":"貴重な、有能な"},{"w":"employee","p":"名詞","m":"社員"}]},{"id":35,"category":"品詞問題・実戦問題 基本編","question":"A customer placing an order through our Web site should receive a ______ within 24 hours.","A":"response","B":"respond","C":"responded","D":"responding","answer":"A","answer_word":"response","explanation":"■ 文の骨格\nA customer placing an order through our Web site should receive a ______ within 24 hours.\n\n■ 空所に入るもの\n冠詞 a の後ろで、他動詞 receive の目的語となる単数名詞が必要。\n→ 空所には「receive の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) response … 名詞「返答、連絡」 ○\n(B) respond … 動詞（原形）「返答する」 ×\n(C) responded … 動詞の過去形・過去分詞「返答した」 ×\n(D) responding … 現在分詞・動名詞「返答している」 ×\n\n■ 完成文\nA customer placing an order through our Web site should receive a response within 24 hours.\n（弊社ウェブサイトから注文されたお客様は、24時間以内に返信を受け取ります。）\n\n■ 解き方のポイント\n冠詞 a の直後は名詞。respond（動詞）と response（名詞）の対応を覚える。","words":[{"w":"customer","p":"名詞","m":"顧客"},{"w":"placing an order","p":"熟語","m":"注文すること"},{"w":"receive","p":"動詞","m":"受け取る"},{"w":"response","p":"名詞","m":"返答"},{"w":"within","p":"前置詞","m":"〜以内に"}]},{"id":36,"category":"品詞問題・実戦問題 基本編","question":"After 30 years of ______ to Johnson City, Donna Stover stepped down as mayor and council secretary.","A":"serve","B":"served","C":"serves","D":"service","answer":"D","answer_word":"service","explanation":"■ 文の骨格\nAfter 30 years of ______ to Johnson City, Donna Stover stepped down as mayor and council secretary.\n\n■ 空所に入るもの\nof の後ろは名詞が入る位置。\n→ 空所には「前置詞 of の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) serve … 動詞（原形）「仕える、勤める」 ×\n(B) served … 動詞の過去形・過去分詞「勤めた」 ×\n(C) serves … 動詞（三人称単数現在形）「勤める」 ×\n(D) service … 名詞「勤務、奉仕」 ○\n\n■ 完成文\nAfter 30 years of service to Johnson City, Donna Stover stepped down as mayor and council secretary.\n（Johnson 市に30年間勤めたのち、Donna Stover は市長と市議会書記を退任した。）\n\n■ 解き方のポイント\n前置詞の直後は名詞。years of service（勤続年数）は定型表現。","words":[{"w":"service","p":"名詞","m":"勤務、奉仕"},{"w":"stepped down","p":"熟語","m":"退任した"},{"w":"mayor","p":"名詞","m":"市長"},{"w":"council secretary","p":"名詞","m":"市議会書記"}]},{"id":37,"category":"品詞問題・実戦問題 基本編","question":"Mr. Sanders won this quarter’s Best Employee award for his ______ service to clients and early achievement of his yearly sales target.","A":"except","B":"exceptional","C":"exceptionally","D":"exceptions","answer":"B","answer_word":"exceptional","explanation":"■ 文の骨格\nMr. Sanders won this quarter’s Best Employee award for his ______ service to clients and early achievement of his yearly sales target.\n\n■ 空所に入るもの\n所有格 his と名詞 service の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) except … 前置詞・動詞「〜を除いて」 ×\n(B) exceptional … 形容詞「並外れた、格別の」 ○\n(C) exceptionally … 副詞「並外れて」 ×\n(D) exceptions … 名詞（複数形）「例外」 ×\n\n■ 完成文\nMr. Sanders won this quarter’s Best Employee award for his exceptional service to clients and early achievement of his yearly sales target.\n（Sanders さんは、顧客への並外れた対応と年間売上目標の早期達成により、今四半期の最優秀社員賞を受賞した。）\n\n■ 解き方のポイント\n〈所有格＋空所＋名詞〉は形容詞。所有格は冠詞と同じ働きをする。","words":[{"w":"quarter","p":"名詞","m":"四半期"},{"w":"award","p":"名詞","m":"賞"},{"w":"exceptional","p":"形容詞","m":"並外れた"},{"w":"achievement","p":"名詞","m":"達成"},{"w":"sales target","p":"名詞","m":"売上目標"}]},{"id":38,"category":"品詞問題・実戦問題 基本編","question":"The appearance of the CEO at the Beijing Motor Show was a ______ that his company is eager to expand into China.","A":"reminder","B":"remind","C":"reminded","D":"reminding","answer":"A","answer_word":"reminder","explanation":"■ 文の骨格\nThe appearance of the CEO at the Beijing Motor Show was a ______ that his company is eager to expand into China.\n\n■ 空所に入るもの\n冠詞 a の後ろで、that 節を後ろに従える名詞が必要。\n→ 空所には「be動詞の補語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) reminder … 名詞「思い出させるもの、示すもの」 ○\n(B) remind … 動詞（原形）「思い出させる」 ×\n(C) reminded … 動詞の過去形・過去分詞「思い出させた」 ×\n(D) reminding … 現在分詞・動名詞「思い出させること」 ×\n\n■ 完成文\nThe appearance of the CEO at the Beijing Motor Show was a reminder that his company is eager to expand into China.\n（北京モーターショーへの CEO の登場は、同社が中国進出を切望していることを改めて示すものだった。）\n\n■ 解き方のポイント\na ______ that ... の形は「〜という…」を表す名詞。-er で終わる語は名詞。","words":[{"w":"appearance","p":"名詞","m":"登場、出席"},{"w":"reminder","p":"名詞","m":"思い出させるもの"},{"w":"eager to","p":"熟語","m":"〜したがっている"},{"w":"expand into","p":"熟語","m":"〜へ進出する"}]},{"id":39,"category":"品詞問題・実戦問題 基本編","question":"Public health inspectors monitor pools ______ to ensure that they meet specific guidelines and local laws.","A":"regular","B":"regulate","C":"regularly","D":"regularity","answer":"C","answer_word":"regularly","explanation":"■ 文の骨格\nPublic health inspectors monitor pools ______ to ensure that they meet specific guidelines and local laws.\n\n■ 空所に入るもの\n主語・動詞 monitor・目的語 pools がそろっており、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) regular … 形容詞「定期的な」 ×\n(B) regulate … 動詞（原形）「規制する」 ×\n(C) regularly … 副詞「定期的に」 ○\n(D) regularity … 名詞「規則正しさ」 ×\n\n■ 完成文\nPublic health inspectors monitor pools regularly to ensure that they meet specific guidelines and local laws.\n（公衆衛生検査官は、特定の基準と地域の法律を確実に満たすよう、プールを定期的に監視している。）\n\n■ 解き方のポイント\nSVO が完成した後ろの空所は副詞。","words":[{"w":"inspectors","p":"名詞","m":"検査官"},{"w":"monitor","p":"動詞","m":"監視する"},{"w":"regularly","p":"副詞","m":"定期的に"},{"w":"ensure","p":"動詞","m":"確実にする"},{"w":"guidelines","p":"名詞","m":"基準、指針"}]},{"id":40,"category":"品詞問題・実戦問題 基本編","question":"The final chapter is the most ______ part of Amazing Ads, in which the author provides reviews, remarks, and analyses of a number of advertising strategies.","A":"essence","B":"essential","C":"essentially","D":"essentiality","answer":"B","answer_word":"essential","explanation":"■ 文の骨格\nThe final chapter is the most ______ part of Amazing Ads, in which the author provides reviews, remarks, and analyses of a number of advertising strategies.\n\n■ 空所に入るもの\nthe most と名詞 part の間にあり、最上級をつくる形容詞が必要。\n→ 空所には「名詞を修飾する形容詞（最上級）」が必要です。\n\n■ 選択肢の確認\n(A) essence … 名詞「本質」 ×\n(B) essential … 形容詞「不可欠な、核心の」 ○\n(C) essentially … 副詞「本質的に」 ×\n(D) essentiality … 名詞「不可欠であること」 ×\n\n■ 完成文\nThe final chapter is the most essential part of Amazing Ads, in which the author provides reviews, remarks, and analyses of a number of advertising strategies.\n（最終章は『Amazing Ads』の最も核心となる部分で、そこで著者は多くの広告戦略の評価、意見、分析を述べている。）\n\n■ 解き方のポイント\nthe most ＿＿ ＋名詞 → 最上級をつくる形容詞。","words":[{"w":"final chapter","p":"名詞","m":"最終章"},{"w":"essential","p":"形容詞","m":"不可欠な"},{"w":"remarks","p":"名詞","m":"意見、所見"},{"w":"analyses","p":"名詞","m":"分析"},{"w":"strategies","p":"名詞","m":"戦略"}]},{"id":41,"category":"品詞問題・実戦問題 基本編","question":"A change in the price of ______ is expected by the end of the year.","A":"electrify","B":"electrical","C":"electrically","D":"electricity","answer":"D","answer_word":"electricity","explanation":"■ 文の骨格\nA change in the price of ______ is expected by the end of the year.\n\n■ 空所に入るもの\nof の後ろで、price of ... という形をつくる名詞が必要。\n→ 空所には「前置詞 of の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) electrify … 動詞（原形）「電化する」 ×\n(B) electrical … 形容詞「電気の」 ×\n(C) electrically … 副詞「電気的に」 ×\n(D) electricity … 名詞「電気、電力」 ○\n\n■ 完成文\nA change in the price of electricity is expected by the end of the year.\n（電気料金の改定が年末までに見込まれている。）\n\n■ 解き方のポイント\n前置詞の直後は名詞。-ity で終わる語は名詞。","words":[{"w":"change","p":"名詞","m":"変更、改定"},{"w":"price","p":"名詞","m":"価格"},{"w":"electricity","p":"名詞","m":"電気"},{"w":"expected","p":"動詞（過去分詞）","m":"見込まれる"}]},{"id":42,"category":"品詞問題・実戦問題 基本編","question":"Employees are reminded to record their vacation days ______ on their time sheets.","A":"careful","B":"more careful","C":"carefully","D":"carefulness","answer":"C","answer_word":"carefully","explanation":"■ 文の骨格\nEmployees are reminded to record their vacation days ______ on their time sheets.\n\n■ 空所に入るもの\nrecord their vacation days で動詞と目的語がそろっており、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) careful … 形容詞「注意深い」 ×\n(B) more careful … 形容詞（比較級）「より注意深い」 ×\n(C) carefully … 副詞「注意深く」 ○\n(D) carefulness … 名詞「注意深さ」 ×\n\n■ 完成文\nEmployees are reminded to record their vacation days carefully on their time sheets.\n（従業員は、休暇日をタイムシートに正確に記録するよう再度お願いします。）\n\n■ 解き方のポイント\nSVO の後ろの空所は副詞。比較級の形容詞も形容詞なので入らない。","words":[{"w":"reminded","p":"動詞（過去分詞）","m":"念を押される"},{"w":"record","p":"動詞","m":"記録する"},{"w":"vacation days","p":"名詞","m":"休暇日"},{"w":"carefully","p":"副詞","m":"注意深く"},{"w":"time sheets","p":"名詞","m":"勤務時間記録表"}]},{"id":43,"category":"品詞問題・実戦問題 基本編","question":"Sun Watch Corporation offers ______ replacement batteries for all of its products.","A":"free","B":"freely","C":"freeing","D":"freedom","answer":"A","answer_word":"free","explanation":"■ 文の骨格\nSun Watch Corporation offers ______ replacement batteries for all of its products.\n\n■ 空所に入るもの\n他動詞 offers の目的語 replacement batteries を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) free … 形容詞「無料の」 ○\n(B) freely … 副詞「自由に」 ×\n(C) freeing … 現在分詞・動名詞「解放している」 ×\n(D) freedom … 名詞「自由」 ×\n\n■ 完成文\nSun Watch Corporation offers free replacement batteries for all of its products.\n（Sun Watch 社は、全製品に対して無料の交換用電池を提供している。）\n\n■ 解き方のポイント\n名詞のかたまりの前の空所は形容詞。free は形容詞「無料の」でも使う。","words":[{"w":"offers","p":"動詞","m":"提供する"},{"w":"free","p":"形容詞","m":"無料の"},{"w":"replacement batteries","p":"名詞","m":"交換用電池"},{"w":"products","p":"名詞","m":"製品"}]},{"id":44,"category":"品詞問題・実戦問題 基本編","question":"Mr. Yashima spoke ______ with the vice president about his decision to step down as CEO.","A":"exclusively","B":"exclusive","C":"exclusivity","D":"exclusiveness","answer":"A","answer_word":"exclusively","explanation":"■ 文の骨格\nMr. Yashima spoke ______ with the vice president about his decision to step down as CEO.\n\n■ 空所に入るもの\n自動詞 spoke の直後で、動詞を修飾する位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) exclusively … 副詞「〜だけに、独占的に」 ○\n(B) exclusive … 形容詞「独占的な」 ×\n(C) exclusivity … 名詞「排他性、独占性」 ×\n(D) exclusiveness … 名詞「排他性」 ×\n\n■ 完成文\nMr. Yashima spoke exclusively with the vice president about his decision to step down as CEO.\n（Yashima さんは、CEO を退任するという自身の決断について、副社長にだけ話した。）\n\n■ 解き方のポイント\n自動詞の直後の空所は副詞。","words":[{"w":"spoke","p":"動詞（過去形）","m":"話した"},{"w":"exclusively","p":"副詞","m":"〜だけに"},{"w":"vice president","p":"名詞","m":"副社長"},{"w":"step down","p":"熟語","m":"退任する"}]},{"id":45,"category":"品詞問題・実戦問題 基本編","question":"Summaries of the ______ among the hiring committee will be distributed to board members by the end of the week.","A":"discuss","B":"discussed","C":"discusses","D":"discussions","answer":"D","answer_word":"discussions","explanation":"■ 文の骨格\nSummaries of the ______ among the hiring committee will be distributed to board members by the end of the week.\n\n■ 空所に入るもの\nthe と among に挟まれた位置で、名詞が必要。the があるが可算名詞で文意上は複数。\n→ 空所には「前置詞 of の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) discuss … 動詞（原形）「議論する」 ×\n(B) discussed … 動詞の過去形・過去分詞「議論された」 ×\n(C) discusses … 動詞（三人称単数現在形）「議論する」 ×\n(D) discussions … 名詞（複数形）「議論、話し合い」 ○\n\n■ 完成文\nSummaries of the discussions among the hiring committee will be distributed to board members by the end of the week.\n（採用委員会での議論の概要は、今週末までに取締役へ配付される。）\n\n■ 解き方のポイント\n〈the＋空所＋前置詞〉は名詞。discuss は他動詞で前置詞を伴わない点も頻出。","words":[{"w":"Summaries","p":"名詞","m":"概要"},{"w":"discussions","p":"名詞","m":"議論"},{"w":"hiring committee","p":"名詞","m":"採用委員会"},{"w":"distributed","p":"動詞（過去分詞）","m":"配付される"}]},{"id":46,"category":"品詞問題・実戦問題 基本編","question":"The best way to help people reduce their ______ on non-renewable energy sources is to educate consumers about the potential of solar energy.","A":"dependent","B":"dependently","C":"dependable","D":"dependence","answer":"D","answer_word":"dependence","explanation":"■ 文の骨格\nThe best way to help people reduce their ______ on non-renewable energy sources is to educate consumers about the potential of solar energy.\n\n■ 空所に入るもの\n所有格 their の後ろで、他動詞 reduce の目的語となる名詞が必要。\n→ 空所には「reduce の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) dependent … 形容詞「依存している」 ×\n(B) dependently … 副詞「依存して」 ×\n(C) dependable … 形容詞「信頼できる」 ×\n(D) dependence … 名詞「依存」 ○\n\n■ 完成文\nThe best way to help people reduce their dependence on non-renewable energy sources is to educate consumers about the potential of solar energy.\n（再生不可能なエネルギー源への依存を人々が減らす最善の方法は、太陽エネルギーの可能性について消費者を啓発することだ。）\n\n■ 解き方のポイント\ndependence on X（Xへの依存）。〈所有格＋空所〉は名詞。","words":[{"w":"reduce","p":"動詞","m":"減らす"},{"w":"dependence","p":"名詞","m":"依存"},{"w":"non-renewable","p":"形容詞","m":"再生不可能な"},{"w":"educate","p":"動詞","m":"啓発する"},{"w":"potential","p":"名詞","m":"可能性"}]},{"id":47,"category":"品詞問題・実戦問題 基本編","question":"It is important that the materials used for the building be ______ for the climate of the area.","A":"suit","B":"suitable","C":"suitably","D":"suitability","answer":"B","answer_word":"suitable","explanation":"■ 文の骨格\nIt is important that the materials used for the building be ______ for the climate of the area.\n\n■ 空所に入るもの\nthat 節の主語 the materials とイコール関係になる補語が必要。\n→ 空所には「be の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) suit … 動詞／名詞「適する／スーツ」 ×\n(B) suitable … 形容詞「適した」 ○\n(C) suitably … 副詞「適切に」 ×\n(D) suitability … 名詞「適合性」 ×\n\n■ 完成文\nIt is important that the materials used for the building be suitable for the climate of the area.\n（建物に使われる素材は、その地域の気候に適したものであることが重要だ。）\n\n■ 解き方のポイント\nimportant / necessary などに続く that 節では動詞が原形（be）になる。空所はその補語。","words":[{"w":"materials","p":"名詞","m":"素材"},{"w":"suitable","p":"形容詞","m":"適した"},{"w":"climate","p":"名詞","m":"気候"},{"w":"area","p":"名詞","m":"地域"}]},{"id":48,"category":"品詞問題・実戦問題 基本編","question":"There are blankets and pillows in the overhead compartments for the passengers’ ______ during the flight.","A":"comfortable","B":"comforted","C":"comfortably","D":"comfort","answer":"D","answer_word":"comfort","explanation":"■ 文の骨格\nThere are blankets and pillows in the overhead compartments for the passengers’ ______ during the flight.\n\n■ 空所に入るもの\nthe passengers’ という所有格の直後で、for の目的語となる名詞が必要。\n→ 空所には「所有格の後ろに置く名詞」が必要です。\n\n■ 選択肢の確認\n(A) comfortable … 形容詞「快適な」 ×\n(B) comforted … 動詞の過去形・過去分詞「慰められた」 ×\n(C) comfortably … 副詞「快適に」 ×\n(D) comfort … 名詞「快適さ」 ○\n\n■ 完成文\nThere are blankets and pillows in the overhead compartments for the passengers’ comfort during the flight.\n（飛行中の乗客の快適さのために、頭上の荷物入れに毛布と枕をご用意しています。）\n\n■ 解き方のポイント\n〈所有格＋空所〉は名詞。for one’s comfort は定型表現。","words":[{"w":"blankets","p":"名詞","m":"毛布"},{"w":"pillows","p":"名詞","m":"枕"},{"w":"overhead compartments","p":"名詞","m":"頭上の荷物入れ"},{"w":"comfort","p":"名詞","m":"快適さ"}]},{"id":49,"category":"品詞問題・実戦問題 基本編","question":"Please view the written ______ of the product online before contacting a company representative with a question.","A":"describe","B":"describes","C":"described","D":"description","answer":"D","answer_word":"description","explanation":"■ 文の骨格\nPlease view the written ______ of the product online before contacting a company representative with a question.\n\n■ 空所に入るもの\nthe written（書かれた〜）の後ろに目的語がなく、名詞が必要。\n→ 空所には「view の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) describe … 動詞（原形）「描写する、説明する」 ×\n(B) describes … 動詞（三人称単数現在形）「説明する」 ×\n(C) described … 動詞の過去形・過去分詞「説明された」 ×\n(D) description … 名詞「説明、記述」 ○\n\n■ 完成文\nPlease view the written description of the product online before contacting a company representative with a question.\n（ご質問で当社担当者にご連絡いただく前に、オンラインで製品の説明書きをご覧ください。）\n\n■ 解き方のポイント\n〈the＋過去分詞＋空所〉は名詞。-tion は名詞の目印。","words":[{"w":"view","p":"動詞","m":"見る、閲覧する"},{"w":"written","p":"形容詞","m":"書面の"},{"w":"description","p":"名詞","m":"説明、記述"},{"w":"representative","p":"名詞","m":"担当者"}]},{"id":50,"category":"品詞問題・実戦問題 基本編","question":"Lucky Corporation often receives interest from the most promising applicants because of the ______ package it offers to its staff.","A":"attract","B":"attractive","C":"attractively","D":"attraction","answer":"B","answer_word":"attractive","explanation":"■ 文の骨格\nLucky Corporation often receives interest from the most promising applicants because of the ______ package it offers to its staff.\n\n■ 空所に入るもの\nthe と名詞 package の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) attract … 動詞（原形）「引き付ける」 ×\n(B) attractive … 形容詞「魅力的な」 ○\n(C) attractively … 副詞「魅力的に」 ×\n(D) attraction … 名詞「魅力、呼び物」 ×\n\n■ 完成文\nLucky Corporation often receives interest from the most promising applicants because of the attractive package it offers to its staff.\n（Lucky 社は、社員に提供する魅力的な待遇のおかげで、有望な応募者の関心をしばしば集めている。）\n\n■ 解き方のポイント\n〈the＋空所＋名詞〉は形容詞。","words":[{"w":"interest","p":"名詞","m":"関心"},{"w":"promising","p":"形容詞","m":"有望な"},{"w":"applicants","p":"名詞","m":"応募者"},{"w":"attractive","p":"形容詞","m":"魅力的な"},{"w":"package","p":"名詞","m":"待遇一式"}]},{"id":51,"category":"品詞問題・実戦問題 基本編","question":"The Westchester Philharmonic received a ______ award for its education program three years ago.","A":"nation","B":"national","C":"nationality","D":"nationally","answer":"B","answer_word":"national","explanation":"■ 文の骨格\nThe Westchester Philharmonic received a ______ award for its education program three years ago.\n\n■ 空所に入るもの\n冠詞 a と名詞 award の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) nation … 名詞「国、国家」 ×\n(B) national … 形容詞「全国的な、国家の」 ○\n(C) nationality … 名詞「国籍」 ×\n(D) nationally … 副詞「全国的に」 ×\n\n■ 完成文\nThe Westchester Philharmonic received a national award for its education program three years ago.\n（Westchester フィルハーモニーは3年前、その教育プログラムで全国的な賞を受賞した。）\n\n■ 解き方のポイント\n〈冠詞＋空所＋名詞〉は形容詞。","words":[{"w":"Philharmonic","p":"名詞","m":"フィルハーモニー管弦楽団"},{"w":"received","p":"動詞（過去形）","m":"受賞した"},{"w":"national","p":"形容詞","m":"全国的な"},{"w":"award","p":"名詞","m":"賞"}]},{"id":52,"category":"品詞問題・実戦問題 基本編","question":"City employees ______ endorsed the new benefits plan proposed by the city’s Department of Health.","A":"enthusiastically","B":"enthusiastic","C":"enthusiasm","D":"enthuse","answer":"A","answer_word":"enthusiastically","explanation":"■ 文の骨格\nCity employees ______ endorsed the new benefits plan proposed by the city’s Department of Health.\n\n■ 空所に入るもの\n主語 City employees と述語動詞 endorsed の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) enthusiastically … 副詞「熱心に」 ○\n(B) enthusiastic … 形容詞「熱心な」 ×\n(C) enthusiasm … 名詞「熱意」 ×\n(D) enthuse … 動詞（原形）「熱狂的に語る」 ×\n\n■ 完成文\nCity employees enthusiastically endorsed the new benefits plan proposed by the city’s Department of Health.\n（市職員は、市の保健局が提案した新しい福利厚生案を熱心に支持した。）\n\n■ 解き方のポイント\n〈主語＋空所＋動詞〉は副詞の定位置。","words":[{"w":"endorsed","p":"動詞（過去形）","m":"支持した"},{"w":"enthusiastically","p":"副詞","m":"熱心に"},{"w":"benefits plan","p":"名詞","m":"福利厚生案"},{"w":"proposed","p":"動詞（過去分詞）","m":"提案された"}]},{"id":53,"category":"品詞問題・実戦問題 基本編","question":"It is estimated that Coyote Oil’s net profit last year was in ______ of 1 billion dollars.","A":"excessive","B":"excess","C":"excessively","D":"exceed","answer":"B","answer_word":"excess","explanation":"■ 文の骨格\nIt is estimated that Coyote Oil’s net profit last year was in ______ of 1 billion dollars.\n\n■ 空所に入るもの\nin と of に挟まれた位置で、名詞が必要。\n→ 空所には「前置詞 in の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) excessive … 形容詞「過度の」 ×\n(B) excess … 名詞「超過、過剰」 ○\n(C) excessively … 副詞「過度に」 ×\n(D) exceed … 動詞（原形）「〜を超える」 ×\n\n■ 完成文\nIt is estimated that Coyote Oil’s net profit last year was in excess of 1 billion dollars.\n（Coyote 石油の昨年の純利益は10億ドルを超えると推計されている。）\n\n■ 解き方のポイント\nin excess of X＝「Xを超えて」。前置詞に挟まれた空所は名詞。","words":[{"w":"estimated","p":"動詞（過去分詞）","m":"推計される"},{"w":"net profit","p":"名詞","m":"純利益"},{"w":"excess","p":"名詞","m":"超過"},{"w":"billion","p":"名詞","m":"10億"}]},{"id":54,"category":"品詞問題・実戦問題 基本編","question":"The Department of Transportation has ______ requested information about Mr. Becker’s updated address.","A":"repeat","B":"repeated","C":"repeatedly","D":"repeats","answer":"C","answer_word":"repeatedly","explanation":"■ 文の骨格\nThe Department of Transportation has ______ requested information about Mr. Becker’s updated address.\n\n■ 空所に入るもの\n現在完了形 has requested の間に入る修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) repeat … 動詞（原形）「繰り返す」 ×\n(B) repeated … 動詞の過去形・過去分詞「繰り返した」 ×\n(C) repeatedly … 副詞「繰り返し」 ○\n(D) repeats … 動詞（三人称単数現在形）「繰り返す」 ×\n\n■ 完成文\nThe Department of Transportation has repeatedly requested information about Mr. Becker’s updated address.\n（運輸局は、Becker さんの更新後の住所情報を繰り返し問い合わせている。）\n\n■ 解き方のポイント\n〈has/have＋空所＋過去分詞〉は副詞。","words":[{"w":"Department of Transportation","p":"名詞","m":"運輸局"},{"w":"repeatedly","p":"副詞","m":"繰り返し"},{"w":"requested","p":"動詞（過去分詞）","m":"要求した"},{"w":"updated","p":"形容詞","m":"更新された"}]},{"id":55,"category":"品詞問題・実戦問題 基本編","question":"Buy one of our surfboards and get a free ______ to Surfing Life magazine.","A":"subscription","B":"subscribe","C":"subscribed","D":"subscribing","answer":"A","answer_word":"subscription","explanation":"■ 文の骨格\nBuy one of our surfboards and get a free ______ to Surfing Life magazine.\n\n■ 空所に入るもの\n冠詞 a と形容詞 free の後ろで、目的語となる名詞が必要。\n→ 空所には「get の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) subscription … 名詞「定期購読」 ○\n(B) subscribe … 動詞（原形）「定期購読する」 ×\n(C) subscribed … 動詞の過去形・過去分詞「購読した」 ×\n(D) subscribing … 現在分詞・動名詞「購読すること」 ×\n\n■ 完成文\nBuy one of our surfboards and get a free subscription to Surfing Life magazine.\n（当店のサーフボードを1枚お買い上げで、雑誌『Surfing Life』の無料購読権が付いてきます。）\n\n■ 解き方のポイント\n〈冠詞＋形容詞＋空所〉は名詞。subscription to X で「Xの定期購読」。","words":[{"w":"surfboards","p":"名詞","m":"サーフボード"},{"w":"free","p":"形容詞","m":"無料の"},{"w":"subscription","p":"名詞","m":"定期購読"},{"w":"magazine","p":"名詞","m":"雑誌"}]},{"id":56,"category":"品詞問題・実戦問題 基本編","question":"The supermarket chain has had a very successful year under the ______ of its new CEO, Aditya Kumar.","A":"direct","B":"direction","C":"directed","D":"directly","answer":"B","answer_word":"direction","explanation":"■ 文の骨格\nThe supermarket chain has had a very successful year under the ______ of its new CEO, Aditya Kumar.\n\n■ 空所に入るもの\nthe と of に挟まれた位置で、名詞が必要。\n→ 空所には「前置詞 the の後ろに置く名詞」が必要です。\n\n■ 選択肢の確認\n(A) direct … 形容詞／動詞「直接の／指揮する」 ×\n(B) direction … 名詞「指揮、指導」 ○\n(C) directed … 動詞の過去形・過去分詞「指揮された」 ×\n(D) directly … 副詞「直接に」 ×\n\n■ 完成文\nThe supermarket chain has had a very successful year under the direction of its new CEO, Aditya Kumar.\n（そのスーパーマーケットチェーンは、新 CEO の Aditya Kumar の指揮のもと、大成功の1年を送った。）\n\n■ 解き方のポイント\nunder the direction of X＝「Xの指揮のもと」。〈the ＿＿ of〉は名詞。","words":[{"w":"supermarket chain","p":"名詞","m":"スーパーマーケットチェーン"},{"w":"successful","p":"形容詞","m":"成功した"},{"w":"direction","p":"名詞","m":"指揮、指導"}]},{"id":57,"category":"品詞問題・実戦問題 基本編","question":"No seats for the concert are guaranteed unless you make ______ and payments in advance.","A":"reserve","B":"reserves","C":"reserved","D":"reservations","answer":"D","answer_word":"reservations","explanation":"■ 文の骨格\nNo seats for the concert are guaranteed unless you make ______ and payments in advance.\n\n■ 空所に入るもの\n他動詞 make の目的語が欠けており、payments と並列になる名詞が必要。\n→ 空所には「make の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) reserve … 動詞（原形）「予約する」 ×\n(B) reserves … 動詞（三人称単数現在形）／名詞「予約する／蓄え」 ×\n(C) reserved … 動詞の過去形・過去分詞「予約された」 ×\n(D) reservations … 名詞（複数形）「予約」 ○\n\n■ 完成文\nNo seats for the concert are guaranteed unless you make reservations and payments in advance.\n（事前に予約と支払いを済ませない限り、コンサートの座席は確保されません。）\n\n■ 解き方のポイント\nand の後ろが複数名詞 payments なので、空所も複数名詞。make a reservation は定型表現。","words":[{"w":"seats","p":"名詞","m":"座席"},{"w":"guaranteed","p":"動詞（過去分詞）","m":"保証される"},{"w":"unless","p":"接続詞","m":"〜しない限り"},{"w":"reservations","p":"名詞","m":"予約"},{"w":"in advance","p":"熟語","m":"前もって"}]},{"id":58,"category":"品詞問題・実戦問題 基本編","question":"The new sales manager has been putting an ______ on attracting new clients rather than just selling higher volumes.","A":"emphasize","B":"emphasized","C":"emphasis","D":"emphasizes","answer":"C","answer_word":"emphasis","explanation":"■ 文の骨格\nThe new sales manager has been putting an ______ on attracting new clients rather than just selling higher volumes.\n\n■ 空所に入るもの\n冠詞 an の後ろで、put an ... on の形をつくる名詞が必要。\n→ 空所には「put の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) emphasize … 動詞（原形）「強調する」 ×\n(B) emphasized … 動詞の過去形・過去分詞「強調した」 ×\n(C) emphasis … 名詞「重点、強調」 ○\n(D) emphasizes … 動詞（三人称単数現在形）「強調する」 ×\n\n■ 完成文\nThe new sales manager has been putting an emphasis on attracting new clients rather than just selling higher volumes.\n（新しい営業部長は、ただ販売量を増やすことよりも、新規顧客の獲得に重点を置いている。）\n\n■ 解き方のポイント\nput an emphasis on X＝「Xを重視する」。冠詞 an の直後は名詞。","words":[{"w":"sales manager","p":"名詞","m":"営業部長"},{"w":"emphasis","p":"名詞","m":"重点"},{"w":"attracting","p":"動名詞","m":"引き付けること"},{"w":"clients","p":"名詞","m":"顧客"},{"w":"volumes","p":"名詞","m":"量"}]},{"id":59,"category":"品詞問題・実戦問題 基本編","question":"A reviewer who attended the opening night of Max Cabernet’s new musical reported that it was exciting and ______.","A":"memory","B":"memorable","C":"memorize","D":"memorably","answer":"B","answer_word":"memorable","explanation":"■ 文の骨格\nA reviewer who attended the opening night of Max Cabernet’s new musical reported that it was exciting and ______.\n\n■ 空所に入るもの\nand の前が形容詞 exciting なので、後ろも同じ形容詞が必要。\n→ 空所には「exciting と並列になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) memory … 名詞「記憶」 ×\n(B) memorable … 形容詞「忘れられない、印象的な」 ○\n(C) memorize … 動詞（原形）「暗記する」 ×\n(D) memorably … 副詞「印象的に」 ×\n\n■ 完成文\nA reviewer who attended the opening night of Max Cabernet’s new musical reported that it was exciting and memorable.\n（Max Cabernet の新作ミュージカルの初日を観た批評家は、その作品がわくわくする忘れがたいものだったと伝えた。）\n\n■ 解き方のポイント\nand の前後は同じ品詞。前を見れば答えが決まる。","words":[{"w":"reviewer","p":"名詞","m":"批評家"},{"w":"opening night","p":"名詞","m":"初日公演"},{"w":"exciting","p":"形容詞","m":"わくわくさせる"},{"w":"memorable","p":"形容詞","m":"忘れられない"}]},{"id":60,"category":"品詞問題・実戦問題 基本編","question":"The TexPhone was found to be unattractive to consumers due to weaknesses in terms of color, design, and ______ of use.","A":"easy","B":"easily","C":"ease","D":"easier","answer":"C","answer_word":"ease","explanation":"■ 文の骨格\nThe TexPhone was found to be unattractive to consumers due to weaknesses in terms of color, design, and ______ of use.\n\n■ 空所に入るもの\n3つの名詞を並べる並列構造の3番目で、of use を伴う名詞が必要。\n→ 空所には「color, design と並列になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) easy … 形容詞「簡単な」 ×\n(B) easily … 副詞「簡単に」 ×\n(C) ease … 名詞「容易さ、使いやすさ」 ○\n(D) easier … 形容詞（比較級）「より簡単な」 ×\n\n■ 完成文\nThe TexPhone was found to be unattractive to consumers due to weaknesses in terms of color, design, and ease of use.\n（TexPhone は色・デザイン・使いやすさの点で弱みがあり、消費者にとって魅力に欠けると分かった。）\n\n■ 解き方のポイント\nA, B, and C の並列は同じ品詞。ease of use＝「使いやすさ」。","words":[{"w":"unattractive","p":"形容詞","m":"魅力のない"},{"w":"consumers","p":"名詞","m":"消費者"},{"w":"weaknesses","p":"名詞","m":"弱み"},{"w":"in terms of","p":"熟語","m":"〜の点で"},{"w":"ease","p":"名詞","m":"容易さ"}]},{"id":61,"category":"品詞問題・実戦問題 基本編","question":"Experts ______ that new building insulation regulations will reduce the state’s dependency on fossil fuels.","A":"predict","B":"predicting","C":"predictable","D":"prediction","answer":"A","answer_word":"predict","explanation":"■ 文の骨格\nExperts ______ that new building insulation regulations will reduce the state’s dependency on fossil fuels.\n\n■ 空所に入るもの\n主語 Experts の直後に空所があり、この文には動詞がない。\n→ 空所には「述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) predict … 動詞（現在形）「予測する」 ○\n(B) predicting … 現在分詞・動名詞「予測している」 ×\n(C) predictable … 形容詞「予測できる」 ×\n(D) prediction … 名詞「予測」 ×\n\n■ 完成文\nExperts predict that new building insulation regulations will reduce the state’s dependency on fossil fuels.\n（新しい建物の断熱基準は、州の化石燃料への依存を減らすだろうと専門家は予測している。）\n\n■ 解き方のポイント\n主語の直後の空所は述語動詞。主語が複数形なので原形（現在形）でよい。","words":[{"w":"Experts","p":"名詞","m":"専門家"},{"w":"predict","p":"動詞","m":"予測する"},{"w":"insulation","p":"名詞","m":"断熱"},{"w":"regulations","p":"名詞","m":"規制、基準"},{"w":"dependency","p":"名詞","m":"依存"},{"w":"fossil fuels","p":"名詞","m":"化石燃料"}]},{"id":62,"category":"品詞問題・実戦問題 基本編","question":"If the City Council ______ the renovation plan for the airport, workers will begin construction late this year.","A":"approves","B":"approvable","C":"approval","D":"approvingly","answer":"A","answer_word":"approves","explanation":"■ 文の骨格\nIf the City Council ______ the renovation plan for the airport, workers will begin construction late this year.\n\n■ 空所に入るもの\nIf 節の主語 the City Council に対応する動詞がない。\n→ 空所には「if 節の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) approves … 動詞（三人称単数現在形）「承認する」 ○\n(B) approvable … 形容詞「承認できる」 ×\n(C) approval … 名詞「承認」 ×\n(D) approvingly … 副詞「賛成して」 ×\n\n■ 完成文\nIf the City Council approves the renovation plan for the airport, workers will begin construction late this year.\n（市議会が空港の改装計画を承認すれば、作業員は年内に工事を開始する。）\n\n■ 解き方のポイント\n主語が三人称単数なので動詞に -s。-al で終わっても approval は名詞。","words":[{"w":"City Council","p":"名詞","m":"市議会"},{"w":"approves","p":"動詞","m":"承認する"},{"w":"renovation plan","p":"名詞","m":"改装計画"},{"w":"construction","p":"名詞","m":"工事"}]},{"id":63,"category":"品詞問題・実戦問題 基本編","question":"Dr. Matthews has received a ______ large number of calls in response to her lectures at medical schools nationwide.","A":"surprise","B":"surprised","C":"surprisingly","D":"surprises","answer":"C","answer_word":"surprisingly","explanation":"■ 文の骨格\nDr. Matthews has received a ______ large number of calls in response to her lectures at medical schools nationwide.\n\n■ 空所に入るもの\n冠詞 a と形容詞 large の間で、形容詞を修飾する位置。\n→ 空所には「形容詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) surprise … 名詞／
