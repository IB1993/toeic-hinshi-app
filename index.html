h は不可算で単数扱い、many は可算で複数扱い。動詞 has が決め手。","words":[{"w":"Much","p":"代名詞","m":"多くのこと"},{"w":"outstanding","p":"形容詞","m":"卓越した"},{"w":"technique","p":"名詞","m":"技巧"},{"w":"subjects","p":"名詞","m":"題材"}]},{"id":685,"category":"文法模試 セット3（OCR素案）","question":"Ms. Narita is best suited for the position, because she is well ______ with China and speaks fluent Mandarin.","A":"acquaint","B":"acquainting","C":"acquainted","D":"acquaintance","answer":"C","answer_word":"acquainted","explanation":"■ 文の骨格\nMs. Narita is best suited for the position, because she is well ______ with China and speaks fluent Mandarin.\n\n■ 空所に入るもの\nbe acquainted with X（Xに精通している）という受動の定型表現になる。\n→ 空所には「be動詞の補語になる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) acquaint … 動詞（原形）「知り合いにさせる」 ×\n(B) acquainting … 現在分詞・動名詞「知り合いにさせること」 ×\n(C) acquainted … 過去分詞・形容詞「精通している」 ○\n(D) acquaintance … 名詞「知人、面識」 ×\n\n■ 完成文\nMs. Narita is best suited for the position, because she is well acquainted with China and speaks fluent Mandarin.\n（Narita さんは中国に精通し中国語も流暢なので、その職に最も適している。）\n\n■ 解き方のポイント\nbe acquainted with／be familiar with は「〜に精通している」。with が目印。","words":[{"w":"best suited","p":"熟語","m":"最も適した"},{"w":"acquainted with","p":"熟語","m":"〜に精通している"},{"w":"fluent","p":"形容詞","m":"流暢な"},{"w":"Mandarin","p":"名詞","m":"中国語（標準語）"}]},{"id":686,"category":"文法模試 セット3（OCR素案）","question":"Your e-mail address and ______ contact information will be retained by Nilebooks.com in order to make future purchases more convenient.","A":"other","B":"another","C":"others","D":"each other","answer":"A","answer_word":"other","explanation":"■ 文の骨格\nYour e-mail address and ______ contact information will be retained by Nilebooks.com in order to make future purchases more convenient.\n\n■ 空所に入るもの\n直後が不可算名詞 contact information なので、それに付けられる語が必要。\n→ 空所には「不可算名詞を修飾する語」が必要です。\n\n■ 選択肢の確認\n(A) other … 形容詞「ほかの」 ○\n(B) another … 形容詞（単数可算名詞用）「もう1つの」 ×\n(C) others … 代名詞「ほかの人・物」 ×\n(D) each other … 相互代名詞「お互い」 ×\n\n■ 完成文\nYour e-mail address and other contact information will be retained by Nilebooks.com in order to make future purchases more convenient.\n（お客様のメールアドセスとその他の連絡先情報は、今後のお買い物をより便利にするため Nilebooks.com が保管します。）\n\n■ 解き方のポイント\nanother＋単数可算名詞。不可算名詞や複数名詞には other を使う。","words":[{"w":"other","p":"形容詞","m":"ほかの"},{"w":"contact information","p":"名詞","m":"連絡先情報"},{"w":"retained","p":"動詞（過去分詞）","m":"保管される"},{"w":"purchases","p":"名詞","m":"購入"}]},{"id":687,"category":"文法模試 セット3（OCR素案）","question":"Kim's Oriental Restaurant ______ in the heart of Tokyo, within walking distance of Tokyo Sky Tower.","A":"situate","B":"situating","C":"is situated","D":"has situated","answer":"C","answer_word":"is situated","explanation":"■ 文の骨格\nKim's Oriental Restaurant ______ in the heart of Tokyo, within walking distance of Tokyo Sky Tower.\n\n■ 空所に入るもの\nbe situated in＝「〜に位置している」という受動の定型表現になる。\n→ 空所には「受動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) situate … 動詞（原形）「位置づける」 ×\n(B) situating … 現在分詞・動名詞「位置づけること」 ×\n(C) is situated … 受動態（現在形）「位置している」 ○\n(D) has situated … 現在完了形（能動）「位置づけてきた」 ×\n\n■ 完成文\nKim's Oriental Restaurant is situated in the heart of Tokyo, within walking distance of Tokyo Sky Tower.\n（Kim’s Oriental Restaurant は東京の中心部、東京スカイツリーから徒歩圏内にある。）\n\n■ 解き方のポイント\nbe situated／be located は「位置している」を表す受動の定型。","words":[{"w":"is situated","p":"受動態","m":"位置している"},{"w":"heart","p":"名詞","m":"中心部"},{"w":"within walking distance","p":"熟語","m":"徒歩圏内に"}]},{"id":688,"category":"文法模試 セット3（OCR素案）","question":"Increased competition with national chains could be to blame for the ______ in sales at family-owned stores.","A":"decreasingly","B":"to decrease","C":"decreased","D":"decrease","answer":"D","answer_word":"decrease","explanation":"■ 文の骨格\nIncreased competition with national chains could be to blame for the ______ in sales at family-owned stores.\n\n■ 空所に入るもの\nthe と in に挟まれた位置で、名詞が必要。\n→ 空所には「前置詞 the の後ろに置く名詞」が必要です。\n\n■ 選択肢の確認\n(A) decreasingly … 副詞「減少して」 ×\n(B) to decrease … 不定詞「減少すること」 ×\n(C) decreased … 動詞の過去形・過去分詞「減少した」 ×\n(D) decrease … 名詞「減少」 ○\n\n■ 完成文\nIncreased competition with national chains could be to blame for the decrease in sales at family-owned stores.\n（全国チェーンとの競争激化が、家族経営店の売上減少の原因かもしれない。）\n\n■ 解き方のポイント\n〈the ＿＿ in〉は名詞。a decrease [increase] in X＝「Xの減少［増加］」。","words":[{"w":"Increased competition","p":"名詞","m":"競争激化"},{"w":"to blame for","p":"熟語","m":"〜の原因である"},{"w":"decrease","p":"名詞","m":"減少"},{"w":"family-owned","p":"形容詞","m":"家族経営の"}]},{"id":689,"category":"文法模試 セット3（OCR素案）","question":"By the time Ms. Eriksson returns from her vacation in Stockholm, the workers ______ the renovations to her house.","A":"completes","B":"have completed","C":"were completing","D":"will have completed","answer":"D","answer_word":"will have completed","explanation":"■ 文の骨格\nBy the time Ms. Eriksson returns from her vacation in Stockholm, the workers ______ the renovations to her house.\n\n■ 空所に入るもの\nBy the time ...（〜するころまでには）は未来完了形と呼応する。\n→ 空所には「未来完了形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) completes … 現在形（単数）「完了する」 ×\n(B) have completed … 現在完了形「完了した」 ×\n(C) were completing … 過去進行形「完了しつつあった」 ×\n(D) will have completed … 未来完了形「完了し終えているだろう」 ○\n\n■ 完成文\nBy the time Ms. Eriksson returns from her vacation in Stockholm, the workers will have completed the renovations to her house.\n（Eriksson さんがストックホルムでの休暇から戻るころには、作業員は彼女の家の改装を終えているだろう。）\n\n■ 解き方のポイント\nBy the time＋現在形, S＋will have＋過去分詞。時制の組み合わせを覚える。","words":[{"w":"By the time","p":"熟語","m":"〜するころまでには"},{"w":"returns","p":"動詞","m":"戻る"},{"w":"will have completed","p":"未来完了","m":"終えているだろう"},{"w":"renovations","p":"名詞","m":"改装"}]},{"id":690,"category":"文法模試 セット3（OCR素案）","question":"The Entertainment Software Association represents companies that sell ______ video games.","A":"interact","B":"interactive","C":"interaction","D":"interactively","answer":"B","answer_word":"interactive","explanation":"■ 文の骨格\nThe Entertainment Software Association represents companies that sell ______ video games.\n\n■ 空所に入るもの\n他動詞 sell の目的語 video games を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) interact … 動詞（原形）「相互作用する」 ×\n(B) interactive … 形容詞「双方向の、対話型の」 ○\n(C) interaction … 名詞「相互作用」 ×\n(D) interactively … 副詞「相互に」 ×\n\n■ 完成文\nThe Entertainment Software Association represents companies that sell interactive video games.\n（エンターテインメントソフトウェア協会は、対話型ビデオゲームを販売する企業を代表している。）\n\n■ 解き方のポイント\n名詞の直前は形容詞。-ive は形容詞の目印。","words":[{"w":"Association","p":"名詞","m":"協会"},{"w":"represents","p":"動詞","m":"代表する"},{"w":"interactive","p":"形容詞","m":"双方向の"},{"w":"video games","p":"名詞","m":"ビデオゲーム"}]},{"id":691,"category":"文法模試 セット3（OCR素案）","question":"At training workshops, it is often stated that ______ has to do their part to keep projects running smoothly.","A":"other","B":"another","C":"others","D":"everyone","answer":"D","answer_word":"everyone","explanation":"■ 文の骨格\nAt training workshops, it is often stated that ______ has to do their part to keep projects running smoothly.\n\n■ 空所に入るもの\n述語動詞 has to に対応する単数扱いの主語が必要。\n→ 空所には「単数扱いの主語になる代名詞」が必要です。\n\n■ 選択肢の確認\n(A) other … 形容詞「ほかの」 ×\n(B) another … 代名詞「もう1つ」 ×\n(C) others … 代名詞「ほかの人々」 ×\n(D) everyone … 代名詞（単数扱い）「誰もが」 ○\n\n■ 完成文\nAt training workshops, it is often stated that everyone has to do their part to keep projects running smoothly.\n（研修では、プロジェクトを円滑に進めるには全員が自分の役割を果たさなければならないとよく言われる。）\n\n■ 解き方のポイント\neveryone は単数扱い（has）だが、受ける代名詞は their でもよい。","words":[{"w":"stated","p":"動詞（過去分詞）","m":"述べられる"},{"w":"everyone","p":"代名詞","m":"誰もが"},{"w":"do their part","p":"熟語","m":"自分の役割を果たす"},{"w":"smoothly","p":"副詞","m":"円滑に"}]},{"id":692,"category":"文法模試 セット4（OCR素案）","question":"Tickets for the concert are $15 in advance, $20 at the door, and there are ______ rates for groups of 10 or more.","A":"specialize","B":"special","C":"specially","D":"specialty","answer":"B","answer_word":"special","explanation":"■ 文の骨格\nTickets for the concert are $15 in advance, $20 at the door, and there are ______ rates for groups of 10 or more.\n\n■ 空所に入るもの\n名詞 rates を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) specialize … 動詞（原形）「専門にする」 ×\n(B) special … 形容詞「特別な」 ○\n(C) specially … 副詞「特別に」 ×\n(D) specialty … 名詞「専門、名物」 ×\n\n■ 完成文\nTickets for the concert are $15 in advance, $20 at the door, and there are special rates for groups of 10 or more.\n（コンサートのチケットは前売り15ドル、当日20ドルで、10名以上の団体には特別料金がある。）\n\n■ 解き方のポイント\n名詞の直前は形容詞。specialty（名物）とは意味が異なる。","words":[{"w":"in advance","p":"熟語","m":"前売りで"},{"w":"at the door","p":"熟語","m":"当日券で"},{"w":"special","p":"形容詞","m":"特別な"},{"w":"rates","p":"名詞","m":"料金"}]},{"id":693,"category":"文法模試 セット4（OCR素案）","question":"Novelist Elizabeth Noguchi was her own ______ critic, inspecting every word and phrase with an eye toward possible improvement.","A":"harsher","B":"harshest","C":"harshly","D":"harshness","answer":"B","answer_word":"harshest","explanation":"■ 文の骨格\nNovelist Elizabeth Noguchi was her own ______ critic, inspecting every word and phrase with an eye toward possible improvement.\n\n■ 空所に入るもの\nher own と名詞 critic の間にあり、名詞を修飾する形容詞が必要。\n→ 空所には「名詞を修飾する最上級の形容詞」が必要です。\n\n■ 選択肢の確認\n(A) harsher … 形容詞（比較級）「より厳しい」 ×\n(B) harshest … 形容詞（最上級）「最も厳しい」 ○\n(C) harshly … 副詞「厳しく」 ×\n(D) harshness … 名詞「厳しさ」 ×\n\n■ 完成文\nNovelist Elizabeth Noguchi was her own harshest critic, inspecting every word and phrase with an eye toward possible improvement.\n（小説家 Elizabeth Noguchi は、改善の余地を求めて一語一句を吟味する、自らに最も厳しい批評家だった。）\n\n■ 解き方のポイント\none's own＋最上級＋名詞＝「自分にとって最も〜な…」。所有格は the の代わりになる。","words":[{"w":"Novelist","p":"名詞","m":"小説家"},{"w":"harshest","p":"最上級","m":"最も厳しい"},{"w":"critic","p":"名詞","m":"批評家"},{"w":"inspecting","p":"現在分詞","m":"吟味している"}]},{"id":694,"category":"文法模試 セット4（OCR素案）","question":"The event organizer apologized to Mr. Hasegawa for failing to include his name on the guest list, saying the omission was not ______.","A":"deliberate","B":"deliberation","C":"deliberator","D":"deliberately","answer":"A","answer_word":"deliberate","explanation":"■ 文の骨格\nThe event organizer apologized to Mr. Hasegawa for failing to include his name on the guest list, saying the omission was not ______.\n\n■ 空所に入るもの\nwas not の後ろで、主語 the omission の性質を表す補語が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) deliberate … 形容詞「意図的な」 ○\n(B) deliberation … 名詞「熟考」 ×\n(C) deliberator … 名詞（人）「審議者」 ×\n(D) deliberately … 副詞「意図的に」 ×\n\n■ 完成文\nThe event organizer apologized to Mr. Hasegawa for failing to include his name on the guest list, saying the omission was not deliberate.\n（イベント主催者は、招待客名簿に Hasegawa さんの名前を載せ忘れたことを謝り、その手落ちは意図的なものではなかったと述べた。）\n\n■ 解き方のポイント\nbe動詞の補語は形容詞。副詞は補語になれない。","words":[{"w":"apologized","p":"動詞（過去形）","m":"謝った"},{"w":"guest list","p":"名詞","m":"招待客名簿"},{"w":"omission","p":"名詞","m":"手落ち、省略"},{"w":"deliberate","p":"形容詞","m":"意図的な"}]},{"id":695,"category":"文法模試 セット4（OCR素案）","question":"It looks ______ there will be enough participants for the intensive English course this summer.","A":"as","B":"like","C":"as if","D":"so as","answer":"C","answer_word":"as if","explanation":"■ 文の骨格\nIt looks ______ there will be enough participants for the intensive English course this summer.\n\n■ 空所に入るもの\nlook の後ろに〈主語＋動詞〉が続くので、節を導く接続詞が必要。\n→ 空所には「節を導く接続詞（群）」が必要です。\n\n■ 選択肢の確認\n(A) as … 前置詞・接続詞「〜として」 ×\n(B) like … 前置詞「〜のような」 ×\n(C) as if … 接続詞（群）「〜のように見える」 ○\n(D) so as … 群不定詞の一部「〜するように」 ×\n\n■ 完成文\nIt looks as if there will be enough participants for the intensive English course this summer.\n（今年の夏の英語集中講座には、十分な数の参加者が集まりそうだ。）\n\n■ 解き方のポイント\nlook as if＋節／look like＋名詞。後ろの形で使い分ける。","words":[{"w":"as if","p":"熟語","m":"〜のように"},{"w":"participants","p":"名詞","m":"参加者"},{"w":"intensive","p":"形容詞","m":"集中的な"}]},{"id":696,"category":"文法模試 セット4（OCR素案）","question":"The furniture on display in our main showroom is not ______ exposed to sunlight.","A":"direct","B":"directly","C":"directed","D":"directory","answer":"B","answer_word":"directly","explanation":"■ 文の骨格\nThe furniture on display in our main showroom is not ______ exposed to sunlight.\n\n■ 空所に入るもの\n受動態 is exposed の間に入る修飾語の位置。\n→ 空所には「過去分詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) direct … 形容詞「直接の」 ×\n(B) directly … 副詞「直接に」 ○\n(C) directed … 動詞の過去形・過去分詞「向けられた」 ×\n(D) directory … 名詞「名簿、ディレクトリ」 ×\n\n■ 完成文\nThe furniture on display in our main showroom is not directly exposed to sunlight.\n（当社メインショールームに展示されている家具は、直射日光にさらされていない。）\n\n■ 解き方のポイント\n〈be＋空所＋過去分詞〉は副詞の定位置。","words":[{"w":"furniture","p":"名詞","m":"家具"},{"w":"on display","p":"熟語","m":"展示されて"},{"w":"directly","p":"副詞","m":"直接に"},{"w":"exposed to","p":"熟語","m":"〜にさらされて"}]},{"id":697,"category":"文法模試 セット4（OCR素案）","question":"Some of the flights from Kobe Airport have been delayed due to heavy snow, but ______ were canceled throughout the day.","A":"none","B":"nobody","C":"neither","D":"nothing","answer":"A","answer_word":"none","explanation":"■ 文の骨格\nSome of the flights from Kobe Airport have been delayed due to heavy snow, but ______ were canceled throughout the day.\n\n■ 空所に入るもの\n述語動詞 were に対応する複数扱いの主語が必要で、前半と対比になる意味の語が入る。\n→ 空所には「複数扱いの主語になる代名詞」が必要です。\n\n■ 選択肢の確認\n(A) none … 代名詞（複数扱い）「1つも〜ない」 ○\n(B) nobody … 代名詞（単数扱い）「誰も〜ない」 ×\n(C) neither … 代名詞（単数扱い）「どちらも〜ない」 ×\n(D) nothing … 代名詞（単数扱い）「何も〜ない」 ×\n\n■ 完成文\nSome of the flights from Kobe Airport have been delayed due to heavy snow, but none were canceled throughout the day.\n（神戸空港発の便のいくつかは大雪のため遅延したが、その日を通して欠航した便は1つもなかった。）\n\n■ 解き方のポイント\nnone は「（3つ以上のうち）1つもない」。複数扱いで受けられる。","words":[{"w":"flights","p":"名詞","m":"便"},{"w":"delayed","p":"動詞（過去分詞）","m":"遅延した"},{"w":"none","p":"代名詞","m":"1つも〜ない"},{"w":"canceled","p":"動詞（過去分詞）","m":"欠航した"}]},{"id":698,"category":"文法模試 セット4（OCR素案）","question":"Speednet plans to release a new version of its best-selling software later this year ______ early next year.","A":"or","B":"over","C":"and","D":"but","answer":"A","answer_word":"or","explanation":"■ 文の骨格\nSpeednet plans to release a new version of its best-selling software later this year ______ early next year.\n\n■ 空所に入るもの\n2つの時期を並べて「どちらか」を表す接続詞が文意に合う。\n→ 空所には「選択肢を並べる等位接続詞」が必要です。\n\n■ 選択肢の確認\n(A) or … 等位接続詞「または」 ○\n(B) over … 前置詞「〜を越えて」 ×\n(C) and … 等位接続詞「そして」 ×\n(D) but … 等位接続詞「しかし」 ×\n\n■ 完成文\nSpeednet plans to release a new version of its best-selling software later this year or early next year.\n（Speednet 社は、主力ソフトの新版を今年後半か来年初めに発売する計画だ。）\n\n■ 解き方のポイント\nA or B は選択、A and B は並列。文意で使い分ける。","words":[{"w":"release","p":"動詞","m":"発売する"},{"w":"best-selling","p":"形容詞","m":"主力の、よく売れている"},{"w":"or","p":"等位接続詞","m":"または"}]},{"id":699,"category":"文法模試 セット4（OCR素案）","question":"Unfortunately, the factory's completion has been postponed by ______ two weeks due to trouble obtaining building materials.","A":"another","B":"several","C":"much","D":"from","answer":"A","answer_word":"another","explanation":"■ 文の骨格\nUnfortunately, the factory's completion has been postponed by ______ two weeks due to trouble obtaining building materials.\n\n■ 空所に入るもの\n「さらに2週間」という追加の期間を表す語が文意に合う。\n→ 空所には「期間表現を修飾する語」が必要です。\n\n■ 選択肢の確認\n(A) another … 形容詞「もう〜、さらに」 ○\n(B) several … 形容詞「いくつかの」 ×\n(C) much … 副詞・形容詞「たくさんの」 ×\n(D) from … 前置詞「〜から」 ×\n\n■ 完成文\nUnfortunately, the factory's completion has been postponed by another two weeks due to trouble obtaining building materials.\n（あいにく、建材の調達難のため工場の完成はさらに2週間延期された。）\n\n■ 解き方のポイント\nanother＋複数の期間表現（another two weeks）は「さらに2週間」を表す例外的用法。","words":[{"w":"completion","p":"名詞","m":"完成"},{"w":"postponed","p":"動詞（過去分詞）","m":"延期された"},{"w":"another","p":"形容詞","m":"さらに"},{"w":"building materials","p":"名詞","m":"建材"}]},{"id":700,"category":"文法模試 セット4（OCR素案）","question":"Mountain Electronics, one of the leading manufacturers of consumer electronics, announced a major ______ today.","A":"reorganize","B":"reorganized","C":"reorganizational","D":"reorganization","answer":"D","answer_word":"reorganization","explanation":"■ 文の骨格\nMountain Electronics, one of the leading manufacturers of consumer electronics, announced a major ______ today.\n\n■ 空所に入るもの\n冠詞 a と形容詞 major の後ろで、他動詞 announced の目的語となる名詞が必要。\n→ 空所には「announced の目的語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) reorganize … 動詞（原形）「再編する」 ×\n(B) reorganized … 動詞の過去形・過去分詞「再編された」 ×\n(C) reorganizational … 形容詞「組織再編の」 ×\n(D) reorganization … 名詞「組織再編」 ○\n\n■ 完成文\nMountain Electronics, one of the leading manufacturers of consumer electronics, announced a major reorganization today.\n（家電大手メーカーの1社である Mountain Electronics 社は本日、大規模な組織再編を発表した。）\n\n■ 解き方のポイント\n〈冠詞＋形容詞＋空所〉は名詞。-tion は名詞の目印。","words":[{"w":"leading","p":"形容詞","m":"主要な"},{"w":"manufacturers","p":"名詞","m":"メーカー"},{"w":"consumer electronics","p":"名詞","m":"家電"},{"w":"reorganization","p":"名詞","m":"組織再編"}]},{"id":701,"category":"文法模試 セット4（OCR素案）","question":"Mr. Kim opened a grocery store ______ sells imported food products from Korea and Japan.","A":"whose","B":"whom","C":"that","D":"what","answer":"C","answer_word":"that","explanation":"■ 文の骨格\nMr. Kim opened a grocery store ______ sells imported food products from Korea and Japan.\n\n■ 空所に入るもの\n先行詞 a grocery store を受け、関係詞節の主語になる語が必要。\n→ 空所には「物を先行詞とする主格の関係代名詞」が必要です。\n\n■ 選択肢の確認\n(A) whose … 関係代名詞（所有格）「その〜が」 ×\n(B) whom … 関係代名詞（目的格・人）「〜する人を」 ×\n(C) that … 関係代名詞（主格）「それは」 ○\n(D) what … 関係代名詞（先行詞を含む）「〜すること」 ×\n\n■ 完成文\nMr. Kim opened a grocery store that sells imported food products from Korea and Japan.\n（Kim さんは、韓国と日本からの輸入食品を販売する食料品店を開いた。）\n\n■ 解き方のポイント\n関係詞の直後が動詞なら主格。whose なら直後に名詞が来る。","words":[{"w":"grocery store","p":"名詞","m":"食料品店"},{"w":"that","p":"関係代名詞","m":"それは"},{"w":"imported","p":"形容詞","m":"輸入の"},{"w":"food products","p":"名詞","m":"食品"}]},{"id":702,"category":"文法模試 セット4（OCR素案）","question":"Presidents of both Bear Airways and Panda Airlines ______ comment about the rumor of the merger.","A":"to withhold","B":"has withheld","C":"withholding","D":"withheld","answer":"D","answer_word":"withheld","explanation":"■ 文の骨格\nPresidents of both Bear Airways and Panda Airlines ______ comment about the rumor of the merger.\n\n■ 空所に入るもの\n主語 Presidents に対する述語動詞が欠けている。複数主語に対応する形が必要。\n→ 空所には「過去形の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) to withhold … 不定詞「差し控えること」 ×\n(B) has withheld … 現在完了形（単数）「差し控えた」 ×\n(C) withholding … 現在分詞・動名詞「差し控えること」 ×\n(D) withheld … 動詞（過去形）「差し控えた」 ○\n\n■ 完成文\nPresidents of both Bear Airways and Panda Airlines withheld comment about the rumor of the merger.\n（Bear 航空と Panda 航空の両社長は、合併のうわさについてコメントを差し控えた。）\n\n■ 解き方のポイント\n主語が複数なので has は不可。文には述語動詞が必要。","words":[{"w":"Presidents","p":"名詞","m":"社長"},{"w":"withheld","p":"動詞（過去形）","m":"差し控えた"},{"w":"rumor","p":"名詞","m":"うわさ"},{"w":"merger","p":"名詞","m":"合併"}]},{"id":703,"category":"文法模試 セット4（OCR素案）","question":"Modigliani Motors plans to release its new model sports car not only in Europe, but in the USA ______.","A":"except for","B":"as well","C":"due to","D":"instead","answer":"B","answer_word":"as well","explanation":"■ 文の骨格\nModigliani Motors plans to release its new model sports car not only in Europe, but in the USA ______.\n\n■ 空所に入るもの\nnot only A but B as well（AだけでなくBも）の形になる。\n→ 空所には「not only ... but ... と呼応する副詞句」が必要です。\n\n■ 選択肢の確認\n(A) except for … 群前置詞「〜を除いて」 ×\n(B) as well … 副詞句「〜もまた」 ○\n(C) due to … 群前置詞「〜のため」 ×\n(D) instead … 副詞「その代わりに」 ×\n\n■ 完成文\nModigliani Motors plans to release its new model sports car not only in Europe, but in the USA as well.\n（Modigliani Motors 社は、新型スポーツカーをヨーロッパだけでなくアメリカでも発売する計画だ。）\n\n■ 解き方のポイント\nnot only A but (also) B／not only A but B as well。as well は文末に置く。","words":[{"w":"release","p":"動詞","m":"発売する"},{"w":"not only ... but ... as well","p":"相関表現","m":"〜だけでなく…も"},{"w":"as well","p":"副詞句","m":"〜もまた"}]},{"id":704,"category":"文法模試 セット4（OCR素案）","question":"Tex Corporation's success over the years is based ______ on its reputation for high product quality and service levels.","A":"large","B":"largely","C":"larger","D":"largeness","answer":"B","answer_word":"largely","explanation":"■ 文の骨格\nTex Corporation's success over the years is based ______ on its reputation for high product quality and service levels.\n\n■ 空所に入るもの\n受動態 is based on がすでに成立しており、空所は修飾語の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) large … 形容詞「大きい」 ×\n(B) largely … 副詞「主として」 ○\n(C) larger … 形容詞（比較級）「より大きい」 ×\n(D) largeness … 名詞「大きさ」 ×\n\n■ 完成文\nTex Corporation's success over the years is based largely on its reputation for high product quality and service levels.\n（Tex 社の長年の成功は、製品品質とサービス水準の高さという評判に主として支えられている。）\n\n■ 解き方のポイント\n〈be＋空所＋過去分詞〉は副詞の定位置。","words":[{"w":"success","p":"名詞","m":"成功"},{"w":"largely","p":"副詞","m":"主として"},{"w":"based on","p":"熟語","m":"〜に基づく"},{"w":"reputation","p":"名詞","m":"評判"}]},{"id":705,"category":"文法模試 セット4（OCR素案）","question":"The office staff is encouraged to rely on e-mail and scheduling software ______ we can conserve paper.","A":"not only","B":"on behalf of","C":"while","D":"so that","answer":"D","answer_word":"so that","explanation":"■ 文の骨格\nThe office staff is encouraged to rely on e-mail and scheduling software ______ we can conserve paper.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋助動詞＋動詞〉で、目的を表す接続詞が文意に合う。\n→ 空所には「目的を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) not only … 相関表現「〜だけでなく」 ×\n(B) on behalf of … 群前置詞「〜を代表して」 ×\n(C) while … 接続詞「〜する間」 ×\n(D) so that … 接続詞（群）「〜するために」 ○\n\n■ 完成文\nThe office staff is encouraged to rely on e-mail and scheduling software so that we can conserve paper.\n（紙を節約できるよう、社員はメールとスケジュール管理ソフトの活用を奨励されている。）\n\n■ 解き方のポイント\nso that S can V＝目的。後ろが節なので前置詞句は入らない。","words":[{"w":"office staff","p":"名詞","m":"社員"},{"w":"rely on","p":"熟語","m":"頼る"},{"w":"so that","p":"接続詞","m":"〜するために"},{"w":"conserve","p":"動詞","m":"節約する"}]},{"id":706,"category":"文法模試 セット4（OCR素案）","question":"Big Bear Room Solutions specializes in designing, creating, and ______ office space.","A":"divide","B":"divides","C":"divided","D":"dividing","answer":"D","answer_word":"dividing","explanation":"■ 文の骨格\nBig Bear Room Solutions specializes in designing, creating, and ______ office space.\n\n■ 空所に入るもの\ndesigning, creating と並列になる形が必要で、前置詞 in の目的語となる動名詞が入る。\n→ 空所には「並列される動名詞」が必要です。\n\n■ 選択肢の確認\n(A) divide … 動詞（原形）「分ける」 ×\n(B) divides … 動詞（三人称単数現在形）「分ける」 ×\n(C) divided … 動詞の過去形・過去分詞「分けられた」 ×\n(D) dividing … 動名詞「分けること」 ○\n\n■ 完成文\nBig Bear Room Solutions specializes in designing, creating, and dividing office space.\n（Big Bear Room Solutions 社は、オフィス空間の設計・制作・区分けを専門としている。）\n\n■ 解き方のポイント\nA, B, and C の並列は同じ形。前2つが -ing なので3つ目も -ing。","words":[{"w":"specializes in","p":"熟語","m":"〜を専門とする"},{"w":"designing","p":"動名詞","m":"設計すること"},{"w":"dividing","p":"動名詞","m":"区分けすること"},{"w":"office space","p":"名詞","m":"オフィス空間"}]},{"id":707,"category":"文法模試 セット5（OCR素案）","question":"Although ______ have confirmed their participation in this year's International Jazz Festival, the tickets have already sold out.","A":"few","B":"other","C":"someone","D":"everybody","answer":"A","answer_word":"few","explanation":"■ 文の骨格\nAlthough ______ have confirmed their participation in this year's International Jazz Festival, the tickets have already sold out.\n\n■ 空所に入るもの\n述語動詞 have confirmed に対応する複数扱いの主語が必要。\n→ 空所には「複数扱いの主語になる代名詞」が必要です。\n\n■ 選択肢の確認\n(A) few … 代名詞（複数扱い）「ほとんど〜ない」 ○\n(B) other … 形容詞「ほかの」 ×\n(C) someone … 代名詞（単数扱い）「誰か」 ×\n(D) everybody … 代名詞（単数扱い）「誰もが」 ×\n\n■ 完成文\nAlthough few have confirmed their participation in this year's International Jazz Festival, the tickets have already sold out.\n（今年の国際ジャズフェスティバルへの参加を確約した出演者はほとんどいないが、チケットはすでに売り切れている。）\n\n■ 解き方のポイント\nfew は可算名詞を受けて複数扱い。動詞 have が決め手。","words":[{"w":"few","p":"代名詞","m":"ほとんど〜ない"},{"w":"confirmed","p":"動詞（過去分詞）","m":"確約した"},{"w":"participation","p":"名詞","m":"参加"},{"w":"sold out","p":"熟語","m":"売り切れた"}]},{"id":708,"category":"文法模試 セット5（OCR素案）","question":"Michael Hoffman is a venture capitalist who ______ writes opinion columns for local and international newspapers.","A":"frequent","B":"frequently","C":"frequency","D":"frequencies","answer":"B","answer_word":"frequently","explanation":"■ 文の骨格\nMichael Hoffman is a venture capitalist who ______ writes opinion columns for local and international newspapers.\n\n■ 空所に入るもの\n関係代名詞 who と述語動詞 writes の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) frequent … 形容詞「頻繁な」 ×\n(B) frequently … 副詞「頻繁に」 ○\n(C) frequency … 名詞「頻度」 ×\n(D) frequencies … 名詞（複数形）「頻度」 ×\n\n■ 完成文\nMichael Hoffman is a venture capitalist who frequently writes opinion columns for local and international newspapers.\n（Michael Hoffman は、国内外の新聞に頻繁に意見コラムを寄稿するベンチャーキャピタリストだ。）\n\n■ 解き方のポイント\n〈主語（関係詞）＋空所＋動詞〉は副詞の定位置。","words":[{"w":"venture capitalist","p":"名詞","m":"ベンチャーキャピタリスト"},{"w":"frequently","p":"副詞","m":"頻繁に"},{"w":"opinion columns","p":"名詞","m":"意見コラム"}]},{"id":709,"category":"文法模試 セット5（OCR素案）","question":"Emiko Brooks swiftly became the head of a major auction house ______ her lack of art expertise.","A":"even though","B":"instead","C":"furthermore","D":"despite","answer":"D","answer_word":"despite","explanation":"■ 文の骨格\nEmiko Brooks swiftly became the head of a major auction house ______ her lack of art expertise.\n\n■ 空所に入るもの\n空所の後ろが名詞句 her lack of art expertise なので、前置詞が必要。\n→ 空所には「名詞句を導く前置詞」が必要です。\n\n■ 選択肢の確認\n(A) even though … 接続詞（群）「〜だけれども」 ×\n(B) instead … 副詞「その代わりに」 ×\n(C) furthermore … 副詞「さらに」 ×\n(D) despite … 前置詞「〜にもかかわらず」 ○\n\n■ 完成文\nEmiko Brooks swiftly became the head of a major auction house despite her lack of art expertise.\n（Emiko Brooks は美術の専門知識がないにもかかわらず、大手オークションハウスの代表に急速に上り詰めた。）\n\n■ 解き方のポイント\ndespite＋名詞／even though＋節。後ろの形で選ぶ。","words":[{"w":"swiftly","p":"副詞","m":"急速に"},{"w":"auction house","p":"名詞","m":"オークションハウス"},{"w":"despite","p":"前置詞","m":"〜にもかかわらず"},{"w":"expertise","p":"名詞","m":"専門知識"}]},{"id":710,"category":"文法模試 セット5（OCR素案）","question":"PUV Productions is looking into a method for ______ its distribution procedure.","A":"simplify","B":"to simplify","C":"simplifying","D":"simplification","answer":"C","answer_word":"simplifying","explanation":"■ 文の骨格\nPUV Productions is looking into a method for ______ its distribution procedure.\n\n■ 空所に入るもの\n前置詞 for の後ろで、さらに目的語 its distribution procedure を取る形が必要。\n→ 空所には「前置詞 for の目的語になる動名詞」が必要です。\n\n■ 選択肢の確認\n(A) simplify … 動詞（原形）「簡素化する」 ×\n(B) to simplify … 不定詞「簡素化すること」 ×\n(C) simplifying … 動名詞「簡素化すること」 ○\n(D) simplification … 名詞「簡素化」 ×\n\n■ 完成文\nPUV Productions is looking into a method for simplifying its distribution procedure.\n（PUV Productions 社は、流通手順を簡素化する方法を検討している。）\n\n■ 解き方のポイント\n前置詞の後ろで目的語を取るなら動名詞。名詞 simplification では目的語を取れない。","words":[{"w":"looking into","p":"熟語","m":"検討している"},{"w":"method","p":"名詞","m":"方法"},{"w":"simplifying","p":"動名詞","m":"簡素化すること"},{"w":"distribution procedure","p":"名詞","m":"流通手順"}]},{"id":711,"category":"文法模試 セット5（OCR素案）","question":"The Mizuno Auto Company has signed up about 300 of its ______ customers for a program using its newest electric cars.","A":"reside","B":"resided","C":"residence","D":"residential","answer":"D","answer_word":"residential","explanation":"■ 文の骨格\nThe Mizuno Auto Company has signed up about 300 of its ______ customers for a program using its newest electric cars.\n\n■ 空所に入るもの\n所有格 its と名詞 customers の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) reside … 動詞（原形）「居住する」 ×\n(B) resided … 動詞の過去形・過去分詞「居住した」 ×\n(C) residence … 名詞「住居」 ×\n(D) residential … 形容詞「住宅の、個人向けの」 ○\n\n■ 完成文\nThe Mizuno Auto Company has signed up about 300 of its residential customers for a program using its newest electric cars.\n（Mizuno 自動車は、最新の電気自動車を使うプログラムに一般家庭の顧客約300人を登録した。）\n\n■ 解き方のポイント\n〈所有格＋空所＋名詞〉は形容詞。-al は形容詞の目印。","words":[{"w":"signed up","p":"熟語","m":"登録した"},{"w":"residential","p":"形容詞","m":"住宅の、個人向けの"},{"w":"customers","p":"名詞","m":"顧客"},{"w":"electric cars","p":"名詞","m":"電気自動車"}]},{"id":712,"category":"文法模試 セット5（OCR素案）","question":"In determining whether or not to open an office overseas, the board carefully considered the financial ______.","A":"implicate","B":"implicating","C":"implicated","D":"implications","answer":"D","answer_word":"implications","explanation":"■ 文の骨格\nIn determining whether or not to open an office overseas, the board carefully considered the financial ______.\n\n■ 空所に入るもの\n形容詞 financial に修飾され、他動詞 considered の目的語となる名詞が必要。\n→ 空所には「considered の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) implicate … 動詞（原形）「関与させる」 ×\n(B) implicating … 現在分詞・動名詞「関与させること」 ×\n(C) implicated … 動詞の過去形・過去分詞「関与させられた」 ×\n(D) implications … 名詞（複数形）「影響、意味合い」 ○\n\n■ 完成文\nIn determining whether or not to open an office overseas, the board carefully considered the financial implications.\n（海外に事務所を開くかどうかを判断するにあたり、取締役会は財務面への影響を慎重に検討した。）\n\n■ 解き方のポイント\nfinancial implications＝「財務上の影響」。他動詞の目的語は名詞。","words":[{"w":"determining","p":"動名詞","m":"判断すること"},{"w":"overseas","p":"副詞","m":"海外に"},{"w":"financial","p":"形容詞","m":"財務の"},{"w":"implications","p":"名詞","m":"影響、意味合い"}]},{"id":713,"category":"文法模試 セット5（OCR素案）","question":"The airline staff told Mr. Palmer that the flight to Boston would leave ______ gate 15 instead of gate 18.","A":"from","B":"on","C":"until","D":"to","answer":"A","answer_word":"from","explanation":"■ 文の骨格\nThe airline staff told Mr. Palmer that the flight to Boston would leave ______ gate 15 instead of gate 18.\n\n■ 空所に入るもの\nleave の後ろで、出発するゲートを示す前置詞が必要。\n→ 空所には「出発点を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) from … 前置詞「〜から」 ○\n(B) on … 前置詞「〜の上に」 ×\n(C) until … 前置詞「〜まで」 ×\n(D) to … 前置詞「〜へ」 ×\n\n■ 完成文\nThe airline staff told Mr. Palmer that the flight to Boston would leave from gate 15 instead of gate 18.\n（航空会社の職員は Palmer さんに、ボストン行きの便は18番ゲートではなく15番ゲートから出発すると伝えた。）\n\n■ 解き方のポイント\nleave from＋場所＝「〜から出発する」。目的地なら leave for。","words":[{"w":"airline staff","p":"名詞","m":"航空会社の職員"},{"w":"flight","p":"名詞","m":"便"},{"w":"from","p":"前置詞","m":"〜から"},{"w":"gate","p":"名詞","m":"ゲート"}]},{"id":714,"category":"文法模試 セット5（OCR素案）","question":"Ms. Sherman says her new apartment on Central Park South is ______ for her needs.","A":"adequacy","B":"adequateness","C":"adequate","D":"adequately","answer":"C","answer_word":"adequate","explanation":"■ 文の骨格\nMs. Sherman says her new apartment on Central Park South is ______ for her needs.\n\n■ 空所に入るもの\nis の補語が欠けており、for と結びついて意味が通る形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) adequacy … 名詞「適切さ」 ×\n(B) adequateness … 名詞「十分であること」 ×\n(C) adequate … 形容詞「十分な」 ○\n(D) adequately … 副詞「十分に」 ×\n\n■ 完成文\nMs. Sherman says her new apartment on Central Park South is adequate for her needs.\n（Sherman さんは、セントラルパーク南側の新しいアパートは自分の必要に十分だと言っている。）\n\n■ 解き方のポイント\nbe動詞の補語は形容詞。副詞は補語になれない。","words":[{"w":"apartment","p":"名詞","m":"アパート"},{"w":"adequate","p":"形容詞","m":"十分な"},{"w":"needs","p":"名詞","m":"必要、要望"}]},{"id":715,"category":"文法模試 セット5（OCR素案）","question":"______ Ms. Diaz leaves for Hong Kong, she wants to talk with Mr. Evans about the work arrangements during her absence.","A":"Before","B":"Prior","C":"Near","D":"Past","answer":"A","answer_word":"Before","explanation":"■ 文の骨格\n______ Ms. Diaz leaves for Hong Kong, she wants to talk with Mr. Evans about the work arrangements during her absence.\n\n■ 空所に入るもの\n空所の後ろが〈主語＋動詞〉で、時の前後関係を表す接続詞が必要。\n→ 空所には「時を表す接続詞」が必要です。\n\n■ 選択肢の確認\n(A) Before … 接続詞「〜する前に」 ○\n(B) Prior … 形容詞「事前の（to が必要）」 ×\n(C) Near … 前置詞・形容詞「〜の近くに」 ×\n(D) Past … 前置詞「〜を通り過ぎて」 ×\n\n■ 完成文\nBefore Ms. Diaz leaves for Hong Kong, she wants to talk with Mr. Evans about the work arrangements during her absence.\n（香港へ出発する前に、Diaz さんは不在中の業務分担について Evans さんと話したいと考えている。）\n\n■ 解き方のポイント\nprior は prior to の形でのみ前置詞になる。節を導けるのは before。","words":[{"w":"Before","p":"接続詞","m":"〜する前に"},{"w":"leaves for","p":"熟語","m":"〜へ出発する"},{"w":"work arrangements","p":"名詞","m":"業務分担"},{"w":"absence","p":"名詞","m":"不在"}]},{"id":716,"category":"文法模試 セット5（OCR素案）","question":"The company concluded that renovating the existing facilities would be a ______ choice than relocating the business.","A":"wise","B":"more wisely","C":"most wisely","D":"wiser","answer":"D","answer_word":"wiser","explanation":"■ 文の骨格\nThe company concluded that renovating the existing facilities would be a ______ choice than relocating the business.\n\n■ 空所に入るもの\n後ろに than があり、名詞 choice を修飾する比較級の形容詞が必要。\n→ 空所には「than と呼応する比較級の形容詞」が必要です。\n\n■ 選択肢の確認\n(A) wise … 形容詞（原級）「賢明な」 ×\n(B) more wisely … 副詞（比較級）「より賢明に」 ×\n(C) most wisely … 副詞（最上級）「最も賢明に」 ×\n(D) wiser … 形容詞（比較級）「より賢明な」 ○\n\n■ 完成文\nThe company concluded that renovating the existing facilities would be a wiser choice than relocating the business.\n（その会社は、事業を移転するよりも既存施設を改装するほうが賢明な選択だと結論づけた。）\n\n■ 解き方のポイント\nthan があれば比較級。名詞の前なので副詞ではなく形容詞。","words":[{"w":"concluded","p":"動詞（過去形）","m":"結論づけた"},{"w":"renovating","p":"動名詞","m":"改装すること"},{"w":"wiser","p":"比較級","m":"より賢明な"},{"w":"relocating","p":"動名詞","m":"移転すること"}]},{"id":717,"category":"文法模試 セット5（OCR素案）","question":"Tanton City is known for its emphasis on social welfare and a strong ______ to environmental protection.","A":"commit","B":"committing","C":"committed","D":"commitment","answer":"D","answer_word":"commitment","explanation":"■ 文の骨格\nTanton City is known for its emphasis on social welfare and a strong ______ to environmental protection.\n\n■ 空所に入るもの\n冠詞 a と形容詞 strong の後ろで、and で emphasis と並列になる名詞が必要。\n→ 空所には「形容詞に修飾される名詞」が必要です。\n\n■ 選択肢の確認\n(A) commit … 動詞（原形）「委ねる」 ×\n(B) committing … 現在分詞・動名詞「委ねること」 ×\n(C) committed … 動詞の過去形・過去分詞「委ねた、専念した」 ×\n(D) commitment … 名詞「取り組み、献身」 ○\n\n■ 完成文\nTanton City is known for its emphasis on social welfare and a strong commitment to environmental protection.\n（Tanton 市は、社会福祉の重視と環境保護への強い取り組みで知られている。）\n\n■ 解き方のポイント\na strong commitment to X＝「Xへの強い取り組み」。and の前後は同じ品詞。","words":[{"w":"emphasis","p":"名詞","m":"重視"},{"w":"social welfare","p":"名詞","m":"社会福祉"},{"w":"commitment","p":"名詞","m":"取り組み"},{"w":"environmental protection","p":"名詞","m":"環境保護"}]},{"id":718,"category":"文法模試 セット5（OCR素案）","question":"Employees of Sports Plus were astounded that Medalwear Sports Store had plans to build an outlet ______.","A":"near","B":"nearly","C":"nearness","D":"nearby","answer":"D","answer_word":"nearby","explanation":"■ 文の骨格\nEmployees of Sports Plus were astounded that Medalwear Sports Store had plans to build an outlet ______.\n\n■ 空所に入るもの\nbuild an outlet で文の要素が完成しており、場所を表す副詞が入る。\n→ 空所には「場所を表す副詞」が必要です。\n\n■ 選択肢の確認\n(A) near … 前置詞・形容詞「〜の近くに」 ×\n(B) nearly … 副詞「ほとんど」 ×\n(C) nearness … 名詞「近さ」 ×\n(D) nearby … 副詞「すぐ近くに」 ○\n\n■ 完成文\nEmployees of Sports Plus were astounded that Medalwear Sports Store had plans to build an outlet nearby.\n（Sports Plus 社の従業員は、Medalwear Sports Store がすぐ近くに店舗を建てる計画を持っていることに驚いた。）\n\n■ 解き方のポイント\nnear は前置詞で後ろに名詞が必要。単独で副詞になるのは nearby。","words":[{"w":"astounded","p":"形容詞","m":"驚いた"},{"w":"outlet","p":"名詞","m":"店舗"},{"w":"nearby","p":"副詞","m":"すぐ近くに"}]},{"id":719,"category":"文法模試 セット5（OCR素案）","question":"If the company had not merged with Vandelay Enterprises when it did, it ______ such dramatic growth in such a short period of time.","A":"would not have seen","B":"did not see","C":"has not seen","D":"will not see","answer":"A","answer_word":"would not have seen","explanation":"■ 文の骨格\nIf the company had not merged with Vandelay Enterprises when it did, it ______ such dramatic growth in such a short period of time.\n\n■ 空所に入るもの\nIf 節が had not merged（過去完了）なので、帰結節は〈would have＋過去分詞〉になる。\n→ 空所には「仮定法過去完了の帰結節」が必要です。\n\n■ 選択肢の確認\n(A) would not have seen … 仮定法（帰結節）「経験しなかっただろう」 ○\n(B) did not see … 過去形「経験しなかった」 ×\n(C) has not seen … 現在完了形「経験していない」 ×\n(D) will not see … 未来形「経験しないだろう」 ×\n\n■ 完成文\nIf the company had not merged with Vandelay Enterprises when it did, it would not have seen such dramatic growth in such a short period of time.\n（あのとき Vandelay Enterprises 社と合併していなかったら、その会社はこれほど短期間でこれほど劇的な成長を遂げてはいなかっただろう。）\n\n■ 解き方のポイント\n仮定法過去完了：If S had＋過去分詞, S would have＋過去分詞。","words":[{"w":"merged with","p":"熟語","m":"〜と合併した"},{"w":"would not have seen","p":"仮定法","m":"経験しなかっただろう"},{"w":"dramatic","p":"形容詞","m":"劇的な"},{"w":"growth","p":"名詞","m":"成長"}]},{"id":720,"category":"文法模試 セット6（OCR素案）","question":"The effort of workers in the mail department is ______ to that of people working in advertising.","A":"equal","B":"equally","C":"equality","D":"equalize","answer":"A","answer_word":"equal","explanation":"■ 文の骨格\nThe effort of workers in the mail department is ______ to that of people working in advertising.\n\n■ 空所に入るもの\nis の補語が欠けており、to と結びついて意味が通る形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) equal … 形容詞「等しい」 ○\n(B) equally … 副詞「等しく」 ×\n(C) equality … 名詞「平等」 ×\n(D) equalize … 動詞（原形）「等しくする」 ×\n\n■ 完成文\nThe effort of workers in the mail department is equal to that of people working in advertising.\n（郵便部門で働く人たちの努力は、広告部門で働く人たちの努力に匹敵する。）\n\n■ 解き方のポイント\nbe equal to X＝「Xに等しい」。be動詞の補語は形容詞。","words":[{"w":"effort","p":"名詞","m":"努力"},{"w":"mail department","p":"名詞","m":"郵便部門"},{"w":"equal to","p":"熟語","m":"〜に等しい"},{"w":"advertising","p":"名詞","m":"広告"}]},{"id":721,"category":"文法模試 セット6（OCR素案）","question":"One of the top criteria used to rank universities is the ______ of the education, including tuition rates and financial aid options.","A":"afford","B":"affordable","C":"affordably","D":"affordability","answer":"D","answer_word":"affordability","explanation":"■ 文の骨格\nOne of the top criteria used to rank universities is the ______ of the education, including tuition rates and financial aid options.\n\n■ 空所に入るもの\nbe動詞 is の補語で、the と of に挟まれた位置なので名詞が必要。\n→ 空所には「the と of に挟まれた名詞」が必要です。\n\n■ 選択肢の確認\n(A) afford … 動詞（原形）「（金銭的に）余裕がある」 ×\n(B) affordable … 形容詞「手ごろな価格の」 ×\n(C) affordably … 副詞「手ごろな価格で」 ×\n(D) affordability … 名詞「手ごろさ、負担しやすさ」 ○\n\n■ 完成文\nOne of the top criteria used to rank universities is the affordability of the education, including tuition rates and financial aid options.\n（大学を格付けする最重要基準の1つは、授業料や奨学金の選択肢を含めた学費の負担しやすさだ。）\n\n■ 解き方のポイント\n〈the ＿＿ of〉は名詞。-ity は名詞の目印。","words":[{"w":"criteria","p":"名詞","m":"基準"},{"w":"rank","p":"動詞","m":"格付けする"},{"w":"affordability","p":"名詞","m":"負担しやすさ"},{"w":"tuition rates","p":"名詞","m":"授業料"}]},{"id":722,"category":"文法模試 セット6（OCR素案）","question":"Ms. Bruno is now looking for ______ a caterer and a florist for the upcoming annual company banquet.","A":"either","B":"both","C":"whether","D":"never","answer":"B","answer_word":"both","explanation":"■ 文の骨格\nMs. Bruno is now looking for ______ a caterer and a florist for the upcoming annual company banquet.\n\n■ 空所に入るもの\n後ろに and があり、both A and B（AとBの両方）の形になる。\n→ 空所には「and と呼応する相関接続詞」が必要です。\n\n■ 選択肢の確認\n(A) either … 相関接続詞「AかBのどちらか」 ×\n(B) both … 相関接続詞「AとBの両方」 ○\n(C) whether … 接続詞「〜かどうか」 ×\n(D) never … 副詞「決して〜ない」 ×\n\n■ 完成文\nMs. Bruno is now looking for both a caterer and a florist for the upcoming annual company banquet.\n（Bruno さんは現在、来たる年次社内宴会のためにケータリング業者と花屋の両方を探している。）\n\n■ 解き方のポイント\nboth A and B／either A or B。相手役の語で決まる。","words":[{"w":"looking for","p":"熟語","m":"探している"},{"w":"both ... and","p":"相関接続詞","m":"AとBの両方"},{"w":"caterer","p":"名詞","m":"ケータリング業者"},{"w":"florist","p":"名詞","m":"花屋"},{"w":"banquet","p":"名詞","m":"宴会"}]},{"id":723,"category":"文法模試 セット6（OCR素案）","question":"A recent survey showed that 14 percent of respondents feel company management only promotes people who ______ work late.","A":"habit","B":"habitually","C":"habitual","D":"habitation","answer":"B","answer_word":"habitually","explanation":"■ 文の骨格\nA recent survey showed that 14 percent of respondents feel company management only promotes people who ______ work late.\n\n■ 空所に入るもの\n関係代名詞 who と述語動詞 work の間の位置。\n→ 空所には「動詞を修飾する副詞」が必要です。\n\n■ 選択肢の確認\n(A) habit … 名詞「習慣」 ×\n(B) habitually … 副詞「習慣的に」 ○\n(C) habitual … 形容詞「習慣的な」 ×\n(D) habitation … 名詞「住みか、生息地」 ×\n\n■ 完成文\nA recent survey showed that 14 percent of respondents feel company management only promotes people who habitually work late.\n（最近の調査で、回答者の14％が、会社の経営陣は日常的に遅くまで働く人しか昇進させないと感じていることが分かった。）\n\n■ 解き方のポイント\n〈主語（関係詞）＋空所＋動詞〉は副詞の定位置。","words":[{"w":"respondents","p":"名詞","m":"回答者"},{"w":"management","p":"名詞","m":"経営陣"},{"w":"promotes","p":"動詞","m":"昇進させる"},{"w":"habitually","p":"副詞","m":"習慣的に"}]},{"id":724,"category":"文法模試 セット6（OCR素案）","question":"Interns at Harbor Publishing may choose to assist with ongoing research projects, or design one of ______, with an opportunity to publish their results.","A":"they","B":"their","C":"themselves","D":"their own","answer":"D","answer_word":"their own","explanation":"■ 文の骨格\nInterns at Harbor Publishing may choose to assist with ongoing research projects, or design one of ______, with an opportunity to publish their results.\n\n■ 空所に入るもの\none of ______ の形で、「自分たち自身のもの」を表す表現が必要。\n→ 空所には「of の目的語になる〈所有格＋own〉」が必要です。\n\n■ 選択肢の確認\n(A) they … 主格の代名詞「彼らは」 ×\n(B) their … 所有格「彼らの」 ×\n(C) themselves … 再帰代名詞「彼ら自身」 ×\n(D) their own … 所有格＋own「彼ら自身のもの」 ○\n\n■ 完成文\nInterns at Harbor Publishing may choose to assist with ongoing research projects, or design one of their own, with an opportunity to publish their results.\n（Harbor Publishing 社のインターンは、進行中の研究プロジェクトを手伝うか、自分自身の企画を1つ立ち上げるかを選べ、成果を発表する機会もある。）\n\n■ 解き方のポイント\none of one's own＝「自分自身のうちの1つ」。of の後ろに所有代名詞相当の形。","words":[{"w":"Interns","p":"名詞","m":"インターン"},{"w":"ongoing","p":"形容詞","m":"進行中の"},{"w":"their own","p":"所有表現","m":"彼ら自身の"},{"w":"publish","p":"動詞","m":"発表する"}]},{"id":725,"category":"文法模試 セット6（OCR素案）","question":"The retirement party for Mr. Chen will be held at a newly ______ hotel where we held the annual shareholder meeting previously.","A":"renovate","B":"renovating","C":"renovation","D":"renovated","answer":"D","answer_word":"renovated","explanation":"■ 文の骨格\nThe retirement party for Mr. Chen will be held at a newly ______ hotel where we held the annual shareholder meeting previously.\n\n■ 空所に入るもの\n副詞 newly と名詞 hotel の間にあり、受け身の意味で修飾する語が必要。\n→ 空所には「名詞を修飾する過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) renovate … 動詞（原形）「改装する」 ×\n(B) renovating … 現在分詞・動名詞「改装すること」 ×\n(C) renovation … 名詞「改装」 ×\n(D) renovated … 過去分詞「改装された」 ○\n\n■ 完成文\nThe retirement party for Mr. Chen will be held at a newly renovated hotel where we held the annual shareholder meeting previously.\n（Chen さんの退職記念パーティーは、以前に年次株主総会を開いた、新しく改装されたホテルで催される。）\n\n■ 解き方のポイント\n〈副詞＋空所＋名詞〉で受け身の意味なら過去分詞。","words":[{"w":"retirement party","p":"名詞","m":"退職記念パーティー"},{"w":"newly","p":"副詞","m":"新しく"},{"w":"renovated","p":"過去分詞","m":"改装された"},{"w":"shareholder meeting","p":"名詞","m":"株主総会"}]},{"id":726,"category":"文法模試 セット6（OCR素案）","question":"As a successful business person, Mr. O'Neill has been very effective in advising college students about ______ course options to pursue.","A":"that","B":"how","C":"where","D":"which","answer":"D","answer_word":"which","explanation":"■ 文の骨格\nAs a successful business person, Mr. O'Neill has been very effective in advising college students about ______ course options to pursue.\n\n■ 空所に入るもの\n空所の後ろが名詞句 course options で、選択を表す語が必要。\n→ 空所には「名詞を修飾する疑問形容詞」が必要です。\n\n■ 選択肢の確認\n(A) that … 接続詞・関係代名詞「〜ということ」 ×\n(B) how … 疑問副詞「どのように」 ×\n(C) where … 関係副詞「どこで」 ×\n(D) which … 疑問形容詞「どの」 ○\n\n■ 完成文\nAs a successful business person, Mr. O'Neill has been very effective in advising college students about which course options to pursue.\n（成功した実業家として、O'Neill 氏は大学生にどの科目を選ぶべきか助言するうえで大きな成果を上げてきた。）\n\n■ 解き方のポイント\nwhich＋名詞＝「どの〜」。that は名詞を修飾する疑問詞にはならない。","words":[{"w":"effective","p":"形容詞","m":"効果的な"},{"w":"advising","p":"動名詞","m":"助言すること"},{"w":"which","p":"疑問形容詞","m":"どの"},{"w":"pursue","p":"動詞","m":"（学業を）進める"}]},{"id":727,"category":"文法模試 セット6（OCR素案）","question":"One of the programs instituted by the new company director is to assign mentors to ______ to provide access to advice from more experienced employees.","A":"recruit","B":"recruiting","C":"recruits","D":"recruitment","answer":"C","answer_word":"recruits","explanation":"■ 文の骨格\nOne of the programs instituted by the new company director is to assign mentors to ______ to provide access to advice from more experienced employees.\n\n■ 空所に入るもの\nassign X to Y の Y にあたり、メンターがつく相手＝「人」を表す名詞が必要。\n→ 空所には「前置詞 to の目的語になる複数名詞（人）」が必要です。\n\n■ 選択肢の確認\n(A) recruit … 動詞（原形）「採用する」 ×\n(B) recruiting … 現在分詞・動名詞「採用すること」 ×\n(C) recruits … 名詞（複数形・人）「新入社員」 ○\n(D) recruitment … 名詞（不可算）「採用活動」 ×\n\n■ 完成文\nOne of the programs instituted by the new company director is to assign mentors to recruits to provide access to advice from more experienced employees.\n（新しい会社役員が導入したプログラムの1つは、経験豊富な社員から助言を得られるよう、新入社員にメンターを付けることだ。）\n\n■ 解き方のポイント\nrecruit（新人・人）と recruitment（採用活動）の区別。前置詞の後ろは名詞。","words":[{"w":"instituted","p":"動詞（過去分詞）","m":"導入された"},{"w":"assign","p":"動詞","m":"割り当てる"},{"w":"mentors","p":"名詞","m":"メンター、指導役"},{"w":"recruits","p":"名詞","m":"新入社員"}]},{"id":728,"category":"文法模試 セット6（OCR素案）","question":"The staff members at Woodland Hotel are very ______, which makes the guests feel comfortable.","A":"cooperation","B":"cooperators","C":"cooperative","D":"cooperatively","answer":"C","answer_word":"cooperative","explanation":"■ 文の骨格\nThe staff members at Woodland Hotel are very ______, which makes the guests feel comfortable.\n\n■ 空所に入るもの\nare very の後ろで、主語の性質を表す補語が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) cooperation … 名詞「協力」 ×\n(B) cooperators … 名詞（人・複数形）「協力者」 ×\n(C) cooperative … 形容詞「協力的な」 ○\n(D) cooperatively … 副詞「協力して」 ×\n\n■ 完成文\nThe staff members at Woodland Hotel are very cooperative, which makes the guests feel comfortable.\n（Woodland ホテルの職員はとても協力的で、それが宿泊客を心地よくさせている。）\n\n■ 解き方のポイント\nvery は形容詞・副詞を修飾する。be動詞の補語なので形容詞。","words":[{"w":"staff members","p":"名詞","m":"職員"},{"w":"cooperative","p":"形容詞","m":"協力的な"},{"w":"guests","p":"名詞","m":"宿泊客"},{"w":"comfortable","p":"形容詞","m":"心地よい"}]},{"id":729,"category":"文法模試 セット6（OCR素案）","question":"The number of farms in the region has declined by 45 percent ______ the past two decades.","A":"over","B":"by","C":"out","D":"off","answer":"A","answer_word":"over","explanation":"■ 文の骨格\nThe number of farms in the region has declined by 45 percent ______ the past two decades.\n\n■ 空所に入るもの\n現在完了形とともに「〜の間に」という期間を表す前置詞が必要。\n→ 空所には「期間全体を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) over … 前置詞「〜にわたって」 ○\n(B) by … 前置詞「〜だけ（差）」 ×\n(C) out … 副詞「外へ」 ×\n(D) off … 前置詞「〜から離れて」 ×\n\n■ 完成文\nThe number of farms in the region has declined by 45 percent over the past two decades.\n（その地域の農場数は、過去20年で45パーセント減少した。）\n\n■ 解き方のポイント\nover the past ...＝「過去〜にわたって」。現在完了形と相性がよい。","words":[{"w":"farms","p":"名詞","m":"農場"},{"w":"declined","p":"動詞（過去分詞）","m":"減少した"},{"w":"over","p":"前置詞","m":"〜にわたって"},{"w":"decades","p":"名詞","m":"10年間"}]},{"id":730,"category":"文法模試 セット6（OCR素案）","question":"An extremely ______ research project was carried out to assess the environmental impact of the new plant.","A":"costs","B":"costing","C":"costly","D":"cost","answer":"C","answer_word":"costly","explanation":"■ 文の骨格\nAn extremely ______ research project was carried out to assess the environmental impact of the new plant.\n\n■ 空所に入るもの\n副詞 extremely と名詞句 research project の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) costs … 名詞（複数形）「費用」 ×\n(B) costing … 現在分詞・動名詞「費用がかかること」 ×\n(C) costly … 形容詞「費用のかかる」 ○\n(D) cost … 名詞／動詞「費用／費用がかかる」 ×\n\n■ 完成文\nAn extremely costly research project was carried out to assess the environmental impact of the new plant.\n（新工場の環境影響を評価するため、極めて費用のかかる調査事業が実施された。）\n\n■ 解き方のポイント\ncostly は -ly で終わるが形容詞。副詞と間違えやすい語の代表例。","words":[{"w":"extremely","p":"副詞","m":"極めて"},{"w":"costly","p":"形容詞","m":"費用のかかる"},{"w":"carried out","p":"熟語","m":"実施された"},{"w":"assess","p":"動詞","m":"評価する"}]},{"id":731,"category":"文法模試 セット6（OCR素案）","question":"To ease traffic congestion on James River Freeway, a new 300-meter-long tunnel has been ______.","A":"construction","B":"constructing","C":"constructed","D":"construct","answer":"C","answer_word":"constructed","explanation":"■ 文の骨格\nTo ease traffic congestion on James River Freeway, a new 300-meter-long tunnel has been ______.\n\n■ 空所に入るもの\nhas been の後ろで、主語 tunnel は「建設される」側なので過去分詞が必要。\n→ 空所には「現在完了受動態をつくる過去分詞」が必要です。\n\n■ 選択肢の確認\n(A) construction … 名詞「建設」 ×\n(B) constructing … 現在分詞・動名詞「建設すること」 ×\n(C) constructed … 過去分詞「建設された」 ○\n(D) construct … 動詞（原形）「建設する」 ×\n\n■ 完成文\nTo ease traffic congestion on James River Freeway, a new 300-meter-long tunnel has been constructed.\n（James River 高速道路の渋滞を緩和するため、全長300メートルの新しいトンネルが建設された。）\n\n■ 解き方のポイント\n〈has been＋過去分詞〉で現在完了の受動態。","words":[{"w":"ease","p":"動詞","m":"緩和する"},{"w":"traffic congestion","p":"名詞","m":"渋滞"},{"w":"constructed","p":"過去分詞","m":"建設された"},{"w":"tunnel","p":"名詞","m":"トンネル"}]},{"id":732,"category":"文法模試 セット7（OCR素案）","question":"The quarterly results, announced on Wednesday, exceeded ______, and Victoria Department Store raised its yearly sales forecast.","A":"expect","B":"expected","C":"expectations","D":"expectedly","answer":"C","answer_word":"expectations","explanation":"■ 文の骨格\nThe quarterly results, announced on Wednesday, exceeded ______, and Victoria Department Store raised its yearly sales forecast.\n\n■ 空所に入るもの\n他動詞 exceeded の目的語が欠けており、冠詞がないので複数形が必要。\n→ 空所には「exceeded の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) expect … 動詞（原形）「予期する」 ×\n(B) expected … 動詞の過去形・過去分詞「予期された」 ×\n(C) expectations … 名詞（複数形）「予想」 ○\n(D) expectedly … 副詞「予想どおりに」 ×\n\n■ 完成文\nThe quarterly results, announced on Wednesday, exceeded expectations, and Victoria Department Store raised its yearly sales forecast.\n（水曜日に発表された四半期決算は予想を上回り、Victoria 百貨店は通年の売上予測を引き上げた。）\n\n■ 解き方のポイント\nexceed expectations＝「予想を上回る」。他動詞の目的語は名詞。","words":[{"w":"quarterly results","p":"名詞","m":"四半期決算"},{"w":"exceeded","p":"動詞（過去形）","m":"上回った"},{"w":"expectations","p":"名詞","m":"予想"},{"w":"sales forecast","p":"名詞","m":"売上予測"}]},{"id":733,"category":"文法模試 セット7（OCR素案）","question":"It is ______ for employees to eat lunch at their desks on the condition that they only eat during the designated lunch hour.","A":"reliable","B":"capable","C":"acceptable","D":"acceptance","answer":"C","answer_word":"acceptable","explanation":"■ 文の骨格\nIt is ______ for employees to eat lunch at their desks on the condition that they only eat during the designated lunch hour.\n\n■ 空所に入るもの\nIt is ______ for X to do の形で、補語となる形容詞が必要。\n→ 空所には「形式主語構文の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) reliable … 形容詞「信頼できる」 ×\n(B) capable … 形容詞「能力がある（人が主語）」 ×\n(C) acceptable … 形容詞「容認できる」 ○\n(D) acceptance … 名詞「受容」 ×\n\n■ 完成文\nIt is acceptable for employees to eat lunch at their desks on the condition that they only eat during the designated lunch hour.\n（指定された昼休みの時間内に限るという条件で、従業員が自席で昼食をとることは認められている。）\n\n■ 解き方のポイント\nIt is ＿＿ for X to do. の空所は形容詞。capable は人を主語に取る。","words":[{"w":"acceptable","p":"形容詞","m":"容認できる"},{"w":"on the condition that","p":"熟語","m":"〜という条件で"},{"w":"designated","p":"形容詞","m":"指定された"},{"w":"lunch hour","p":"名詞","m":"昼休み"}]},{"id":734,"category":"文法模試 セット7（OCR素案）","question":"When Speednet.com requires a new employee, a significant amount of time is spent identifying and interviewing ______ candidates.","A":"promise","B":"promises","C":"promised","D":"promising","answer":"D","answer_word":"promising","explanation":"■ 文の骨格\nWhen Speednet.com requires a new employee, a significant amount of time is spent identifying and interviewing ______ candidates.\n\n■ 空所に入るもの\n名詞 candidates を修飾する語が必要で、「有望な」という能動の意味になる。\n→ 空所には「名詞を修飾する現在分詞（形容詞化）」が必要です。\n\n■ 選択肢の確認\n(A) promise … 名詞／動詞「約束／約束する」 ×\n(B) promises … 動詞（三人称単数現在形）／名詞（複数形）「約束する／約束」 ×\n(C) promised … 動詞の過去形・過去分詞「約束された」 ×\n(D) promising … 形容詞（現在分詞由来）「有望な」 ○\n\n■ 完成文\nWhen Speednet.com requires a new employee, a significant amount of time is spent identifying and interviewing promising candidates.\n（Speednet.com 社が新しい人材を必要とするとき、有望な候補者の特定と面接に相当な時間が費やされる。）\n\n■ 解き方のポイント\npromising＝「有望な」。現在分詞から形容詞化した語。","words":[{"w":"requires","p":"動詞","m":"必要とする"},{"w":"significant","p":"形容詞","m":"相当な"},{"w":"identifying","p":"動名詞","m":"特定すること"},{"w":"promising","p":"形容詞","m":"有望な"}]},{"id":735,"category":"文法模試 セット7（OCR素案）","question":"Orion Corporation has decided ______ building a new headquarters in Tokyo and will instead expand its existing facilities in Chiba.","A":"against","B":"besides","C":"except","D":"during","answer":"A","answer_word":"against","explanation":"■ 文の骨格\nOrion Corporation has decided ______ building a new headquarters in Tokyo and will instead expand its existing facilities in Chiba.\n\n■ 空所に入るもの\ndecide against doing（〜しないことに決める）という組み合わせになる。\n→ 空所には「decide と結びつく前置詞」が必要です。\n\n■ 選択肢の確認\n(A) against … 前置詞「〜に反対して」 ○\n(B) besides … 前置詞「〜のほかに」 ×\n(C) except … 前置詞「〜を除いて」 ×\n(D) during … 前置詞「〜の間」 ×\n\n■ 完成文\nOrion Corporation has decided against building a new headquarters in Tokyo and will instead expand its existing facilities in Chiba.\n（Orion 社は東京に新本社を建てないことを決め、代わりに千葉の既存施設を拡張する。）\n\n■ 解き方のポイント\ndecide against doing＝「〜しないと決める」。decide to do の反対。","words":[{"w":"decided against","p":"熟語","m":"〜しないと決めた"},{"w":"headquarters","p":"名詞","m":"本社"},{"w":"expand","p":"動詞","m":"拡張する"},{"w":"existing facilities","p":"名詞","m":"既存施設"}]},{"id":736,"category":"文法模試 セット7（OCR素案）","question":"The exact re-opening date of the Leopard Resort depends on the ______ arrival of newly ordered furniture and equipment.","A":"time","B":"timing","C":"timely","D":"timeliness","answer":"C","answer_word":"timely","explanation":"■ 文の骨格\nThe exact re-opening date of the Leopard Resort depends on the ______ arrival of newly ordered furniture and equipment.\n\n■ 空所に入るもの\nthe と名詞 arrival の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) time … 名詞「時間」 ×\n(B) timing … 名詞「タイミング」 ×\n(C) timely … 形容詞「時宜を得た、遅れのない」 ○\n(D) timeliness … 名詞「適時性」 ×\n\n■ 完成文\nThe exact re-opening date of the Leopard Resort depends on the timely arrival of newly ordered furniture and equipment.\n（Leopard Resort の正確な再開日は、新たに注文した家具と備品が遅れずに届くかどうかにかかっている。）\n\n■ 解き方のポイント\ntimely は -ly で終わるが形容詞。名詞の前に置ける。","words":[{"w":"exact","p":"形容詞","m":"正確な"},{"w":"re-opening date","p":"名詞","m":"再開日"},{"w":"timely","p":"形容詞","m":"遅れのない"},{"w":"equipment","p":"名詞","m":"備品"}]},{"id":737,"category":"文法模試 セット7（OCR素案）","question":"In addition to its sleek and modern design, the new laptop from Cool Electronics is highly ______.","A":"economically","B":"economy","C":"economical","D":"economist","answer":"C","answer_word":"economical","explanation":"■ 文の骨格\nIn addition to its sleek and modern design, the new laptop from Cool Electronics is highly ______.\n\n■ 空所に入るもの\nis highly の後ろで、副詞 highly に修飾される補語の形容詞が必要。\n→ 空所には「be動詞の補語になる形容詞」が必要です。\n\n■ 選択肢の確認\n(A) economically … 副詞「経済的に」 ×\n(B) economy … 名詞「経済」 ×\n(C) economical … 形容詞「経済的な、燃費のよい」 ○\n(D) economist … 名詞（人）「経済学者」 ×\n\n■ 完成文\nIn addition to its sleek and modern design, the new laptop from Cool Electronics is highly economical.\n（洗練された現代的なデザインに加えて、Cool Electronics 社の新しいノートパソコンは非常に経済的だ。）\n\n■ 解き方のポイント\nbe動詞の補語は形容詞。economic（経済の）と economical（節約になる）の違いも重要。","words":[{"w":"sleek","p":"形容詞","m":"洗練された"},{"w":"laptop","p":"名詞","m":"ノートパソコン"},{"w":"highly","p":"副詞","m":"非常に"},{"w":"economical","p":"形容詞","m":"経済的な"}]},{"id":738,"category":"文法模試 セット7（OCR素案）","question":"When choosing a new president, the bank decided to promote from ______ the company, instead of hiring from outside.","A":"onto","B":"within","C":"toward","D":"above","answer":"B","answer_word":"within","explanation":"■ 文の骨格\nWhen choosing a new president, the bank decided to promote from ______ the company, instead of hiring from outside.\n\n■ 空所に入るもの\noutside と対比され、「〜の内部から」を表す前置詞が必要。\n→ 空所には「内部を表す前置詞」が必要です。\n\n■ 選択肢の確認\n(A) onto … 前置詞「〜の上へ」 ×\n(B) within … 前置詞「〜の内部で」 ○\n(C) toward … 前置詞「〜の方へ」 ×\n(D) above … 前置詞「〜の上に」 ×\n\n■ 完成文\nWhen choosing a new president, the bank decided to promote from within the company, instead of hiring from outside.\n（新しい頭取を選ぶ際、その銀行は外部から採用せず、社内から昇進させることに決めた。）\n\n■ 解き方のポイント\npromote from within＝「内部登用する」。outside との対比が手がかり。","words":[{"w":"promote","p":"動詞","m":"昇進させる"},{"w":"within","p":"前置詞","m":"〜の内部で"},{"w":"instead of","p":"熟語","m":"〜の代わりに"},{"w":"hiring","p":"動名詞","m":"採用すること"}]},{"id":739,"category":"文法模試 セット7（OCR素案）","question":"Dr. Cornelia Turner informed the program coordinator that she was ______ to accept the invitation to address the students on graduation day.","A":"please","B":"pleased","C":"pleasing","D":"pleasure","answer":"B","answer_word":"pleased","explanation":"■ 文の骨格\nDr. Cornelia Turner informed the program coordinator that she was ______ to accept the invitation to address the students on graduation day.\n\n■ 空所に入るもの\n主語が人で感情を受ける側なので、-ed 形の分詞形容詞が必要。\n→ 空所には「be動詞の補語になる過去分詞（形容詞化）」が必要です。\n\n■ 選択肢の確認\n(A) please … 動詞（原形）「喜ばせる」 ×\n(B) pleased … 過去分詞・形容詞「喜んでいる」 ○\n(C) pleasing … 現在分詞・形容詞「喜ばせるような」 ×\n(D) pleasure … 名詞「喜び」 ×\n\n■ 完成文\nDr. Cornelia Turner informed the program coordinator that she was pleased to accept the invitation to address the students on graduation day.\n（Cornelia Turner 博士はプログラム調整役に、卒業式で学生に向けて講演する招待を喜んでお受けすると伝えた。）\n\n■ 解き方のポイント\nbe pleased to do＝「喜んで〜する」。人が主語なら -ed 形。","words":[{"w":"informed","p":"動詞（過去形）","m":"伝えた"},{"w":"coordinator","p":"名詞","m":"調整役"},{"w":"pleased","p":"形容詞","m":"喜んでいる"},{"w":"address","p":"動詞","m":"講演する"}]},{"id":740,"category":"文法模試 セット7（OCR素案）","question":"Arrow Airways ______ the profit increase to higher ticket prices and a return in travel demand.","A":"attributed","B":"attributing","C":"attribute","D":"attributes","answer":"A","answer_word":"attributed","explanation":"■ 文の骨格\nArrow Airways ______ the profit increase to higher ticket prices and a return in travel demand.\n\n■ 空所に入るもの\n主語 Arrow Airways の述語動詞が必要で、attribute X to Y の形をつくる。\n→ 空所には「過去形の他動詞」が必要です。\n\n■ 選択肢の確認\n(A) attributed … 動詞（過去形）「（原因を）〜に帰した」 ○\n(B) attributing … 現在分詞・動名詞「帰すること」 ×\n(C) attribute … 動詞（原形）「帰する」 ×\n(D) attributes … 名詞（複数形）「属性」 ×\n\n■ 完成文\nArrow Airways attributed the profit increase to higher ticket prices and a return in travel demand.\n（Arrow 航空は、利益増加の要因をチケット価格の上昇と旅行需要の回復にあるとした。）\n\n■ 解き方のポイント\nattribute X to Y＝「XをYのおかげ・せいにする」。to とセットで覚える。","words":[{"w":"attributed","p":"動詞（過去形）","m":"〜に帰した"},{"w":"profit increase","p":"名詞","m":"利益増加"},{"w":"ticket prices","p":"名詞","m":"チケット価格"},{"w":"travel demand","p":"名詞","m":"旅行需要"}]},{"id":741,"category":"文法模試 セット7（OCR素案）","question":"Hassan Engineering hopes to make partnerships with the contractors ______ than they have been to maintain its competitive pricing strategy.","A":"stronger","B":"strongest","C":"more strongly","D":"most strongly","answer":"A","answer_word":"stronger","explanation":"■ 文の骨格\nHassan Engineering hopes to make partnerships with the contractors ______ than they have been to maintain its competitive pricing strategy.\n\n■ 空所に入るもの\n後ろに than があり、make O C の C にあたる補語の比較級が必要。\n→ 空所には「than と呼応する比較級の形容詞」が必要です。\n\n■ 選択肢の確認\n(A) stronger … 形容詞（比較級）「より強固な」 ○\n(B) strongest … 形容詞（最上級）「最も強固な」 ×\n(C) more strongly … 副詞（比較級）「より強く」 ×\n(D) most strongly … 副詞（最上級）「最も強く」 ×\n\n■ 完成文\nHassan Engineering hopes to make partnerships with the contractors stronger than they have been to maintain its competitive pricing strategy.\n（Hassan Engineering 社は、競争力ある価格戦略を維持するため、これまでよりも強固な提携関係を請負業者と築きたいと考えている。）\n\n■ 解き方のポイント\nthan があれば比較級。make O C の C は形容詞。","words":[{"w":"partnerships","p":"名詞","m":"提携関係"},{"w":"contractors","p":"名詞","m":"請負業者"},{"w":"stronger","p":"比較級","m":"より強固な"},{"w":"pricing strategy","p":"名詞","m":"価格戦略"}]},{"id":742,"category":"文法模試 セット7（OCR素案）","question":"Mr. Reed was surprised at the ______ attendees at his business seminar.","A":"enthusiast","B":"enthusiasm","C":"enthusiastic","D":"enthusiastically","answer":"C","answer_word":"enthusiastic","explanation":"■ 文の骨格\nMr. Reed was surprised at the ______ attendees at his business seminar.\n\n■ 空所に入るもの\nthe と名詞 attendees の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) enthusiast … 名詞（人）「愛好家」 ×\n(B) enthusiasm … 名詞「熱意」 ×\n(C) enthusiastic … 形容詞「熱心な」 ○\n(D) enthusiastically … 副詞「熱心に」 ×\n\n■ 完成文\nMr. Reed was surprised at the enthusiastic attendees at his business seminar.\n（Reed さんは、自分のビジネスセミナーに集まった熱心な参加者に驚いた。）\n\n■ 解き方のポイント\n〈the＋空所＋名詞〉は形容詞。","words":[{"w":"surprised at","p":"熟語","m":"〜に驚いた"},{"w":"enthusiastic","p":"形容詞","m":"熱心な"},{"w":"attendees","p":"名詞","m":"参加者"}]},{"id":743,"category":"文法模試 セット7（OCR素案）","question":"Stronger customer demand has triggered several auto manufacturers to develop hybrid vehicles that are ______ powerful and fuel-efficient.","A":"as","B":"both","C":"neither","D":"not only","answer":"B","answer_word":"both","explanation":"■ 文の骨格\nStronger customer demand has triggered several auto manufacturers to develop hybrid vehicles that are ______ powerful and fuel-efficient.\n\n■ 空所に入るもの\n後ろに and があり、both A and B（AでもBでもある）の形になる。\n→ 空所には「and と呼応する相関接続詞」が必要です。\n\n■ 選択肢の確認\n(A) as … 接続詞・前置詞「〜として」 ×\n(B) both … 相関接続詞「AとBの両方」 ○\n(C) neither … 相関接続詞「AでもBでもない」 ×\n(D) not only … 相関表現「〜だけでなく」 ×\n\n■ 完成文\nStronger customer demand has triggered several auto manufacturers to develop hybrid vehicles that are both powerful and fuel-efficient.\n（顧客需要の高まりにより、いくつかの自動車メーカーはパワーと燃費の両方を備えたハイブリッド車の開発に乗り出した。）\n\n■ 解き方のポイント\nboth A and B。not only なら but also が続く。","words":[{"w":"demand","p":"名詞","m":"需要"},{"w":"triggered","p":"動詞（過去分詞）","m":"きっかけとなった"},{"w":"both ... and","p":"相関接続詞","m":"AとBの両方"},{"w":"fuel-efficient","p":"形容詞","m":"燃費のよい"}]},{"id":744,"category":"文法模試 セット7（OCR素案）","question":"Gooday Electronics recently hired Benjamin Fischer, an ______ in mobile phone technology.","A":"expert","B":"expertise","C":"expertize","D":"expertly skilled","answer":"A","answer_word":"expert","explanation":"■ 文の骨格\nGooday Electronics recently hired Benjamin Fischer, an ______ in mobile phone technology.\n\n■ 空所に入るもの\n人名 Benjamin Fischer と同格になる位置なので、「人」を表す名詞が必要。\n→ 空所には「人を表す名詞」が必要です。\n\n■ 選択肢の確認\n(A) expert … 名詞（人）「専門家」 ○\n(B) expertise … 名詞（不可算）「専門知識」 ×\n(C) expertize … 動詞（原形）「専門化する」 ×\n(D) expertly skilled … 形容詞「熟練した」 ×\n\n■ 完成文\nGooday Electronics recently hired Benjamin Fischer, an expert in mobile phone technology.\n（Gooday Electronics 社は最近、携帯電話技術の専門家である Benjamin Fischer 氏を採用した。）\n\n■ 解き方のポイント\nexpert（人）と expertise（専門知識）の区別。人名と同格なら人。","words":[{"w":"hired","p":"動詞（過去形）","m":"採用した"},{"w":"expert","p":"名詞","m":"専門家"},{"w":"mobile phone technology","p":"名詞","m":"携帯電話技術"}]},{"id":745,"category":"文法模試 セット8（OCR素案）","question":"Attendance at County Stadium ______ at 50,000 on October 8, when the Osaka Panthers defended the Pacific Championship title.","A":"enlarged","B":"attained","C":"peaked","D":"reached","answer":"C","answer_word":"peaked","explanation":"■ 文の骨格\nAttendance at County Stadium ______ at 50,000 on October 8, when the Osaka Panthers defended the Pacific Championship title.\n\n■ 空所に入るもの\n後ろに at＋数値があるので、「〜でピークに達する」を表す自動詞が必要。\n→ 空所には「at と結びつく自動詞」が必要です。\n\n■ 選択肢の確認\n(A) enlarged … 動詞（過去形）「拡大した」 ×\n(B) attained … 動詞（過去形）「達成した（他動詞）」 ×\n(C) peaked … 動詞（過去形）「ピークに達した」 ○\n(D) reached … 動詞（過去形）「到達した（他動詞）」 ×\n\n■ 完成文\nAttendance at County Stadium peaked at 50,000 on October 8, when the Osaka Panthers defended the Pacific Championship title.\n（10月8日、大阪パンサーズが太平洋選手権のタイトルを防衛した日、County スタジアムの入場者数は5万人でピークに達した。）\n\n■ 解き方のポイント\npeak at＋数値＝「〜でピークに達する」。reach／attain は他動詞で at を取らない。","words":[{"w":"Attendance","p":"名詞","m":"入場者数"},{"w":"peaked at","p":"熟語","m":"〜でピークに達した"},{"w":"defended","p":"動詞（過去形）","m":"防衛した"},{"w":"title","p":"名詞","m":"タイトル"}]},{"id":746,"category":"文法模試 セット8（OCR素案）","question":"Most of the vehicles our customers use are not ______ but cars and trucks rented from a rental company.","A":"they","B":"their","C":"them","D":"theirs","answer":"D","answer_word":"theirs","explanation":"■ 文の骨格\nMost of the vehicles our customers use are not ______ but cars and trucks rented from a rental company.\n\n■ 空所に入るもの\n「彼ら自身のもの」を表し、後ろの but 以下と対比される語が必要。\n→ 空所には「be動詞の補語になる所有代名詞」が必要です。\n\n■ 選択肢の確認\n(A) they … 主格の代名詞「彼らは」 ×\n(B) their … 所有格「彼らの」 ×\n(C) them … 目的格の代名詞「彼らを」 ×\n(D) theirs … 所有代名詞「彼ら自身のもの」 ○\n\n■ 完成文\nMost of the vehicles our customers use are not theirs but cars and trucks rented from a rental company.\n（当社の顧客が使う車両の大半は自社所有ではなく、レンタル会社から借りた乗用車やトラックだ。）\n\n■ 解き方のポイント\n所有代名詞は〈所有格＋名詞〉を1語で表す。be動詞の補語になれる。","words":[{"w":"vehicles","p":"名詞","m":"車両"},{"w":"theirs","p":"所有代名詞","m":"彼ら自身のもの"},{"w":"rented","p":"過去分詞","m":"借りられた"},{"w":"rental company","p":"名詞","m":"レンタル会社"}]},{"id":747,"category":"文法模試 セット8（OCR素案）","question":"Alpha Taxi plans to relocate since the current ______ does not have sufficient room to accommodate the growing number of vehicles it operates.","A":"locate","B":"located","C":"locates","D":"location","answer":"D","answer_word":"location","explanation":"■ 文の骨格\nAlpha Taxi plans to relocate since the current ______ does not have sufficient room to accommodate the growing number of vehicles it operates.\n\n■ 空所に入るもの\nthe current の後ろで、述語動詞 does not have の主語となる名詞が必要。\n→ 空所には「文の主語になる名詞」が必要です。\n\n■ 選択肢の確認\n(A) locate … 動詞（原形）「位置を特定する」 ×\n(B) located … 動詞の過去形・過去分詞「位置している」 ×\n(C) locates … 動詞（三人称単数現在形）「位置を特定する」 ×\n(D) location … 名詞「所在地」 ○\n\n■ 完成文\nAlpha Taxi plans to relocate since the current location does not have sufficient room to accommodate the growing number of vehicles it operates.\n（運行台数が増えているのに現在の所在地では収容スペースが足りないため、Alpha Taxi 社は移転を計画している。）\n\n■ 解き方のポイント\n〈the＋形容詞＋空所〉は名詞。-tion は名詞の目印。","words":[{"w":"relocate","p":"動詞","m":"移転する"},{"w":"location","p":"名詞","m":"所在地"},{"w":"sufficient","p":"形容詞","m":"十分な"},{"w":"accommodate","p":"動詞","m":"収容する"}]},{"id":748,"category":"文法模試 セット8（OCR素案）","question":"The Web site contains ______ reviews of classic movies as well as the latest movies and documentaries.","A":"count","B":"countless","C":"countlessly","D":"counts","answer":"B","answer_word":"countless","explanation":"■ 文の骨格\nThe Web site contains ______ reviews of classic movies as well as the latest movies and documentaries.\n\n■ 空所に入るもの\n他動詞 contains の目的語 reviews を修飾する語が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) count … 動詞（原形）／名詞「数える／伯爵」 ×\n(B) countless … 形容詞「数え切れないほどの」 ○\n(C) countlessly … 副詞「数え切れないほどに」 ×\n(D) counts … 動詞（三人称単数現在形）／名詞（複数形）「数える／数」 ×\n\n■ 完成文\nThe Web site contains countless reviews of classic movies as well as the latest movies and documentaries.\n（そのウェブサイトには、最新の映画やドキュメンタリーに加えて、名作映画のレビューが数え切れないほど載っている。）\n\n■ 解き方のポイント\n名詞の直前は形容詞。-less は「〜がない」を表す形容詞の語尾。","words":[{"w":"contains","p":"動詞","m":"含む"},{"w":"countless","p":"形容詞","m":"数え切れないほどの"},{"w":"reviews","p":"名詞","m":"レビュー、批評"},{"w":"documentaries","p":"名詞","m":"ドキュメンタリー"}]},{"id":749,"category":"文法模試 セット8（OCR素案）","question":"EG Equipment provides customers with the highest quality materials, competitive prices, and ______ service.","A":"depend","B":"depending","C":"dependable","D":"dependably","answer":"C","answer_word":"dependable","explanation":"■ 文の骨格\nEG Equipment provides customers with the highest quality materials, competitive prices, and ______ service.\n\n■ 空所に入るもの\n名詞 service を修飾し、前の2つの名詞句と並列になる形容詞が必要。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) depend … 動詞（原形）「頼る」 ×\n(B) depending … 現在分詞・動名詞「頼ること」 ×\n(C) dependable … 形容詞「信頼できる」 ○\n(D) dependably … 副詞「確実に」 ×\n\n■ 完成文\nEG Equipment provides customers with the highest quality materials, competitive prices, and dependable service.\n（EG Equipment 社は、最高品質の資材、競争力のある価格、そして信頼できるサービスを顧客に提供している。）\n\n■ 解き方のポイント\nA, B, and C の並列。前2つが〈形容詞＋名詞〉なので3つ目も同じ形。","words":[{"w":"provides","p":"動詞","m":"提供する"},{"w":"materials","p":"名詞","m":"資材"},{"w":"competitive prices","p":"名詞","m":"競争力のある価格"},{"w":"dependable","p":"形容詞","m":"信頼できる"}]},{"id":750,"category":"文法模試 セット8（OCR素案）","question":"Construction of the new city museum will begin shortly after the contractor ______ by the city council.","A":"has been authorized","B":"has authorized","C":"will authorize","D":"authorized","answer":"A","answer_word":"has been authorized","explanation":"■ 文の骨格\nConstruction of the new city museum will begin shortly after the contractor ______ by the city council.\n\n■ 空所に入るもの\n主語 the contractor は「認可される」側なので受動態が必要。時の副詞節では現在完了で未来を表す。\n→ 空所には「受動態の述語動詞」が必要です。\n\n■ 選択肢の確認\n(A) has been authorized … 現在完了受動態「認可されたら」 ○\n(B) has authorized … 現在完了形（能動）「認可した」 ×\n(C) will authorize … 未来形（能動）「認可するだろう」 ×\n(D) authorized … 動詞（過去形・能動）「認可した」 ×\n\n■ 完成文\nConstruction of the new city museum will begin shortly after the contractor has been authorized by the city council.\n（請負業者が市議会に承認されたらすぐに、新しい市立博物館の建設が始まる。）\n\n■ 解き方のポイント\n時・条件の副詞節では未来のことも現在形・現在完了形で表す。by があるので受動態。","words":[{"w":"Construction","p":"名詞","m":"建設"},{"w":"shortly after","p":"熟語","m":"〜のすぐあとに"},{"w":"contractor","p":"名詞","m":"請負業者"},{"w":"has been authorized","p":"現在完了受動態","m":"認可された"}]},{"id":751,"category":"文法模試 セット8（OCR素案）","question":"Passengers should be aware that Orange Airlines has strict size and weight ______ for checked and carry-on luggage.","A":"limits","B":"limited","C":"limit","D":"limitation","answer":"A","answer_word":"limits","explanation":"■ 文の骨格\nPassengers should be aware that Orange Airlines has strict size and weight ______ for checked and carry-on luggage.\n\n■ 空所に入るもの\nsize and weight と複合名詞をつくり、他動詞 has の目的語となる名詞が必要。\n→ 空所には「has の目的語になる複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) limits … 名詞（複数形）「制限」 ○\n(B) limited … 形容詞「限られた」 ×\n(C) limit … 動詞（三人称単数現在形）「制限する」 ×\n(D) limitation … 名詞「制限（すること）」 ×\n\n■ 完成文\nPassengers should be aware that Orange Airlines has strict size and weight limits for checked and carry-on luggage.\n（乗客は、Orange 航空が預け入れ荷物と機内持ち込み荷物に厳しいサイズと重量の制限を設けていることに留意すべきだ。）\n\n■ 解き方のポイント\nsize and weight limits＝「サイズと重量の制限」。名詞＋名詞の複合名詞。","words":[{"w":"Passengers","p":"名詞","m":"乗客"},{"w":"strict","p":"形容詞","m":"厳しい"},{"w":"limits","p":"名詞","m":"制限"},{"w":"carry-on luggage","p":"名詞","m":"機内持ち込み荷物"}]},{"id":752,"category":"文法模試 セット8（OCR素案）","question":"Golden Babylonia can translate Arabic into English ______ than any other software on the market.","A":"accurately","B":"accurate","C":"more accurately","D":"more accurate","answer":"C","answer_word":"more accurately","explanation":"■ 文の骨格\nGolden Babylonia can translate Arabic into English ______ than any other software on the market.\n\n■ 空所に入るもの\ntranslate Arabic into English で文の要素が完成しており、than を伴う比較級の副詞が必要。\n→ 空所には「than と呼応する副詞の比較級」が必要です。\n\n■ 選択肢の確認\n(A) accurately … 副詞「正確に」 ×\n(B) accurate … 形容詞「正確な」 ×\n(C) more accurately … 副詞（比較級）「より正確に」 ○\n(D) more accurate … 形容詞（比較級）「より正確な」 ×\n\n■ 完成文\nGolden Babylonia can translate Arabic into English more accurately than any other software on the market.\n（Golden Babylonia は、市場にあるほかのどのソフトよりも正確にアラビア語を英語へ翻訳できる。）\n\n■ 解き方のポイント\nthan があるので比較級。SVO が完成しているので副詞。","words":[{"w":"translate","p":"動詞","m":"翻訳する"},{"w":"more accurately","p":"副詞（比較級）","m":"より正確に"},{"w":"any other","p":"熟語","m":"ほかのどの"},{"w":"on the market","p":"熟語","m":"市場に出ている"}]},{"id":753,"category":"文法模試 セット8（OCR素案）","question":"______ interested in attending the seminar should register early because there is a limited number of seats.","A":"Whoever","B":"Anyone","C":"Other","D":"Whom","answer":"B","answer_word":"Anyone","explanation":"■ 文の骨格\n______ interested in attending the seminar should register early because there is a limited number of seats.\n\n■ 空所に入るもの\n述語動詞 should register の主語で、後ろの形容詞句 interested in ... に修飾される代名詞が必要。\n→ 空所には「形容詞句に修飾される単数扱いの代名詞」が必要です。\n\n■ 選択肢の確認\n(A) Whoever … 複合関係代名詞「〜する人は誰でも」 ×\n(B) Anyone … 代名詞（単数扱い）「誰でも」 ○\n(C) Other … 形容詞「ほかの」 ×\n(D) Whom … 関係代名詞（目的格）「〜する人を」 ×\n\n■ 完成文\nAnyone interested in attending the seminar should register early because there is a limited number of seats.\n（座席数に限りがあるため、セミナーへの参加に関心のある方は早めに登録してください。）\n\n■ 解き方のポイント\nanyone interested in ...＝「〜に関心のある人は誰でも」。Whoever なら後ろに動詞が必要。","words":[{"w":"Anyone","p":"代名詞","m":"誰でも"},{"w":"interested in","p":"熟語","m":"〜に関心のある"},{"w":"register","p":"動詞","m":"登録する"},{"w":"limited","p":"形容詞","m":"限られた"}]},{"id":754,"category":"文法模試 セット8（OCR素案）","question":"Since Jack Taylor had outstanding professional ______, the manager immediately decided to interview him.","A":"experience","B":"experiences","C":"experienced","D":"experiencing","answer":"A","answer_word":"experience","explanation":"■ 文の骨格\nSince Jack Taylor had outstanding professional ______, the manager immediately decided to interview him.\n\n■ 空所に入るもの\n形容詞 professional に修飾され、他動詞 had の目的語となる名詞が必要。\n→ 空所には「had の目的語になる不可算名詞」が必要です。\n\n■ 選択肢の確認\n(A) experience … 名詞（不可算）「経験」 ○\n(B) experiences … 名詞（複数形）「体験」 ×\n(C) experienced … 過去分詞・形容詞「経験豊富な」 ×\n(D) experiencing … 現在分詞・動名詞「経験すること」 ×\n\n■ 完成文\nSince Jack Taylor had outstanding professional experience, the manager immediately decided to interview him.\n（Jack Taylor には卓越した職務経験があったため、部長はすぐに面接することを決めた。）\n\n■ 解き方のポイント\nexperience は「経験」なら不可算、「体験（出来事）」なら可算。ここは不可算。","words":[{"w":"outstanding","p":"形容詞","m":"卓越した"},{"w":"professional experience","p":"名詞","m":"職務経験"},{"w":"immediately","p":"副詞","m":"すぐに"},{"w":"interview","p":"動詞","m":"面接する"}]},{"id":755,"category":"文法模試 セット8（OCR素案）","question":"Green Airways recommends that passengers arrive at the airport no later than two hours ______ the scheduled departure time.","A":"previously","B":"advanced","C":"prior to","D":"in addition to","answer":"C","answer_word":"prior to","explanation":"■ 文の骨格\nGreen Airways recommends that passengers arrive at the airport no later than two hours ______ the scheduled departure time.\n\n■ 空所に入るもの\n空所の後ろが名詞句 the scheduled departure time なので、前置詞が必要。\n→ 空所には「名詞句を導く群前置詞」が必要です。\n\n■ 選択肢の確認\n(A) previously … 副詞「以前に」 ×\n(B) advanced … 過去分詞・形容詞「高度な」 ×\n(C) prior to … 群前置詞「〜より前に」 ○\n(D) in addition to … 群前置詞「〜に加えて」 ×\n\n■ 完成文\nGreen Airways recommends that passengers arrive at the airport no later than two hours prior to the scheduled departure time.\n（Green 航空は、乗客が定刻の出発時刻の遅くとも2時間前までに空港へ到着することを推奨している。）\n\n■ 解き方のポイント\nprior to＋名詞。previously は副詞で名詞を取れない。","words":[{"w":"recommends","p":"動詞","m":"推奨する"},{"w":"no later than","p":"熟語","m":"遅くとも〜までに"},{"w":"prior to","p":"熟語","m":"〜より前に"},{"w":"departure time","p":"名詞","m":"出発時刻"}]},{"id":756,"category":"文法模試 セット8（OCR素案）","question":"Please direct any concerns or questions to veterinary staff so we can help ______ a plan to keep your pets healthy.","A":"develop","B":"develops","C":"developed","D":"developing","answer":"A","answer_word":"develop","explanation":"■ 文の骨格\nPlease direct any concerns or questions to veterinary staff so we can help ______ a plan to keep your pets healthy.\n\n■ 空所に入るもの\nhelp (to) do の形で、help の後ろは原形または to 不定詞になる。\n→ 空所には「help に続く動詞の原形」が必要です。\n\n■ 選択肢の確認\n(A) develop … 動詞（原形）「策定する」 ○\n(B) develops … 動詞（三人称単数現在形）「策定する」 ×\n(C) developed … 動詞の過去形・過去分詞「策定された」 ×\n(D) developing … 現在分詞・動名詞「策定すること」 ×\n\n■ 完成文\nPlease direct any concerns or questions to veterinary staff so we can help develop a plan to keep your pets healthy.\n（ペットの健康を保つ計画づくりをお手伝いできるよう、ご不安やご質問は獣医スタッフまでお寄せください。）\n\n■ 解き方のポイント\nhelp＋(to) do。原形不定詞を取る動詞。","words":[{"w":"direct","p":"動詞","m":"向ける"},{"w":"concerns","p":"名詞","m":"不安、懸念"},{"w":"veterinary staff","p":"名詞","m":"獣医スタッフ"},{"w":"develop","p":"動詞","m":"策定する"}]},{"id":757,"category":"文法模試 セット8（OCR素案）","question":"At Coral Reef Hotel, special meals are available upon request for ______ with dietary restrictions.","A":"them","B":"those","C":"which","D":"whose","answer":"B","answer_word":"those","explanation":"■ 文の骨格\nAt Coral Reef Hotel, special meals are available upon request for ______ with dietary restrictions.\n\n■ 空所に入るもの\n前置詞 for の目的語で、後ろの with 句に修飾される「人々」を表す代名詞が必要。\n→ 空所には「前置詞句に修飾される代名詞」が必要です。\n\n■ 選択肢の確認\n(A) them … 目的格の代名詞「彼らを」 ×\n(B) those … 代名詞「〜する人々」 ○\n(C) which … 関係代名詞「どちら」 ×\n(D) whose … 関係代名詞（所有格）「その〜が」 ×\n\n■ 完成文\nAt Coral Reef Hotel, special meals are available upon request for those with dietary restrictions.\n（Coral Reef ホテルでは、食事制限のある方にはご要望に応じて特別食をご用意しています。）\n\n■ 解き方のポイント\nthose with ...／those who ...＝「〜な人々」。them は後ろから修飾できない。","words":[{"w":"special meals","p":"名詞","m":"特別食"},{"w":"upon request","p":"熟語","m":"要望に応じて"},{"w":"those","p":"代名詞","m":"〜する人々"},{"w":"dietary restrictions","p":"名詞","m":"食事制限"}]},{"id":758,"category":"文法模試 セット8（OCR素案）","question":"Mr. Dubois turned the company around by utilizing customer feedback in a highly ______ manner.","A":"effect","B":"effective","C":"effectiveness","D":"effectively","answer":"B","answer_word":"effective","explanation":"■ 文の骨格\nMr. Dubois turned the company around by utilizing customer feedback in a highly ______ manner.\n\n■ 空所に入るもの\n副詞 highly と名詞 manner の間にあり、名詞を修飾する位置。\n→ 空所には「名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) effect … 名詞「効果」 ×\n(B) effective … 形容詞「効果的な」 ○\n(C) effectiveness … 名詞「有効性」 ×\n(D) effectively … 副詞「効果的に」 ×\n\n■ 完成文\nMr. Dubois turned the company around by utilizing customer feedback in a highly effective manner.\n（Dubois 氏は、顧客の声を非常に効果的な方法で活用することで会社を立て直した。）\n\n■ 解き方のポイント\nin a ... manner＝「〜な方法で」。manner の前は形容詞。","words":[{"w":"turned around","p":"熟語","m":"立て直した"},{"w":"utilizing","p":"動名詞","m":"活用すること"},{"w":"effective","p":"形容詞","m":"効果的な"},{"w":"manner","p":"名詞","m":"方法"}]},{"id":759,"category":"文法模試 セット8（OCR素案）","question":"______ shopping for a mobile phone, customers tend to be drawn to the coolest design and the latest technology.","A":"Until","B":"Since","C":"Then","D":"When","answer":"D","answer_word":"When","explanation":"■ 文の骨格\n______ shopping for a mobile phone, customers tend to be drawn to the coolest design and the latest technology.\n\n■ 空所に入るもの\nwhen (they are) shopping のように〈主語＋be動詞〉を省略できる接続詞が必要。\n→ 空所には「分詞を伴える接続詞」が必要です。\n\n■ 選択肢の確認\n(A) Until … 接続詞・前置詞「〜まで」 ×\n(B) Since … 接続詞「〜なので」 ×\n(C) Then … 副詞「そのとき」 ×\n(D) When … 接続詞「〜するとき」 ○\n\n■ 完成文\nWhen shopping for a mobile phone, customers tend to be drawn to the coolest design and the latest technology.\n（携帯電話を買うとき、顧客は最も格好いいデザインと最新の技術に引かれる傾向がある。）\n\n■ 解き方のポイント\nwhen doing の形は〈主語＋be動詞〉の省略。副詞 then は節をつなげない。","words":[{"w":"shopping for","p":"熟語","m":"〜を買い求めること"},{"w":"tend to","p":"熟語","m":"〜する傾向がある"},{"w":"drawn to","p":"熟語","m":"〜に引かれる"},{"w":"latest","p":"最上級","m":"最新の"}]},{"id":760,"category":"文法模試 セット8（OCR素案）","question":"The store manager was concerned that his store did not have ______ products to meet customer demand.","A":"much","B":"enough","C":"every","D":"almost","answer":"B","answer_word":"enough","explanation":"■ 文の骨格\nThe store manager was concerned that his store did not have ______ products to meet customer demand.\n\n■ 空所に入るもの\n直後が複数名詞 products で、「十分な」を表す語が文意に合う。\n→ 空所には「複数名詞を修飾する形容詞」が必要です。\n\n■ 選択肢の確認\n(A) much … 形容詞（不可算名詞用）「多くの」 ×\n(B) enough … 形容詞「十分な」 ○\n(C) every … 形容詞（単数名詞用）「すべての」 ×\n(D) almost … 副詞「ほとんど」 ×\n\n■ 完成文\nThe store manager was concerned that his store did not have enough products to meet customer demand.\n（店長は、自分の店に顧客需要を満たすだけの十分な商品がないことを心配していた。）\n\n■ 解き方のポイント\nmuch は不可算名詞用。enough は可算・不可算どちらにも使える。","words":[{"w":"concerned","p":"形容詞","m":"心配して"},{"w":"enough","p":"形容詞","m":"十分な"},{"w":"products","p":"名詞","m":"商品"},{"w":"meet demand","p":"熟語","m":"需要を満たす"}]},{"id":761,"category":"文法模試 セット8（OCR素案）","question":"Under a sublet agreement, the original tenant is still responsible for complying with the ______ in the lease.","A":"provide","B":"provided","C":"provider","D":"provisions","answer":"D","answer_word":"provisions","explanation":"■ 文の骨格\nUnder a sublet agreement, the original tenant is still responsible for complying with the ______ in the lease.\n\n■ 空所に入るもの\ncomply with の目的語で、the に続く名詞が必要。\n→ 空所には「前置詞 the の後ろに置く複数名詞」が必要です。\n\n■ 選択肢の確認\n(A) provide … 動詞（原形）「提供する」 ×\n(B) provided … 動詞の過去形・過去分詞「提供された」 ×\n(C) provider … 名詞（人）「提供者」 ×\n(D) provisions … 名詞（複数形）「条項、規定」 ○\n\n■ 完成文\nUnder a sublet agreement, the original tenant is still responsible for complying with the provisions in the lease.\n（転貸契約のもとでも、元の借主は賃貸借契約の条項を順守する責任を負い続ける。）\n\n■ 解き方のポイント\nprovisions＝「（契約の）条項」。provider（人）とは意味が異なる。","words":[{"w":"sublet agreement","p":"名詞","m":"転貸契約"},{"w":"tenant","p":"名詞","m":"借主"},{"w":"complying with","p":"熟語","m":"〜を順守すること"},{"w":"provisions","p":"名詞","m":"条項"},{"w":"lease","p":"名詞","m":"賃貸借契約"}]},{"id":762,"category":"文法模試 セット8（OCR素案）","question":"Although Andrea Martin started her career as a fiction writer only three years ago, she has ______ published nearly 20 works.","A":"after","B":"until","C":"already","D":"yet","answer":"C","answer_word":"already","explanation":"■ 文の骨格\nAlthough Andrea Martin started her career as a fiction writer only three years ago, she has ______ published nearly 20 works.\n\n■ 空所に入るもの\nhas と過去分詞 published の間で、完了形を強める副詞が必要。\n→ 空所には「現在完了形と呼応する副詞」が必要です。\n\n■ 選択肢の確認\n(A) after … 前置詞・接続詞「〜のあとに」 ×\n(B) until … 前置詞・接続詞「〜まで」 ×\n(C) already … 副詞「すでに」 ○\n(D) yet … 副詞「まだ（否定・疑問で）」 ×\n\n■ 完成文\nAlthough Andrea Martin started her career as a fiction writer only three years ago, she has already published nearly 20 works.\n（Andrea Martin は3年前に小説家としてのキャリアを始めたばかりだが、すでに20近い作品を発表している。）\n\n■ 解き方のポイント\nalready は肯定文、yet は否定文・疑問文で使う。位置は has と過去分詞の間。","words":[{"w":"career","p":"名詞","m":"キャリア"},{"w":"fiction writer","p":"名詞","m":"小説家"},{"w":"already","p":"副詞","m":"すでに"},{"w":"published","p":"動詞（過去分詞）","m":"発表した"}]},{"id":763,"category":"文法模試 セット8（OCR素案）","question":"The artist's most notable ______ was being chosen to design the stained glass windows in the Westhaven chapel.","A":"achieve","B":"achiever","C":"achieving","D":"achievement","answer":"D","answer_word":"achievement","explanation":"■ 文の骨格\nThe artist's most notable ______ was being chosen to design the stained glass windows in the Westhaven chapel.\n\n■ 空所に入るもの\n所有格と最上級 most notable の後ろで、述語動詞 was の主語となる名詞が必要。\n→ 空所には「文の主語になる名詞」が必要です。\n\n■ 選択肢の確認
